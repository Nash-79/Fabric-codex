name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (self-heals lockfile drift)
        id: install
        run: |
          if npm ci --no-audit --no-fund; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::package-lock.json is out of sync with package.json — regenerating it"
            rm -rf node_modules
            npm install --no-audit --no-fund
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit regenerated lockfile back to main
        if: steps.install.outputs.repaired == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged after regeneration; nothing to commit."
            exit 0
          fi
          git commit -m "chore(ci): sync package-lock.json with package.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main || echo "::warning::Could not push lockfile fix (branch moved on); the next run will repair it."
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run validate:diagrams
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify Supabase schema
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run verify:schema
