name: Poll feeds

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      watchers:
        description: "Poll website watchers"
        type: boolean
        default: true
      roadmap:
        description: "Poll Fabric roadmap"
        type: boolean
        default: true

jobs:
  poll:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Poll Fabric Codex feeds
        env:
          FABRIC_ATLAS_BASE_URL: ${{ secrets.FABRIC_ATLAS_BASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          WATCHERS: ${{ github.event_name != 'workflow_dispatch' || inputs.watchers }}
          ROADMAP: ${{ github.event_name != 'workflow_dispatch' || inputs.roadmap }}
        run: |
          if [ -z "$FABRIC_ATLAS_BASE_URL" ]; then
            echo "Error: FABRIC_ATLAS_BASE_URL secret is not set. Please ensure the secret is configured."
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Error: SUPABASE_PUBLISHABLE_KEY secret is not set. Please ensure the secret is configured."
            exit 1
          fi
          curl --fail-with-body \
            -X POST "$FABRIC_ATLAS_BASE_URL/api/public/hooks/poll-feeds" \
            -H "content-type: application/json" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -d "{\"watchers\":$WATCHERS,\"roadmap\":$ROADMAP}"
