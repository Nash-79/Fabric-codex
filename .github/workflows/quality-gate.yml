name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: backend style and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Black
        working-directory: backend
        run: python -m black --check .

      - name: Pytest
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  repository-sanity:
    name: repository sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Supabase migration static checks
        run: python scripts/check_supabase_migrations.py

      - name: Model docs sync
        run: python scripts/check_model_docs_sync.py --base-ref origin/main
