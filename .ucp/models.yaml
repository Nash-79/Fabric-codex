# UCP Model Registry — capability tiers, not model names.
# Agents declare `x-ucp-tier:` in .claude/agents/*.md and .github/chatmodes/*.chatmode.md
# frontmatter; this file resolves tiers to models. Candidates are ORDERED by preference;
# first AVAILABLE wins (scripts/sync_models.py probes provider APIs). Aliases like `opus`
# auto-track releases, so most model-release updates require NO edit here.
#
# Fabric Atlas today is Claude-only (Claude Code + Codex agents, no LangGraph orchestrator
# in production). The openai/google/local candidate lists exist for the optional
# langgraph/ reference orchestrator (see langgraph/README.md) and CI-adjacent tooling only —
# they are not wired into anything the app serves.
version: 2
updated: "2026-07-26"

tiers:
  reasoning: # deep architecture, ambiguous/expert grounded Q&A, complex trade-offs
    anthropic: ["opus"] # Claude Code alias -> always latest Opus
    anthropic_api: ["claude-opus-4-5", "claude-opus-4-1"]
    openrouter: ["anthropic/claude-3.7-sonnet", "deepseek/deepseek-r1", "openai/o3-mini", "openai/gpt-4o"]
    openai: ["gpt-5.2", "gpt-5.1", "o4"]
    google: ["gemini-2.5-pro"]
    local: ["deepseek-v4", "llama-3.3-70b", "deepseek-r1:14b", "llama3.3"]

  code: # implementation, pipelines, multi-file edits, refactors
    anthropic: ["sonnet"]
    anthropic_api: ["claude-sonnet-4-6", "claude-sonnet-4-5"]
    openrouter: ["anthropic/claude-3.7-sonnet", "qwen/qwen-2.5-coder-32b-instruct", "deepseek/deepseek-chat"]
    openai: ["gpt-5.2-codex", "gpt-5-codex", "gpt-4.1"]
    google: ["gemini-2.5-pro"]
    local: ["qwen2.5-coder", "deepseek-coder-v2", "qwen2.5-coder:14b"]

  standard: # documentation, review, analysis, structured output, curation
    anthropic: ["sonnet"]
    anthropic_api: ["claude-sonnet-4-6", "claude-sonnet-4-5"]
    openrouter: ["anthropic/claude-3.5-haiku", "openai/gpt-4o-mini", "meta-llama/llama-3.3-70b-instruct"]
    openai: ["gpt-4.1", "gpt-5-mini"]
    google: ["gemini-2.5-flash"]
    local: ["llama-3.3-70b", "llama3.2", "mistral"]

  fast: # intent triage, lookups, quick Q&A
    anthropic: ["haiku"]
    anthropic_api: ["claude-haiku-4-5"]
    openrouter: ["openai/gpt-4o-mini", "google/gemini-2.0-flash-001", "meta-llama/llama-3.1-8b-instruct"]
    openai: ["gpt-5-mini", "gpt-4.1-mini"]
    google: ["gemini-2.5-flash"]
    local: ["phi-4", "gemma-2-9b", "phi4", "llama3.2:3b"]

  diagram: # original SVG/Mermaid diagram authoring: spatial reasoning + creativity
    # Diagram quality tracks reasoning capability, not a special model class, but
    # diagram-author.md pins `sonnet` today for cost — kept here for future promotion.
    anthropic: ["sonnet"]
    anthropic_api: ["claude-sonnet-4-6", "claude-sonnet-4-5"]
    openrouter: ["anthropic/claude-3.7-sonnet", "anthropic/claude-3.5-sonnet", "openai/gpt-4o"]
    openai: ["gpt-5.2"]
    google: ["gemini-2.5-pro"]
    local: ["deepseek-v4", "llama-3.3-70b"]

# Task -> tier mapping (declarative router logic). Extends the upstream UCP kit's task set
# with this repo's actual agent responsibilities.
tasks:
  intent_validation: fast
  solution_architecture: reasoning
  fabric_advisory: reasoning
  diagram_authoring: diagram
  content_orchestration: standard
  knowledge_curation: standard
  blog_authoring: standard
  learning_authoring: standard
  validation_review: standard
  migration_validation: standard
  coverage_audit: standard
  source_drift_analysis: standard
  feedback_triage: standard
  docs_authoring: standard
  code_review: standard
  dev_intelligence: standard
  debugging: reasoning
  security_review: reasoning

# Per-agent tier assignment mirrors each agent's CURRENT model: field, so sync_models.py
# is a no-op normalization pass, not a behavior change, the first time it runs.
agents:
  solution-architect: reasoning # model: opus
  fabric-advisor: reasoning # model: opus
  diagram-author: diagram # model: sonnet
  blog-author: standard
  content-orchestrator: standard
  coverage-auditor: standard
  dev-intelligence: standard
  docs-author: standard
  feedback-triage: standard
  knowledge-curator: standard
  learning-author: standard
  migration-validator: standard
  source-drift-analyst: standard
  validation-reviewer: standard
  code-reviewer: standard

# Per-tool resolution strategy
tools:
  claude_code:
    strategy: alias # write `opus|sonnet|haiku` into .claude/agents frontmatter
  copilot_chatmodes:
    strategy:
      pin_or_auto # sync script pins from `copilot_display_names`;
      # if a candidate is unavailable on your plan, falls to Auto
    copilot_display_names: # must match your Copilot model dropdown EXACTLY
      reasoning: "Claude Opus 4.5"
      code: "Claude Sonnet 4.5"
      standard: "Claude Sonnet 4.5"
      fast: "GPT-5 mini"
      diagram: "Claude Sonnet 4.5"
      fallback: "Auto"
  # Deliberately no `codex_cli` entry: ~/.codex/config.toml is the user's personal,
  # cross-project preference, not something this repo's sync script should overwrite.
  langgraph:
    strategy: runtime # langgraph/model_resolver.py probes availability + walks fallbacks
    provider_order: ["openrouter", "anthropic_api", "openai", "google", "local"]
