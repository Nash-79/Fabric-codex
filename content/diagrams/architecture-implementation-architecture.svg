<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="architecture-implementation-architecture-title architecture-implementation-architecture-desc" data-diagram-id="architecture-implementation-architecture">
  <title id="architecture-implementation-architecture-title">Implementing a Fabric Data Architecture — Thin Slice to Operations</title>
  <desc id="architecture-implementation-architecture-desc">A three-stage implementation architecture. An owned source and service boundary scopes a thin delivery slice. Fabric workloads then ingest, transform, and serve that slice over shared OneLake data. Governance, operational evidence, recovery, and acceptance complete the path before the pattern is scaled.</desc>
  <defs><linearGradient id="impl-head" x1="0" x2="1"><stop stop-color="#142D4C"/><stop offset="1" stop-color="#0B6B68"/></linearGradient><filter id="impl-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102A43" flood-opacity=".14"/></filter><marker id="impl-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#17877D"/></marker><marker id="impl-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2D66C3"/></marker></defs>
  <rect width="1180" height="980" fill="#F6F9FC"/><rect width="1180" height="104" fill="url(#impl-head)"/>
  <text x="44" y="45" fill="#FFFFFF" font-size="28" font-weight="700">From architecture intent to an operable thin slice</text><text x="44" y="74" fill="#CDEDE9" font-size="14">Contract first · one vertical delivery path · acceptance evidence before repetition</text>
  <g transform="translate(938 22)"><rect width="198" height="58" rx="12" fill="#FFFFFF" opacity=".12"/><text x="18" y="24" fill="#86E0D8" font-size="11" font-weight="700">DONE MEANS</text><text x="18" y="44" fill="#FFFFFF" font-size="12">Consumed + recoverable</text></g>
  <text x="42" y="137" fill="#586C7D" font-size="11" font-weight="700" letter-spacing="1.5">DELIVERY BLUEPRINT · THREE CONTROLLED BOUNDARIES</text>
  <path d="M312 275H360" fill="none" stroke="#17877D" stroke-width="4" marker-end="url(#impl-arrow)"/><text x="336" y="258" text-anchor="middle" fill="#45606A" font-size="10" font-weight="700">AUTHORIZES</text>
  <path d="M796 275H844" fill="none" stroke="#17877D" stroke-width="4" marker-end="url(#impl-arrow)"/><text x="820" y="258" text-anchor="middle" fill="#45606A" font-size="10" font-weight="700">PUBLISHES</text>
  <g data-node-id="step-1" role="group" filter="url(#impl-shadow)" tabindex="0" aria-label="Owned implementation boundary"><title data-node-tooltip="true">Owned implementation boundary — Name the owner, source contract, output contract, identity boundary, and recovery objective before provisioning the slice.</title><rect x="42" y="160" width="270" height="286" rx="18" fill="#F6F1FD" stroke="#7359B7" stroke-width="2.5"/><rect x="62" y="180" width="230" height="44" rx="11" fill="#7359B7"/><path d="M78 211c3-12 27-12 30 0M93 190a7 7 0 1 1 0 14 7 7 0 0 1 0-14" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="122" y="199" fill="#EDE8FF" font-size="10" font-weight="700">BOUNDARY 01</text><text x="122" y="216" fill="#FFFFFF" font-size="13" font-weight="700">OWN THE CONTRACT</text><text x="62" y="257" fill="#3E3172" font-size="18" font-weight="700">What must be true first?</text><g fill="#FFFFFF" stroke="#C6B9E2"><rect x="62" y="278" width="230" height="34" rx="8"/><rect x="62" y="320" width="230" height="34" rx="8"/><rect x="62" y="362" width="230" height="34" rx="8"/></g><g fill="#493E6B" font-size="11"><text x="78" y="300">Owner · source · output contract</text><text x="78" y="342">Identity and environment boundary</text><text x="78" y="384">Recovery objective + proof signal</text></g><rect x="62" y="408" width="174" height="22" rx="11" fill="#E9E0F8"/><text x="149" y="423" text-anchor="middle" fill="#5B438F" font-size="10" font-weight="700">PATTERN · NOT PROVISIONING</text></g>
  <g data-node-id="step-2" role="group" filter="url(#impl-shadow)" tabindex="0" aria-label="Unified Fabric delivery slice"><title data-node-tooltip="true">Unified Fabric delivery slice — Use role-oriented Fabric workloads for ingestion, transformation, serving, and BI while keeping the slice inside one shared environment.</title><rect x="360" y="160" width="436" height="286" rx="18" fill="#EEF6FF" stroke="#2D66C3" stroke-width="2.5"/><text x="382" y="190" fill="#244F99" font-size="10" font-weight="700">BOUNDARY 02 · ONE VERTICAL PATH</text><text x="382" y="219" fill="#172B4D" font-size="19" font-weight="700">Unified Fabric delivery slice</text><text x="382" y="244" fill="#4A6073" font-size="12">Choose engines by role; keep the data path shared.</text><g transform="translate(382 271)"><g fill="#FFFFFF" stroke="#9EBBE6"><rect width="76" height="80" rx="12"/><rect x="96" width="76" height="80" rx="12"/><rect x="192" width="76" height="80" rx="12"/><rect x="288" width="76" height="80" rx="12"/></g><g fill="#2D66C3"><path d="M20 21h36v9H20zm0 15h36v9H20z"/><path d="M122 18l20 15-20 15z"/><path d="M214 22h34v28h-34zM220 28h22v4h-22zm0 8h22v4h-22z"/><path d="M312 49V24h9v25zm15 0V16h9v33zm15 0V32h9v17z"/></g><g fill="#244F99" font-size="10" font-weight="700" text-anchor="middle"><text x="38" y="68">INGEST</text><text x="134" y="68">TRANSFORM</text><text x="230" y="68">SERVE</text><text x="326" y="68">CONSUME</text></g><path d="M76 40h20M172 40h20M268 40h20" stroke="#2D66C3" stroke-width="2" marker-end="url(#impl-blue)"/></g><rect x="382" y="374" width="392" height="51" rx="10" fill="#DDEBFC"/><text x="400" y="395" fill="#244F99" font-size="10" font-weight="700">SHARED ENVIRONMENT</text><text x="400" y="414" fill="#415C78" font-size="11">One identity context · deployable artifacts · common data placement</text><circle cx="766" cy="187" r="11" fill="#DDF3EE"/><text x="766" y="191" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <g data-node-id="step-3" role="group" filter="url(#impl-shadow)" tabindex="0" aria-label="Governed OneLake outcome"><title data-node-tooltip="true">Governed OneLake outcome — Complete the slice with shared Delta data, inherited governance, operational signals, and a tested recovery path.</title><rect x="844" y="160" width="294" height="286" rx="18" fill="#EAF8F4" stroke="#17877D" stroke-width="2.5"/><text x="866" y="190" fill="#08766C" font-size="10" font-weight="700">BOUNDARY 03 · ACCEPTED OUTCOME</text><text x="866" y="219" fill="#173F3D" font-size="18" font-weight="700">Governed OneLake product</text><g transform="translate(866 242)"><ellipse cx="36" cy="12" rx="34" ry="11" fill="#17877D"/><path d="M2 12v60c0 7 15 12 34 12s34-5 34-12V12" fill="#C9F0E8" stroke="#17877D" stroke-width="2"/><path d="M2 32c0 7 15 12 34 12s34-5 34-12M2 52c0 7 15 12 34 12s34-5 34-12" fill="none" stroke="#17877D" stroke-width="2"/></g><g transform="translate(960 245)" fill="#FFFFFF" stroke="#83C9BA"><rect width="154" height="30" rx="8"/><rect y="39" width="154" height="30" rx="8"/><rect y="78" width="154" height="30" rx="8"/><rect y="117" width="154" height="30" rx="8"/></g><g fill="#315D57" font-size="11"><text x="976" y="265">Delta data shared</text><text x="976" y="304">Labels + lineage inherited</text><text x="976" y="343">Freshness + CU observed</text><text x="976" y="382">Recovery path exercised</text></g><rect x="866" y="408" width="248" height="22" rx="11" fill="#D7F1EB"/><text x="990" y="423" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">ACCEPTANCE EVIDENCE, NOT A DEMO</text><circle cx="1108" cy="187" r="11" fill="#DDF3EE"/><text x="1108" y="191" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <path d="M991 446V500H177V446" fill="none" stroke="#7359B7" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#impl-blue)"/><text x="584" y="492" text-anchor="middle" fill="#5B438F" font-size="11" font-weight="700">FEEDBACK · acceptance findings revise ownership, contracts, identity, and recovery expectations</text>
  <rect x="42" y="530" width="1096" height="350" rx="20" fill="#FFFFFF" stroke="#C8D7E4"/>
  <text x="64" y="562" fill="#586C7D" font-size="11" font-weight="700" letter-spacing="1.4">IMPLEMENTATION DETAIL · WHAT THE BLUEPRINT MUST PROVE</text>
  <g transform="translate(64 587)"><rect width="326" height="198" rx="16" fill="#F3F0FB" stroke="#C3B8DF"/><text x="20" y="29" fill="#5B438F" font-size="11" font-weight="700">CONTRACT CHECK</text><path d="M22 55h44M22 82h44M22 109h44" stroke="#7359B7" stroke-width="3"/><g fill="#3F4960" font-size="12"><text x="82" y="59">Inputs and output schema are versioned</text><text x="82" y="86">Service identity has least privilege</text><text x="82" y="113">RTO/RPO is testable for this slice</text></g><rect x="20" y="137" width="286" height="42" rx="10" fill="#FFF3E8"/><text x="34" y="155" fill="#984411" font-size="10" font-weight="700">BLOCKER</text><text x="34" y="171" fill="#62402C" font-size="11">No named owner means no production hand-off.</text></g>
  <g transform="translate(427 587)"><rect width="326" height="198" rx="16" fill="#EEF4FD" stroke="#A5BDE1"/><text x="20" y="29" fill="#244F99" font-size="11" font-weight="700">VERTICAL-SLICE PROOF</text><path d="M24 58h260" stroke="#9DB7DF" stroke-width="6" stroke-linecap="round"/><g fill="#2D66C3"><circle cx="24" cy="58" r="9"/><circle cx="111" cy="58" r="9"/><circle cx="198" cy="58" r="9"/><circle cx="284" cy="58" r="9"/></g><g fill="#465D78" font-size="10" text-anchor="middle"><text x="24" y="83">SOURCE</text><text x="111" y="83">DATA</text><text x="198" y="83">MODEL</text><text x="284" y="83">USER</text></g><text x="20" y="113" fill="#3F5267" font-size="12">Deploy, secure, monitor, and recover the same path.</text><rect x="20" y="137" width="286" height="42" rx="10" fill="#E2ECFA"/><text x="34" y="155" fill="#244F99" font-size="10" font-weight="700">EXIT SIGNAL</text><text x="34" y="171" fill="#415C78" font-size="11">A named consumer uses the governed output.</text></g>
  <g transform="translate(790 587)"><rect width="326" height="198" rx="16" fill="#EDF8F3" stroke="#8BC9B8"/><text x="20" y="29" fill="#08766C" font-size="11" font-weight="700">OPERATIONS ACCEPTANCE</text><g fill="#FFFFFF" stroke="#17877D" stroke-width="2"><circle cx="29" cy="57" r="9"/><circle cx="29" cy="86" r="9"/><circle cx="29" cy="115" r="9"/></g><g stroke="#17877D" stroke-width="2" fill="none"><path d="M25 57l3 3 6-7"/><path d="M25 86l3 3 6-7"/><path d="M25 115l3 3 6-7"/></g><g fill="#315D57" font-size="12"><text x="49" y="61">Freshness and quality alert reaches an owner</text><text x="49" y="90">Rollback or replay is exercised</text><text x="49" y="119">Capacity behavior is visible under load</text></g><rect x="20" y="137" width="286" height="42" rx="10" fill="#D9F1EB"/><text x="34" y="155" fill="#08766C" font-size="10" font-weight="700">REPEAT ONLY AFTER</text><text x="34" y="171" fill="#315D57" font-size="11">Support ownership and recovery are accepted.</text></g>
  <rect x="42" y="902" width="1096" height="46" rx="13" fill="#142D4C"/><text x="66" y="930" fill="#FFFFFF" font-size="13"><tspan fill="#83E0D7" font-weight="700">WHAT TO WATCH · </tspan>Green pipelines without consumers, inherited access that is never tested, and recovery plans that exist only on paper.</text>
  <text x="1138" y="968" text-anchor="end" fill="#687B8C" font-size="10">Fabric Atlas original · product-neutral vector language</text>
</svg>
