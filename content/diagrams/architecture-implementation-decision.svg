<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="architecture-implementation-decision-title architecture-implementation-decision-desc" data-diagram-id="architecture-implementation-decision">
  <title id="architecture-implementation-decision-title">Fabric Architecture Implementation — Readiness and Scale Gates</title>
  <desc id="architecture-implementation-decision-desc">A three-gate decision path. First confirm identity, ownership, and environments are ready. If they are not, stop and establish the delivery foundation. If they are, prove one end-to-end slice. Only a slice with quality, monitoring, rollback, replay, and support evidence advances to repeatable scale.</desc>
  <defs><linearGradient id="gate-head" x1="0" x2="1"><stop stop-color="#332B61"/><stop offset="1" stop-color="#146A69"/></linearGradient><filter id="gate-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102A43" flood-opacity=".14"/></filter><marker id="gate-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#16877D"/></marker><marker id="gate-warn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#C35D1A"/></marker><marker id="gate-loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#6D5BB5"/></marker></defs>
  <rect width="1180" height="980" fill="#F7FAFC"/><rect width="1180" height="104" fill="url(#gate-head)"/><text x="44" y="45" fill="#FFFFFF" font-size="28" font-weight="700">Readiness and scale gates</text><text x="44" y="74" fill="#D8D3F4" font-size="14">Do not multiply the pattern until identity, value, recovery, and support are observable</text><g transform="translate(930 23)"><rect width="206" height="56" rx="12" fill="#FFFFFF" opacity=".12"/><text x="18" y="23" fill="#8DE4DB" font-size="11" font-weight="700">RULE</text><text x="18" y="43" fill="#FFFFFF" font-size="12">Evidence opens the next gate</text></g>
  <text x="42" y="136" fill="#596C7C" font-size="11" font-weight="700" letter-spacing="1.5">STAGE-GATE DECISION · READ LEFT TO RIGHT</text>
  <path d="M366 294H405" stroke="#16877D" stroke-width="4" marker-end="url(#gate-arrow)"/><rect x="362" y="262" width="95" height="22" rx="11" fill="#DDF2ED"/><text x="409" y="277" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">YES · AUTHORIZE</text>
  <path d="M775 294H814" stroke="#16877D" stroke-width="4" marker-end="url(#gate-arrow)"/><rect x="766" y="262" width="121" height="22" rx="11" fill="#DDF2ED"/><text x="826" y="277" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">PROVEN · ACCEPT</text>
  <g data-node-id="step-1" role="group" filter="url(#gate-shadow)" tabindex="0" aria-label="Are foundations ready?"><title data-node-tooltip="true">Are foundations ready? — Confirm ownership, identity, environments, contracts, and recovery expectations before building the vertical slice.</title><rect x="42" y="162" width="324" height="300" rx="20" fill="#F4F0FC" stroke="#6D5BB5" stroke-width="2.5"/><rect x="62" y="182" width="102" height="25" rx="12" fill="#6D5BB5"/><text x="113" y="199" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">GATE 01 · READY?</text><text x="62" y="240" fill="#362C69" font-size="19" font-weight="700">Are foundations ready?</text><text x="62" y="264" fill="#544D70" font-size="12">All five must have an accountable answer.</text><g fill="#FFFFFF" stroke="#C6BBE1"><rect x="62" y="285" width="284" height="31" rx="8"/><rect x="62" y="323" width="284" height="31" rx="8"/><rect x="62" y="361" width="284" height="31" rx="8"/><rect x="62" y="399" width="284" height="31" rx="8"/></g><g fill="#493F69" font-size="11"><text x="78" y="305">Owner + source/output contracts</text><text x="78" y="343">Identity + least-privilege boundary</text><text x="78" y="381">Dev/test/prod deployment route</text><text x="78" y="419">Recovery objective + accountable support</text></g></g>
  <g data-node-id="step-2" role="group" filter="url(#gate-shadow)" tabindex="0" aria-label="Can one slice prove value?"><title data-node-tooltip="true">Can one slice prove value? — Deliver one source-to-consumer path that proves the real workload, data, security, deployment, and operating hand-offs.</title><rect x="405" y="162" width="370" height="300" rx="20" fill="#EEF5FE" stroke="#2D66C3" stroke-width="2.5"/><rect x="425" y="182" width="114" height="25" rx="12" fill="#2D66C3"/><text x="482" y="199" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">GATE 02 · PROVE</text><text x="425" y="240" fill="#1F4C8F" font-size="19" font-weight="700">Can one slice prove value?</text><text x="425" y="264" fill="#465D78" font-size="12">The proof is a complete path—not component demos.</text><g transform="translate(425 293)"><g fill="#FFFFFF" stroke="#9EB9E3"><rect width="64" height="56" rx="10"/><rect x="80" width="64" height="56" rx="10"/><rect x="160" width="64" height="56" rx="10"/><rect x="240" width="84" height="56" rx="10"/></g><path d="M64 28h16M144 28h16M224 28h16" stroke="#2D66C3" stroke-width="2"/><g fill="#244F99" font-size="9" font-weight="700" text-anchor="middle"><text x="32" y="25">REAL</text><text x="32" y="39">SOURCE</text><text x="112" y="32">DATA</text><text x="192" y="32">MODEL</text><text x="282" y="25">NAMED</text><text x="282" y="39">CONSUMER</text></g></g><g fill="#405A75" font-size="11"><text x="425" y="379">✓ Security behaves as designed</text><text x="425" y="401">✓ Deployment and rollback are exercised</text><text x="425" y="423">✓ Quality/freshness failure reaches an owner</text></g><circle cx="747" cy="190" r="11" fill="#DDF3EE"/><text x="747" y="194" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <g data-node-id="step-3" role="group" filter="url(#gate-shadow)" tabindex="0" aria-label="Scale after operational acceptance"><title data-node-tooltip="true">Scale after operational acceptance — Repeat the pattern only after monitoring, quality, replay, rollback, capacity, and support ownership are proven.</title><rect x="814" y="162" width="324" height="300" rx="20" fill="#ECF8F3" stroke="#16877D" stroke-width="2.5"/><rect x="834" y="182" width="127" height="25" rx="12" fill="#16877D"/><text x="897" y="199" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">GATE 03 · ACCEPT</text><text x="834" y="240" fill="#0D4D48" font-size="18" font-weight="700">Scale only after acceptance</text><g transform="translate(834 270)"><rect width="284" height="64" rx="12" fill="#DDF3ED"/><circle cx="30" cy="32" r="17" fill="#16877D"/><path d="M21 32l6 6 12-15" fill="none" stroke="#FFFFFF" stroke-width="3"/><text x="58" y="25" fill="#08766C" font-size="10" font-weight="700">ACCEPTED</text><text x="58" y="44" fill="#315D57" font-size="11">Repeat the tested pattern deliberately</text><rect y="76" width="284" height="64" rx="12" fill="#FFF0E4"/><circle cx="30" cy="108" r="17" fill="#C35D1A"/><text x="30" y="114" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">!</text><text x="58" y="101" fill="#984411" font-size="10" font-weight="700">BLOCKED / GAP</text><text x="58" y="120" fill="#62402C" font-size="11">Harden and retest; do not multiply risk</text></g><rect x="834" y="425" width="284" height="21" rx="10" fill="#D5EFE8"/><text x="976" y="440" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">SUPPORT OWNER SIGNS THE HAND-OFF</text></g>
  <path d="M204 462V514H976V462" fill="none" stroke="#C35D1A" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gate-warn)"/><text x="590" y="505" text-anchor="middle" fill="#984411" font-size="10" font-weight="700">NO FOUNDATIONS · SCALING REMAINS BLOCKED</text>
  <path d="M976 462V548H590V462" fill="none" stroke="#6D5BB5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#gate-loop)"/><text x="783" y="540" text-anchor="middle" fill="#58469B" font-size="10" font-weight="700">ACCEPTANCE GAP · HARDEN + RETEST</text>
  <rect x="42" y="582" width="1096" height="288" rx="20" fill="#FFFFFF" stroke="#C8D7E4"/><text x="64" y="613" fill="#596C7C" font-size="11" font-weight="700" letter-spacing="1.4">ACCEPTANCE SCORECARD · EVIDENCE THAT OPENS GATE 03</text>
  <g transform="translate(64 638)"><rect width="246" height="187" rx="15" fill="#F4F0FC" stroke="#C4B9DF"/><text x="18" y="27" fill="#58469B" font-size="11" font-weight="700">FOUNDATIONS</text><g fill="#493F69" font-size="11"><text x="18" y="57">□ Named owner and support rota</text><text x="18" y="82">□ Service identities are separated</text><text x="18" y="107">□ Environment promotion is tested</text><text x="18" y="132">□ Contracts and change policy exist</text></g><rect x="18" y="151" width="210" height="21" rx="10" fill="#E6DFF5"/><text x="123" y="166" text-anchor="middle" fill="#58469B" font-size="10" font-weight="700">MISSING ITEM = STOP</text></g>
  <g transform="translate(333 638)"><rect width="246" height="187" rx="15" fill="#EEF4FD" stroke="#A8BFE2"/><text x="18" y="27" fill="#244F99" font-size="11" font-weight="700">VALUE</text><g fill="#405A75" font-size="11"><text x="18" y="57">□ Named consumer uses the output</text><text x="18" y="82">□ Quality SLO is observed</text><text x="18" y="107">□ Access behavior is verified</text><text x="18" y="132">□ Cost signal is understood</text></g><rect x="18" y="151" width="210" height="21" rx="10" fill="#DDE8F8"/><text x="123" y="166" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">DEMO ≠ ADOPTION</text></g>
  <g transform="translate(602 638)"><rect width="246" height="187" rx="15" fill="#EDF8F3" stroke="#91CBBB"/><text x="18" y="27" fill="#08766C" font-size="11" font-weight="700">OPERATIONS</text><g fill="#315D57" font-size="11"><text x="18" y="57">□ Alert reaches an accountable owner</text><text x="18" y="82">□ Replay or recovery is exercised</text><text x="18" y="107">□ Rollback is rehearsed</text><text x="18" y="132">□ Capacity under load is visible</text></g><rect x="18" y="151" width="210" height="21" rx="10" fill="#D7F0E9"/><text x="123" y="166" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">RUN IT BEFORE REPEAT</text></g>
  <g transform="translate(871 638)"><rect width="245" height="187" rx="15" fill="#FFF3E8" stroke="#E2B48E"/><text x="18" y="27" fill="#984411" font-size="11" font-weight="700">WHAT TO WATCH</text><path d="M20 55c13-14 29-14 42 0-13 14-29 14-42 0Z" fill="none" stroke="#C35D1A" stroke-width="2"/><circle cx="41" cy="55" r="6" fill="#C35D1A"/><g fill="#62402C" font-size="11"><text x="76" y="59">Green pipeline bias</text><text x="18" y="89">Scaling before recovery is tested</text><text x="18" y="114">Shared support with no ownership</text><text x="18" y="139">Capacity assumptions without load</text></g><rect x="18" y="151" width="209" height="21" rx="10" fill="#FFE1C9"/><text x="122" y="166" text-anchor="middle" fill="#984411" font-size="10" font-weight="700">EVIDENCE, NOT CONFIDENCE</text></g>
  <rect x="42" y="897" width="1096" height="48" rx="13" fill="#332B61"/><text x="66" y="926" fill="#FFFFFF" font-size="13"><tspan fill="#9DE9E0" font-weight="700">DECISION PRINCIPLE · </tspan>Authorize one slice, make its failures observable, and treat operational acceptance as the licence to scale.</text><text x="1138" y="968" text-anchor="end" fill="#687B8C" font-size="10">Fabric Atlas original · product-neutral vector language</text>
</svg>
