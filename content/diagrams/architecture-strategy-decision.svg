<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI,Arial,sans-serif"><title>Fabric Data Architecture Strategy</title><desc>Fabric Data Architecture Strategy decision path — Is the workload analytical?, Can data remain in OneLake?, Choose governed Fabric workload boundary. Includes an end-to-end path, worked example, controls, and failure modes.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#063D3B"/><stop offset="1" stop-color="#117865"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2AAC94"/></marker></defs><rect width="1180" height="900" fill="#FAF9F8"/><rect width="1180" height="118" fill="url(#head)"/><text x="52" y="54" fill="white" font-size="28" font-weight="700">Fabric Data Architecture Strategy</text><text x="52" y="84" fill="#CFF3E9" font-size="15">Fabric Data Architecture Strategy decision path — Is the workload analytical?, Can data remain in OneLake?, Choose governed Fabric workload boundary</text><text x="52" y="154" fill="#605E5C" font-size="13" letter-spacing="2">DECISION PATH</text><path d="M 340 240 C 375 240, 395 320, 430 320" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 690 240 C 725 240, 745 240, 780 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/><path d="M 210 170 L 340 240 L 210 310 L 80 240 Z" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="108" cy="198" r="16" fill="#117865"/><text x="108" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text><text x="230" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600"><tspan x="230" dy="0">Is the workload</tspan><tspan x="230" dy="22">analytical?</tspan></text>
<path d="M 560 250 L 690 320 L 560 390 L 430 320 Z" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="458" cy="278" r="16" fill="#117865"/><text x="458" y="283" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text><text x="580" y="302" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600"><tspan x="580" dy="0">Can data remain in</tspan><tspan x="580" dy="22">OneLake?</tspan></text>
<rect x="780" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="808" cy="198" r="16" fill="#117865"/><text x="808" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text><text x="930" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600"><tspan x="930" dy="0">Choose governed Fabric</tspan><tspan x="930" dy="22">workload boundary</tspan></text><rect x="52" y="485" width="1076" height="118" rx="16" fill="#E8F6F1" stroke="#2AAC94" stroke-width="2"/><text x="76" y="515" fill="#117865" font-size="12" font-weight="700" letter-spacing="1.4">WORKED EXAMPLE</text><text x="76" y="547" fill="#063D3B" font-size="15"><tspan x="76" dy="0">Finance delivers daily positions first, proves governance</tspan><tspan x="76" dy="19">and operations, then adds intraday risk on the same owned</tspan><tspan x="76" dy="19">boundary.</tspan></text><rect x="52" y="630" width="516" height="145" rx="16" fill="#EDF8F1" stroke="#6BBF8A"/><text x="78" y="662" fill="#176B3A" font-size="13" font-weight="700" letter-spacing="1.3">IMPLEMENTATION CONTROLS</text><text x="82" y="695" fill="#285943" font-size="14">✓ Named data-product owner</text><text x="82" y="719" fill="#285943" font-size="14">✓ Capacity and recovery objective</text><text x="82" y="743" fill="#285943" font-size="14">✓ Recorded architecture decisions</text><rect x="612" y="630" width="516" height="145" rx="16" fill="#FFF7E6" stroke="#D6A84B"/><text x="638" y="662" fill="#7A4B00" font-size="13" font-weight="700" letter-spacing="1.3">FAILURE MODES</text><text x="640" y="695" fill="#7A4B00" font-size="14">⚠ Platform without a business outcome</text><text x="640" y="719" fill="#7A4B00" font-size="14">⚠ Shared workspace without ownership</text><text x="640" y="743" fill="#7A4B00" font-size="14">⚠ Unmeasured capacity demand</text><rect x="52" y="800" width="1076" height="54" rx="13" fill="#F0F5F3" stroke="#B8D8CE"/><text x="590" y="832" text-anchor="middle" fill="#063D3B" font-size="14">In Atlas: select a choice → inspect evidence → drill into inputs, processing, outputs, example, controls, and risks.</text><text x="1128" y="882" text-anchor="end" fill="#605E5C" font-size="10">Fabric Atlas original · Microsoft Fabric implementation guidance</text></svg>
