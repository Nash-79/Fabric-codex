<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Grounded in capacity claims: smoothing windows, 4 throttling thresholds,
       carryforward/burndown, interactive vs background classification. -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#063D3B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1100" height="56" fill="url(#hdrGrad)"/>
  <text x="28" y="24" font-size="17" font-weight="700" fill="#FFFFFF">Fabric Capacity — Bursting, Smoothing &amp; Throttling</text>
  <text x="28" y="43" font-size="11" fill="#D9F5EE">How CU consumption is spread over time and the four progressive enforcement stages</text>

  <!-- ═══════════════════════════════════════════════
       LEFT COLUMN — CU timeline / smoothing concept
  ════════════════════════════════════════════════ -->
  <text x="28" y="86" font-size="11" letter-spacing="1.2" fill="#8A8886">SMOOTHING WINDOW — CU COST SPREAD OVER TIME (30-second timepoints)</text>

  <!-- Timeline chart background -->
  <rect x="28" y="94" width="490" height="190" rx="8" fill="#F7FAF9" stroke="#C8E8E0"/>

  <!-- Chart axes -->
  <line x1="60" y1="104" x2="60" y2="264" stroke="#8A8886" stroke-width="1"/>
  <line x1="60" y1="264" x2="498" y2="264" stroke="#8A8886" stroke-width="1"/>
  <text x="57" y="108" text-anchor="end" font-size="9" fill="#8A8886">CU</text>
  <text x="500" y="268" font-size="9" fill="#8A8886">time →</text>

  <!-- Capacity baseline (SKU provision) -->
  <line x1="60" y1="200" x2="498" y2="200" stroke="#117865" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="63" y="197" font-size="9" font-weight="600" fill="#117865">SKU provision</text>

  <!-- Burst spike (operation uses more than SKU allows) -->
  <rect x="90" y="142" width="36" height="58" fill="#2AAC94" opacity="0.85" rx="3"/>
  <text x="108" y="136" text-anchor="middle" font-size="9" font-weight="600" fill="#063D3B">burst</text>

  <!-- Smoothed cost (spread forward) — lighter bars -->
  <rect x="136" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="160" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="184" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="208" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="232" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="256" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="280" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="304" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="328" y="192" width="18" height="8" fill="#9AD2C5" rx="2"/>
  <rect x="352" y="192" width="18" height="8" fill="#B8DDD5" rx="2"/>
  <rect x="376" y="192" width="18" height="8" fill="#B8DDD5" rx="2"/>
  <rect x="400" y="192" width="18" height="8" fill="#B8DDD5" rx="2"/>

  <!-- Smoothing bracket annotation -->
  <line x1="136" y1="178" x2="418" y2="178" stroke="#2AAC94" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="277" y="175" text-anchor="middle" font-size="9" fill="#117865">cost spread across future timepoints</text>

  <!-- Interactive: 5–64 min label -->
  <text x="108" y="280" text-anchor="middle" font-size="9" fill="#424242">Interactive ops:</text>
  <text x="108" y="291" text-anchor="middle" font-size="9" fill="#424242">smoothed 5 – 64 min</text>

  <!-- Background: 24-hr label -->
  <text x="350" y="280" text-anchor="middle" font-size="9" fill="#424242">Background ops:</text>
  <text x="350" y="291" text-anchor="middle" font-size="9" fill="#424242">smoothed over 24 h (2,880 timepoints)</text>

  <!-- ═══════════════════════════════════════════════
       RIGHT COLUMN — Four throttling stages
  ════════════════════════════════════════════════ -->
  <text x="545" y="86" font-size="11" letter-spacing="1.2" fill="#8A8886">FOUR THROTTLING STAGES (future-capacity consumed)</text>

  <!-- Stage 0 — green -->
  <rect x="545" y="94" width="520" height="66" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <rect x="545" y="94" width="8" height="66" rx="4" fill="#2AAC94"/>
  <text x="566" y="118" font-size="13" font-weight="700" fill="#063D3B">Stage 0 — No throttling</text>
  <text x="566" y="136" font-size="11" fill="#424242">Future usage &lt; 10 minutes of SKU provision</text>
  <text x="566" y="151" font-size="10" fill="#3F6259">Overage protection window — all operations proceed normally.</text>

  <!-- Stage 1 — amber -->
  <rect x="545" y="170" width="520" height="66" rx="8" fill="#FFF8EC" stroke="#F0C070"/>
  <rect x="545" y="170" width="8" height="66" rx="4" fill="#E8A020"/>
  <text x="566" y="194" font-size="13" font-weight="700" fill="#5C3A00">Stage 1 — Interactive delay</text>
  <text x="566" y="212" font-size="11" fill="#424242">Future usage 10 min → 60 min of SKU provision</text>
  <text x="566" y="227" font-size="10" fill="#7A4A00">New interactive operations incur a 20-second submission delay.</text>

  <!-- Stage 2 — orange-red -->
  <rect x="545" y="246" width="520" height="66" rx="8" fill="#FFF1ED" stroke="#F0A080"/>
  <rect x="545" y="246" width="8" height="66" rx="4" fill="#D45000"/>
  <text x="566" y="270" font-size="13" font-weight="700" fill="#5C1A00">Stage 2 — Interactive rejection</text>
  <text x="566" y="288" font-size="11" fill="#424242">Future usage 60 min → 24 hours of SKU provision</text>
  <text x="566" y="303" font-size="10" fill="#7A2800">Interactive ops rejected (CapacityLimitExceeded). Background may still start.</text>

  <!-- Stage 3 — red -->
  <rect x="545" y="322" width="520" height="66" rx="8" fill="#FDECEA" stroke="#E07070"/>
  <rect x="545" y="322" width="8" height="66" rx="4" fill="#B71C1C"/>
  <text x="566" y="346" font-size="13" font-weight="700" fill="#5C0000">Stage 3 — Full rejection</text>
  <text x="566" y="364" font-size="11" fill="#424242">Future usage &gt; 24 hours of SKU provision</text>
  <text x="566" y="379" font-size="10" fill="#7A0000">All new requests (interactive + background) rejected. In-flight ops complete.</text>

  <!-- Stage progression arrow -->
  <line x1="534" y1="127" x2="534" y2="375" stroke="#8A8886" stroke-width="1.2" marker-end="url(#arrDark)"/>
  <text x="530" y="253" text-anchor="middle" font-size="9" fill="#8A8886" transform="rotate(-90 530 253)">increasing future-capacity consumed →</text>

  <!-- ═══════════════════════════════════════════════
       BOTTOM SECTION — Carryforward / Burndown
  ════════════════════════════════════════════════ -->
  <text x="28" y="318" font-size="11" letter-spacing="1.2" fill="#8A8886">CARRYFORWARD BALANCE &amp; BURNDOWN</text>

  <rect x="28" y="326" width="490" height="160" rx="8" fill="#F7FAF9" stroke="#C8E8E0"/>

  <!-- Chart axes -->
  <line x1="60" y1="336" x2="60" y2="466" stroke="#8A8886" stroke-width="1"/>
  <line x1="60" y1="466" x2="498" y2="466" stroke="#8A8886" stroke-width="1"/>
  <text x="57" y="340" text-anchor="end" font-size="9" fill="#8A8886">CU</text>
  <text x="500" y="470" font-size="9" fill="#8A8886">time →</text>

  <!-- Overage protection ceiling line -->
  <line x1="60" y1="390" x2="498" y2="390" stroke="#2AAC94" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="63" y="387" font-size="9" fill="#117865">10-min overage ceiling</text>

  <!-- Carryforward accumulation -->
  <polyline points="90,466 150,390 200,370 240,355 280,370 320,390 360,410 410,440 460,460 490,466"
            fill="none" stroke="#D45000" stroke-width="2"/>
  <!-- Burndown shading -->
  <polygon points="200,370 240,355 280,370 320,390 360,410 410,440 460,460 490,466 490,466 200,466"
           fill="#FFE4D6" opacity="0.5"/>

  <!-- Throttle zone label -->
  <rect x="165" y="342" width="280" height="18" rx="3" fill="#FFF1ED" stroke="#F0A080"/>
  <text x="305" y="355" text-anchor="middle" font-size="9" fill="#D45000">carryforward exceeds ceiling — throttling active</text>

  <!-- Burndown label -->
  <text x="380" y="455" text-anchor="middle" font-size="9" fill="#117865">idle timepoints burn down balance</text>

  <!-- Key -->
  <rect x="28" y="498" width="490" height="52" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="44" y="514" font-size="10" font-weight="600" fill="#063D3B">Key notes:</text>
  <text x="44" y="530" font-size="10" fill="#424242">  Throttling is per-capacity (not per-tenant). In-flight ops always run to completion.</text>
  <text x="44" y="545" font-size="10" fill="#424242">  Compound throttling: a chained request is throttled at most once per capacity in the chain.</text>

  <!-- Workload exceptions box -->
  <rect x="28" y="560" width="490" height="78" rx="6" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="44" y="577" font-size="10" font-weight="600" fill="#063D3B">Workload-specific exceptions:</text>
  <text x="44" y="594" font-size="10" fill="#424242">  Eventstreams — reduces allocated CUs rather than delaying/rejecting new streams.</text>
  <text x="44" y="609" font-size="10" fill="#424242">  Real-Time Intelligence — skips Stage 1 delay; starts throttling at Stage 2 (60-min).</text>
  <text x="44" y="624" font-size="10" fill="#424242">  Warehouse ops — classified background; benefits from 24-hour smoothing window.</text>

  <!-- SKU quick reference box -->
  <rect x="545" y="402" width="520" height="100" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="561" y="420" font-size="11" font-weight="700" fill="#063D3B">SKU Quick Reference (F SKUs, F2 – F2048)</text>
  <text x="561" y="438" font-size="10" fill="#424242">SKU number = capacity units (e.g. F64 = 64 CU). Each step doubles compute.</text>
  <text x="561" y="454" font-size="10" fill="#424242">Each CU grants 2 Spark vCores × 3 burst multiplier (e.g. F64 = 384 Spark vCores).</text>
  <text x="561" y="470" font-size="10" fill="#424242">F64+ threshold: free-license users can view Power BI content (workspace viewer role).</text>
  <text x="561" y="486" font-size="10" fill="#424242">Autoscale Billing for Spark disables bursting/smoothing — pay-as-you-go mode only.</text>

  <!-- Footnote -->
  <text x="1072" y="668" text-anchor="end" font-size="9" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset.</text>
</svg>
