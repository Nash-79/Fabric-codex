<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="data-factory-ingestion-decision-matrix-title data-factory-ingestion-decision-matrix-desc" data-diagram-id="data-factory-ingestion-decision-matrix">
  <title id="data-factory-ingestion-decision-matrix-title">Choosing an Ingestion Tool: Copy Activity vs Dataflow Gen2 vs Notebook</title>
  <desc id="data-factory-ingestion-decision-matrix-desc">A decision tree that starts by asking what the ingestion scenario needs: raw high-volume movement with controllable parallelism routes to Pipeline Copy Activity; low-code shaping with joins and cleansing before landing routes to Dataflow Gen2; complex procedural logic such as API pagination, streaming, or nested-data handling routes to a Notebook Activity. Each tool node carries its own strength, authoring surface, and orchestration role, plus a watch-out. A second decision, nested under Copy Activity, chooses among Copy job, Copy activity, and Mirroring depending on whether the need is simplified scheduled movement, fully customizable high-throughput movement, or near-real-time database replication. A warning node flags the antipattern of tuning throughput settings without first identifying whether the source, destination, or network is the actual bottleneck.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Decision/internals style — distinct from data-factory-pipelines.svg (architecture flow).
       This is a scoring grid + decision funnel, not a box-and-arrow pipeline diagram.
       Palette: #063D3B #117865 #2AAC94 #25FFD4 #EAF7F2
       Grounds claims: 20d5ea24 (pipeline vs Dataflow Gen2 division of labor + data-movement decision guide),
       1501e6bb (ETL/ELT pattern, notebooks over OneLake for large-scale transform push-down),
       574a1468 (pipelines orchestrate notebooks/Spark job definitions as activities),
       7aa9d980 (Copy activity three parallelism levels), acc52b71 (ITO presets),
       9fdbd961 (degree of copy parallelism), 486e87f0 (tuning without measuring bottleneck = antipattern),
       075528b2 (170+ connectors via gateways), 1c071f06 (dbt jobs no-code setup),
       89141db1 (Airflow code-first alternative), b02ca5cd (Copy activity recommended for
       large-scale one-time migration + high-volume recurring ingestion), 63ea6add (Copy job vs
       Copy activity vs Mirroring three data-movement options). -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="colCopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#117865"/>
      <stop offset="1" stop-color="#0B5E50"/>
    </linearGradient>
    <linearGradient id="colDF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AAC94"/>
      <stop offset="1" stop-color="#1A9E85"/>
    </linearGradient>
    <linearGradient id="colNb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#063D3B"/>
      <stop offset="1" stop-color="#042C2A"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#117865"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="#FFFFFF"/>

  <!-- header -->
  <rect x="0" y="0" width="1100" height="64" fill="url(#hdrGrad)"/>
  <g data-node-id="dataflow-gen2-node" role="group" tabindex="0" aria-label="Dataflow Gen2">
    <title data-node-tooltip="true">Dataflow Gen2 — Low-code Power Query transformation surface — shape data with joins, cleansing, and custom logic before it lands.</title>
    <rect x="24.0" y="1.0" width="480.0" height="43.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="36" y="30" font-size="20" font-weight="650" fill="#FFFFFF">Choosing an Ingestion Method: Copy Activity vs Dataflow Gen2 vs Notebook Activity</text>
  </g>
  <text x="36" y="50" font-size="11" fill="#D9F5EE">Fabric Atlas original diagram · decision guide · capability: data-factory</text>

  <!-- ═══ DECISION FUNNEL ═══ -->
  <text x="36" y="94" font-size="11" letter-spacing="1.4" fill="#8A8886">STEP 1 — WHAT KIND OF PROBLEM IS THIS?</text>

  <g transform="translate(36,102)">
    <rect width="330" height="72" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#063D3B">Orchestration / large-scale movement?</text>
    <text x="165" y="44" text-anchor="middle" font-size="10" fill="#3F6259">Bulk copy, scheduled loads, event-driven</text>
    <text x="165" y="58" text-anchor="middle" font-size="10" fill="#3F6259">ingestion, chaining many steps</text>
  </g>
  <g transform="translate(385,102)">
    <rect width="330" height="72" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#063D3B">Low-code data shaping?</text>
    <text x="165" y="44" text-anchor="middle" font-size="10" fill="#3F6259">Cleansing, standardization, business-user</text>
    <text x="165" y="58" text-anchor="middle" font-size="10" fill="#3F6259">friendly transforms before landing</text>
  </g>
  <g transform="translate(734,102)">
    <rect width="330" height="72" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="165" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#063D3B">Large-scale / code-first transform?</text>
    <text x="165" y="44" text-anchor="middle" font-size="10" fill="#3F6259">Land raw first, push transformation</text>
    <text x="165" y="58" text-anchor="middle" font-size="10" fill="#3F6259">down to Spark or SQL over OneLake</text>
  </g>

  <line x1="201" y1="174" x2="201" y2="206" stroke="#117865" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="550" y1="174" x2="550" y2="206" stroke="#117865" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="899" y1="174" x2="899" y2="206" stroke="#117865" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ═══ THREE COLUMN HEADERS ═══ -->
  <text x="36" y="200" font-size="11" letter-spacing="1.4" fill="#8A8886">STEP 2 — THE THREE INGESTION/TRANSFORM MECHANISMS</text>

  <rect x="36" y="210" width="330" height="46" rx="8" fill="url(#colCopy)"/>
  <g data-node-id="pipeline-copy-activity" role="group" tabindex="0" aria-label="Pipeline Copy Activity">
    <title data-node-tooltip="true">Pipeline Copy Activity — Fully customizable movement with manual control of parallelism — the default for raw, high-volume movement.</title>
    <rect x="99.7" y="217.7" width="202.6" height="30.1" rx="6" fill="transparent" pointer-events="all"/>
    <text x="201" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Pipeline Copy Activity</text>
  </g>

  <rect x="385" y="210" width="330" height="46" rx="8" fill="url(#colDF)"/>
  <text x="550" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Dataflow Gen2</text>

  <rect x="734" y="210" width="330" height="46" rx="8" fill="url(#colNb)"/>
  <g data-node-id="notebook-activity" role="group" tabindex="0" aria-label="Notebook Activity">
    <title data-node-tooltip="true">Notebook Activity — Procedural Spark code for logic no declarative tool expresses well — APIs, streaming, ML, nested data.</title>
    <rect x="818.0" y="217.7" width="162.0" height="30.1" rx="6" fill="transparent" pointer-events="all"/>
    <text x="899" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Notebook Activity</text>
  </g>

  <!-- ═══ SCORING GRID ═══ -->
  <!-- Row labels column -->
  <text x="36" y="292" font-size="11" letter-spacing="1.4" fill="#8A8886">SCORING GRID — RATED AGAINST FIVE INGESTION CRITERIA</text>

  <!-- grid geometry: rows start y=304, each row 84 high, 5 rows -->
  <!-- Row 1: Primary strength -->
  <g font-size="10.5">
    <rect x="36" y="304" width="330" height="84" rx="7" fill="#F7FDF9" stroke="#9AD2C5"/>
    <text x="52" y="324" font-weight="700" fill="#117865">Primary strength</text>
    <text x="52" y="342" fill="#424242">Serverless large-scale movement;</text>
    <text x="52" y="357" fill="#424242">recommended for one-time migrations</text>
    <text x="52" y="372" fill="#424242">and high-volume recurring ingestion.</text>

    <rect x="385" y="304" width="330" height="84" rx="7" fill="#F7FDF9" stroke="#9AD2C5"/>
    <text x="401" y="324" font-weight="700" fill="#117865">Primary strength</text>
    <g data-node-id="scenario-question" role="group" tabindex="0" aria-label="What does the ingestion scenario need?">
    <title data-node-tooltip="true">What does the ingestion scenario need? — The root question: raw movement, low-code shaping, or complex procedural logic.</title>
    <rect x="389.0" y="324.6" width="239.8" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="401" y="342" fill="#424242">Low-code shaping: cleansing and</text>
  </g>
    <text x="401" y="357" fill="#424242">standardizing data up front, when</text>
    <text x="401" y="372" fill="#424242">quality matters before it lands.</text>

    <rect x="734" y="304" width="330" height="84" rx="7" fill="#F7FDF9" stroke="#9AD2C5"/>
    <text x="750" y="324" font-weight="700" fill="#117865">Primary strength</text>
    <text x="750" y="342" fill="#424242">Code-first, large cloud-scale transforms</text>
    <text x="750" y="357" fill="#424242">once raw data has landed in OneLake</text>
    <text x="750" y="372" fill="#424242">(ELT push-down pattern).</text>
  </g>

  <!-- Row 2: Parallelism model -->
  <g font-size="10.5">
    <rect x="36" y="396" width="330" height="84" rx="7" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="52" y="416" font-weight="700" fill="#117865">Parallelism control</text>
    <text x="52" y="434" fill="#424242">Three levers: ForEach fan-out,</text>
    <text x="52" y="449" fill="#424242">Intelligent Throughput Optimization</text>
    <text x="52" y="464" fill="#424242">(Auto/Standard/Balanced/Max/4-256), and</text>
    <text x="52" y="476" fill="#424242">degree-of-parallelism thread cap.</text>

    <rect x="385" y="396" width="330" height="84" rx="7" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="401" y="416" font-weight="700" fill="#117865">Parallelism control</text>
    <text x="401" y="434" fill="#424242">Managed by the Dataflow Gen2 compute</text>
    <text x="401" y="449" fill="#424242">engine, not exposed as manual thread</text>
    <text x="401" y="464" fill="#424242">or throughput tuning knobs to the</text>
    <text x="401" y="476" fill="#424242">author.</text>

    <rect x="734" y="396" width="330" height="84" rx="7" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="750" y="416" font-weight="700" fill="#117865">Parallelism control</text>
    <text x="750" y="434" fill="#424242">Spark-native: driver/executor scale-out,</text>
    <text x="750" y="449" fill="#424242">partitioning, and pool sizing — full</text>
    <text x="750" y="464" fill="#424242">programmatic control over the compute</text>
    <text x="750" y="476" fill="#424242">layer.</text>
  </g>

  <!-- Row 3: Authoring surface -->
  <g font-size="10.5">
    <rect x="36" y="488" width="330" height="84" rx="7" fill="#F7FDF9" stroke="#9AD2C5"/>
    <text x="52" y="508" font-weight="700" fill="#117865">Authoring surface</text>
    <text x="52" y="526" fill="#424242">Low-code visual designer; code-first</text>
    <text x="52" y="541" fill="#424242">alternative via Apache Airflow Python</text>
    <text x="52" y="556" fill="#424242">DAGs for orchestration logic.</text>

    <rect x="385" y="488" width="330" height="84" rx="7" fill="#F7FDF9" stroke="#9AD2C5"/>
    <text x="401" y="508" font-weight="700" fill="#117865">Authoring surface</text>
    <text x="401" y="526" fill="#424242">Power Query, entirely low-code —</text>
    <text x="401" y="541" fill="#424242">business-analyst friendly; no notebook</text>
    <text x="401" y="556" fill="#424242">or SQL scripting required.</text>

    <rect x="734" y="488" width="330" height="84" rx="7" fill="#F7FDF9" stroke="#9AD2C5"/>
    <text x="750" y="508" font-weight="700" fill="#117865">Authoring surface</text>
    <text x="750" y="526" fill="#424242">Code-first (PySpark/Scala/SQL); also</text>
    <text x="750" y="541" fill="#424242">reachable as dbt jobs for no-code SQL</text>
    <text x="750" y="556" fill="#424242">model transforms against the warehouse.</text>
  </g>

  <!-- Row 4: Orchestration role -->
  <g font-size="10.5">
    <rect x="36" y="580" width="330" height="84" rx="7" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="52" y="600" font-weight="700" fill="#117865">Orchestration role</text>
    <text x="52" y="618" fill="#424242">IS the orchestration layer: chains</text>
    <text x="52" y="633" fill="#424242">notebooks, Spark job definitions, and</text>
    <text x="52" y="648" fill="#424242">dataflows together via a pipeline.</text>

    <rect x="385" y="580" width="330" height="84" rx="7" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="401" y="600" font-weight="700" fill="#117865">Orchestration role</text>
    <text x="401" y="618" fill="#424242">A single activity INSIDE a pipeline —</text>
    <text x="401" y="633" fill="#424242">runs as one orchestrated step, does not</text>
    <text x="401" y="648" fill="#424242">itself orchestrate other tasks.</text>

    <rect x="734" y="580" width="330" height="84" rx="7" fill="#FFFFFF" stroke="#E1DFDD"/>
    <text x="750" y="600" font-weight="700" fill="#117865">Orchestration role</text>
    <text x="750" y="618" fill="#424242">Also a single activity inside a pipeline —</text>
    <text x="750" y="633" fill="#424242">pipelines invoke notebooks alongside</text>
    <text x="750" y="648" fill="#424242">Copy, dbt jobs, and stored procs.</text>
  </g>

  <!-- Row 5: Watch-out -->
  <g font-size="10.5">
    <rect x="36" y="672" width="330" height="84" rx="7" fill="#FDF3F2" stroke="#F1B0A8"/>
    <text x="52" y="692" font-weight="700" fill="#C50F1F">Watch-out</text>
    <g data-node-id="bottleneck-warning" role="group" tabindex="0" aria-label="Trap: tuning throughput without finding the bottleneck">
    <title data-node-tooltip="true">Trap: tuning throughput without finding the bottleneck — Raising ITO or parallelism cannot exceed the source, destination, or network ceiling.</title>
    <rect x="40.0" y="692.6" width="288.5" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="52" y="710" fill="#7A2E27">Tuning ITO / parallelism without first</text>
  </g>
    <text x="52" y="725" fill="#7A2E27">measuring the real bottleneck (source</text>
    <text x="52" y="740" fill="#7A2E27">IOPS, network, destination) wastes effort.</text>

    <rect x="385" y="672" width="330" height="84" rx="7" fill="#FDF3F2" stroke="#F1B0A8"/>
    <text x="401" y="692" font-weight="700" fill="#C50F1F">Watch-out</text>
    <text x="401" y="710" fill="#7A2E27">Not built for orchestrating multi-step,</text>
    <text x="401" y="725" fill="#7A2E27">multi-system workflows — pair it with a</text>
    <text x="401" y="740" fill="#7A2E27">pipeline when broader chaining is needed.</text>

    <rect x="734" y="672" width="330" height="84" rx="7" fill="#FDF3F2" stroke="#F1B0A8"/>
    <text x="750" y="692" font-weight="700" fill="#C50F1F">Watch-out</text>
    <text x="750" y="710" fill="#7A2E27">Requires code fluency (PySpark/SQL);</text>
    <text x="750" y="725" fill="#7A2E27">not the low-code path — steeper ramp for</text>
    <text x="750" y="740" fill="#7A2E27">business-analyst authors.</text>
  </g>

  <!-- row divider lines for readability -->
  <line x1="36" y1="392" x2="1064" y2="392" stroke="#F3F2F1" stroke-width="1"/>
  <line x1="36" y1="484" x2="1064" y2="484" stroke="#F3F2F1" stroke-width="1"/>
  <line x1="36" y1="576" x2="1064" y2="576" stroke="#F3F2F1" stroke-width="1"/>
  <line x1="36" y1="668" x2="1064" y2="668" stroke="#F3F2F1" stroke-width="1"/>

  <!-- ═══ FOOTER: DECISION GUIDE + LEGEND ═══ -->
  <g data-node-id="movement-primitive-question" role="group" tabindex="0" aria-label="Which data-movement primitive?">
    <title data-node-tooltip="true">Which data-movement primitive? — Inside Copy Activity&apos;s territory: Copy job, Copy activity proper, or Mirroring.</title>
    <rect x="24.0" y="776.0" width="387.7" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="36" y="792" font-size="11" letter-spacing="1.4" fill="#8A8886">BEYOND COPY: THREE DATA-MOVEMENT OPTIONS INSIDE PIPELINES</text>
  </g>

  <rect x="36" y="800" width="1028" height="66" rx="9" fill="#EAF7F2" stroke="#9AD2C5"/>
  <g font-size="10.5" fill="#424242">
    <g data-node-id="copy-job" role="group" tabindex="0" aria-label="Copy job">
    <title data-node-tooltip="true">Copy job — Simplified movement with built-in delivery styles: bulk, incremental, and change-data-capture.</title>
    <rect x="44.0" y="804.6" width="96.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="56" y="822" font-weight="700" fill="#063D3B">Copy job</text>
  </g>
    <text x="56" y="838">Simplified movement:</text>
    <text x="56" y="852">bulk, incremental, CDC</text>

    <text x="296" y="822" font-weight="700" fill="#063D3B">Copy activity</text>
    <text x="296" y="838">Fully customizable movement,</text>
    <text x="296" y="852">manual parallelism control</text>

    <g data-node-id="mirroring-node" role="group" tabindex="0" aria-label="Mirroring">
    <title data-node-tooltip="true">Mirroring — Near-real-time database replication directly into OneLake.</title>
    <rect x="564.0" y="804.6" width="96.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="576" y="822" font-weight="700" fill="#063D3B">Mirroring</text>
  </g>
    <text x="576" y="838">Near-real-time database</text>
    <text x="576" y="852">replication into OneLake</text>

    <text x="836" y="822" font-weight="700" fill="#063D3B">Guidance</text>
    <text x="836" y="838">Consult Microsoft's data-</text>
    <text x="836" y="852">movement decision guide</text>
  </g>

  <!-- legend -->
  <rect x="36" y="878" width="14" height="14" rx="3" fill="#F7FDF9" stroke="#9AD2C5"/>
  <text x="56" y="890" font-size="10" fill="#616161">strength / capability</text>
  <rect x="220" y="878" width="14" height="14" rx="3" fill="#FDF3F2" stroke="#F1B0A8"/>
  <text x="240" y="890" font-size="10" fill="#616161">limitation / anti-pattern</text>

  <text x="1064" y="890" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
