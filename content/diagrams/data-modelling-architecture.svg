<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-labelledby="data-modelling-architecture-title data-modelling-architecture-desc" data-diagram-id="data-modelling-architecture">
  <title id="data-modelling-architecture-title">Data Modelling in Microsoft Fabric — from business concept to semantic contract</title>
  <desc id="data-modelling-architecture-desc">A branching architecture diagram with nine nodes. It starts at a conceptual business model, moves to a logical model decision point that splits into dimensional (star/snowflake) and data-vault modelling techniques, then both feed a physical-layer choice between a Fabric Lakehouse and a Fabric Warehouse. Both physical options converge on a semantic model, which can run in Direct Lake mode for near-real-time queries without a separate import refresh. A ninth node, marked as a warning, calls out mixed-grain fact tables and Direct Lake fallback to DirectQuery as the two concrete failure modes that break this chain in production.</desc>
  <defs>
    <linearGradient id="archHeader" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082F49"/><stop offset="0.55" stop-color="#0F766E"/><stop offset="1" stop-color="#155E75"/></linearGradient>
    <linearGradient id="archLake" x1="0" x2="1"><stop stop-color="#E0F2FE"/><stop offset="1" stop-color="#CCFBF1"/></linearGradient>
    <linearGradient id="archDirect" x1="0" x2="1"><stop stop-color="#DBEAFE"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient>
    <filter id="archShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="archArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#0F766E"/></marker>
    <marker id="archWarnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#D97706"/></marker>
    <style>
      .kicker{font-size:13px;font-weight:700;letter-spacing:2px}.stage{font-size:13px;font-weight:700;letter-spacing:1.5px}.h1{font-size:35px;font-weight:750}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.micro{font-size:11px}.muted{fill:#475569}.navy{fill:#0F172A}.teal{fill:#0F766E}.white{fill:#FFF}.evidence{font-size:11px;font-weight:700;fill:#0369A1}.line{fill:none;stroke:#0F766E;stroke-width:3;marker-end:url(#archArrow)}.dash{fill:none;stroke:#D97706;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#archWarnArrow)}
      [data-node-id]:focus{outline:none}[data-node-id]:focus>rect,[data-node-id]:focus>.focus-ring{stroke:#2563EB!important;stroke-width:4!important}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#F8FAFC"/>
  <path d="M0 0h1440v185H0z" fill="url(#archHeader)"/>
  <circle cx="1300" cy="18" r="155" fill="#FFF" opacity="0.06"/><circle cx="1370" cy="105" r="92" fill="#FFF" opacity="0.06"/>
  <text x="64" y="46" class="kicker" fill="#A7F3D0">FABRIC ATLAS · DATA MODELLING BLUEPRINT</text>
  <text x="64" y="91" class="h1 white">From business grain to a governed analytics contract</text>
  <text x="64" y="126" font-size="17" fill="#D7F9F2">Choose the modelling technique, physical engine, and semantic read path deliberately — each decision changes the next.</text>
  <g transform="translate(64 146)"><rect width="240" height="28" rx="14" fill="#FFF" opacity="0.13"/><circle cx="18" cy="14" r="6" fill="#5EEAD4"/><text x="33" y="19" class="small white">One declared grain per fact</text></g>
  <g transform="translate(318 146)"><rect width="250" height="28" rx="14" fill="#FFF" opacity="0.13"/><path d="M14 14h12M20 8v12" stroke="#7DD3FC" stroke-width="2"/><text x="35" y="19" class="small white">Open Delta physical layer</text></g>
  <g transform="translate(582 146)"><rect width="285" height="28" rx="14" fill="#FFF" opacity="0.13"/><path d="M13 18l6-8 5 5 6-9" fill="none" stroke="#C4B5FD" stroke-width="2"/><text x="39" y="19" class="small white">One governed semantic contract</text></g>

  <text x="64" y="220" class="stage muted">01 · DEFINE THE BUSINESS</text><text x="382" y="220" class="stage muted">02 · CHOOSE THE LOGICAL SHAPE</text><text x="835" y="220" class="stage muted">03 · PHYSICALISE ON ONELAKE</text><text x="1160" y="220" class="stage muted">04 · SERVE ANALYTICS</text>
  <path d="M326 349h42" class="line"/><path d="M780 349h42" class="line"/><path d="M1096 349h48" class="line"/>

  <g data-node-id="conceptual-model" transform="translate(64 246)" tabindex="0" aria-label="Conceptual business model">
    <title data-node-tooltip="true">Conceptual business model — Bounded entities, grain, and ownership agreed before any Fabric item is created.</title>
    <rect class="focus-ring" width="262" height="206" rx="22" fill="#FFF" stroke="#99F6E4" stroke-width="2" filter="url(#archShadow)"/>
    <circle cx="48" cy="52" r="28" fill="#CCFBF1"/><circle cx="48" cy="44" r="8" fill="#0F766E"/><path d="M31 68c3-15 31-15 34 0" fill="#0F766E"/><circle cx="85" cy="47" r="6" fill="#14B8A6"/><path d="M74 65c2-11 21-11 23 0" fill="#14B8A6"/>
    <text x="90" y="44" class="small teal" font-weight="700">BUSINESS CONTRACT</text><text x="28" y="98" class="h2 navy">Conceptual model</text>
    <text x="28" y="126" class="body muted"><tspan x="28">Entity boundaries · ownership</tspan><tspan x="28" dy="21">One row = one declared event</tspan><tspan x="28" dy="21">Quality + security intent</tspan></text>
    <rect x="28" y="174" width="205" height="22" rx="11" fill="#ECFDF5"/><text x="40" y="190" class="micro" fill="#047857">PATTERN · sign off before build</text>
  </g>

  <g data-node-id="logical-model" transform="translate(382 246)" tabindex="0" aria-label="Logical model: dimensional vs vault">
    <title data-node-tooltip="true">Logical model: dimensional vs vault — The design technique decision point — star/snowflake vs data vault vs plain canonical.</title>
    <rect class="focus-ring" width="398" height="206" rx="22" fill="#FFF" stroke="#BAE6FD" stroke-width="2" filter="url(#archShadow)"/>
    <circle cx="48" cy="50" r="27" fill="#E0F2FE"/><path d="M32 42h32M32 50h18M32 58h26" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>
    <text x="89" y="45" class="small" fill="#0369A1" font-weight="700">DESIGN GATE</text><text x="28" y="94" class="h2 navy">Logical modelling technique</text>
    <text x="28" y="123" class="body muted">Optimise for the job — not the fashionable pattern.</text>
    <g transform="translate(28 145)"><rect width="164" height="40" rx="12" fill="#EFF6FF"/><text x="14" y="17" class="small" fill="#1D4ED8" font-weight="700">BI consumption</text><text x="14" y="32" class="micro muted">facts + dimensions</text></g>
    <g transform="translate(205 145)"><rect width="164" height="40" rx="12" fill="#F5F3FF"/><text x="14" y="17" class="small" fill="#6D28D9" font-weight="700">Auditable history</text><text x="14" y="32" class="micro muted">hubs + links + satellites</text></g>
  </g>

  <path d="M580 452v30M580 482H456v34M580 482h124v34" fill="none" stroke="#0F766E" stroke-width="3"/><text x="470" y="475" class="micro teal">query simplicity</text><text x="616" y="475" class="micro" fill="#6D28D9">volatile sources + audit</text>
  <g data-node-id="dimensional-technique" transform="translate(382 516)" tabindex="0" aria-label="Dimensional (star / snowflake)">
    <title data-node-tooltip="true">Dimensional (star / snowflake) — Fact + conformed dimension tables optimised for BI query patterns.</title>
    <rect class="focus-ring" width="198" height="156" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="18" y="28" class="h3" fill="#1E40AF">Dimensional</text><text x="18" y="47" class="small muted">star / snowflake</text>
    <rect x="76" y="69" width="48" height="34" rx="6" fill="#2563EB"/><text x="100" y="90" text-anchor="middle" class="micro white">FACT</text>
    <g fill="#BFDBFE" stroke="#2563EB"><rect x="18" y="70" width="38" height="24" rx="5"/><rect x="142" y="70" width="38" height="24" rx="5"/><rect x="81" y="116" width="38" height="24" rx="5"/></g>
    <path d="M56 82h20M124 82h18M100 103v13" stroke="#2563EB" stroke-width="2"/>
    <circle cx="174" cy="24" r="14" fill="#FFF"/><text x="174" y="28" text-anchor="middle" class="evidence">P</text>
  </g>
  <g data-node-id="vault-technique" transform="translate(594 516)" tabindex="0" aria-label="Data vault (hub / link / satellite)">
    <title data-node-tooltip="true">Data vault (hub / link / satellite) — Auditable, insert-only structure for multi-source integration and history.</title>
    <rect class="focus-ring" width="198" height="156" rx="18" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
    <text x="18" y="28" class="h3" fill="#6D28D9">Data vault</text><text x="18" y="47" class="small muted">audit + source absorption</text>
    <circle cx="55" cy="89" r="25" fill="#7C3AED"/><text x="55" y="93" text-anchor="middle" class="micro white">HUB</text><path d="M80 89h33" stroke="#7C3AED" stroke-width="3"/><rect x="113" y="71" width="55" height="36" rx="7" fill="#DDD6FE" stroke="#7C3AED"/><text x="140" y="93" text-anchor="middle" class="micro" fill="#5B21B6">LINK</text><path d="M140 107v21" stroke="#7C3AED" stroke-width="3"/><rect x="111" y="128" width="58" height="18" rx="7" fill="#EDE9FE"/>
    <circle cx="174" cy="24" r="14" fill="#FFF"/><text x="174" y="28" text-anchor="middle" class="evidence">P</text>
  </g>

  <path d="M580 594v94h232V390h32" class="line"/><path d="M792 594h20v-26h32" class="line"/><text x="710" y="706" class="micro teal">either technique → choose the owning engine</text>
  <g transform="translate(824 246)"><rect width="272" height="426" rx="24" fill="url(#archLake)" stroke="#67E8F9" stroke-width="2" filter="url(#archShadow)"/><text x="24" y="35" class="small" fill="#0E7490" font-weight="700">SHARED OPEN STORAGE · DELTA ON ONELAKE</text><path d="M24 49h224" stroke="#67E8F9"/></g>
  <g data-node-id="lakehouse-physical" transform="translate(844 318)" tabindex="0" aria-label="Lakehouse physical layer">
    <title data-node-tooltip="true">Lakehouse physical layer — Delta tables on OneLake, Spark-first, handles unstructured data alongside structured tables.</title>
    <rect class="focus-ring" width="232" height="145" rx="18" fill="#FFF" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(18 24)"><path d="M0 34L27 8l27 26v38H0z" fill="#E0F2FE" stroke="#0284C7" stroke-width="4"/><path d="M0 55c12 8 40 8 54 0v18c-15 8-42 8-54 0z" fill="#06B6D4"/></g>
    <text x="88" y="39" class="h3" fill="#075985">Lakehouse</text><text x="88" y="61" class="small muted">Spark-first · files + tables</text><text x="18" y="105" class="small navy">Managed Delta tables</text><text x="18" y="124" class="small muted">SQL endpoint reads same copy</text><circle cx="209" cy="23" r="14" fill="#E0F2FE"/><text x="209" y="27" text-anchor="middle" class="evidence">S1</text>
  </g>
  <g data-node-id="warehouse-physical" transform="translate(844 489)" tabindex="0" aria-label="Warehouse physical layer">
    <title data-node-tooltip="true">Warehouse physical layer — Delta tables on OneLake, T-SQL-first, full multi-table ACID transactions.</title>
    <rect class="focus-ring" width="232" height="158" rx="18" fill="#FFF" stroke="#14B8A6" stroke-width="2"/>
    <g transform="translate(18 26)" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"><path d="M2 26L30 6l28 20v52H2z"/><path d="M0 78h62"/><path d="M14 36h9v9h-9zm25 0h9v9h-9zM14 55h9v9h-9zm25 0h9v9h-9z" fill="#0F766E" stroke="none"/></g>
    <text x="91" y="39" class="h3" fill="#115E59">Warehouse</text><text x="91" y="61" class="small muted">T-SQL-first · relational</text><text x="18" y="112" class="small navy">Multi-table ACID</text><text x="18" y="132" class="small muted">Stored procedures + views</text><circle cx="209" cy="23" r="14" fill="#CCFBF1"/><text x="209" y="27" text-anchor="middle" class="evidence">S2</text>
  </g>

  <g data-node-id="semantic-model-layer" transform="translate(1144 246)" tabindex="0" aria-label="Semantic model (consumption contract)">
    <title data-node-tooltip="true">Semantic model (consumption contract) — The Analysis Services tabular model report authors actually query — Import, DirectQuery, or Direct Lake.</title>
    <rect class="focus-ring" width="232" height="245" rx="22" fill="#FFF" stroke="#818CF8" stroke-width="2" filter="url(#archShadow)"/>
    <circle cx="48" cy="51" r="29" fill="#E0E7FF"/><path d="M31 59l12-14 11 8 12-17" fill="none" stroke="#4F46E5" stroke-width="4"/><circle cx="31" cy="59" r="3" fill="#4F46E5"/><circle cx="66" cy="36" r="3" fill="#4F46E5"/>
    <text x="87" y="45" class="small" fill="#4338CA" font-weight="700">CONSUMPTION</text><text x="24" y="98" class="h2 navy">Semantic model</text>
    <g transform="translate(24 118)"><rect width="184" height="28" rx="8" fill="#EEF2FF"/><text x="12" y="19" class="small" fill="#3730A3">Relationships + measures</text></g><g transform="translate(24 153)"><rect width="184" height="28" rx="8" fill="#EEF2FF"/><text x="12" y="19" class="small" fill="#3730A3">RLS + certified meaning</text></g>
    <text x="24" y="218" class="micro muted">Import · DirectQuery · Direct Lake</text><circle cx="208" cy="23" r="14" fill="#EEF2FF"/><text x="208" y="27" text-anchor="middle" class="evidence">S3</text>
  </g>
  <path d="M1260 491v35" class="line"/>
  <g data-node-id="direct-lake-consumption" transform="translate(1144 526)" tabindex="0" aria-label="Direct Lake mode">
    <title data-node-tooltip="true">Direct Lake mode — Reads Parquet straight from OneLake without an Import-mode memory copy — two flavors with different security paths.</title>
    <rect class="focus-ring" width="232" height="146" rx="20" fill="url(#archDirect)" stroke="#6366F1" stroke-width="2"/>
    <path d="M27 70a31 31 0 1162 0" fill="none" stroke="#4F46E5" stroke-width="7"/><path d="M58 70l21-24" stroke="#4F46E5" stroke-width="5" stroke-linecap="round"/><circle cx="58" cy="70" r="6" fill="#4F46E5"/>
    <text x="105" y="38" class="h3" fill="#3730A3">Direct Lake</text><text x="105" y="60" class="small muted">Parquet → model memory</text><text x="24" y="108" class="small navy">No import copy</text><text x="24" y="128" class="small muted">Freshness follows table writes</text><circle cx="208" cy="22" r="14" fill="#FFF"/><text x="208" y="26" text-anchor="middle" class="evidence">S4</text>
  </g>

  <g transform="translate(64 714)"><rect width="1312" height="120" rx="22" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/><text x="28" y="31" class="stage" fill="#334155">THE DELIVERY CONTRACT</text>
    <g transform="translate(28 48)"><circle cx="21" cy="21" r="21" fill="#CCFBF1"/><text x="21" y="26" text-anchor="middle" class="h3 teal">1</text><text x="55" y="17" class="h3 navy">Declare grain</text><text x="55" y="38" class="small muted">one event per fact row</text></g>
    <path d="M324 70h54" class="line"/><g transform="translate(394 48)"><circle cx="21" cy="21" r="21" fill="#DBEAFE"/><text x="21" y="26" text-anchor="middle" class="h3" fill="#1D4ED8">2</text><text x="55" y="17" class="h3 navy">Validate keys + history</text><text x="55" y="38" class="small muted">automated relationship tests</text></g>
    <path d="M700 70h54" class="line"/><g transform="translate(770 48)"><circle cx="21" cy="21" r="21" fill="#EDE9FE"/><text x="21" y="26" text-anchor="middle" class="h3" fill="#6D28D9">3</text><text x="55" y="17" class="h3 navy">Certify measures</text><text x="55" y="38" class="small muted">one governed business meaning</text></g>
  </g>

  <g data-node-id="mixed-grain-failure" transform="translate(64 862)" tabindex="0" aria-label="Mixed grain &amp; fallback failures">
    <title data-node-tooltip="true">Mixed grain &amp; fallback failures — The two concrete ways this modelling chain breaks: mixed-grain fact tables, and Direct Lake view-based fallback.</title>
    <rect class="focus-ring" width="1312" height="150" rx="22" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
    <path d="M38 104L76 34l38 70z" fill="#F59E0B"/><path d="M76 57v25M76 91v4" stroke="#FFF" stroke-width="7" stroke-linecap="round"/>
    <text x="138" y="43" class="h2" fill="#9A3412">Failure feedback: stop before bad semantics become trusted analytics</text>
    <g transform="translate(138 61)"><rect width="430" height="60" rx="14" fill="#FFEDD5"/><text x="18" y="24" class="h3" fill="#9A3412">Mixed-grain fact</text><text x="18" y="46" class="small" fill="#7C2D12">Double counting survives every downstream layer.</text></g>
    <g transform="translate(588 61)"><rect width="486" height="60" rx="14" fill="#FFEDD5"/><text x="18" y="24" class="h3" fill="#9A3412">Direct Lake on SQL + views</text><text x="18" y="46" class="small" fill="#7C2D12">Queries can silently fall back to the slower DirectQuery path.</text></g>
    <circle cx="1278" cy="30" r="16" fill="#FFF"/><text x="1278" y="34" text-anchor="middle" class="evidence">S4</text>
  </g>
  <path d="M118 862C118 818 93 790 86 730" class="dash"/><text x="92" y="850" class="small" fill="#B45309">repair grain / materialise base table / retest</text>

  <g transform="translate(64 1035)"><rect width="1312" height="52" rx="14" fill="#E2E8F0"/><text x="22" y="21" class="small" fill="#334155" font-weight="700">WHAT TO WATCH</text><text x="150" y="21" class="small muted">A shared Delta format does not make Lakehouse and Warehouse interchangeable: choose the write engine and transaction boundary deliberately.</text><text x="150" y="40" class="small muted">Evidence markers map to the sidecar sources; pattern nodes remain explicitly labelled as design guidance.</text></g>
  <text x="1376" y="1107" text-anchor="end" class="micro" fill="#64748B">Fabric Atlas original · product-neutral vector illustration</text>
</svg>
