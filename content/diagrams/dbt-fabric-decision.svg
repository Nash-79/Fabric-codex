<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="dbt-fabric-decision-title dbt-fabric-decision-desc" data-diagram-id="dbt-fabric-decision">
  <title id="dbt-fabric-decision-title">dbt vs Dataflow Gen2 vs Spark Notebooks vs Stored Procedures</title>
  <desc id="dbt-fabric-decision-desc">A decision tree rooted at &apos;what kind of transformation work is this?&apos;. Three branches: version-controlled, tested SQL modelling of already-landed data routes to dbt against the Warehouse via the third-party dbt-fabric adapter; low-code ingestion and shaping for analysts routes to Dataflow Gen2; Python/Spark work over Lakehouse/OneLake data routes to notebooks. A fourth node covers Warehouse stored procedures as the fallback when no external tooling is wanted. A warning node flags the T-SQL surface limits every dbt model inherits, and a second warning flags the anti-pattern of splitting one transformation layer across two tools.</desc>
  <defs>
    <linearGradient id="dbtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#e35d1f"/>
    </linearGradient>
    <linearGradient id="dfgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13a085"/>
      <stop offset="100%" stop-color="#0b7b6b"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45cc4"/>
      <stop offset="100%" stop-color="#8a3d9c"/>
    </linearGradient>
    <linearGradient id="spGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8bd4"/>
      <stop offset="100%" stop-color="#2a679e"/>
    </linearGradient>
    <filter id="soft2" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2330" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1100" height="860" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="58" fill="#1b2430"/>
  <text x="30" y="35" font-size="20" font-weight="700" fill="#ffffff">Choosing a Transformation Tool for Fabric Warehouse</text>
  <text x="1070" y="35" font-size="11.5" fill="#b9c3cf" text-anchor="end">dbt vs. Dataflow Gen2 vs. Spark notebooks vs. stored procedures</text>

  <!-- Column headers -->
  <text x="30" y="88" font-size="12.5" font-weight="700" fill="#3f4c5a" letter-spacing="0.4">FOUR APPROACHES, COMPARED ACROSS THREE AXES</text>

  <g font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="30" y="98" width="252" height="40" rx="8" fill="url(#dbtGrad)" filter="url(#soft2)"/>
    <text x="156" y="123">dbt (dbt-fabric)</text>

    <rect x="292" y="98" width="252" height="40" rx="8" fill="url(#dfgGrad)" filter="url(#soft2)"/>
    <text x="418" y="123">Dataflow Gen2</text>

    <rect x="554" y="98" width="252" height="40" rx="8" fill="url(#sparkGrad)" filter="url(#soft2)"/>
    <text x="680" y="123">Spark notebooks</text>

    <rect x="816" y="98" width="252" height="40" rx="8" fill="url(#spGrad)" filter="url(#soft2)"/>
    <text x="942" y="123">Warehouse stored procs</text>
  </g>

  <!-- Row: SKILLSET -->
  <text x="30" y="164" font-size="12" font-weight="700" fill="#3f4c5a">AXIS 1 — SKILLSET</text>
  <g font-size="10" fill="#2e3a45">
    <rect x="30" y="172" width="252" height="90" rx="8" fill="#fff4ec" stroke="#f0b184" stroke-width="1.3"/>
    <text x="46" y="190" font-weight="700" fill="#8a3d10">SQL + analytics engineering</text>
    <text x="46" y="206">SELECT-based models, ref()/</text>
    <text x="46" y="219">source() lineage, Jinja macros</text>
    <text x="46" y="235">— written and run outside</text>
    <text x="46" y="248">Fabric (VS Code/CLI + Python)</text>

    <rect x="292" y="172" width="252" height="90" rx="8" fill="#eafaf5" stroke="#8fd8c2" stroke-width="1.3"/>
    <text x="308" y="190" font-weight="700" fill="#0b7b6b">Low-code / Power Query</text>
    <text x="308" y="206">Visual, mashup-editor driven;</text>
    <text x="308" y="219">approachable for analysts</text>
    <text x="308" y="235">without a programming</text>
    <text x="308" y="248">background</text>

    <rect x="554" y="172" width="252" height="90" rx="8" fill="#f6ecfa" stroke="#d4a8e2" stroke-width="1.3"/>
    <text x="570" y="190" font-weight="700" fill="#8a3d9c">Python / PySpark / Scala</text>
    <text x="570" y="206">Code-first, distributed</text>
    <text x="570" y="219">compute; suits data</text>
    <text x="570" y="235">engineers comfortable</text>
    <text x="570" y="248">with Spark APIs</text>

    <rect x="816" y="172" width="252" height="90" rx="8" fill="#eaf2fb" stroke="#a8c8e8" stroke-width="1.3"/>
    <text x="832" y="190" font-weight="700" fill="#2a679e">T-SQL only</text>
    <text x="832" y="206">Native to Fabric Warehouse;</text>
    <text x="832" y="219">lowest new-tool barrier for</text>
    <text x="832" y="235">SQL-Server-background</text>
    <text x="832" y="248">database engineers</text>
  </g>

  <!-- Row: VERSION CONTROL / TESTING -->
  <text x="30" y="298" font-size="12" font-weight="700" fill="#3f4c5a">AXIS 2 — VERSION CONTROL &amp; TESTING</text>
  <g font-size="10" fill="#2e3a45">
    <rect x="30" y="306" width="252" height="100" rx="8" fill="#fff4ec" stroke="#f0b184" stroke-width="1.3"/>
    <text x="46" y="324" font-weight="700" fill="#8a3d10">Strong — built in</text>
    <text x="46" y="341">Project is plain text (git-native);</text>
    <text x="46" y="355">dbt test runs schema/data tests</text>
    <text x="46" y="369">as part of the standard</text>
    <text x="46" y="383">debug → seed → run → test cycle</text>

    <rect x="292" y="306" width="252" height="100" rx="8" fill="#eafaf5" stroke="#8fd8c2" stroke-width="1.3"/>
    <text x="308" y="324" font-weight="700" fill="#0b7b6b">Weaker</text>
    <text x="308" y="341">Definitions live as Fabric items;</text>
    <text x="308" y="355">diffing/testing is more limited</text>
    <text x="308" y="369">than a text-based project —</text>
    <text x="308" y="383">no built-in test framework</text>

    <rect x="554" y="306" width="252" height="100" rx="8" fill="#f6ecfa" stroke="#d4a8e2" stroke-width="1.3"/>
    <text x="570" y="324" font-weight="700" fill="#8a3d9c">Strong — general-purpose</text>
    <text x="570" y="341">Notebooks/.py files are git-</text>
    <text x="570" y="355">friendly; testing relies on</text>
    <text x="570" y="369">standard Python test</text>
    <text x="570" y="383">frameworks, not dbt-native</text>

    <rect x="816" y="306" width="252" height="100" rx="8" fill="#eaf2fb" stroke="#a8c8e8" stroke-width="1.3"/>
    <text x="832" y="324" font-weight="700" fill="#2a679e">Weakest of the four</text>
    <text x="832" y="341">Procedures can be scripted to</text>
    <text x="832" y="355">source control manually; no</text>
    <text x="832" y="369">native data-testing layer —</text>
    <text x="832" y="383">testing is hand-rolled T-SQL</text>
  </g>

  <!-- Row: TARGET ENGINE -->
  <text x="30" y="440" font-size="12" font-weight="700" fill="#3f4c5a">AXIS 3 — TARGET ENGINE / EXECUTION</text>
  <g font-size="10" fill="#2e3a45">
    <rect x="30" y="448" width="252" height="96" rx="8" fill="#fff4ec" stroke="#f0b184" stroke-width="1.3"/>
    <text x="46" y="466" font-weight="700" fill="#8a3d10">Fabric Data Warehouse (T-SQL)</text>
    <text x="46" y="483">Compiles models to CTAS +</text>
    <text x="46" y="497">DROP/CREATE against the SQL</text>
    <text x="46" y="511">analytics endpoint — portable</text>
    <text x="46" y="525">to other dbt-supported warehouses</text>

    <rect x="292" y="448" width="252" height="96" rx="8" fill="#eafaf5" stroke="#8fd8c2" stroke-width="1.3"/>
    <text x="308" y="466" font-weight="700" fill="#0b7b6b">Power Query / Fabric mashup engine</text>
    <text x="308" y="483">Runs inside Fabric; output can</text>
    <text x="308" y="497">land in Lakehouse or Warehouse</text>
    <text x="308" y="511">destinations as a Fabric-managed</text>
    <text x="308" y="525">item, not an external project</text>

    <rect x="554" y="448" width="252" height="96" rx="8" fill="#f6ecfa" stroke="#d4a8e2" stroke-width="1.3"/>
    <text x="570" y="466" font-weight="700" fill="#8a3d9c">Fabric Spark compute (Lakehouse)</text>
    <text x="570" y="483">Distributed engine over Delta</text>
    <text x="570" y="497">tables in OneLake; best fit when</text>
    <text x="570" y="511">the target is the lakehouse layer,</text>
    <text x="570" y="525">not the warehouse T-SQL surface</text>

    <rect x="816" y="448" width="252" height="96" rx="8" fill="#eaf2fb" stroke="#a8c8e8" stroke-width="1.3"/>
    <text x="832" y="466" font-weight="700" fill="#2a679e">Fabric Data Warehouse (native)</text>
    <text x="832" y="483">Runs directly in-engine as T-SQL;</text>
    <text x="832" y="497">subject to the same command/</text>
    <text x="832" y="511">data-type limits as any Warehouse</text>
    <text x="832" y="525">object — no external tooling layer</text>
  </g>

  <!-- Decision guidance panel -->
  <text x="30" y="586" font-size="12.5" font-weight="700" fill="#3f4c5a" letter-spacing="0.4">WHEN TO REACH FOR EACH</text>
  <rect x="24" y="596" width="1044" height="180" rx="14" fill="#f4f6f8" stroke="#c7cfd7" stroke-width="1.5"/>

  <g font-size="10.2" fill="#2e3a45">
    <circle cx="52" cy="626" r="7" fill="url(#dbtGrad)"/>
    <text x="68" y="630" font-weight="700">Choose dbt</text>
    <text x="68" y="646">when the team already writes SQL, wants git-based review and</text>
    <text x="68" y="660">automated testing, and is willing to run/orchestrate the project</text>
    <text x="68" y="674">from outside Fabric (CI, Airflow-in-Data-Factory).</text>

    <circle cx="52" cy="696" r="7" fill="url(#dfgGrad)"/>
    <text x="68" y="700" font-weight="700">Choose Dataflow Gen2</text>
    <text x="68" y="716">when analysts need a visual, low-code shaping step fully inside</text>
    <text x="68" y="730">Fabric, and heavy version-control/testing rigor is not the priority.</text>

    <circle cx="574" cy="626" r="7" fill="url(#sparkGrad)"/>
    <text x="590" y="630" font-weight="700">Choose Spark notebooks</text>
    <text x="590" y="646">when transformation logic is Python/Scala-first, needs distributed</text>
    <text x="590" y="660">compute, and the destination is Lakehouse/Delta rather than the</text>
    <text x="590" y="674">Warehouse T-SQL surface.</text>

    <circle cx="574" cy="696" r="7" fill="url(#spGrad)"/>
    <text x="590" y="700" font-weight="700">Choose stored procedures</text>
    <text x="590" y="716">when the team is T-SQL-native, wants zero extra tooling, and can</text>
    <text x="590" y="730">accept weaker built-in version control and no native test framework.</text>
  </g>

  <!-- Legend -->
  <text x="30" y="806" font-size="11.5" font-weight="700" fill="#3f4c5a">LEGEND</text>
  <g font-size="10" fill="#3f4c5a">
    <rect x="30" y="814" width="14" height="14" rx="3" fill="url(#dbtGrad)"/>
    <text x="50" y="825">dbt (dbt-fabric adapter)</text>
    <rect x="230" y="814" width="14" height="14" rx="3" fill="url(#dfgGrad)"/>
    <text x="250" y="825">Dataflow Gen2</text>
    <rect x="400" y="814" width="14" height="14" rx="3" fill="url(#sparkGrad)"/>
    <text x="420" y="825">Spark notebooks</text>
    <rect x="590" y="814" width="14" height="14" rx="3" fill="url(#spGrad)"/>
    <text x="610" y="825">Warehouse stored procedures</text>
  </g>
  <text x="30" y="844" font-size="9.6" fill="#7a8794">Grounded in: content/sources/dbt-fabric-warehouse.json (dbt-fabric adapter, T-SQL/CTAS translation, portability, Entra auth) plus well-established dbt/Fabric platform facts (models, ref(), materializations, tests, Power Query, Spark, T-SQL).</text>

  <!-- Full-region keyboard and pointer targets; metadata comes from the evidence sidecar. -->
  <g data-node-id="start-question" role="group" tabindex="0" aria-label="What kind of transformation is this?">
    <title data-node-tooltip="true">What kind of transformation is this? — Root question: version-controlled SQL modelling, low-code shaping, Spark-shaped work, or embedded T-SQL.</title>
    <rect x="24.0" y="596.0" width="1044.0" height="180.0" rx="14.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="dbt-warehouse" role="group" tabindex="0" aria-label="dbt (via dbt-fabric adapter)">
    <title data-node-tooltip="true">dbt (via dbt-fabric adapter) — SQL-first, version-controlled, tested modelling inside Fabric Warehouse via a third-party PyPI adapter.</title>
    <rect x="6.0" y="825.4" width="352.0" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="dataflow-gen2" role="group" tabindex="0" aria-label="Dataflow Gen2 (Power Query)">
    <title data-node-tooltip="true">Dataflow Gen2 (Power Query) — Low-code ingestion and shaping for analysts, strongest for connector breadth and landing data into Fabric.</title>
    <rect x="292.0" y="172.0" width="252.0" height="90.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="spark-notebooks" role="group" tabindex="0" aria-label="Spark notebooks">
    <title data-node-tooltip="true">Spark notebooks — Python/Scala transformation over Lakehouse/OneLake data, unstructured work, and ML feature engineering.</title>
    <rect x="554.0" y="98.0" width="252.0" height="40.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="stored-procedures" role="group" tabindex="0" aria-label="Warehouse stored procedures">
    <title data-node-tooltip="true">Warehouse stored procedures — Procedural T-SQL embedded directly in the Warehouse, with no external tooling or version-control framework.</title>
    <rect x="525.8" y="804.0" width="168.5" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="tsql-surface-limits" role="group" tabindex="0" aria-label="Warning: Fabric Warehouse&apos;s T-SQL surface is not SQL Server&apos;s">
    <title data-node-tooltip="true">Warning: Fabric Warehouse&apos;s T-SQL surface is not SQL Server&apos;s — dbt-fabric works around unsupported ALTER/MERGE/TRUNCATE by generating CTAS + DROP/CREATE instead.</title>
    <rect x="6.0" y="825.4" width="352.0" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="split-layer-warning" role="group" tabindex="0" aria-label="Warning: splitting one transformation layer across tools">
    <title data-node-tooltip="true">Warning: splitting one transformation layer across tools — Half the logic in a dataflow dbt can&apos;t see erases the lineage and testing benefits dbt exists to provide.</title>
    <rect x="816.0" y="306.0" width="252.0" height="100.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
</svg>
