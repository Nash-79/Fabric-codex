<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="event-driven-architecture-architecture-title event-driven-architecture-architecture-desc" data-diagram-id="event-driven-architecture-architecture">
  <title id="event-driven-architecture-architecture-title">Event-Driven Architecture in Microsoft Fabric</title>
  <desc id="event-driven-architecture-architecture-desc">An event source feeds Eventstream, which routes to Real-Time hub and forks two ways: a hot path through Activator that fires an immediate action, and a cold path into Eventhouse and OneLake for durable history and downstream analytics. A replay/dead-letter path feeds back into the router, and two warning nodes call out the idempotency and durability risks of treating the hot path as the system of record.</desc>
  <defs><linearGradient id="eda-head" x1="0" x2="1"><stop stop-color="#102D46"/><stop offset="1" stop-color="#0A6B65"/></linearGradient><filter id="eda-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102A43" flood-opacity=".14"/></filter><marker id="eda-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#14877D"/></marker><marker id="eda-hot" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#D45D31"/></marker><marker id="eda-cold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2D66C3"/></marker><marker id="eda-loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#755AB5"/></marker></defs>
  <rect width="1180" height="1040" fill="#F6F9FC"/><rect width="1180" height="104" fill="url(#eda-head)"/><text x="44" y="44" fill="#FFFFFF" font-size="28" font-weight="700">Events fork into action and durable history</text><text x="44" y="74" fill="#C9ECE8" font-size="14">One ingress · hot reaction path · cold analytical path · explicit replay contract</text><g transform="translate(940 22)"><rect width="196" height="58" rx="12" fill="#FFFFFF" opacity=".12"/><text x="18" y="24" fill="#8CE2D9" font-size="11" font-weight="700">DESIGN RULE</text><text x="18" y="44" fill="#FFFFFF" font-size="12">Notification is not state</text></g>
  <rect x="28" y="124" width="1124" height="226" rx="20" fill="#FFFFFF" stroke="#C8D7E4"/><text x="48" y="153" fill="#586C7D" font-size="11" font-weight="700" letter-spacing="1.5">01 · PRODUCE, SHAPE, AND ROUTE ONCE</text>
  <path d="M304 246H346" stroke="#14877D" stroke-width="4" marker-end="url(#eda-arrow)"/><text x="325" y="229" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">RAW EVENTS</text><path d="M690 246H732" stroke="#14877D" stroke-width="4" marker-end="url(#eda-arrow)"/><text x="711" y="229" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">SHAPED STREAM</text>
  <g data-node-id="event-source" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Event source"><title data-node-tooltip="true">Event source — Where the business or platform event originates.</title><rect x="48" y="178" width="256" height="142" rx="16" fill="#F4F0FC" stroke="#755AB5" stroke-width="2"/><path d="M76 220h40v40H76zM85 211h22M96 211v-12" fill="none" stroke="#755AB5" stroke-width="3"/><circle cx="96" cy="199" r="5" fill="#755AB5"/><text x="132" y="211" fill="#5A4391" font-size="10" font-weight="700">PRODUCER CONTRACT</text><text x="132" y="235" fill="#172B4D" font-size="17" font-weight="700">Event source</text><text x="68" y="284" fill="#4D4765" font-size="12">event id · event time · payload</text><circle cx="275" cy="202" r="11" fill="#DDF3EE"/><text x="275" y="206" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <g data-node-id="eventstream" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Eventstream"><title data-node-tooltip="true">Eventstream — No-code ingestion, transformation, and routing for streaming data.</title><rect x="346" y="178" width="344" height="142" rx="16" fill="#EAF8F4" stroke="#14877D" stroke-width="2"/><path d="M376 215c18-18 38 18 56 0s38 18 56 0" fill="none" stroke="#14877D" stroke-width="4"/><path d="M376 238c18-18 38 18 56 0s38 18 56 0" fill="none" stroke="#6AC7BA" stroke-width="4"/><text x="512" y="207" fill="#08766C" font-size="8" font-weight="700">INGEST · TRANSFORM · ROUTE</text><text x="512" y="233" fill="#172B4D" font-size="17" font-weight="700">Eventstream</text><g fill="#FFFFFF" stroke="#89CFC2"><rect x="376" y="270" width="84" height="28" rx="8"/><rect x="470" y="270" width="84" height="28" rx="8"/><rect x="564" y="270" width="104" height="28" rx="8"/></g><g fill="#35645D" font-size="10" font-weight="700" text-anchor="middle"><text x="418" y="289">CONNECT</text><text x="512" y="289">SHAPE</text><text x="616" y="289">ROUTE</text></g><circle cx="662" cy="202" r="11" fill="#DDF3EE"/><text x="662" y="206" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <g data-node-id="real-time-hub" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Real-Time hub router"><title data-node-tooltip="true">Real-Time hub router — Organization-wide catalog and the fork point between hot and cold paths.</title><rect x="732" y="178" width="400" height="142" rx="16" fill="#EEF4FD" stroke="#2D66C3" stroke-width="2.5"/><circle cx="783" cy="237" r="30" fill="#2D66C3"/><circle cx="783" cy="237" r="8" fill="#FFFFFF"/><path d="M783 207v19M783 248v19M753 237h19M794 237h19" stroke="#FFFFFF" stroke-width="3"/><text x="832" y="207" fill="#244F99" font-size="10" font-weight="700">ORGANIZATION-WIDE ROUTER</text><text x="832" y="233" fill="#172B4D" font-size="17" font-weight="700">Real-Time hub</text><text x="832" y="258" fill="#445F7D" font-size="12">Discover once · fork by delivery purpose</text><rect x="832" y="273" width="126" height="25" rx="12" fill="#FFE8DF"/><text x="895" y="290" text-anchor="middle" fill="#A44724" font-size="10" font-weight="700">HOT · ACT NOW</text><rect x="970" y="273" width="137" height="25" rx="12" fill="#DEE9FA"/><text x="1038" y="290" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">COLD · KEEP HISTORY</text><circle cx="1102" cy="202" r="11" fill="#DDF3EE"/><text x="1102" y="206" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <rect x="28" y="374" width="1124" height="430" rx="20" fill="#F0F5F8" stroke="#C8D7E4"/><text x="48" y="404" fill="#586C7D" font-size="11" font-weight="700" letter-spacing="1.5">02 · FORK BY DELIVERY SEMANTICS</text>
  <path d="M852 320V354H288V438" fill="none" stroke="#D45D31" stroke-width="3" marker-end="url(#eda-hot)"/><rect x="416" y="341" width="132" height="22" rx="11" fill="#FFE7DE"/><text x="482" y="356" text-anchor="middle" fill="#A44724" font-size="10" font-weight="700">HOT · EVALUATE NOW</text><path d="M1010 320V438" fill="none" stroke="#2D66C3" stroke-width="3" marker-end="url(#eda-cold)"/><rect x="1022" y="357" width="107" height="22" rx="11" fill="#DEE9FA"/><text x="1075" y="372" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">COLD · INGEST</text>
  <g data-node-id="activator" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Activator (hot path)"><title data-node-tooltip="true">Activator (hot path) — Evaluates the stream in near-real time and fires an automated action.</title><rect x="48" y="438" width="480" height="154" rx="17" fill="#FFF3EC" stroke="#D45D31" stroke-width="2.5"/><circle cx="92" cy="490" r="27" fill="#D45D31"/><path d="M92 468v22l14 8" stroke="#FFFFFF" stroke-width="3" fill="none"/><path d="M78 519l14-16 14 16" fill="none" stroke="#D45D31" stroke-width="3"/><text x="136" y="472" fill="#A44724" font-size="10" font-weight="700">HOT PATH · CONDITION → ACTION</text><text x="136" y="499" fill="#4C291E" font-size="18" font-weight="700">Activator evaluates and acts</text><text x="136" y="524" fill="#6E493D" font-size="12">Alert · workflow · command · human response</text><rect x="68" y="550" width="440" height="25" rx="12" fill="#FFE2D6"/><text x="288" y="567" text-anchor="middle" fill="#A44724" font-size="10" font-weight="700">FAST REACTION · TRANSIENT DELIVERY · NOT THE SYSTEM OF RECORD</text><circle cx="498" cy="464" r="11" fill="#DDF3EE"/><text x="498" y="468" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <g data-node-id="eventhouse" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Eventhouse (cold path)"><title data-node-tooltip="true">Eventhouse (cold path) — Durable, indexed storage of the full event history.</title><rect x="654" y="438" width="478" height="154" rx="17" fill="#EEF4FD" stroke="#2D66C3" stroke-width="2.5"/><g transform="translate(676 462)"><ellipse cx="36" cy="11" rx="34" ry="10" fill="#2D66C3"/><path d="M2 11v62c0 7 15 12 34 12s34-5 34-12V11" fill="#DCE9FA" stroke="#2D66C3" stroke-width="2"/><path d="M2 32c0 7 15 12 34 12s34-5 34-12M2 53c0 7 15 12 34 12s34-5 34-12" fill="none" stroke="#2D66C3" stroke-width="2"/></g><text x="772" y="472" fill="#244F99" font-size="10" font-weight="700">COLD PATH · DURABLE + INDEXED</text><text x="772" y="499" fill="#172B4D" font-size="18" font-weight="700">Eventhouse retains history</text><text x="772" y="524" fill="#445F7D" font-size="12">Investigate · query · replay · analyze later</text><rect x="772" y="550" width="326" height="25" rx="12" fill="#DDE9FA"/><text x="935" y="567" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">DURABLE BUSINESS HISTORY LIVES HERE</text><circle cx="1102" cy="464" r="11" fill="#DDF3EE"/><text x="1102" y="468" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <path d="M1010 592V628" stroke="#2D66C3" stroke-width="3" marker-end="url(#eda-cold)"/><text x="1026" y="615" fill="#244F99" font-size="10" font-weight="700">MIRROR TO DELTA</text>
  <g data-node-id="onelake-history" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="OneLake durable history"><title data-node-tooltip="true">OneLake durable history — Delta-format mirror of Eventhouse data for cross-workload analytics.</title><rect x="822" y="628" width="310" height="138" rx="16" fill="#E9F8F4" stroke="#14877D" stroke-width="2"/><path d="M850 676c0-13 13-24 29-24s29 11 29 24v31c0 10-13 18-29 18s-29-8-29-18Z" fill="#CBEFE8" stroke="#14877D" stroke-width="2"/><path d="M850 676c0 9 13 16 29 16s29-7 29-16" fill="none" stroke="#14877D" stroke-width="2"/><text x="930" y="662" fill="#08766C" font-size="10" font-weight="700">CROSS-WORKLOAD HISTORY</text><text x="930" y="688" fill="#173F3D" font-size="16" font-weight="700">OneLake Delta mirror</text><text x="930" y="713" fill="#315D57" font-size="11">BI · Spark · SQL over retained events</text><circle cx="1102" cy="652" r="11" fill="#DDF3EE"/><text x="1102" y="656" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <path d="M822 680H650" stroke="#755AB5" stroke-width="2.5" marker-end="url(#eda-loop)"/><text x="736" y="669" text-anchor="middle" fill="#5A4391" font-size="10" font-weight="700">HISTORY FEEDS RECOVERY</text>
  <g data-node-id="replay-dead-letter" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Replay / dead-letter procedure"><title data-node-tooltip="true">Replay / dead-letter procedure — Reprocesses failed or delayed events back through the router.</title><rect x="472" y="628" width="178" height="138" rx="16" fill="#F4F0FC" stroke="#755AB5" stroke-width="2"/><path d="M505 684a27 27 0 1 1 11 22" fill="none" stroke="#755AB5" stroke-width="4"/><path d="M497 696l19 10-2-21" fill="#755AB5"/><text x="545" y="654" fill="#5A4391" font-size="10" font-weight="700">RECOVERY LOOP</text><text x="545" y="681" fill="#332A62" font-size="15" font-weight="700">Replay / DLQ</text><text x="492" y="732" fill="#51496D" font-size="11">Preserve id · reason · attempt</text><text x="492" y="751" fill="#51496D" font-size="11">Resubmit safely</text></g>
  <path d="M561 628V600H623V362H932V320" fill="none" stroke="#755AB5" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#eda-loop)"/><text x="633" y="618" fill="#5A4391" font-size="10" font-weight="700">RESUBMIT FOR RE-EVALUATION</text>
  <path d="M208 592V628H152V842" fill="none" stroke="#D45D31" stroke-width="2.5" marker-end="url(#eda-hot)"/><path d="M368 592V628H430V842" fill="none" stroke="#D45D31" stroke-width="2.5" marker-end="url(#eda-hot)"/>
  <g data-node-id="warning-notification-as-state" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Risk: notification treated as durable state"><title data-node-tooltip="true">Risk: notification treated as durable state — Building business logic that assumes the hot-path alert is the system of record.</title><rect x="48" y="842" width="316" height="118" rx="16" fill="#FFF1E7" stroke="#C35D1A" stroke-width="2"/><path d="M72 884l20-33 20 33Z" fill="#DD7929"/><text x="92" y="878" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">!</text><text x="128" y="866" fill="#984411" font-size="10" font-weight="700">WARNING · STATE</text><text x="128" y="891" fill="#4C291E" font-size="15" font-weight="700">Notification ≠ durable truth</text><text x="68" y="926" fill="#694537" font-size="11">Keep the authoritative event in the cold path.</text></g>
  <g data-node-id="warning-trigger-storm" role="group" filter="url(#eda-shadow)" tabindex="0" aria-label="Risk: trigger storm overwhelms batch work"><title data-node-tooltip="true">Risk: trigger storm overwhelms batch work — A burst of events fires more downstream job runs than batch-oriented systems can absorb.</title><rect x="384" y="842" width="316" height="118" rx="16" fill="#FFF1E7" stroke="#C35D1A" stroke-width="2"/><path d="M408 884l20-33 20 33Z" fill="#DD7929"/><text x="428" y="878" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">!</text><text x="464" y="866" fill="#984411" font-size="10" font-weight="700">WARNING · BURST</text><text x="464" y="891" fill="#4C291E" font-size="15" font-weight="700">Trigger storm → batch overload</text><text x="404" y="926" fill="#694537" font-size="11">Buffer, aggregate, rate-limit, and observe queue age.</text></g>
  <g transform="translate(720 842)"><rect width="412" height="118" rx="16" fill="#142D46"/><text x="22" y="27" fill="#7DE1D7" font-size="10" font-weight="700">WHAT TO WATCH</text><g fill="#FFFFFF" font-size="11"><text x="22" y="55">• Event identity and idempotency survive replay</text><text x="22" y="78">• Hot-path action latency and downstream saturation</text><text x="22" y="101">• Cold-path lag, retention, and dead-letter age</text></g></g>
  <text x="1132" y="1019" text-anchor="end" fill="#687B8C" font-size="10">Fabric Atlas original · product-neutral vector language</text>
</svg>
