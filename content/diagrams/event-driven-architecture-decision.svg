<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="event-driven-architecture-decision-title event-driven-architecture-decision-desc" data-diagram-id="event-driven-architecture-decision">
  <title id="event-driven-architecture-decision-title">Event-Driven vs. Scheduled Batch: The Decision Path</title>
  <desc id="event-driven-architecture-decision-desc">A root question asks whether the business must react within seconds of an event. If no, the path leads to a scheduled/interval pipeline. If yes, a second question asks whether the event itself is durable state that must be retained, branching to an event-driven pattern with a durable Eventhouse cold path versus a lightweight Activator-only notification pattern. A third question on the durable branch asks whether replay is required, branching to an idempotent replay design versus a simple durable log with no replay contract.</desc>
  <defs><linearGradient id="edd-head" x1="0" x2="1"><stop stop-color="#172E49"/><stop offset="1" stop-color="#106B68"/></linearGradient><filter id="edd-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102A43" flood-opacity=".14"/></filter><marker id="edd-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2D66C3"/></marker><marker id="edd-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#14877D"/></marker><marker id="edd-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#C65D22"/></marker><marker id="edd-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#7359B7"/></marker></defs>
  <rect width="1180" height="1040" fill="#F7FAFC"/><rect width="1180" height="104" fill="url(#edd-head)"/><text x="44" y="44" fill="#FFFFFF" font-size="28" font-weight="700">Event-driven, scheduled batch, or both?</text><text x="44" y="74" fill="#CBEDE9" font-size="14">Choose by reaction time, durable-state semantics, and recovery contract—not by novelty</text><g transform="translate(932 22)"><rect width="204" height="58" rx="12" fill="#FFFFFF" opacity=".12"/><text x="18" y="24" fill="#87E1D8" font-size="11" font-weight="700">THREE QUESTIONS</text><text x="18" y="44" fill="#FFFFFF" font-size="12">Latency · state · replay</text></g>
  <text x="42" y="134" fill="#596C7C" font-size="11" font-weight="700" letter-spacing="1.5">QUESTION 1 · REACTION-TIME REQUIREMENT</text>
  <g data-node-id="q-reaction-latency" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Must the business react within seconds?"><title data-node-tooltip="true">Must the business react within seconds? — The root question: reaction-time requirement.</title><rect x="312" y="150" width="556" height="122" rx="22" fill="#FFFFFF" stroke="#146A69" stroke-width="3"/><circle cx="367" cy="211" r="35" fill="#DDF5F0" stroke="#14877D" stroke-width="2"/><circle cx="367" cy="211" r="22" fill="none" stroke="#14877D" stroke-width="3"/><path d="M367 211v-15M367 211l12 8" stroke="#14877D" stroke-width="3"/><text x="420" y="188" fill="#08766C" font-size="10" font-weight="700">ROOT QUESTION · BUSINESS CLOCK</text><text x="420" y="216" fill="#172B4D" font-size="21" font-weight="700">Must the business react within seconds?</text><text x="420" y="242" fill="#445769" font-size="12">Measure required action latency—not source arrival frequency.</text></g>
  <path d="M450 272V314H218V354" fill="none" stroke="#2D66C3" stroke-width="3" marker-end="url(#edd-blue)"/><rect x="276" y="299" width="151" height="22" rx="11" fill="#E2EBFA"/><text x="351" y="314" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">NO · MINUTES/HOURS IS FINE</text>
  <path d="M730 272V314H796V354" fill="none" stroke="#14877D" stroke-width="3" marker-end="url(#edd-teal)"/><rect x="742" y="299" width="157" height="22" rx="11" fill="#DDF3EE"/><text x="820" y="314" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">YES · SECONDS REQUIRED</text>
  <g data-node-id="outcome-scheduled-batch" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Use a scheduled or interval pipeline"><title data-node-tooltip="true">Use a scheduled or interval pipeline — Minutes-to-hours latency is fine — a Data Factory pipeline schedule covers it.</title><rect x="42" y="354" width="352" height="186" rx="18" fill="#EEF4FD" stroke="#2D66C3" stroke-width="2.5"/><rect x="62" y="374" width="132" height="25" rx="12" fill="#2D66C3"/><text x="128" y="391" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">SCHEDULED PATH</text><path d="M73 432h58v58H73z" fill="#FFFFFF" stroke="#2D66C3" stroke-width="2"/><path d="M73 448h58M87 421v21M117 421v21" stroke="#2D66C3" stroke-width="3"/><circle cx="89" cy="462" r="4" fill="#2D66C3"/><circle cx="103" cy="462" r="4" fill="#2D66C3"/><circle cx="117" cy="462" r="4" fill="#2D66C3"/><text x="156" y="429" fill="#244F99" font-size="10" font-weight="700">OUTCOME</text><text x="156" y="455" fill="#172B4D" font-size="17" font-weight="700">Interval pipeline</text><text x="156" y="479" fill="#445F7D" font-size="12">Predictable windows · simpler ops</text><text x="62" y="520" fill="#244F99" font-size="10" font-weight="700">FIT · periodic loads, reports, consolidations</text><circle cx="364" cy="380" r="11" fill="#DDF3EE"/><text x="364" y="384" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text></g>
  <g data-node-id="q-durable-state" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Is the event durable business state?"><title data-node-tooltip="true">Is the event durable business state? — Second question: must the event be retained and queried later, or is it just a trigger?</title><rect x="430" y="354" width="708" height="186" rx="18" fill="#EAF8F4" stroke="#14877D" stroke-width="2.5"/><text x="454" y="382" fill="#08766C" font-size="10" font-weight="700">QUESTION 2 · STATE SEMANTICS</text><text x="454" y="412" fill="#173F3D" font-size="19" font-weight="700">Must the event be retained and queried later?</text><text x="454" y="438" fill="#42615E" font-size="12">A notification can be transient; a business fact needs durable history.</text><g transform="translate(454 463)"><rect width="310" height="54" rx="11" fill="#FFFFFF" stroke="#8FCABD"/><text x="16" y="22" fill="#08766C" font-size="10" font-weight="700">NO · TRANSIENT SIGNAL</text><text x="16" y="41" fill="#3E5A57" font-size="11">Evaluate and act; no analytical cold path</text><rect x="328" width="310" height="54" rx="11" fill="#FFFFFF" stroke="#8FCABD"/><text x="344" y="22" fill="#08766C" font-size="10" font-weight="700">YES · DURABLE BUSINESS STATE</text><text x="344" y="41" fill="#3E5A57" font-size="11">Retain, investigate, query, and recover</text></g></g>
  <path d="M610 540V580H246V622" fill="none" stroke="#C65D22" stroke-width="3" marker-end="url(#edd-orange)"/><rect x="358" y="565" width="158" height="22" rx="11" fill="#FFE5D8"/><text x="437" y="580" text-anchor="middle" fill="#A44724" font-size="10" font-weight="700">NO · TRANSIENT SIGNAL ONLY</text>
  <path d="M930 540V580H680V622" fill="none" stroke="#14877D" stroke-width="3" marker-end="url(#edd-teal)"/><rect x="737" y="565" width="178" height="22" rx="11" fill="#DDF3EE"/><text x="826" y="580" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">YES · KEEP DURABLE HISTORY</text>
  <g data-node-id="outcome-activator-only" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Activator-only notification pattern"><title data-node-tooltip="true">Activator-only notification pattern — Lightweight: evaluate and act, no durable cold-path storage.</title><rect x="42" y="622" width="408" height="166" rx="18" fill="#FFF2EA" stroke="#C65D22" stroke-width="2.5"/><circle cx="88" cy="674" r="27" fill="#C65D22"/><path d="M88 654v20l13 8" stroke="#FFFFFF" stroke-width="3" fill="none"/><path d="M75 700l13-15 13 15" stroke="#C65D22" stroke-width="3" fill="none"/><text x="132" y="653" fill="#A44724" font-size="10" font-weight="700">LIGHTWEIGHT OUTCOME</text><text x="132" y="680" fill="#4B291E" font-size="17" font-weight="700">Activator-only notification</text><text x="132" y="704" fill="#6B483A" font-size="12">Condition → action · no durable cold path</text><rect x="62" y="738" width="368" height="28" rx="13" fill="#FFE1D3"/><text x="246" y="757" text-anchor="middle" fill="#A44724" font-size="10" font-weight="700">WARNING · DELIVERY SUCCESS IS NOT BUSINESS STATE</text></g>
  <g data-node-id="outcome-event-driven-durable" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Full event-driven pattern with Eventhouse cold path"><title data-node-tooltip="true">Full event-driven pattern with Eventhouse cold path — Hot path for immediate action plus a durable Eventhouse/OneLake cold path.</title><rect x="474" y="622" width="412" height="166" rx="18" fill="#EAF8F4" stroke="#14877D" stroke-width="2.5"/><text x="496" y="651" fill="#08766C" font-size="10" font-weight="700">FULL EVENT-DRIVEN OUTCOME</text><text x="496" y="678" fill="#173F3D" font-size="17" font-weight="700">Hot action + durable cold path</text><g transform="translate(496 701)"><rect width="108" height="46" rx="10" fill="#FFF1E8" stroke="#D58A67"/><rect x="128" width="108" height="46" rx="10" fill="#EEF4FD" stroke="#8FAFE0"/><rect x="256" width="108" height="46" rx="10" fill="#FFFFFF" stroke="#83C8B9"/><path d="M108 23h20M236 23h20" stroke="#14877D" stroke-width="2" marker-end="url(#edd-teal)"/><g font-size="10" font-weight="700" text-anchor="middle"><text x="54" y="27" fill="#A44724">ACT NOW</text><text x="182" y="27" fill="#244F99">EVENTHOUSE</text><text x="310" y="27" fill="#08766C">ONELAKE</text></g></g><text x="496" y="772" fill="#08766C" font-size="10" font-weight="700">FIT · operational reaction plus historical truth</text></g>
  <path d="M886 705H922" stroke="#7359B7" stroke-width="3" marker-end="url(#edd-purple)"/><text x="904" y="690" text-anchor="middle" fill="#5A4391" font-size="9" font-weight="700">THEN</text>
  <g data-node-id="q-replay-required" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Is replay of failed/delayed events required?"><title data-node-tooltip="true">Is replay of failed/delayed events required? — Third question, on the durable branch: does the design need a replay contract?</title><rect x="922" y="622" width="216" height="166" rx="18" fill="#F4F0FC" stroke="#7359B7" stroke-width="2.5"/><path d="M946 674a26 26 0 1 1 10 21" fill="none" stroke="#7359B7" stroke-width="4"/><path d="M939 684l17 11-1-20" fill="#7359B7"/><text x="994" y="651" fill="#5A4391" font-size="10" font-weight="700">QUESTION 3</text><text x="994" y="676" fill="#332A62" font-size="16" font-weight="700">Replay required?</text><text x="942" y="723" fill="#51496D" font-size="11">Must failed or delayed events</text><text x="942" y="741" fill="#51496D" font-size="11">eventually process automatically?</text><rect x="942" y="755" width="176" height="20" rx="10" fill="#E9E0F8"/><text x="1030" y="769" text-anchor="middle" fill="#5A4391" font-size="9" font-weight="700">YES · CONTRACT / NO · MANUAL</text></g>
  <path d="M976 788V830H790V854" fill="none" stroke="#7359B7" stroke-width="2.5" marker-end="url(#edd-purple)"/><text x="857" y="820" fill="#5A4391" font-size="9" font-weight="700">YES · GUARANTEE EVENTUAL PROCESSING</text><path d="M1084 788V854" fill="none" stroke="#2D66C3" stroke-width="2.5" marker-end="url(#edd-blue)"/><text x="1097" y="824" fill="#244F99" font-size="9" font-weight="700">NO</text>
  <g data-node-id="outcome-idempotent-replay" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Idempotent replay + dead-letter design"><title data-node-tooltip="true">Idempotent replay + dead-letter design — Add an explicit idempotency key and dead-letter/replay procedure.</title><rect x="590" y="854" width="392" height="126" rx="17" fill="#F4F0FC" stroke="#7359B7" stroke-width="2"/><text x="612" y="882" fill="#5A4391" font-size="10" font-weight="700">FORMAL RECOVERY CONTRACT</text><text x="612" y="908" fill="#332A62" font-size="16" font-weight="700">Idempotent replay + dead letter</text><g fill="#51496D" font-size="11"><text x="612" y="936">Stable idempotency key · failure reason · attempt count</text><text x="612" y="956">Retry safely; observe queue age and poison events</text></g></g>
  <g data-node-id="outcome-no-replay" role="group" filter="url(#edd-shadow)" tabindex="0" aria-label="Durable log, no replay contract"><title data-node-tooltip="true">Durable log, no replay contract — Land the durable history but do not build a formal replay path.</title><rect x="1002" y="854" width="136" height="126" rx="17" fill="#EEF4FD" stroke="#2D66C3" stroke-width="2"/><text x="1020" y="881" fill="#244F99" font-size="10" font-weight="700">MANUAL</text><text x="1020" y="906" fill="#172B4D" font-size="14" font-weight="700">Durable log</text><text x="1020" y="925" fill="#172B4D" font-size="14" font-weight="700">No replay</text><text x="1020" y="950" fill="#445F7D" font-size="10">Document who</text><text x="1020" y="965" fill="#445F7D" font-size="10">recovers and how</text></g>
  <g transform="translate(42 818)"><rect width="514" height="162" rx="17" fill="#172E49"/><text x="20" y="29" fill="#7DE1D7" font-size="10" font-weight="700">DECISION COMPARISON</text><g fill="#FFFFFF" font-size="11"><text x="20" y="58">Scheduled batch</text><text x="190" y="58">Minutes/hours</text><text x="350" y="58">Simpler recovery</text><text x="20" y="86">Activator-only</text><text x="190" y="86">Seconds</text><text x="350" y="86">Transient action</text><text x="20" y="114">Full event-driven</text><text x="190" y="114">Seconds + history</text><text x="350" y="114">Replay decision</text></g><path d="M20 67H494M20 95H494" stroke="#38546F"/><rect x="20" y="130" width="474" height="20" rx="10" fill="#234663"/><text x="257" y="144" text-anchor="middle" fill="#9DE9E0" font-size="9" font-weight="700">WHAT TO WATCH · LATENCY CLAIMS WITHOUT AN ACTION OWNER</text></g>
  <text x="1138" y="1020" text-anchor="end" fill="#687B8C" font-size="10">Fabric Atlas original · product-neutral vector language</text>
</svg>
