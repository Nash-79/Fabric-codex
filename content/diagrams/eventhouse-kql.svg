<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680"
     font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <!-- Fabric teal/jade palette -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf8"/>
      <stop offset="100%" stop-color="#e4f4f0"/>
    </linearGradient>
    <linearGradient id="eventhouseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7a6e"/>
      <stop offset="100%" stop-color="#0b5e54"/>
    </linearGradient>
    <linearGradient id="kqlDbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a9e8e"/>
      <stop offset="100%" stop-color="#137a6d"/>
    </linearGradient>
    <linearGradient id="hotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b2a0"/>
      <stop offset="100%" stop-color="#008c7e"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fc4b8"/>
      <stop offset="100%" stop-color="#3aab9e"/>
    </linearGradient>
    <linearGradient id="onelakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d7d9a"/>
      <stop offset="100%" stop-color="#1c5f76"/>
    </linearGradient>
    <linearGradient id="queryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
    <linearGradient id="sourceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0e7a6e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2d7d9a"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0b5e54">Eventhouse / KQL Database — Architecture</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#5a7f79">Ingestion · Hot/Cold Storage · OneLake Availability · KQL Query Surface</text>

  <!-- ─── INGESTION SOURCES ─────────────────────────────────────────────── -->
  <g id="sources">
    <rect x="18" y="72" width="142" height="230" rx="8" fill="url(#sourceGrad)" opacity="0.92" filter="url(#shadow)"/>
    <text x="89" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#b2dfdb">DATA SOURCES</text>

    <!-- Source boxes -->
    <rect x="30" y="102" width="118" height="30" rx="5" fill="#455a64"/>
    <text x="89" y="121" text-anchor="middle" font-size="10.5" fill="#e0f2f1">Streaming Events</text>

    <rect x="30" y="140" width="118" height="30" rx="5" fill="#455a64"/>
    <text x="89" y="159" text-anchor="middle" font-size="10.5" fill="#e0f2f1">IoT / Telemetry</text>

    <rect x="30" y="178" width="118" height="30" rx="5" fill="#455a64"/>
    <text x="89" y="197" text-anchor="middle" font-size="10.5" fill="#e0f2f1">Logs &amp; Metrics</text>

    <rect x="30" y="216" width="118" height="30" rx="5" fill="#455a64"/>
    <text x="89" y="235" text-anchor="middle" font-size="10.5" fill="#e0f2f1">Eventstream</text>

    <rect x="30" y="254" width="118" height="30" rx="5" fill="#455a64"/>
    <text x="89" y="273" text-anchor="middle" font-size="10.5" fill="#e0f2f1">SDK / REST Ingest</text>
  </g>

  <!-- Ingestion arrows from sources to Eventhouse -->
  <line x1="160" y1="117" x2="212" y2="195" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)" stroke-dasharray="5,3"/>
  <line x1="160" y1="155" x2="212" y2="210" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)" stroke-dasharray="5,3"/>
  <line x1="160" y1="193" x2="212" y2="225" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)" stroke-dasharray="5,3"/>
  <line x1="160" y1="231" x2="212" y2="240" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)" stroke-dasharray="5,3"/>
  <line x1="160" y1="269" x2="212" y2="255" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)" stroke-dasharray="5,3"/>

  <!-- Ingestion label -->
  <text x="185" y="188" text-anchor="middle" font-size="9.5" fill="#0b5e54" font-style="italic">arrival-time</text>
  <text x="185" y="200" text-anchor="middle" font-size="9.5" fill="#0b5e54" font-style="italic">indexed</text>

  <!-- ─── EVENTHOUSE CONTAINER ──────────────────────────────────────────── -->
  <g id="eventhouse">
    <rect x="208" y="68" width="464" height="434" rx="10" fill="none" stroke="#0e7a6e" stroke-width="2.5" stroke-dasharray="8,4"/>
    <rect x="208" y="68" width="464" height="30" rx="10" fill="url(#eventhouseGrad)"/>
    <rect x="208" y="88" width="464" height="10" fill="url(#eventhouseGrad)"/>
    <text x="440" y="89" text-anchor="middle" font-size="12" font-weight="700" fill="white">EVENTHOUSE  —  Workspace Container</text>
    <text x="440" y="107" text-anchor="middle" font-size="10" fill="#80cbc4">Hosts multiple KQL databases · Shared capacity &amp; autoscaler · UpTime CU metering</text>

    <!-- Autoscaler badge -->
    <rect x="560" y="112" width="100" height="22" rx="5" fill="#004d40" opacity="0.85"/>
    <text x="610" y="127" text-anchor="middle" font-size="9.5" fill="#a7ffeb">Autoscaler 5–10 s cold start</text>

    <!-- ─── KQL DATABASE A ─────────────────────────────── -->
    <g id="kqldb-a">
      <rect x="222" y="132" width="210" height="280" rx="8" fill="url(#kqlDbGrad)" filter="url(#shadow)"/>
      <text x="327" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="white">KQL Database A</text>

      <!-- Hot cache -->
      <rect x="234" y="162" width="186" height="82" rx="6" fill="url(#hotGrad)"/>
      <text x="327" y="180" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">Hot Cache  (Premium Tier)</text>
      <text x="327" y="196" text-anchor="middle" font-size="9.5" fill="#e0f7fa">Caching Policy governs window</text>
      <text x="327" y="210" text-anchor="middle" font-size="9.5" fill="#e0f7fa">ADLS Premium equivalent billing</text>
      <text x="327" y="224" text-anchor="middle" font-size="9.5" fill="#e0f7fa">Fastest indexed time-series access</text>
      <text x="327" y="238" text-anchor="middle" font-size="9" fill="#b2fff8">Shorten window → lower premium spend</text>

      <!-- Cold / Retention -->
      <rect x="234" y="252" width="186" height="72" rx="6" fill="url(#coldGrad)"/>
      <text x="327" y="271" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">Full Retention  (Standard Tier)</text>
      <text x="327" y="287" text-anchor="middle" font-size="9.5" fill="#e8f5e9">Retention Policy governs depth</text>
      <text x="327" y="301" text-anchor="middle" font-size="9.5" fill="#e8f5e9">ADLS Hot equivalent billing</text>
      <text x="327" y="315" text-anchor="middle" font-size="9" fill="#c8e6c9">Complete queryable history</text>

      <!-- Tables label -->
      <rect x="234" y="332" width="186" height="34" rx="6" fill="#0b5e54" opacity="0.7"/>
      <text x="327" y="348" text-anchor="middle" font-size="10" fill="#e0f2f1">Tables · Functions</text>
      <text x="327" y="362" text-anchor="middle" font-size="9.5" fill="#b2dfdb">Materialized Views · Shortcuts (ext_table)</text>
    </g>

    <!-- ─── KQL DATABASE B ─────────────────────────────── -->
    <g id="kqldb-b">
      <rect x="446" y="132" width="210" height="186" rx="8" fill="url(#kqlDbGrad)" filter="url(#shadow)" opacity="0.88"/>
      <text x="551" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="white">KQL Database B</text>

      <rect x="458" y="162" width="186" height="52" rx="6" fill="url(#hotGrad)" opacity="0.9"/>
      <text x="551" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="white">Hot Cache</text>
      <text x="551" y="198" text-anchor="middle" font-size="9" fill="#e0f7fa">Caching Policy · Premium Tier</text>

      <rect x="458" y="222" width="186" height="46" rx="6" fill="url(#coldGrad)" opacity="0.9"/>
      <text x="551" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="white">Full Retention</text>
      <text x="551" y="257" text-anchor="middle" font-size="9" fill="#e8f5e9">Retention Policy · Standard Tier</text>

      <rect x="458" y="276" width="186" height="26" rx="6" fill="#0b5e54" opacity="0.7"/>
      <text x="551" y="294" text-anchor="middle" font-size="9.5" fill="#e0f2f1">Tables · Functions · Views</text>
    </g>

    <!-- Shared capacity note -->
    <rect x="446" y="330" width="210" height="42" rx="6" fill="#004d40" opacity="0.8"/>
    <text x="551" y="347" text-anchor="middle" font-size="9.5" fill="#a7ffeb" font-weight="600">Shared Capacity</text>
    <text x="551" y="361" text-anchor="middle" font-size="9" fill="#80cbc4">UpTime CU = active seconds × vCores</text>
    <text x="551" y="374" text-anchor="middle" font-size="9" fill="#80cbc4">Child DBs roll up to Eventhouse CU</text>

    <!-- Throttling ladder -->
    <g id="throttle">
      <rect x="446" y="382" width="210" height="90" rx="6" fill="#1a3a35" opacity="0.85"/>
      <text x="551" y="400" text-anchor="middle" font-size="10" font-weight="700" fill="#ffd54f">Throttling Stages</text>
      <rect x="458" y="406" width="186" height="16" rx="3" fill="#f57f17" opacity="0.55"/>
      <text x="551" y="418" text-anchor="middle" font-size="9" fill="#fff9c4">1 · Proactive — queries slow, ingest OK</text>
      <rect x="458" y="426" width="186" height="16" rx="3" fill="#e65100" opacity="0.6"/>
      <text x="551" y="438" text-anchor="middle" font-size="9" fill="#fff9c4">2 · Reactive — queries + ingest paused</text>
      <rect x="458" y="446" width="186" height="18" rx="3" fill="#b71c1c" opacity="0.65"/>
      <text x="551" y="459" text-anchor="middle" font-size="9" fill="#ffcdd2">3 · Extreme — data loss risk after hold</text>
    </g>

    <!-- Monitoring badge -->
    <rect x="222" y="420" width="210" height="64" rx="6" fill="#004d40" opacity="0.8"/>
    <text x="327" y="438" text-anchor="middle" font-size="10" font-weight="600" fill="#a7ffeb">Container-Level Monitoring</text>
    <text x="327" y="452" text-anchor="middle" font-size="9" fill="#80cbc4">Storage · Compute · Ingestion rates</text>
    <text x="327" y="465" text-anchor="middle" font-size="9" fill="#80cbc4">Top-queried DBs · System overview page</text>
    <text x="327" y="478" text-anchor="middle" font-size="9" fill="#4db6ac">Individual DBs expose narrower metrics</text>
  </g>

  <!-- ─── ONELAKE AVAILABILITY ──────────────────────────────────────────── -->
  <g id="onelake-section">
    <rect x="208" y="518" width="464" height="120" rx="8" fill="url(#onelakeGrad)" filter="url(#shadow)"/>
    <text x="440" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="white">OneLake  —  Delta Lake / Parquet Mirror</text>
    <text x="440" y="556" text-anchor="middle" font-size="10" fill="#b2ebf2">Enabled per-database or per-table · Retention policy governs both KQL and OneLake copies</text>

    <!-- Adaptive batching note -->
    <rect x="222" y="562" width="200" height="64" rx="6" fill="#0d4761" opacity="0.9"/>
    <text x="322" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#80deea">Adaptive Batching</text>
    <text x="322" y="593" text-anchor="middle" font-size="9" fill="#b2ebf2">Target: 200–256 MB Parquet files</text>
    <text x="322" y="607" text-anchor="middle" font-size="9" fill="#b2ebf2">Default delay: up to 3 hours</text>
    <text x="322" y="621" text-anchor="middle" font-size="9" fill="#80deea">Min delay: 5 min (small-file risk)</text>

    <!-- Delta Lake consumers -->
    <rect x="436" y="562" width="222" height="64" rx="6" fill="#0d4761" opacity="0.9"/>
    <text x="547" y="578" text-anchor="middle" font-size="10" font-weight="600" fill="#80deea">Delta Lake Consumers (no data copy)</text>
    <text x="547" y="593" text-anchor="middle" font-size="9" fill="#b2ebf2">Power BI Direct Lake mode</text>
    <text x="547" y="607" text-anchor="middle" font-size="9" fill="#b2ebf2">Warehouse · Lakehouse · Spark Notebooks</text>
    <text x="547" y="621" text-anchor="middle" font-size="9" fill="#80deea">No extra storage charge for OneLake copy</text>
  </g>

  <!-- Arrows: KQL DB A → OneLake -->
  <line x1="327" y1="502" x2="327" y2="518" stroke="#2d7d9a" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Arrows: KQL DB B → OneLake -->
  <line x1="551" y1="476" x2="551" y2="518" stroke="#2d7d9a" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ─── QUERY SURFACE ────────────────────────────────────────────────── -->
  <g id="query-surface">
    <rect x="686" y="68" width="196" height="320" rx="8" fill="url(#queryGrad)" filter="url(#shadow)"/>
    <text x="784" y="91" text-anchor="middle" font-size="11.5" font-weight="700" fill="white">Query Surface</text>

    <!-- KQL -->
    <rect x="698" y="100" width="172" height="54" rx="6" fill="#004d40"/>
    <text x="784" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a7ffeb">Native KQL</text>
    <text x="784" y="135" text-anchor="middle" font-size="9.5" fill="#80cbc4">Kusto Query Language</text>
    <text x="784" y="149" text-anchor="middle" font-size="9" fill="#4db6ac">Structured · Semi-structured · Unstructured</text>

    <!-- T-SQL -->
    <rect x="698" y="162" width="172" height="54" rx="6" fill="#004d40"/>
    <text x="784" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a7ffeb">T-SQL Endpoint</text>
    <text x="784" y="196" text-anchor="middle" font-size="9.5" fill="#80cbc4">Managed &amp; governed within Fabric</text>
    <text x="784" y="210" text-anchor="middle" font-size="9" fill="#4db6ac">BI tools connect without learning KQL</text>

    <!-- KQL Querysets -->
    <rect x="698" y="224" width="172" height="44" rx="6" fill="#004d40"/>
    <text x="784" y="243" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a7ffeb">KQL Querysets</text>
    <text x="784" y="258" text-anchor="middle" font-size="9.5" fill="#80cbc4">T-SQL access also applies here</text>

    <!-- Anomaly Detection -->
    <rect x="698" y="276" width="172" height="54" rx="6" fill="#004d40"/>
    <text x="784" y="295" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffd54f">Anomaly Detection</text>
    <text x="784" y="310" text-anchor="middle" font-size="9.5" fill="#80cbc4">Live time-series evaluated in-place</text>
    <text x="784" y="324" text-anchor="middle" font-size="9" fill="#4db6ac">No data copy · Direct from dashboards</text>

    <!-- Shortcuts note -->
    <rect x="698" y="338" width="172" height="36" rx="6" fill="#004d40"/>
    <text x="784" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="#a7ffeb">Shortcuts (External Tables)</text>
    <text x="784" y="368" text-anchor="middle" font-size="9" fill="#80cbc4">external_table() KQL function</text>
  </g>

  <!-- Query surface connection arrows from Eventhouse -->
  <line x1="672" y1="220" x2="686" y2="175" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <line x1="672" y1="270" x2="686" y2="245" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)"/>
  <line x1="672" y1="320" x2="686" y2="300" stroke="#0e7a6e" stroke-width="1.8" marker-end="url(#arrowTeal)"/>

  <!-- Access control note -->
  <g id="access-control">
    <rect x="686" y="400" width="196" height="80" rx="8" fill="#1a3a35" filter="url(#shadow)"/>
    <text x="784" y="419" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a7ffeb">Access Control</text>
    <text x="784" y="435" text-anchor="middle" font-size="9" fill="#80cbc4">Share Eventhouse → permissions cascade</text>
    <text x="784" y="449" text-anchor="middle" font-size="9" fill="#80cbc4">to all child DBs, tables, dashboards</text>
    <text x="784" y="463" text-anchor="middle" font-size="9" fill="#4db6ac">Share single DB → scoped access only</text>
    <text x="784" y="476" text-anchor="middle" font-size="9" fill="#ef9a9a">DDL ops blocked while OneLake active</text>
  </g>

  <!-- Surge protection note -->
  <g id="surge">
    <rect x="686" y="492" width="196" height="60" rx="8" fill="#1a3a35" filter="url(#shadow)"/>
    <text x="784" y="510" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffd54f">Surge Protection</text>
    <text x="784" y="526" text-anchor="middle" font-size="9" fill="#80cbc4">Workspace CU cap over 24 h window</text>
    <text x="784" y="540" text-anchor="middle" font-size="9" fill="#4db6ac">Mission-critical workspaces: exempt</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(686,562)">
    <rect width="196" height="90" rx="8" fill="#1a3a35" opacity="0.9"/>
    <text x="98" y="17" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a7ffeb">LEGEND</text>
    <line x1="10" y1="30" x2="40" y2="30" stroke="#0e7a6e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowTeal)"/>
    <text x="48" y="34" font-size="9" fill="#b2dfdb">Ingestion flow</text>
    <line x1="10" y1="46" x2="40" y2="46" stroke="#2d7d9a" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="48" y="50" font-size="9" fill="#b2dfdb">OneLake mirror</text>
    <line x1="10" y1="62" x2="40" y2="62" stroke="#0e7a6e" stroke-width="2" marker-end="url(#arrowTeal)"/>
    <text x="48" y="66" font-size="9" fill="#b2dfdb">Query path</text>
    <rect x="10" y="72" width="12" height="10" rx="2" fill="url(#hotGrad)"/>
    <text x="28" y="82" font-size="9" fill="#b2dfdb">Hot cache (premium)</text>
    <rect x="110" y="72" width="12" height="10" rx="2" fill="url(#coldGrad)"/>
    <text x="128" y="82" font-size="9" fill="#b2dfdb">Cold / retention</text>
  </g>

  <!-- Copyright line -->
  <text x="450" y="670" text-anchor="middle" font-size="9" fill="#78909c">Original diagram — Fabric Atlas. Not affiliated with or endorsed by Microsoft Corporation.</text>
</svg>
