<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="fabric-iq-ontology-architecture-title fabric-iq-ontology-architecture-desc" data-diagram-id="fabric-iq-ontology-architecture">
  <title id="fabric-iq-ontology-architecture-title">Fabric IQ Ontology: From OneLake Data to Shared Business Meaning</title>
  <desc id="fabric-iq-ontology-architecture-desc">An architecture flow: a modeler declares entity types, properties, and relationships as a logical vocabulary layer. A data-binding layer maps that vocabulary onto real OneLake sources — lakehouse tables, eventhouse streams, and semantic models — carrying schema-evolution rules, quality checks, and provenance. The bindings materialize into a queryable instance graph, a dependent Fabric item built on Graph in Microsoft Fabric that requires a tenant setting to be enabled. NL2Ontology translates natural-language questions into structured queries constrained to the published ontology&apos;s definitions, and the ontology layer routes execution to whichever backend actually holds the data. Data agents, Power BI, and apps all consume the same materialized graph. A warning node flags that upstream data changes are not automatically reflected — the graph needs an explicit refresh.</desc>
  <!-- Fabric Codex — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in claims from content/sources/fabric-iq-overview.json and
       content/sources/fabric-iq-ontology-concepts.json:
       - ontology composed of entity types/properties/relationships (fabric-iq-ontology-concepts claim 1)
       - entity type elevated above any single table (claim 2)
       - entity instance = timestamped, provenance-tracked occurrence (claim 3)
       - typed/directional relationships with attributes + cardinality (claim 4)
       - data binding maps lakehouse/eventhouse/semantic-model columns to properties (claim 5)
       - ontology graph built on Graph in Microsoft Fabric, tenant setting required (claim 6)
       - federated query routing: GQL to Graph, KQL to Eventhouse (claim 7)
       - NL2Ontology constrains queries to published definitions (claim 8)
       - manual/scheduled refresh required, not automatic (claim 9)
       - OneLake as unifying substrate (fabric-iq-overview claims re: OneLake, semantic model
         alignment, data agent grounded in semantic models/ontologies, shared items) -->
  <defs>
    <linearGradient id="oneLakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="ontGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A1F6B"/>
      <stop offset="1" stop-color="#6B3FBF"/>
    </linearGradient>
    <linearGradient id="graphGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241247"/>
      <stop offset="1" stop-color="#3A1F6B"/>
    </linearGradient>
    <linearGradient id="consumerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A4FD6"/>
      <stop offset="1" stop-color="#B87FF0"/>
    </linearGradient>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B3FBF"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="650" fill="#2E1252">Fabric IQ Ontology — The Semantic Layer Over OneLake</text>
  <g data-node-id="bi-app-consumer" role="group" tabindex="0" aria-label="Power BI &amp; applications">
    <title data-node-tooltip="true">Power BI &amp; applications — Reports and custom apps querying the same ontology, sharing one definition of business concepts with agents.</title>
    <rect x="26.0" y="41.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="40" y="64" font-size="12" fill="#616161">Business entities and relationships declared once, bound to live data, and consumed consistently by data agents, BI, and apps</text>
  </g>

  <!-- ═════════ LAYER 1: LOGICAL ONTOLOGY MODEL ═════════ -->
  <text x="40" y="96" font-size="11" letter-spacing="1.5" fill="#8A8886">1 · LOGICAL MODEL — DEFINED ONCE, REUSED EVERYWHERE</text>
  <rect x="40" y="106" width="1100" height="150" rx="10" fill="url(#ontGrad)"/>
  <text x="66" y="132" font-size="14" font-weight="650" fill="#FFFFFF">Ontology (preview) item — business vocabulary, not tables</text>

  <!-- entity type card -->
  <rect x="66" y="146" width="240" height="94" rx="8" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="186" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Entity type</text>
  <text x="186" y="186" text-anchor="middle" font-size="9.5" fill="#EAE0FA">"Customer", "Shipment" — a reusable</text>
  <g data-node-id="entity-vocabulary" role="group" tabindex="0" aria-label="Entity types, properties, relationships">
    <title data-node-tooltip="true">Entity types, properties, relationships — The logical vocabulary layer: reusable business concepts with facts and typed connections, defined above any single table.</title>
    <rect x="76.0" y="177.0" width="220" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="186" y="200" text-anchor="middle" font-size="9.5" fill="#EAE0FA">logical model elevated above any one</text>
  </g>
  <text x="186" y="214" text-anchor="middle" font-size="9.5" fill="#EAE0FA">table, with standardized name, ids,</text>
  <text x="186" y="228" text-anchor="middle" font-size="9.5" fill="#EAE0FA">properties, and constraints</text>

  <!-- properties/rules card -->
  <rect x="322" y="146" width="230" height="94" rx="8" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="437" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Properties, rules &amp; actions</text>
  <text x="437" y="186" text-anchor="middle" font-size="9.5" fill="#EAE0FA">Facts about each entity type, plus</text>
  <text x="437" y="200" text-anchor="middle" font-size="9.5" fill="#EAE0FA">constraints/rules that keep meaning</text>
  <text x="437" y="214" text-anchor="middle" font-size="9.5" fill="#EAE0FA">consistent across every team that</text>
  <text x="437" y="228" text-anchor="middle" font-size="9.5" fill="#EAE0FA">reuses the concept</text>

  <!-- relationships card -->
  <rect x="568" y="146" width="250" height="94" rx="8" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="693" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Relationships</text>
  <text x="693" y="186" text-anchor="middle" font-size="9.5" fill="#EAE0FA">Typed, directional links (e.g. Order →</text>
  <text x="693" y="200" text-anchor="middle" font-size="9.5" fill="#EAE0FA">Shipment) that can carry attributes</text>
  <text x="693" y="214" text-anchor="middle" font-size="9.5" fill="#EAE0FA">(distance, confidence, effective-at) and</text>
  <text x="693" y="228" text-anchor="middle" font-size="9.5" fill="#EAE0FA">cardinality — no hand-written joins</text>

  <!-- bootstrap card -->
  <rect x="834" y="146" width="286" height="94" rx="8" fill="#FFFFFF" fill-opacity="0.10" stroke="#B87FF0" stroke-dasharray="4 3"/>
  <text x="977" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Bootstrapped from BI</text>
  <text x="977" y="186" text-anchor="middle" font-size="9.5" fill="#EAE0FA">Ontologies can be generated or</text>
  <text x="977" y="200" text-anchor="middle" font-size="9.5" fill="#EAE0FA">aligned directly from existing Power BI</text>
  <text x="977" y="214" text-anchor="middle" font-size="9.5" fill="#EAE0FA">semantic models — production BI terms</text>
  <text x="977" y="228" text-anchor="middle" font-size="9.5" fill="#EAE0FA">carry over instead of starting fresh</text>

  <!-- connecting dots between the three logical cards -->
  <g fill="#B87FF0">
    <circle cx="313" cy="193" r="3"/>
    <circle cx="561" cy="193" r="3"/>
  </g>

  <!-- ═════════ LAYER 2: DATA BINDING ═════════ -->
  <g data-node-id="onelake-sources" role="group" tabindex="0" aria-label="OneLake data (lakehouse, eventhouse, semantic model)">
    <title data-node-tooltip="true">OneLake data (lakehouse, eventhouse, semantic model) — The concrete data an ontology binds to — lakehouse tables, eventhouse streams, and Power BI semantic models.</title>
    <rect x="26.0" y="259.0" width="391" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="40" y="282" font-size="11" letter-spacing="1.5" fill="#8A8886">2 · DATA BINDING — MAPS VOCABULARY TO CONCRETE ONELAKE DATA</text>
  </g>
  <rect x="40" y="292" width="1100" height="96" rx="10" fill="#F3EEFC" stroke="#C7A9F2"/>
  <g data-node-id="data-binding" role="group" tabindex="0" aria-label="Data binding layer">
    <title data-node-tooltip="true">Data binding layer — Maps the logical vocabulary onto real OneLake sources — columns to properties, keys to relationships.</title>
    <rect x="52.0" y="292.2" width="420" height="33" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="66" y="316" font-size="12.5" font-weight="600" fill="#3A1F6B">Data binding — columns → properties, keys → relationship links</text>
  </g>
  <text x="66" y="334" font-size="10.5" fill="#4A3B66">Carries schema-evolution rules, data-quality checks, and provenance at the concept level (not just the row).</text>
  <g data-node-id="refresh-warning" role="group" tabindex="0" aria-label="Warning: no automatic refresh">
    <title data-node-tooltip="true">Warning: no automatic refresh — Upstream source changes are not automatically reflected — the graph needs an explicit manual or scheduled refresh.</title>
    <rect x="52.0" y="327.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="66" y="350" font-size="10.5" fill="#7A5A00" font-weight="600">Not automatic: upstream source changes require an explicit manual or scheduled graph refresh before they show up.</text>
  </g>

  <!-- binding source badges -->
  <g>
    <rect x="700" y="308" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C7A9F2"/>
    <text x="765" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3A1F6B">Lakehouse tables</text>
    <text x="765" y="346" text-anchor="middle" font-size="9" fill="#6A5A80">Delta on OneLake</text>
    <text x="765" y="359" text-anchor="middle" font-size="9" fill="#6A5A80">column → property</text>

    <rect x="838" y="308" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C7A9F2"/>
    <text x="903" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3A1F6B">Eventhouse streams</text>
    <text x="903" y="346" text-anchor="middle" font-size="9" fill="#6A5A80">KQL-backed</text>
    <text x="903" y="359" text-anchor="middle" font-size="9" fill="#6A5A80">real-time facts</text>

    <rect x="976" y="308" width="140" height="60" rx="7" fill="#FFFFFF" stroke="#C7A9F2"/>
    <text x="1046" y="330" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3A1F6B">Semantic models</text>
    <text x="1046" y="346" text-anchor="middle" font-size="9" fill="#6A5A80">Power BI curated</text>
    <text x="1046" y="359" text-anchor="middle" font-size="9" fill="#6A5A80">analytics layer</text>
  </g>

  <!-- arrow from layer1 to layer2 -->
  <line x1="590" y1="256" x2="590" y2="290" stroke="#6B3FBF" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- ═════════ LAYER 3: ONELAKE + INSTANCE GRAPH ═════════ -->
  <text x="40" y="416" font-size="11" letter-spacing="1.5" fill="#8A8886">3 · ONELAKE SUBSTRATE + QUERYABLE INSTANCE GRAPH</text>

  <!-- OneLake block -->
  <rect x="40" y="426" width="470" height="150" rx="10" fill="url(#oneLakeGrad)"/>
  <text x="66" y="452" font-size="13.5" font-weight="650" fill="#FFFFFF">OneLake — unifying data substrate</text>
  <text x="66" y="472" font-size="10" fill="#DFF7F0">Not a formal IQ workload item, but every IQ item relies on it.</text>
  <text x="66" y="488" font-size="10" fill="#DFF7F0">Unifies clouds and on-prem sources via shortcuts, mirroring,</text>
  <text x="66" y="504" font-size="10" fill="#DFF7F0">and the OneLake catalog — the same governed data grounds</text>
  <text x="66" y="520" font-size="10" fill="#DFF7F0">semantic models, ontologies, and agents alike.</text>
  <rect x="66" y="532" width="130" height="30" rx="5" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="131" y="551" text-anchor="middle" font-size="9.5" fill="#FFFFFF">Shortcuts</text>
  <rect x="204" y="532" width="130" height="30" rx="5" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="269" y="551" text-anchor="middle" font-size="9.5" fill="#FFFFFF">Mirroring</text>
  <rect x="342" y="532" width="140" height="30" rx="5" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="412" y="551" text-anchor="middle" font-size="9.5" fill="#FFFFFF">OneLake catalog</text>

  <!-- Instance graph block -->
  <rect x="530" y="426" width="610" height="150" rx="10" fill="url(#graphGrad)"/>
  <text x="556" y="452" font-size="13.5" font-weight="650" fill="#FFFFFF">Ontology graph — a materialized, dependent Fabric item</text>
  <text x="556" y="472" font-size="10" fill="#E2D5FA">Nodes = entity instances (timestamped, provenance-tracked occurrences);</text>
  <g data-node-id="instance-graph" role="group" tabindex="0" aria-label="Ontology instance graph">
    <title data-node-tooltip="true">Ontology instance graph — A materialized, queryable graph of entity instances and relationship edges, built on Graph in Microsoft Fabric.</title>
    <rect x="542.0" y="465.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="556" y="488" font-size="10" fill="#E2D5FA">edges = asserted/derived links with metadata. Built on Graph in Microsoft</text>
  </g>
  <text x="556" y="504" font-size="10" fill="#E2D5FA">Fabric — a tenant setting that must be enabled before graph features work.</text>
  <rect x="556" y="516" width="270" height="46" rx="6" fill="#FFFFFF" fill-opacity="0.10" stroke="#8A4FD6"/>
  <g data-node-id="query-routing" role="group" tabindex="0" aria-label="Federated query routing">
    <title data-node-tooltip="true">Federated query routing — Routes a business-level query to whichever backend actually holds the data — GQL against Graph, KQL against Eventhouse.</title>
    <rect x="612.5" y="511.0" width="157" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="691" y="534" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">Federated query routing</text>
  </g>
  <text x="691" y="550" text-anchor="middle" font-size="9" fill="#E2D5FA">GQL → Graph  ·  KQL → Eventhouse</text>
  <rect x="838" y="516" width="278" height="46" rx="6" fill="#FFFFFF" fill-opacity="0.10" stroke="#8A4FD6"/>
  <g data-node-id="nl2ontology" role="group" tabindex="0" aria-label="NL2Ontology">
    <title data-node-tooltip="true">NL2Ontology — Translates a natural-language business question into a structured query constrained to the ontology&apos;s definitions.</title>
    <rect x="929.0" y="511.0" width="96" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="977" y="534" text-anchor="middle" font-size="10" font-weight="600" fill="#FFFFFF">NL2Ontology</text>
  </g>
  <text x="977" y="550" text-anchor="middle" font-size="9" fill="#E2D5FA">NL question → query constrained to published definitions</text>

  <!-- arrow OneLake -> graph -->
  <line x1="510" y1="500" x2="528" y2="500" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <!-- arrow layer2 -> layer3 -->
  <line x1="275" y1="388" x2="275" y2="424" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="835" y1="388" x2="835" y2="424" stroke="#6B3FBF" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- ═════════ LAYER 4: CONSUMERS ═════════ -->
  <text x="40" y="612" font-size="11" letter-spacing="1.5" fill="#8A8886">4 · CONSUMED CONSISTENTLY BY PEOPLE AND AGENTS</text>
  <rect x="40" y="622" width="1100" height="100" rx="10" fill="url(#consumerGrad)"/>

  <rect x="66" y="638" width="250" height="68" rx="7" fill="#FFFFFF" fill-opacity="0.16"/>
  <g data-node-id="data-agent-consumer" role="group" tabindex="0" aria-label="Fabric data agent">
    <title data-node-tooltip="true">Fabric data agent — A conversational agent grounded in the ontology, answering natural-language questions with consistent business meaning.</title>
    <rect x="122.5" y="636.0" width="137" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="191" y="659" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Fabric data agent</text>
  </g>
  <text x="191" y="676" text-anchor="middle" font-size="9.5" fill="#F5EBFF">NL Q&amp;A grounded in semantic</text>
  <text x="191" y="690" text-anchor="middle" font-size="9.5" fill="#F5EBFF">models + ontology, not raw schema</text>

  <rect x="330" y="638" width="250" height="68" rx="7" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="455" y="659" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Operations agent (preview)</text>
  <text x="455" y="676" text-anchor="middle" font-size="9.5" fill="#F5EBFF">Reasons over business concepts to</text>
  <text x="455" y="690" text-anchor="middle" font-size="9.5" fill="#F5EBFF">monitor data and trigger governed actions</text>

  <rect x="594" y="638" width="250" height="68" rx="7" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="719" y="659" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Power BI / semantic model</text>
  <text x="719" y="676" text-anchor="middle" font-size="9.5" fill="#F5EBFF">Same business terms and KPIs as</text>
  <text x="719" y="690" text-anchor="middle" font-size="9.5" fill="#F5EBFF">reports, agents, and apps</text>

  <rect x="858" y="638" width="250" height="68" rx="7" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="983" y="659" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">M365 / Foundry / Copilot Studio</text>
  <text x="983" y="676" text-anchor="middle" font-size="9.5" fill="#F5EBFF">Published, cross-domain reasoning</text>
  <text x="983" y="690" text-anchor="middle" font-size="9.5" fill="#F5EBFF">(e.g. Order → Shipment → sensor breach)</text>

  <!-- arrow layer3 -> layer4 -->
  <line x1="835" y1="578" x2="835" y2="620" stroke="#8A4FD6" stroke-width="2" marker-end="url(#arrGray)"/>

  <!-- footer -->
  <text x="1140" y="748" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Codex — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
