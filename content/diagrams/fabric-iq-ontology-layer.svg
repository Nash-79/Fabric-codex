<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in claims from content/sources/fabric-iq-overview.json (capability: fabric-iq):
       - Fabric IQ is one of four Microsoft IQ pillars (Work IQ, Foundry IQ, Web IQ); its role is
         business-entity and data context.
       - Fabric IQ delivers unified data / business intelligence / operational intelligence
         through two core items: the ontology (preview) and the semantic model.
       - Ontologies can be generated/aligned directly from production Power BI semantic models.
       - The ontology item defines entities, relationships, properties, rules, actions, and
         exposes NL2Ontology (business questions -> structured queries).
       - Without a shared ontology, AI is unfit for high-stakes decisions (manual translation
         from raw tables/schemas is required every time) — antipattern claim.
       - Stated benefits: cross-domain reasoning via graph traversal, faster onboarding
         (concepts declared once), governance (consistent definitions across teams).
       - The IQ (preview) workload groups Plan (preview), Graph, Data agent, Operations agent
         (preview) alongside ontology + semantic model.
       - A Fabric data agent answers NL questions for a domain, grounded in semantic
         models/ontologies, publishable to Microsoft 365, Foundry, Copilot Studio, custom apps.
       - An operations agent (preview) reasons across business concepts to monitor real-time
         data, detect anomalies, and recommend/trigger governed actions; shared with RTI.
       - Fabric items can belong to multiple workloads at once (semantic model <-> Power BI;
         Graph & operations agent <-> Real-Time Intelligence).
       - OneLake underlies Fabric IQ as the unifying substrate (shortcuts, mirroring, catalog);
         it is not formally listed as an IQ workload item but every IQ item relies on it. -->
  <defs>
    <linearGradient id="oneLakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0B5E50"/>
      <stop offset="0.5" stop-color="#117865"/>
      <stop offset="1"   stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="ontologyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B2A86"/>
      <stop offset="1" stop-color="#8756B5"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F6CBD"/>
      <stop offset="1" stop-color="#3A96DD"/>
    </linearGradient>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8756B5"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A96DD"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="42" font-size="22" font-weight="650" fill="#063D3B">Fabric IQ — the Ontology / Semantic Layer</text>
  <text x="40" y="64" font-size="12" fill="#616161">Business concepts, relationships and rules modeled on top of existing data — no data movement — so AI agents reason from defined meaning, not raw schemas</text>

  <!-- ═══════════════════════════════════════════════
       ROW 1: Microsoft IQ family context strip
       ═══════════════════════════════════════════ -->
  <text x="40" y="98" font-size="11" letter-spacing="1.5" fill="#8A8886">MICROSOFT IQ — ENTERPRISE INTELLIGENCE LAYER (FABRIC IQ IS ONE OF FOUR PILLARS)</text>
  <rect x="40" y="108" width="1122" height="66" rx="9" fill="#F3F2F1" stroke="#C8C6C4"/>
  <rect x="60" y="120" width="255" height="42" rx="7" fill="url(#ontologyGrad)"/>
  <text x="187" y="138" text-anchor="middle" font-size="11.5" font-weight="650" fill="#FFFFFF">Fabric IQ</text>
  <text x="187" y="153" text-anchor="middle" font-size="9.5" fill="#F3EBFA">Business-entity &amp; data context</text>

  <rect x="330" y="120" width="255" height="42" rx="7" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="457" y="138" text-anchor="middle" font-size="11.5" font-weight="650" fill="#424242">Work IQ</text>
  <text x="457" y="153" text-anchor="middle" font-size="9.5" fill="#797775">Employee work context</text>

  <rect x="600" y="120" width="255" height="42" rx="7" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="727" y="138" text-anchor="middle" font-size="11.5" font-weight="650" fill="#424242">Foundry IQ</text>
  <text x="727" y="153" text-anchor="middle" font-size="9.5" fill="#797775">Org policy / document context</text>

  <rect x="870" y="120" width="272" height="42" rx="7" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text x="1006" y="138" text-anchor="middle" font-size="11.5" font-weight="650" fill="#424242">Web IQ</text>
  <text x="1006" y="153" text-anchor="middle" font-size="9.5" fill="#797775">Web context</text>

  <!-- ═══════════════════════════════════════════════
       ROW 2: two core Fabric IQ items — Semantic model + Ontology
       ═══════════════════════════════════════════ -->
  <text x="40" y="204" font-size="11" letter-spacing="1.5" fill="#8A8886">TWO CORE FABRIC IQ ITEMS — DELIVERING UNIFIED DATA, BUSINESS INTELLIGENCE &amp; OPERATIONAL INTELLIGENCE</text>

  <rect x="40" y="214" width="560" height="150" rx="10" fill="#EAF7F2" stroke="#117865" stroke-width="1.5"/>
  <text x="320" y="240" text-anchor="middle" font-size="14" font-weight="650" fill="#063D3B">Semantic model (existing Power BI item)</text>
  <text x="320" y="260" text-anchor="middle" font-size="11" fill="#3F6259">Curated analytics layer — measures, relationships, business-friendly fields</text>
  <rect x="60" y="272" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="320" y="293" text-anchor="middle" font-size="10.5" fill="#424242">Shared with the Power BI workload — items can belong to multiple workloads at once</text>
  <rect x="60" y="312" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="320" y="330" text-anchor="middle" font-size="10.5" fill="#424242">Production BI investments bootstrap the ontology</text>
  <text x="320" y="345" text-anchor="middle" font-size="10.5" fill="#424242">instead of starting from scratch</text>

  <line x1="600" y1="290" x2="656" y2="290" stroke="#8756B5" stroke-width="2.2" marker-end="url(#arrPurple)"/>
  <text x="628" y="278" text-anchor="middle" font-size="9" fill="#5B2A86">generate /</text>
  <text x="628" y="308" text-anchor="middle" font-size="9" fill="#5B2A86">align</text>

  <rect x="656" y="214" width="506" height="150" rx="10" fill="url(#ontologyGrad)"/>
  <text x="909" y="240" text-anchor="middle" font-size="14" font-weight="650" fill="#FFFFFF">Ontology (preview) — business vocabulary</text>
  <text x="909" y="260" text-anchor="middle" font-size="11" fill="#E8D9F5">Entities, relationships, properties, rules, and actions defined once</text>
  <rect x="676" y="272" width="466" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="909" y="293" text-anchor="middle" font-size="10.5" fill="#F3EBFA">Exposes NL2Ontology — converts business questions into structured queries</text>
  <rect x="676" y="312" width="466" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="909" y="330" text-anchor="middle" font-size="10.5" fill="#F3EBFA">Enables cross-domain reasoning via graph traversal</text>
  <text x="909" y="345" text-anchor="middle" font-size="10.5" fill="#F3EBFA">(e.g. Order → Shipment → sensor → cold-chain breach)</text>

  <!-- ═══════════════════════════════════════════════
       ROW 3: antipattern callout — without a shared ontology
       ═══════════════════════════════════════════ -->
  <rect x="40" y="376" width="1122" height="56" rx="8" fill="#FDF3F2" stroke="#D0554B" stroke-width="1.2"/>
  <text x="60" y="397" font-size="11.5" font-weight="650" fill="#B02E24">Without a shared ontology layer</text>
  <text x="60" y="415" font-size="10.5" fill="#7A2A22">AI systems are described as unfit for high-stakes decisions — every business question otherwise requires manual translation by a domain expert from raw tables/schemas into business concepts.</text>

  <!-- ═══════════════════════════════════════════════
       ROW 4: IQ (preview) workload items
       ═══════════════════════════════════════════ -->
  <text x="40" y="458" font-size="11" letter-spacing="1.5" fill="#8A8886">IQ (PREVIEW) WORKLOAD — ITEMS GROUPED AROUND THE ONTOLOGY (MOST SHARED WITH OTHER WORKLOADS)</text>

  <rect x="40" y="468" width="1122" height="92" rx="9" fill="#F8F5FC" stroke="#D9C7EE"/>

  <rect x="60" y="480" width="255" height="68" rx="7" fill="#FFFFFF" stroke="#8756B5" stroke-width="1.2"/>
  <text x="187" y="500" text-anchor="middle" font-size="11.5" font-weight="650" fill="#5B2A86">Plan (preview)</text>
  <text x="187" y="517" text-anchor="middle" font-size="9.5" fill="#424242">Planning &amp; forecasting</text>
  <text x="187" y="532" text-anchor="middle" font-size="9" fill="#797775">IQ workload item</text>

  <rect x="330" y="480" width="255" height="68" rx="7" fill="#FFFFFF" stroke="#8756B5" stroke-width="1.2"/>
  <text x="457" y="500" text-anchor="middle" font-size="11.5" font-weight="650" fill="#5B2A86">Graph</text>
  <text x="457" y="517" text-anchor="middle" font-size="9.5" fill="#424242">Stores &amp; traverses connected data</text>
  <text x="457" y="532" text-anchor="middle" font-size="9" fill="#797775">shared with Real-Time Intelligence</text>

  <rect x="600" y="480" width="255" height="68" rx="7" fill="#FFFFFF" stroke="#3A96DD" stroke-width="1.2"/>
  <text x="727" y="500" text-anchor="middle" font-size="11.5" font-weight="650" fill="#0F6CBD">Data agent</text>
  <text x="727" y="517" text-anchor="middle" font-size="9.5" fill="#424242">NL Q&amp;A grounded in semantic</text>
  <text x="727" y="530" text-anchor="middle" font-size="9.5" fill="#424242">models &amp; ontologies</text>

  <rect x="870" y="480" width="272" height="68" rx="7" fill="#FFFFFF" stroke="#3A96DD" stroke-width="1.2"/>
  <text x="1006" y="500" text-anchor="middle" font-size="11.5" font-weight="650" fill="#0F6CBD">Operations agent (preview)</text>
  <text x="1006" y="517" text-anchor="middle" font-size="9.5" fill="#424242">Monitors live data, flags anomalies,</text>
  <text x="1006" y="530" text-anchor="middle" font-size="9.5" fill="#424242">triggers governed actions</text>
  <text x="1006" y="543" text-anchor="middle" font-size="9" fill="#797775">shared with Real-Time Intelligence</text>

  <!-- connecting arrows from ontology row down into workload items row -->
  <line x1="909" y1="364" x2="909" y2="468" stroke="#8756B5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrPurple)"/>
  <text x="920" y="420" font-size="9.5" fill="#5B2A86">grouped in the IQ workload</text>

  <!-- ═══════════════════════════════════════════════
       ROW 5: AI experiences fed by the ontology
       ═══════════════════════════════════════════ -->
  <text x="40" y="596" font-size="11" letter-spacing="1.5" fill="#8A8886">AI EXPERIENCES — NAVIGATE DEFINED MEANING, NOT RAW SCHEMAS</text>

  <rect x="40" y="606" width="1122" height="80" rx="9" fill="url(#aiGrad)"/>
  <text x="601" y="632" text-anchor="middle" font-size="13" font-weight="650" fill="#FFFFFF">Fabric data agent &amp; Copilot experiences</text>
  <text x="601" y="652" text-anchor="middle" font-size="10.5" fill="#DCEEFB">Virtual analyst for a domain, grounded in semantic models and ontologies — publishable to Microsoft 365, Foundry, Copilot Studio, and custom apps</text>
  <text x="601" y="670" text-anchor="middle" font-size="10.5" fill="#DCEEFB">Benefits: faster onboarding (concepts declared once) and governance (consistent definitions enforced across teams)</text>

  <!-- arrows: workload items row -> AI experiences row -->
  <line x1="727" y1="548" x2="700" y2="606" stroke="#3A96DD" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="1006" y1="548" x2="950" y2="606" stroke="#3A96DD" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="187" y1="548" x2="350" y2="606" stroke="#3A96DD" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrBlue)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 6: OneLake substrate — foundation band
       ═══════════════════════════════════════════ -->
  <text x="40" y="716" font-size="11" letter-spacing="1.5" fill="#8A8886">FOUNDATION — EXISTING DATA, UNCHANGED</text>
  <rect x="40" y="726" width="1122" height="92" rx="10" fill="url(#oneLakeGrad)"/>
  <text x="70" y="752" font-size="14" font-weight="650" fill="#FFFFFF">OneLake — the unifying data substrate</text>
  <text x="70" y="772" font-size="10.5" fill="#C8F0E8">Not formally listed as an IQ workload item, but every IQ item relies on and interacts natively with OneLake data tables</text>
  <text x="70" y="789" font-size="10.5" fill="#C8F0E8">Reached across clouds and on-premises via shortcuts, mirroring, and the OneLake catalog — the same governed data grounds models, ontologies, and agents</text>
  <text x="70" y="806" font-size="9.5" fill="#9FE0D2">No data duplication: the ontology models meaning on top of tables that already live in OneLake</text>

  <!-- arrows up from OneLake into the two core items -->
  <line x1="320" y1="726" x2="320" y2="364" stroke="#2AAC94" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrTeal)"/>
  <line x1="909" y1="726" x2="909" y2="364" stroke="#2AAC94" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrTeal)"/>
  <rect x="30" y="700" width="300" height="18" fill="#FFFFFF" opacity="0.001"/>
  <text x="335" y="700" font-size="9.5" fill="#3F6259" font-style="italic">grounded in existing OneLake tables — no data movement</text>

  <!-- footer -->
  <text x="1162" y="893" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset; conceptual (L1–L2), grounded in fabric-iq-overview.json.</text>
</svg>
