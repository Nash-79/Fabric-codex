<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="fabric-spark-vs-warehouse-engine-boundary-title fabric-spark-vs-warehouse-engine-boundary-desc" data-diagram-id="fabric-spark-vs-warehouse-engine-boundary">
  <title id="fabric-spark-vs-warehouse-engine-boundary-title">Spark, Warehouse and the SQL analytics endpoint: where the engine boundary sits</title>
  <desc id="fabric-spark-vs-warehouse-engine-boundary-desc">Architectural engine boundary in Microsoft Fabric: Shared OneLake Delta storage, Spark vs Polaris vs SQL Analytics Endpoint, and workload placement decision matrix.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="bnd-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A2170"/>
      <stop offset="0.5" stop-color="#7C3AAD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Storage Gradient -->
    <linearGradient id="bnd-storage-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="bnd-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4A2170" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="bnd-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0284C7"/>
    </marker>
    <marker id="bnd-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AAD"/>
    </marker>
    <marker id="bnd-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>

    <!-- Official Microsoft Warehouse Item Icon Gradients -->
    <linearGradient id="bnd-wh-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="bnd-wh-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="bnd-wh-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="bnd-wh-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="940" fill="#FAF5FF"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#bnd-head)"/>
  <g data-official-icon="microsoft" data-icon-name="warehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#bnd-wh-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#bnd-wh-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#bnd-wh-c)" d="M8 8h7v7H8zM17 8h7v7h-7zM8 17h7v7H8zM17 17h7v7h-7z"/>
      <path fill="url(#bnd-wh-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Fabric Engine Boundary: Spark, Warehouse &amp; SQL Analytics Endpoint</text>
  <text x="40" y="64" font-size="12" fill="#E9D8FD">Two compute engines, one shared Delta copy — Spark is a configuration problem; Warehouse is a data modelling problem</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#E9D8FD"/>
    <circle cx="20" cy="15" r="5" fill="#0284C7"/><text x="32" y="19" fill="#0369A1" font-weight="600">Unified OneLake Storage Foundation</text>
    <circle cx="270" cy="15" r="5" fill="#7C3AAD"/><text x="282" y="19" fill="#4C1D95" font-weight="600">The Three Compute Engine Surfaces</text>
    <circle cx="560" cy="15" r="5" fill="#059669"/><text x="572" y="19" fill="#065F46" font-weight="600">Workload Placement Decisions</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: UNIFIED ONELAKE STORAGE (STORAGE)                                 -->
  <!-- ========================================================================= -->
  <g data-node-id="storage" role="group" tabindex="0" aria-label="Shared OneLake Delta tables">
    <title data-node-tooltip="true">Shared OneLake Delta tables — Both engines operate over the same OneLake Delta tables with no data copy.</title>
    <rect x="40" y="146" width="1120" height="116" rx="12" fill="url(#bnd-storage-grad)" stroke="#0284C7" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="56" y="158" width="160" height="18" rx="9" fill="#E0F2FE"/><text x="136" y="171" text-anchor="middle" font-size="9" font-weight="700" fill="#0369A1">ZERO-COPY LAKEHOUSE</text>
    <text x="56" y="200" font-size="16" font-weight="700" fill="#FFFFFF">1 · Shared OneLake Delta Tables (Parquet + Transaction Log)</text>
    <text x="56" y="222" font-size="10" fill="#E0F2FE">• Both Spark and Polaris query the exact same physical Parquet files in OneLake without data movement, duplication, or ETL syncing</text>
    <text x="56" y="238" font-size="10" fill="#BAE6FD">• ACID transaction log ensures serialized table snapshot isolation across simultaneous readers and writers</text>
    <rect x="1080" y="158" width="52" height="16" rx="8" fill="#E0F2FE"/><text x="1106" y="170" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369A1">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: THE 3 COMPUTE SURFACES (SPARK ➔ POLARIS ➔ ENDPOINT)               -->
  <!-- ========================================================================= -->
  <rect x="40" y="280" width="1120" height="280" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.4"/>
  <rect x="56" y="290" width="410" height="20" rx="10" fill="#EDE9FE"/>
  <text x="66" y="304" font-size="10.5" font-weight="700" fill="#4C1D95" letter-spacing="1px">STAGE 2: THREE DISTINCT COMPUTE ARCHITECTURAL PARADIGMS</text>

  <!-- Surface 1: spark -->
  <g data-node-id="spark" role="group" tabindex="0" aria-label="Spark — you own the compute shape">
    <title data-node-tooltip="true">Spark — you own the compute shape — Spark exposes the compute shape and expects you to tune it.</title>
    <rect x="56" y="318" width="350" height="226" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="68" y="328" width="120" height="16" rx="8" fill="#EDE9FE"/><text x="128" y="339" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">EXPLICIT COMPUTE</text>
    <text x="68" y="362" font-size="13" font-weight="700" fill="#4C1D95">2 · Spark Engine</text>
    <text x="68" y="384" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Compute Model:</tspan> Explicit pool sizing</text>
    <text x="68" y="398" font-size="9.5" fill="#5B21B6">  (node count, autoscale, executor memory)</text>
    <text x="68" y="418" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Acceleration:</tspan> Native Execution Engine</text>
    <text x="68" y="432" font-size="9.5" fill="#5B21B6">  (Gluten + Velox C++ SIMD vectorization)</text>
    <text x="68" y="452" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Write Power:</tspan> V-Order Parquet compaction</text>
    <text x="68" y="466" font-size="9.5" fill="#5B21B6">  optimized for Direct Lake BI queries</text>
    <rect x="340" y="328" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="366" y="338" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Surface 2: polaris -->
  <g data-node-id="polaris" role="group" tabindex="0" aria-label="Polaris — autonomous, serverless compute">
    <title data-node-tooltip="true">Polaris — autonomous, serverless compute — The Warehouse engine is serverless and autonomous, with no pool to size.</title>
    <rect x="426" y="318" width="350" height="226" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="438" y="328" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="503" y="339" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">AUTONOMOUS DQP</text>
    <text x="438" y="362" font-size="13" font-weight="700" fill="#1E3A8A">3 · Polaris Engine (Warehouse)</text>
    <text x="438" y="384" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Compute Model:</tspan> 100% Serverless</text>
    <text x="438" y="398" font-size="9.5" fill="#1E40AF">  (No clusters, no VM shapes to manage)</text>
    <text x="438" y="418" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Data Cells:</tspan> Dataset abstracted as grid</text>
    <text x="438" y="432" font-size="9.5" fill="#1E40AF">  of data cells; tasks scheduled dynamically</text>
    <text x="438" y="452" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">ACID Transactions:</tspan> Multi-table transactions</text>
    <text x="438" y="466" font-size="9.5" fill="#1E40AF">  with full DDL/DML enterprise SQL support</text>
    <rect x="710" y="328" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="736" y="338" text-anchor="middle" font-size="8" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Surface 3: endpoint -->
  <g data-node-id="endpoint" role="group" tabindex="0" aria-label="SQL analytics endpoint — read only">
    <title data-node-tooltip="true">SQL analytics endpoint — read only — The SQL analytics endpoint is a read-only T-SQL surface over Lakehouse tables.</title>
    <rect x="796" y="318" width="348" height="226" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="808" y="328" width="130" height="16" rx="8" fill="#FEF3C7"/><text x="873" y="339" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">READ-ONLY T-SQL</text>
    <text x="808" y="362" font-size="13" font-weight="700" fill="#78350F">4 · SQL Analytics Endpoint</text>
    <text x="808" y="384" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Surface:</tspan> Read-only T-SQL query layer</text>
    <text x="808" y="398" font-size="9.5" fill="#92400E">  automatically provisioned on Lakehouse</text>
    <text x="808" y="418" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Engine:</tspan> Shares Polaris DQP backend</text>
    <text x="808" y="432" font-size="9.5" fill="#92400E">  with the Fabric Warehouse</text>
    <text x="808" y="452" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Governance:</tspan> Views, table-valued funcs,</text>
    <text x="808" y="466" font-size="9.5" fill="#92400E">  and column/row level security</text>
    <rect x="1078" y="328" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="1104" y="338" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: WORKLOAD PLACEMENT GUIDE (TOSPARK ➔ TOWAREHOUSE ➔ TOENDPOINT)     -->
  <!-- ========================================================================= -->
  <rect x="40" y="578" width="1120" height="312" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.4"/>
  <rect x="56" y="588" width="410" height="20" rx="10" fill="#DCFCE7"/>
  <text x="66" y="602" font-size="10.5" font-weight="700" fill="#166534" letter-spacing="1px">STAGE 3: WORKLOAD PLACEMENT DECISION MATRIX</text>

  <!-- Decision 1: toSpark -->
  <g data-node-id="toSpark" role="group" tabindex="0" aria-label="Send to Spark">
    <title data-node-tooltip="true">Send to Spark — Transformation, machine learning and gold writes belong in Spark.</title>
    <rect x="56" y="618" width="350" height="256" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="68" y="628" width="120" height="16" rx="8" fill="#DCFCE7"/><text x="128" y="639" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">WHEN TO USE SPARK</text>
    <text x="68" y="662" font-size="13" font-weight="700" fill="#14532D">5 · Send to Spark</text>
    <text x="68" y="684" font-size="9.5" fill="#166534">• Heavy ETL / ELT batch transformations</text>
    <text x="68" y="702" font-size="9.5" fill="#166534">• Complex semi-structured (JSON/XML) parsing</text>
    <text x="68" y="720" font-size="9.5" fill="#166534">• Machine Learning (MLflow, SynapseML, PyTorch)</text>
    <text x="68" y="738" font-size="9.5" fill="#166534">• <tspan font-weight="700">Direct Lake Gold Writes:</tspan> V-Order is applied</text>
    <text x="68" y="752" font-size="9.5" fill="#166534">  only on Spark write path to maximize BI speeds</text>
    <rect x="68" y="774" width="326" height="84" rx="6" fill="#FFFFFF" stroke="#BBF7D0"/>
    <text x="76" y="792" font-size="9" font-weight="700" fill="#15803D">Architectural Rationale:</text>
    <text x="76" y="808" font-size="8.5" fill="#166534">Distributed shuffles, large joins, and Python ecosystem</text>
    <text x="76" y="822" font-size="8.5" fill="#166534">thrive on explicitly sized Spark memory &amp; executors.</text>
    <rect x="340" y="628" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="366" y="638" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">PATTERN</text>
  </g>

  <!-- Decision 2: toWarehouse -->
  <g data-node-id="toWarehouse" role="group" tabindex="0" aria-label="Send to Warehouse">
    <title data-node-tooltip="true">Send to Warehouse — T-SQL transformations with multi-table transactions belong in the Warehouse.</title>
    <rect x="426" y="618" width="350" height="256" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="438" y="628" width="140" height="16" rx="8" fill="#DCFCE7"/><text x="508" y="639" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">WHEN TO USE WAREHOUSE</text>
    <text x="438" y="662" font-size="13" font-weight="700" fill="#14532D">6 · Send to Warehouse</text>
    <text x="438" y="684" font-size="9.5" fill="#166534">• Enterprise data marts built with pure T-SQL</text>
    <text x="438" y="702" font-size="9.5" fill="#166534">• Multi-table ACID cross-table transactions</text>
    <text x="438" y="720" font-size="9.5" fill="#166534">• Complex stored procedures &amp; transactional DML</text>
    <text x="438" y="738" font-size="9.5" fill="#166534">• Teams with deep SQL / DBA expertise</text>
    <rect x="438" y="774" width="326" height="84" rx="6" fill="#FFFFFF" stroke="#BBF7D0"/>
    <text x="446" y="792" font-size="9" font-weight="700" fill="#15803D">Architectural Rationale:</text>
    <text x="446" y="808" font-size="8.5" fill="#166534">Autonomous workload management eliminates cluster</text>
    <text x="446" y="822" font-size="8.5" fill="#166534">tuning — performance relies on clean star schema modeling.</text>
    <rect x="710" y="628" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="736" y="638" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">FACT</text>
  </g>

  <!-- Decision 3: toEndpoint -->
  <g data-node-id="toEndpoint" role="group" tabindex="0" aria-label="Send to the endpoint">
    <title data-node-tooltip="true">Send to the endpoint — BI serving and analyst queries belong on the read-only endpoint.</title>
    <rect x="796" y="618" width="348" height="256" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#bnd-shadow)"/>
    <rect x="808" y="628" width="140" height="16" rx="8" fill="#DCFCE7"/><text x="878" y="639" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">WHEN TO USE ENDPOINT</text>
    <text x="808" y="662" font-size="13" font-weight="700" fill="#14532D">7 · Send to SQL Endpoint</text>
    <text x="808" y="684" font-size="9.5" fill="#166534">• Power BI Direct Lake &amp; Import semantic models</text>
    <text x="808" y="702" font-size="9.5" fill="#166534">• Ad hoc analyst T-SQL queries over Lakehouse</text>
    <text x="808" y="720" font-size="9.5" fill="#166534">• Reporting views, functions &amp; column/row security</text>
    <text x="808" y="738" font-size="9.5" fill="#166534">• <tspan font-weight="700">Anti-Pattern:</tspan> Do not write transformation ETL here</text>
    <rect x="808" y="774" width="324" height="84" rx="6" fill="#FFFFFF" stroke="#BBF7D0"/>
    <text x="816" y="792" font-size="9" font-weight="700" fill="#15803D">Architectural Rationale:</text>
    <text x="816" y="808" font-size="8.5" fill="#166534">Read-only layer delivers sub-second BI query speed</text>
    <text x="816" y="822" font-size="8.5" fill="#166534">over OneLake without spinning up Spark sessions.</text>
    <rect x="1078" y="628" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="1104" y="638" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">PATTERN</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="910" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft Fabric Warehouse, Polaris VLDB Paper &amp; Spark Runtime Architecture.</text>
</svg>
