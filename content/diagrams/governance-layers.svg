<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="governance-layers-title governance-layers-desc" data-diagram-id="governance-layers">
  <title id="governance-layers-title">Fabric governance layers across tenant, domain, workspace, and item boundaries</title>
  <desc id="governance-layers-desc">An interactive architecture infographic with 4 selectable elements. Every element drills into inputs, processing, outputs, a worked example, controls, and failure modes.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Grounded in purview claims: 4 governance areas, 3-tier hierarchy,
       domains/subdomains, sensitivity labels, DLP, endorsement, OneLake Catalog,
       Purview Data Map, metadata scanning, compliance certs. -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="tierGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF7F2"/>
      <stop offset="1" stop-color="#D4EFE7"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1100" height="56" fill="url(#hdrGrad)"/>
  <text x="28" y="24" font-size="17" font-weight="700" fill="#FFFFFF" data-node-id="step-1" tabindex="0" aria-label="governance boundary"><title data-node-tooltip="true">governance boundary — governance boundary in the Fabric governance layers across tenant, domain, workspace, and item boundaries architecture.</title>Microsoft Fabric — Governance Layers</text>
  <text x="28" y="43" font-size="11" fill="#D9F5EE">Domains · Workspaces · Endorsement · Sensitivity Labels / DLP · OneLake Catalog · Purview Hub</text>

  <!-- ═══════════════════════════════════════════════
       THREE-TIER HIERARCHY (left pillar)
  ════════════════════════════════════════════════ -->
  <text x="28" y="82" font-size="11" letter-spacing="1.2" fill="#8A8886">GOVERNANCE SCOPE HIERARCHY</text>

  <!-- Tier 1 — Tenant -->
  <rect x="28" y="90" width="300" height="64" rx="8" fill="#063D3B"/>
  <text x="178" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#25FFD4">Tenant</text>
  <text x="178" y="135" text-anchor="middle" font-size="10" fill="#D9F5EE">Fabric admins · global defaults · compliance certs</text>
  <text x="178" y="149" text-anchor="middle" font-size="9" fill="#9AD2C5">HIPAA BAA · ISO 27001/17/18/701</text>

  <!-- Arrow down -->
  <line x1="178" y1="154" x2="178" y2="170" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="185" y="165" font-size="9" fill="#424242">delegate selected settings</text>

  <!-- Tier 2 — Domain -->
  <rect x="28" y="172" width="300" height="64" rx="8" fill="#117865"/>
  <text x="178" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Domain</text>
  <text x="178" y="215" text-anchor="middle" font-size="10" fill="#D9F5EE">Business-area grouping · domain admins · subdomains</text>
  <text x="178" y="229" text-anchor="middle" font-size="9" fill="#9AD2C5">Per-dept overrides on delegated settings</text>

  <!-- Arrow down -->
  <line x1="178" y1="236" x2="178" y2="252" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="185" y="247" font-size="9" fill="#424242">workspace owner controls</text>

  <!-- Tier 3 — Workspace -->
  <rect x="28" y="254" width="300" height="64" rx="8" fill="#2AAC94"/>
  <text x="178" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#063D3B">Workspace</text>
  <text x="178" y="297" text-anchor="middle" font-size="10" fill="#063D3B">Roles: Admin · Member · Contributor · Viewer</text>
  <text x="178" y="311" text-anchor="middle" font-size="9" fill="#0B5E50">Most granular scope · capacity assignment here</text>

  <!-- Capacity box below workspace -->
  <rect x="28" y="332" width="300" height="44" rx="6" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="178" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Capacity</text>
  <text x="178" y="367" text-anchor="middle" font-size="9" fill="#424242">Compute isolation boundary · recommended: Dev / Test / Prod split</text>

  <!-- RLS / OLS note -->
  <rect x="28" y="388" width="300" height="52" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="44" y="406" font-size="10" font-weight="600" fill="#063D3B">Data-level security (inside workspace items)</text>
  <text x="44" y="422" font-size="10" fill="#424242">Row-level · Column-level · Table-level security</text>
  <text x="44" y="436" font-size="10" fill="#424242">Supported: SQL endpoint · Warehouse · Direct Lake · KQL DB</text>

  <!-- ═══════════════════════════════════════════════
       CENTRE COLUMN — Protect &amp; Secure
  ════════════════════════════════════════════════ -->
  <text x="358" y="82" font-size="11" letter-spacing="1.2" fill="#8A8886">PROTECT &amp; SECURE</text>

  <!-- Sensitivity Labels card -->
  <rect x="358" y="90" width="340" height="120" rx="8" fill="#FFF8EC" stroke="#F0C070"/>
  <rect x="358" y="90" width="8" height="120" rx="4" fill="#E8A020"/>
  <text x="378" y="112" font-size="12" font-weight="700" fill="#5C3A00">Sensitivity Labels</text>
  <text x="378" y="130" font-size="10" fill="#424242">Applied manually or automatically (default · inheritance</text>
  <text x="378" y="144" font-size="10" fill="#424242">· programmatic). Labels persist on exported data.</text>
  <text x="378" y="162" font-size="10" fill="#424242">Source: Microsoft Purview Information Protection.</text>
  <text x="378" y="178" font-size="10" fill="#7A4A00">Labels stay enforced when data is shared cross-tenant.</text>
  <text x="378" y="196" font-size="10" fill="#7A4A00">Advanced protection features require additional license.</text>

  <!-- DLP card -->
  <rect x="358" y="222" width="340" height="100" rx="8" fill="#FFF1ED" stroke="#F0A080"/>
  <rect x="358" y="222" width="8" height="100" rx="4" fill="#D45000"/>
  <text x="378" y="244" font-size="12" font-weight="700" fill="#5C1A00">Data Loss Prevention (DLP)</text>
  <text x="378" y="262" font-size="10" fill="#424242">Purview DLP policies scan DLP-supported item types</text>
  <text x="378" y="276" font-size="10" fill="#424242">on upload to detect sensitive content.</text>
  <text x="378" y="294" font-size="10" fill="#424242">Generates audit log entries. Configurable alert messages</text>
  <text x="378" y="308" font-size="10" fill="#7A2800">sent to data owners when proprietary content detected.</text>

  <!-- Purview Hub card -->
  <rect x="358" y="334" width="340" height="106" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <rect x="358" y="334" width="8" height="106" rx="4" fill="#2AAC94"/>
  <text x="378" y="356" font-size="12" font-weight="700" fill="#063D3B">Purview Hub</text>
  <text x="378" y="374" font-size="10" fill="#424242">Centralizes governance surface in Fabric.</text>
  <text x="378" y="390" font-size="10" fill="#424242">Permissions · sensitivity labels · auditing applied</text>
  <text x="378" y="406" font-size="10" fill="#424242" data-node-id="step-2" tabindex="0" aria-label="Fabric governance layers across tenant"><title data-node-tooltip="true">Fabric governance layers across tenant — Fabric governance layers across tenant in the Fabric governance layers across tenant, domain, workspace, and item boundaries architecture.</title>automatically and inherited across all Fabric items.</text>
  <text x="378" y="424" font-size="10" fill="#424242">Advanced cross-org features require enterprise license.</text>

  <!-- Audit + Scanner APIs card -->
  <rect x="358" y="452" width="340" height="80" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="378" y="472" font-size="12" font-weight="700" fill="#063D3B">Metadata Scanning &amp; Auditing</text>
  <text x="378" y="490" font-size="10" fill="#424242">Scanner REST APIs: item name, ID, sensitivity + endorsement status.</text>
  <text x="378" y="506" font-size="10" fill="#424242">External cataloging tools can call these admin APIs across all items.</text>
  <text x="378" y="520" font-size="10" fill="#424242">Audit log entries written for every DLP detection event.</text>

  <!-- ═══════════════════════════════════════════════
       RIGHT COLUMN — Discover &amp; Trust
  ════════════════════════════════════════════════ -->
  <text x="728" y="82" font-size="11" letter-spacing="1.2" fill="#8A8886">DISCOVER &amp; TRUST</text>

  <!-- OneLake Catalog -->
  <rect x="728" y="90" width="344" height="120" rx="8" fill="url(#tierGrad)" stroke="#117865" stroke-width="1.5"/>
  <text x="748" y="113" font-size="13" font-weight="700" fill="#063D3B">OneLake Catalog</text>
  <text x="748" y="131" font-size="10" fill="#424242">Single searchable surface for all Fabric items a user</text>
  <text x="748" y="145" font-size="10" fill="#424242">has access to. Filter by domain, tag, endorsement.</text>
  <text x="748" y="163" font-size="10" fill="#3F6259">Content prioritized for endorsed items in search results.</text>
  <text x="748" y="179" font-size="10" fill="#3F6259">No need to know which workspace holds the data.</text>
  <text x="748" y="196" font-size="9" fill="#8A8886">Workspace content filtered by domain here.</text>

  <!-- Endorsement card -->
  <rect x="728" y="222" width="344" height="106" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="748" y="244" font-size="12" font-weight="700" fill="#063D3B">Endorsement</text>

  <!-- Promoted badge -->
  <rect x="748" y="254" width="145" height="38" rx="5" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="820" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#117865">Promoted</text>
  <text x="820" y="284" text-anchor="middle" font-size="9" fill="#424242">Self-applied by item owner</text>

  <!-- Certified badge -->
  <rect x="904" y="254" width="148" height="38" rx="5" fill="#063D3B" stroke="#2AAC94"/>
  <text x="978" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#25FFD4">Certified</text>
  <text x="978" y="284" text-anchor="middle" font-size="9" fill="#9AD2C5">Org-applied · quality standard met</text>

  <text x="748" y="314" font-size="10" fill="#424242">Endorsed items get priority placement in catalog/search.</text>

  <!-- Purview Data Map card -->
  <rect x="728" y="340" width="344" height="130" rx="8" fill="#F7FAF9" stroke="#C8E8E0"/>
  <text x="748" y="362" font-size="12" font-weight="700" fill="#063D3B">Purview Data Map</text>
  <text x="748" y="380" font-size="10" fill="#424242" data-node-id="step-3" tabindex="0" aria-label="and item boundaries"><title data-node-tooltip="true">and item boundaries — and item boundaries in the Fabric governance layers across tenant, domain, workspace, and item boundaries architecture.</title>Scans Fabric items → extracts item-level metadata</text>
  <text x="748" y="396" font-size="10" fill="#424242">and lineage. Exposed via Atlas APIs for external services.</text>
  <text x="748" y="414" font-size="10" fill="#424242">Live view: browse all Fabric workspaces with viewer</text>
  <text x="748" y="430" font-size="10" fill="#424242">access directly in Purview (no scan needed).</text>
  <text x="748" y="448" font-size="10" fill="#7A4A00">Full item-level metadata scanning: enterprise tier license.</text>
  <text x="748" y="464" font-size="9" fill="#8A8886" data-node-id="step-4" tabindex="0" aria-label="purview governed outcome"><title data-node-tooltip="true">purview governed outcome — purview governed outcome in the Fabric governance layers across tenant, domain, workspace, and item boundaries architecture.</title>Cross-org Purview governance requires additional licensing.</text>

  <!-- Activity / Monitor box -->
  <rect x="728" y="482" width="344" height="78" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="748" y="502" font-size="12" font-weight="700" fill="#063D3B">Monitoring &amp; Activity</text>
  <text x="748" y="520" font-size="10" fill="#424242">Monitoring Hub · Capacity Metrics App</text>
  <text x="748" y="536" font-size="10" fill="#424242">Admin Monitoring Workspace · audit logs</text>
  <text x="748" y="550" font-size="10" fill="#424242">ARM APIs · Terraform support (F SKU only)</text>

  <!-- Connector arrows: Tenant → Domain → Workspace flow visible via hierarchy column -->
  <!-- Cross arrows: Catalog ← Domain filtering -->
  <line x1="328" y1="204" x2="355" y2="204" stroke="#2AAC94" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <text x="342" y="200" text-anchor="middle" font-size="8" fill="#8A8886">drives</text>

  <!-- Labels/DLP flow into Catalog -->
  <line x1="698" y1="150" x2="726" y2="150" stroke="#117865" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="712" y="146" text-anchor="middle" font-size="8" fill="#8A8886">surfaces in</text>

  <!-- Footnote -->
  <text x="1072" y="690" text-anchor="end" font-size="9" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset.</text>
</svg>
