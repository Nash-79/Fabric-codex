<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="lakehouse-architecture-title lakehouse-architecture-desc" data-diagram-id="lakehouse-architecture">
  <title id="lakehouse-architecture-title">Fabric Lakehouse Storage and Serving Paths</title>
  <desc id="lakehouse-architecture-desc">Ingestion branches to Files or managed Delta Tables. Spark transforms and commits Delta. Eligible tables synchronize to a read-only SQL analytics endpoint. Warehouse is the writable T-SQL-first alternative.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="lh-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="lh-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="lh-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="lh-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>

    <!-- Official Microsoft Lakehouse Icon Gradients -->
    <linearGradient id="lh-icon-a" x1="3.25" x2="19.75" y1="4.5" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="lh-icon-b" x1="16.5" x2="28.5" y1="6" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="940" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#lh-head)"/>
  <g data-official-icon="microsoft" data-icon-name="lakehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#lh-icon-a)" d="M4 16.5L16 4l12 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 27.5z"/>
      <path fill="url(#lh-icon-b)" d="M16 11l9 9.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 27.5v-7z"/>
      <path fill="#FFFFFF" opacity="0.8" d="M12 18h8v2h-8zm0 4h8v2h-8z"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Fabric Lakehouse Storage and Serving Paths</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Ingestion ➔ /Files &amp; /Tables ➔ Spark Write Path ➔ SQL Analytics Endpoint ➔ Warehouse Boundary</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Ingestion &amp; Lakehouse Storage (/Files vs /Tables)</text>
    <circle cx="340" cy="15" r="5" fill="#2563EB"/><text x="352" y="19" fill="#1E3A8A" font-weight="600">Spark Compute &amp; SQL Analytics Endpoint</text>
    <circle cx="680" cy="15" r="5" fill="#7C3AAD"/><text x="692" y="19" fill="#581C87" font-weight="600">Warehouse Transactional Alternative</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Atlas Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: INGESTION & STORAGE SPLIT (STEP-1 ➔ STEP-2 / STEP-3)              -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="156" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 1: INGESTION &amp; ONELAKE STORAGE SEGREGATION</text>

  <!-- Node 1: step-1 -->
  <g data-node-id="step-1" role="group" tabindex="0" aria-label="Lakehouse ingestion">
    <title data-node-tooltip="true">Lakehouse ingestion — Notebooks, jobs, pipelines, dataflows, and shortcuts bring data into a lakehouse.</title>
    <rect x="56" y="184" width="350" height="182" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#lh-shadow)"/>
    <rect x="68" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="133" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">INGESTION CONDUIT</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#134E4A">1 · Multi-Modal Ingestion</text>
    <text x="68" y="250" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Pipelines:</tspan> High-throughput Copy Activity</text>
    <text x="68" y="268" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Dataflows Gen2:</tspan> Low-code Power Query ETL</text>
    <text x="68" y="286" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Shortcuts:</tspan> Zero-copy virtualization (ADLS/S3)</text>
    <text x="68" y="306" font-size="8.5" font-weight="700" fill="#0F766E">Lands objects into /Files or /Tables areas</text>
    <rect x="340" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="366" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 2: step-2 -->
  <g data-node-id="step-2" role="group" tabindex="0" aria-label="Files area">
    <title data-node-tooltip="true">Files area — Files holds unstructured and non-Delta data not auto-exposed as a SQL table.</title>
    <rect x="426" y="184" width="350" height="182" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#lh-shadow)"/>
    <rect x="438" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="503" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">RAW / UNSTRUCTURED</text>
    <text x="438" y="228" font-size="13" font-weight="700" fill="#134E4A">2 · /Files Storage Area</text>
    <text x="438" y="250" font-size="9.5" fill="#115E59">• Holds raw CSV, JSON, Parquet, images, audio, video</text>
    <text x="438" y="268" font-size="9.5" fill="#115E59">• Supports arbitrary nested subfolder directory hierarchies</text>
    <text x="438" y="286" font-size="9.5" fill="#115E59">• Not automatically registered in SQL metastore</text>
    <text x="438" y="306" font-size="8.5" font-weight="700" fill="#0F766E">Must convert to Delta to surface in SQL endpoint</text>
    <rect x="710" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="736" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 3: step-3 -->
  <g data-node-id="step-3" role="group" tabindex="0" aria-label="Managed Delta tables">
    <title data-node-tooltip="true">Managed Delta tables — Tables accepts managed Delta and registers table metadata.</title>
    <rect x="796" y="184" width="348" height="182" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#lh-shadow)"/>
    <rect x="808" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="873" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">MANAGED DELTA</text>
    <text x="808" y="228" font-size="13" font-weight="700" fill="#134E4A">3 · /Tables Storage Area</text>
    <text x="808" y="250" font-size="9.5" fill="#115E59">• Dedicated to Delta Lake format (<tspan font-family="monospace" font-size="8.5">_delta_log/</tspan> + Parquet)</text>
    <text x="808" y="268" font-size="9.5" fill="#115E59">• Automatic schema discovery &amp; catalog registration</text>
    <text x="808" y="286" font-size="9.5" fill="#115E59">• ACID transactions, time travel, V-Order optimization</text>
    <text x="808" y="306" font-size="8.5" font-weight="700" fill="#0F766E">Instantly synchronized to SQL Analytics Endpoint</text>
    <rect x="1078" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1104" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: DUAL-ENGINE PROCESSING (STEP-4 SPARK ➔ STEP-5 SQL ENDPOINT)       -->
  <!-- ========================================================================= -->
  <rect x="40" y="394" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="404" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="418" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: DUAL-ENGINE PROCESSING &amp; SERVING PATHS</text>

  <!-- Node 4: step-4 -->
  <g data-node-id="step-4" role="group" tabindex="0" aria-label="Spark write path">
    <title data-node-tooltip="true">Spark write path — Spark transforms lakehouse data and commits Delta changes.</title>
    <rect x="56" y="432" width="520" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#lh-shadow)"/>
    <rect x="68" y="442" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="133" y="453" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">PRIMARY WRITE PATH</text>
    <text x="68" y="476" font-size="13" font-weight="700" fill="#1E3A8A">4 · Apache Spark Compute Engine (Read &amp; Write)</text>
    <text x="68" y="498" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Role:</tspan> Exclusive writer for data transformation &amp; Medallion processing</text>
    <text x="68" y="516" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Capabilities:</tspan> PySpark, Scala, Spark SQL, Delta MERGE, Streaming ingestion</text>
    <text x="68" y="534" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Acceleration:</tspan> Native Execution Engine (NEE) with C++ Velox vectorization</text>
    <text x="68" y="554" font-size="8.5" font-weight="700" fill="#1D4ED8">Commits ACID transactions directly to /Tables in OneLake</text>
    <rect x="510" y="442" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="536" y="452" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 5: step-5 -->
  <g data-node-id="step-5" role="group" tabindex="0" aria-label="SQL analytics endpoint">
    <title data-node-tooltip="true">SQL analytics endpoint — Every lakehouse receives a read-only T-SQL endpoint over eligible Delta tables.</title>
    <rect x="606" y="432" width="538" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#lh-shadow)"/>
    <rect x="618" y="442" width="140" height="16" rx="8" fill="#DBEAFE"/><text x="688" y="453" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">READ-ONLY SERVING</text>
    <text x="618" y="476" font-size="13" font-weight="700" fill="#1E3A8A">5 · SQL Analytics Endpoint (Polaris Engine)</text>
    <text x="618" y="498" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Automatic Provisioning:</tspan> Created with Lakehouse; 0 compute config required</text>
    <text x="618" y="516" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Read-Only T-SQL:</tspan> Supports SELECT, Views, Functions, TVFs, and Procedures</text>
    <text x="618" y="534" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">DML Constraint:</tspan> INSERT, UPDATE, DELETE are strictly blocked by design</text>
    <text x="618" y="554" font-size="8.5" font-weight="700" fill="#1D4ED8">Serves Power BI Direct Lake &amp; relational reporting with zero data replication</text>
    <rect x="1078" y="442" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="452" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: WAREHOUSE ALTERNATIVE (STEP-6)                                    -->
  <!-- ========================================================================= -->
  <g data-node-id="step-6" role="group" tabindex="0" aria-label="Warehouse alternative">
    <title data-node-tooltip="true">Warehouse alternative — Choose Warehouse for writable T-SQL-first relational work.</title>
    <rect x="40" y="642" width="1120" height="248" rx="14" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.6" filter="url(#lh-shadow)"/>
    <rect x="56" y="652" width="150" height="18" rx="9" fill="#EDE9FE"/><text x="131" y="665" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">T-SQL FIRST Marts</text>
    <text x="56" y="694" font-size="14" font-weight="700" fill="#4C1D95">6 · Fabric Warehouse Alternative (When Transactional T-SQL Writes Are Required)</text>
    <text x="56" y="718" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Lakehouse Stance:</tspan> Spark-first for heavy transformation, Python/Scala data science, and unstructured /Files</text>
    <text x="56" y="736" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Warehouse Stance:</tspan> T-SQL-first with full ACID multi-table transactions, primary/unique keys, and DML (INSERT/UPDATE/DELETE/MERGE)</text>
    <text x="56" y="754" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Coexistence Pattern:</tspan> Ingest and transform in Lakehouse (Bronze ➔ Silver), then expose curated Gold marts through Warehouse</text>
    <rect x="1080" y="652" width="52" height="16" rx="8" fill="#EDE9FE"/><text x="1106" y="664" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="918" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Atlas — Original Diagram, August 2026. Sourced from Microsoft Fabric Lakehouse &amp; Warehouse Architecture.</text>
</svg>
