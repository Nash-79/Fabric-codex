<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="lakehouse-delta-optimization-title lakehouse-delta-optimization-desc" data-diagram-id="lakehouse-delta-optimization">
  <title id="lakehouse-delta-optimization-title">Lakehouse Delta Optimization: Choosing V-Order, Optimized Write, Deletion Vectors, or Compaction</title>
  <desc id="lakehouse-delta-optimization-desc">Delta table optimization routing: classify workload pattern (read-heavy, write-heavy, mutation-heavy), configure V-Order, Optimized Write, or Deletion Vectors, avoid the unmerged deletion vector trap, and size compaction between Auto Compaction and scheduled OPTIMIZE.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="ldo-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="ldo-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="ldo-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="ldo-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="ldo-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>

    <!-- Official Microsoft Lakehouse Icon Gradients -->
    <linearGradient id="ldo-icon-a" x1="3.25" x2="19.75" y1="4.5" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="ldo-icon-b" x1="16.5" x2="28.5" y1="6" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="960" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#ldo-head)"/>
  <g data-official-icon="microsoft" data-icon-name="lakehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#ldo-icon-a)" d="M4 16.5L16 4l12 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 27.5z"/>
      <path fill="url(#ldo-icon-b)" d="M16 11l9 9.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 27.5v-7z"/>
      <path fill="#FFFFFF" opacity="0.8" d="M12 18h8v2h-8zm0 4h8v2h-8z"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Fabric Lakehouse: Delta Table Optimization Decision Guide</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Workload Profile Classification ➔ Write-Time Optimization ➔ Deletion Vector Guardrails ➔ Sized Compaction Strategy</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Workload Decision &amp; Write-Time Options</text>
    <circle cx="340" cy="15" r="5" fill="#D97706"/><text x="352" y="19" fill="#92400E" font-weight="600">Deletion Vector Maintenance Trap</text>
    <circle cx="680" cy="15" r="5" fill="#2563EB"/><text x="692" y="19" fill="#1E3A8A" font-weight="600">Auto Compaction &amp; Scheduled OPTIMIZE</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Atlas Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: WORKLOAD CLASSIFICATION ROOT (WORKLOAD-QUESTION)                  -->
  <!-- ========================================================================= -->
  <g data-node-id="workload-question" role="group" tabindex="0" aria-label="What is this table's dominant pattern?">
    <title data-node-tooltip="true">What is this table's dominant pattern? — The root question: route by how the table is actually read and written, not by habit.</title>
    <rect x="40" y="146" width="1120" height="116" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4" filter="url(#ldo-shadow)"/>
    <rect x="56" y="156" width="160" height="18" rx="9" fill="#CCFBF1"/><text x="136" y="169" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">DECISION ROOT</text>
    <text x="56" y="198" font-size="14" font-weight="700" fill="#134E4A">1 · What Is This Delta Table's Dominant Workload Pattern?</text>
    <text x="56" y="220" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Read-Heavy (Dashboards/BI):</tspan> Repeated interactive scans ➔ Route to <tspan font-weight="700">V-Order Optimization</tspan></text>
    <text x="56" y="238" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Write-Heavy (Streaming/ETL):</tspan> Micro-batch ingestion producing small files ➔ Route to <tspan font-weight="700">Optimized Write</tspan></text>
    <text x="56" y="254" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Mutation-Heavy (GDPR/CDC):</tspan> Frequent row-level UPDATE/DELETE/MERGE ➔ Route to <tspan font-weight="700">Deletion Vectors</tspan></text>
    <rect x="1080" y="156" width="52" height="16" rx="8" fill="#CCFBF1"/><text x="1106" y="168" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: THREE OPTIMIZATION LEVERS (V-ORDER ➔ OPT-WRITE ➔ DEL-VECTORS)     -->
  <!-- ========================================================================= -->
  <rect x="40" y="278" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="288" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="302" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: PRIMARY WRITE-TIME &amp; MUTATION LEVERS</text>

  <!-- Node 2: v-order -->
  <g data-node-id="v-order" role="group" tabindex="0" aria-label="Enable V-Order">
    <title data-node-tooltip="true">Enable V-Order — Write-time Parquet reorganization that speeds up downstream reads across Fabric engines.</title>
    <rect x="56" y="316" width="350" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="68" y="326" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="133" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">READ OPTIMIZATION</text>
    <text x="68" y="360" font-size="13" font-weight="700" fill="#1E3A8A">2 · Enable V-Order</text>
    <text x="68" y="382" font-size="9.5" fill="#1E40AF">• Reorganizes Parquet row groups &amp; dictionary sorting</text>
    <text x="68" y="400" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Cost Tradeoff:</tspan> ~15% longer write times per batch</text>
    <text x="68" y="418" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Benefit:</tspan> Drastically accelerates Power BI Direct Lake</text>
    <text x="68" y="438" font-size="8.5" font-weight="700" fill="#1D4ED8">Disabled by default in new workspaces to favor ETL speed</text>
    <rect x="340" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="366" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 3: optimized-write -->
  <g data-node-id="optimized-write" role="group" tabindex="0" aria-label="Enable Optimized Write">
    <title data-node-tooltip="true">Enable Optimized Write — Shuffles data across executors before writing so each partition lands in fewer, larger files.</title>
    <rect x="426" y="316" width="350" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="438" y="326" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="503" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">WRITE CONSOLIDATION</text>
    <text x="438" y="360" font-size="13" font-weight="700" fill="#1E3A8A">3 · Enable Optimized Write</text>
    <text x="438" y="382" font-size="9.5" fill="#1E40AF">• Pre-write shuffle routes partitions to single executors</text>
    <text x="438" y="400" font-size="9.5" fill="#1E40AF">• Prevents small-file explosion in streaming micro-batches</text>
    <text x="438" y="418" font-size="9.5" fill="#1E40AF">• Target bin size configured via <tspan font-family="monospace" font-size="8.5">spark.sql.files.maxRecordsPerFile</tspan></text>
    <text x="438" y="438" font-size="8.5" font-weight="700" fill="#1D4ED8">Recommended 256 MB BinSize for balanced general workloads</text>
    <rect x="710" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="736" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 4: deletion-vectors -->
  <g data-node-id="deletion-vectors" role="group" tabindex="0" aria-label="Consider deletion vectors">
    <title data-node-tooltip="true">Consider deletion vectors — Converts row-level UPDATE/DELETE/MERGE into a small marker file instead of a full-file rewrite.</title>
    <rect x="796" y="316" width="348" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="808" y="326" width="140" height="16" rx="8" fill="#DBEAFE"/><text x="878" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">MUTATION ACCELERATION</text>
    <text x="808" y="360" font-size="13" font-weight="700" fill="#1E3A8A">4 · Enable Deletion Vectors</text>
    <text x="808" y="382" font-size="9.5" fill="#1E40AF">• Shifts from copy-on-write to merge-on-read bitmap markers</text>
    <text x="808" y="400" font-size="9.5" fill="#1E40AF">• ~8x faster single-row deletes without full Parquet rewrite</text>
    <text x="808" y="418" font-size="9.5" fill="#1E40AF">• Raises table protocol: <tspan font-weight="700">minReader=3, minWriter=7</tspan></text>
    <text x="808" y="438" font-size="8.5" font-weight="700" fill="#1D4ED8">Unsupported by Fabric COPY Activity unless compacted</text>
    <rect x="1078" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: DELETION VECTOR TRAP (DELETION-VECTOR-TRAP)                       -->
  <!-- ========================================================================= -->
  <g data-node-id="deletion-vector-trap" role="group" tabindex="0" aria-label="Trap: deletion vectors without OPTIMIZE">
    <title data-node-tooltip="true">Trap: deletion vectors without OPTIMIZE — Unmerged deletion-vector markers accumulate and measurably slow reads until compaction runs.</title>
    <rect x="40" y="530" width="1120" height="132" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="56" y="540" width="180" height="18" rx="9" fill="#FEE2E2"/><text x="146" y="553" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">PERFORMANCE TRAP</text>
    <text x="56" y="582" font-size="13" font-weight="700" fill="#991B1B">5 · Deletion Vectors Without Periodic OPTIMIZE Severely Degrades Read Scans</text>
    <text x="56" y="604" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">The Problem:</tspan> Accumulating deletion-vector bitmaps are filtered at query time; benchmarked queries run <tspan font-weight="700">2.3x slower</tspan> when compaction is omitted</text>
    <text x="56" y="622" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">The Fix:</tspan> Running periodic <tspan font-weight="700">OPTIMIZE</tspan> permanently folds deletion vectors into clean Parquet files, restoring 100% baseline scan speeds</text>
    <rect x="1080" y="540" width="52" height="16" rx="8" fill="#FEE2E2"/><text x="1106" y="552" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 4: COMPACTION SIZING (COMPACTION-QUESTION, AUTO, SCHEDULED)          -->
  <!-- ========================================================================= -->
  <rect x="40" y="678" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="688" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="702" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 3: COMPACTION SIZING &amp; MAINTENANCE STRATEGY</text>

  <!-- Node 5: compaction-question -->
  <g data-node-id="compaction-question" role="group" tabindex="0" aria-label="Is the table under ~1 GB?">
    <title data-node-tooltip="true">Is the table under ~1 GB? — The convergence point: every optimization path still needs periodic compaction, sized to table volume.</title>
    <rect x="56" y="716" width="350" height="182" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="68" y="726" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="133" y="737" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">CONVERGENCE GATE</text>
    <text x="68" y="760" font-size="13" font-weight="700" fill="#134E4A">6 · Table Size Evaluation</text>
    <text x="68" y="782" font-size="9.5" fill="#115E59">• All tables require ongoing maintenance</text>
    <text x="68" y="800" font-size="9.5" fill="#115E59">• <tspan font-weight="700">&lt; 1 GB Tables:</tspan> Auto Compaction alone is sufficient</text>
    <text x="68" y="818" font-size="9.5" fill="#115E59">• <tspan font-weight="700">&gt; 1 GB Tables:</tspan> Scheduled OPTIMIZE pass required</text>
    <text x="68" y="838" font-size="8.5" font-weight="700" fill="#0F766E">Zero compaction produces 33 min runtimes vs 12 min optimal</text>
    <rect x="340" y="726" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="366" y="736" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- Node 6: auto-compaction -->
  <g data-node-id="auto-compaction" role="group" tabindex="0" aria-label="Auto Compaction alone">
    <title data-node-tooltip="true">Auto Compaction alone — Automatic post-write compaction sufficient for tables under roughly 1 GB.</title>
    <rect x="426" y="716" width="350" height="182" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="438" y="726" width="140" height="16" rx="8" fill="#CCFBF1"/><text x="508" y="737" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">TABLES &lt; 1 GB</text>
    <text x="438" y="760" font-size="13" font-weight="700" fill="#134E4A">7 · Auto Compaction Alone</text>
    <text x="438" y="782" font-size="9.5" fill="#115E59">• Automatic post-write compaction pass</text>
    <text x="438" y="800" font-size="9.5" fill="#115E59">• Triggers when partition exceeds 50 small files</text>
    <text x="438" y="818" font-size="9.5" fill="#115E59">• Merges undersized files toward 128 MB target</text>
    <text x="438" y="838" font-size="8.5" font-weight="700" fill="#0F766E">Zero scheduled jobs or operational maintenance needed</text>
    <rect x="710" y="726" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="736" y="736" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 7: scheduled-optimize -->
  <g data-node-id="scheduled-optimize" role="group" tabindex="0" aria-label="Auto Compaction + scheduled OPTIMIZE">
    <title data-node-tooltip="true">Auto Compaction + scheduled OPTIMIZE — Larger tables need Auto Compaction paired with a periodic OPTIMIZE pass targeting 500 MB–1 GB files.</title>
    <rect x="796" y="716" width="348" height="182" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ldo-shadow)"/>
    <rect x="808" y="726" width="140" height="16" rx="8" fill="#CCFBF1"/><text x="878" y="737" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">TABLES &gt; 1 GB</text>
    <text x="808" y="760" font-size="13" font-weight="700" fill="#134E4A">8 · Auto + Scheduled OPTIMIZE</text>
    <text x="808" y="782" font-size="9.5" fill="#115E59">• Target large files: <tspan font-weight="700">500 MB to 1 GB</tspan> file sizing</text>
    <text x="808" y="800" font-size="9.5" fill="#115E59">• Check table health first with <tspan font-family="monospace" font-size="8.5">sp_get_table_health_metrics</tspan></text>
    <text x="808" y="818" font-size="9.5" fill="#115E59">• Conditionally trigger OPTIMIZE only on fragmented tables</text>
    <text x="808" y="838" font-size="8.5" font-weight="700" fill="#0F766E">Eliminates wasted compute from blind scheduled compaction</text>
    <rect x="1078" y="726" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1104" y="736" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="938" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Atlas — Original Diagram, August 2026. Sourced from Microsoft Fabric Delta Lake Optimization &amp; Table Compaction Benchmarks.</text>
</svg>
