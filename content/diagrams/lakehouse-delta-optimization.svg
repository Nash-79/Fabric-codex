<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="lakehouse-delta-optimization-title lakehouse-delta-optimization-desc" data-diagram-id="lakehouse-delta-optimization">
  <title id="lakehouse-delta-optimization-title">Lakehouse Delta Optimization: Choosing V-Order, Optimized Write, Deletion Vectors, or Compaction</title>
  <desc id="lakehouse-delta-optimization-desc">A decision tree starting from a table&apos;s dominant workload pattern. Read-heavy tables branch to V-Order; write-heavy streaming/ingestion tables branch to Optimized Write; tables with frequent row-level updates or deletes branch to deletion vectors; all tables converge on a periodic compaction question, which branches into Auto Compaction for tables under 1 GB and scheduled OPTIMIZE plus Auto Compaction for larger tables. A warning node covers the trap of enabling deletion vectors without periodic OPTIMIZE, which measurably degrades read performance.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00695c"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="infoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e65100"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00695c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="820" fill="url(#bgGrad)" rx="8"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1000" height="56" fill="url(#headerGrad)" rx="8"/>
  <rect x="0" y="40" width="1000" height="16" fill="url(#headerGrad)"/>
  <text x="500" y="34" text-anchor="middle" fill="white" font-size="18" font-weight="700" letter-spacing="0.3">Fabric Lakehouse: Delta Optimization Decision Guide</text>

  <!-- Section label -->
  <text x="500" y="82" text-anchor="middle" fill="#1565c0" font-size="13" font-weight="600">Choose the right optimization strategy for each layer and workload pattern</text>

  <!-- ===== START NODE ===== -->
  <rect x="380" y="96" width="240" height="48" rx="24" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="500" y="117" text-anchor="middle" fill="white" font-size="13" font-weight="700">New Delta Table in Lakehouse</text>
  <g data-node-id="workload-question" role="group"s dominant pattern?" tabindex="0" aria-label="What is this table&apos;s dominant pattern?">
    <title data-node-tooltip="true">What is this table&apos;s dominant pattern? — The root question: route by how the table is actually read and written, not by habit.</title>
    <rect x="366.8" y="118.0" width="266.4" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="500" y="134" text-anchor="middle" fill="#bbdefb" font-size="11">What is the dominant workload pattern?</text>
  </g>

  <!-- Arrow down from start -->
  <line x1="500" y1="144" x2="500" y2="172" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== WORKLOAD DECISION DIAMOND ===== -->
  <polygon points="500,175 640,220 500,265 360,220" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="500" y="214" text-anchor="middle" fill="white" font-size="13" font-weight="700">Workload Type?</text>
  <text x="500" y="232" text-anchor="middle" fill="#ffe0b2" font-size="10">Read-heavy vs Write-heavy</text>

  <!-- LEFT branch: Write-Heavy -->
  <line x1="360" y1="220" x2="180" y2="220" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="270" y="212" text-anchor="middle" fill="#e65100" font-size="11" font-weight="600">Write-heavy</text>
  <text x="270" y="228" text-anchor="middle" fill="#e65100" font-size="10">(Ingestion / ETL)</text>

  <!-- RIGHT branch: Read-Heavy -->
  <line x1="640" y1="220" x2="820" y2="220" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="730" y="212" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="600">Read-heavy</text>
  <text x="730" y="228" text-anchor="middle" fill="#2e7d32" font-size="10">(Analytics / BI)</text>

  <!-- ===== LEFT PATH: Write-Heavy ===== -->
  <!-- Write-Heavy config box -->
  <rect x="60" y="248" width="240" height="80" rx="6" fill="white" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="248" width="240" height="24" rx="6" fill="#e65100"/>
  <rect x="60" y="260" width="240" height="12" fill="#e65100"/>
  <text x="180" y="264" text-anchor="middle" fill="white" font-size="11" font-weight="700">V-Order: DISABLE</text>
  <text x="180" y="284" text-anchor="middle" fill="#333" font-size="10">spark.sql.parquet.vorder.default</text>
  <text x="180" y="298" text-anchor="middle" fill="#333" font-size="10">= false (workspace default)</text>
  <text x="180" y="312" text-anchor="middle" fill="#bf360c" font-size="10" font-weight="600">Avoids 15% write penalty on every job</text>

  <line x1="180" y1="220" x2="180" y2="248" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Arrow down from write-heavy config -->
  <line x1="180" y1="328" x2="180" y2="358" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- DELETION VECTORS decision -->
  <polygon points="180,360 310,400 180,440 50,400" fill="url(#decisionGrad)" filter="url(#shadow)"/>
  <text x="180" y="394" text-anchor="middle" fill="white" font-size="11" font-weight="700">Uses UPDATE /</text>
  <text x="180" y="410" text-anchor="middle" fill="white" font-size="11" font-weight="700">MERGE / DELETE?</text>

  <!-- YES: Enable deletion vectors -->
  <line x1="310" y1="400" x2="390" y2="400" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="350" y="392" text-anchor="middle" fill="#e65100" font-size="10" font-weight="600">YES</text>

  <rect x="390" y="370" width="230" height="88" rx="6" fill="white" stroke="#00695c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="390" y="370" width="230" height="24" rx="6" fill="#00695c"/>
  <rect x="390" y="382" width="230" height="12" fill="#00695c"/>
  <text x="505" y="386" text-anchor="middle" fill="white" font-size="11" font-weight="700">Deletion Vectors: ENABLE</text>
  <text x="505" y="406" text-anchor="middle" fill="#333" font-size="10">ALTER TABLE SET</text>
  <text x="505" y="419" text-anchor="middle" fill="#333" font-size="10">delta.enableDeletionVectors = true</text>
  <text x="505" y="433" text-anchor="middle" fill="#004d40" font-size="10" font-weight="600">Raises minReaderVersion=3, minWriterVersion=7</text>
  <text x="505" y="448" text-anchor="middle" fill="#c62828" font-size="9">Check: no COPY Activity on this table</text>

  <!-- NO: skip deletion vectors -->
  <line x1="180" y1="440" x2="180" y2="470" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="200" y="460" fill="#e65100" font-size="10" font-weight="600">NO</text>

  <rect x="60" y="470" width="240" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="180" y="490" text-anchor="middle" fill="#bf360c" font-size="11" font-weight="600">Standard copy-on-write</text>
  <text x="180" y="506" text-anchor="middle" fill="#333" font-size="10">No protocol version change</text>

  <!-- ===== RIGHT PATH: Read-Heavy ===== -->
  <!-- Read-Heavy config box -->
  <rect x="700" y="248" width="240" height="80" rx="6" fill="white" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="700" y="248" width="240" height="24" rx="6" fill="#2e7d32"/>
  <rect x="700" y="260" width="240" height="12" fill="#2e7d32"/>
  <g data-node-id="v-order" role="group" tabindex="0" aria-label="Enable V-Order">
    <title data-node-tooltip="true">Enable V-Order — Write-time Parquet reorganization that speeds up downstream reads across Fabric engines.</title>
    <rect x="760.1" y="248.1" width="119.7" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="820" y="264" text-anchor="middle" fill="white" font-size="11" font-weight="700">V-Order: ENABLE</text>
  </g>
  <text x="820" y="284" text-anchor="middle" fill="#333" font-size="10">spark.sql.parquet.vorder.default = true</text>
  <text x="820" y="298" text-anchor="middle" fill="#333" font-size="10">or use ReadHeavy resource profile</text>
  <text x="820" y="312" text-anchor="middle" fill="#1b5e20" font-size="10" font-weight="600">~15% write overhead; faster dashboard scans</text>

  <line x1="820" y1="220" x2="820" y2="248" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Arrow down from read-heavy -->
  <line x1="820" y1="328" x2="820" y2="358" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- V-Order scope note -->
  <rect x="700" y="358" width="240" height="68" rx="6" fill="white" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="378" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="700">V-Order Scope Notes</text>
  <text x="820" y="396" text-anchor="middle" fill="#333" font-size="10">Session level overrides table property</text>
  <text x="820" y="410" text-anchor="middle" fill="#333" font-size="10">Only affects future writes (not existing files)</text>
  <text x="820" y="424" text-anchor="middle" fill="#555" font-size="10">Run OPTIMIZE to rewrite existing files</text>

  <!-- ===== COMPACTION SECTION - spans full width ===== -->
  <!-- Horizontal connector to compaction -->
  <line x1="180" y1="536" x2="180" y2="570" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="505" y1="458" x2="505" y2="570" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>
  <line x1="820" y1="426" x2="820" y2="570" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Horizontal line connecting the three -->
  <line x1="180" y1="570" x2="820" y2="570" stroke="#1565c0" stroke-width="2"/>
  <line x1="500" y1="570" x2="500" y2="598" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Compaction strategy box -->
  <rect x="120" y="598" width="760" height="160" rx="8" fill="white" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="598" width="760" height="30" rx="8" fill="url(#infoGrad)"/>
  <rect x="120" y="616" width="760" height="12" fill="url(#infoGrad)"/>
  <text x="500" y="618" text-anchor="middle" fill="white" font-size="13" font-weight="700">Compaction Strategy (apply to ALL tables)</text>

  <!-- Three compaction sub-boxes -->
  <!-- Small tables < 1 GB -->
  <rect x="135" y="638" width="215" height="104" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="242" y="656" text-anchor="middle" fill="#1b5e20" font-size="11" font-weight="700">Tables &lt; 1 GB</text>
  <g data-node-id="auto-compaction" role="group" tabindex="0" aria-label="Auto Compaction alone">
    <title data-node-tooltip="true">Auto Compaction alone — Automatic post-write compaction sufficient for tables under roughly 1 GB.</title>
    <rect x="128.5" y="658.5" width="227.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="242" y="673" text-anchor="middle" fill="#333" font-size="10">Auto Compaction alone is sufficient</text>
  </g>
  <text x="242" y="688" text-anchor="middle" fill="#333" font-size="10">Enable: delta.autoOptimize</text>
  <text x="242" y="702" text-anchor="middle" fill="#333" font-size="10">.autoCompact = true</text>
  <text x="242" y="717" text-anchor="middle" fill="#555" font-size="9">Default triggers at 50+ small files</text>
  <text x="242" y="731" text-anchor="middle" fill="#555" font-size="9">Target size: 128 MB per file</text>

  <!-- Medium / large tables -->
  <rect x="363" y="638" width="274" height="104" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="500" y="656" text-anchor="middle" fill="#0d47a1" font-size="11" font-weight="700">Tables &gt; 1 GB (recommended)</text>
  <g data-node-id="compaction-question" role="group" tabindex="0" aria-label="Is the table under ~1 GB?">
    <title data-node-tooltip="true">Is the table under ~1 GB? — The convergence point: every optimization path still needs periodic compaction, sized to table volume.</title>
    <rect x="386.5" y="658.5" width="227.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="500" y="673" text-anchor="middle" fill="#333" font-size="10">Auto Compaction + periodic OPTIMIZE</text>
  </g>
  <g data-node-id="scheduled-optimize" role="group" tabindex="0" aria-label="Auto Compaction + scheduled OPTIMIZE">
    <title data-node-tooltip="true">Auto Compaction + scheduled OPTIMIZE — Larger tables need Auto Compaction paired with a periodic OPTIMIZE pass targeting 500 MB–1 GB files.</title>
    <rect x="383.6" y="673.5" width="232.8" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="500" y="688" text-anchor="middle" fill="#333" font-size="10">OPTIMIZE targets 500 MB – 1 GB files</text>
  </g>
  <text x="500" y="702" text-anchor="middle" fill="#333" font-size="10">Combine with V-Order if read-heavy</text>
  <g data-node-id="optimized-write" role="group" tabindex="0" aria-label="Enable Optimized Write">
    <title data-node-tooltip="true">Enable Optimized Write — Shuffles data across executors before writing so each partition lands in fewer, larger files.</title>
    <rect x="399.3" y="704.0" width="201.5" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="500" y="717" text-anchor="middle" fill="#555" font-size="9">Auto Compaction + Optimized Write:</text>
  </g>
  <text x="500" y="731" text-anchor="middle" fill="#555" font-size="9">best runtime + file stability in benchmarks</text>

  <!-- Anti-pattern: no compaction -->
  <rect x="650" y="638" width="215" height="104" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="757" y="656" text-anchor="middle" fill="#b71c1c" font-size="11" font-weight="700">No Compaction</text>
  <text x="757" y="673" text-anchor="middle" fill="#c62828" font-size="10" font-weight="600">ANTI-PATTERN</text>
  <text x="757" y="690" text-anchor="middle" fill="#333" font-size="10">File count variance: std dev 864</text>
  <text x="757" y="705" text-anchor="middle" fill="#333" font-size="10">Total runtime: 33+ min vs 12 min</text>
  <text x="757" y="720" text-anchor="middle" fill="#333" font-size="10">With deletion vectors: 2.3x slower</text>
  <g data-node-id="deletion-vector-trap" role="group" tabindex="0" aria-label="Trap: deletion vectors without OPTIMIZE">
    <title data-node-tooltip="true">Trap: deletion vectors without OPTIMIZE — Unmerged deletion-vector markers accumulate and measurably slow reads until compaction runs.</title>
    <rect x="687.6" y="722.0" width="138.8" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="757" y="735" text-anchor="middle" fill="#555" font-size="9">reads without OPTIMIZE</text>
  </g>

  <!-- ===== MAINTENANCE REMINDER ===== -->
  <rect x="120" y="772" width="760" height="38" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/>
  <text x="500" y="789" text-anchor="middle" fill="#e65100" font-size="11" font-weight="700">Deletion Vector Maintenance Rule</text>
  <g data-node-id="deletion-vectors" role="group" tabindex="0" aria-label="Consider deletion vectors">
    <title data-node-tooltip="true">Consider deletion vectors — Converts row-level UPDATE/DELETE/MERGE into a small marker file instead of a full-file rewrite.</title>
    <rect x="260.0" y="789.5" width="480.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="500" y="804" text-anchor="middle" fill="#333" font-size="10">After OPTIMIZE, deletion-vector and copy-on-write tables show identical read performance. Regular OPTIMIZE eliminates the merge-on-read overhead.</text>
  </g>

  <!-- Legend strip -->
  <rect x="0" y="0" width="1000" height="820" fill="none" rx="8" stroke="#cdd8e8" stroke-width="1"/>
</svg>
