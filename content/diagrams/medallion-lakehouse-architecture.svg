<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="medallion-lakehouse-architecture-title medallion-lakehouse-architecture-desc" data-diagram-id="medallion-lakehouse-architecture">
  <title id="medallion-lakehouse-architecture-title">Medallion Lakehouse: Bronze, Silver, Gold on One OneLake</title>
  <desc id="medallion-lakehouse-architecture-desc">An internals diagram: source systems land via pipeline copy, Dataflow Gen2, or a shortcut into a bronze Delta table in the lakehouse&apos;s managed Tables area. Spark reads bronze and writes a cleansed, conformed silver Delta table, then Spark aggregates silver into business-ready gold Delta tables shaped for consumption. Gold is exposed two ways: the auto-provisioned SQL analytics endpoint for read-only T-SQL, and Direct Lake for Power BI semantic models that read the Delta files directly with no import. A warning node flags that endpoint-level SQL permissions do not apply to the same data read through Spark or OneLake directly, so securing gold requires both the write and read paths.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Medallion lakehouse architecture: bronze/silver/gold Delta zones in one OneLake,
       ingestion engines on the left, Spark promoting between zones, serving on the right.
       Palette: #063D3B #0d5c53 #1a7a6e #2da896 #EAF7F2 · bronze #b87333 · silver #9aa4ad · gold #d4a017 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf8"/><stop offset="100%" stop-color="#e2f5f1"/>
    </linearGradient>
    <linearGradient id="oneLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7a6e"/><stop offset="100%" stop-color="#0d5c53"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c07d3e"/><stop offset="100%" stop-color="#9c5f28"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aeb8c2"/><stop offset="100%" stop-color="#8b95a0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2b533"/><stop offset="100%" stop-color="#c08e0e"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1a7a6e"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#777"/></marker>
    <marker id="arGold" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c08e0e"/></marker>
  </defs>

  <rect width="1120" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="560" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0d3d35">Medallion Lakehouse on Microsoft Fabric</text>
  <text x="560" y="53" text-anchor="middle" font-size="11.5" fill="#3a6b63" data-node-id="source-ingestion" tabindex="0" aria-label="Source ingestion (pipeline / Dataflow / shortcut)"><title data-node-tooltip="true">Source ingestion (pipeline / Dataflow / shortcut) — Data enters the lakehouse through pipeline copy, Dataflow Gen2, or a OneLake shortcut.</title>Bronze → Silver → Gold as layered Delta tables in one OneLake · Spark promotes between zones · read paths never copy data</text>

  <!-- ═══ INGESTION (left) ═══ -->
  <text x="92" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#0d3d35" letter-spacing="1">INGESTION → BRONZE</text>
  <g font-size="10.5">
    <rect x="22" y="104" width="140" height="40" rx="6" fill="#2da896" filter="url(#sh)"/>
    <text x="92" y="123" text-anchor="middle" fill="#fff" font-weight="600">Pipeline Copy activity</text>
    <text x="92" y="137" text-anchor="middle" font-size="9" fill="#d0f0ec">bulk / high-volume recurring</text>

    <rect x="22" y="152" width="140" height="40" rx="6" fill="#2da896" filter="url(#sh)"/>
    <text x="92" y="171" text-anchor="middle" fill="#fff" font-weight="600">Dataflow Gen2</text>
    <text x="92" y="185" text-anchor="middle" font-size="9" fill="#d0f0ec">low-code shaping (ETL)</text>

    <rect x="22" y="200" width="140" height="40" rx="6" fill="#2da896" filter="url(#sh)"/>
    <text x="92" y="219" text-anchor="middle" fill="#fff" font-weight="600">Spark notebook / job</text>
    <text x="92" y="233" text-anchor="middle" font-size="9" fill="#d0f0ec">code-first ELT push-down</text>

    <rect x="22" y="248" width="140" height="40" rx="6" fill="#0d5c53" filter="url(#sh)"/>
    <text x="92" y="267" text-anchor="middle" fill="#fff" font-weight="600">OneLake shortcut</text>
    <text x="92" y="281" text-anchor="middle" font-size="9" fill="#a8ede6">zero-copy, no ingestion</text>
  </g>

  <!-- arrows into bronze -->
  <line x1="164" y1="124" x2="238" y2="180" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arT)"/>
  <line x1="164" y1="172" x2="238" y2="185" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arT)"/>
  <line x1="164" y1="220" x2="238" y2="195" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arT)"/>
  <line x1="164" y1="268" x2="238" y2="205" stroke="#0d5c53" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arT)"/>

  <!-- ═══ ONELAKE BAND (centre) ═══ -->
  <rect x="230" y="100" width="590" height="470" rx="16" fill="url(#oneLake)" filter="url(#sh)"/>
  <text x="525" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#a8ede6" letter-spacing="1">ONELAKE · single logical lake · open Delta-Parquet · one physical copy</text>
  <text x="525" y="143" text-anchor="middle" font-size="9.5" fill="#7dd8d0" data-node-id="bronze" tabindex="0" aria-label="Bronze: raw Delta landing (Tables area)"><title data-node-tooltip="true">Bronze: raw Delta landing (Tables area) — Raw data auto-registers as a Delta table in the lakehouse&apos;s managed Tables area.</title>every zone = Delta tables in the managed /tables area · ACID · schema enforcement · time travel</text>

  <!-- BRONZE zone -->
  <rect x="248" y="158" width="176" height="392" rx="12" fill="url(#bronze)" filter="url(#sh)"/>
  <text x="336" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BRONZE</text>
  <text x="336" y="198" text-anchor="middle" font-size="9.5" fill="#f2e0cf">raw landing · faithful copy</text>
  <rect x="262" y="212" width="148" height="26" rx="5" fill="#ffffff26"/><text x="336" y="229" text-anchor="middle" font-size="9.5" fill="#fff">Files area (any format)</text>
  <rect x="262" y="244" width="148" height="26" rx="5" fill="#ffffff26"/><text x="336" y="261" text-anchor="middle" font-size="9.5" fill="#fff">lightly-typed Delta</text>
  <rect x="262" y="286" width="148" height="70" rx="6" fill="#00000022"/>
  <text x="336" y="305" text-anchor="middle" font-size="9" fill="#ffe8d0" font-weight="600">Spark write knobs</text>
  <text x="336" y="321" text-anchor="middle" font-size="8.8" fill="#ffe8d0">V-Order OFF (write-heavy)</text>
  <text x="336" y="335" text-anchor="middle" font-size="8.8" fill="#ffe8d0">Optimized Write on</text>
  <text x="336" y="349" text-anchor="middle" font-size="8.8" fill="#ffe8d0">Auto Compaction</text>
  <text x="336" y="382" text-anchor="middle" font-size="8.5" fill="#f2e0cf" font-style="italic">completeness · replayability</text>

  <!-- SILVER zone -->
  <rect x="437" y="158" width="176" height="392" rx="12" fill="url(#silver)" filter="url(#sh)"/>
  <text x="525" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2b3138">SILVER</text>
  <text x="525" y="198" text-anchor="middle" font-size="9.5" fill="#3d444c">cleansed · conformed</text>
  <rect x="451" y="212" width="148" height="26" rx="5" fill="#ffffff44"/><text x="525" y="229" text-anchor="middle" font-size="9.5" fill="#2b3138">de-dup · type enforce</text>
  <rect x="451" y="244" width="148" height="26" rx="5" fill="#ffffff44"/><text x="525" y="261" text-anchor="middle" font-size="9.5" fill="#2b3138">joins · validation</text>
  <rect x="451" y="286" width="148" height="70" rx="6" fill="#2b313818"/>
  <text x="525" y="305" text-anchor="middle" font-size="9" fill="#2b3138" font-weight="600">Spark write knobs</text>
  <text x="525" y="321" text-anchor="middle" font-size="8.8" fill="#2b3138">V-Order OFF (still churny)</text>
  <text x="525" y="335" text-anchor="middle" font-size="8.8" fill="#2b3138">Optimized Write + compact</text>
  <text x="525" y="349" text-anchor="middle" font-size="8.8" fill="#2b3138">low-cardinality partitions</text>
  <text x="525" y="382" text-anchor="middle" font-size="8.5" fill="#3d444c" font-style="italic" data-node-id="spark-silver" tabindex="0" aria-label="Spark: cleanse &amp; conform to silver"><title data-node-tooltip="true">Spark: cleanse &amp; conform to silver — Spark de-duplicates, types, and joins bronze into validated, query-ready silver Delta tables.</title>query-ready Delta tables</text>

  <!-- GOLD zone -->
  <rect x="626" y="158" width="176" height="392" rx="12" fill="url(#gold)" filter="url(#sh)"/>
  <text x="714" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#3d2c00">GOLD</text>
  <text x="714" y="198" text-anchor="middle" font-size="9.5" fill="#4d3900" data-node-id="spark-gold" tabindex="0" aria-label="Spark: aggregate to gold"><title data-node-tooltip="true">Spark: aggregate to gold — Spark aggregates silver into curated, business-ready gold Delta tables.</title>business-ready serving</text>
  <rect x="640" y="212" width="148" height="26" rx="5" fill="#ffffff3a"/><text x="714" y="229" text-anchor="middle" font-size="9.5" fill="#3d2c00">star schema · aggregates</text>
  <rect x="640" y="244" width="148" height="26" rx="5" fill="#ffffff3a"/><text x="714" y="261" text-anchor="middle" font-size="9.5" fill="#3d2c00">managed /tables Delta</text>
  <rect x="640" y="286" width="148" height="70" rx="6" fill="#3d2c0018"/>
  <text x="714" y="305" text-anchor="middle" font-size="9" fill="#3d2c00" font-weight="600">Spark write knobs</text>
  <text x="714" y="321" text-anchor="middle" font-size="8.8" fill="#3d2c00">V-Order ON (read-heavy)</text>
  <text x="714" y="335" text-anchor="middle" font-size="8.8" fill="#3d2c00">~1 GB files (Direct Lake)</text>
  <text x="714" y="349" text-anchor="middle" font-size="8.8" fill="#3d2c00">scheduled OPTIMIZE</text>
  <text x="714" y="382" text-anchor="middle" font-size="8.5" fill="#4d3900" font-style="italic">fast, curated consumption</text>

  <!-- promote arrows between zones -->
  <line x1="424" y1="410" x2="437" y2="410" stroke="#063D3B" stroke-width="2.4" marker-end="url(#arT)"/>
  <text x="430" y="402" text-anchor="middle" font-size="8" fill="#eafff9">Spark</text>
  <line x1="613" y1="410" x2="626" y2="410" stroke="#063D3B" stroke-width="2.4" marker-end="url(#arT)"/>
  <text x="619" y="402" text-anchor="middle" font-size="8" fill="#eafff9">Spark</text>

  <!-- transaction-log note band -->
  <rect x="248" y="428" width="554" height="112" rx="10" fill="#00000026"/>
  <text x="525" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#a8ede6">Under every table: _delta_log (ACID) — the log, not a directory listing, is the source of truth</text>
  <text x="525" y="465" text-anchor="middle" font-size="9" fill="#c8f0ea">optimistic-concurrency commits · checkpoint every 10 commits · min/max stats drive data skipping</text>
  <text x="525" y="482" text-anchor="middle" font-size="9" fill="#c8f0ea">one copy read by T-SQL, Spark, and Analysis Services — no per-engine duplication</text>
  <rect x="300" y="495" width="180" height="34" rx="6" fill="#0d5c5399"/><text x="390" y="516" text-anchor="middle" font-size="9.5" fill="#fff">Native Execution Engine (NEE)</text>
  <rect x="500" y="495" width="200" height="34" rx="6" fill="#0d5c5399"/><text x="600" y="516" text-anchor="middle" font-size="9.5" fill="#fff">Managed Spark (starter / custom pools)</text>

  <!-- ═══ SERVING (right) ═══ -->
  <text x="960" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#0d3d35" letter-spacing="1">SERVING GOLD (read-only)</text>

  <rect x="838" y="180" width="256" height="80" rx="10" fill="#3ba898" filter="url(#sh)"/>
  <text x="966" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">SQL analytics endpoint</text>
  <text x="966" y="221" text-anchor="middle" font-size="9" fill="#c8f0ea" data-node-id="sql-endpoint" tabindex="0" aria-label="SQL analytics endpoint (read-only T-SQL)"><title data-node-tooltip="true">SQL analytics endpoint (read-only T-SQL) — Auto-provisioned at lakehouse creation; exposes gold Delta tables to read-only T-SQL.</title>auto-provisioned · read-only T-SQL</text>
  <text x="966" y="235" text-anchor="middle" font-size="9" fill="#c8f0ea">same engine as Warehouse</text>
  <text x="966" y="249" text-anchor="middle" font-size="9" fill="#c8f0ea">metadata syncs from _delta_log</text>

  <rect x="838" y="272" width="256" height="80" rx="10" fill="#f2c811" filter="url(#sh)"/>
  <text x="966" y="296" text-anchor="middle" font-size="12" font-weight="700" fill="#3d2c00">Direct Lake (Power BI)</text>
  <text x="966" y="313" text-anchor="middle" font-size="9" fill="#4d3900" data-node-id="direct-lake-serving" tabindex="0" aria-label="Direct Lake (Power BI semantic model)"><title data-node-tooltip="true">Direct Lake (Power BI semantic model) — Power BI reads gold Delta files straight from OneLake, lazily, with no import or refresh.</title>reads Delta straight from OneLake</text>
  <text x="966" y="327" text-anchor="middle" font-size="9" fill="#4d3900">import-mode speed, no copy</text>
  <text x="966" y="341" text-anchor="middle" font-size="9" fill="#4d3900">lazy column load · framing</text>

  <rect x="838" y="364" width="256" height="60" rx="10" fill="#e8ecff" stroke="#5b6af0" stroke-width="1.4" filter="url(#sh)"/>
  <text x="966" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#3f4ed6">Alt: surface Gold via Warehouse</text>
  <text x="966" y="402" text-anchor="middle" font-size="9" fill="#5b6af0">T-SQL-first teams needing multi-table</text>
  <text x="966" y="415" text-anchor="middle" font-size="9" fill="#5b6af0">transactions / full DML on served data</text>

  <!-- gold -> serving arrows -->
  <line x1="802" y1="230" x2="836" y2="216" stroke="#c08e0e" stroke-width="1.8" marker-end="url(#arGold)"/>
  <line x1="802" y1="300" x2="836" y2="308" stroke="#c08e0e" stroke-width="1.8" marker-end="url(#arGold)"/>
  <line x1="802" y1="360" x2="836" y2="388" stroke="#777" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arG)"/>

  <!-- ═══ GOVERNANCE strip ═══ -->
  <rect x="838" y="440" width="256" height="122" rx="10" fill="#fff3cd" stroke="#c8a200" stroke-width="1.2"/>
  <text x="966" y="461" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b5400">Governance — secure two paths</text>
  <text x="966" y="479" text-anchor="middle" font-size="8.8" fill="#6b5400" data-node-id="endpoint-security-warning" tabindex="0" aria-label="Trap: endpoint permissions don&apos;t cover Spark/OneLake reads"><title data-node-tooltip="true">Trap: endpoint permissions don&apos;t cover Spark/OneLake reads — SQL-endpoint GRANT/DENY only applies through that endpoint; Spark and OneLake reads bypass it.</title>SQL endpoint GRANT/DENY guards only</text>
  <text x="966" y="491" text-anchor="middle" font-size="8.8" fill="#6b5400">the T-SQL path; Spark + OneLake bypass it.</text>
  <text x="966" y="507" text-anchor="middle" font-size="8.8" fill="#6b5400">OneLake security roles constrain Viewers,</text>
  <text x="966" y="519" text-anchor="middle" font-size="8.8" fill="#6b5400">not workspace Admin/Member/Contributor.</text>
  <text x="966" y="536" text-anchor="middle" font-size="8.8" fill="#6b5400">Tenant policies auto-cover all OneLake data.</text>
  <text x="966" y="552" text-anchor="middle" font-size="8.8" fill="#6b5400" font-weight="600">Secure WRITE (Spark) ≠ secure READ (endpoint)</text>

  <!-- ═══ ANTI-PATTERN banner ═══ -->
  <rect x="230" y="592" width="864" height="52" rx="10" fill="#fdecea" stroke="#e57373" stroke-width="1.3"/>
  <text x="662" y="613" text-anchor="middle" font-size="11" font-weight="700" fill="#c62828">Anti-pattern: "gold-in-name-only"</text>
  <text x="662" y="631" text-anchor="middle" font-size="9.5" fill="#8a2b2b">Parquet files are immutable, so every update/delete adds files. An un-compacted gold layer accumulates small files that slow the very queries it exists to speed up — schedule OPTIMIZE/compaction.</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="22" y="308" width="180" height="230" rx="8" fill="#fff" stroke="#2da896" stroke-width="1" opacity="0.96"/>
  <text x="112" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#0d5c53">Legend</text>
  <rect x="32" y="336" width="14" height="10" rx="2" fill="url(#bronze)"/><text x="53" y="345" font-size="9" fill="#333">Bronze — raw landing</text>
  <rect x="32" y="352" width="14" height="10" rx="2" fill="url(#silver)"/><text x="53" y="361" font-size="9" fill="#333">Silver — cleansed</text>
  <rect x="32" y="368" width="14" height="10" rx="2" fill="url(#gold)"/><text x="53" y="377" font-size="9" fill="#333">Gold — serving</text>
  <rect x="32" y="384" width="14" height="10" rx="2" fill="url(#oneLake)"/><text x="53" y="393" font-size="9" fill="#333">OneLake / Delta store</text>
  <rect x="32" y="400" width="14" height="10" rx="2" fill="#2da896"/><text x="53" y="409" font-size="9" fill="#333">Ingestion / Spark engine</text>
  <line x1="32" y1="422" x2="46" y2="422" stroke="#1a7a6e" stroke-width="2.4"/><text x="53" y="425" font-size="9" fill="#333">Spark write / promote</text>
  <line x1="32" y1="438" x2="46" y2="438" stroke="#0d5c53" stroke-width="1.5" stroke-dasharray="5,3"/><text x="53" y="441" font-size="9" fill="#333">Zero-copy shortcut</text>
  <line x1="32" y1="454" x2="46" y2="454" stroke="#c08e0e" stroke-width="1.8"/><text x="53" y="457" font-size="9" fill="#333">Gold serving read</text>
  <rect x="32" y="466" width="14" height="10" rx="2" fill="#fff3cd" stroke="#c8a200"/><text x="53" y="475" font-size="9" fill="#333">Governance note</text>
  <rect x="32" y="482" width="14" height="10" rx="2" fill="#fdecea" stroke="#e57373"/><text x="53" y="491" font-size="9" fill="#333">Anti-pattern</text>
  <text x="112" y="512" text-anchor="middle" font-size="8" fill="#8A8886">Fabric Atlas — original</text>
  <text x="112" y="524" text-anchor="middle" font-size="8" fill="#8A8886">diagram, July 2026.</text>
  <text x="112" y="534" text-anchor="middle" font-size="8" fill="#8A8886">Not a Microsoft asset.</text>
</svg>
