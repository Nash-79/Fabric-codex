<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="metadata-driven-architecture-architecture-title metadata-driven-architecture-architecture-desc" data-diagram-id="metadata-driven-architecture-architecture"><title id="metadata-driven-architecture-architecture-title">Metadata-Driven Architecture on Fabric</title><desc id="metadata-driven-architecture-architecture-desc">A metadata contract describing sources and load rules is resolved into per-object configuration, which a single reusable pipeline and set of reusable notebooks execute against Fabric compute. Each run writes state, quality, and lineage telemetry to a run ledger; the ledger both proves what happened and supplies the watermark the next run reads to stay restartable. Two warning nodes call out where this pattern breaks: an over-grown metadata schema that turns into an untyped programming language, and non-idempotent writes that corrupt data on retry.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#063D3B"/><stop offset="1" stop-color="#117865"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2AAC94"/></marker></defs><rect width="1180" height="900" fill="#FAF9F8"/><rect width="1180" height="118" fill="url(#head)"/><text x="52" y="54" fill="white" font-size="28" font-weight="700">Metadata-Driven Frameworks in Microsoft Fabric</text><text x="52" y="84" fill="#CFF3E9" font-size="11" data-node-id="metadata-contract" tabindex="0" aria-label="Versioned metadata contract"><title data-node-tooltip="true">Versioned metadata contract — Object list, source, target shape, quality rules, load type — versioned like code.</title>Metadata-Driven Frameworks in Microsoft Fabric architecture — Versioned metadata contract, Reusable pipeline and notebook executors, Run-state, quality, and lineage telemetry</text><text x="52" y="154" fill="#605E5C" font-size="13" letter-spacing="2">END-TO-END ARCHITECTURE</text><path d="M 340 240 C 375 240, 395 240, 430 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 690 240 C 725 240, 745 240, 780 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="108" cy="198" r="16" fill="#117865"/><text x="108" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text><text x="230" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="quality-evidence" tabindex="0" aria-label="Quality evidence"><title data-node-tooltip="true">Quality evidence — Contract-defined rules are evaluated against the landed data and recorded as evidence.</title><tspan x="230" dy="0">Versioned metadata</tspan><tspan x="230" dy="22">contract</tspan></text>
<rect x="430" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="458" cy="198" r="16" fill="#117865"/><text x="458" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text><text x="580" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="pipeline-invocation" tabindex="0" aria-label="Reusable pipeline invocation"><title data-node-tooltip="true">Reusable pipeline invocation — One parameterized Data Factory pipeline drives every object instead of one pipeline per source.</title><tspan x="580" dy="0">Reusable pipeline and</tspan><tspan x="580" dy="22">notebook executors</tspan></text>
<rect x="780" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="808" cy="198" r="16" fill="#117865"/><text x="808" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text><text x="930" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="config-resolution" tabindex="0" aria-label="Config resolution"><title data-node-tooltip="true">Config resolution — Turns the generic contract into one object&apos;s concrete run parameters.</title><tspan x="930" dy="0">Run-state, quality, and</tspan><tspan x="930" dy="22">lineage telemetry</tspan></text><rect x="52" y="485" width="1076" height="118" rx="16" fill="#E8F6F1" stroke="#2AAC94" stroke-width="2"/><text x="76" y="515" fill="#117865" font-size="12" font-weight="700" letter-spacing="1.4">WORKED EXAMPLE</text><text x="76" y="547" fill="#063D3B" font-size="15" data-node-id="pipeline-run-execution" tabindex="0" aria-label="Pipeline run instance"><title data-node-tooltip="true">Pipeline run instance — Each trigger produces one concrete, individually monitorable run.</title><tspan x="76" dy="0">An Orders metadata row selects connector, target,</tspan><tspan x="76" dy="19">watermark, merge notebook, retry policy, and quality rules</tspan><tspan x="76" dy="19">without cloning a pipeline.</tspan></text><rect x="52" y="630" width="516" height="145" rx="16" fill="#EDF8F1" stroke="#6BBF8A"/><text x="78" y="662" fill="#176B3A" font-size="13" font-weight="700" letter-spacing="1.3">IMPLEMENTATION CONTROLS</text><text x="82" y="695" fill="#285943" font-size="14">✓ Schema-validated metadata</text><text x="82" y="719" fill="#285943" font-size="14">✓ Versioned promotion</text><text x="82" y="743" fill="#285943" font-size="14">✓ Secret references only</text><rect x="612" y="630" width="516" height="145" rx="16" fill="#FFF7E6" stroke="#D6A84B"/><text x="638" y="662" fill="#7A4B00" font-size="13" font-weight="700" letter-spacing="1.3">FAILURE MODES</text><text x="640" y="695" fill="#7A4B00" font-size="14" data-node-id="warning-metadata-language" tabindex="0" aria-label="Metadata becomes a hidden language"><title data-node-tooltip="true">Metadata becomes a hidden language — An over-flexible contract stops being config and starts being undocumented code.</title>⚠ Untyped metadata language</text><text x="640" y="719" fill="#7A4B00" font-size="14" data-node-id="run-ledger" tabindex="0" aria-label="Run ledger / state store"><title data-node-tooltip="true">Run ledger / state store — Records what happened, and holds the watermark the next run needs.</title>⚠ Mid-run configuration change</text><text x="640" y="743" fill="#7A4B00" font-size="14" data-node-id="warning-nonidempotent-retry" tabindex="0" aria-label="Non-idempotent retry corrupts data"><title data-node-tooltip="true">Non-idempotent retry corrupts data — Retrying a failed write without watermark discipline duplicates or corrupts committed rows.</title>⚠ Non-idempotent retry</text><rect x="52" y="800" width="1076" height="54" rx="13" fill="#F0F5F3" stroke="#B8D8CE"/><text x="590" y="832" text-anchor="middle" fill="#063D3B" font-size="14" data-node-id="lakehouse-landing" tabindex="0" aria-label="Lakehouse landing (Delta)"><title data-node-tooltip="true">Lakehouse landing (Delta) — Data lands as managed Delta tables, auto-registered and immediately queryable.</title>In Atlas: select a choice → inspect evidence → drill into inputs, processing, outputs, example, controls, and risks.</text><text x="1128" y="882" text-anchor="end" fill="#605E5C" font-size="10" data-node-id="lineage-telemetry" tabindex="0" aria-label="Lineage &amp; telemetry"><title data-node-tooltip="true">Lineage &amp; telemetry — Source-to-output lineage and monitoring signals captured for governance.</title>Fabric Atlas original · Microsoft Fabric implementation guidance</text></svg>
