<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" font-family="Segoe UI,Inter,Arial,sans-serif" role="img" aria-labelledby="metadata-driven-architecture-architecture-title metadata-driven-architecture-architecture-desc" data-diagram-id="metadata-driven-architecture-architecture">
 <title id="metadata-driven-architecture-architecture-title">Metadata-Driven Architecture on Fabric</title>
 <desc id="metadata-driven-architecture-architecture-desc">A metadata contract describing sources and load rules is resolved into per-object configuration, which a single reusable pipeline and set of reusable notebooks execute against Fabric compute. Each run writes state, quality, and lineage telemetry to a run ledger; the ledger both proves what happened and supplies the watermark the next run reads to stay restartable. Two warning nodes call out where this pattern breaks: an over-grown metadata schema that turns into an untyped programming language, and non-idempotent writes that corrupt data on retry.</desc>
 <defs><linearGradient id="mh" x2="1"><stop stop-color="#312E81"/><stop offset=".55" stop-color="#0369A1"/><stop offset="1" stop-color="#0F766E"/></linearGradient><linearGradient id="mr" x2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#ECFEFF"/></linearGradient><filter id="ms" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity=".13"/></filter><marker id="ma" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#0F766E"/></marker><marker id="mw" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#D97706"/></marker><style>.k{font-size:13px;font-weight:700;letter-spacing:2px}.h1{font-size:34px;font-weight:750}.h2{font-size:19px;font-weight:700}.h3{font-size:15px;font-weight:700}.b{font-size:13px}.s{font-size:12px}.m{font-size:11px}.n{fill:#0F172A}.mu{fill:#475569}.t{fill:#0F766E}.w{fill:#FFF}.ev{font-size:11px;font-weight:700;fill:#0369A1}.flow{fill:none;stroke:#0F766E;stroke-width:3;marker-end:url(#ma)}.feedback{fill:none;stroke:#7C3AED;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#ma)}[data-node-id]:focus{outline:none}[data-node-id]:focus>rect,[data-node-id]:focus>.focus-ring{stroke:#2563EB!important;stroke-width:4!important}</style></defs>
 <rect width="1440" height="1080" fill="#F8FAFC"/><rect width="1440" height="165" fill="url(#mh)"/><circle cx="1325" cy="20" r="155" fill="#FFF" opacity=".06"/>
 <text x="64" y="43" class="k" fill="#C4B5FD">FABRIC ATLAS · METADATA CONTROL PLANE</text><text x="64" y="85" class="h1 w">Govern once. Resolve per object. Observe every run.</text><text x="64" y="119" font-size="17" fill="#D5F5F1">The specification is the product; the reusable pipeline is its runtime.</text>
 <g transform="translate(64 136)"><rect width="260" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">CONTROL · versioned contract</text></g><g transform="translate(338 136)"><rect width="240" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">RUNTIME · one engine</text></g><g transform="translate(592 136)"><rect width="280" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">FEEDBACK · evidence + state</text></g>
 <text x="64" y="203" class="k mu">01 · SPECIFICATION CONTROL PLANE</text>
 <g data-node-id="metadata-contract" transform="translate(64 226)" tabindex="0" aria-label="Versioned metadata contract"><title data-node-tooltip="true">Versioned metadata contract — Object list, source, target shape, quality rules, load type — versioned like code.</title><rect class="focus-ring" width="520" height="170" rx="22" fill="#FFF" stroke="#A78BFA" stroke-width="2" filter="url(#ms)"/><circle cx="55" cy="57" r="30" fill="#EDE9FE"/><path d="M38 43h34M38 54h25M38 65h30" stroke="#6D28D9" stroke-width="4" stroke-linecap="round"/><text x="102" y="46" class="h2" fill="#5B21B6">Versioned metadata contract</text><text x="102" y="69" class="s mu">Reviewed like code · explicit schema · bounded vocabulary</text><g transform="translate(24 102)"><rect width="108" height="39" rx="10" fill="#F5F3FF"/><text x="14" y="17" class="m" fill="#6D28D9">SOURCE</text><text x="14" y="31" class="s n">endpoint + object</text></g><g transform="translate(142 102)"><rect width="108" height="39" rx="10" fill="#F5F3FF"/><text x="14" y="17" class="m" fill="#6D28D9">TARGET</text><text x="14" y="31" class="s n">shape + keys</text></g><g transform="translate(260 102)"><rect width="108" height="39" rx="10" fill="#F5F3FF"/><text x="14" y="17" class="m" fill="#6D28D9">RULES</text><text x="14" y="31" class="s n">quality gates</text></g><g transform="translate(378 102)"><rect width="118" height="39" rx="10" fill="#F5F3FF"/><text x="14" y="17" class="m" fill="#6D28D9">LOAD</text><text x="14" y="31" class="s n">full / incremental</text></g></g>
 <path d="M584 311h54" class="flow"/>
 <g data-node-id="config-resolution" transform="translate(638 226)" tabindex="0" aria-label="Config resolution"><title data-node-tooltip="true">Config resolution — Turns the generic contract into one object&apos;s concrete run parameters.</title><rect class="focus-ring" width="420" height="170" rx="22" fill="#FFF" stroke="#38BDF8" stroke-width="2" filter="url(#ms)"/><circle cx="52" cy="55" r="29" fill="#E0F2FE"/><path d="M34 46h36M39 56h26M44 66h16" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/><text x="96" y="47" class="h2" fill="#075985">Resolve per object</text><text x="96" y="70" class="s mu">Contract + trigger context → immutable run parameters</text><rect x="24" y="101" width="372" height="44" rx="12" fill="#F0F9FF"/><text x="40" y="120" class="m" fill="#0369A1">COMPILED RUN SPEC</text><text x="40" y="137" class="s n">object=Orders · watermark=1842 · mode=incremental</text></g>
 <path d="M1058 311h48" class="flow"/>
 <g data-node-id="pipeline-invocation" transform="translate(1106 226)" tabindex="0" aria-label="Reusable pipeline invocation"><title data-node-tooltip="true">Reusable pipeline invocation — One parameterized Data Factory pipeline drives every object instead of one pipeline per source.</title><rect class="focus-ring" width="270" height="170" rx="22" fill="#FFF" stroke="#2DD4BF" stroke-width="2" filter="url(#ms)"/><circle cx="51" cy="53" r="29" fill="#CCFBF1"/><path d="M39 39l28 14-28 14z" fill="#0F766E"/><text x="94" y="45" class="h2" fill="#115E59">Invoke once</text><text x="94" y="68" class="s mu">generic pipeline</text><path d="M24 95h222" stroke="#99F6E4"/><text x="24" y="119" class="s n">Parameters, not copied logic</text><text x="24" y="140" class="m mu">One deployment surface</text><circle cx="246" cy="23" r="14" fill="#ECFEFF"/><text x="246" y="27" text-anchor="middle" class="ev">S1</text></g>
 <text x="64" y="438" class="k mu">02 · OBJECT RUNTIME</text><rect x="64" y="456" width="1312" height="239" rx="26" fill="url(#mr)" stroke="#BAE6FD" stroke-width="2"/>
 <g data-node-id="pipeline-run-execution" transform="translate(92 484)" tabindex="0" aria-label="Pipeline run instance"><title data-node-tooltip="true">Pipeline run instance — Each trigger produces one concrete, individually monitorable run.</title><rect class="focus-ring" width="286" height="180" rx="19" fill="#FFF" stroke="#60A5FA" stroke-width="2"/><text x="20" y="31" class="h3" fill="#1D4ED8">Run instance #8472</text><text x="20" y="53" class="s mu">Orders · incremental · watermark 1842</text><g transform="translate(20 76)"><circle cx="18" cy="18" r="18" fill="#DBEAFE"/><path d="M12 18l5 5 9-11" fill="none" stroke="#2563EB" stroke-width="3"/><text x="48" y="16" class="s n">Copy / transform</text><text x="48" y="34" class="m mu">timed + correlated</text></g><rect x="20" y="133" width="246" height="27" rx="13" fill="#EFF6FF"/><text x="35" y="151" class="m" fill="#1D4ED8">STATUS · success / failed / retrying</text><circle cx="262" cy="23" r="14" fill="#EFF6FF"/><text x="262" y="27" text-anchor="middle" class="ev">S1</text></g>
 <path d="M378 574h46" class="flow"/>
 <g data-node-id="lakehouse-landing" transform="translate(424 484)" tabindex="0" aria-label="Lakehouse landing (Delta)"><title data-node-tooltip="true">Lakehouse landing (Delta) — Data lands as managed Delta tables, auto-registered and immediately queryable.</title><rect class="focus-ring" width="286" height="180" rx="19" fill="#FFF" stroke="#22D3EE" stroke-width="2"/><g transform="translate(20 22)"><path d="M0 31L26 7l26 24v42H0z" fill="#CFFAFE" stroke="#0891B2" stroke-width="4"/><path d="M0 54c12 7 40 7 52 0v20c-12 7-40 7-52 0z" fill="#06B6D4"/></g><text x="92" y="40" class="h3" fill="#155E75">Lakehouse landing</text><text x="92" y="61" class="s mu">managed Delta tables</text><path d="M20 105h246" stroke="#A5F3FC"/><text x="20" y="130" class="s n">Auto-registered + queryable</text><text x="20" y="151" class="m mu">Same target contract for every object</text><circle cx="262" cy="23" r="14" fill="#ECFEFF"/><text x="262" y="27" text-anchor="middle" class="ev">S2</text></g>
 <path d="M710 574h46" class="flow"/>
 <g data-node-id="quality-evidence" transform="translate(756 484)" tabindex="0" aria-label="Quality evidence"><title data-node-tooltip="true">Quality evidence — Contract-defined rules are evaluated against the landed data and recorded as evidence.</title><rect class="focus-ring" width="286" height="180" rx="19" fill="#FFF" stroke="#34D399" stroke-width="2"/><circle cx="49" cy="53" r="29" fill="#D1FAE5"/><path d="M35 53l9 9 19-23" fill="none" stroke="#059669" stroke-width="5"/><text x="92" y="40" class="h3" fill="#065F46">Quality evidence</text><text x="92" y="61" class="s mu">rule outcomes + reason codes</text><g transform="translate(20 102)"><rect width="115" height="43" rx="10" fill="#ECFDF5"/><text x="14" y="19" class="m" fill="#047857">PASS</text><text x="14" y="34" class="s n">publish row</text></g><g transform="translate(146 102)"><rect width="120" height="43" rx="10" fill="#FFF7ED"/><text x="14" y="19" class="m" fill="#C2410C">FAIL</text><text x="14" y="34" class="s n">reason + action</text></g></g>
 <path d="M1042 574h46" class="flow"/>
 <g data-node-id="run-ledger" transform="translate(1088 484)" tabindex="0" aria-label="Run ledger / state store"><title data-node-tooltip="true">Run ledger / state store — Records what happened, and holds the watermark the next run needs.</title><rect class="focus-ring" width="260" height="180" rx="19" fill="#FFF" stroke="#A78BFA" stroke-width="2"/><circle cx="47" cy="49" r="27" fill="#EDE9FE"/><path d="M34 38h26v28H34zM39 46h16M39 53h16M39 60h10" fill="none" stroke="#7C3AED" stroke-width="3"/><text x="86" y="40" class="h3" fill="#5B21B6">Run ledger</text><text x="86" y="61" class="s mu">state + watermark</text><text x="20" y="104" class="s n">rows read / written / rejected</text><text x="20" y="126" class="s n">contract version + correlation ID</text><rect x="20" y="143" width="220" height="24" rx="12" fill="#F5F3FF"/><text x="34" y="159" class="m" fill="#6D28D9">NEXT WATERMARK · 1974</text></g>
 <path d="M1218 484V420H848v-24" class="feedback"/><text x="944" y="414" class="m" fill="#6D28D9">next run state feeds resolution</text>
 <text x="64" y="737" class="k mu">03 · GOVERNANCE + OPERATIONS</text>
 <g data-node-id="lineage-telemetry" transform="translate(64 758)" tabindex="0" aria-label="Lineage &amp; telemetry"><title data-node-tooltip="true">Lineage &amp; telemetry — Source-to-output lineage and monitoring signals captured for governance.</title><rect class="focus-ring" width="704" height="126" rx="20" fill="#FFF" stroke="#38BDF8" stroke-width="2"/><text x="24" y="34" class="h2" fill="#075985">Lineage + telemetry spine</text><text x="24" y="60" class="s mu">source object → contract version → run ID → Delta table → quality result</text><g transform="translate(24 78)"><circle cx="12" cy="12" r="12" fill="#DBEAFE"/><text x="36" y="16" class="s n">duration</text><circle cx="128" cy="12" r="12" fill="#CCFBF1"/><text x="152" y="16" class="s n">row counts</text><circle cx="264" cy="12" r="12" fill="#EDE9FE"/><text x="288" y="16" class="s n">lineage</text><circle cx="382" cy="12" r="12" fill="#FFEDD5"/><text x="406" y="16" class="s n">alerts</text></g><circle cx="680" cy="22" r="14" fill="#EFF6FF"/><text x="680" y="26" text-anchor="middle" class="ev">S3</text></g>
 <g data-node-id="warning-metadata-language" transform="translate(792 758)" tabindex="0" aria-label="Metadata becomes a hidden language"><title data-node-tooltip="true">Metadata becomes a hidden language — An over-flexible contract stops being config and starts being undocumented code.</title><rect class="focus-ring" width="272" height="126" rx="20" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><path d="M20 88l31-58 31 58z" fill="#F59E0B"/><path d="M51 49v20M51 78v3" stroke="#FFF" stroke-width="5" stroke-linecap="round"/><text x="100" y="35" class="h3" fill="#9A3412">Hidden language</text><text x="100" y="58" class="s" fill="#7C2D12">If config has loops, branches,</text><text x="100" y="77" class="s" fill="#7C2D12">and expressions, govern it as code.</text><text x="100" y="101" class="m mu">Bound vocabulary · schema · review</text></g>
 <g data-node-id="warning-nonidempotent-retry" transform="translate(1084 758)" tabindex="0" aria-label="Non-idempotent retry corrupts data"><title data-node-tooltip="true">Non-idempotent retry corrupts data — Retrying a failed write without watermark discipline duplicates or corrupts committed rows.</title><rect class="focus-ring" width="292" height="126" rx="20" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/><path d="M36 67a24 24 0 1142 13" fill="none" stroke="#DC2626" stroke-width="5"/><path d="M71 80l12 3-4-12" fill="#DC2626"/><text x="99" y="35" class="h3" fill="#991B1B">Unsafe retry</text><text x="99" y="58" class="s" fill="#7F1D1D">Blind rerun + stale watermark</text><text x="99" y="77" class="s" fill="#7F1D1D">can duplicate committed rows.</text><text x="99" y="101" class="m mu">Idempotency key · atomic state update</text></g>
 <path d="M1210 758v-45H1230v-49" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#mw)"/>
 <g transform="translate(64 914)"><rect width="1312" height="112" rx="20" fill="#E2E8F0"/><text x="24" y="30" class="h3 n">What to watch</text><text x="24" y="57" class="s mu">• Treat contract changes as releases: validate schema, review diffs, and retain the version used by every run.</text><text x="24" y="79" class="s mu">• Advance the watermark only with the committed write; correlate retry, row counts, quality evidence, and lineage under one run ID.</text><rect x="1020" y="24" width="264" height="64" rx="14" fill="#FFF"/><text x="1038" y="47" class="m" fill="#0F766E" font-weight="700">DESIGN TEST</text><text x="1038" y="68" class="s n">Can one object fail without hiding</text><text x="1038" y="85" class="s n">the state of every other object?</text></g><text x="1376" y="1066" text-anchor="end" class="m" fill="#64748B">Fabric Atlas original · product-neutral vector illustration</text>
</svg>
