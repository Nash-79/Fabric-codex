<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="metadata-driven-architecture-decision-title metadata-driven-architecture-decision-desc" data-diagram-id="metadata-driven-architecture-decision">
  <title id="metadata-driven-architecture-decision-title">Metadata-Driven or Plain Pipeline? A Fabric Data Factory Decision Tree</title>
  <desc id="metadata-driven-architecture-decision-desc">A decision tree starting from one root question: how many data objects need loading, and do they share a load shape? One source with a one-off shape routes to a plain Data Factory pipeline. Many sources with genuinely different shapes routes to a warning anti-pattern: forcing mismatched shapes into one metadata contract causes config explosion. Many sources sharing one shape routes to a second gate asking how much scale and audit rigor is needed, which forks again into a lightweight outcome — pipeline parameters plus a variable library — for modest scale, or an externalized outcome — a versioned metadata contract plus a run ledger — for larger scale or compliance-driven audit needs.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Palette matches the house teal/green family used across content/diagrams/fabric-platform-overview.svg
       and content/diagrams/metadata-driven-architecture-architecture.svg (#063D3B #0B5E50 #117865 #2AAC94).
       Grounds claims: d9dab580 (pipelines as orchestration layer), 928a2bf6 (ForEach/If-Condition control
       flow), 1d4dd80d (schedule parameters sourced from variable library), 03935bae (20 schedules/pipeline),
       b21728ac (Purview Data Map lineage), 383c1da5 (Monitor hub per-run detail).
       Vendored official Microsoft Fabric icon: data_factory_32_color — see
       content/diagrams/icons/microsoft/NOTICE.md -->
  <defs>
    <linearGradient id="mdd-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063D3B"/>
      <stop offset="0.55" stop-color="#0B5E50"/>
      <stop offset="1" stop-color="#117865"/>
    </linearGradient>
    <linearGradient id="mdd-ledger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.55" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <marker id="mdd-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="mdd-arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#117865"/>
    </marker>
    <marker id="mdd-arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B45309"/>
    </marker>
    <!-- Namespaced gradients inlined from vendored Microsoft Fabric data_factory_32_color icon -->
    <linearGradient id="mdd-ic-df-a" x1="10.781" x2="30.106" y1="31.369" y2="12.082" gradientUnits="userSpaceOnUse"><stop offset=".26" stop-color="#0D7012"/><stop offset="1" stop-color="#085714"/></linearGradient>
    <linearGradient id="mdd-ic-df-b" x1="39.387" x2="2.72" y1="17.476" y2="25.606" gradientUnits="userSpaceOnUse"><stop offset=".04" stop-color="#114A8A"/><stop offset="1" stop-color="#0C59A3" stop-opacity="0"/></linearGradient>
    <linearGradient id="mdd-ic-df-c" x1="-12.6" x2="24.57" y1="15.999" y2="15.999" gradientUnits="userSpaceOnUse"><stop stop-color="#107C10"/><stop offset=".96" stop-color="#56B50E"/></linearGradient>
    <linearGradient id="mdd-ic-df-e" x1="31.276" x2="13.178" y1="25.56" y2="-.241" gradientUnits="userSpaceOnUse"><stop offset=".04" stop-color="#33980F"/><stop offset="1" stop-color="#BAE884"/></linearGradient>
    <linearGradient id="mdd-ic-df-f" x1="25.653" x2="29.858" y1="14.179" y2="14.179" gradientUnits="userSpaceOnUse"><stop stop-color="#E5FAC1" stop-opacity="0"/><stop offset=".56" stop-color="#E5FAC1" stop-opacity=".52"/><stop offset="1" stop-color="#E5FAC1"/></linearGradient>
    <linearGradient id="mdd-ic-df-g" x1="8.258" x2="19.174" y1="-11.236" y2="7.623" gradientUnits="userSpaceOnUse"><stop offset=".14" stop-color="#FDE100"/><stop offset=".98" stop-color="#FFC600" stop-opacity="0"/></linearGradient>
    <radialGradient id="mdd-ic-df-d" cx="0" cy="0" r="1" gradientTransform="matrix(3.9449 -5.92005 15.0847 10.05187 20.53 14.48)" gradientUnits="userSpaceOnUse"><stop stop-opacity=".3"/><stop offset="1" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1180" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <rect width="1180" height="112" fill="url(#mdd-hdr)"/>
  <g data-official-icon="microsoft" data-icon-name="data_factory_32_color">
    <g transform="translate(34,24) scale(1.6)">
      <path fill="url(#mdd-ic-df-a)" d="M10.09 29.997a.955.955 0 0 1-.944-1.091c1.244-8.42 8.46-14.657 16.954-14.657h1.719c1.173 0 2.033-.7 2.033-1.876l.097-.462v8.168a2.327 2.327 0 0 1-2.326 2.331h-.964a8.15 8.15 0 0 0-7.789 5.768l-.307.994c-.154.49-.6.825-1.11.825z"/>
      <path fill="url(#mdd-ic-df-b)" d="M10.09 29.997a.955.955 0 0 1-.944-1.091c1.244-8.42 8.46-14.657 16.954-14.657h1.719c1.173 0 2.033-.7 2.033-1.876l.097-.462v8.168a2.327 2.327 0 0 1-2.326 2.331h-.964a8.15 8.15 0 0 0-7.789 5.768l-.307.994c-.154.49-.6.825-1.11.825z"/>
      <path fill="url(#mdd-ic-df-c)" d="M3.167 20.667A1.17 1.17 0 0 1 2 19.498V12.5a1.17 1.17 0 0 1 1.167-1.169h20.956A1.17 1.17 0 0 1 25.29 12.5v7a1.17 1.17 0 0 1-1.167 1.168z"/>
      <path fill="url(#mdd-ic-df-d)" d="M3.167 20.667A1.17 1.17 0 0 1 2 19.498V12.5a1.17 1.17 0 0 1 1.167-1.169h20.956A1.17 1.17 0 0 1 25.29 12.5v7a1.17 1.17 0 0 1-1.167 1.168z"/>
      <path fill="url(#mdd-ic-df-e)" d="M10.103 2a.97.97 0 0 0-.957 1.106c1.244 8.574 8.578 14.93 17.227 14.93h1.446c1.173 0 2.123.951 2.123 2.127v-8.245c0-1.288-1.04-2.33-2.326-2.33h-.964a8.15 8.15 0 0 1-7.789-5.768l-.307-.994A1.17 1.17 0 0 0 17.446 2z"/>
      <path fill="url(#mdd-ic-df-f)" opacity=".4" d="M27.616 9.58h-.964a8.08 8.08 0 0 1-4.527-1.386v9.31a17.5 17.5 0 0 0 4.254.531h1.446c1.174 0 2.124.952 2.124 2.128v-8.245a2.327 2.327 0 0 0-2.326-2.33z"/>
      <path fill="url(#mdd-ic-df-g)" opacity=".7" d="M10.158 2a.97.97 0 0 0-.957 1.106c1.244 8.574 8.579 14.93 17.227 14.93h1.446c1.173 0 2.123.951 2.123 2.127v-8.245c0-1.288-1.04-2.33-2.326-2.33h-.964a8.15 8.15 0 0 1-7.789-5.768l-.307-.994c-.154-.49-.6-.826-1.11-.826z"/>
    </g>
  </g>
  <text x="98" y="46" font-size="11" letter-spacing="1.5" fill="#9AD2C5">DATA FACTORY · METADATA-DRIVEN PATTERN</text>
  <text x="98" y="76" font-size="23" font-weight="650" fill="#FFFFFF">Metadata-driven or plain pipeline?</text>
  <text x="98" y="98" font-size="12.5" fill="#D9F5EE">Earn contract complexity with repeated shapes, scale, and audit need — never with source count alone.</text>

  <!-- Legend -->
  <g transform="translate(34,124)" font-size="10.5">
    <rect width="1112" height="30" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
    <circle cx="18" cy="15" r="5" fill="#117865"/><text x="30" y="19" fill="#3F6259">fact (sourced)</text>
    <circle cx="128" cy="15" r="5" fill="#2AAC94"/><text x="140" y="19" fill="#3F6259">pattern (recommended)</text>
    <circle cx="286" cy="15" r="5" fill="#0E6961"/><text x="298" y="19" fill="#3F6259">inference (interpretation)</text>
    <circle cx="470" cy="15" r="5" fill="#B45309"/><text x="482" y="19" fill="#7A4A16">warning / anti-pattern</text>
    <line x1="640" y1="15" x2="675" y2="15" stroke="#2AAC94" stroke-width="2" marker-end="url(#mdd-arr)"/><text x="682" y="19" fill="#3F6259">branch (labelled answer)</text>
    <text x="1090" y="19" text-anchor="end" fill="#8A8886">Fabric Atlas original diagram, July 2026</text>
  </g>

  <!-- ============ GATE 1: root question ============ -->
  <g data-node-id="start-question" tabindex="0" aria-label="How many sources, and do they share a load shape?">
    <title data-node-tooltip="true">How many sources, and do they share a load shape? — The root question: object count and shape similarity, not team size or budget, should drive this decision.</title>
    <rect x="34" y="176" width="410" height="188" rx="18" fill="#FFFFFF" stroke="#117865" stroke-width="2"/>
    <rect x="34" y="176" width="410" height="34" rx="18" fill="#117865"/>
    <rect x="34" y="192" width="410" height="18" fill="#117865"/>
    <text x="52" y="198" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">GATE 1 · REPEATABILITY</text>
    <circle cx="76" cy="252" r="26" fill="#DFF5EE"/>
    <path d="M60 244h32M60 254h22M60 264h27" stroke="#117865" stroke-width="3.4" stroke-linecap="round"/>
    <text x="118" y="240" font-size="16" font-weight="650" fill="#063D3B">How many sources — and</text>
    <text x="118" y="262" font-size="16" font-weight="650" fill="#063D3B">do they share one shape?</text>
    <text x="52" y="298" font-size="11.5" fill="#3F6259">Compare extraction, watermark, validation, and</text>
    <text x="52" y="315" font-size="11.5" fill="#3F6259">landing semantics — similar names do not imply</text>
    <text x="52" y="332" font-size="11.5" fill="#3F6259">similar load behavior.</text>
    <rect x="52" y="344" width="66" height="16" rx="8" fill="#DFF5EE"/><text x="85" y="355" text-anchor="middle" font-size="8.5" fill="#0B5E50">fact</text>
  </g>

  <!-- branch: one-off -->
  <path d="M444 236 H504 V212 H570" stroke="#2AAC94" stroke-width="2.4" fill="none" marker-end="url(#mdd-arr)"/>
  <text x="486" y="203" font-size="10.5" fill="#0B5E50" font-weight="600">one source, one-off shape</text>

  <g data-node-id="outcome-one-off" tabindex="0" aria-label="Keep it a plain pipeline">
    <title data-node-tooltip="true">Keep it a plain pipeline — One source, one-off shape: a plain parameterized pipeline is simpler and just as correct.</title>
    <rect x="570" y="150" width="330" height="122" rx="16" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.6"/>
    <circle cx="616" cy="196" r="24" fill="#DFF5EE"/>
    <path d="M606 184l24 12-24 13z" fill="#117865"/>
    <text x="654" y="190" font-size="14.5" font-weight="650" fill="#063D3B">Plain pipeline</text>
    <text x="654" y="209" font-size="11" fill="#3F6259">One source · unique shape</text>
    <text x="592" y="240" font-size="10.5" fill="#3F6259">Parameterize obvious values (connection,</text>
    <text x="592" y="256" font-size="10.5" fill="#3F6259">target table) with a variable library; keep</text>
    <text x="592" y="272" font-size="10.5" fill="#3F6259">the control flow visible in one pipeline.</text>
    <rect x="810" y="238" width="66" height="16" rx="8" fill="#DFF5EE"/><text x="843" y="249" text-anchor="middle" font-size="8.5" fill="#0B5E50">pattern</text>
  </g>

  <!-- branch: many + same shape -->
  <path d="M444 300 H504 V400 H570" stroke="#2AAC94" stroke-width="2.4" fill="none" marker-end="url(#mdd-arr)"/>
  <text x="480" y="390" font-size="10.5" fill="#0B5E50" font-weight="600">many sources, same shape</text>

  <!-- ============ GATE 2: scale & governance ============ -->
  <g data-node-id="check-scale-governance" tabindex="0" aria-label="How much scale and audit rigor is needed?">
    <title data-node-tooltip="true">How much scale and audit rigor is needed? — Second-order question once metadata-driven is justified: lightweight config vs. externalized governed contract.</title>
    <rect x="570" y="330" width="330" height="176" rx="18" fill="#FFFFFF" stroke="#0E6961" stroke-width="2"/>
    <rect x="570" y="330" width="330" height="34" rx="18" fill="#0E6961"/>
    <rect x="570" y="346" width="330" height="18" fill="#0E6961"/>
    <text x="588" y="352" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">GATE 2 · SCALE + AUDIT RIGOR</text>
    <text x="592" y="400" font-size="15" font-weight="650" fill="#063D3B">How much control is required?</text>
    <g transform="translate(592,414)">
      <rect width="140" height="52" rx="10" fill="#DFF5EE"/>
      <text x="14" y="21" font-size="10" font-weight="700" fill="#0B5E50">MODEST</text>
      <text x="14" y="38" font-size="10" fill="#3F6259">few objects, low audit</text>
    </g>
    <g transform="translate(746,414)">
      <rect width="140" height="52" rx="10" fill="#EAF7F2" stroke="#9AD2C5"/>
      <text x="14" y="21" font-size="10" font-weight="700" fill="#0E6961">GOVERNED</text>
      <text x="14" y="38" font-size="10" fill="#3F6259">scale, audit, replay</text>
    </g>
    <rect x="592" y="478" width="66" height="16" rx="8" fill="#DFF5EE"/><text x="625" y="489" text-anchor="middle" font-size="8.5" fill="#0B5E50">inference</text>
  </g>

  <!-- branch: modest -> lightweight -->
  <path d="M900 414 H960 V300 H1020" stroke="#2AAC94" stroke-width="2.4" fill="none" marker-end="url(#mdd-arr)"/>
  <text x="924" y="291" font-size="10.5" fill="#0B5E50" font-weight="600">modest scale, modest audit</text>

  <g data-node-id="outcome-lightweight-config" tabindex="0" aria-label="Lightweight: pipeline parameters + variable library">
    <title data-node-tooltip="true">Lightweight: pipeline parameters + variable library — Modest object count, modest audit needs: parameters and a variable library are enough contract.</title>
    <rect x="762" y="130" width="384" height="176" rx="16" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.6"/>
    <text x="784" y="160" font-size="14.5" font-weight="650" fill="#063D3B">Lightweight configuration</text>
    <text x="784" y="180" font-size="11" fill="#3F6259">Pipeline parameters + variable library</text>
    <g transform="translate(784,196)">
      <rect width="340" height="60" rx="10" fill="#DFF5EE"/>
      <path d="M18 20h27M18 30h20M18 40h24" stroke="#117865" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="24" font-size="10.5" fill="#063D3B">Schedule reads parameter values from a</text>
      <text x="62" y="40" font-size="10.5" fill="#063D3B">variable library — centralized for promotion</text>
      <text x="62" y="55" font-size="10" fill="#3F6259">across dev/test/prod, no new control plane</text>
    </g>
    <rect x="784" y="264" width="66" height="16" rx="8" fill="#DFF5EE"/><text x="817" y="275" text-anchor="middle" font-size="8.5" fill="#0B5E50">fact</text>
    <rect x="858" y="264" width="182" height="16" rx="8" fill="#C7ECE0"/><text x="949" y="275" text-anchor="middle" font-size="8.5" fill="#063D3B">max 20 schedules / pipeline</text>
  </g>

  <!-- branch: scale/audit -> externalized -->
  <path d="M900 466 H960 V546 H1020" stroke="#0E6961" stroke-width="2.4" fill="none" marker-end="url(#mdd-arrDark)"/>
  <text x="924" y="537" font-size="10.5" fill="#0E6961" font-weight="600">larger scale or audit-driven</text>

  <g data-node-id="outcome-externalized-contract" tabindex="0" aria-label="Externalized: versioned contract + run ledger">
    <title data-node-tooltip="true">Externalized: versioned contract + run ledger — Larger object count or real audit requirements: build the full metadata-driven framework.</title>
    <rect x="762" y="376" width="384" height="216" rx="16" fill="url(#mdd-ledger)"/>
    <text x="784" y="406" font-size="14.5" font-weight="650" fill="#FFFFFF">Governed contract</text>
    <text x="784" y="426" font-size="11" fill="#D9F5EE">Versioned spec + run ledger</text>
    <g transform="translate(784,442)">
      <rect width="340" height="90" rx="10" fill="#FFFFFF" opacity="0.14"/>
      <text x="18" y="24" font-size="10.5" fill="#FFFFFF">check schema validation + code review</text>
      <text x="18" y="46" font-size="10.5" fill="#FFFFFF">check watermark + idempotent replay</text>
      <text x="18" y="68" font-size="10.5" fill="#FFFFFF">check lineage + quality evidence per run</text>
    </g>
    <rect x="784" y="544" width="340" height="24" rx="12" fill="#FFFFFF" opacity="0.18"/>
    <text x="954" y="560" text-anchor="middle" font-size="10.5" font-weight="650" fill="#FFFFFF">OPERATE IT AS A PRODUCT</text>
    <text x="784" y="586" font-size="9.5" fill="#D9F5EE">See the full architecture diagram &#8594;</text>
  </g>

  <!-- branch: many + different shapes -> anti-pattern -->
  <path d="M240 364 V660 H278" stroke="#B45309" stroke-width="2.4" stroke-dasharray="7 6" fill="none" marker-end="url(#mdd-arrWarn)"/>
  <text x="250" y="654" font-size="10.5" fill="#B45309" font-weight="600">many sources, different shapes</text>

  <g data-node-id="outcome-shape-mismatch-warning" tabindex="0" aria-label="Anti-pattern: forcing mismatched shapes into one contract">
    <title data-node-tooltip="true">Anti-pattern: forcing mismatched shapes into one contract — Many sources, but genuinely different shapes: one contract trying to describe everything becomes the config-explosion failure.</title>
    <rect x="278" y="646" width="868" height="150" rx="18" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
    <path d="M304 750l34-64 34 64z" fill="#F59E0B"/>
    <path d="M338 704v24M338 738v3" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="400" y="686" font-size="15.5" font-weight="650" fill="#9A3412">Stop: different shapes do not belong in one universal contract</text>
    <text x="400" y="710" font-size="11" fill="#7C2D12">When each source needs unique branches, expressions, and exception flags, metadata has</text>
    <text x="400" y="726" font-size="11" fill="#7C2D12">quietly become a hidden programming language instead of declarative configuration.</text>
    <g transform="translate(400,742)">
      <rect width="248" height="34" rx="17" fill="#FFEDD5"/>
      <text x="14" y="22" font-size="10.5" fill="#9A3412">Split into a few explicit load patterns</text>
    </g>
    <g transform="translate(662,742)">
      <rect width="230" height="34" rx="17" fill="#FFEDD5"/>
      <text x="14" y="22" font-size="10.5" fill="#9A3412">Review contract growth as risk</text>
    </g>
    <rect x="1076" y="656" width="60" height="16" rx="8" fill="#FDE9E7"/><text x="1106" y="667" text-anchor="middle" font-size="8.5" fill="#7A241A">warning</text>
  </g>

  <!-- ============ Decision rule summary strip ============ -->
  <g transform="translate(34,812)">
    <rect width="1112" height="72" rx="16" fill="#F3F2F1" stroke="#E1DFDD"/>
    <text x="22" y="26" font-size="13" font-weight="650" fill="#063D3B">Decision rule</text>
    <text x="22" y="48" font-size="11" fill="#3F6259">One-off &#8594; plain pipeline · repeated shape at modest scale &#8594; lightweight config · repeated shape with scale/audit &#8594; governed contract · mismatched shapes &#8594; separate explicit patterns.</text>
    <rect x="858" y="16" width="234" height="40" rx="10" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="975" y="32" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0B5E50" letter-spacing="1">SUCCESS SIGNAL</text>
    <text x="975" y="48" text-anchor="middle" font-size="9.5" fill="#3F6259">less copied logic, not more config</text>
  </g>

  <text x="1146" y="890" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset; Data Factory icon vendored under Microsoft's Fabric icon terms.</text>
</svg>
