<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900"
     font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="mirrorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="dataflowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <marker id="dArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="dShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>

  <rect width="1180" height="900" fill="url(#bgGrad2)" rx="12"/>

  <!-- Title -->
  <text x="590" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">
    Choosing an Ingestion Path: Mirroring vs Dataflow Gen2 vs Data Factory Pipeline
  </text>
  <text x="590" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">
    A decision guide for landing an operational source into OneLake — orchestration scope, shaping needs, and freshness requirement decide the branch
  </text>

  <!-- ══════════════════════════════════════════
       TOP: Root decision question + branch gate
  ══════════════════════════════════════════ -->
  <rect x="380" y="76" width="420" height="52" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#dShadow)"/>
  <text x="590" y="97" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">What does the ingestion job actually need to do?</text>
  <text x="590" y="115" text-anchor="middle" font-size="10.5" fill="#94a3b8">Continuous current-state replica · Low-code shaping · Large-scale orchestrated movement</text>

  <!-- Three branch lines down to lane headers -->
  <line x1="500" y1="128" x2="200" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <line x1="590" y1="128" x2="590" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <line x1="680" y1="128" x2="980" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dArrow)"/>

  <text x="210" y="150" font-size="10.5" fill="#5eead4" font-style="italic" text-anchor="middle">"just keep a live copy, no transform"</text>
  <text x="620" y="150" font-size="10.5" fill="#c4b5fd" font-style="italic" text-anchor="start">"reshape/clean before landing"</text>
  <text x="970" y="150" font-size="10.5" fill="#fcd34d" font-style="italic" text-anchor="middle">"orchestrate many steps/sources at scale"</text>

  <!-- ══════════════════════════════════════════
       LANE HEADERS (3 columns)
  ══════════════════════════════════════════ -->
  <!-- Mirroring lane -->
  <rect x="30" y="168" width="360" height="52" rx="8" fill="url(#mirrorGrad)" filter="url(#dShadow)"/>
  <text x="210" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#022c22">MIRRORING</text>
  <text x="210" y="210" text-anchor="middle" font-size="10.5" fill="#022c22">Serverless replication · current-state replica</text>

  <!-- Dataflow Gen2 lane -->
  <rect x="410" y="168" width="360" height="52" rx="8" fill="url(#dataflowGrad)" filter="url(#dShadow)"/>
  <text x="590" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#f5f3ff">DATAFLOW GEN2</text>
  <text x="590" y="210" text-anchor="middle" font-size="10.5" fill="#ede9fe">Low-code Power Query shaping</text>

  <!-- Data Factory Pipeline lane -->
  <rect x="790" y="168" width="360" height="52" rx="8" fill="url(#pipelineGrad)" filter="url(#dShadow)"/>
  <text x="970" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#451a03"># DATA FACTORY PIPELINE</text>
  <text x="970" y="210" text-anchor="middle" font-size="10.5" fill="#451a03">Orchestration &amp; large-scale copy/transform</text>

  <!-- Lane background columns -->
  <rect x="30" y="230" width="360" height="470" rx="8" fill="#14b8a6" opacity="0.06" stroke="#0d9488" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="410" y="230" width="360" height="470" rx="8" fill="#8b5cf6" opacity="0.07" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="790" y="230" width="360" height="470" rx="8" fill="#f59e0b" opacity="0.06" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════════════════════════════════════════
       ROW LABELS (criteria) — left gutter
  ══════════════════════════════════════════ -->
  <text x="30" y="252" font-size="10.5" font-weight="700" fill="#64748b">CRITERIA →</text>

  <!-- Row 1: Best when -->
  <rect x="30" y="238" width="1120" height="86" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="252" font-size="10.5" font-weight="700" fill="#cbd5e1">Best when</text>

  <text x="46" y="270" font-size="11" fill="#a7f3d0">Source has native connector; goal</text>
  <text x="46" y="285" font-size="11" fill="#a7f3d0">is an up-to-date OneLake replica</text>
  <text x="46" y="300" font-size="11" fill="#a7f3d0">with zero pipeline maintenance</text>

  <text x="426" y="270" font-size="11" fill="#ddd6fe">Data needs cleaning, filtering,</text>
  <text x="426" y="285" font-size="11" fill="#ddd6fe">merging, or type conversion</text>
  <text x="426" y="300" font-size="11" fill="#ddd6fe">before it lands — low-code authoring</text>

  <text x="806" y="270" font-size="11" fill="#fde68a">Many sources/activities need</text>
  <text x="806" y="285" font-size="11" fill="#fde68a">coordinated, scheduled, or</text>
  <text x="806" y="300" font-size="11" fill="#fde68a">event-triggered orchestration</text>

  <!-- Row 2: Freshness -->
  <rect x="30" y="328" width="1120" height="66" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="342" font-size="10.5" font-weight="700" fill="#cbd5e1">Freshness</text>

  <text x="46" y="360" font-size="11" fill="#a7f3d0" font-weight="600">~15 s under optimal conditions</text>
  <text x="46" y="376" font-size="11" fill="#5eead4">(+30–60 s via SQL analytics endpoint;</text>
  <text x="46" y="389" font-size="10.5" fill="#5eead4">read Delta via Spark to avoid that lag)</text>

  <text x="426" y="360" font-size="11" fill="#ddd6fe" font-weight="600">Scheduled or on-demand refresh</text>
  <text x="426" y="376" font-size="10.5" fill="#c4b5fd">not continuous — batch cadence set</text>
  <text x="426" y="389" font-size="10.5" fill="#c4b5fd">by pipeline trigger or manual run</text>

  <text x="806" y="360" font-size="11" fill="#fde68a" font-weight="600">On demand, scheduled, or event</text>
  <text x="806" y="376" font-size="10.5" fill="#fcd34d">triggered (e.g. file-arrival) —</text>
  <text x="806" y="389" font-size="10.5" fill="#fcd34d">not a continuous stream</text>

  <!-- Row 3: Effort / maintenance -->
  <rect x="30" y="400" width="1120" height="66" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="414" font-size="10.5" font-weight="700" fill="#cbd5e1">Build &amp; maintenance effort</text>

  <text x="46" y="432" font-size="11" fill="#a7f3d0" font-weight="600">Lowest — no ETL to build</text>
  <text x="46" y="448" font-size="10.5" fill="#5eead4">Point at source, select tables;</text>
  <text x="46" y="461" font-size="10.5" fill="#5eead4">replication compute is free</text>

  <text x="426" y="432" font-size="11" fill="#ddd6fe" font-weight="600">Moderate — visual transform authoring</text>
  <text x="426" y="448" font-size="10.5" fill="#c4b5fd">Query steps are maintained as the</text>
  <text x="426" y="461" font-size="10.5" fill="#c4b5fd">shaping logic evolves</text>

  <text x="806" y="432" font-size="11" fill="#fde68a" font-weight="600">Highest — full pipeline authoring</text>
  <text x="806" y="448" font-size="10.5" fill="#fcd34d">Activities, dependencies, triggers,</text>
  <text x="806" y="461" font-size="10.5" fill="#fcd34d">and parameterization to design</text>

  <!-- Row 4: Compute cost -->
  <rect x="30" y="472" width="1120" height="50" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="486" font-size="10.5" font-weight="700" fill="#cbd5e1">Capacity (CU) cost</text>
  <text x="46" y="504" font-size="11" fill="#a7f3d0">Replication itself is free; only</text>
  <text x="46" y="517" font-size="10.5" fill="#5eead4">downstream queries consume CUs</text>
  <text x="426" y="504" font-size="11" fill="#ddd6fe">Consumes CUs for each refresh run</text>
  <text x="806" y="504" font-size="11" fill="#fde68a">Consumes CUs for each pipeline/</text>
  <text x="806" y="517" font-size="10.5" fill="#fcd34d">copy activity run</text>

  <!-- Row 5: Watch-outs -->
  <rect x="30" y="530" width="1120" height="102" rx="6" fill="#3b0d0d" opacity="0.45" stroke="#7f1d1d" stroke-width="1"/>
  <text x="40" y="548" font-size="10.5" font-weight="700" fill="#fca5a5">Watch-outs</text>

  <text x="46" y="566" font-size="10.5" fill="#fecaca">Not a change stream or DR backup —</text>
  <text x="46" y="580" font-size="10.5" fill="#fecaca">restart forces full reseed. Source RLS/</text>
  <text x="46" y="594" font-size="10.5" fill="#fecaca">CLS/masking is not carried over. Some</text>
  <text x="46" y="608" font-size="10.5" fill="#fecaca">connectors silently drop unsupported</text>
  <text x="46" y="622" font-size="10.5" fill="#fecaca">column types (e.g. Postgres JSON/XML)</text>

  <text x="426" y="566" font-size="10.5" fill="#fecaca">Not designed for orchestrating large,</text>
  <text x="426" y="580" font-size="10.5" fill="#fecaca">multi-activity workflows — pair with a</text>
  <text x="426" y="594" font-size="10.5" fill="#fecaca">pipeline to schedule/trigger it at scale</text>

  <text x="806" y="566" font-size="10.5" fill="#fecaca">Copy activity to Warehouse/Eventhouse</text>
  <text x="806" y="580" font-size="10.5" fill="#fecaca">is unsupported when private links are</text>
  <text x="806" y="594" font-size="10.5" fill="#fecaca">enabled — verify network posture first</text>

  <!-- Row 6: Verdict box -->
  <rect x="30" y="642" width="360" height="58" rx="8" fill="#052e2a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="210" y="663" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5eead4">Choose Mirroring when the ask is</text>
  <text x="210" y="681" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5eead4">"replicate, don't transform"</text>

  <rect x="410" y="642" width="360" height="58" rx="8" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="590" y="663" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ddd6fe">Choose Dataflow Gen2 when the ask</text>
  <text x="590" y="681" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ddd6fe">is "shape data with low code"</text>

  <rect x="790" y="642" width="360" height="58" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="970" y="663" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fde68a">Choose a Pipeline when the ask is</text>
  <text x="970" y="681" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fde68a">"orchestrate movement at scale"</text>

  <!-- ══════════════════════════════════════════
       Composability note bar
  ══════════════════════════════════════════ -->
  <rect x="30" y="712" width="1120" height="66" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="590" y="734" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">These are not mutually exclusive</text>
  <text x="590" y="753" text-anchor="middle" font-size="11" fill="#94a3b8">
    A practical division of labor: use a pipeline when the problem is orchestration and large-scale movement, use Dataflow Gen2
  </text>
  <text x="590" y="769" text-anchor="middle" font-size="11" fill="#94a3b8">
    when the problem is low-code shaping, and consult the data-movement decision guide to choose Copy job, Copy activity, or Mirroring for the source itself.
  </text>

  <!-- ══════════════════════════════════════════
       Bottom: historical-record caveat, applies to all
  ══════════════════════════════════════════ -->
  <rect x="30" y="790" width="1120" height="50" rx="8" fill="#1e1b4b" opacity="0.6" stroke="#4338ca" stroke-width="1"/>
  <text x="590" y="810" text-anchor="middle" font-size="11" font-weight="700" fill="#c7d2fe">Need both a live replica AND an immutable history?</text>
  <text x="590" y="827" text-anchor="middle" font-size="10.5" fill="#a5b4fc">None of the three alone satisfies this — pair Mirroring (or a pipeline/Dataflow load) with a separate append-only ingestion pipeline for the audit trail.</text>

  <!-- ══════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════ -->
  <rect x="30" y="852" width="1120" height="34" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <rect x="46" y="862" width="14" height="14" rx="3" fill="url(#mirrorGrad)"/>
  <text x="66" y="873" font-size="10.5" fill="#cbd5e1">Mirroring — continuous replica, no-code</text>
  <rect x="356" y="862" width="14" height="14" rx="3" fill="url(#dataflowGrad)"/>
  <text x="376" y="873" font-size="10.5" fill="#cbd5e1">Dataflow Gen2 — low-code shaping</text>
  <rect x="646" y="862" width="14" height="14" rx="3" fill="url(#pipelineGrad)"/>
  <text x="666" y="873" font-size="10.5" fill="#cbd5e1">Data Factory Pipeline — orchestration/scale</text>
  <rect x="978" y="862" width="14" height="14" rx="3" fill="#3b0d0d" stroke="#7f1d1d"/>
  <text x="998" y="873" font-size="10.5" fill="#cbd5e1">Watch-out</text>
</svg>
