<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Palette: #063D3B #117865 #2AAC94 #EAF7F2 · purple #5B2C86/#8E5BC4 (mirroring) · amber #C19C00 (copy/activator)
       Grounds claims from content/designs/multi-cloud-data-architecture.json:
       S1 fabric-blog-df-multicloud-patterns (170+ connectors framing, orchestration, event triggers, shortcuts reduce latency/cost, Purview lineage)
       S2 data-factory-overview (Copy job / Copy activity / Mirroring options, 170+ connectors)
       S4 fabric-blog-activator-copy-job (Copy Job simplest/scalable, Activator event-driven execution)
       S5 mirroring-overview (Snowflake/BigQuery CDC into Delta, Direct Lake serving)
       S6 onelake-overview (one OneLake per tenant, Delta Parquet, multi-engine)
       S7 onelake-shortcuts (shortcuts to S3/GCS/Snowflake, transparent to Spark/SQL/RTI)
       S9 fabric-blog-zero-copy-security-shortcuts / S10 onelake-security (row/column security)
       S1 (Purview lineage source→AI model) -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="onelakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#117865"/>
      <stop offset="1" stop-color="#0B5E50"/>
    </linearGradient>
    <linearGradient id="laneShortcut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2AAC94"/>
      <stop offset="1" stop-color="#1A9E85"/>
    </linearGradient>
    <linearGradient id="laneMirror" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5BC4"/>
      <stop offset="1" stop-color="#5B2C86"/>
    </linearGradient>
    <linearGradient id="laneCopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A400"/>
      <stop offset="1" stop-color="#8F6A00"/>
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1A9E85"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B2C86"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8F6A00"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#117865"/>
    </marker>
  </defs>

  <rect width="1180" height="800" fill="#FFFFFF"/>

  <!-- header -->
  <rect x="0" y="0" width="1180" height="64" fill="url(#hdrGrad)"/>
  <text x="34" y="30" font-size="20" font-weight="650" fill="#FFFFFF">Multi-Cloud Data Architecture with Fabric Data Factory</text>
  <text x="34" y="50" font-size="11" fill="#D9F5EE">Fabric Atlas original diagram · capability: data-factory · topic: data-factory</text>

  <!-- ── SOURCE CLOUDS (left column) ─────────────────────────────────── -->
  <text x="24" y="94" font-size="11" letter-spacing="1.2" fill="#8A8886">SOURCE CLOUDS</text>

  <!-- GCP group -->
  <rect x="18" y="102" width="180" height="92" rx="9" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="30" y="118" font-size="10" font-weight="700" fill="#4285F4">GCP</text>
  <g transform="translate(30,124)">
    <rect width="156" height="30" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="78" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Google BigQuery</text>
  </g>
  <g transform="translate(30,160)">
    <rect width="156" height="26" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="78" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">Google Cloud Storage</text>
  </g>

  <!-- AWS group -->
  <rect x="18" y="204" width="180" height="60" rx="9" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="30" y="220" font-size="10" font-weight="700" fill="#D9A400">AWS</text>
  <g transform="translate(30,226)">
    <rect width="156" height="30" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="78" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Amazon S3</text>
  </g>

  <!-- Multi-cloud SaaS group -->
  <rect x="18" y="274" width="180" height="92" rx="9" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="30" y="290" font-size="10" font-weight="700" fill="#8E5BC4">MULTI-CLOUD</text>
  <g transform="translate(30,296)">
    <rect width="156" height="30" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="78" y="19" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Snowflake</text>
  </g>
  <g transform="translate(30,332)">
    <rect width="156" height="26" rx="6" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="78" y="17" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">Databricks</text>
  </g>

  <text x="24" y="392" font-size="9.5" fill="#8A8886" font-style="italic">170+ connectors reach cloud,</text>
  <text x="24" y="405" font-size="9.5" fill="#8A8886" font-style="italic">multicloud &amp; on-prem sources [S1][S2]</text>

  <!-- ── FABRIC DATA FACTORY BAND ─────────────────────────────────────── -->
  <rect x="214" y="86" width="716" height="14" fill="none"/>
  <rect x="214" y="80" width="720" height="410" rx="12" fill="#F7FDF9" stroke="#117865" stroke-width="1.8"/>
  <text x="234" y="104" font-size="13" font-weight="700" fill="#063D3B">Fabric Data Factory — serverless orchestration</text>
  <text x="234" y="120" font-size="9.5" fill="#3F6259">Cloud-native, auto-scaling orchestrator; single pipeline can span BigQuery → Databricks → Snowflake in one run [S1]</text>

  <!-- Lane 1: Shortcut -->
  <g transform="translate(234,134)">
    <rect width="680" height="86" rx="9" fill="url(#laneShortcut)" opacity="0.14" stroke="#1A9E85" stroke-width="1.4"/>
    <rect width="9" height="86" fill="#1A9E85"/>
    <text x="22" y="24" font-size="12" font-weight="700" fill="#0B5E50">① OneLake Shortcut</text>
    <text x="22" y="40" font-size="10" fill="#274F46">Zero-copy · query in place — no ETL, no duplication [S1][S7]</text>
    <text x="22" y="56" font-size="9.5" fill="#3F6259">Sources: Amazon S3, Google Cloud Storage, Snowflake [S1][S6][S7]</text>
    <text x="22" y="72" font-size="9.5" fill="#3F6259">Transparent to Spark, SQL, RTI, AS &amp; ADLS-compatible apps via OneLake API [S7]</text>
  </g>

  <!-- Lane 2: Mirroring -->
  <g transform="translate(234,230)">
    <rect width="680" height="86" rx="9" fill="url(#laneMirror)" opacity="0.14" stroke="#5B2C86" stroke-width="1.4"/>
    <rect width="9" height="86" fill="#5B2C86"/>
    <text x="22" y="24" font-size="12" font-weight="700" fill="#3D1E5C">② Mirroring</text>
    <text x="22" y="40" font-size="10" fill="#4A2B66">Near-real-time CDC replication → Delta in OneLake [S5]</text>
    <text x="22" y="56" font-size="9.5" fill="#5B2C86">Sources: Snowflake, Google BigQuery (preview) [S1][S5]</text>
    <text x="22" y="72" font-size="9.5" fill="#5B2C86">Fully managed, serverless — no ETL pipelines to build or maintain [S5]</text>
  </g>

  <!-- Lane 3: Copy Job / Copy activity -->
  <g transform="translate(234,326)">
    <rect width="680" height="86" rx="9" fill="url(#laneCopy)" opacity="0.16" stroke="#8F6A00" stroke-width="1.4"/>
    <rect width="9" height="86" fill="#8F6A00"/>
    <text x="22" y="24" font-size="12" font-weight="700" fill="#5C4600">③ Copy Job / Copy activity</text>
    <text x="22" y="40" font-size="10" fill="#5C4600">Batch &amp; event-driven — bulk, incremental, CDC-style delivery [S2][S4]</text>
    <text x="22" y="56" font-size="9.5" fill="#6B5200">Any source · simplest &amp; most scalable for cross-cloud/tenant moves [S4]</text>
    <text x="22" y="72" font-size="9.5" fill="#6B5200">Copy activity adds custom parallelism for migrations &amp; high-volume ingestion [S3]</text>
    <!-- Activator badge -->
    <g transform="translate(560,4)">
      <rect width="112" height="34" rx="16" fill="#8F6A00"/>
      <text x="56" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFF9E8">⚡ Activator</text>
      <text x="56" y="27" text-anchor="middle" font-size="8" fill="#FFF3D0">event trigger [S4]</text>
    </g>
  </g>

  <text x="234" y="440" font-size="9.5" fill="#616161" font-style="italic">Control flow: If-Condition · Until · ForEach iterators coordinate cross-system logic in one pipeline [S1]</text>
  <text x="234" y="456" font-size="9.5" fill="#616161" font-style="italic">Event-based triggers (e.g. new file landing) start pipelines without a fixed schedule [S1]</text>

  <!-- arrows: sources → lanes -->
  <g stroke="#9AD2C5" stroke-width="1.4" fill="none">
    <path d="M198 148 C 210 148, 220 168, 234 172" marker-end="url(#arrG)"/>
    <path d="M198 177 C 214 177, 224 172, 234 172" marker-end="url(#arrG)"/>
  </g>
  <g stroke="#C7A8E8" stroke-width="1.4" fill="none">
    <path d="M198 241 C 214 250, 224 264, 234 268" marker-end="url(#arrP)"/>
    <path d="M198 300 C 214 288, 224 276, 234 268" marker-end="url(#arrP)"/>
  </g>
  <g stroke="#E8C766" stroke-width="1.4" fill="none">
    <path d="M198 148 C 210 250, 220 340, 234 364" marker-end="url(#arrA)"/>
    <path d="M198 335 C 214 350, 224 358, 234 364" marker-end="url(#arrA)"/>
  </g>

  <!-- lanes → OneLake -->
  <line x1="914" y1="172" x2="962" y2="172" stroke="#1A9E85" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="914" y1="268" x2="962" y2="268" stroke="#5B2C86" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="914" y1="364" x2="962" y2="364" stroke="#8F6A00" stroke-width="1.6" marker-end="url(#arrA)"/>

  <!-- ── ONELAKE (center convergence node) ────────────────────────────── -->
  <g transform="translate(962,116)">
    <rect width="150" height="290" rx="12" fill="url(#onelakeGrad)"/>
    <text x="75" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">OneLake</text>
    <text x="75" y="52" text-anchor="middle" font-size="9.5" fill="#D9F5EE">one logical lake</text>
    <text x="75" y="66" text-anchor="middle" font-size="9.5" fill="#D9F5EE">per tenant [S6]</text>
    <line x1="18" y1="82" x2="132" y2="82" stroke="#2AAC94" opacity="0.5"/>
    <text x="75" y="104" text-anchor="middle" font-size="10" font-weight="600" fill="#D9F5EE">Delta Parquet</text>
    <text x="75" y="120" text-anchor="middle" font-size="9" fill="#B7E6D9">open format,</text>
    <text x="75" y="134" text-anchor="middle" font-size="9" fill="#B7E6D9">regardless of writer [S6]</text>
    <line x1="18" y1="152" x2="132" y2="152" stroke="#2AAC94" opacity="0.5"/>
    <text x="75" y="174" text-anchor="middle" font-size="9.5" fill="#B7E6D9">Shortcuts, mirrors &amp;</text>
    <text x="75" y="188" text-anchor="middle" font-size="9.5" fill="#B7E6D9">copies converge here —</text>
    <text x="75" y="202" text-anchor="middle" font-size="9.5" fill="#B7E6D9">one physical copy per</text>
    <text x="75" y="216" text-anchor="middle" font-size="9.5" fill="#B7E6D9">table, many engines [S6]</text>
    <line x1="18" y1="234" x2="132" y2="234" stroke="#2AAC94" opacity="0.5"/>
    <text x="75" y="256" text-anchor="middle" font-size="9" fill="#B7E6D9">No separate storage</text>
    <text x="75" y="270" text-anchor="middle" font-size="9" fill="#B7E6D9">to provision [S6]</text>
  </g>

  <!-- OneLake → downstream -->
  <line x1="1112" y1="180" x2="1150" y2="180" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="1112" y1="240" x2="1150" y2="240" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="1112" y1="300" x2="1150" y2="300" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="1112" y1="360" x2="1150" y2="360" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>

  <!-- but downstream column sits further right; connect via a routed vertical bus instead -->

  <!-- ── DOWNSTREAM SERVING (right column, below fold to fit width) ──── -->
  <text x="960" y="70" font-size="11" letter-spacing="1.2" fill="#8A8886" text-anchor="end">↳ see downstream serving strip below</text>

  <!-- ── FOOTER: Governance band ───────────────────────────────────────── -->
  <rect x="18" y="710" width="1144" height="58" rx="9" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="36" y="732" font-size="11.5" font-weight="700" fill="#063D3B">Governance</text>
  <text x="36" y="750" font-size="10" fill="#424242">OneLake security — row &amp; column level access control on lake data [S10]</text>
  <text x="480" y="750" font-size="10" fill="#424242">·  Microsoft Purview lineage tracked end-to-end, source → AI model [S1]</text>

  <!-- Downstream serving strip (moved to bottom-right area, above governance) -->
  <text x="18" y="530" font-size="11" letter-spacing="1.2" fill="#8A8886">DOWNSTREAM SERVING</text>
  <g transform="translate(18,540)">
    <rect width="272" height="150" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="16" y="26" font-size="11.5" font-weight="700" fill="#063D3B">Power BI (Direct Lake)</text>
    <text x="16" y="44" font-size="9.5" fill="#3F6259">Near-real-time reporting on</text>
    <text x="16" y="58" font-size="9.5" fill="#3F6259">mirrored/landed Delta data</text>
    <text x="16" y="72" font-size="9.5" fill="#3F6259">without import/duplication [S5]</text>
  </g>
  <g transform="translate(306,540)">
    <rect width="272" height="150" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="16" y="26" font-size="11.5" font-weight="700" fill="#063D3B">Cross-database T-SQL</text>
    <text x="16" y="44" font-size="9.5" fill="#3F6259">One query spans mirrored DBs,</text>
    <text x="16" y="58" font-size="9.5" fill="#3F6259">warehouses &amp; lakehouse SQL</text>
    <text x="16" y="72" font-size="9.5" fill="#3F6259">endpoints via 3-part naming [S5]</text>
  </g>
  <g transform="translate(594,540)">
    <rect width="272" height="150" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="16" y="26" font-size="11.5" font-weight="700" fill="#063D3B">Spark</text>
    <text x="16" y="44" font-size="9.5" fill="#3F6259">Notebooks &amp; jobs read/write the</text>
    <text x="16" y="58" font-size="9.5" fill="#3F6259">same OneLake Delta tables as</text>
    <text x="16" y="72" font-size="9.5" fill="#3F6259">every other engine [S6]</text>
  </g>
  <g transform="translate(882,540)">
    <rect width="280" height="150" rx="9" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.4"/>
    <text x="16" y="26" font-size="11.5" font-weight="700" fill="#063D3B">Fabric IQ / AI agents</text>
    <text x="16" y="44" font-size="9.5" fill="#3F6259">Unified multi-cloud data made</text>
    <text x="16" y="58" font-size="9.5" fill="#3F6259">available to models &amp; agents</text>
    <text x="16" y="72" font-size="9.5" fill="#3F6259">built on the same estate [S1]</text>
  </g>

  <!-- connector: OneLake node down to the serving strip -->
  <line x1="1037" y1="406" x2="1037" y2="470" stroke="#2AAC94" stroke-width="1.8"/>
  <line x1="154" y1="470" x2="1037" y2="470" stroke="#2AAC94" stroke-width="1.8"/>
  <line x1="154" y1="470" x2="154" y2="538" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="442" y1="470" x2="442" y2="538" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="730" y1="470" x2="730" y2="538" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="1022" y1="470" x2="1022" y2="538" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <text x="600" y="464" text-anchor="middle" font-size="9" fill="#5F8F82">one governed estate, many serving engines</text>

  <!-- remove the now-superseded arrows/labels pointing off to the right of OneLake box -->
  <rect x="1140" y="160" width="0" height="0" fill="none"/>

  <text x="1162" y="790" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
