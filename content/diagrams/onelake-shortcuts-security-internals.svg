<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="onelake-shortcuts-security-internals-title onelake-shortcuts-security-internals-desc" data-diagram-id="onelake-shortcuts-security-internals">
  <title id="onelake-shortcuts-security-internals-title">OneLake Shortcut Identity, Delete Semantics, and Security Internals</title>
  <desc id="onelake-shortcuts-security-internals-desc">OneLake shortcut authorization fork (internal pass-through vs external cloud connections vs delegated identities), DirectLake-over-SQL identity trap, delete link vs write-through delete semantics, OneLake security role matrix, and operating ceilings.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="secin-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="secin-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="secin-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="secin-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="secin-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>

    <!-- Official Microsoft Lakehouse Icon Gradients -->
    <linearGradient id="secin-lh-a" x1="3.25" x2="19.75" y1="4.5" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="secin-lh-b" x1="16.5" x2="28.5" y1="6" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="980" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#secin-head)"/>
  <g data-official-icon="microsoft" data-icon-name="lakehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#secin-lh-a)" d="M4 16.5L16 4l12 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 27.5z"/>
      <path fill="url(#secin-lh-b)" d="M16 11l9 9.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 27.5v-7z"/>
      <path fill="#FFFFFF" opacity="0.8" d="M12 18h8v2h-8zm0 4h8v2h-8z"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">OneLake Shortcut Identity, Delete Semantics &amp; Security Internals</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Identity Resolution Fork ➔ DirectLake Trap ➔ Delete Link vs Write-Through ➔ Role Restriction Matrix &amp; Limits</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Identity Resolution Paths</text>
    <circle cx="310" cy="15" r="5" fill="#DC2626"/><text x="322" y="19" fill="#991B1B" font-weight="600">Security Traps &amp; Write-Through Deletes</text>
    <circle cx="680" cy="15" r="5" fill="#2563EB"/><text x="692" y="19" fill="#1E3A8A" font-weight="600">OneLake Security Roles &amp; Documented Limits</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: IDENTITY RESOLUTION FORK (NODES 1, 2, 3, 4)                       -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="206" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="156" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 1: SHORTCUT READ REQUEST &amp; IDENTITY RESOLUTION FORK</text>

  <!-- Node 1: shortcut-read-request -->
  <g data-node-id="shortcut-read-request" role="group" tabindex="0" aria-label="Shortcut read request">
    <title data-node-tooltip="true">Shortcut read request — A caller (Spark, T-SQL, RTI, Analysis Services, or an ADLS-compatible client) reads through a shortcut path.</title>
    <rect x="56" y="184" width="260" height="152" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="68" y="194" width="120" height="16" rx="8" fill="#CCFBF1"/><text x="128" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">ENTRYPOINT</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#134E4A">1 · Shortcut Read Request</text>
    <text x="68" y="248" font-size="9.5" fill="#115E59">• Query issues read against shortcut path</text>
    <text x="68" y="264" font-size="9.5" fill="#115E59">• Appears as normal folder to Spark/SQL/PBI</text>
    <text x="68" y="280" font-size="9.5" fill="#115E59">• OneLake resolves target &amp; auth mode</text>
    <text x="68" y="300" font-size="8.5" font-weight="700" fill="#0F766E">Identity checked at target location</text>
    <rect x="250" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="276" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 2: internal-shortcut -->
  <g data-node-id="internal-shortcut" role="group" tabindex="0" aria-label="Internal shortcut (pass-through)">
    <title data-node-tooltip="true">Internal shortcut (pass-through) — Points at another Fabric item; authorized with the calling user's own identity.</title>
    <rect x="336" y="184" width="260" height="152" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="348" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="413" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">USER IDENTITY</text>
    <text x="348" y="228" font-size="13" font-weight="700" fill="#134E4A">2 · Internal Shortcut</text>
    <text x="348" y="248" font-size="9.5" fill="#115E59">• Target: Another Fabric item in tenant</text>
    <text x="348" y="264" font-size="9.5" fill="#115E59">• Passes calling user's own Entra ID</text>
    <text x="348" y="280" font-size="9.5" fill="#115E59">• Caller must hold Read rights at target</text>
    <text x="348" y="300" font-size="8.5" font-weight="700" fill="#0F766E">Target owner retains full control</text>
    <rect x="530" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="556" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 3: external-shortcut -->
  <g data-node-id="external-shortcut" role="group" tabindex="0" aria-label="External shortcut (ADLS/S3)">
    <title data-node-tooltip="true">External shortcut (ADLS/S3) — Points outside Fabric; authorization delegates to a cloud connection bound at creation.</title>
    <rect x="616" y="184" width="260" height="152" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="628" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="693" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">CLOUD CONNECTION</text>
    <text x="628" y="228" font-size="13" font-weight="700" fill="#134E4A">3 · External Shortcut</text>
    <text x="628" y="248" font-size="9.5" fill="#115E59">• Target: ADLS Gen2, AWS S3, Google GCS</text>
    <text x="628" y="264" font-size="9.5" fill="#115E59">• Delegates auth to bound cloud connection</text>
    <text x="628" y="280" font-size="9.5" fill="#115E59">• Binding is a privileged admin action</text>
    <text x="628" y="300" font-size="8.5" font-weight="700" fill="#0F766E">All readers share connection credential</text>
    <rect x="810" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="836" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 4: delegated-shortcut -->
  <g data-node-id="delegated-shortcut" role="group" tabindex="0" aria-label="Delegated shortcut">
    <title data-node-tooltip="true">Delegated shortcut — Routes through one configured identity chosen at creation, not the signed-in user.</title>
    <rect x="896" y="184" width="248" height="152" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="908" y="194" width="140" height="16" rx="8" fill="#CCFBF1"/><text x="978" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">DELEGATED IDENTITY</text>
    <text x="908" y="228" font-size="13" font-weight="700" fill="#134E4A">4 · Delegated Shortcut</text>
    <text x="908" y="248" font-size="9.5" fill="#115E59">• Uses configured Service Principal / Org</text>
    <text x="908" y="264" font-size="9.5" fill="#115E59">• Enables cross-tenant B2B data sharing</text>
    <text x="908" y="280" font-size="9.5" fill="#115E59">• Delegation explicitly chosen at creation</text>
    <text x="908" y="300" font-size="8.5" font-weight="700" fill="#0F766E">Access = Intersection(Delegated, User)</text>
    <rect x="1078" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1104" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: DIRECTLAKE-OVER-SQL IDENTITY TRAP (NODE 5)                        -->
  <!-- ========================================================================= -->
  <g data-node-id="identity-passthrough-trap" role="group" tabindex="0" aria-label="DirectLake-over-SQL identity trap">
    <title data-node-tooltip="true">DirectLake-over-SQL identity trap — DirectLake-over-SQL and T-SQL delegated mode silently use the item owner's identity, not the end user's.</title>
    <rect x="40" y="368" width="1120" height="132" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="56" y="378" width="180" height="18" rx="9" fill="#FEE2E2"/><text x="146" y="391" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">CRITICAL SECURITY TRAP</text>
    <text x="56" y="420" font-size="13" font-weight="700" fill="#991B1B">5 · DirectLake-over-SQL &amp; T-SQL Delegated Mode Silently Bypasses Per-User Passthrough</text>
    <text x="56" y="442" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">The Trap:</tspan> Power BI semantic models in DirectLake-over-SQL mode authorize shortcut reads as the <tspan font-weight="700">Semantic Model Owner</tspan>, not the end user viewing the report</text>
    <text x="56" y="460" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Impact:</tspan> Every report viewer inherits the owner's target-side permissions, bypassing target Row-Level Security (RLS) policies</text>
    <text x="56" y="478" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Remedy:</tspan> Use <tspan font-weight="700">DirectLake-over-OneLake</tspan> or T-SQL User Identity mode to restore genuine per-user identity passthrough</text>
    <rect x="1080" y="378" width="52" height="16" rx="8" fill="#FEE2E2"/><text x="1106" y="390" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: DELETE SEMANTICS (NODES 6 & 7)                                    -->
  <!-- ========================================================================= -->
  <rect x="40" y="516" width="1120" height="172" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="56" y="526" width="410" height="20" rx="10" fill="#F1F5F9"/>
  <text x="66" y="540" font-size="10.5" font-weight="700" fill="#334155" letter-spacing="1px">STAGE 3: DELETE OBJECT (SAFE) VS DELETE THROUGH PATH (WRITE-THROUGH)</text>

  <!-- Node 6: delete-shortcut -->
  <g data-node-id="delete-shortcut" role="group" tabindex="0" aria-label="Delete the shortcut object">
    <title data-node-tooltip="true">Delete the shortcut object — Removing the shortcut link leaves the target data untouched.</title>
    <rect x="56" y="554" width="520" height="120" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="68" y="564" width="140" height="16" rx="8" fill="#F1F5F9"/><text x="138" y="575" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">SAFE OPERATION</text>
    <text x="68" y="598" font-size="13" font-weight="700" fill="#1E293B">6 · Delete the Shortcut Object (Link Removal)</text>
    <text x="68" y="620" font-size="9.5" fill="#475569">• Right-click delete on shortcut item in Fabric UI or REST API</text>
    <text x="68" y="638" font-size="9.5" fill="#475569">• Removes only the metadata pointer in OneLake; target data remains intact</text>
    <text x="68" y="656" font-size="9.5" fill="#475569">• Zero risk to source datasets, tables, or other consumers</text>
    <rect x="510" y="564" width="52" height="14" rx="7" fill="#F1F5F9"/><text x="536" y="574" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">FACT</text>
  </g>

  <!-- Node 7: delete-through-shortcut -->
  <g data-node-id="delete-through-shortcut" role="group" tabindex="0" aria-label="Delete through the shortcut path">
    <title data-node-tooltip="true">Delete through the shortcut path — Deleting a file or folder beneath the shortcut path writes through to the target.</title>
    <rect x="606" y="554" width="538" height="120" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="618" y="564" width="160" height="16" rx="8" fill="#FEF3C7"/><text x="698" y="575" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">WRITE-THROUGH RISK</text>
    <text x="618" y="598" font-size="13" font-weight="700" fill="#78350F">7 · Delete Through Shortcut Path (Write-Through)</text>
    <text x="618" y="620" font-size="9.5" fill="#92400E">• Deleting a file/folder <tspan font-weight="700">inside</tspan> a shortcut directory writes through to source store</text>
    <text x="618" y="638" font-size="9.5" fill="#92400E">• If caller has write permissions at target, source data is permanently deleted</text>
    <text x="618" y="656" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Governance Rule:</tspan> Grant read-only permissions at target to prevent accidental data loss</text>
    <rect x="1078" y="564" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="1104" y="574" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 4: SECURITY ROLE RESTRICTION MATRIX & LIMITS (NODES 8 & 9)           -->
  <!-- ========================================================================= -->
  <rect x="40" y="704" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="714" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="728" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 4: ONELAKE ROLE RESTRICTION MATRIX &amp; OPERATING CEILINGS</text>

  <!-- Node 8: security-role-matrix -->
  <g data-node-id="security-role-matrix" role="group" tabindex="0" aria-label="OneLake security role restriction matrix">
    <title data-node-tooltip="true">OneLake security role restriction matrix — Roles restrict Viewers and Read-permission holders only — Admins, Members, and Contributors bypass OneLake security entirely.</title>
    <rect x="56" y="742" width="520" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="68" y="752" width="150" height="16" rx="8" fill="#DBEAFE"/><text x="143" y="763" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">ROLE RESTRICTION MATRIX</text>
    <text x="68" y="786" font-size="13" font-weight="700" fill="#1E3A8A">8 · Workspace Role vs OneLake Role Bypass</text>
    <text x="68" y="808" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Enforced For:</tspan> Workspace <tspan font-weight="700">Viewers</tspan> and item-level <tspan font-weight="700">Read</tspan> share holders only</text>
    <text x="68" y="826" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Bypassed By:</tspan> Workspace <tspan font-weight="700">Admin, Member, Contributor</tspan> bypass OneLake roles completely</text>
    <text x="68" y="844" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Intersection Rule:</tspan> Delegated shortcut access = Intersection(Delegated Identity, End User Scope)</text>
    <text x="68" y="864" font-size="8.5" font-weight="700" fill="#1D4ED8">Do not rely on OneLake roles to restrict Admins/Members/Contributors</text>
    <rect x="510" y="752" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="536" y="762" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">WARNING</text>
  </g>

  <!-- Node 9: operating-limits -->
  <g data-node-id="operating-limits" role="group" tabindex="0" aria-label="Documented operating limits">
    <title data-node-tooltip="true">Documented operating limits — Hard ceilings on shortcut counts, chaining, and naming bound every path through the model.</title>
    <rect x="606" y="742" width="538" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#secin-shadow)"/>
    <rect x="618" y="752" width="140" height="16" rx="8" fill="#DBEAFE"/><text x="688" y="763" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">HARD CEILINGS</text>
    <text x="618" y="786" font-size="13" font-weight="700" fill="#1E3A8A">9 · Documented Shortcut Operating Limits</text>
    <text x="618" y="808" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">100,000 shortcuts</tspan> per Fabric item ceiling</text>
    <text x="618" y="826" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Max 10 shortcuts</tspan> on any single OneLake folder path</text>
    <text x="618" y="844" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Max 5 hops</tspan> in shortcut-of-shortcut recursive chains</text>
    <text x="618" y="864" font-size="8.5" font-weight="700" fill="#1D4ED8">No spaces in table shortcut names (breaks Delta Lake table registration)</text>
    <rect x="1078" y="752" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="762" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="958" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft OneLake Shortcuts &amp; Security Documentation.</text>
</svg>
