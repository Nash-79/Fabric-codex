<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="polaris-engine-title polaris-engine-desc" data-diagram-id="polaris-engine">
  <title id="polaris-engine-title">Polaris Distributed SQL Query Engine</title>
  <desc id="polaris-engine-desc">SQL enters a front end and two-phase optimizer. DQP turns the plan into a task DAG. Finite-state orchestration and a global scheduler place work on stateless compute. Tasks operate over data cells whose durable state remains in remote storage.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="pol-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C5B"/>
      <stop offset="0.5" stop-color="#13A176"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Storage Gradient -->
    <linearGradient id="pol-store-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pol-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E7C5B" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="pol-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E7C5B"/>
    </marker>
    <marker id="pol-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>

    <!-- Official Microsoft Warehouse Item Icon Gradients -->
    <linearGradient id="pol-wh-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="pol-wh-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#0E7C5B"/><stop offset="1" stop-color="#13A176"/></linearGradient>
    <linearGradient id="pol-wh-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="pol-wh-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="940" fill="#F4FBF8"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#pol-head)"/>
  <g data-official-icon="microsoft" data-icon-name="warehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#pol-wh-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#pol-wh-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#pol-wh-c)" d="M8 8h7v7H8zM17 8h7v7h-7zM8 17h7v7H8zM17 17h7v7h-7z"/>
      <path fill="url(#pol-wh-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Polaris Distributed SQL Query Engine Architecture</text>
  <text x="40" y="64" font-size="12" fill="#E6FFFA">Compilation &amp; Optimization ➔ Task DAG &amp; FSM Orchestration ➔ Stateless Compute Pool ➔ Cell-Based OneLake Access</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="20" cy="15" r="5" fill="#0E7C5B"/><text x="32" y="19" fill="#064E3B" font-weight="600">SQL Front-End &amp; Distributed Optimizer</text>
    <circle cx="310" cy="15" r="5" fill="#2563EB"/><text x="322" y="19" fill="#1E3A8A" font-weight="600">DQP Task DAG &amp; Global Workload Scheduler</text>
    <circle cx="630" cy="15" r="5" fill="#0284C7"/><text x="642" y="19" fill="#0369A1" font-weight="600">Stateless Compute &amp; 2D Data Cells</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: COMPILATION & TWO-PHASE OPTIMIZATION (STEP-1 ➔ STEP-2)            -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="172" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.4"/>
  <rect x="56" y="156" width="410" height="20" rx="10" fill="#ECFDF5"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#065F46" letter-spacing="1px">STAGE 1: FRONT-END COMPILATION &amp; TWO-PHASE OPTIMIZATION</text>

  <!-- Node: step-1 -->
  <g data-node-id="step-1" role="group" tabindex="0" aria-label="SQL front end">
    <title data-node-tooltip="true">SQL front end — The SQL front end parses and optimizes a query before distributed execution.</title>
    <rect x="56" y="184" width="520" height="120" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="68" y="194" width="130" height="16" rx="8" fill="#DCFCE7"/><text x="133" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">ENTRYPOINT &amp; PARSE</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#14532D">1 · SQL Front-End (TDS / REST Endpoint)</text>
    <text x="68" y="250" font-size="9.5" fill="#166534">• Serves both Fabric Warehouse (read/write) &amp; SQL Analytics Endpoint (Lakehouse read-only)</text>
    <text x="68" y="268" font-size="9.5" fill="#166534">• Parses T-SQL queries, binds object names, verifies column permissions &amp; row-level security</text>
    <text x="68" y="286" font-size="9.5" fill="#166534">• Generates initial logical operator tree for distributed query planning</text>
    <rect x="510" y="194" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="536" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">FACT</text>
  </g>

  <!-- Node: step-2 -->
  <g data-node-id="step-2" role="group" tabindex="0" aria-label="Distributed optimizer">
    <title data-node-tooltip="true">Distributed optimizer — A second planning phase chooses distribution properties and minimizes data movement.</title>
    <rect x="606" y="184" width="538" height="120" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="618" y="194" width="140" height="16" rx="8" fill="#DCFCE7"/><text x="688" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">CASCADES TWO-PHASE</text>
    <text x="618" y="228" font-size="13" font-weight="700" fill="#14532D">2 · Distributed Cost-Based Optimizer</text>
    <text x="618" y="250" font-size="9.5" fill="#166534">• <tspan font-weight="700">Phase 1:</tspan> MEMO logical search space (predicate pushdown, subquery unnesting)</text>
    <text x="618" y="268" font-size="9.5" fill="#166534">• <tspan font-weight="700">Phase 2:</tspan> Evaluates data distributions and injects data-move enforcers (hash-shuffle / broadcast)</text>
    <text x="618" y="286" font-size="9.5" fill="#166534">• Fuses hash-aligned joins to eliminate data movement across network boundaries</text>
    <rect x="1078" y="194" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="1104" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: DQP TASK DAG & ORCHESTRATION (STEP-3 ➔ STEP-4 ➔ STEP-5)           -->
  <!-- ========================================================================= -->
  <rect x="40" y="334" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="344" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="358" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: DISTRIBUTED QUERY PROCESSOR (DQP) &amp; ORCHESTRATION</text>

  <!-- Node: step-3 -->
  <g data-node-id="step-3" role="group" tabindex="0" aria-label="Task DAG">
    <title data-node-tooltip="true">Task DAG — DQP divides the physical plan into tasks linked by dataflow and precedence.</title>
    <rect x="56" y="372" width="350" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="68" y="382" width="120" height="16" rx="8" fill="#DBEAFE"/><text x="128" y="393" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">TASK COMPILATION</text>
    <text x="68" y="416" font-size="13" font-weight="700" fill="#1E3A8A">3 · Task DAG Generator</text>
    <text x="68" y="440" font-size="9.5" fill="#1E40AF">• Converts plan into a directed acyclic graph (DAG)</text>
    <text x="68" y="458" font-size="9.5" fill="#1E40AF">• Each task = input cells + template + output cells</text>
    <text x="68" y="476" font-size="9.5" fill="#1E40AF">• Maximal units of work fused into T-SQL expressions</text>
    <text x="68" y="496" font-size="8.5" font-weight="700" fill="#1D4ED8">Enables intra-query parallel task execution</text>
    <rect x="340" y="382" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="366" y="392" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node: step-4 -->
  <g data-node-id="step-4" role="group" tabindex="0" aria-label="FSM orchestration">
    <title data-node-tooltip="true">FSM orchestration — Hierarchical state machines track query, template, and task progress and retry.</title>
    <rect x="426" y="372" width="350" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="438" y="382" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="503" y="393" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">STATE MACHINE</text>
    <text x="438" y="416" font-size="13" font-weight="700" fill="#1E3A8A">4 · FSM Orchestrator</text>
    <text x="438" y="440" font-size="9.5" fill="#1E40AF">• Hierarchical FSM: Query DAG ➔ Template ➔ Task</text>
    <text x="438" y="458" font-size="9.5" fill="#1E40AF">• States: <tspan font-weight="700">Ready · Run · Blocked · Failed · Success</tspan></text>
    <text x="438" y="476" font-size="9.5" fill="#1E40AF">• Transient failures retried at task granularity</text>
    <text x="438" y="496" font-size="8.5" font-weight="700" fill="#1D4ED8">All state transitions durably logged &amp; resumable</text>
    <rect x="710" y="382" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="736" y="392" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node: step-5 -->
  <g data-node-id="step-5" role="group" tabindex="0" aria-label="Global workload scheduler">
    <title data-node-tooltip="true">Global workload scheduler — A workload graph schedules tasks across concurrent queries by multidimensional resource demand.</title>
    <rect x="796" y="372" width="348" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="808" y="382" width="140" height="16" rx="8" fill="#DBEAFE"/><text x="878" y="393" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">GLOBAL SCHEDULER</text>
    <text x="808" y="416" font-size="13" font-weight="700" fill="#1E3A8A">5 · Workload Graph Scheduler</text>
    <text x="808" y="440" font-size="9.5" fill="#1E40AF">• Unions active task DAGs across all tenant queries</text>
    <text x="808" y="458" font-size="9.5" fill="#1E40AF">• Multi-dim resource vectors (CPU, RAM, temp disk)</text>
    <text x="808" y="476" font-size="9.5" fill="#1E40AF">• Schedules FIFO under load, Best-Fit when idle</text>
    <text x="808" y="496" font-size="8.5" font-weight="700" fill="#1D4ED8">Prioritizes DAG root tasks to release shared RAM</text>
    <rect x="1078" y="382" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="392" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: STATELESS COMPUTE POOL (STEP-6)                                   -->
  <!-- ========================================================================= -->
  <rect x="40" y="586" width="1120" height="146" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="56" y="596" width="410" height="20" rx="10" fill="#F1F5F9"/>
  <text x="66" y="610" font-size="10.5" font-weight="700" fill="#334155" letter-spacing="1px">STAGE 3: STATELESS SQL SERVER BACKEND COMPUTE POOL</text>

  <!-- Node: step-6 -->
  <g data-node-id="step-6" role="group" tabindex="0" aria-label="Stateless compute pool">
    <title data-node-tooltip="true">Stateless compute pool — Compute nodes run task templates while durable state remains external.</title>
    <rect x="56" y="624" width="1088" height="96" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="68" y="634" width="140" height="16" rx="8" fill="#F1F5F9"/><text x="138" y="645" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">STATELESS COMPUTE</text>
    <text x="68" y="668" font-size="13" font-weight="700" fill="#1E293B">6 · Stateless SQL Server Compute Pool &amp; Autonomous Elastic Scaling</text>
    <text x="68" y="688" font-size="9.5" fill="#475569">• Compute nodes run native SQL Server columnar engine instances with local SSD caches and buffer pools</text>
    <text x="68" y="704" font-size="9.5" fill="#475569">• All durable state (data, catalog metadata, transaction logs) is externalized; node failure causes 0 data loss</text>
    <rect x="1078" y="634" width="52" height="14" rx="7" fill="#F1F5F9"/><text x="1104" y="644" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 4: DATA CELLS & ONELAKE STORAGE (STEP-7)                             -->
  <!-- ========================================================================= -->
  <g data-node-id="step-7" role="group" tabindex="0" aria-label="Data cells and storage">
    <title data-node-tooltip="true">Data cells and storage — Two-dimensional cells connect partition pruning and hash distribution to durable data.</title>
    <rect x="40" y="748" width="1120" height="140" rx="14" fill="url(#pol-store-grad)" stroke="#0284C7" stroke-width="1.6" filter="url(#pol-shadow)"/>
    <rect x="56" y="758" width="150" height="18" rx="9" fill="#E0F2FE"/><text x="131" y="771" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369A1">2D DATA CELL GRID</text>
    <text x="56" y="800" font-size="14" font-weight="700" fill="#FFFFFF">7 · Cell-Based Data Distribution &amp; OneLake Remote Durable Storage</text>
    <text x="56" y="822" font-size="9.5" fill="#E0F2FE">• <tspan font-weight="700">Two-Dimensional Data Cells:</tspan> Partition Dimension (predicate pruning) × Hash Dimension (distribution across node buckets)</text>
    <text x="56" y="838" font-size="9.5" fill="#BAE6FD">• <tspan font-weight="700">Storage-Agnostic DQP:</tspan> DQP processes abstract cell streams; underlying engine reads and writes Delta Lake &amp; Parquet files in OneLake</text>
    <text x="56" y="854" font-size="9.5" fill="#BAE6FD">• <tspan font-weight="700">Scale Provenance:</tspan> Evaluated up to 1 PB TPC-H across 420 nodes and 5,000 concurrent sessions on 10 nodes with ~9,000 active tasks</text>
    <rect x="1080" y="758" width="52" height="16" rx="8" fill="#E0F2FE"/><text x="1106" y="770" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369A1">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="910" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft Polaris VLDB Paper &amp; Fabric Warehouse Workload Architecture.</text>
</svg>
