<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="polaris-query-execution-internals-title polaris-query-execution-internals-desc" data-diagram-id="polaris-query-execution-internals">
  <title id="polaris-query-execution-internals-title">Polaris Query Execution Internals: Compilation, Scheduling, Caching, Fault Tolerance</title>
  <desc id="polaris-query-execution-internals-desc">Polaris execution pipeline: Two-phase Cascades compilation, operator fusion vs data-move enforcers, DAG assembly, workload-graph multi-dimensional scheduling, cache-affinity topology outcomes, and hierarchical FSM task-level fault tolerance.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="polin-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C5B"/>
      <stop offset="0.5" stop-color="#13A176"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="polin-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0E7C5B" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="polin-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E7C5B"/>
    </marker>
    <marker id="polin-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="polin-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <marker id="polin-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AAD"/>
    </marker>

    <!-- Official Microsoft Warehouse Item Icon Gradients -->
    <linearGradient id="polin-wh-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="polin-wh-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#0E7C5B"/><stop offset="1" stop-color="#13A176"/></linearGradient>
    <linearGradient id="polin-wh-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="polin-wh-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="1020" fill="#F4FBF8"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#polin-head)"/>
  <g data-official-icon="microsoft" data-icon-name="warehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#polin-wh-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#polin-wh-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#polin-wh-c)" d="M8 8h7v7H8zM17 8h7v7h-7zM8 17h7v7H8zM17 17h7v7h-7z"/>
      <path fill="url(#polin-wh-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Polaris Query Execution Internals</text>
  <text x="40" y="64" font-size="12" fill="#E6FFFA">Two-Phase Compilation ➔ Task DAG Fusion vs Enforcers ➔ Workload Graph Scheduler ➔ Cache Affinity &amp; Hierarchical FSM Retries</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="20" cy="15" r="5" fill="#0E7C5B"/><text x="32" y="19" fill="#064E3B" font-weight="600">Compilation &amp; Task Boundary Decisions</text>
    <circle cx="340" cy="15" r="5" fill="#2563EB"/><text x="352" y="19" fill="#1E3A8A" font-weight="600">Global Workload Graph &amp; Resource Bins</text>
    <circle cx="680" cy="15" r="5" fill="#7C3AAD"/><text x="692" y="19" fill="#581C87" font-weight="600">Cache Affinity &amp; Hierarchical FSM Retries</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: COMPILATION & OPERATOR FUSION (COMPILE ➔ FUSE/ENFORCE ➔ DAG)      -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.4"/>
  <rect x="56" y="156" width="450" height="20" rx="10" fill="#ECFDF5"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#065F46" letter-spacing="1px">STAGE 1: TWO-PHASE COMPILATION &amp; ENFORCER-DRIVEN TASK BOUNDARIES</text>

  <!-- Node 1: task-dag-compile -->
  <g data-node-id="task-dag-compile" role="group" tabindex="0" aria-label="Two-phase Cascades compilation">
    <title data-node-tooltip="true">Two-phase Cascades compilation — SQL Server Cascades optimizer builds the logical MEMO, then a distributed cost-based phase picks physical plans and task boundaries.</title>
    <rect x="56" y="184" width="350" height="182" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#polin-shadow)"/>
    <rect x="68" y="194" width="140" height="16" rx="8" fill="#DCFCE7"/><text x="138" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">TWO-PHASE CASCADES</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#14532D">1 · Two-Phase Compilation</text>
    <text x="68" y="250" font-size="9.5" fill="#166534">• <tspan font-weight="700">Phase 1:</tspan> Cascades MEMO search space</text>
    <text x="68" y="268" font-size="9.5" fill="#166534">• <tspan font-weight="700">Phase 2:</tspan> Distributed cost-based physical plan</text>
    <text x="68" y="286" font-size="9.5" fill="#166534">• Treats distribution keys as System-R properties</text>
    <text x="68" y="306" font-size="8.5" font-weight="700" fill="#15803D">Selects plan that minimizes network data movement</text>
    <rect x="340" y="194" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="366" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">FACT</text>
  </g>

  <!-- Node 2: fuse-vs-enforcer -->
  <g data-node-id="fuse-vs-enforcer" role="group" tabindex="0" aria-label="Fuse task or insert data-move enforcer?">
    <title data-node-tooltip="true">Fuse task or insert data-move enforcer? — Per join: fuse into the current task if inputs are hash-aligned, else insert a blocking enforcer.</title>
    <rect x="426" y="184" width="350" height="182" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#polin-shadow)"/>
    <rect x="438" y="194" width="130" height="16" rx="8" fill="#DCFCE7"/><text x="503" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">PER-JOIN DECISION</text>
    <text x="438" y="228" font-size="13" font-weight="700" fill="#14532D">2 · Fuse vs Enforcer Choice</text>
    <text x="438" y="250" font-size="9.5" fill="#166534">• <tspan font-weight="700">Hash-Aligned:</tspan> Fuses joins into 1 maximal task</text>
    <text x="438" y="268" font-size="9.5" fill="#166534">• <tspan font-weight="700">Misaligned:</tspan> Inserts blocking Data-Move Enforcer</text>
    <text x="438" y="286" font-size="9.5" fill="#166534">• Hash-Shuffle or Broadcast creates task boundary</text>
    <text x="438" y="306" font-size="8.5" font-weight="700" fill="#15803D">Output cells persist before consumer tasks start</text>
    <rect x="710" y="194" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="736" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">FACT</text>
  </g>

  <!-- Node 3: task-dag -->
  <g data-node-id="task-dag" role="group" tabindex="0" aria-label="Task DAG for the query">
    <title data-node-tooltip="true">Task DAG for the query — The compiled plan becomes a DAG of task templates whose edges encode dataflow and precedence.</title>
    <rect x="796" y="184" width="348" height="182" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#polin-shadow)"/>
    <rect x="808" y="194" width="130" height="16" rx="8" fill="#DCFCE7"/><text x="873" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">TASK DAG ASSEMBLY</text>
    <text x="808" y="228" font-size="13" font-weight="700" fill="#14532D">3 · Query Task DAG</text>
    <text x="808" y="250" font-size="9.5" fill="#166534">• Plan represented as DAG of task templates</text>
    <text x="808" y="268" font-size="9.5" fill="#166534">• Edges encode strict dataflow &amp; precedence</text>
    <text x="808" y="286" font-size="9.5" fill="#166534">• Re-encoded to native T-SQL on backend nodes</text>
    <text x="808" y="306" font-size="8.5" font-weight="700" fill="#15803D">Allows parallel execution of independent tasks</text>
    <rect x="1078" y="194" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="1104" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: WORKLOAD GRAPH SCHEDULER (WORKLOAD-GRAPH-SCHEDULER)               -->
  <!-- ========================================================================= -->
  <rect x="40" y="394" width="1120" height="172" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="404" width="450" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="418" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: GLOBAL WORKLOAD GRAPH SCHEDULING &amp; ELASTIC SCALING</text>

  <!-- Node 4: workload-graph-scheduler -->
  <g data-node-id="workload-graph-scheduler" role="group" tabindex="0" aria-label="Workload-graph scheduler">
    <title data-node-tooltip="true">Workload-graph scheduler — FIFO by default, best-fit when idle capacity exists; triggers autonomous online scale-out under pressure.</title>
    <rect x="56" y="432" width="1088" height="120" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#polin-shadow)"/>
    <rect x="68" y="442" width="140" height="16" rx="8" fill="#DBEAFE"/><text x="138" y="453" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">MULTI-DIMENSIONAL BINS</text>
    <text x="68" y="476" font-size="13" font-weight="700" fill="#1E3A8A">4 · Global Workload Graph &amp; Dynamic Task Placement</text>
    <text x="68" y="498" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Resource Vectors:</tspan> Tasks specify CPU &amp; RAM (stretchable) and local temp SSD disk (rigid); nodes modeled as multi-dimensional bins</text>
    <text x="68" y="516" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Placement Policy:</tspan> Dispatches <tspan font-weight="700">FIFO</tspan> under normal load, switches to <tspan font-weight="700">Best-Fit</tspan> packing when idle capacity exists to boost throughput</text>
    <text x="68" y="534" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Autonomous Scaling:</tspan> Detects resource queue pressure and triggers online backend node acquisition (~seconds, no SLA)</text>
    <rect x="1078" y="442" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="452" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: CACHE AFFINITY OUTCOMES (CACHE-AFFINITY-OUTCOMES)                 -->
  <!-- ========================================================================= -->
  <rect x="40" y="578" width="1120" height="186" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.4"/>
  <rect x="56" y="588" width="450" height="20" rx="10" fill="#FEF3C7"/>
  <text x="66" y="602" font-size="10.5" font-weight="700" fill="#B45309" letter-spacing="1px">STAGE 3: CACHE AFFINITY OUTCOMES ACROSS TOPOLOGY EVENTS</text>

  <!-- Node 5: cache-affinity-outcomes -->
  <g data-node-id="cache-affinity-outcomes" role="group" tabindex="0" aria-label="Cache affinity under topology change">
    <title data-node-tooltip="true">Cache affinity under topology change — Scale-out preserves existing caches; scale-in loses only removed nodes' caches; node failure redistributes tasks.</title>
    <rect x="56" y="618" width="1088" height="132" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6" filter="url(#polin-shadow)"/>
    <rect x="68" y="628" width="140" height="16" rx="8" fill="#FEF3C7"/><text x="138" y="639" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">TOPOLOGY BEHAVIOR</text>
    <text x="68" y="662" font-size="13" font-weight="700" fill="#78350F">5 · Cache Affinity Outcomes Across Topology Changes</text>
    <text x="68" y="684" font-size="9.5" fill="#92400E">• <tspan font-weight="700">1. Scale-Out (Grow):</tspan> All existing nodes retain warm buffer-pool and SSD caches; only newly acquired nodes warm from cold</text>
    <text x="68" y="702" font-size="9.5" fill="#92400E">• <tspan font-weight="700">2. Scale-In (Shrink):</tspan> Only caches on decommissioned nodes are evicted; surviving nodes keep full cache affinity</text>
    <text x="68" y="720" font-size="9.5" fill="#92400E">• <tspan font-weight="700">3. Node Unhealthy:</tspan> Tasks are redistributed to healthy nodes to complete (cache-cold initial read from OneLake)</text>
    <rect x="1078" y="628" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="1104" y="638" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 4: HIERARCHICAL FSM & FAULT TOLERANCE (FAULT-TOLERANCE-STATE-MACHINE) -->
  <!-- ========================================================================= -->
  <rect x="40" y="776" width="1120" height="196" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.4"/>
  <rect x="56" y="786" width="450" height="20" rx="10" fill="#EDE9FE"/>
  <text x="66" y="800" font-size="10.5" font-weight="700" fill="#4C1D95" letter-spacing="1px">STAGE 4: HIERARCHICAL STATE MACHINE &amp; TASK-LEVEL FAULT TOLERANCE</text>

  <!-- Node 6: fault-tolerance-state-machine -->
  <g data-node-id="fault-tolerance-state-machine" role="group" tabindex="0" aria-label="Hierarchical fault-tolerance state machine">
    <title data-node-tooltip="true">Hierarchical fault-tolerance state machine — Transient failures retry at task granularity; only non-retriable failures escalate to the parent query.</title>
    <rect x="56" y="816" width="1088" height="142" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#polin-shadow)"/>
    <rect x="68" y="826" width="140" height="16" rx="8" fill="#EDE9FE"/><text x="138" y="837" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">TASK-LEVEL RETRY</text>
    <text x="68" y="860" font-size="13" font-weight="700" fill="#4C1D95">6 · Hierarchical Finite-State Machine (Query DAG ➔ Template ➔ Task)</text>
    <text x="68" y="882" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Hierarchical Scoping:</tspan> State machines manage lifecycle at Task, Task Template, and Query DAG levels</text>
    <text x="68" y="900" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Task-Level Retry:</tspan> Transient hardware/node faults trigger automatic re-execution of the single failed task on a healthy node</text>
    <text x="68" y="918" font-size="9.5" fill="#5B21B6">• <tspan font-weight="700">Escalation &amp; Logging:</tspan> Non-retriable failures escalate to parent; all state transitions logged for auditable resumable execution</text>
    <rect x="1078" y="826" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="1104" y="836" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="998" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft Polaris Distributed SQL Engine VLDB Paper &amp; Fabric Warehouse Internals.</text>
</svg>
