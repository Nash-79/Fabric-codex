<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset).
       Semantic-model storage-mode decision tree: Direct Lake vs Import vs DirectQuery / composite,
       with Direct Lake on SQL DirectQuery-fallback triggers.
       Grounded in Microsoft Learn specifications. -->
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1240" height="900" fill="#FFFFFF"/>

  <!-- TITLE -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#3B2A5A">Storage-mode decision for the semantic layer</text>
  <text x="40" y="70" font-size="13" fill="#616161">Choosing Direct Lake, Import, or DirectQuery/composite per table — and the DirectQuery-fallback triggers on Direct Lake on SQL.</text>

  <!-- ROOT -->
  <rect x="470" y="100" width="300" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="620" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">Is the table in a OneLake</text>
  <text x="620" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">Delta table (lakehouse/warehouse)?</text>

  <!-- Q1 NO branch -> non-Fabric source -->
  <line x1="470" y1="130" x2="250" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="330" y="168" font-size="11" font-weight="700" fill="#B91C1C">No — external / non-Fabric source</text>

  <rect x="60" y="205" width="340" height="150" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="80" y="230" font-size="13" font-weight="700" fill="#1D4ED8">Import or DirectQuery / Composite</text>
  <text x="80" y="252" font-size="10.5" fill="#475569">Import: copy a snapshot; refresh (scheduled or</text>
  <text x="80" y="266" font-size="10.5" fill="#475569">incremental) keeps it current. <tspan fill="#1D4ED8" font-weight="700">[S2]</tspan></text>
  <text x="80" y="286" font-size="10.5" fill="#475569">DirectQuery: forward every query to the source,</text>
  <text x="80" y="300" font-size="10.5" fill="#475569">so results always reflect live source data. <tspan fill="#1D4ED8" font-weight="700">[S2]</tspan></text>
  <text x="80" y="320" font-size="10.5" fill="#475569">A gateway is needed if the source is not reachable</text>
  <text x="80" y="334" font-size="10.5" fill="#475569">over the internet. <tspan fill="#1D4ED8" font-weight="700">[S2]</tspan></text>
  <text x="80" y="350" font-size="10" font-style="italic" fill="#7C3AED">Consider shortcutting/mirroring into OneLake to earn Direct Lake.</text>

  <!-- Q1 YES branch -> Q2 flavor -->
  <line x1="620" y1="160" x2="620" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="640" y="190" font-size="11" font-weight="700" fill="#15803D">Yes</text>

  <rect x="450" y="212" width="340" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="620" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Do you need SQL-endpoint security rules</text>
  <text x="620" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">(delegated identity / SQL RLS) or DirectQuery</text>
  <text x="620" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">fallback?</text>

  <!-- Q2 NO -> Direct Lake on OneLake -->
  <line x1="500" y1="282" x2="360" y2="345" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="380" y="315" font-size="11" font-weight="700" fill="#15803D">No</text>

  <rect x="60" y="380" width="500" height="180" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.8"/>
  <text x="80" y="406" font-size="14" font-weight="700" fill="#047857">Direct Lake on OneLake  (preferred default)</text>
  <text x="80" y="430" font-size="10.5" fill="#475569">Reads Delta straight from OneLake; import-like speed,</text>
  <text x="80" y="444" font-size="10.5" fill="#475569">DirectQuery-like freshness. <tspan fill="#047857" font-weight="700">[S16]</tspan></text>
  <text x="80" y="464" font-size="10.5" fill="#475569">OneLake security, richer modeling, faster queries. <tspan fill="#047857" font-weight="700">[S6]</tspan></text>
  <text x="80" y="484" font-size="10.5" fill="#475569">Never falls back to DirectQuery; no SQL security check,</text>
  <text x="80" y="498" font-size="10.5" fill="#475569">so DAX plans are more efficient. <tspan fill="#047857" font-weight="700">[S5]</tspan></text>
  <text x="80" y="518" font-size="10.5" fill="#475569">Very large facts stay Direct Lake; dimensions can be</text>
  <text x="80" y="532" font-size="10.5" fill="#475569">Import/DQ in a composite model. <tspan fill="#047857" font-weight="700">[S3]</tspan></text>
  <text x="80" y="552" font-size="10" font-style="italic" fill="#7C3AED">Inference: this is the low-ops default for a shared enterprise model.</text>

  <!-- Q2 YES -> Direct Lake on SQL -->
  <line x1="720" y1="282" x2="850" y2="345" stroke="#475569" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="815" y="315" font-size="11" font-weight="700" fill="#B91C1C">Yes</text>

  <rect x="680" y="380" width="500" height="180" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
  <text x="700" y="406" font-size="14" font-weight="700" fill="#C2410C">Direct Lake on SQL</text>
  <text x="700" y="430" font-size="10.5" fill="#475569">Use when SQL-endpoint security rules are needed, or</text>
  <text x="700" y="444" font-size="10.5" fill="#475569">when DirectQuery fallback is required. <tspan fill="#C2410C" font-weight="700">[S15]</tspan></text>
  <text x="700" y="464" font-size="10.5" fill="#475569">Data is still read from OneLake; the SQL endpoint is</text>
  <text x="700" y="478" font-size="10.5" fill="#475569">consulted only for schema &amp; security. <tspan fill="#C2410C" font-weight="700">[S17]</tspan></text>
  <text x="700" y="498" font-size="10.5" fill="#475569">Fallback governed by the DirectLakeBehavior property;</text>
  <text x="700" y="512" font-size="10.5" fill="#475569">no effect on Direct Lake on OneLake. <tspan fill="#C2410C" font-weight="700">[S5]</tspan></text>
  <text x="700" y="536" font-size="10.5" font-style="italic" fill="#B91C1C">Anti-pattern: basing a table on a SQL view forces every</text>
  <text x="700" y="550" font-size="10.5" font-style="italic" fill="#B91C1C">query into slower DirectQuery fallback — prefer base tables. <tspan fill="#C2410C" font-weight="700">[S3]</tspan></text>

  <!-- FALLBACK TRIGGER BAND -->
  <rect x="680" y="588" width="500" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M700,632 L712,610 L724,632 Z" fill="#DC2626"/>
  <line x1="712" y1="616" x2="712" y2="624" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="712" cy="628" r="1" fill="#FFFFFF"/>
  <text x="736" y="612" font-size="13" font-weight="700" fill="#991B1B">DirectQuery-fallback triggers (Direct Lake on SQL only) [S18]</text>
  <text x="700" y="646" font-size="11" fill="#7F1D1D">1.  Querying a SQL-endpoint view.</text>
  <text x="700" y="666" font-size="11" fill="#7F1D1D">2.  Querying a table with SQL-endpoint row-level security.</text>
  <text x="700" y="686" font-size="11" fill="#7F1D1D">3.  A Delta table breaching capacity guardrails.</text>
  <text x="700" y="712" font-size="10.5" fill="#475569">A fallen-back query hits the SQL endpoint directly: latest data,</text>
  <text x="700" y="726" font-size="10.5" fill="#475569">escaping the framing point-in-time, but typically slower. <tspan fill="#991B1B" font-weight="700">[S18]</tspan></text>

  <!-- FRAMING / GUARDRAIL BAND -->
  <rect x="60" y="588" width="580" height="150" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="80" y="612" font-size="13" font-weight="700" fill="#334155">Once in Direct Lake: framing &amp; guardrails</text>
  <circle cx="86" cy="634" r="2.6" fill="#334155"/>
  <text x="98" y="638" font-size="10.5" fill="#475569">Automatic updates reframe tables when OneLake data changes;</text>
  <text x="98" y="652" font-size="10.5" fill="#475569">disable to pin visibility during long ETL loads. <tspan fill="#334155" font-weight="700">[S5]</tspan></text>
  <circle cx="86" cy="674" r="2.6" fill="#334155"/>
  <text x="98" y="678" font-size="10.5" fill="#475569">Framing can fail if a table exceeds ~10,000 Parquet files. <tspan fill="#334155" font-weight="700">[S18]</tspan></text>
  <circle cx="86" cy="700" r="2.6" fill="#334155"/>
  <text x="98" y="704" font-size="10.5" fill="#475569">Don't OVERWRITE Delta tables (wipes commit history) or vacuum</text>
  <text x="98" y="718" font-size="10.5" fill="#475569">files of a framed version before the next reframe. <tspan fill="#334155" font-weight="700">[S19]</tspan></text>

  <!-- Sizing note -->
  <rect x="60" y="760" width="1120" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="80" y="784" font-size="12.5" font-weight="700" fill="#1D4ED8">Sizing check (applies to any mode)</text>
  <text x="80" y="806" font-size="10.5" fill="#475569">A single model is bound by the SKU memory limit; large-format lifts the 1&#8201;GB default cap to the capacity size. <tspan fill="#1D4ED8" font-weight="700">[S8]</tspan></text>
  <text x="80" y="824" font-size="10.5" fill="#475569">Refreshing an Import model near half of capacity memory risks OOM — prefer fine-grained refresh via XMLA / enhanced-refresh REST. <tspan fill="#1D4ED8" font-weight="700">[S8]</tspan></text>
  <text x="80" y="842" font-size="10" font-style="italic" fill="#7C3AED">Inference: on a shared enterprise model, mode choice is largely a memory-and-freshness decision, not just performance.</text>

  <!-- FOOTER -->
  <text x="1200" y="878" text-anchor="end" font-size="10" fill="#94A3B8">Fabric Atlas — original diagram. Grounded in Microsoft Learn specifications. Cited claims labelled [S#]; inference labelled.</text>
</svg>
