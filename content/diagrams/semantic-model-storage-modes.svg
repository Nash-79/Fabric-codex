<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Palette: #117865 #2AAC94 #25FFD4 #063D3B — from the Fabric brand.
       Grounded in semantic-model claims: storage modes (Import/DirectQuery/Direct Lake),
       large-format models, memory / eviction behaviour. -->

  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0B5E50"/>
      <stop offset="0.55" stop-color="#117865"/>
      <stop offset="1"    stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="memBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#25FFD4" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#2AAC94" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#117865" stop-opacity="0.8"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#117865"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1100" height="780" fill="#FFFFFF"/>

  <!-- header bar -->
  <rect x="0" y="0" width="1100" height="64" fill="url(#hdrGrad)"/>
  <text x="36" y="36" font-size="21" font-weight="650" fill="#FFFFFF">Semantic Model — Storage Modes, Large Models &amp; Memory</text>
  <text x="36" y="54" font-size="11" fill="#C8F5EC">Import · DirectQuery · Direct Lake · large-format ceiling · dynamic eviction · on-demand load</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 1 — Three storage mode cards  (y 84)
  ═══════════════════════════════════════════════ -->
  <text x="36" y="96" font-size="10.5" letter-spacing="1.4" fill="#8A8886">STORAGE MODES</text>

  <!-- ── Import card ── -->
  <rect x="36" y="104" width="320" height="188" rx="10" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.5"/>
  <rect x="36" y="104" width="320" height="34" rx="10" fill="#117865"/>
  <rect x="36" y="124" width="320" height="14" fill="#117865"/>
  <text x="196" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Import</text>

  <text x="56" y="160" font-size="11" font-weight="600" fill="#063D3B">Data copy</text>
  <text x="56" y="176" font-size="10.5" fill="#3F6259">Entire dataset compressed into the</text>
  <text x="56" y="191" font-size="10.5" fill="#3F6259">VertiPaq in-memory engine.</text>
  <text x="56" y="213" font-size="11" font-weight="600" fill="#063D3B">Freshness</text>
  <text x="56" y="229" font-size="10.5" fill="#3F6259">Snapshot — requires scheduled or</text>
  <text x="56" y="244" font-size="10.5" fill="#3F6259">on-demand refresh to update data.</text>
  <text x="56" y="266" font-size="10.5" fill="#3F6259">Default 1 GB ceiling; large-format</text>
  <text x="56" y="281" font-size="10.5" fill="#3F6259">raises limit to capacity size.</text>

  <!-- ── DirectQuery card ── -->
  <rect x="388" y="104" width="320" height="188" rx="10" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.5"/>
  <rect x="388" y="104" width="320" height="34" rx="10" fill="#117865"/>
  <rect x="388" y="124" width="320" height="14" fill="#117865"/>
  <text x="548" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">DirectQuery</text>

  <text x="408" y="160" font-size="11" font-weight="600" fill="#063D3B">Data location</text>
  <text x="408" y="176" font-size="10.5" fill="#3F6259">No copy in memory — queries forwarded</text>
  <text x="408" y="191" font-size="10.5" fill="#3F6259">live to the underlying source.</text>
  <text x="408" y="213" font-size="11" font-weight="600" fill="#063D3B">Freshness</text>
  <text x="408" y="229" font-size="10.5" fill="#3F6259">Always current; source query latency</text>
  <text x="408" y="244" font-size="10.5" fill="#3F6259">flows through to report response time.</text>
  <text x="408" y="266" font-size="10.5" fill="#3F6259">Gateway required when source is not</text>
  <text x="408" y="281" font-size="10.5" fill="#3F6259">internet-reachable.</text>

  <!-- ── Direct Lake card ── -->
  <rect x="740" y="104" width="324" height="188" rx="10" fill="#DFF5EE" stroke="#117865" stroke-width="2"/>
  <rect x="740" y="104" width="324" height="34" rx="10" fill="#0B5E50"/>
  <rect x="740" y="124" width="324" height="14" fill="#0B5E50"/>
  <text x="902" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#25FFD4">Direct Lake</text>

  <text x="760" y="160" font-size="11" font-weight="600" fill="#063D3B">Data location</text>
  <text x="760" y="176" font-size="10.5" fill="#3F6259">Columns loaded on demand from Delta</text>
  <text x="760" y="191" font-size="10.5" fill="#3F6259">tables in OneLake — no import copy.</text>
  <text x="760" y="213" font-size="11" font-weight="600" fill="#063D3B">Freshness</text>
  <text x="760" y="229" font-size="10.5" fill="#3F6259">Near-current; no gateway, no refresh</text>
  <text x="760" y="244" font-size="10.5" fill="#3F6259">pipeline needed for the lake data.</text>
  <text x="760" y="266" font-size="10.5" fill="#3F6259">Composite: DL fact tables + Import or</text>
  <text x="760" y="281" font-size="10.5" fill="#3F6259">DQ dimensions in one model.</text>

  <!-- mode badge labels -->
  <text x="196" y="302" text-anchor="middle" font-size="9.5" fill="#8A8886">snapshot · fast queries · refresh needed</text>
  <text x="548" y="302" text-anchor="middle" font-size="9.5" fill="#8A8886">live · no copy · source latency</text>
  <text x="902" y="302" text-anchor="middle" font-size="9.5" font-weight="600" fill="#117865">Fabric-native · OneLake Delta · no gateway</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 2 — Large-format model sizes  (y 326)
  ═══════════════════════════════════════════════ -->
  <text x="36" y="326" font-size="10.5" letter-spacing="1.4" fill="#8A8886">LARGE-FORMAT MODEL — SIZE CEILINGS</text>

  <!-- backdrop -->
  <rect x="36" y="334" width="1028" height="126" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>

  <!-- standard band -->
  <rect x="56" y="354" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#9AD2C5" stroke-width="1.2"/>
  <text x="156" y="367" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Standard (default)</text>
  <text x="156" y="381" text-anchor="middle" font-size="10" fill="#3F6259">1 GB ceiling</text>

  <!-- arrow -->
  <line x1="256" y1="372" x2="316" y2="372" stroke="#2AAC94" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="366" text-anchor="middle" font-size="9" fill="#616161">enable</text>
  <text x="286" y="379" text-anchor="middle" font-size="9" fill="#616161">large-format</text>

  <!-- large format band -->
  <rect x="316" y="348" width="240" height="48" rx="6" fill="#DFF5EE" stroke="#117865" stroke-width="1.5"/>
  <text x="436" y="364" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Large-format enabled</text>
  <text x="436" y="379" text-anchor="middle" font-size="10" fill="#3F6259">Up to full capacity memory</text>
  <text x="436" y="393" text-anchor="middle" font-size="9.5" fill="#3F6259">(F/P/A/PPU SKUs)</text>

  <!-- desktop upload cap note -->
  <rect x="596" y="354" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-width="1.2"/>
  <text x="706" y="368" text-anchor="middle" font-size="10.5" font-weight="600" fill="#424242">Desktop upload cap</text>
  <text x="706" y="382" text-anchor="middle" font-size="10" fill="#797775">10 GB even with large-format</text>

  <!-- incremental refresh -->
  <line x1="816" y1="372" x2="876" y2="372" stroke="#2AAC94" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="846" y="366" text-anchor="middle" font-size="9" fill="#616161">grow via</text>
  <text x="846" y="379" text-anchor="middle" font-size="9" fill="#616161">refresh</text>

  <rect x="876" y="354" width="172" height="36" rx="6" fill="#DFF5EE" stroke="#117865" stroke-width="1.2"/>
  <text x="962" y="368" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">In-service model</text>
  <text x="962" y="382" text-anchor="middle" font-size="10" fill="#3F6259">Grows via incremental refresh</text>

  <!-- storage backend note -->
  <text x="56" y="444" font-size="10" fill="#616161">Storage backend: ABF (standard) — Premium Files (large-format, region-dependent) — workspace cannot move regions once large-format model exists</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 3 — Memory / eviction model  (y 482)
  ═══════════════════════════════════════════════ -->
  <text x="36" y="482" font-size="10.5" letter-spacing="1.4" fill="#8A8886">CAPACITY MEMORY &amp; EVICTION</text>

  <!-- capacity box -->
  <rect x="36" y="490" width="1028" height="224" rx="10" fill="#F8FFFE" stroke="#9AD2C5" stroke-width="1.5"/>
  <text x="56" y="512" font-size="12" font-weight="650" fill="#063D3B">SKU Capacity Memory Pool</text>

  <!-- memory bar -->
  <rect x="56" y="520" width="988" height="40" rx="6" fill="#E1DFDD"/>
  <!-- active model A - large -->
  <rect x="56" y="520" width="380" height="40" rx="6" fill="url(#memBar)"/>
  <text x="246" y="545" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Model A (active, large-format)</text>
  <!-- active model B - smaller -->
  <rect x="440" y="520" width="180" height="40" rx="0" fill="#2AAC94" fill-opacity="0.45"/>
  <text x="530" y="545" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Model B</text>
  <!-- evicted zone -->
  <rect x="624" y="520" width="420" height="40" rx="0" fill="#E1DFDD"/>
  <text x="834" y="539" text-anchor="middle" font-size="10.5" fill="#797775">Evicted / not loaded — queries trigger on-demand reload</text>
  <!-- right cap -->
  <rect x="1040" y="520" width="4" height="40" rx="0" fill="#9AD2C5"/>

  <!-- eviction rules -->
  <rect x="56" y="572" width="296" height="118" rx="8" fill="#FFFFFF" stroke="#E1DFDD"/>
  <text x="72" y="592" font-size="11" font-weight="600" fill="#063D3B">Dynamic eviction</text>
  <text x="72" y="610" font-size="10" fill="#424242">Service evicts inactive models to free</text>
  <text x="72" y="624" font-size="10" fill="#424242">memory — total across all models can</text>
  <text x="72" y="638" font-size="10" fill="#424242">exceed SKU RAM. A single model is still</text>
  <text x="72" y="652" font-size="10" fill="#424242">bound by the SKU's memory ceiling.</text>
  <text x="72" y="672" font-size="10" fill="#797775">Reload after eviction adds query latency.</text>

  <rect x="370" y="572" width="296" height="118" rx="8" fill="#DFF5EE" stroke="#9AD2C5"/>
  <text x="386" y="592" font-size="11" font-weight="600" fill="#063D3B">On-demand load</text>
  <text x="386" y="610" font-size="10" fill="#424242">Enabled by default for large-format</text>
  <text x="386" y="624" font-size="10" fill="#424242">models — pages only relevant column</text>
  <text x="386" y="638" font-size="10" fill="#424242">segments into memory, not the whole</text>
  <text x="386" y="652" font-size="10" fill="#424242">model, so evicted models recover faster.</text>
  <text x="386" y="672" font-size="10" fill="#797775">Segment Temperature / Last Accessed via DMV.</text>

  <rect x="684" y="572" width="360" height="118" rx="8" fill="#FFFFFF" stroke="#E1DFDD"/>
  <text x="700" y="592" font-size="11" font-weight="600" fill="#063D3B">Refresh memory risk</text>
  <text x="700" y="610" font-size="10" fill="#424242">A model ~50% of capacity RAM risks</text>
  <text x="700" y="624" font-size="10" fill="#424242">OOM mid-refresh (e.g. 12 GB model on</text>
  <text x="700" y="638" font-size="10" fill="#424242">25 GB capacity). Mitigate with fine-</text>
  <text x="700" y="652" font-size="10" fill="#424242">grained refreshes via REST API or XMLA</text>
  <text x="700" y="666" font-size="10" fill="#424242">endpoint instead of full-model refreshes.</text>
  <text x="700" y="682" font-size="10" fill="#797775">VertiPaq DMVs expose per-column sizing via XMLA.</text>

  <!-- footer -->
  <text x="1064" y="768" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset; palette from the Fabric icon.</text>
</svg>
