<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="spark-fabric-architecture-title spark-fabric-architecture-desc" data-diagram-id="spark-fabric-architecture">
  <title id="spark-fabric-architecture-title">How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm star…</title>
  <desc id="spark-fabric-architecture-desc">An interactive decision infographic with 7 selectable elements. Every element drills into inputs, processing, outputs, a worked example, controls, and failure modes.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Angle: how a Spark session comes to exist in Fabric — capacity vCore budget, starter vs
       custom pool choice, session cold/warm/high-concurrency startup paths, entry points
       (notebook/job), and the lakehouse/OneLake IO path. Distinct from spark-engineering.svg
       (broad write-path + notebook-vs-pipeline overview) and spark-autoscale-internals.svg
       (autoscale/dynamic-allocation scaling loop under load) — this diagram does not repeat
       the autoscale decision loop or Optimized Write internals.
       Grounded in spark capability claims (capability_id=spark):
         "Fabric runs Data Engineering... starter pools... custom Spark pools..." (starter vs custom)
         "Each Fabric capacity unit grants two Spark vCores... F64 SKU... 384 Spark vCores" (capacity->vCores)
         "Starter pool sessions typically begin in 5 to 10 seconds... on-demand provisioning... 2 to 5 minutes" (cold/warm start)
         "Environment library publishing mode... Quick... Full... Full + custom live pool... ~5 seconds" (session personalization)
         "Workspaces using Tenant Private Links or Managed VNets cannot use starter pools at all" (VNet blocks starter pools)
         148b5151 (managed VNet: 3-5 min cold start, blocks regional migration)
         "Spark billing in Fabric covers only the period a notebook or job session is actively running" (billing = active only)
         "Custom pool node sizes range from Small... to XX-Large" (node sizing)
         "A Fabric Spark pool instance consists of one head node plus workers... Livy, YARN RM, ZooKeeper..." (topology)
         "Sessions expire after 20 minutes by default... unused pool deallocated 2 minutes after..." (session expiry) -->

  <defs>
    <linearGradient id="hdrA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B4A6F"/>
      <stop offset="0.5" stop-color="#146A9C"/>
      <stop offset="1" stop-color="#2E93CC"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B4A6F"/>
      <stop offset="1" stop-color="#146A9C"/>
    </linearGradient>
    <linearGradient id="starterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F6EE"/>
      <stop offset="1" stop-color="#C3EBD4"/>
    </linearGradient>
    <linearGradient id="customGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3E4"/>
      <stop offset="1" stop-color="#F9DFB0"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B4A6F"/>
      <stop offset="1" stop-color="#08344F"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#146A9C"/>
    </marker>
    <marker id="arrGreen2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E8E5A"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C97A0F"/>
    </marker>
    <marker id="arrDarkA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B4A6F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1180" height="66" fill="url(#hdrA)"/>
  <text x="30" y="30" fill="#FFFFFF" font-size="21" font-weight="700" data-node-id="step-4" tabindex="0" aria-label="starter vs custom pools"><title data-node-tooltip="true">starter vs custom pools — starter vs custom pools in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>How a Spark Session Runs in Microsoft Fabric</text>
  <text x="30" y="50" fill="#DCEEFA" font-size="12.5" data-node-id="step-1" tabindex="0" aria-label="spark boundary"><title data-node-tooltip="true">spark boundary — spark boundary in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>Capacity budget → pool choice → session startup path → entry points → lakehouse I/O over OneLake</text>

  <!-- ============ ROW 1: CAPACITY ============ -->
  <rect x="30" y="86" width="1120" height="94" rx="10" fill="url(#capGrad)"/>
  <text x="50" y="110" fill="#FFFFFF" font-size="14" font-weight="700" data-node-id="step-2" tabindex="0" aria-label="How a Spark session comes to exist in Fabric"><title data-node-tooltip="true">How a Spark session comes to exist in Fabric — How a Spark session comes to exist in Fabric in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>1. Fabric Capacity — the Spark vCore budget</text>
  <text x="50" y="130" fill="#DCEEFA" font-size="12">Each capacity unit (CU) grants 2 Spark vCores, plus a 3x burst multiplier on top</text>
  <text x="50" y="148" fill="#DCEEFA" font-size="12" data-node-id="step-5" tabindex="0" aria-label="cold/warm startup paths"><title data-node-tooltip="true">cold/warm startup paths — cold/warm startup paths in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>Example: F64 SKU = 64 CU x 2 x 3 = 384 Spark vCores — this ceiling caps how large a custom pool can be sized</text>
  <rect x="760" y="102" width="360" height="62" rx="8" fill="#08344F" stroke="#2E93CC" stroke-width="1"/>
  <text x="780" y="122" fill="#8FD1F0" font-size="11" font-weight="700">F64 EXAMPLE</text>
  <text x="780" y="142" fill="#FFFFFF" font-size="13" font-weight="700">64 CU  x  2  x  3 burst  =  384 Spark vCores</text>
  <text x="780" y="158" fill="#B9DFF2" font-size="10.5">Billing covers active session time only — idle pre-warm, acquisition, and</text>

  <!-- Connector down -->
  <line x1="590" y1="180" x2="590" y2="205" stroke="#0B4A6F" stroke-width="2.5" marker-end="url(#arrDarkA)"/>

  <!-- ============ ROW 2: POOL CHOICE ============ -->
  <text x="50" y="222" fill="#0B4A6F" font-size="14" font-weight="700">2. Pool choice — determines the startup path</text>

  <!-- Starter pool panel -->
  <rect x="30" y="232" width="540" height="230" rx="10" fill="url(#starterGrad)" stroke="#1E8E5A" stroke-width="1.5"/>
  <text x="50" y="256" fill="#0F5C39" font-size="14" font-weight="700">Starter pool (default)</text>
  <text x="50" y="274" fill="#1E6B45" font-size="11.5">Pre-provisioned, always-on Medium-node clusters</text>

  <rect x="50" y="286" width="500" height="46" rx="6" fill="#FFFFFF" stroke="#1E8E5A" stroke-width="1"/>
  <text x="66" y="304" fill="#0F5C39" font-size="12" font-weight="700">Warm session start: 5–10 seconds</text>
  <text x="66" y="320" fill="#3A7A57" font-size="10.5">Medium-node cluster already running; hand-off is near-instant</text>

  <rect x="50" y="338" width="500" height="46" rx="6" fill="#FCECEC" stroke="#B22222" stroke-width="1"/>
  <text x="66" y="356" fill="#7A1414" font-size="12" font-weight="700">Falls to on-demand: 2–5 minutes</text>
  <text x="66" y="372" fill="#8A3A3A" font-size="10.5">Trigger: any non-Medium node size, or a custom compute config</text>

  <rect x="50" y="390" width="500" height="56" rx="6" fill="#FCECEC" stroke="#B22222" stroke-width="1"/>
  <text x="66" y="408" fill="#7A1414" font-size="12" font-weight="700">Unavailable entirely on Tenant Private Link / Managed VNet</text>
  <text x="66" y="424" fill="#8A3A3A" font-size="10.5">Forces on-demand provisioning (2–5 min); Managed VNet alone widens</text>
  <text x="66" y="438" fill="#8A3A3A" font-size="10.5">this to 3–5 min and blocks workspace regional migration afterward</text>

  <!-- Custom pool panel -->
  <rect x="600" y="232" width="550" height="230" rx="10" fill="url(#customGrad)" stroke="#C97A0F" stroke-width="1.5"/>
  <text x="620" y="256" fill="#7A4A0A" font-size="14" font-weight="700">Custom pool (admin-tuned)</text>
  <text x="620" y="274" fill="#8F5A14" font-size="11.5">Sized by node size, min/max nodes, autoscale settings</text>

  <rect x="620" y="286" width="510" height="46" rx="6" fill="#FFFFFF" stroke="#C97A0F" stroke-width="1"/>
  <text x="636" y="304" fill="#7A4A0A" font-size="12" font-weight="700">Cold session start: ~3 minutes</text>
  <text x="636" y="320" fill="#8F5A14" font-size="10.5">Nodes are acquired from Azure on demand — not pre-warmed</text>

  <rect x="620" y="338" width="510" height="30" rx="6" fill="#FFFFFF" stroke="#C97A0F" stroke-width="1"/>
  <text x="636" y="358" fill="#7A4A0A" font-size="11.5" font-weight="700">Node sizes: Small (4/32GB) → Medium (8/64) → Large (16/128) → X-Large (32/256) → XX-Large (64/512)</text>

  <rect x="620" y="374" width="510" height="72" rx="6" fill="#FFFFFF" stroke="#C97A0F" stroke-width="1"/>
  <text x="636" y="392" fill="#7A4A0A" font-size="12" font-weight="700">Library personalization adds on top of cluster start</text>
  <text x="636" y="408" fill="#8F5A14" font-size="10.5">Quick mode: +30s–5min (install at session start)</text>
  <text x="636" y="422" fill="#8F5A14" font-size="10.5">Full mode: +1–3min (deploy environment snapshot)</text>
  <text x="636" y="436" fill="#1E6B45" font-size="10.5" font-weight="700">Full mode + custom live pool: ~5s (snapshot pre-baked on hydrated nodes)</text>

  <!-- Connector down -->
  <line x1="590" y1="462" x2="590" y2="486" stroke="#0B4A6F" stroke-width="2.5" marker-end="url(#arrDarkA)"/>

  <!-- ============ ROW 3: SESSION TOPOLOGY ============ -->
  <text x="50" y="504" fill="#0B4A6F" font-size="14" font-weight="700">3. Session topology once a pool is chosen</text>
  <rect x="30" y="514" width="1120" height="120" rx="10" fill="#F2F8FC" stroke="#146A9C" stroke-width="1.2"/>

  <!-- head node -->
  <rect x="50" y="530" width="230" height="88" rx="8" fill="#FFFFFF" stroke="#146A9C" stroke-width="1.5"/>
  <text x="165" y="548" fill="#0B4A6F" font-size="12.5" font-weight="700" text-anchor="middle">Head node</text>
  <text x="165" y="565" fill="#2E5E7C" font-size="10.5" text-anchor="middle">Livy · YARN Resource Manager</text>
  <text x="165" y="579" fill="#2E5E7C" font-size="10.5" text-anchor="middle">ZooKeeper · Spark driver</text>
  <text x="165" y="600" fill="#5A7C8C" font-size="9.5" text-anchor="middle">1 node dedicated — not an executor</text>

  <line x1="280" y1="574" x2="320" y2="574" stroke="#146A9C" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- worker nodes -->
  <rect x="320" y="530" width="330" height="88" rx="8" fill="#FFFFFF" stroke="#146A9C" stroke-width="1.5"/>
  <text x="485" y="548" fill="#0B4A6F" font-size="12.5" font-weight="700" text-anchor="middle">Worker nodes (1:1 with executors)</text>
  <text x="485" y="565" fill="#2E5E7C" font-size="10.5" text-anchor="middle">Each node: Node Agent + YARN Node Manager</text>
  <text x="485" y="579" fill="#2E5E7C" font-size="10.5" text-anchor="middle">+ one Spark Executor service</text>
  <text x="485" y="600" fill="#5A7C8C" font-size="9.5" text-anchor="middle">Single-node pool: driver + executor split one node 50/50</text>

  <!-- session lifecycle -->
  <rect x="670" y="530" width="460" height="88" rx="8" fill="#FFFFFF" stroke="#146A9C" stroke-width="1.5"/>
  <text x="900" y="548" fill="#0B4A6F" font-size="12.5" font-weight="700" text-anchor="middle" data-node-id="step-6" tabindex="0" aria-label="session lifecycle"><title data-node-tooltip="true">session lifecycle — session lifecycle in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>Session lifecycle</text>
  <text x="900" y="566" fill="#2E5E7C" font-size="10.5" text-anchor="middle">Idle timeout: 20 min default (configurable)</text>
  <text x="900" y="581" fill="#2E5E7C" font-size="10.5" text-anchor="middle">Pool deallocated 2 min after session expiry</text>
  <text x="900" y="602" fill="#1E6B45" font-size="10.5" font-weight="700" text-anchor="middle">Billed window = active execution only (no idle/acquisition/teardown charge)</text>

  <!-- High-concurrency note -->
  <rect x="30" y="644" width="1120" height="46" rx="8" fill="#EAF3FA" stroke="#2E93CC" stroke-width="1"/>
  <text x="50" y="664" fill="#0B4A6F" font-size="11.5" font-weight="700">High-concurrency sessions:</text>
  <text x="260" y="664" fill="#2E5E7C" font-size="11.5" data-node-id="step-7" tabindex="0" aria-label="and notebook/job entry points into lakehouse I/O"><title data-node-tooltip="true">and notebook/job entry points into lakehouse I/O — and notebook/job entry points into lakehouse I/O in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>multiple notebooks share one running Spark session/pool instead of each cold-starting its own —</text>
  <text x="50" y="680" fill="#2E5E7C" font-size="11.5" data-node-id="step-3" tabindex="0" aria-label="capacity vCore budget"><title data-node-tooltip="true">capacity vCore budget — capacity vCore budget in the How a Spark session comes to exist in Fabric — capacity vCore budget, starter vs custom pools, cold/warm startup paths, session lifecycle, and notebook/job entry points into lakehouse I/O architecture.</title>reduces the number of 5–10s (starter) or ~3min (custom) cold starts paid across a batch of concurrent notebook users.</text>

  <!-- Connector down -->
  <line x1="590" y1="690" x2="590" y2="712" stroke="#0B4A6F" stroke-width="2.5" marker-end="url(#arrDarkA)"/>

  <!-- ============ ROW 4: ENTRY POINTS + IO ============ -->
  <text x="50" y="730" fill="#0B4A6F" font-size="14" font-weight="700">4. Entry points and the OneLake I/O path</text>

  <!-- Entry points -->
  <rect x="30" y="740" width="330" height="130" rx="10" fill="#FFFFFF" stroke="#146A9C" stroke-width="1.5"/>
  <text x="195" y="762" fill="#0B4A6F" font-size="12.5" font-weight="700" text-anchor="middle">Entry points</text>
  <rect x="48" y="774" width="294" height="40" rx="6" fill="#EAF3FA"/>
  <text x="195" y="792" fill="#0B4A6F" font-size="11.5" font-weight="700" text-anchor="middle">Interactive notebook</text>
  <text x="195" y="806" fill="#2E5E7C" font-size="10" text-anchor="middle">attaches to starter or custom pool session</text>
  <rect x="48" y="820" width="294" height="40" rx="6" fill="#EAF3FA"/>
  <text x="195" y="838" fill="#0B4A6F" font-size="11.5" font-weight="700" text-anchor="middle">Spark job definition (batch)</text>
  <text x="195" y="852" fill="#2E5E7C" font-size="10" text-anchor="middle">submitted via Livy on the head node</text>

  <line x1="360" y1="805" x2="410" y2="805" stroke="#146A9C" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- Driver/executors mini -->
  <rect x="410" y="740" width="270" height="130" rx="10" fill="#FFFFFF" stroke="#146A9C" stroke-width="1.5"/>
  <text x="545" y="762" fill="#0B4A6F" font-size="12.5" font-weight="700" text-anchor="middle">Runs across driver + executors</text>
  <text x="545" y="782" fill="#2E5E7C" font-size="10.5" text-anchor="middle">(DAG scheduling, stages, tasks —</text>
  <text x="545" y="796" fill="#2E5E7C" font-size="10.5" text-anchor="middle">see spark-job-execution-internals</text>
  <text x="545" y="810" fill="#2E5E7C" font-size="10.5" text-anchor="middle">for that breakdown)</text>
  <rect x="428" y="822" width="234" height="34" rx="6" fill="#F2F8FC"/>
  <text x="545" y="843" fill="#0B4A6F" font-size="10.5" text-anchor="middle" font-weight="700">Dynamic allocation claims executors from the pool</text>

  <line x1="680" y1="805" x2="730" y2="805" stroke="#146A9C" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- OneLake -->
  <rect x="730" y="740" width="420" height="130" rx="10" fill="url(#lakeGrad)"/>
  <text x="940" y="762" fill="#FFFFFF" font-size="12.5" font-weight="700" text-anchor="middle">Lakehouse I/O over OneLake</text>
  <rect x="748" y="774" width="384" height="40" rx="6" fill="#0F5A7D"/>
  <text x="940" y="792" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Reads: Delta tables, optionally Z-ordered / Liquid-Clustered</text>
  <text x="940" y="806" fill="#B9DFF2" font-size="9.5" text-anchor="middle">layout choices here affect downstream native-engine acceleration</text>
  <rect x="748" y="820" width="384" height="40" rx="6" fill="#0F5A7D"/>
  <text x="940" y="838" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Writes: shuffle-then-write file consolidation (Optimized Write)</text>
  <text x="940" y="852" fill="#B9DFF2" font-size="9.5" text-anchor="middle">tuned by BinSize; see spark-engineering.svg for write-path detail</text>

  <!-- Legend -->
  <rect x="30" y="882" width="1120" height="1" fill="#DCE6EE"/>
  <text x="30" y="0" opacity="0"/>
  <g transform="translate(30,886)">
    <rect x="0" y="4" width="14" height="14" rx="3" fill="#C3EBD4" stroke="#1E8E5A"/>
    <text x="20" y="15" fill="#3A5A63" font-size="10.5">Starter pool path</text>
    <rect x="150" y="4" width="14" height="14" rx="3" fill="#F9DFB0" stroke="#C97A0F"/>
    <text x="170" y="15" fill="#3A5A63" font-size="10.5">Custom pool path</text>
    <rect x="300" y="4" width="14" height="14" rx="3" fill="#FCECEC" stroke="#B22222"/>
    <text x="320" y="15" fill="#3A5A63" font-size="10.5">Slower / restricted path</text>
    <rect x="480" y="4" width="14" height="14" rx="3" fill="#0B4A6F"/>
    <text x="500" y="15" fill="#3A5A63" font-size="10.5">OneLake / storage</text>
    <text x="650" y="15" fill="#7A8A94" font-size="9.5">Source: Microsoft Learn — Apache Spark compute for Fabric (tier 1)</text>
  </g>
</svg>
