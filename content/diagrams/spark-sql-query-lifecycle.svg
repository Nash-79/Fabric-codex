<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="spark-sql-query-lifecycle-title spark-sql-query-lifecycle-desc" data-diagram-id="spark-sql-query-lifecycle">
  <title id="spark-sql-query-lifecycle-title">Lifecycle of a Spark SQL Query in a Fabric Notebook</title>
  <desc id="spark-sql-query-lifecycle-desc">Complete lifecycle of a Spark SQL query in Microsoft Fabric: %%sql submission in the shared context, Catalyst parse and logical optimization, physical planning with Adaptive Query Execution, per-operator native Velox and JVM fallback routing, divergence warnings, and ACID Delta commits on OneLake.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="sql-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78350F"/>
      <stop offset="0.5" stop-color="#B45309"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <!-- Substrate Gradients -->
    <linearGradient id="sql-onelake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063D3B"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="sql-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#78350F" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="sql-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B45309"/>
    </marker>
    <marker id="sql-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="sql-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="sql-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="sql-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>

    <!-- Official Microsoft Notebook Item Icon Gradients -->
    <linearGradient id="sql-nb-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="sql-nb-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#4BA446"/><stop offset="1" stop-color="#3F7D35"/></linearGradient>
    <linearGradient id="sql-nb-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="sql-nb-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>

    <!-- Official Microsoft OneLake Icon -->
    <linearGradient id="sql-ol-a" x1="16" x2="16" y1="2" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#0078D4"/><stop offset="1" stop-color="#004C87"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="900" fill="#FFFDF8"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#sql-head)"/>
  <g data-official-icon="microsoft" data-icon-name="notebook_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#sql-nb-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#sql-nb-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#sql-nb-c)" d="M17.494 8.521a.5.5 0 0 1 .335.623l-2.7 9a.5.5 0 1 1-.957-.287l2.7-9a.5.5 0 0 1 .622-.336"/>
      <path fill="url(#sql-nb-c)" d="M18.797 10.446a.5.5 0 0 1 .707 0l2.63 2.63a.6.6 0 0 1 0 .848l-2.63 2.63a.5.5 0 0 1-.707-.708l2.346-2.346-2.346-2.347a.5.5 0 0 1 0-.707"/>
      <path fill="url(#sql-nb-c)" d="M12.496 10.446a.5.5 0 1 1 .707.707L10.857 13.5l2.346 2.346a.5.5 0 0 1-.707.707l-2.63-2.629a.6.6 0 0 1 0-.848z"/>
      <path fill="url(#sql-nb-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Lifecycle of a Spark SQL Query in a Fabric Notebook</text>
  <text x="40" y="64" font-size="12" fill="#FEF3C7">%%sql submission ➔ Catalyst logical planning ➔ Physical planning &amp; AQE ➔ Native Velox / JVM fallback ➔ Delta on OneLake</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
    <circle cx="20" cy="15" r="5" fill="#D97706"/><text x="32" y="19" fill="#92400E" font-weight="600">Query Entry &amp; Parsing</text>
    <circle cx="210" cy="15" r="5" fill="#7C3AED"/><text x="222" y="19" fill="#4C1D95" font-weight="600">Catalyst Logical &amp; AQE</text>
    <circle cx="430" cy="15" r="5" fill="#059669"/><text x="442" y="19" fill="#065F46" font-weight="600">Native Velox SIMD Route</text>
    <circle cx="660" cy="15" r="5" fill="#2563EB"/><text x="672" y="19" fill="#1E40AF" font-weight="600">JVM Tungsten Fallback</text>
    <circle cx="870" cy="15" r="5" fill="#0F766E"/><text x="882" y="19" fill="#0F766E" font-weight="600">OneLake Delta Persistence</text>
    <text x="1100" y="19" text-anchor="end" fill="#78716C">Fabric Atlas Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ZONE 1: NOTEBOOK ENTRYPOINT                                               -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="106" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.4"/>
  <rect x="56" y="156" width="370" height="20" rx="10" fill="#FEF3C7"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#92400E" letter-spacing="1px">STAGE 1: NOTEBOOK QUERY ENTRY (SHARED CONTEXT)</text>

  <!-- Node: sql-cell -->
  <g data-node-id="sql-cell" role="group" tabindex="0" aria-label="%%sql / spark.sql() cell">
    <title data-node-tooltip="true">%%sql / spark.sql() cell — A Spark SQL query entered via the %%sql magic or spark.sql() call in a Fabric notebook.</title>
    <rect x="56" y="184" width="1088" height="56" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6" filter="url(#sql-shadow)"/>
    <rect x="70" y="194" width="90" height="16" rx="8" fill="#FEF3C7"/><text x="115" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">SQL CELL</text>
    <text x="170" y="207" font-size="13" font-weight="700" fill="#78350F">%%sql Language Magic or spark.sql("...") Call</text>
    <text x="70" y="228" font-size="10" fill="#92400E">Submits query to shared notebook Spark context · Resolves table names against pinned default Lakehouse Hive Metastore · Shares cluster with PySpark &amp; Scala</text>
    <rect x="1074" y="194" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="1100" y="204" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ZONE 2: CATALYST OPTIMIZER & PHYSICAL PLANNING WITH AQE                   -->
  <!-- ========================================================================= -->
  <rect x="40" y="266" width="1120" height="164" rx="14" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.4"/>
  <rect x="56" y="276" width="370" height="20" rx="10" fill="#EDE9FE"/>
  <text x="66" y="290" font-size="10.5" font-weight="700" fill="#4C1D95" letter-spacing="1px">STAGE 2: CATALYST OPTIMIZATION &amp; AQE PHYSICAL PLANNING</text>

  <!-- Node: catalyst-plan -->
  <g data-node-id="catalyst-plan" role="group" tabindex="0" aria-label="Catalyst parse &amp; logical plan">
    <title data-node-tooltip="true">Catalyst parse &amp; logical plan — Catalyst parses the query and builds an optimized logical plan.</title>
    <rect x="56" y="304" width="510" height="112" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#sql-shadow)"/>
    <rect x="70" y="316" width="100" height="16" rx="8" fill="#EDE9FE"/><text x="120" y="327" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">LOGICAL PLAN</text>
    <text x="180" y="329" font-size="13" font-weight="700" fill="#4C1D95">Catalyst Parse, Analyze &amp; Optimize</text>
    <text x="70" y="352" font-size="10" fill="#5B21B6">• Parse: SQL text converted into unresolved Abstract Syntax Tree (AST)</text>
    <text x="70" y="370" font-size="10" fill="#5B21B6">• Analyze: References resolved against Lakehouse Hive Metastore catalog</text>
    <text x="70" y="388" font-size="10" fill="#5B21B6">• Optimize: Rule-based pushdown, column pruning, and constant folding</text>
    <rect x="500" y="316" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="526" y="326" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Node: aqe-physical-plan -->
  <g data-node-id="aqe-physical-plan" role="group" tabindex="0" aria-label="Physical planning with AQE">
    <title data-node-tooltip="true">Physical planning with AQE — The logical plan becomes a physical plan; Adaptive Query Execution can revise it mid-run.</title>
    <rect x="630" y="304" width="510" height="112" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#sql-shadow)"/>
    <rect x="644" y="316" width="100" height="16" rx="8" fill="#EDE9FE"/><text x="694" y="327" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">PHYSICAL PLAN</text>
    <text x="754" y="329" font-size="13" font-weight="700" fill="#4C1D95">Physical Planning &amp; AQE Re-optimization</text>
    <text x="644" y="352" font-size="10" fill="#5B21B6">• Generates initial physical RDD stages &amp; shuffle exchange boundaries</text>
    <text x="644" y="370" font-size="10" fill="#5B21B6">• AQE dynamically switches join strategy (e.g. SortMerge ➔ Broadcast)</text>
    <text x="644" y="388" font-size="10" fill="#5B21B6">• Coalesces shuffle partitions and mitigates data skew using runtime stats</text>
    <rect x="1074" y="316" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="1100" y="326" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Connector: catalyst-plan -> aqe-physical-plan -->
  <path d="M 566 360 H 630" stroke="#7C3AAD" stroke-width="2.2" fill="none" marker-end="url(#sql-arr-purple)"/>

  <!-- ========================================================================= -->
  <!-- ZONE 3: SPLIT ENGINE EXECUTION & DIVERGENCE WARNING                       -->
  <!-- ========================================================================= -->
  <rect x="40" y="444" width="1120" height="264" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="56" y="454" width="240" height="20" rx="10" fill="#F1F5F9"/>
  <text x="66" y="468" font-size="9.5" font-weight="700" fill="#334155" letter-spacing="0.8px">STAGE 3: PER-OPERATOR EXECUTION ROUTING</text>

  <!-- Node: native-execution -->
  <g data-node-id="native-execution" role="group" tabindex="0" aria-label="Native Execution Engine (Velox + Gluten)">
    <title data-node-tooltip="true">Native Execution Engine (Velox + Gluten) — Supported operators run as vectorized, SIMD-accelerated C++ code instead of JVM bytecode.</title>
    <rect x="56" y="482" width="510" height="136" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8" filter="url(#sql-shadow)"/>
    <rect x="70" y="494" width="110" height="16" rx="8" fill="#D1FAE5"/><text x="125" y="505" text-anchor="middle" font-size="8.5" font-weight="700" fill="#047857">NATIVE VELOX ROUTE</text>
    <text x="190" y="507" font-size="13" font-weight="700" fill="#064E3B">Native Vectorized SIMD C++ Execution</text>
    <text x="70" y="530" font-size="10" fill="#065F46">• Gluten transforms physical plan segments into Substrait representations</text>
    <text x="70" y="548" font-size="10" fill="#065F46">• Velox runs vectorized off-heap C++ kernels for HashJoin, Project, Filter, Aggregate</text>
    <text x="70" y="566" font-size="10" fill="#065F46">• Accelerates Delta Parquet scans with Z-order / Liquid Clustering layout</text>
    <text x="70" y="584" font-size="10" fill="#065F46">• Vectorized UDFs up to 5.76x faster; complex UDFs 1.08–2.5x; TPC-DS to 2.35x</text>
    <rect x="500" y="494" width="52" height="14" rx="7" fill="#D1FAE5"/><text x="526" y="504" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">FACT</text>
  </g>

  <!-- Node: jvm-fallback -->
  <g data-node-id="jvm-fallback" role="group" tabindex="0" aria-label="JVM Spark fallback">
    <title data-node-tooltip="true">JVM Spark fallback — Unsupported operators, expressions, or features execute on standard JVM Spark instead.</title>
    <rect x="630" y="482" width="510" height="136" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.8" filter="url(#sql-shadow)"/>
    <rect x="644" y="494" width="110" height="16" rx="8" fill="#DBEAFE"/><text x="699" y="505" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">JVM TUNGSTEN ROUTE</text>
    <text x="764" y="507" font-size="13" font-weight="700" fill="#1E3A8A">Standard JVM Tungsten Fallback</text>
    <text x="644" y="530" font-size="10" fill="#1E40AF">• Automatic per-operator fallback ensures 100% Spark SQL correctness</text>
    <text x="644" y="548" font-size="10" fill="#1E40AF">• Unaccelerated today: Structured Streaming, ANSI SQL mode, JSON/XML formats</text>
    <text x="644" y="566" font-size="10" fill="#1E40AF">• Spark Advisor surfaces fallback notifications directly in notebook cell outputs</text>
    <text x="644" y="584" font-size="10" fill="#1E40AF">• Adds Columnar-to-Row (C2R) transitions at native ➔ JVM engine boundaries</text>
    <rect x="1074" y="494" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1100" y="504" text-anchor="middle" font-size="8" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node: native-jvm-divergence (Warning Panel) -->
  <g data-node-id="native-jvm-divergence" role="group" tabindex="0" aria-label="Native results can diverge from JVM Spark">
    <title data-node-tooltip="true">Native results can diverge from JVM Spark — NEE is not always bit-for-bit identical to vanilla Spark for certain numeric operations.</title>
    <rect x="56" y="628" width="1084" height="66" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4" filter="url(#sql-shadow)"/>
    <rect x="70" y="638" width="60" height="16" rx="8" fill="#FEE2E2"/><text x="100" y="649" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">WARNING</text>
    <text x="140" y="651" font-size="12" font-weight="700" fill="#991B1B">Behavioral &amp; Numeric Divergence Points (Test before Production)</text>
    <text x="70" y="674" font-size="9.5" fill="#7F1D1D">• DECIMAL ➔ FLOAT casts diverge: Velox casts from internal int128_t; JVM Spark round-trips via string conversion</text>
    <text x="70" y="688" font-size="9.5" fill="#7F1D1D">• <tspan font-family="monospace">round()</tspan> uses std::round in Velox · <tspan font-family="monospace">collect_list</tspan>/<tspan font-family="monospace">collect_set</tspan> null ordering differs vs standard JVM</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ZONE 4: ONELAKE DELTA PERSISTENCE                                         -->
  <!-- ========================================================================= -->
  <!-- Node: delta-onelake-io -->
  <g data-node-id="delta-onelake-io" role="group" tabindex="0" aria-label="Delta read/write on OneLake">
    <title data-node-tooltip="true">Delta read/write on OneLake — Both native and JVM paths converge on the same Delta transaction log against OneLake.</title>
    <rect x="40" y="722" width="1120" height="124" rx="14" fill="url(#sql-onelake)" stroke="#0E7490" stroke-width="1.8" filter="url(#sql-shadow)"/>
    <g data-official-icon="microsoft" data-icon-name="one_lake_32_color">
      <g transform="translate(60,736) scale(1.1)">
        <path fill="#FFFFFF" d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm0 25.6A11.6 11.6 0 1 1 27.6 16 11.6 11.6 0 0 1 16 27.6z"/>
        <path fill="#FFFFFF" d="M16 7a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm0 16.2A7.2 7.2 0 1 1 23.2 16 7.2 7.2 0 0 1 16 23.2z"/>
      </g>
    </g>
    <text x="106" y="754" font-size="14" font-weight="700" fill="#FFFFFF">4 · Delta Lake ACID Commits on OneLake</text>
    <text x="60" y="782" font-size="10.5" fill="#CFFAFE">• Reads &amp; writes commit to unified Parquet + ACID transaction log (<tspan font-family="monospace">_delta_log/*.json</tspan>)</text>
    <text x="60" y="802" font-size="10.5" fill="#CFFAFE">• Engine convergence: Output table is identical whether computed via Native Velox or standard JVM fallback</text>
    <text x="60" y="822" font-size="10.5" fill="#CFFAFE">• Downstream multi-engine zero-copy access via Lakehouse SQL Endpoint &amp; Power BI Direct Lake</text>
    <rect x="1074" y="736" width="52" height="14" rx="7" fill="#063D3B"/><text x="1100" y="746" text-anchor="middle" font-size="8" font-weight="700" fill="#A5F3FC">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="874" text-anchor="end" font-size="9.5" fill="#78716C">Fabric Atlas — Original Diagram, August 2026. Sourced from Microsoft Learn: Apache Spark in Microsoft Fabric &amp; Native Execution Engine.</text>
</svg>
