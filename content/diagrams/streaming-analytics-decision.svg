<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720"
     font-family="Segoe UI, Arial, sans-serif" font-size="12" role="img" aria-labelledby="streaming-analytics-decision-title streaming-analytics-decision-desc" data-diagram-id="streaming-analytics-decision">
  <title id="streaming-analytics-decision-title">Hot Path, Cold Path, or Both? Routing a Streaming Workload</title>
  <desc id="streaming-analytics-decision-desc">A decision tree that starts by asking what latency the workload actually needs. Sub-second alerting or live dashboards route to the Eventhouse hot path. Daily-freshness historical reporting or cross-domain joins route to the cold path via OneLake availability, and a workload needing both routes to both simultaneously since they&apos;re the same underlying table. A warning node covers the common mistake of keeping a hot event path running for a workload that only ever needed daily freshness, incurring streaming operational cost for no latency benefit a lakehouse or warehouse pipeline couldn&apos;t have delivered more cheaply.</desc>
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f26"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="dDecision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <linearGradient id="dHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a50"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>
    <linearGradient id="dCold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="dStop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <filter id="dShadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000055"/>
    </filter>
    <marker id="dArrH" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#ff8a50"/>
    </marker>
    <marker id="dArrC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#4fc3f7"/>
    </marker>
    <marker id="dArrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#ce93d8"/>
    </marker>
    <marker id="dArrN" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#9aa7b0"/>
    </marker>
  </defs>

  <rect width="1080" height="720" fill="url(#dBg)" rx="10"/>

  <g data-node-id="cost-trap-warning" role="group" tabindex="0" aria-label="Trap: hot path for a daily-freshness workload">
    <title data-node-tooltip="true">Trap: hot path for a daily-freshness workload — Running an always-on hot path for a workload that only ever needed daily freshness wastes operational cost.</title>
    <rect x="330.0" y="-1.3" width="420" height="49" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="540" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f5f5">Streaming Analytics — Hot-Path vs Cold-Path Routing Decision</text>
  </g>
  <text x="540" y="53" text-anchor="middle" font-size="11.5" fill="#9aa7b0">Choose the serving tier per query workload — or decide streaming is the wrong tool entirely</text>

  <!-- Entry decision: do you actually need streaming? -->
  <g id="d-entry">
    <path d="M540,72 L660,120 L540,168 L420,120 Z" fill="url(#dDecision)" filter="url(#dShadow)"/>
    <text x="540" y="112" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">Is the freshness</text>
    <text x="540" y="127" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">requirement driven by</text>
    <text x="540" y="142" text-anchor="middle" font-size="9.5" fill="#f3e5f5">events / seconds?</text>
  </g>

  <!-- NO branch: don't use streaming -->
  <line x1="420" y1="120" x2="220" y2="120" stroke="#9aa7b0" stroke-width="2" marker-end="url(#dArrN)"/>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#9aa7b0" font-style="italic">no — daily / batch cadence</text>
  <g id="d-no">
    <rect x="30" y="90" width="190" height="120" rx="9" fill="url(#dStop)" filter="url(#dShadow)"/>
    <text x="125" y="112" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">Do NOT use streaming</text>
    <text x="125" y="132" text-anchor="middle" font-size="8.6" fill="#eceff1">Use a batch lakehouse /</text>
    <text x="125" y="144" text-anchor="middle" font-size="8.6" fill="#eceff1">warehouse pipeline instead</text>
    <text x="125" y="162" text-anchor="middle" font-size="8.2" fill="#cfd8dc">Eventhouse premium cache &amp;</text>
    <text x="125" y="174" text-anchor="middle" font-size="8.2" fill="#cfd8dc">always-on compute add cost</text>
    <text x="125" y="186" text-anchor="middle" font-size="8.2" fill="#b0bec5">with no real-time payoff for</text>
    <text x="125" y="198" text-anchor="middle" font-size="8.2" fill="#b0bec5">scheduled reporting</text>
  </g>

  <!-- YES branch -->
  <line x1="540" y1="168" x2="540" y2="206" stroke="#ce93d8" stroke-width="2.2" marker-end="url(#dArrP)"/>
  <text x="588" y="192" text-anchor="middle" font-size="9" fill="#ce93d8" font-style="italic">yes</text>

  <!-- Eventstream ingest node -->
  <g id="d-stream">
    <rect x="400" y="208" width="280" height="56" rx="9" fill="#33193c" filter="url(#dShadow)" stroke="#ce93d8" stroke-width="1.4"/>
    <text x="540" y="230" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e1bee7">Eventstream ingests &amp; shapes the feed</text>
    <text x="540" y="247" text-anchor="middle" font-size="8.6" fill="#ce93d8">Filter · dedupe · window · content-based routing per query need</text>
    <g data-node-id="both-paths-route" role="group" tabindex="0" aria-label="Both paths, same table">
    <title data-node-tooltip="true">Both paths, same table — A workload needing live alerting now and historical analysis later gets both with no extra ingestion.</title>
    <rect x="399.0" y="236.0" width="282" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="540" y="259" text-anchor="middle" font-size="8.4" fill="#ba68c8">Route the SAME feed to both tiers when both are needed</text>
  </g>
  </g>

  <!-- Second decision: query pattern -->
  <g id="d-qpattern">
    <path d="M540,282 L680,336 L540,390 L400,336 Z" fill="url(#dDecision)" filter="url(#dShadow)"/>
    <text x="540" y="326" text-anchor="middle" font-size="10" font-weight="700" fill="white">What does the query</text>
    <text x="540" y="341" text-anchor="middle" font-size="10" font-weight="700" fill="white">workload need?</text>
    <text x="540" y="357" text-anchor="middle" font-size="8.6" fill="#f3e5f5">latency vs history vs cross-engine</text>
  </g>
  <line x1="540" y1="264" x2="540" y2="282" stroke="#ce93d8" stroke-width="2" marker-end="url(#dArrP)"/>

  <!-- HOT branch -->
  <line x1="440" y1="360" x2="290" y2="420" stroke="#ff8a50" stroke-width="2.4" marker-end="url(#dArrH)"/>
  <g data-node-id="hot-path-route" role="group" tabindex="0" aria-label="Eventhouse hot path">
    <title data-node-tooltip="true">Eventhouse hot path — Sub-second, event-driven: live dashboards, anomaly detection, alerting conditions.</title>
    <rect x="250.5" y="375.0" width="159" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="330" y="398" text-anchor="middle" font-size="9" fill="#ffab91" font-style="italic">sub-second, live, alerting</text>
  </g>
  <g id="d-hot">
    <rect x="60" y="418" width="420" height="256" rx="10" fill="none" stroke="#ff8a50" stroke-width="1.8" stroke-dasharray="7,4"/>
    <rect x="60" y="418" width="420" height="32" rx="10" fill="url(#dHot)"/>
    <rect x="60" y="438" width="420" height="12" fill="url(#dHot)"/>
    <text x="270" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">HOT PATH — Eventhouse / KQL</text>

    <rect x="76" y="462" width="388" height="42" rx="7" fill="#4a2a1a"/>
    <text x="270" y="480" text-anchor="middle" font-size="9.4" font-weight="700" fill="#ffe0b2">When</text>
    <text x="270" y="495" text-anchor="middle" font-size="8.6" fill="#ffcc80">Operational monitoring · anomaly detection · seconds-fresh KPIs</text>

    <rect x="76" y="512" width="388" height="72" rx="7" fill="#3d2418"/>
    <text x="270" y="531" text-anchor="middle" font-size="9.4" font-weight="700" fill="#ffe0b2">How it serves</text>
    <text x="270" y="547" text-anchor="middle" font-size="8.6" fill="#ffcc80">Premium cache tier &#8226; native KQL &#8226; materialized views</text>
    <text x="270" y="560" text-anchor="middle" font-size="8.6" fill="#ffcc80">Real-Time Dashboards &#8226; Activator alerts &#8226; native anomaly detection</text>
    <text x="270" y="574" text-anchor="middle" font-size="8.4" fill="#ffab91">Sub-second reads over hot rows</text>

    <rect x="76" y="592" width="388" height="72" rx="7" fill="#3d2418"/>
    <text x="270" y="611" text-anchor="middle" font-size="9.4" font-weight="700" fill="#ffe0b2">Watch-outs</text>
    <text x="270" y="627" text-anchor="middle" font-size="8.6" fill="#ffab91">Cold-start warm-up 5&#8211;10 s after idle periods</text>
    <text x="270" y="640" text-anchor="middle" font-size="8.6" fill="#ffab91">Under capacity pressure: throttling ladder (queries &#8594; ingest paused)</text>
    <text x="270" y="654" text-anchor="middle" font-size="8.4" fill="#ff8a65">Shorter caching window trims premium spend, keeps total history</text>
  </g>

  <!-- COLD branch -->
  <line x1="640" y1="360" x2="790" y2="420" stroke="#4fc3f7" stroke-width="2.4" marker-end="url(#dArrC)"/>
  <text x="760" y="398" text-anchor="middle" font-size="9" fill="#81d4fa" font-style="italic">history, batch BI, cross-engine</text>
  <g id="d-cold">
    <rect x="600" y="418" width="420" height="256" rx="10" fill="none" stroke="#4fc3f7" stroke-width="1.8" stroke-dasharray="7,4"/>
    <rect x="600" y="418" width="420" height="32" rx="10" fill="url(#dCold)"/>
    <rect x="600" y="438" width="420" height="12" fill="url(#dCold)"/>
    <g data-node-id="cold-path-route" role="group" tabindex="0" aria-label="OneLake availability (cold path)">
    <title data-node-tooltip="true">OneLake availability (cold path) — Hours-scale freshness: historical trends, cross-domain joins, daily/weekly reporting.</title>
    <rect x="687.5" y="416.2" width="245" height="33" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="810" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="white">COLD PATH — OneLake / Lakehouse</text>
  </g>

    <rect x="616" y="462" width="388" height="42" rx="7" fill="#0d2b38"/>
    <text x="810" y="480" text-anchor="middle" font-size="9.4" font-weight="700" fill="#b3e5fc">When</text>
    <text x="810" y="495" text-anchor="middle" font-size="8.6" fill="#81d4fa">Long retention · large scans · joins with lakehouse/warehouse data</text>

    <rect x="616" y="512" width="388" height="72" rx="7" fill="#0d3b4d"/>
    <text x="810" y="531" text-anchor="middle" font-size="9.4" font-weight="700" fill="#b3e5fc">How it serves</text>
    <text x="810" y="547" text-anchor="middle" font-size="8.6" fill="#81d4fa">OneLake availability &#8594; Delta, no copy, no extra storage charge</text>
    <text x="810" y="560" text-anchor="middle" font-size="8.6" fill="#81d4fa">Power BI Direct Lake &#8226; Warehouse &#8226; Lakehouse &#8226; Spark</text>
    <text x="810" y="574" text-anchor="middle" font-size="8.4" fill="#4fc3f7">Standard tier — higher read latency than the cache</text>

    <rect x="616" y="592" width="388" height="72" rx="7" fill="#0d2b38"/>
    <text x="810" y="611" text-anchor="middle" font-size="9.4" font-weight="700" fill="#b3e5fc">Watch-outs</text>
    <text x="810" y="627" text-anchor="middle" font-size="8.6" fill="#81d4fa">Adaptive batching delay: up to 3 h default (min 5 min)</text>
    <text x="810" y="640" text-anchor="middle" font-size="8.6" fill="#4fc3f7">Very small delays risk many small files that slow reads</text>
    <text x="810" y="654" text-anchor="middle" font-size="8.4" fill="#ef9a9a">DDL (rename/type/RLS/purge) blocked while availability is on</text>
  </g>

  <!-- Bridge note -->
  <rect x="360" y="686" width="360" height="24" rx="6" fill="#20161a" stroke="#ce93d8" stroke-width="1"/>
  <g data-node-id="start-question" role="group" tabindex="0" aria-label="What latency does this workload actually need?">
    <title data-node-tooltip="true">What latency does this workload actually need? — Root question: sub-second operational need, hours-scale historical need, or both.</title>
    <rect x="338.5" y="679.0" width="403" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="540" y="702" text-anchor="middle" font-size="8.8" fill="#e1bee7">Both paths share one physical record — hot for now, cold for history &amp; scale</text>
  </g>

  <text x="1050" y="702" text-anchor="end" font-size="9" fill="#78909c">Original diagram — Fabric Atlas.</text>
</svg>
