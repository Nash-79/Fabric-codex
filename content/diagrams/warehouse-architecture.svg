<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Grounded in warehouse capability claims: caching tiers, T-SQL surface, workload management,
       compute/storage separation, MPP architecture, Delta/OneLake storage layer. -->

  <defs>
    <linearGradient id="onelakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0B5E50"/>
      <stop offset="0.55" stop-color="#117865"/>
      <stop offset="1"    stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="computeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF7F2"/>
      <stop offset="1" stop-color="#D0EFE6"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25FFD4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2AAC94" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ssdGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AAC94" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#117865" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#063D3B"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="820" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="650" fill="#063D3B">Fabric Data Warehouse — architecture overview</text>
  <text x="40" y="66" font-size="12" fill="#616161">T-SQL surface · two-tier transparent cache (memory + SSD) · MPP compute · OneLake Delta storage · autonomous workload management</text>

  <!-- ═══════════════════════════════════════════════════════════
       ROW 1 — CLIENT / ENTRY POINTS
  ═══════════════════════════════════════════════════════════ -->
  <text x="40" y="98" font-size="11" letter-spacing="1.5" fill="#8A8886">CLIENTS</text>

  <!-- T-SQL client box -->
  <g transform="translate(40,108)">
    <rect width="160" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">T-SQL Client</text>
    <text x="80" y="41" text-anchor="middle" font-size="10" fill="#3F6259">TDS / SSMS / ODBC</text>
    <text x="80" y="53" text-anchor="middle" font-size="10" fill="#3F6259">fabric.azure.com</text>
  </g>

  <!-- Spark / external clients -->
  <g transform="translate(220,108)">
    <rect width="160" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Spark / External</text>
    <text x="80" y="41" text-anchor="middle" font-size="10" fill="#3F6259">reads Delta files directly</text>
    <text x="80" y="53" text-anchor="middle" font-size="10" fill="#3F6259">from OneLake</text>
  </g>

  <!-- Power BI / semantic model -->
  <g transform="translate(400,108)">
    <rect width="160" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Power BI</text>
    <text x="80" y="41" text-anchor="middle" font-size="10" fill="#3F6259">SQL analytics endpoint</text>
    <text x="80" y="53" text-anchor="middle" font-size="10" fill="#3F6259">semantic model</text>
  </g>

  <!-- Ingestion paths -->
  <g transform="translate(600,108)">
    <rect width="200" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Ingestion</text>
    <text x="100" y="41" text-anchor="middle" font-size="10" fill="#3F6259">COPY INTO · Data Factory</text>
    <text x="100" y="53" text-anchor="middle" font-size="10" fill="#3F6259">Dataflows · Spark writes</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       ROW 2 — SQL FRONTEND (T-SQL surface)
  ═══════════════════════════════════════════════════════════ -->
  <!-- down arrows from clients to frontend -->
  <line x1="120"  y1="166" x2="120"  y2="215" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300"  y1="166" x2="300"  y2="215" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="480"  y1="166" x2="480"  y2="215" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="700"  y1="166" x2="700"  y2="215" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- SQL frontend band -->
  <rect x="40" y="222" width="860" height="72" rx="10" fill="#DFF5EE" stroke="#117865" stroke-width="1.5"/>
  <text x="60" y="248" font-size="13" font-weight="600" fill="#063D3B">SQL Frontend — T-SQL surface</text>
  <text x="60" y="265" font-size="10.5" fill="#3F6259">Full SQL Database Engine surface: multi-table ACID transactions · materialized views · stored procedures · functions</text>
  <text x="60" y="281" font-size="10.5" fill="#3F6259">Cross-database queries in workspace · CREATE STATISTICS · query insights DMVs · up to 2 048 user sessions per workspace</text>

  <!-- result-set cache label -->
  <rect x="760" y="232" width="126" height="46" rx="6" fill="#FFFFFF" stroke="#2AAC94" stroke-dasharray="4 3"/>
  <text x="823" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">Result-set cache</text>
  <text x="823" y="264" text-anchor="middle" font-size="9.5" fill="#3F6259">separate from data cache</text>
  <text x="823" y="276" text-anchor="middle" font-size="9.5" fill="#3F6259">caches complete results</text>

  <!-- ═══════════════════════════════════════════════════════════
       ROW 3 — DQP + WORKLOAD MANAGEMENT
  ═══════════════════════════════════════════════════════════ -->
  <line x1="470" y1="294" x2="470" y2="332" stroke="#117865" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DQP box -->
  <rect x="40" y="340" width="530" height="72" rx="10" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="60" y="365" font-size="13" font-weight="600" fill="#063D3B">Distributed Query Processor (DQP / Polaris)</text>
  <text x="60" y="382" font-size="10.5" fill="#3F6259">Cascades optimizer → distributed plan → task DAG · data-move enforcers (hash-redistribute / broadcast)</text>
  <text x="60" y="397" font-size="10.5" fill="#3F6259">MPP scale-out · OPTION(FORCE DISTRIBUTED PLAN) hint · non-scalable ops log warning</text>

  <!-- Workload management box — to the right -->
  <rect x="590" y="340" width="310" height="72" rx="10" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="610" y="362" font-size="12" font-weight="600" fill="#063D3B">Workload Management</text>
  <text x="610" y="378" font-size="10.5" fill="#3F6259">Default 50 / 50 split: SELECT pool vs non-SELECT pool</text>
  <text x="610" y="394" font-size="10.5" fill="#3F6259">Custom SQL pools available · no user-facing tuning knobs</text>
  <text x="610" y="409" font-size="10.5" fill="#3F6259">Ingestion cannot starve reads · independent scaling per pool</text>

  <!-- connector DQP to Workload -->
  <line x1="570" y1="376" x2="590" y2="376" stroke="#2AAC94" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- ═══════════════════════════════════════════════════════════
       ROW 4 — COMPUTE NODES with cache tiers
  ═══════════════════════════════════════════════════════════ -->
  <line x1="305" y1="412" x2="305" y2="456" stroke="#117865" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="470" font-size="11" letter-spacing="1.5" fill="#8A8886">STATELESS COMPUTE NODES (autoscale — nodes added online, faults redistributed)</text>

  <!-- compute node 1 -->
  <g transform="translate(40,482)">
    <rect width="260" height="158" rx="10" fill="url(#computeGrad)" stroke="#9AD2C5"/>
    <text x="130" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Compute Node A</text>
    <text x="130" y="38" text-anchor="middle" font-size="10" fill="#3F6259">SQL Server local engine · columnar execution</text>
    <!-- mem cache -->
    <rect x="12" y="46" width="236" height="46" rx="6" fill="url(#memGrad)" stroke="#25FFD4" stroke-width="1.5"/>
    <text x="25" y="65" font-size="11" font-weight="600" fill="#063D3B">In-memory cache (Tier 1)</text>
    <text x="25" y="81" font-size="9.5" fill="#3F6259">columnar compressed · parallel multi-core scan</text>
    <!-- ssd cache -->
    <rect x="12" y="100" width="236" height="46" rx="6" fill="url(#ssdGrad)" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="25" y="119" font-size="11" font-weight="600" fill="#063D3B">SSD cache (Tier 2)</text>
    <text x="25" y="135" font-size="9.5" fill="#3F6259">overflow from mem · LRU eviction · faster than OneLake</text>
    <!-- cell affinity note -->
    <text x="130" y="153" text-anchor="middle" font-size="9" fill="#797775">data-cell affinity preserves warm caches on topology change</text>
  </g>

  <!-- compute node 2 -->
  <g transform="translate(320,482)">
    <rect width="260" height="158" rx="10" fill="url(#computeGrad)" stroke="#9AD2C5"/>
    <text x="130" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Compute Node B</text>
    <text x="130" y="38" text-anchor="middle" font-size="10" fill="#3F6259">SQL Server local engine · columnar execution</text>
    <rect x="12" y="46" width="236" height="46" rx="6" fill="url(#memGrad)" stroke="#25FFD4" stroke-width="1.5"/>
    <text x="25" y="65" font-size="11" font-weight="600" fill="#063D3B">In-memory cache (Tier 1)</text>
    <text x="25" y="81" font-size="9.5" fill="#3F6259">transcoded on first access · no user config</text>
    <rect x="12" y="100" width="236" height="46" rx="6" fill="url(#ssdGrad)" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="25" y="119" font-size="11" font-weight="600" fill="#063D3B">SSD cache (Tier 2)</text>
    <text x="25" y="135" font-size="9.5" fill="#3F6259">DML changes stay consistent · always-on, transparent</text>
    <text x="130" y="153" text-anchor="middle" font-size="9" fill="#797775">data-cell affinity preserves warm caches on topology change</text>
  </g>

  <!-- compute node 3 (ellipsis) -->
  <g transform="translate(600,482)">
    <rect width="140" height="158" rx="10" fill="#F3F2F1" stroke="#C8C6C4" stroke-dasharray="5 3"/>
    <text x="70" y="75" text-anchor="middle" font-size="22" fill="#8A8886">· · ·</text>
    <text x="70" y="100" text-anchor="middle" font-size="10" fill="#797775">N more nodes</text>
    <text x="70" y="116" text-anchor="middle" font-size="9.5" fill="#797775">added on pressure</text>
    <text x="70" y="132" text-anchor="middle" font-size="9.5" fill="#797775">online, ~seconds</text>
  </g>

  <!-- cache legend -->
  <g transform="translate(760,482)">
    <rect width="140" height="158" rx="10" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="70" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Cache legend</text>
    <rect x="12" y="34" width="14" height="10" rx="2" fill="#25FFD4" fill-opacity="0.6" stroke="#25FFD4" stroke-width="1.2"/>
    <text x="32" y="43" font-size="9.5" fill="#063D3B">In-memory (Tier 1)</text>
    <text x="12" y="58" font-size="9" fill="#616161">columnar, compressed,</text>
    <text x="12" y="70" font-size="9" fill="#616161">multi-core parallel</text>
    <rect x="12" y="80" width="14" height="10" rx="2" fill="#2AAC94" fill-opacity="0.5" stroke="#2AAC94" stroke-width="1.2"/>
    <text x="32" y="89" font-size="9.5" fill="#063D3B">SSD (Tier 2)</text>
    <text x="12" y="103" font-size="9" fill="#616161">LRU eviction, survives</text>
    <text x="12" y="115" font-size="9" fill="#616161">mem eviction, faster</text>
    <text x="12" y="127" font-size="9" fill="#616161">rehydration than OneLake</text>
    <text x="12" y="144" font-size="9" fill="#797775">Both tiers: always-on,</text>
    <text x="12" y="155" font-size="9" fill="#797775">transparent, no user config</text>
  </g>

  <!-- fetch arrows: compute nodes to OneLake (on cache miss) -->
  <line x1="170" y1="640" x2="170" y2="698" stroke="#2AAC94" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="450" y1="640" x2="450" y2="698" stroke="#2AAC94" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="240" y="678" font-size="9.5" fill="#616161">remote fetch on cache miss</text>

  <!-- ═══════════════════════════════════════════════════════════
       ROW 5 — STORAGE (OneLake / Delta)
  ═══════════════════════════════════════════════════════════ -->
  <rect x="40" y="706" width="860" height="76" rx="10" fill="url(#onelakeGrad)"/>
  <text x="60" y="733" font-size="17" font-weight="650" fill="#FFFFFF">OneLake — Delta / Parquet storage</text>
  <text x="60" y="753" font-size="10.5" fill="#D9F5EE">Warehouse tables stored as Delta (Parquet + transaction log) · V-Order write-time sort/compress · data clustering (space-filling curve) for file-skip</text>
  <text x="60" y="769" font-size="10.5" fill="#D9F5EE">Auto-published to OneLake · background compaction (small files → row groups) · checkpoint summarizes log · fast rollback via file versioning</text>

  <!-- shortcuts pointing at OneLake from outside -->
  <g transform="translate(930,706)">
    <rect width="226" height="76" rx="10" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
    <text x="113" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">OneLake Shortcuts</text>
    <text x="113" y="42" text-anchor="middle" font-size="10" fill="#424242">ADLS · S3 · GCS · Dataverse</text>
    <text x="113" y="57" text-anchor="middle" font-size="10" fill="#424242">also cached by the engine</text>
    <text x="113" y="70" text-anchor="middle" font-size="9.5" fill="#797775">no copy — virtualized in place</text>
  </g>
  <line x1="930" y1="744" x2="900" y2="744" stroke="#8A8886" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>

  <!-- cross-database label -->
  <g transform="translate(930,340)">
    <rect width="226" height="72" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
    <text x="18" y="22" font-size="12" font-weight="600" fill="#063D3B">Cross-database queries</text>
    <text x="18" y="39" font-size="10" fill="#424242">Single T-SQL statement spans</text>
    <text x="18" y="53" font-size="10" fill="#424242">multiple Fabric data items in</text>
    <text x="18" y="66" font-size="10" fill="#424242">the workspace — zero copies</text>
  </g>
  <line x1="930" y1="376" x2="900" y2="376" stroke="#8A8886" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrGray)"/>

  <!-- footer -->
  <text x="1162" y="810" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset; palette from the official Fabric icon.</text>
</svg>
