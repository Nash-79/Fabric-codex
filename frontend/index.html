<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric Atlas — Microsoft Fabric knowledge base</title>
    <style>
      html {
        background: #faf9f8;
      }
      html[data-theme="dark"] {
        background: #141414;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      /* Set the theme before first paint so there is no flash; App.jsx
         keeps it in sync afterwards (see src/theme.js). */
      try {
        var saved = localStorage.getItem("fabric-atlas-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        /* default to light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
