<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="architecture-implementation-architecture-title architecture-implementation-architecture-desc" data-diagram-id="architecture-implementation-architecture"><title id="architecture-implementation-architecture-title">Implementing a Fabric Data Architecture — Thin Slice to Operations</title><desc id="architecture-implementation-architecture-desc">A three-stage implementation architecture. An owned source and service boundary scopes a thin delivery slice. Fabric workloads then ingest, transform, and serve that slice over shared OneLake data. Governance, operational evidence, recovery, and acceptance complete the path before the pattern is scaled.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#063D3B"/><stop offset="1" stop-color="#117865"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2AAC94"/></marker></defs><rect width="1180" height="900" fill="#FAF9F8"/><rect width="1180" height="118" fill="url(#head)"/><text x="52" y="54" fill="white" font-size="28" font-weight="700" data-node-id="step-2" tabindex="0" aria-label="Unified Fabric delivery slice"><title data-node-tooltip="true">Unified Fabric delivery slice — Use role-oriented Fabric workloads for ingestion, transformation, serving, and BI while keeping the slice inside one shared environment.</title>Implementing a Fabric Data Architecture</text><text x="52" y="84" fill="#CFF3E9" font-size="11" data-node-id="step-1" tabindex="0" aria-label="Owned implementation boundary"><title data-node-tooltip="true">Owned implementation boundary — Name the owner, source contract, output contract, identity boundary, and recovery objective before provisioning the slice.</title>Implementing a Fabric Data Architecture architecture — Foundation and guardrails, Thin vertical product slice, Scale-out, operations, and optimization</text><text x="52" y="154" fill="#605E5C" font-size="13" letter-spacing="2">END-TO-END ARCHITECTURE</text><path d="M 340 240 C 375 240, 395 240, 430 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 690 240 C 725 240, 745 240, 780 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="108" cy="198" r="16" fill="#117865"/><text x="108" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text><text x="230" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600"><tspan x="230" dy="0">Foundation and</tspan><tspan x="230" dy="22">guardrails</tspan></text>
<rect x="430" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="458" cy="198" r="16" fill="#117865"/><text x="458" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text><text x="580" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600"><tspan x="580" dy="0">Thin vertical product</tspan><tspan x="580" dy="22">slice</tspan></text>
<rect x="780" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="808" cy="198" r="16" fill="#117865"/><text x="808" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text><text x="930" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600"><tspan x="930" dy="0">Scale-out, operations,</tspan><tspan x="930" dy="22">and optimization</tspan></text><rect x="52" y="485" width="1076" height="118" rx="16" fill="#E8F6F1" stroke="#2AAC94" stroke-width="2"/><text x="76" y="515" fill="#117865" font-size="12" font-weight="700" letter-spacing="1.4">WORKED EXAMPLE</text><text x="76" y="547" fill="#063D3B" font-size="15"><tspan x="76" dy="0">A sales slice proves one source, silver model, gold fact,</tspan><tspan x="76" dy="19">certified report, deployment, rollback, monitoring, and</tspan><tspan x="76" dy="19">support end to end.</tspan></text><rect x="52" y="630" width="516" height="145" rx="16" fill="#EDF8F1" stroke="#6BBF8A"/><text x="78" y="662" fill="#176B3A" font-size="13" font-weight="700" letter-spacing="1.3">IMPLEMENTATION CONTROLS</text><text x="82" y="695" fill="#285943" font-size="14">✓ Automated contract tests</text><text x="82" y="719" fill="#285943" font-size="14">✓ Environment configuration</text><text x="82" y="743" fill="#285943" font-size="14">✓ Release and rollback evidence</text><rect x="612" y="630" width="516" height="145" rx="16" fill="#FFF7E6" stroke="#D6A84B"/><text x="638" y="662" fill="#7A4B00" font-size="13" font-weight="700" letter-spacing="1.3">FAILURE MODES</text><text x="640" y="695" fill="#7A4B00" font-size="14">⚠ Framework before product</text><text x="640" y="719" fill="#7A4B00" font-size="14">⚠ Manual production configuration</text><text x="640" y="743" fill="#7A4B00" font-size="14">⚠ No operational acceptance</text><rect x="52" y="800" width="1076" height="54" rx="13" fill="#F0F5F3" stroke="#B8D8CE"/><text x="590" y="832" text-anchor="middle" fill="#063D3B" font-size="14">In Atlas: select a choice → inspect evidence → drill into inputs, processing, outputs, example, controls, and risks.</text><text x="1128" y="882" text-anchor="end" fill="#605E5C" font-size="10" data-node-id="step-3" tabindex="0" aria-label="Governed OneLake outcome"><title data-node-tooltip="true">Governed OneLake outcome — Complete the slice with shared Delta data, inherited governance, operational signals, and a tested recovery path.</title>Fabric Atlas original · Microsoft Fabric implementation guidance</text></svg>
