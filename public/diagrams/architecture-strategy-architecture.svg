<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="architecture-strategy-architecture-title architecture-strategy-architecture-desc" data-diagram-id="architecture-strategy-architecture">
  <title id="architecture-strategy-architecture-title">Fabric Data Architecture Strategy — Domain to Delivery</title>
  <desc id="architecture-strategy-architecture-desc">An eight-node architecture graph. A business and domain boundary node feeds Fabric workload selection. Workload selection feeds OneLake placement, which is the single logical copy of data. From OneLake, three paths branch: cross-cloud shortcuts, the governance and security boundary, and capacity allocation. Governance and capacity both feed into an operate-and-measure node, which feeds back into workload selection to close the loop. A separate warning node, reachable directly from workload selection if OneLake placement is skipped, shows the duplicated-physical-lake anti-pattern.</desc>
  <defs>
    <linearGradient id="strategy-head" x1="0" x2="1"><stop stop-color="#092F3B"/><stop offset="1" stop-color="#075E62"/></linearGradient>
    <linearGradient id="lake-fill" x1="0" x2="1"><stop stop-color="#E1F8F5"/><stop offset="1" stop-color="#E9F2FF"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102A43" flood-opacity=".13"/></filter>
    <marker id="strategy-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#16877D"/></marker>
    <marker id="strategy-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2F66C5"/></marker>
    <marker id="strategy-arrow-warn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#C86421"/></marker>
  </defs>
  <rect width="1180" height="980" fill="#F7FAFC"/>
  <rect width="1180" height="104" fill="url(#strategy-head)"/>
  <text x="44" y="45" fill="#FFFFFF" font-size="28" font-weight="700">Domain-to-delivery operating topology</text>
  <text x="44" y="74" fill="#CDEEEB" font-size="14">One owned outcome · fit-for-purpose workloads · one logical data copy · observable controls</text>
  <g transform="translate(924 24)"><rect width="212" height="52" rx="12" fill="#FFFFFF" opacity=".12"/><circle cx="26" cy="26" r="12" fill="none" stroke="#7BE0D6" stroke-width="3"/><path d="M21 26l4 4 8-10" fill="none" stroke="#7BE0D6" stroke-width="3"/><text x="48" y="23" fill="#FFFFFF" font-size="12" font-weight="700">STRATEGY TEST</text><text x="48" y="40" fill="#CDEEEB" font-size="12">Can every choice be observed?</text></g>

  <rect x="28" y="122" width="1124" height="204" rx="18" fill="#FFFFFF" stroke="#C9D8E5"/>
  <text x="48" y="150" fill="#536777" font-size="12" font-weight="700" letter-spacing="1.5">01 · DOMAIN INTENT → EXECUTION → SHARED DATA</text>
  <path d="M302 237H360" stroke="#16877D" stroke-width="4" fill="none" marker-end="url(#strategy-arrow)"/>
  <text x="331" y="219" text-anchor="middle" fill="#536777" font-size="11">scopes work</text>
  <path d="M682 237H740" stroke="#16877D" stroke-width="4" fill="none" marker-end="url(#strategy-arrow)"/>
  <text x="711" y="219" text-anchor="middle" fill="#536777" font-size="11">persists once</text>

  <g data-node-id="business-domain" role="group" filter="url(#shadow)" tabindex="0" aria-label="Business outcome &amp; domain boundary">
    <title data-node-tooltip="true">Business outcome &amp; domain boundary — The architecture starts by naming an owner, a bounded data product, and the outcome it serves — not a technology choice.</title>
    <rect x="48" y="170" width="254" height="132" rx="16" fill="#F5F0FF" stroke="#7656B5" stroke-width="2"/>
    <circle cx="82" cy="204" r="20" fill="#7656B5"/><circle cx="82" cy="198" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M67 220c3-10 27-10 30 0" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="112" y="195" fill="#4B347C" font-size="12" font-weight="700">DOMAIN CONTRACT</text>
    <text x="112" y="218" fill="#172B4D" font-size="17" font-weight="700">Owner + outcome</text>
    <path d="M68 240H282" stroke="#D7CAE9"/>
    <text x="68" y="260" fill="#3F5062" font-size="12">Bounded data product</text><text x="68" y="279" fill="#3F5062" font-size="12">Source contract · success signal</text>
    <rect x="225" y="246" width="57" height="24" rx="12" fill="#E9DFF8"/><text x="253" y="262" text-anchor="middle" fill="#5C3D91" font-size="10" font-weight="700">PATTERN</text>
  </g>

  <g data-node-id="workload-selection" role="group" filter="url(#shadow)" tabindex="0" aria-label="Fabric workload selection">
    <title data-node-tooltip="true">Fabric workload selection — Pick the role-oriented Fabric workload(s) the domain needs — Data Factory, Data Engineering, Data Warehouse, Real-Time Intelligence, Power BI, and others all share the same environment.</title>
    <rect x="360" y="170" width="322" height="132" rx="16" fill="#EEF8FF" stroke="#3684C6" stroke-width="2"/>
    <rect x="382" y="188" width="42" height="42" rx="10" fill="#3684C6"/><path d="M393 200h20M393 209h20M393 218h12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="440" y="198" fill="#205C8A" font-size="12" font-weight="700">ROLE-ORIENTED ENGINES</text>
    <text x="440" y="221" fill="#172B4D" font-size="17" font-weight="700">Select by workload fit</text>
    <g fill="#DCEFFF"><rect x="382" y="244" width="56" height="30" rx="8"/><rect x="444" y="244" width="56" height="30" rx="8"/><rect x="506" y="244" width="56" height="30" rx="8"/><rect x="568" y="244" width="92" height="30" rx="8"/></g>
    <g fill="#205C8A" font-size="10" font-weight="700" text-anchor="middle"><text x="410" y="263">INGEST</text><text x="472" y="263">SPARK</text><text x="534" y="263">SQL</text><text x="614" y="263">BI / EVENTS</text></g>
    <circle cx="655" cy="194" r="11" fill="#DFF4EE"/><text x="655" y="198" text-anchor="middle" fill="#087868" font-size="11" font-weight="700">S1</text>
  </g>

  <g data-node-id="onelake-placement" role="group" filter="url(#shadow)" tabindex="0" aria-label="OneLake: the single logical copy">
    <title data-node-tooltip="true">OneLake: the single logical copy — Every workload persists its data into the same tenant-wide OneLake, in open Delta Parquet, so no workload keeps a private copy.</title>
    <rect x="740" y="170" width="392" height="132" rx="16" fill="url(#lake-fill)" stroke="#16877D" stroke-width="2.5"/>
    <g transform="translate(762 188)"><ellipse cx="30" cy="12" rx="28" ry="10" fill="#16877D"/><path d="M2 12v48c0 6 13 11 28 11s28-5 28-11V12" fill="#C6F1EC" stroke="#16877D" stroke-width="2"/><path d="M2 29c0 6 13 11 28 11s28-5 28-11M2 46c0 6 13 11 28 11s28-5 28-11" fill="none" stroke="#16877D" stroke-width="2"/></g>
    <text x="832" y="196" fill="#087868" font-size="12" font-weight="700">TENANT-WIDE DATA FOUNDATION</text>
    <text x="832" y="221" fill="#172B4D" font-size="18" font-weight="700">OneLake · one logical copy</text>
    <text x="832" y="246" fill="#3F5062" font-size="12">Open Delta Parquet · shared engine access</text>
    <rect x="832" y="260" width="180" height="25" rx="12" fill="#D9F3EF"/><text x="922" y="277" text-anchor="middle" fill="#087868" font-size="11" font-weight="700">NO PRIVATE WORKLOAD SILOS</text>
    <circle cx="1098" cy="194" r="11" fill="#DFF4EE"/><text x="1098" y="198" text-anchor="middle" fill="#087868" font-size="11" font-weight="700">S1</text>
  </g>

  <rect x="28" y="348" width="1124" height="330" rx="18" fill="#F0F5F8" stroke="#C9D8E5"/>
  <text x="48" y="378" fill="#536777" font-size="12" font-weight="700" letter-spacing="1.5">02 · CONTROLS AROUND THE SHARED FOUNDATION</text>
  <path d="M936 302V353H175V407" stroke="#16877D" stroke-width="2.5" fill="none" marker-end="url(#strategy-arrow)"/>
  <path d="M936 353H455V407" stroke="#16877D" stroke-width="2.5" fill="none" marker-end="url(#strategy-arrow)"/>
  <path d="M936 353H735V407" stroke="#2F66C5" stroke-width="2.5" fill="none" marker-end="url(#strategy-arrow-blue)"/>

  <g data-node-id="shortcuts-external" role="group" filter="url(#shadow)" tabindex="0" aria-label="Shortcuts for cross-cloud data">
    <title data-node-tooltip="true">Shortcuts for cross-cloud data — External data (ADLS, S3, GCS, Dataverse) is referenced in place via OneLake shortcuts instead of copied in.</title>
    <rect x="48" y="407" width="254" height="150" rx="15" fill="#FFFFFF" stroke="#16877D" stroke-width="2"/>
    <path d="M72 447h34l14 14-14 14H72l14-14Z" fill="#D8F2EE" stroke="#16877D" stroke-width="2"/><path d="M100 461h28" stroke="#16877D" stroke-width="3"/>
    <text x="132" y="437" fill="#087868" font-size="11" font-weight="700">ZERO-COPY REFERENCE</text><text x="132" y="460" fill="#172B4D" font-size="16" font-weight="700">External shortcuts</text>
    <text x="68" y="500" fill="#3F5062" font-size="12">ADLS · S3 · GCS · Dataverse</text><text x="68" y="522" fill="#3F5062" font-size="12">Mount data; preserve source ownership</text>
    <circle cx="273" cy="431" r="11" fill="#DFF4EE"/><text x="273" y="435" text-anchor="middle" fill="#087868" font-size="11" font-weight="700">S1</text>
  </g>

  <g data-node-id="governance-purview" role="group" filter="url(#shadow)" tabindex="0" aria-label="Governance &amp; security boundary">
    <title data-node-tooltip="true">Governance &amp; security boundary — Purview-backed governance — domains, sensitivity labels, DLP, row/column security — attaches at the OneLake/workspace boundary, not per workload.</title>
    <rect x="328" y="407" width="254" height="150" rx="15" fill="#FFFFFF" stroke="#7656B5" stroke-width="2"/>
    <path d="M374 430l22 8v17c0 15-10 25-22 31-12-6-22-16-22-31v-17Z" fill="#EEE7FA" stroke="#7656B5" stroke-width="2"/><path d="M365 456l7 7 13-17" fill="none" stroke="#7656B5" stroke-width="3"/>
    <text x="410" y="437" fill="#5C3D91" font-size="11" font-weight="700">POLICY ENVELOPE</text><text x="410" y="460" fill="#172B4D" font-size="16" font-weight="700">Govern + protect</text>
    <text x="348" y="500" fill="#3F5062" font-size="12">Tenant → domain → workspace</text><text x="348" y="522" fill="#3F5062" font-size="12">Labels · lineage · row/column security</text>
    <circle cx="553" cy="431" r="11" fill="#DFF4EE"/><text x="553" y="435" text-anchor="middle" fill="#087868" font-size="11" font-weight="700">S1</text>
  </g>

  <g data-node-id="capacity-operate" role="group" filter="url(#shadow)" tabindex="0" aria-label="Capacity allocation &amp; throttling">
    <title data-node-tooltip="true">Capacity allocation &amp; throttling — Capacity is the isolation and billing boundary; it enforces throttling per capacity, not per tenant, when a workload oversubscribes.</title>
    <rect x="608" y="407" width="254" height="150" rx="15" fill="#FFFFFF" stroke="#2F66C5" stroke-width="2"/>
    <path d="M653 474a26 26 0 1 1 43 0" fill="none" stroke="#2F66C5" stroke-width="6"/><path d="M675 470l14-20" stroke="#2F66C5" stroke-width="4"/><circle cx="675" cy="470" r="5" fill="#2F66C5"/>
    <text x="712" y="437" fill="#244F9B" font-size="11" font-weight="700">COMPUTE BOUNDARY</text><text x="712" y="460" fill="#172B4D" font-size="16" font-weight="700">Capacity + throttle</text>
    <text x="628" y="500" fill="#3F5062" font-size="12">Isolate cost and workload impact</text><text x="628" y="522" fill="#3F5062" font-size="12">Burst → smooth → staged throttle</text>
    <circle cx="833" cy="431" r="11" fill="#DFF4EE"/><text x="833" y="435" text-anchor="middle" fill="#087868" font-size="11" font-weight="700">S2</text>
  </g>

  <path d="M582 530H914" stroke="#7656B5" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#strategy-arrow-blue)"/>
  <path d="M862 505H914" stroke="#2F66C5" stroke-width="2.5" fill="none" marker-end="url(#strategy-arrow-blue)"/>
  <g data-node-id="operate-measure" role="group" filter="url(#shadow)" tabindex="0" aria-label="Operate &amp; measure">
    <title data-node-tooltip="true">Operate &amp; measure — Monitoring hub and capacity metrics close the loop: observed throttling, lineage, and usage feed back into workload and capacity decisions.</title>
    <rect x="914" y="407" width="218" height="150" rx="15" fill="#092F3B" stroke="#36C2B3" stroke-width="2"/>
    <path d="M941 475V442M956 475v-20M971 475v-31M986 475v-12" stroke="#7BE0D6" stroke-width="7"/>
    <text x="1002" y="437" fill="#7BE0D6" font-size="11" font-weight="700">OBSERVE</text><text x="1002" y="460" fill="#FFFFFF" font-size="16" font-weight="700">Operate + learn</text>
    <text x="934" y="500" fill="#D8F3F0" font-size="12">Lineage · usage · CU metrics</text><text x="934" y="522" fill="#D8F3F0" font-size="12">Turn signals into next decisions</text>
    <rect x="934" y="532" width="81" height="20" rx="10" fill="#1B6F70"/><text x="974" y="546" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700">INFERENCE</text>
  </g>
  <path d="M1023 557V625H521V304" stroke="#2F66C5" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#strategy-arrow-blue)"/>
  <text x="745" y="648" text-anchor="middle" fill="#244F9B" font-size="11" font-weight="700">FEEDBACK · measured contention and lineage findings revise workload choice</text>

  <rect x="28" y="700" width="1124" height="230" rx="18" fill="#FFFFFF" stroke="#C9D8E5"/>
  <text x="48" y="730" fill="#536777" font-size="12" font-weight="700" letter-spacing="1.5">03 · GUARDRAILS FOR DELIVERY</text>
  <path d="M521 302V337H18V742H170V759" stroke="#C86421" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#strategy-arrow-warn)"/>
  <text x="293" y="340" fill="#9A4616" font-size="11" font-weight="700">IF THE ONELAKE PLACEMENT IS SKIPPED</text>
  <g data-node-id="anti-pattern-duplication" role="group" filter="url(#shadow)" tabindex="0" aria-label="Anti-pattern: duplicated physical lakes">
    <title data-node-tooltip="true">Anti-pattern: duplicated physical lakes — Standing up a separate physical data lake per business group instead of using OneLake workspaces and shortcuts recreates the duplication OneLake removes.</title>
    <rect x="48" y="759" width="364" height="134" rx="16" fill="#FFF3E8" stroke="#C86421" stroke-width="2.5"/>
    <path d="M78 792l22-36 22 36Z" fill="#E18433"/><text x="100" y="785" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800">!</text>
    <text x="136" y="781" fill="#9A4616" font-size="11" font-weight="700">WARNING · DUPLICATION</text><text x="136" y="804" fill="#172B4D" font-size="16" font-weight="700">A physical lake per domain</text>
    <text x="68" y="839" fill="#5D4638" font-size="12">Copies multiply · controls fragment · engines diverge</text><text x="68" y="862" fill="#5D4638" font-size="12" font-weight="700">Recover: use workspaces + shortcuts over OneLake</text>
  </g>
  <g transform="translate(444 759)"><rect width="334" height="134" rx="16" fill="#EDF8F3" stroke="#73B999"/><text x="22" y="28" fill="#176B55" font-size="11" font-weight="700">OPERATING CHECKLIST</text><g fill="#FFFFFF" stroke="#16877D" stroke-width="2"><circle cx="28" cy="53" r="9"/><circle cx="28" cy="80" r="9"/><circle cx="28" cy="107" r="9"/></g><g fill="none" stroke="#16877D" stroke-width="2"><path d="M24 53l3 3 6-7"/><path d="M24 80l3 3 6-7"/><path d="M24 107l3 3 6-7"/></g><g fill="#294E45" font-size="12"><text x="48" y="57">Named owner and completion signal</text><text x="48" y="84">One logical data placement</text><text x="48" y="111">Capacity and lineage reviewed together</text></g></g>
  <g transform="translate(808 759)"><rect width="324" height="134" rx="16" fill="#EEF4FD" stroke="#7A9ED8"/><text x="22" y="28" fill="#244F9B" font-size="11" font-weight="700">WHAT TO WATCH</text><path d="M25 58c13-14 29-14 42 0-13 14-29 14-42 0Z" fill="none" stroke="#2F66C5" stroke-width="2"/><circle cx="46" cy="58" r="6" fill="#2F66C5"/><text x="82" y="55" fill="#29445F" font-size="12">Recurring throttle or cold cross-cloud reads</text><text x="82" y="75" fill="#29445F" font-size="12">Missing labels or broken lineage signals</text><path d="M25 96h42" stroke="#2F66C5" stroke-width="2" marker-end="url(#strategy-arrow-blue)"/><text x="82" y="100" fill="#244F9B" font-size="12" font-weight="700">Feed evidence back; do not freeze design</text></g>
  <text x="1132" y="958" text-anchor="end" fill="#687B8C" font-size="10">Fabric Atlas original · product-neutral vector language · evidence keys in tooltips</text>
</svg>
