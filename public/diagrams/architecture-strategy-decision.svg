<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="architecture-strategy-decision-title architecture-strategy-decision-desc" data-diagram-id="architecture-strategy-decision">
  <title id="architecture-strategy-decision-title">Sequence the Platform, or Sequence the Outcome?</title>
  <desc id="architecture-strategy-decision-desc">A decision tree with three questions. The first asks whether anything has yet reached a real consumer. If not, the recommended path is one bounded data product delivered end to end; the alternative, building the platform and its frameworks first, is flagged as the warning branch because it produces no outcome to validate against. The second question asks whether a second workload is genuinely required by a consumer or is being added speculatively. The third asks whether a domain needs its own capacity, which turns on whether its workloads are actually contending for compute rather than on org-chart boundaries.</desc>
  <defs>
    <linearGradient id="decision-head" x1="0" x2="1"><stop stop-color="#142F46"/><stop offset="1" stop-color="#155D66"/></linearGradient>
    <filter id="decision-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102A43" flood-opacity=".14"/></filter>
    <marker id="decision-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#14877D"/></marker>
    <marker id="decision-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2E66C5"/></marker>
    <marker id="decision-arrow-warn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#C45F1C"/></marker>
  </defs>
  <rect width="1180" height="980" fill="#F7FAFC"/>
  <rect width="1180" height="104" fill="url(#decision-head)"/>
  <text x="44" y="44" fill="#FFFFFF" font-size="28" font-weight="700">Sequence the outcome — then earn the platform</text>
  <text x="44" y="74" fill="#CBEDE9" font-size="14">A decision guide for the next delivery increment, workload, and capacity boundary</text>
  <g transform="translate(926 22)"><rect width="210" height="56" rx="12" fill="#FFFFFF" opacity=".12"/><text x="18" y="23" fill="#8DE6DC" font-size="11" font-weight="700">DEFINITION OF “YES”</text><text x="18" y="43" fill="#FFFFFF" font-size="12">A named person uses the output</text></g>

  <text x="42" y="133" fill="#5B6D7C" font-size="11" font-weight="700" letter-spacing="1.4">QUESTION 1 · VERIFY CONSUMPTION</text>
  <g data-node-id="start-question" role="group" filter="url(#decision-shadow)" tabindex="0" aria-label="Has anything reached a real consumer yet?">
    <title data-node-tooltip="true">Has anything reached a real consumer yet? — The root question. Everything else in the sequence depends on whether a real user is already being served.</title>
    <rect x="325" y="150" width="530" height="126" rx="24" fill="#FFFFFF" stroke="#155D66" stroke-width="3"/>
    <circle cx="382" cy="213" r="36" fill="#E1F6F2" stroke="#14877D" stroke-width="2"/><path d="M357 213c15-18 35-18 50 0-15 18-35 18-50 0Z" fill="none" stroke="#14877D" stroke-width="3"/><circle cx="382" cy="213" r="8" fill="#14877D"/>
    <text x="438" y="190" fill="#08766C" font-size="11" font-weight="700">THE UNCOMFORTABLE TEST</text>
    <text x="438" y="219" fill="#172B4D" font-size="21" font-weight="700">Has anything reached a real consumer?</text>
    <text x="438" y="246" fill="#445769" font-size="13">Name the person · the decision · evidence of repeated use</text>
    <rect x="760" y="169" width="72" height="25" rx="12" fill="#E6F1F5"/><text x="796" y="186" text-anchor="middle" fill="#365468" font-size="10" font-weight="700">PATTERN</text>
  </g>

  <path d="M430 276V310H225V346" fill="none" stroke="#14877D" stroke-width="3" marker-end="url(#decision-arrow)"/>
  <rect x="294" y="297" width="132" height="23" rx="11" fill="#DDF3EE"/><text x="360" y="313" text-anchor="middle" fill="#08766C" font-size="10" font-weight="700">NO · PROVE ONE SLICE</text>
  <path d="M590 276V310H590V346" fill="none" stroke="#C45F1C" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#decision-arrow-warn)"/>
  <rect x="495" y="297" width="190" height="23" rx="11" fill="#FFF0E4"/><text x="590" y="313" text-anchor="middle" fill="#9A4513" font-size="10" font-weight="700">NO · BUT BUILD PLATFORM ANYWAY</text>
  <path d="M750 276V310H962V346" fill="none" stroke="#2E66C5" stroke-width="3" marker-end="url(#decision-arrow-blue)"/>
  <rect x="764" y="297" width="151" height="23" rx="11" fill="#E7EFFC"/><text x="840" y="313" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">YES · CONSIDER EXTENSION</text>

  <text x="42" y="338" fill="#5B6D7C" font-size="11" font-weight="700" letter-spacing="1.4">THREE HONEST ROUTES</text>
  <g data-node-id="outcome-bounded-product" role="group" filter="url(#decision-shadow)" tabindex="0" aria-label="Deliver one bounded data product">
    <title data-node-tooltip="true">Deliver one bounded data product — One source, through OneLake, to one semantic model and one report that a named person actually uses.</title>
    <rect x="42" y="346" width="366" height="206" rx="18" fill="#ECF8F3" stroke="#14877D" stroke-width="2.5"/>
    <rect x="62" y="366" width="132" height="25" rx="12" fill="#14877D"/><text x="128" y="383" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">RECOMMENDED FIRST</text>
    <text x="62" y="422" fill="#123A3A" font-size="18" font-weight="700">One bounded product</text>
    <text x="62" y="448" fill="#3E5A57" font-size="12">The smallest complete learning loop:</text>
    <g transform="translate(62 467)"><rect width="58" height="44" rx="9" fill="#FFFFFF" stroke="#7DC7B6"/><rect x="70" width="70" height="44" rx="9" fill="#FFFFFF" stroke="#7DC7B6"/><rect x="152" width="70" height="44" rx="9" fill="#FFFFFF" stroke="#7DC7B6"/><rect x="234" width="70" height="44" rx="9" fill="#FFFFFF" stroke="#7DC7B6"/><path d="M58 22h12M140 22h12M222 22h12" stroke="#14877D" stroke-width="2" marker-end="url(#decision-arrow)"/><g fill="#08766C" font-size="10" font-weight="700" text-anchor="middle"><text x="29" y="26">SOURCE</text><text x="105" y="20">ONE</text><text x="105" y="33">LAKE</text><text x="187" y="26">MODEL</text><text x="269" y="26">REPORT</text></g></g>
    <text x="62" y="537" fill="#08766C" font-size="11" font-weight="700">EXIT SIGNAL · consumed, secured, recoverable</text>
    <circle cx="379" cy="374" r="11" fill="#DDF3EE"/><text x="379" y="378" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text>
  </g>

  <g data-node-id="warning-platform-first" role="group" filter="url(#decision-shadow)" tabindex="0" aria-label="Platform-first delivery with no outcome">
    <title data-node-tooltip="true">Platform-first delivery with no outcome — Frameworks, medallion layers, and governance models built before anything is consumed.</title>
    <rect x="426" y="346" width="328" height="206" rx="18" fill="#FFF3E8" stroke="#C45F1C" stroke-width="2.5"/>
    <path d="M458 397l24-40 24 40Z" fill="#DF7E2B"/><text x="482" y="389" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">!</text>
    <text x="520" y="371" fill="#984411" font-size="11" font-weight="700">WARNING · NO FEEDBACK</text>
    <text x="520" y="396" fill="#4A2A18" font-size="17" font-weight="700">The platform-first trap</text>
    <path d="M450 419H730" stroke="#EDC7A9"/>
    <g fill="#6A4934" font-size="12"><text x="450" y="445">Frameworks before two concrete cases</text><text x="450" y="469">Medallion layers without a consumer</text><text x="450" y="493">Controls whose behavior is untested</text></g>
    <rect x="450" y="511" width="280" height="25" rx="12" fill="#FFE1CA"/><text x="590" y="528" text-anchor="middle" fill="#984411" font-size="11" font-weight="700">COURSE CORRECT → CUT THE THIN SLICE</text>
  </g>
  <path d="M426 523H410" stroke="#C45F1C" stroke-width="2.5" marker-end="url(#decision-arrow-warn)"/>

  <g data-node-id="second-workload-question" role="group" filter="url(#decision-shadow)" tabindex="0" aria-label="Is a second workload actually required?">
    <title data-node-tooltip="true">Is a second workload actually required? — Second question: is the new workload pulled in by a consumer, or pushed in speculatively?</title>
    <rect x="772" y="346" width="366" height="206" rx="18" fill="#EEF4FD" stroke="#2E66C5" stroke-width="2.5"/>
    <text x="794" y="376" fill="#244F99" font-size="11" font-weight="700">QUESTION 2 · WORKLOAD PULL</text>
    <text x="794" y="406" fill="#172B4D" font-size="18" font-weight="700">Is another engine required?</text>
    <text x="794" y="432" fill="#445769" font-size="12">Name the dated consumer requirement first.</text>
    <g transform="translate(794 451)"><rect width="148" height="70" rx="12" fill="#DFF3ED"/><circle cx="22" cy="22" r="12" fill="#14877D"/><path d="M16 22l4 4 8-10" stroke="#FFFFFF" stroke-width="2.5" fill="none"/><text x="42" y="20" fill="#08766C" font-size="11" font-weight="700">YES · ADD IT</text><text x="14" y="48" fill="#3E5A57" font-size="10">Requirement pulls the</text><text x="14" y="62" fill="#3E5A57" font-size="10">workload into the slice</text><rect x="160" width="148" height="70" rx="12" fill="#FFFFFF" stroke="#AFC4DD"/><circle cx="182" cy="22" r="12" fill="#7089A6"/><path d="M175 22h14" stroke="#FFFFFF" stroke-width="2.5"/><text x="202" y="20" fill="#445F7D" font-size="11" font-weight="700">NO · WAIT</text><text x="174" y="48" fill="#52677C" font-size="10">Avoid speculative skills</text><text x="174" y="62" fill="#52677C" font-size="10">and operating surface</text></g>
    <circle cx="1109" cy="374" r="11" fill="#DDF3EE"/><text x="1109" y="378" text-anchor="middle" fill="#08766C" font-size="11" font-weight="700">S1</text>
  </g>
  <path d="M408 540V588H955V632" fill="none" stroke="#2E66C5" stroke-width="2.5" marker-end="url(#decision-arrow-blue)"/>
  <text x="630" y="578" fill="#244F99" font-size="10" font-weight="700">ONCE CONSUMED · CONSIDER EXTENDING</text>
  <path d="M955 552V632" fill="none" stroke="#2E66C5" stroke-width="3" marker-end="url(#decision-arrow-blue)"/>
  <rect x="979" y="579" width="151" height="23" rx="11" fill="#E7EFFC"/><text x="1055" y="595" text-anchor="middle" fill="#244F99" font-size="10" font-weight="700">AS WORKLOADS MULTIPLY</text>

  <text x="42" y="626" fill="#5B6D7C" font-size="11" font-weight="700" letter-spacing="1.4">QUESTION 3 · DRAW COMPUTE BOUNDARIES FROM EVIDENCE</text>
  <g data-node-id="capacity-question" role="group" filter="url(#decision-shadow)" tabindex="0" aria-label="Does a domain need its own capacity?">
    <title data-node-tooltip="true">Does a domain need its own capacity? — Third question: separate capacity is a compute-contention and cost-boundary decision, not an org-chart one.</title>
    <rect x="398" y="650" width="740" height="190" rx="20" fill="#FFFFFF" stroke="#6E63B6" stroke-width="2.5"/>
    <g transform="translate(423 674)"><path d="M0 34A34 34 0 1 1 60 55" fill="none" stroke="#6E63B6" stroke-width="7"/><path d="M34 34l19-20" stroke="#6E63B6" stroke-width="4"/><circle cx="34" cy="34" r="6" fill="#6E63B6"/></g>
    <text x="505" y="684" fill="#574C9B" font-size="11" font-weight="700">CAPACITY IS A BEHAVIORAL BOUNDARY</text>
    <text x="505" y="712" fill="#172B4D" font-size="19" font-weight="700">Do domains actually collide under load?</text>
    <text x="505" y="737" fill="#445769" font-size="12">Use observed contention and chargeback needs — never the reporting hierarchy alone.</text>
    <g transform="translate(423 763)"><rect width="210" height="54" rx="11" fill="#E9F6F1"/><text x="16" y="21" fill="#08766C" font-size="10" font-weight="700">SPLIT WHEN</text><text x="16" y="41" fill="#36584F" font-size="11">Contention or cost isolation is real</text><rect x="224" width="210" height="54" rx="11" fill="#EEF4FD"/><text x="240" y="21" fill="#244F99" font-size="10" font-weight="700">POOL WHEN</text><text x="240" y="41" fill="#445F7D" font-size="11">Peaks coexist without interference</text><rect x="448" width="244" height="54" rx="11" fill="#FFF1E7"/><text x="464" y="21" fill="#984411" font-size="10" font-weight="700">DO NOT SPLIT FOR</text><text x="464" y="41" fill="#6A4934" font-size="11">Org-chart symmetry without evidence</text></g>
    <rect x="1041" y="671" width="72" height="25" rx="12" fill="#EEEAFB"/><text x="1077" y="688" text-anchor="middle" fill="#574C9B" font-size="10" font-weight="700">INFERENCE</text>
  </g>

  <path d="M398 746H24V214H325" fill="none" stroke="#6E63B6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#decision-arrow-blue)"/>
  <rect x="42" y="681" width="232" height="116" rx="15" fill="#F4F0FC" stroke="#B6AADE"/>
  <text x="62" y="708" fill="#574C9B" font-size="11" font-weight="700">RE-ASK EACH INCREMENT</text>
  <text x="62" y="734" fill="#453E6D" font-size="12">Did a consumer use it?</text><text x="62" y="755" fill="#453E6D" font-size="12">Did another workload earn its place?</text><text x="62" y="776" fill="#453E6D" font-size="12">Did contention actually appear?</text>

  <rect x="42" y="872" width="1096" height="65" rx="16" fill="#142F46"/>
  <text x="67" y="899" fill="#7DE1D7" font-size="11" font-weight="700">OPERATING PRINCIPLE</text>
  <text x="67" y="921" fill="#FFFFFF" font-size="14">Build the smallest complete loop, observe it in production, and let evidence—not framework ambition—authorize the next layer.</text>
  <text x="1138" y="963" text-anchor="end" fill="#687B8C" font-size="10">Fabric Atlas original · product-neutral vector language · evidence keys in tooltips</text>
</svg>
