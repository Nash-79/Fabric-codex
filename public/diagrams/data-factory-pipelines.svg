<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Palette: #063D3B #117865 #2AAC94 #25FFD4 #EAF7F2
       Grounds claims: a375a956302f (pipelines/orchestration), b50f562292cd (run triggers),
       0089756ce4ee (schedule start/end), febf2107a227 (up to 20 schedules),
       b80b9c108772 (interval schedules), 48f717f5bd90 (event triggers),
       a2534f926b19 (Copy scale-out levels), 5a6a52707a59 (ITO presets),
       ccec56db578e (degree of parallelism), d4ac78b977b4 (ForEach fan-out),
       16aba7b395d4 (large-scale ingestion), e67852b000cf (ETL/ELT pattern) -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="copyBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AAC94"/>
      <stop offset="1" stop-color="#117865"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#117865"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="740" fill="#FFFFFF"/>

  <!-- header bar -->
  <rect x="0" y="0" width="1200" height="64" fill="url(#hdrGrad)"/>
  <text x="36" y="38" font-size="22" font-weight="650" fill="#FFFFFF">Data Factory — Pipelines, Copy Scale-Out &amp; Scheduling</text>
  <text x="36" y="57" font-size="11" fill="#D9F5EE">Fabric Atlas original diagram · capability: data-factory</text>

  <!-- ── SECTION A: Trigger sources ─────────────────────────────────── -->
  <text x="36" y="98" font-size="11" letter-spacing="1.4" fill="#8A8886">TRIGGER SOURCES</text>

  <!-- On-demand -->
  <g transform="translate(36,108)">
    <rect width="148" height="64" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="74" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">On-Demand</text>
    <text x="74" y="46" text-anchor="middle" font-size="10" fill="#3F6259">Manual run</text>
    <text x="74" y="58" text-anchor="middle" font-size="10" fill="#3F6259">from editor</text>
  </g>

  <!-- Schedule -->
  <g transform="translate(196,108)">
    <rect width="200" height="64" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Schedule Trigger</text>
    <text x="100" y="40" text-anchor="middle" font-size="10" fill="#3F6259">Up to 20 per pipeline · start+end required</text>
    <text x="100" y="54" text-anchor="middle" font-size="10" fill="#3F6259">Interval (preview): window start/end params</text>
  </g>

  <!-- Event trigger -->
  <g transform="translate(408,108)">
    <rect width="220" height="64" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="110" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Event Trigger</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#3F6259">OneLake / Blob / Job / Workspace events</text>
    <text x="110" y="54" text-anchor="middle" font-size="10" fill="#3F6259">Backed by Eventstream + Data Activator Reflex</text>
  </g>

  <!-- arrows from triggers down to pipeline box -->
  <line x1="110" y1="172" x2="110" y2="220" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="296" y1="172" x2="296" y2="220" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="518" y1="172" x2="518" y2="220" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ── SECTION B: Pipeline box ─────────────────────────────────────── -->
  <text x="36" y="216" font-size="11" letter-spacing="1.4" fill="#8A8886">PIPELINE</text>
  <rect x="36" y="224" width="760" height="110" rx="10" fill="#F7FDF9" stroke="#117865" stroke-width="1.8"/>
  <text x="56" y="250" font-size="13" font-weight="650" fill="#063D3B">Orchestration Layer</text>
  <text x="56" y="268" font-size="10.5" fill="#424242">Low-code designer · chains Copy activity, notebooks, Spark jobs, SQL scripts, dbt jobs, stored procs</text>
  <text x="56" y="284" font-size="10.5" fill="#424242">Control-flow constructs: ForEach loop · If/Switch conditionals · Until · parallel branches</text>
  <text x="56" y="300" font-size="10.5" fill="#424242">Apache Airflow integration available for Python DAG authoring (code-first alternative)</text>
  <text x="56" y="316" font-size="10.5" fill="#2AAC94" font-style="italic">Triggers one Pipeline Run per execution; run carries start+end timestamps for interval-based slices</text>

  <!-- ── SECTION C: ForEach fan-out ─────────────────────────────────── -->
  <text x="36" y="366" font-size="11" letter-spacing="1.4" fill="#8A8886">SCALE-OUT PATTERN — ForEach LOOP</text>

  <!-- ForEach box -->
  <rect x="36" y="374" width="144" height="56" rx="8" fill="#117865"/>
  <text x="108" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">ForEach</text>
  <text x="108" y="414" text-anchor="middle" font-size="10" fill="#D9F5EE">partition list</text>
  <text x="108" y="426" text-anchor="middle" font-size="10" fill="#D9F5EE">(tables, ranges)</text>

  <!-- arrow ForEach → Copy activities -->
  <line x1="180" y1="402" x2="228" y2="402" stroke="#117865" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <text x="200" y="396" text-anchor="middle" font-size="9" fill="#616161">parallel</text>

  <!-- Three Copy activity boxes side by side -->
  <g transform="translate(228,374)">
    <rect width="130" height="56" rx="8" fill="url(#copyBar)" opacity="0.9"/>
    <text x="65" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Copy Activity</text>
    <text x="65" y="42" text-anchor="middle" font-size="9.5" fill="#D9F5EE">Partition A</text>
  </g>
  <g transform="translate(372,374)">
    <rect width="130" height="56" rx="8" fill="url(#copyBar)" opacity="0.9"/>
    <text x="65" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Copy Activity</text>
    <text x="65" y="42" text-anchor="middle" font-size="9.5" fill="#D9F5EE">Partition B</text>
  </g>
  <g transform="translate(516,374)">
    <rect width="130" height="56" rx="8" fill="url(#copyBar)" opacity="0.9"/>
    <text x="65" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Copy Activity</text>
    <text x="65" y="42" text-anchor="middle" font-size="9.5" fill="#D9F5EE">Partition C…N</text>
  </g>

  <!-- ── SECTION D: Single Copy Activity scale-out detail ───────────── -->
  <text x="36" y="468" font-size="11" letter-spacing="1.4" fill="#8A8886">INSIDE A SINGLE COPY ACTIVITY — THREE PARALLELISM LEVERS</text>

  <!-- ITO box -->
  <g transform="translate(36,476)">
    <rect width="216" height="130" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="108" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#063D3B">Intelligent Throughput</text>
    <text x="108" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#063D3B">Optimization (ITO)</text>
    <text x="12" y="60" font-size="10" fill="#424242">Sizes compute resources for the run.</text>
    <text x="12" y="76" font-size="10" fill="#424242">Weighs CPU, memory, network, cost.</text>
    <text x="12" y="96" font-size="10.5" font-weight="600" fill="#117865">Presets:</text>
    <text x="12" y="112" font-size="10" fill="#424242">Auto · Standard · Balanced · Maximum</text>
    <text x="12" y="126" font-size="10" fill="#424242">or explicit value 4–256</text>
  </g>

  <!-- Degree of parallelism box -->
  <g transform="translate(272,476)">
    <rect width="216" height="130" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="108" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#063D3B">Degree of Copy</text>
    <text x="108" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#063D3B">Parallelism</text>
    <text x="12" y="60" font-size="10" fill="#424242">Thread cap: max concurrent reader /</text>
    <text x="12" y="76" font-size="10" fill="#424242">writer threads inside one activity.</text>
    <text x="12" y="96" font-size="10" fill="#424242">Integer ≥ 1; service may use fewer.</text>
    <text x="12" y="112" font-size="10" fill="#424242">Lower to protect fragile sources.</text>
    <text x="12" y="126" font-size="10" fill="#2AAC94" font-style="italic">Orthogonal to ITO</text>
  </g>

  <!-- Bottleneck box -->
  <g transform="translate(508,476)">
    <rect width="216" height="130" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="108" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#063D3B">Throughput Ceiling</text>
    <text x="12" y="46" font-size="10" fill="#424242">End-to-end speed = min of:</text>
    <text x="12" y="62" font-size="10" fill="#424242">  · Source store IOPS / bandwidth</text>
    <text x="12" y="78" font-size="10" fill="#424242">  · Network path capacity</text>
    <text x="12" y="94" font-size="10" fill="#424242">  · Destination write throughput</text>
    <text x="12" y="114" font-size="10" fill="#C50F1F" font-style="italic">Anti-pattern: tuning ITO / parallelism</text>
    <text x="12" y="127" font-size="10" fill="#C50F1F" font-style="italic">without measuring the bottleneck first</text>
  </g>

  <!-- arrow from Copy activities down into the detail section -->
  <line x1="350" y1="430" x2="350" y2="474" stroke="#117865" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrDark)"/>
  <text x="355" y="454" font-size="9" fill="#616161">detail</text>

  <!-- ── SECTION E: Destination ─────────────────────────────────────── -->
  <text x="36" y="636" font-size="11" letter-spacing="1.4" fill="#8A8886">DESTINATION</text>

  <!-- arrow from copy detail to OneLake -->
  <line x1="144" y1="606" x2="144" y2="652" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="380" y1="606" x2="380" y2="652" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="616" y1="606" x2="616" y2="652" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- OneLake destination bar -->
  <rect x="36" y="652" width="760" height="56" rx="10" fill="#117865"/>
  <text x="56" y="682" font-size="16" font-weight="650" fill="#FFFFFF">OneLake / Lakehouse / Warehouse / KQL Database</text>
  <text x="56" y="698" font-size="10.5" fill="#D9F5EE">Delta-Parquet format · recommended for large-scale one-time migrations and high-volume recurring ingestion</text>

  <!-- ── legend / use-case note ──────────────────────────────────────── -->
  <rect x="820" y="224" width="344" height="484" rx="10" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="840" y="252" font-size="13" font-weight="650" fill="#063D3B">Use-case notes</text>
  <line x1="840" y1="260" x2="1148" y2="260" stroke="#E1DFDD"/>

  <text x="840" y="282" font-size="11" font-weight="600" fill="#117865">ETL path</text>
  <text x="840" y="298" font-size="10.5" fill="#424242">Shape in Dataflow Gen2, then load via</text>
  <text x="840" y="312" font-size="10.5" fill="#424242">Copy activity into Lakehouse / Warehouse.</text>

  <text x="840" y="338" font-size="11" font-weight="600" fill="#117865">ELT path</text>
  <text x="840" y="354" font-size="10.5" fill="#424242">Copy raw files into OneLake first; push</text>
  <text x="840" y="368" font-size="10.5" fill="#424242">transforms into Spark notebooks or SQL.</text>

  <text x="840" y="394" font-size="11" font-weight="600" fill="#117865">170+ connectors</text>
  <text x="840" y="410" font-size="10.5" fill="#424242">Cloud, multi-cloud, and on-prem sources</text>
  <text x="840" y="424" font-size="10.5" fill="#424242">reached through gateways.</text>

  <text x="840" y="450" font-size="11" font-weight="600" fill="#117865">Monitoring</text>
  <text x="840" y="466" font-size="10.5" fill="#424242">Email alerts per schedule (scheduled runs</text>
  <text x="840" y="480" font-size="10.5" fill="#424242">only — manual runs do not fire alerts).</text>

  <text x="840" y="506" font-size="11" font-weight="600" fill="#117865">Schedule limits</text>
  <text x="840" y="522" font-size="10.5" fill="#424242">Max 20 schedules per pipeline.</text>
  <text x="840" y="536" font-size="10.5" fill="#424242">Start + end date mandatory; set end date</text>
  <text x="840" y="550" font-size="10.5" fill="#424242">far in future for long-running pipelines.</text>

  <text x="840" y="576" font-size="11" font-weight="600" fill="#117865">Parameter tip</text>
  <text x="840" y="592" font-size="10.5" fill="#C50F1F">Mismatched param names silently use</text>
  <text x="840" y="606" font-size="10.5" fill="#C50F1F">defaults — not errors — at run time.</text>

  <text x="840" y="632" font-size="11" font-weight="600" fill="#117865">Copilot</text>
  <text x="840" y="648" font-size="10.5" fill="#424242">Natural-language authoring of pipelines;</text>
  <text x="840" y="662" font-size="10.5" fill="#424242">explains run errors with suggested fixes.</text>

  <text x="840" y="688" font-size="10.5" fill="#424242">dbt jobs: SQL transformations direct to</text>
  <text x="840" y="702" font-size="10.5" fill="#424242">Fabric Warehouse via no-code setup.</text>

  <!-- footer -->
  <text x="1164" y="730" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset.</text>
</svg>
