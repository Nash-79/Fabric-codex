<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="data-mesh-domains-architecture-title data-mesh-domains-architecture-desc" data-diagram-id="data-mesh-domains-architecture">
  <title id="data-mesh-domains-architecture-title">Fabric as Federated Data-Mesh Domains</title>
  <desc id="data-mesh-domains-architecture-desc">An architecture diagram: business domains (Finance, Sales, HR) each own a Fabric domain grouping their workspaces and one per-domain capacity. Producer workspaces write gold Delta tables into the single tenant-wide OneLake and certify them as published products in the OneLake Catalog. Consuming domains create read-only OneLake shortcuts into certified products rather than copying data. Tenant-wide governance, powered by built-in Purview, applies labels, DLP, and auditing across every domain regardless of which one reads the data. A warning node flags the anti-pattern of standing up a separate physical lake per domain, and a second warning flags that OneLake security roles do not constrain workspace Admins or Members.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in verified claims: domains group workspaces into business areas
       (fabric-platform-terminology, governance-compliance-overview); one tenant =
       one OneLake with workspaces as folders (onelake-overview); OneLake shortcuts
       give zero-copy cross-workspace/cross-domain references (onelake-shortcuts,
       fabric-platform-overview); three-tier tenant/domain/workspace governance and
       endorsement + OneLake catalog (governance-compliance-overview); capacity is an
       isolation boundary per business unit, throttled per-capacity (capacity-throttling,
       fabric-platform-licenses-capacities). Data-mesh domain-ownership framing is labeled
       inference, not a Fabric fact. -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF7F2"/>
      <stop offset="1" stop-color="#CFEAE2"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8A020"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="780" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1160" height="56" fill="url(#hdrGrad)"/>
  <text x="28" y="24" font-size="17" font-weight="700" fill="#FFFFFF">Data-Mesh Domains on Microsoft Fabric</text>
  <g data-node-id="fabric-domain" role="group" tabindex="0" aria-label="Fabric domain (per business area)">
    <title data-node-tooltip="true">Fabric domain (per business area) — Groups a business domain&apos;s workspaces above workspace level for delegated governance.</title>
    <rect x="14.0" y="20.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="28" y="43" font-size="11" fill="#D9F5EE">Domain = group of workspaces · one tenant-wide OneLake · cross-domain sharing via shortcuts · central governance plane</text>
  </g>

  <!-- ═══ CENTRAL GOVERNANCE PLANE (top strip) ═══ -->
  <rect x="28" y="72" width="1104" height="70" rx="10" fill="#063D3B"/>
  <text x="46" y="96" font-size="12" font-weight="700" fill="#25FFD4">CENTRAL PLATFORM PLANE — Tenant scope (Fabric admins)</text>
  <g data-node-id="tenant-governance" role="group" tabindex="0" aria-label="Tenant Purview governance plane">
    <title data-node-tooltip="true">Tenant Purview governance plane — Labels, DLP, and auditing apply automatically across every domain, regardless of who reads the data.</title>
    <rect x="32.0" y="92.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="46" y="115" font-size="10" fill="#D9F5EE">Tenant settings &amp; global defaults · built-in Purview governance · sensitivity labels / DLP · compliance certs</text>
  </g>
  <g data-node-id="producer-workspace" role="group" tabindex="0" aria-label="Producer workspace: certify gold product">
    <title data-node-tooltip="true">Producer workspace: certify gold product — A domain&apos;s curated workspace writes gold Delta tables and applies Certified endorsement.</title>
    <rect x="32.0" y="108.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="46" y="131" font-size="10" fill="#9AD2C5">OneLake Catalog (domain-filtered discovery) · Endorsement policy (Promoted self · Certified org) · metadata scanner APIs</text>
  </g>
  <text x="1116" y="131" text-anchor="end" font-size="9" fill="#6FBDAD">delegates selected settings to each domain ▼</text>

  <!-- delegation arrows into the three domains -->
  <line x1="230" y1="142" x2="230" y2="168" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="580" y1="142" x2="580" y2="168" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="930" y1="142" x2="930" y2="168" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ═══ DOMAIN A — Finance ═══ -->
  <rect x="28" y="170" width="352" height="270" rx="10" fill="#F7FAF9" stroke="#117865" stroke-width="1.6"/>
  <rect x="28" y="170" width="352" height="30" rx="10" fill="#117865"/>
  <text x="46" y="190" font-size="12" font-weight="700" fill="#FFFFFF">Domain: Finance</text>
  <text x="366" y="190" text-anchor="end" font-size="9" fill="#D9F5EE">domain admin · delegated settings</text>

  <!-- producer workspace -->
  <rect x="46" y="212" width="316" height="80" rx="7" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="60" y="231" font-size="11" font-weight="700" fill="#063D3B">Workspace · Finance-Curated</text>
  <text x="60" y="249" font-size="9.5" fill="#424242">Lakehouse / Warehouse items (Delta tables in OneLake)</text>
  <rect x="60" y="258" width="128" height="24" rx="4" fill="#063D3B"/>
  <text x="124" y="274" text-anchor="middle" font-size="9.5" font-weight="600" fill="#25FFD4">Data product ✓ Certified</text>
  <rect x="196" y="258" width="150" height="24" rx="4" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="271" y="274" text-anchor="middle" font-size="9.5" fill="#0B5E50">viewer role · RLS/CLS on SQL</text>

  <!-- dev workspace -->
  <rect x="46" y="300" width="316" height="56" rx="7" fill="#FFFFFF" stroke="#C8E8E0"/>
  <text x="60" y="319" font-size="11" font-weight="700" fill="#063D3B">Workspace · Finance-Dev</text>
  <text x="60" y="336" font-size="9.5" fill="#424242">Notebooks · pipelines · pre-publication work</text>
  <text x="60" y="350" font-size="9" fill="#8A8886">separate capacity stage recommended (Dev/Test/Prod split)</text>

  <!-- capacity chip -->
  <rect x="46" y="364" width="316" height="60" rx="7" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="60" y="383" font-size="10.5" font-weight="700" fill="#063D3B">Capacity: Finance (F-SKU)</text>
  <text x="60" y="399" font-size="9.5" fill="#424242">Dedicated CU pool · isolation boundary · own chargeback</text>
  <text x="60" y="414" font-size="9.5" fill="#424242">Throttled per-capacity — a Finance spike cannot starve HR</text>

  <!-- ═══ DOMAIN B — Sales ═══ -->
  <rect x="404" y="170" width="352" height="270" rx="10" fill="#F7FAF9" stroke="#117865" stroke-width="1.6"/>
  <rect x="404" y="170" width="352" height="30" rx="10" fill="#117865"/>
  <text x="422" y="190" font-size="12" font-weight="700" fill="#FFFFFF">Domain: Sales</text>
  <text x="742" y="190" text-anchor="end" font-size="9" fill="#D9F5EE">domain admin · subdomains allowed</text>

  <rect x="422" y="212" width="316" height="80" rx="7" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="436" y="231" font-size="11" font-weight="700" fill="#063D3B">Workspace · Sales-Curated</text>
  <text x="436" y="249" font-size="9.5" fill="#424242">Lakehouse items · gold Delta tables</text>
  <rect x="436" y="258" width="128" height="24" rx="4" fill="#117865"/>
  <text x="500" y="274" text-anchor="middle" font-size="9.5" font-weight="600" fill="#FFFFFF">Data product · Promoted</text>
  <rect x="572" y="258" width="150" height="24" rx="4" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="647" y="274" text-anchor="middle" font-size="9.5" fill="#0B5E50">consumes Finance product ↓</text>

  <rect x="422" y="300" width="316" height="56" rx="7" fill="#FFFFFF" stroke="#C8E8E0"/>
  <text x="436" y="319" font-size="11" font-weight="700" fill="#063D3B">Shortcut: /Sales-Curated/Tables/fin_rev</text>
  <text x="436" y="336" font-size="9.5" fill="#424242">Zero-copy reference → Finance-Curated (no ETL, no copy)</text>
  <text x="436" y="350" font-size="9" fill="#8A8886">read authorized with the calling user's own identity</text>

  <rect x="422" y="364" width="316" height="60" rx="7" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="436" y="383" font-size="10.5" font-weight="700" fill="#063D3B">Capacity: Sales (F-SKU)</text>
  <text x="436" y="399" font-size="9.5" fill="#424242">Independent CU pool · own cost attribution</text>
  <text x="436" y="414" font-size="9.5" fill="#424242">F64+ enables free-license report viewing for consumers</text>

  <!-- ═══ DOMAIN C — HR ═══ -->
  <rect x="780" y="170" width="352" height="270" rx="10" fill="#F7FAF9" stroke="#117865" stroke-width="1.6"/>
  <rect x="780" y="170" width="352" height="30" rx="10" fill="#117865"/>
  <text x="798" y="190" font-size="12" font-weight="700" fill="#FFFFFF">Domain: HR</text>
  <text x="1118" y="190" text-anchor="end" font-size="9" fill="#D9F5EE">domain admin · stricter labels</text>

  <rect x="798" y="212" width="316" height="80" rx="7" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="812" y="231" font-size="11" font-weight="700" fill="#063D3B">Workspace · HR-Curated</text>
  <text x="812" y="249" font-size="9.5" fill="#424242">Sensitive HR items · sensitivity labels applied</text>
  <rect x="812" y="258" width="150" height="24" rx="4" fill="#063D3B"/>
  <text x="887" y="274" text-anchor="middle" font-size="9.5" font-weight="600" fill="#25FFD4">Data product ✓ Certified</text>
  <rect x="970" y="258" width="128" height="24" rx="4" fill="#FFF1ED" stroke="#F0A080"/>
  <text x="1034" y="274" text-anchor="middle" font-size="9.5" fill="#5C1A00">DLP · restricted share</text>

  <rect x="798" y="300" width="316" height="56" rx="7" fill="#FFFFFF" stroke="#C8E8E0"/>
  <text x="812" y="319" font-size="11" font-weight="700" fill="#063D3B">Workspace · HR-Analytics</text>
  <text x="812" y="336" font-size="9.5" fill="#424242">Consumers with viewer role · Direct Lake reports</text>
  <text x="812" y="350" font-size="9" fill="#8A8886">labels persist across supported export paths</text>

  <rect x="798" y="364" width="316" height="60" rx="7" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="812" y="383" font-size="10.5" font-weight="700" fill="#063D3B">Capacity: HR (F-SKU)</text>
  <text x="812" y="399" font-size="9.5" fill="#424242">Isolated pool · sensitive-workload separation</text>
  <text x="812" y="414" font-size="9.5" fill="#424242">Compliance certs inherited from tenant scope</text>

  <!-- cross-domain shortcut arrow: Finance product -> Sales shortcut -->
  <path d="M124 282 C124 470 500 470 500 356" fill="none" stroke="#E8A020" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrO)"/>
  <rect x="250" y="452" width="180" height="22" rx="4" fill="#FFF8EC" stroke="#F0C070"/>
  <text x="340" y="467" text-anchor="middle" font-size="9" font-weight="600" fill="#5C3A00">OneLake shortcut (zero-copy)</text>

  <!-- ═══ SHARED ONELAKE (bottom band) ═══ -->
  <rect x="28" y="490" width="1104" height="150" rx="12" fill="url(#lakeGrad)" stroke="#117865" stroke-width="1.8"/>
  <g data-node-id="onelake-shared" role="group" tabindex="0" aria-label="OneLake (single tenant-wide lake)">
    <title data-node-tooltip="true">OneLake (single tenant-wide lake) — Exactly one OneLake per tenant; workspaces act as folders beneath it.</title>
    <rect x="32.0" y="491.5" width="420" height="34" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="46" y="516" font-size="13" font-weight="700" fill="#063D3B">ONE ONELAKE PER TENANT — single file-system namespace (workspaces surface as folders)</text>
  </g>
  <g data-node-id="separate-lakes-warning" role="group" tabindex="0" aria-label="Trap: a separate physical lake per domain">
    <title data-node-tooltip="true">Trap: a separate physical lake per domain — Standing up per-group physical data lakes is an explicit Fabric anti-pattern.</title>
    <rect x="32.0" y="512.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="46" y="535" font-size="10" fill="#3F6259">Every domain's Delta tables live once in the same lake · no per-domain physical lakes (that is the anti-pattern OneLake removes)</text>
  </g>

  <!-- workspace-as-folder chips -->
  <rect x="46" y="548" width="200" height="74" rx="7" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="146" y="568" text-anchor="middle" font-size="10" font-weight="700" fill="#063D3B">/Finance-Curated</text>
  <text x="146" y="585" text-anchor="middle" font-size="9" fill="#424242">Tables/ · Files/</text>
  <text x="146" y="601" text-anchor="middle" font-size="9" fill="#424242">Delta / Parquet (v-ordered)</text>
  <text x="146" y="616" text-anchor="middle" font-size="8.5" fill="#8A8886">billed to Finance capacity</text>

  <rect x="266" y="548" width="200" height="74" rx="7" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="366" y="568" text-anchor="middle" font-size="10" font-weight="700" fill="#063D3B">/Sales-Curated</text>
  <text x="366" y="585" text-anchor="middle" font-size="9" fill="#424242">Tables/ · Files/ + shortcut →fin_rev</text>
  <text x="366" y="601" text-anchor="middle" font-size="9" fill="#424242">reads Finance data in place</text>
  <text x="366" y="616" text-anchor="middle" font-size="8.5" fill="#8A8886">billed to Sales capacity</text>

  <rect x="486" y="548" width="200" height="74" rx="7" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="586" y="568" text-anchor="middle" font-size="10" font-weight="700" fill="#063D3B">/HR-Curated</text>
  <text x="586" y="585" text-anchor="middle" font-size="9" fill="#424242">Tables/ · Files/</text>
  <text x="586" y="601" text-anchor="middle" font-size="9" fill="#424242">customer-managed keys optional</text>
  <text x="586" y="616" text-anchor="middle" font-size="8.5" fill="#8A8886">billed to HR capacity</text>

  <!-- external shortcuts chip -->
  <rect x="706" y="548" width="200" height="74" rx="7" fill="#FFF8EC" stroke="#F0C070"/>
  <text x="806" y="568" text-anchor="middle" font-size="10" font-weight="700" fill="#5C3A00">External shortcuts</text>
  <text x="806" y="585" text-anchor="middle" font-size="9" fill="#424242">ADLS · Amazon S3 · GCS</text>
  <text x="806" y="601" text-anchor="middle" font-size="9" fill="#424242">zero-copy · cached to cut egress</text>
  <text x="806" y="616" text-anchor="middle" font-size="8.5" fill="#8A8886">connection-bound authorization</text>

  <!-- cross-tenant chip -->
  <rect x="926" y="548" width="188" height="74" rx="7" fill="#EAF7F2" stroke="#2AAC94"/>
  <text x="1020" y="568" text-anchor="middle" font-size="10" font-weight="700" fill="#063D3B">Cross-tenant share</text>
  <text x="1020" y="585" text-anchor="middle" font-size="9" fill="#424242">expose live governed data</text>
  <text x="1020" y="601" text-anchor="middle" font-size="9" fill="#424242">read in place · no copy</text>
  <text x="1020" y="616" text-anchor="middle" font-size="8.5" fill="#8A8886">source policies stay enforced</text>

  <!-- OneLake security note -->
  <rect x="28" y="654" width="1104" height="40" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="46" y="672" font-size="10" font-weight="600" fill="#063D3B">OneLake security spans the whole lake:</text>
  <g data-node-id="onelake-security-roles-warning" role="group" tabindex="0" aria-label="Trap: OneLake roles don&apos;t fence off Admins">
    <title data-node-tooltip="true">Trap: OneLake roles don&apos;t fence off Admins — Workspace Admin/Member/Contributor roles bypass OneLake security roles entirely.</title>
    <rect x="264.0" y="649.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="278" y="672" font-size="10" fill="#424242">control-plane vs data-plane permissions · Entra ID identity · Viewer cannot read data plane; Admin/Member/Contributor bypass OneLake security roles</text>
  </g>
  <g data-node-id="onelake-catalog" role="group" tabindex="0" aria-label="OneLake Catalog (discovery)">
    <title data-node-tooltip="true">OneLake Catalog (discovery) — Single searchable surface for every Fabric item a user can access, filterable by domain and tag.</title>
    <rect x="32.0" y="664.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="46" y="687" font-size="9.5" fill="#8A8886">Governance is hierarchical: tenant-level policies auto-cover any data landing in OneLake, while each workspace distributes its own ownership &amp; access.</text>
  </g>

  <!-- legend / inference note -->
  <rect x="28" y="706" width="1104" height="44" rx="8" fill="#FFFFFF" stroke="#E1DFDD"/>
  <text x="46" y="723" font-size="9.5" font-weight="600" fill="#063D3B">Fabric mechanics shown are claim-grounded.</text>
  <g data-node-id="domain-capacity" role="group" tabindex="0" aria-label="Per-domain capacity (cost &amp; blast-radius isolation)">
    <title data-node-tooltip="true">Per-domain capacity (cost &amp; blast-radius isolation) — Each domain runs on its own capacity, isolating cost and throttling from other domains.</title>
    <rect x="276.0" y="700.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="290" y="723" font-size="9.5" fill="#8A8886">"Domain ownership" and "data-as-a-product" are data-mesh framework concepts (inference), realized here by mapping each domain to a set of workspaces.</text>
  </g>
  <g data-node-id="consuming-domain-shortcut" role="group" tabindex="0" aria-label="Consuming domain: OneLake shortcut">
    <title data-node-tooltip="true">Consuming domain: OneLake shortcut — A second domain creates a zero-copy shortcut to the certified product instead of copying it.</title>
    <rect x="32.0" y="717.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="46" y="740" font-size="9" fill="#8A8886">Solid teal arrows = governance delegation · dashed orange arrow = OneLake shortcut (cross-domain, zero-copy).</text>
  </g>

  <text x="1132" y="770" text-anchor="end" font-size="9" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
