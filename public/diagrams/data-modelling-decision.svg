<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1180" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-labelledby="data-modelling-decision-title data-modelling-decision-desc" data-diagram-id="data-modelling-decision">
  <title id="data-modelling-decision-title">Which Model, Which Store, Which Storage Mode?</title>
  <desc id="data-modelling-decision-desc">A decision tree with three questions. The first asks what the model must optimise for: query simplicity for BI leads to a dimensional star schema; auditable history and many changing source systems leads to a data vault; a shared integration layer across domains leads to a canonical model. The second asks who consumes the physical layer: Spark and data engineering favour a Lakehouse over Delta tables, while T-SQL and multi-table transactions favour a Warehouse — both write Delta and both surface through a semantic model. The third asks how the semantic model should read the data, forking between Direct Lake, Import, and DirectQuery. A warning branch covers the Direct Lake trap in which basing a table on a SQL view silently forces every query into DirectQuery fallback.</desc>
  <defs>
    <linearGradient id="decHeader" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="0.52" stop-color="#0E7490"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <linearGradient id="decDirect" x1="0" x2="1"><stop stop-color="#E0E7FF"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient>
    <filter id="decShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="decArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#0F766E"/></marker>
    <marker id="decWarnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#D97706"/></marker>
    <style>
      .kicker{font-size:13px;font-weight:700;letter-spacing:2px}.h1{font-size:34px;font-weight:750}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.micro{font-size:11px}.navy{fill:#0F172A}.muted{fill:#475569}.teal{fill:#0F766E}.white{fill:#FFF}.evidence{font-size:11px;font-weight:700;fill:#0369A1}.flow{fill:none;stroke:#0F766E;stroke-width:3;marker-end:url(#decArrow)}.branch{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#decArrow)}
      [data-node-id]:focus{outline:none}[data-node-id]:focus>rect,[data-node-id]:focus>.focus-ring{stroke:#2563EB!important;stroke-width:4!important}
    </style>
  </defs>
  <rect width="1440" height="1180" fill="#F8FAFC"/>
  <rect width="1440" height="174" fill="url(#decHeader)"/><path d="M1080 0h360v174h-240z" fill="#FFF" opacity="0.05"/><circle cx="1340" cy="23" r="140" fill="#FFF" opacity="0.05"/>
  <text x="64" y="43" class="kicker" fill="#A5F3FC">FABRIC ATLAS · MODELLING DECISION MAP</text>
  <text x="64" y="86" class="h1 white">Three choices that shape every analytics model</text>
  <text x="64" y="120" font-size="17" fill="#D5FAF5">Technique → physical engine → semantic read mode. Decide in that order and record the reason.</text>
  <g transform="translate(64 140)"><rect width="278" height="25" rx="12" fill="#FFF" opacity="0.13"/><text x="16" y="17" class="small white">1 · Consumption and history</text></g><g transform="translate(356 140)"><rect width="265" height="25" rx="12" fill="#FFF" opacity="0.13"/><text x="16" y="17" class="small white">2 · Engine and transactions</text></g><g transform="translate(635 140)"><rect width="300" height="25" rx="12" fill="#FFF" opacity="0.13"/><text x="16" y="17" class="small white">3 · Freshness, scale, security</text></g>

  <g data-node-id="start-question" transform="translate(64 206)" tabindex="0" aria-label="What must the model optimise for?">
    <title data-node-tooltip="true">What must the model optimise for? — The root question: pick the modelling technique from the job the model has to do, not from habit.</title>
    <rect class="focus-ring" width="292" height="230" rx="24" fill="#FFF" stroke="#5EEAD4" stroke-width="2" filter="url(#decShadow)"/>
    <rect width="292" height="44" rx="24" fill="#0F766E"/><path d="M0 22h292v22H0z" fill="#0F766E"/><text x="22" y="29" class="small white" font-weight="700">GATE 1 · MODELLING TECHNIQUE</text>
    <circle cx="54" cy="91" r="28" fill="#CCFBF1"/><path d="M38 91h32M54 75v32" stroke="#0F766E" stroke-width="4"/><text x="96" y="84" class="h2 navy">What must this</text><text x="96" y="108" class="h2 navy">model optimise?</text>
    <text x="24" y="147" class="body muted"><tspan x="24">Start with the consumer and the</tspan><tspan x="24" dy="21">history requirement—not a template.</tspan></text>
    <rect x="24" y="188" width="244" height="25" rx="12" fill="#ECFDF5"/><text x="40" y="205" class="micro" fill="#047857">OUTPUT · technique + recorded rationale</text>
  </g>
  <path d="M356 287h58M385 287v-52h37M385 287v104h37" class="branch"/><text x="368" y="225" class="micro" fill="#1D4ED8">BI-first</text><text x="368" y="378" class="micro" fill="#6D28D9">audit-first</text>

  <g data-node-id="technique-dimensional" transform="translate(422 198)" tabindex="0" aria-label="Dimensional / star schema">
    <title data-node-tooltip="true">Dimensional / star schema — Facts at a declared grain plus conformed dimensions — the default when BI query simplicity is the goal.</title>
    <rect class="focus-ring" width="300" height="162" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="22" y="30" class="h3" fill="#1E40AF">Dimensional / star schema</text><text x="22" y="51" class="small muted">Best when query simplicity wins</text>
    <rect x="112" y="73" width="62" height="36" rx="6" fill="#2563EB"/><text x="143" y="95" text-anchor="middle" class="micro white">FACT</text><g fill="#BFDBFE" stroke="#2563EB"><rect x="24" y="79" width="54" height="26" rx="5"/><rect x="210" y="79" width="54" height="26" rx="5"/><rect x="116" y="124" width="54" height="24" rx="5"/></g><path d="M78 92h34M174 92h36M143 109v15" stroke="#2563EB" stroke-width="2"/>
    <circle cx="276" cy="24" r="14" fill="#FFF"/><text x="276" y="28" text-anchor="middle" class="evidence">S1</text>
  </g>
  <g data-node-id="technique-vault" transform="translate(422 376)" tabindex="0" aria-label="Data vault">
    <title data-node-tooltip="true">Data vault — Hubs, links, satellites — when auditable history across many volatile sources is the actual requirement.</title>
    <rect class="focus-ring" width="300" height="162" rx="20" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
    <text x="22" y="30" class="h3" fill="#6D28D9">Data vault</text><text x="22" y="51" class="small muted">Use only when auditability earns the cost</text>
    <circle cx="65" cy="102" r="27" fill="#7C3AED"/><text x="65" y="106" text-anchor="middle" class="micro white">HUB</text><path d="M92 102h44" stroke="#7C3AED" stroke-width="3"/><rect x="136" y="83" width="61" height="38" rx="7" fill="#DDD6FE" stroke="#7C3AED"/><text x="166" y="106" text-anchor="middle" class="micro" fill="#5B21B6">LINK</text><path d="M197 102h40" stroke="#7C3AED" stroke-width="3"/><rect x="237" y="85" width="44" height="34" rx="7" fill="#EDE9FE" stroke="#7C3AED"/><text x="259" y="106" text-anchor="middle" font-size="9" fill="#5B21B6">SAT</text>
    <circle cx="276" cy="24" r="14" fill="#FFF"/><text x="276" y="28" text-anchor="middle" class="evidence">P</text>
  </g>
  <g transform="translate(746 198)"><rect width="100" height="340" rx="20" fill="#E2E8F0"/><text x="50" y="36" text-anchor="middle" class="micro muted" font-weight="700">TRADE-OFF</text><path d="M50 66v232" stroke="#94A3B8" stroke-width="2"/><circle cx="50" cy="108" r="18" fill="#DBEAFE"/><text x="50" y="112" text-anchor="middle" class="small" fill="#1D4ED8">BI</text><circle cx="50" cy="253" r="18" fill="#EDE9FE"/><text x="50" y="257" text-anchor="middle" class="small" fill="#6D28D9">AUD</text><text x="50" y="325" text-anchor="middle" class="micro muted">Never report</text><text x="50" y="338" text-anchor="middle" class="micro muted">directly on vault</text></g>

  <path d="M846 368h38" class="flow"/>
  <g data-node-id="store-question" transform="translate(884 206)" tabindex="0" aria-label="Who consumes the physical layer?">
    <title data-node-tooltip="true">Who consumes the physical layer? — Second question: Lakehouse or Warehouse — decided by engine and skills, not by storage format.</title>
    <rect class="focus-ring" width="492" height="150" rx="22" fill="#FFF" stroke="#67E8F9" stroke-width="2" filter="url(#decShadow)"/>
    <rect width="492" height="38" rx="22" fill="#0E7490"/><path d="M0 19h492v19H0z" fill="#0E7490"/><text x="20" y="26" class="small white" font-weight="700">GATE 2 · PHYSICAL ENGINE</text>
    <text x="22" y="75" class="h2 navy">Who owns transformations and writes?</text><text x="22" y="100" class="body muted">Both stores use Delta. Decide by Spark vs T-SQL and</text><text x="22" y="121" class="body muted">whether a load must commit across multiple tables.</text><rect x="337" y="103" width="132" height="25" rx="12" fill="#ECFEFF"/><text x="350" y="120" class="micro" fill="#0E7490">SAME OPEN FORMAT</text>
  </g>
  <path d="M1128 356v29M1128 385H999v25M1128 385h129v25" fill="none" stroke="#0F766E" stroke-width="3"/><text x="940" y="397" class="micro teal">Spark / notebooks</text><text x="1190" y="397" class="micro teal">T-SQL / transactions</text>

  <g data-node-id="store-lakehouse" transform="translate(884 410)" tabindex="0" aria-label="Lakehouse (Spark over Delta)">
    <title data-node-tooltip="true">Lakehouse (Spark over Delta) — Managed Delta tables queried by Spark and T-SQL, with no movement between the two.</title>
    <rect class="focus-ring" width="232" height="174" rx="20" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/>
    <g transform="translate(18 23)"><path d="M0 30L25 7l25 23v37H0z" fill="#CFFAFE" stroke="#0891B2" stroke-width="4"/><path d="M0 52c12 7 38 7 50 0v17c-12 7-38 7-50 0z" fill="#06B6D4"/></g>
    <text x="82" y="39" class="h3" fill="#155E75">Lakehouse</text><text x="82" y="60" class="small muted">Spark over managed Delta</text><path d="M18 91h196" stroke="#A5F3FC"/><text x="18" y="116" class="small navy">✓ structured + files</text><text x="18" y="137" class="small navy">✓ SQL reads same copy</text><text x="18" y="158" class="micro muted">Watch: SQL endpoint is read-oriented</text><circle cx="208" cy="22" r="14" fill="#FFF"/><text x="208" y="26" text-anchor="middle" class="evidence">S2</text>
  </g>
  <g data-node-id="store-warehouse" transform="translate(1144 410)" tabindex="0" aria-label="Warehouse (T-SQL, multi-table ACID)">
    <title data-node-tooltip="true">Warehouse (T-SQL, multi-table ACID) — Full T-SQL surface with multi-table transactions — still Delta underneath, still open in OneLake.</title>
    <rect class="focus-ring" width="232" height="174" rx="20" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
    <g transform="translate(18 22)" fill="#D1FAE5" stroke="#059669" stroke-width="3"><path d="M2 25L27 7l25 18v44H2z"/><path d="M0 69h55"/><path d="M14 34h8v8h-8zm20 0h8v8h-8zM14 50h8v8h-8zm20 0h8v8h-8z" fill="#059669" stroke="none"/></g>
    <text x="82" y="39" class="h3" fill="#065F46">Warehouse</text><text x="82" y="60" class="small muted">T-SQL over open Delta</text><path d="M18 91h196" stroke="#A7F3D0"/><text x="18" y="116" class="small navy">✓ multi-table ACID</text><text x="18" y="137" class="small navy">✓ procedures + materialized views</text><text x="18" y="158" class="micro muted">Watch: autonomous engine tuning</text><circle cx="208" cy="22" r="14" fill="#FFF"/><text x="208" y="26" text-anchor="middle" class="evidence">S3</text>
  </g>

  <path d="M1128 584v45" class="flow"/>
  <g data-node-id="storage-mode-question" transform="translate(64 630)" tabindex="0" aria-label="How should the semantic model read it?">
    <title data-node-tooltip="true">How should the semantic model read it? — Third question: Direct Lake, Import, or DirectQuery — the mode determines refresh cost and freshness.</title>
    <rect class="focus-ring" width="1312" height="284" rx="24" fill="#FFF" stroke="#818CF8" stroke-width="2" filter="url(#decShadow)"/>
    <rect width="1312" height="44" rx="24" fill="#4338CA"/><path d="M0 22h1312v22H0z" fill="#4338CA"/><text x="22" y="29" class="small white" font-weight="700">GATE 3 · SEMANTIC STORAGE MODE — DECIDE PER TABLE, NOT BY HABIT</text>
    <g transform="translate(24 68)"><rect width="382" height="174" rx="18" fill="url(#decDirect)" stroke="#6366F1" stroke-width="2"/><path d="M28 75a31 31 0 1162 0" fill="none" stroke="#4F46E5" stroke-width="7"/><path d="M59 75l20-24" stroke="#4F46E5" stroke-width="5" stroke-linecap="round"/><circle cx="59" cy="75" r="6" fill="#4F46E5"/><text x="112" y="35" class="h3" fill="#3730A3">Direct Lake</text><text x="112" y="57" class="small muted">Delta columns read from OneLake</text><text x="112" y="82" class="small navy">Best fit: large facts + freshness</text><text x="24" y="122" class="small" fill="#3730A3">No scheduled import refresh</text><text x="24" y="145" class="micro muted">On OneLake for richer modelling;</text><text x="24" y="160" class="micro muted">on SQL only for its security/fallback needs.</text></g>
    <g transform="translate(430 68)"><rect width="382" height="174" rx="18" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/><g transform="translate(24 25)" fill="#6EE7B7"><ellipse cx="35" cy="8" rx="35" ry="8"/><path d="M0 8v42c0 5 16 9 35 9s35-4 35-9V8c-8 5-62 5-70 0z"/></g><text x="112" y="35" class="h3" fill="#065F46">Import</text><text x="112" y="57" class="small muted">Copy into semantic-model memory</text><text x="112" y="82" class="small navy">Best fit: compact + transformed tables</text><text x="24" y="122" class="small" fill="#065F46">Full modelling flexibility</text><text x="24" y="145" class="micro muted">Operate refresh windows and monitor</text><text x="24" y="160" class="micro muted">staleness when refresh fails.</text></g>
    <g transform="translate(836 68)"><rect width="452" height="174" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><path d="M26 42h52M52 20v44" stroke="#EA580C" stroke-width="5"/><circle cx="52" cy="42" r="28" fill="none" stroke="#EA580C" stroke-width="4"/><text x="108" y="35" class="h3" fill="#9A3412">DirectQuery / composite</text><text x="108" y="57" class="small muted">Forward queries or mix modes by table</text><text x="108" y="82" class="small navy">Best fit: source authority / exceptions</text><text x="24" y="122" class="small" fill="#9A3412">Expect source latency per query</text><text x="24" y="145" class="micro muted">Composite option: Direct Lake fact +</text><text x="24" y="160" class="micro muted">Import dimensions where justified.</text></g>
    <circle cx="1286" cy="22" r="15" fill="#FFF"/><text x="1286" y="26" text-anchor="middle" class="evidence">S4</text>
  </g>

  <path d="M1130 914v34" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#decWarnArrow)"/><text x="930" y="939" class="micro" fill="#B45309">if Direct Lake on SQL points at a view</text>
  <g data-node-id="warning-fallback-trap" transform="translate(764 948)" tabindex="0" aria-label="Trap: SQL views force DirectQuery fallback">
    <title data-node-tooltip="true">Trap: SQL views force DirectQuery fallback — In Direct Lake on SQL, a table based on a SQL view sends every query into DirectQuery fallback.</title>
    <rect class="focus-ring" width="612" height="134" rx="22" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
    <path d="M28 99L65 30l37 69z" fill="#F59E0B"/><path d="M65 52v25M65 87v3" stroke="#FFF" stroke-width="7" stroke-linecap="round"/>
    <text x="126" y="38" class="h2" fill="#9A3412">Silent fallback trap</text><text x="126" y="65" class="body" fill="#7C2D12">SQL view → DirectQuery fallback → avoidable latency</text><text x="126" y="92" class="small muted">Materialise the transformation upstream and point the model at a base table.</text>
    <rect x="470" y="25" width="112" height="24" rx="12" fill="#FFEDD5"/><text x="488" y="42" class="micro" fill="#9A3412" font-weight="700">EVIDENCE · S4</text>
  </g>

  <g transform="translate(64 948)"><rect width="668" height="134" rx="22" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="24" y="31" class="h3 navy">Operational hand-off</text>
    <g transform="translate(24 49)"><circle cx="14" cy="14" r="14" fill="#CCFBF1"/><text x="14" y="18" text-anchor="middle" class="small teal" font-weight="700">1</text><text x="38" y="18" class="small navy">Record why each branch won.</text></g>
    <g transform="translate(244 49)"><circle cx="14" cy="14" r="14" fill="#DBEAFE"/><text x="14" y="18" text-anchor="middle" class="small" fill="#1D4ED8" font-weight="700">2</text><text x="38" y="18" class="small navy">Test grain, keys, relationships.</text></g>
    <g transform="translate(24 87)"><circle cx="14" cy="14" r="14" fill="#EDE9FE"/><text x="14" y="18" text-anchor="middle" class="small" fill="#6D28D9" font-weight="700">3</text><text x="38" y="18" class="small navy">Benchmark with representative queries.</text></g>
    <g transform="translate(328 87)"><circle cx="14" cy="14" r="14" fill="#FFEDD5"/><text x="14" y="18" text-anchor="middle" class="small" fill="#C2410C" font-weight="700">4</text><text x="38" y="18" class="small navy">Revisit when workload facts change.</text></g>
  </g>
  <g transform="translate(64 1105)"><rect width="1312" height="46" rx="14" fill="#E2E8F0"/><text x="22" y="28" class="small" fill="#334155" font-weight="700">DECISION RULE</text><text x="140" y="28" class="small muted">Technique follows the outcome · physical store follows the write engine · semantic mode follows freshness, scale, security, and feature needs.</text></g>
  <text x="1376" y="1171" text-anchor="end" class="micro" fill="#64748B">Fabric Atlas original · product-neutral vector illustration</text>
</svg>
