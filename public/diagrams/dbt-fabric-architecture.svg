<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="dbt-fabric-architecture-title dbt-fabric-architecture-desc" data-diagram-id="dbt-fabric-architecture">
  <title id="dbt-fabric-architecture-title">How a dbt Project Reaches Fabric Data Warehouse</title>
  <desc id="dbt-fabric-architecture-desc">An architecture flow with seven steps. A dbt project&apos;s profiles.yml declares Fabric as its target via the dbt-fabric adapter, which authenticates with Microsoft Entra ID — interactively for development, via service principal for automation. The adapter translates dbt&apos;s usual ALTER/MERGE/TRUNCATE-style operations into CREATE TABLE AS SELECT plus DROP/CREATE sequences because Fabric&apos;s T-SQL surface doesn&apos;t support the same commands SQL Server does. Running debug, seed, run, and test against the jaffle_shop sample project validates the connection end to end. Production scheduling is handled outside dbt itself, by pairing dbt with Apache Airflow inside Fabric Data Factory. A warning node flags that this is a third-party adapter, not a native Fabric feature, so its translation gaps are the adapter&apos;s problem to work around, not Fabric&apos;s to fix.</desc>
  <defs>
    <linearGradient id="devGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6b7c"/>
      <stop offset="100%" stop-color="#3f4c5a"/>
    </linearGradient>
    <linearGradient id="adapterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#e35d1f"/>
    </linearGradient>
    <linearGradient id="authGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4dd6"/>
      <stop offset="100%" stop-color="#4e34a8"/>
    </linearGradient>
    <linearGradient id="dwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f8f6b"/>
      <stop offset="100%" stop-color="#0b6e52"/>
    </linearGradient>
    <linearGradient id="orchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f8fd6"/>
      <stop offset="100%" stop-color="#1568a3"/>
    </linearGradient>
    <filter id="soft" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2330" flood-opacity="0.22"/>
    </filter>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#e35d1f"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#4e34a8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#0b6e52"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#1568a3"/>
    </marker>
    <marker id="arrowGrey" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#6b7480"/>
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="1100" height="58" fill="#1b2430"/>
  <text x="30" y="35" font-size="20" font-weight="700" fill="#ffffff">dbt on Microsoft Fabric — Architecture &amp; Data Path</text>
  <text x="1070" y="35" font-size="11.5" fill="#b9c3cf" text-anchor="end">dbt-fabric adapter (community/Microsoft OSS) · Fabric Data Warehouse</text>

  <!-- ============ LANE 1: DEV / CLI ============ -->
  <text x="30" y="88" font-size="12.5" font-weight="700" fill="#3f4c5a" letter-spacing="0.4">1 · DBT PROJECT (LOCAL / CI, OUTSIDE FABRIC)</text>
  <rect x="24" y="98" width="290" height="230" rx="14" fill="#f4f6f8" stroke="#c7cfd7" stroke-width="1.5"/>

  <rect x="44" y="116" width="250" height="42" rx="8" fill="url(#devGrad)" filter="url(#soft)"/>
  <text x="169" y="141" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">dbt project (models/, tests/, seeds/)</text>

  <rect x="44" y="168" width="115" height="52" rx="8" fill="#e8edf1" stroke="#aab6c1" stroke-width="1.2"/>
  <text x="101" y="188" font-size="10.8" fill="#2e3a45" text-anchor="middle" font-weight="700">models</text>
  <text x="101" y="201" font-size="9.6" fill="#5b6b7c" text-anchor="middle">SELECT + ref()</text>
  <text x="101" y="212" font-size="9.6" fill="#5b6b7c" text-anchor="middle">materializations</text>

  <rect x="169" y="168" width="115" height="52" rx="8" fill="#e8edf1" stroke="#aab6c1" stroke-width="1.2"/>
  <text x="226" y="188" font-size="10.8" fill="#2e3a45" text-anchor="middle" font-weight="700">tests + seeds</text>
  <text x="226" y="201" font-size="9.6" fill="#5b6b7c" text-anchor="middle">schema/data tests</text>
  <text x="226" y="212" font-size="9.6" fill="#5b6b7c" text-anchor="middle">CSV seed loads</text>

  <rect x="44" y="230" width="240" height="46" rx="8" fill="#fff" stroke="#c7cfd7" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="164" y="249" font-size="10.8" fill="#2e3a45" text-anchor="middle" font-weight="700">profiles.yml  output block</text>
  <text x="164" y="263" font-size="9.4" fill="#5b6b7c" text-anchor="middle">type: fabric · host · db/schema · driver · auth</text>

  <text x="169" y="304" font-size="9.6" fill="#7a8794" text-anchor="middle" font-style="italic">Switch platforms = change `type:` in profiles.yml</text>
  <text x="169" y="317" font-size="9.6" fill="#7a8794" text-anchor="middle" font-style="italic">— no model rewrite required</text>

  <!-- ============ LANE 2: ADAPTER ============ -->
  <text x="360" y="88" font-size="12.5" font-weight="700" fill="#e35d1f" letter-spacing="0.4">2 · DBT-FABRIC ADAPTER (PYPI, PYTHON)</text>
  <rect x="354" y="98" width="270" height="230" rx="14" fill="#fff4ec" stroke="#f0b184" stroke-width="1.5"/>

  <rect x="372" y="116" width="234" height="42" rx="8" fill="url(#adapterGrad)" filter="url(#soft)"/>
  <text x="489" y="141" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">pip install dbt-fabric</text>

  <rect x="372" y="168" width="234" height="60" rx="8" fill="#fff" stroke="#f0b184" stroke-width="1.2"/>
  <text x="489" y="186" font-size="10.6" fill="#8a3d10" text-anchor="middle" font-weight="700">Requires</text>
  <text x="489" y="200" font-size="9.6" fill="#6b4126" text-anchor="middle">Python 3.7+ · Microsoft ODBC Driver for SQL Server</text>
  <text x="489" y="213" font-size="9.6" fill="#6b4126" text-anchor="middle">SQL analytics endpoint connection string</text>

  <rect x="372" y="238" width="234" height="70" rx="8" fill="#fff" stroke="#f0b184" stroke-width="1.2"/>
  <text x="489" y="256" font-size="10.6" fill="#8a3d10" text-anchor="middle" font-weight="700">Translates unsupported T-SQL to CTAS</text>
  <text x="489" y="270" font-size="9.4" fill="#6b4126" text-anchor="middle">ALTER TABLE ADD/ALTER/DROP COLUMN,</text>
  <text x="489" y="282" font-size="9.4" fill="#6b4126" text-anchor="middle">MERGE, TRUNCATE, sp_rename →</text>
  <text x="489" y="296" font-size="9.4" fill="#6b4126" text-anchor="middle" font-weight="700">CREATE TABLE AS SELECT + DROP/CREATE</text>

  <text x="489" y="322" font-size="9.4" fill="#a3623a" text-anchor="middle" font-style="italic">Maintained OSS (microsoft org) — issues filed on GitHub</text>

  <!-- ============ LANE 3: AUTH ============ -->
  <text x="656" y="88" font-size="12.5" font-weight="700" fill="#4e34a8" letter-spacing="0.4">3 · MICROSOFT ENTRA ID AUTH</text>
  <rect x="650" y="98" width="200" height="230" rx="14" fill="#f2effc" stroke="#c3b5ee" stroke-width="1.5"/>

  <rect x="666" y="116" width="168" height="90" rx="8" fill="url(#authGrad)" filter="url(#soft)"/>
  <text x="750" y="138" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">Interactive CLI</text>
  <text x="750" y="154" font-size="9.6" fill="#e3dbfb" text-anchor="middle">az login</text>
  <text x="750" y="170" font-size="9.4" fill="#e3dbfb" text-anchor="middle">recommended for</text>
  <text x="750" y="183" font-size="9.4" fill="#e3dbfb" text-anchor="middle">day-to-day development</text>

  <rect x="666" y="216" width="168" height="90" rx="8" fill="#fff" stroke="#c3b5ee" stroke-width="1.3"/>
  <text x="750" y="238" font-size="11" fill="#3a2570" text-anchor="middle" font-weight="700">Service Principal</text>
  <text x="750" y="254" font-size="9.6" fill="#5a4590" text-anchor="middle">client id/secret</text>
  <text x="750" y="270" font-size="9.4" fill="#5a4590" text-anchor="middle">recommended for</text>
  <text x="750" y="283" font-size="9.4" fill="#5a4590" text-anchor="middle">unattended / production runs</text>

  <!-- ============ LANE 4: FABRIC DW ============ -->
  <text x="884" y="88" font-size="12.5" font-weight="700" fill="#0b6e52" letter-spacing="0.4">4 · FABRIC DATA WAREHOUSE</text>
  <rect x="876" y="98" width="200" height="230" rx="14" fill="#eaf7f1" stroke="#9adcbd" stroke-width="1.5"/>

  <rect x="892" y="116" width="168" height="52" rx="8" fill="url(#dwGrad)" filter="url(#soft)"/>
  <text x="976" y="138" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">SQL analytics endpoint</text>
  <text x="976" y="154" font-size="9.4" fill="#d5f2e5" text-anchor="middle">T-SQL surface</text>

  <rect x="892" y="176" width="168" height="70" rx="8" fill="#fff" stroke="#9adcbd" stroke-width="1.2"/>
  <text x="976" y="195" font-size="10.4" fill="#0b6e52" text-anchor="middle" font-weight="700">CTAS-based materializations</text>
  <text x="976" y="209" font-size="9.2" fill="#25563f" text-anchor="middle">table / view / incremental</text>
  <text x="976" y="221" font-size="9.2" fill="#25563f" text-anchor="middle">executed as dbt models run</text>
  <text x="976" y="233" font-size="9.2" fill="#25563f" text-anchor="middle">against Warehouse tables</text>

  <rect x="892" y="254" width="168" height="54" rx="8" fill="#fff" stroke="#9adcbd" stroke-width="1.2"/>
  <text x="976" y="272" font-size="9.6" fill="#0b6e52" text-anchor="middle" font-weight="700">Same platform-wide T-SQL</text>
  <text x="976" y="285" font-size="9.2" fill="#25563f" text-anchor="middle">limits &amp; unsupported data</text>
  <text x="976" y="297" font-size="9.2" fill="#25563f" text-anchor="middle">types apply — not dbt-specific</text>

  <!-- Connecting arrows across lanes -->
  <path d="M314 213 L354 213" stroke="#e35d1f" stroke-width="2.6" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M624 213 L650 213" stroke="#4e34a8" stroke-width="2.6" fill="none" marker-end="url(#arrowPurple)"/>
  <path d="M850 213 L876 213" stroke="#0b6e52" stroke-width="2.6" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- ============ ZONE: dbt run/test cycle ============ -->
  <text x="30" y="360" font-size="12.5" font-weight="700" fill="#3f4c5a" letter-spacing="0.4">STANDARD VALIDATION CYCLE (RUN FROM CLI / CI)</text>
  <rect x="24" y="370" width="1052" height="78" rx="12" fill="#f4f6f8" stroke="#c7cfd7" stroke-width="1.5"/>

  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="44" y="386" width="228" height="46" rx="8" fill="#5b6b7c"/>
    <text x="158" y="405">dbt debug</text>
    <text x="158" y="420" font-size="9.4" font-weight="400" fill="#e4e8ec">test connectivity to Warehouse</text>

    <rect x="292" y="386" width="228" height="46" rx="8" fill="#6d4dd6"/>
    <text x="406" y="405">dbt seed</text>
    <text x="406" y="420" font-size="9.4" font-weight="400" fill="#eee9fb">load sample/seed CSV data</text>

    <rect x="540" y="386" width="228" height="46" rx="8" fill="#e35d1f"/>
    <text x="654" y="405">dbt run</text>
    <text x="654" y="420" font-size="9.4" font-weight="400" fill="#ffe8db">execute models via CTAS</text>

    <rect x="788" y="386" width="228" height="46" rx="8" fill="#0f8f6b"/>
    <text x="902" y="405">dbt test</text>
    <text x="902" y="420" font-size="9.4" font-weight="400" fill="#d5f2e5">validate data against tests</text>
  </g>
  <path d="M272 409 L292 409" stroke="#8a97a4" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <path d="M520 409 L540 409" stroke="#8a97a4" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <path d="M768 409 L788 409" stroke="#8a97a4" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <text x="1050" y="452" font-size="9.2" fill="#7a8794" text-anchor="end" font-style="italic">demonstrated end-to-end with the open-source jaffle_shop project</text>

  <!-- ============ ZONE: Orchestration ============ -->
  <text x="30" y="492" font-size="12.5" font-weight="700" fill="#1568a3" letter-spacing="0.4">5 · PRODUCTION ORCHESTRATION — FABRIC DATA FACTORY</text>
  <rect x="24" y="502" width="1052" height="140" rx="14" fill="#eaf4fb" stroke="#a8cfe8" stroke-width="1.5"/>

  <rect x="46" y="524" width="230" height="96" rx="10" fill="#fff" stroke="#a8cfe8" stroke-width="1.3"/>
  <text x="161" y="546" font-size="11" fill="#154a70" text-anchor="middle" font-weight="700">Fabric Data Factory</text>
  <text x="161" y="562" font-size="9.6" fill="#2c6390" text-anchor="middle">hosts an Apache Airflow job</text>
  <text x="161" y="576" font-size="9.6" fill="#2c6390" text-anchor="middle">(managed Airflow environment)</text>
  <text x="161" y="600" font-size="9.2" fill="#5a7c96" text-anchor="middle" font-style="italic">not a native dbt scheduler</text>

  <path d="M276 572 L320 572" stroke="#1568a3" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>

  <rect x="320" y="524" width="260" height="96" rx="10" fill="url(#orchGrad)" filter="url(#soft)"/>
  <text x="450" y="548" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Airflow DAG</text>
  <text x="450" y="566" font-size="9.6" fill="#dceefb" text-anchor="middle">DAG-based scheduling +</text>
  <text x="450" y="580" font-size="9.6" fill="#dceefb" text-anchor="middle">task orchestration</text>
  <text x="450" y="600" font-size="9.4" fill="#dceefb" text-anchor="middle">triggers dbt run on a recurring basis</text>

  <path d="M580 572 L624 572" stroke="#1568a3" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>

  <rect x="624" y="524" width="200" height="96" rx="10" fill="#fff" stroke="#a8cfe8" stroke-width="1.3"/>
  <text x="724" y="550" font-size="11" fill="#154a70" text-anchor="middle" font-weight="700">dbt CLI invocation</text>
  <text x="724" y="568" font-size="9.6" fill="#2c6390" text-anchor="middle">runs inside the DAG task</text>
  <text x="724" y="584" font-size="9.6" fill="#2c6390" text-anchor="middle">using service-principal auth</text>
  <text x="724" y="600" font-size="9.4" fill="#5a7c96" text-anchor="middle" font-style="italic">unattended production mode</text>

  <path d="M824 572 L860 572" stroke="#1568a3" stroke-width="2.6" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M900 605 Q 976 640 976 572" stroke="#1568a3" stroke-width="2" fill="none" stroke-dasharray="3 3"/>

  <rect x="860" y="524" width="196" height="96" rx="10" fill="#fff" stroke="#a8cfe8" stroke-width="1.3"/>
  <text x="958" y="550" font-size="11" fill="#154a70" text-anchor="middle" font-weight="700">Fabric Data Warehouse</text>
  <text x="958" y="568" font-size="9.6" fill="#2c6390" text-anchor="middle">receives scheduled</text>
  <text x="958" y="584" font-size="9.6" fill="#2c6390" text-anchor="middle">CTAS-based model runs</text>
  <text x="958" y="600" font-size="9.4" fill="#5a7c96" text-anchor="middle" font-style="italic">same target as lane 4</text>

  <!-- Legend -->
  <text x="30" y="672" font-size="11.5" font-weight="700" fill="#3f4c5a">LEGEND</text>
  <g font-size="10" fill="#3f4c5a">
    <rect x="30" y="682" width="14" height="14" rx="3" fill="url(#devGrad)"/>
    <text x="50" y="693">dbt project (local/CI)</text>
    <rect x="220" y="682" width="14" height="14" rx="3" fill="url(#adapterGrad)"/>
    <text x="240" y="693">dbt-fabric adapter (PyPI)</text>
    <rect x="440" y="682" width="14" height="14" rx="3" fill="url(#authGrad)"/>
    <text x="460" y="693">Entra ID authentication</text>
    <rect x="640" y="682" width="14" height="14" rx="3" fill="url(#dwGrad)"/>
    <text x="660" y="693">Fabric Data Warehouse (T-SQL)</text>
    <rect x="880" y="682" width="14" height="14" rx="3" fill="url(#orchGrad)"/>
    <text x="900" y="693">Airflow orchestration</text>
  </g>
  <text x="30" y="722" font-size="10" fill="#7a8794">Grounded in: content/sources/dbt-fabric-warehouse.json — dbt-fabric adapter, profiles.yml, Entra ID auth modes, CTAS translation of T-SQL, Airflow/Data Factory orchestration.</text>
  <text x="30" y="738" font-size="10" fill="#9aa4ae" font-style="italic">Original diagram — Fabric Atlas. Not affiliated with or copied from Microsoft or dbt Labs documentation imagery.</text>

  <!-- Full-region keyboard and pointer targets; metadata comes from the evidence sidecar. -->
  <g data-node-id="dbt-project" role="group" tabindex="0" aria-label="dbt project (local/CI)">
    <title data-node-tooltip="true">dbt project (local/CI) — A standard dbt project authored and run from outside Fabric, via VS Code/CLI.</title>
    <rect x="44.0" y="116.0" width="250.0" height="42.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="dbt-fabric-adapter" role="group" tabindex="0" aria-label="dbt-fabric adapter (PyPI)">
    <title data-node-tooltip="true">dbt-fabric adapter (PyPI) — A third-party Python package that lets dbt target Fabric Warehouse via profiles.yml.</title>
    <rect x="372.0" y="116.0" width="234.0" height="42.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="entra-id-auth" role="group" tabindex="0" aria-label="Microsoft Entra ID authentication">
    <title data-node-tooltip="true">Microsoft Entra ID authentication — Interactive az login for development, service principal for automated runs.</title>
    <rect x="666.0" y="116.0" width="168.0" height="90.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="ctas-translation" role="group" tabindex="0" aria-label="CTAS-based T-SQL translation">
    <title data-node-tooltip="true">CTAS-based T-SQL translation — The adapter rewrites ALTER/MERGE/TRUNCATE-style operations as CTAS plus DROP/CREATE.</title>
    <rect x="372.0" y="238.0" width="234.0" height="70.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="debug-seed-run-test" role="group" tabindex="0" aria-label="debug / seed / run / test cycle">
    <title data-node-tooltip="true">debug / seed / run / test cycle — The standard dbt validation workflow, demonstrated against the jaffle_shop sample project.</title>
    <rect x="44.0" y="386.0" width="972.0" height="46.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="airflow-orchestration" role="group" tabindex="0" aria-label="Airflow orchestration in Data Factory">
    <title data-node-tooltip="true">Airflow orchestration in Data Factory — Scheduled dbt runs are operationalized via Apache Airflow inside Fabric Data Factory, not a native dbt scheduler.</title>
    <rect x="320.0" y="524.0" width="260.0" height="96.0" rx="10.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="third-party-adapter-warning" role="group" tabindex="0" aria-label="Third-party adapter, not a Fabric feature">
    <title data-node-tooltip="true">Third-party adapter, not a Fabric feature — dbt-fabric is a Microsoft-org open-source project; adapter issues go to its GitHub repo, not Fabric support.</title>
    <rect x="372.0" y="312.0" width="234.0" height="18.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
</svg>
