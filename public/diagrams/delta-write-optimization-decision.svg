<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="delta-write-optimization-decision-title delta-write-optimization-decision-desc" data-diagram-id="delta-write-optimization-decision">
  <title id="delta-write-optimization-decision-title">Delta Write Optimization Decision Guide</title>
  <desc id="delta-write-optimization-decision-desc">Decision matrix routing Delta table symptoms to V-Order, Optimized Write, deletion vectors, or compaction, backed by engine compatibility gates and continuous lifecycle measurement.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="dwod-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dwod-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="dwod-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="dwod-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="dwod-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>

    <!-- Official Microsoft Lakehouse Icon Gradients -->
    <linearGradient id="dwod-icon-a" x1="3.25" x2="19.75" y1="4.5" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="dwod-icon-b" x1="16.5" x2="28.5" y1="6" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="960" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#dwod-head)"/>
  <g data-official-icon="microsoft" data-icon-name="lakehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#dwod-icon-a)" d="M4 16.5L16 4l12 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 27.5z"/>
      <path fill="url(#dwod-icon-b)" d="M16 11l9 9.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 27.5v-7z"/>
      <path fill="#FFFFFF" opacity="0.8" d="M12 18h8v2h-8zm0 4h8v2h-8z"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Delta Write Optimization Decision Matrix</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Symptom Diagnostic ➔ 4 Optimization Levers ➔ Engine Compatibility Gate ➔ Lifecycle Measurement</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Symptom Classification &amp; Write Levers</text>
    <circle cx="340" cy="15" r="5" fill="#D97706"/><text x="352" y="19" fill="#92400E" font-weight="600">Compatibility Verification Gate</text>
    <circle cx="680" cy="15" r="5" fill="#2563EB"/><text x="692" y="19" fill="#1E3A8A" font-weight="600">Continuous Measurement Lifecycle</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Atlas Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: SYMPTOM OBSERVATION ROOT (STEP-1)                                 -->
  <!-- ========================================================================= -->
  <g data-node-id="step-1" role="group" tabindex="0" aria-label="Observe the table symptom">
    <title data-node-tooltip="true">Observe the table symptom — File count, scan behavior, update pattern, and consumer engines identify the real Delta problem.</title>
    <rect x="40" y="146" width="1120" height="116" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4" filter="url(#dwod-shadow)"/>
    <rect x="56" y="156" width="170" height="18" rx="9" fill="#CCFBF1"/><text x="141" y="169" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">DIAGNOSTIC TRIAGE</text>
    <text x="56" y="198" font-size="14" font-weight="700" fill="#134E4A">1 · Observe Physical Symptoms from Table History &amp; Execution Plans</text>
    <text x="56" y="220" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Analytical Scans Bottlenecked?</tspan> BI reports experience slow Parquet decompression ➔ Choose <tspan font-weight="700">V-Order</tspan></text>
    <text x="56" y="238" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Streaming Generating Thousands of Small Files?</tspan> Executor scatter creates micro-files ➔ Choose <tspan font-weight="700">Optimized Write</tspan></text>
    <text x="56" y="254" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Row Mutations Rewriting Whole Files?</tspan> Frequent UPDATE/DELETE/MERGE ➔ Choose <tspan font-weight="700">Deletion Vectors</tspan></text>
    <rect x="1080" y="156" width="52" height="16" rx="8" fill="#CCFBF1"/><text x="1106" y="168" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: FOUR OPTIMIZATION LEVERS (STEP-2, STEP-3, STEP-4, STEP-5)         -->
  <!-- ========================================================================= -->
  <rect x="40" y="278" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="288" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="302" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: FOUR TARGETED OPTIMIZATION PATHS</text>

  <!-- Node 2: step-2 -->
  <g data-node-id="step-2" role="group" tabindex="0" aria-label="Read layout is inefficient?">
    <title data-node-tooltip="true">Read layout is inefficient? — V-Order optimizes Parquet organization for analytical reads in Fabric.</title>
    <rect x="56" y="316" width="260" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#dwod-shadow)"/>
    <rect x="68" y="326" width="120" height="16" rx="8" fill="#DBEAFE"/><text x="128" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">READ LAYOUT</text>
    <text x="68" y="360" font-size="12.5" font-weight="700" fill="#1E3A8A">2 · Enable V-Order</text>
    <text x="68" y="382" font-size="9.5" fill="#1E40AF">• Reorders dictionary sorting</text>
    <text x="68" y="398" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Cost:</tspan> ~15% write overhead</text>
    <text x="68" y="414" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Benefit:</tspan> Fast Direct Lake</text>
    <text x="68" y="434" font-size="8.5" font-weight="700" fill="#1D4ED8">Best for Gold reporting marts</text>
    <rect x="250" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="276" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 3: step-3 -->
  <g data-node-id="step-3" role="group" tabindex="0" aria-label="Too many small output files?">
    <title data-node-tooltip="true">Too many small output files? — Optimized Write reshapes Spark output to produce more appropriately sized files.</title>
    <rect x="336" y="316" width="260" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#dwod-shadow)"/>
    <rect x="348" y="326" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="413" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">OUTPUT SHAPING</text>
    <text x="348" y="360" font-size="12.5" font-weight="700" fill="#1E3A8A">3 · Optimized Write</text>
    <text x="348" y="382" font-size="9.5" fill="#1E40AF">• Shuffles partitions to 1 executor</text>
    <text x="348" y="398" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Win:</tspan> 175k ➔ 1.8k files (19x query)</text>
    <text x="348" y="414" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Target:</tspan> 256 MB general BinSize</text>
    <text x="348" y="434" font-size="8.5" font-weight="700" fill="#1D4ED8">Essential for streaming pipelines</text>
    <rect x="530" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="556" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 4: step-4 -->
  <g data-node-id="step-4" role="group" tabindex="0" aria-label="Update-heavy workload?">
    <title data-node-tooltip="true">Update-heavy workload? — Deletion vectors record row deletions without immediately rewriting every affected data file.</title>
    <rect x="616" y="316" width="260" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#dwod-shadow)"/>
    <rect x="628" y="326" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="693" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">MERGE-ON-READ</text>
    <text x="628" y="360" font-size="12.5" font-weight="700" fill="#1E3A8A">4 · Deletion Vectors</text>
    <text x="628" y="382" font-size="9.5" fill="#1E40AF">• Stores bitmap markers in .bin files</text>
    <text x="628" y="398" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Win:</tspan> ~8x faster single-row delete</text>
    <text x="628" y="414" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Rule:</tspan> Requires regular OPTIMIZE</text>
    <text x="628" y="434" font-size="8.5" font-weight="700" fill="#1D4ED8">Best for CDC &amp; GDPR deletion</text>
    <rect x="810" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="836" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 5: step-5 -->
  <g data-node-id="step-5" role="group" tabindex="0" aria-label="Existing files fragmented?">
    <title data-node-tooltip="true">Existing files fragmented? — Compaction rewrites accumulated small files into fewer larger files.</title>
    <rect x="896" y="316" width="248" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#dwod-shadow)"/>
    <rect x="908" y="326" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="973" y="337" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FILE MERGE</text>
    <text x="908" y="360" font-size="12.5" font-weight="700" fill="#1E3A8A">5 · Table Compaction</text>
    <text x="908" y="382" font-size="9.5" fill="#1E40AF">• Auto Compaction: &lt;1 GB tables</text>
    <text x="908" y="398" font-size="9.5" fill="#1E40AF">• Scheduled OPTIMIZE: &gt;1 GB</text>
    <text x="908" y="414" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Target:</tspan> 500 MB to 1 GB Parquet</text>
    <text x="908" y="434" font-size="8.5" font-weight="700" fill="#1D4ED8">Consolidates historic backlogs</text>
    <rect x="1078" y="326" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="336" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: COMPATIBILITY GATE & LIFECYCLE (STEP-6 & STEP-7)                  -->
  <!-- ========================================================================= -->
  <rect x="40" y="530" width="1120" height="360" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="540" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="554" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 3: ENGINE COMPATIBILITY GATE &amp; MEASUREMENT LIFECYCLE</text>

  <!-- Node 6: step-6 -->
  <g data-node-id="step-6" role="group" tabindex="0" aria-label="Check engine compatibility">
    <title data-node-tooltip="true">Check engine compatibility — Every table feature must be supported by all required writers and readers.</title>
    <rect x="56" y="570" width="520" height="300" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6" filter="url(#dwod-shadow)"/>
    <rect x="68" y="580" width="150" height="16" rx="8" fill="#FEE2E2"/><text x="143" y="591" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">COMPATIBILITY GATE</text>
    <text x="68" y="614" font-size="13" font-weight="700" fill="#991B1B">6 · Verify Downstream Engine Protocol Compatibility</text>
    <text x="68" y="636" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Protocol Bump Check:</tspan> Enabling deletion vectors permanently raises table protocol to <tspan font-weight="700">minReader=3, minWriter=7</tspan></text>
    <text x="68" y="654" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Fabric COPY Activity:</tspan> Unsupported on deletion-vector tables unless OPTIMIZE runs prior to copy</text>
    <text x="68" y="672" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">External Readers:</tspan> Older Polars/delta-rs readers fail with DeltaProtocolError if protocol 2.3+ is unsupported</text>
    <text x="68" y="692" font-size="8.5" font-weight="700" fill="#B91C1C">Do not enable advanced table features without verifying all production consumers</text>
    <rect x="510" y="580" width="52" height="14" rx="7" fill="#FEE2E2"/><text x="536" y="590" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">WARNING</text>
  </g>

  <!-- Node 7: step-7 -->
  <g data-node-id="step-7" role="group" tabindex="0" aria-label="Measure and maintain">
    <title data-node-tooltip="true">Measure and maintain — Validate scan cost, write duration, file count, and correctness after the change.</title>
    <rect x="606" y="570" width="538" height="300" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#dwod-shadow)"/>
    <rect x="618" y="580" width="140" height="16" rx="8" fill="#CCFBF1"/><text x="688" y="591" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">LIFECYCLE MEASURE</text>
    <text x="618" y="614" font-size="13" font-weight="700" fill="#134E4A">7 · Measure Scan Cost, Write SLAs &amp; Schedule Maintenance</text>
    <text x="618" y="636" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Benchmark Lifecycle:</tspan> Observe ➔ Change 1 lever ➔ Profile scan &amp; write latency ➔ Validate against SLA</text>
    <text x="618" y="654" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Health-Check Pipeline:</tspan> Query <tspan font-family="monospace" font-size="8.5">sp_get_table_health_metrics</tspan> to conditionally trigger maintenance only when fragmented</text>
    <text x="618" y="672" font-size="9.5" fill="#115E59">• <tspan font-weight="700">VACUUM Policy:</tspan> Retain safety window (default 7 days) before purging superseded Parquet files</text>
    <text x="618" y="692" font-size="8.5" font-weight="700" fill="#0F766E">Continuous measurement prevents cargo-cult configuration across workspaces</text>
    <rect x="1078" y="580" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1104" y="590" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="938" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Atlas — Original Diagram, August 2026. Sourced from Microsoft Fabric Delta Lake Optimization Benchmarks.</text>
</svg>
