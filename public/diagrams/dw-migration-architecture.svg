<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="dw-migration-architecture-title dw-migration-architecture-desc" data-diagram-id="dw-migration-architecture">
  <title id="dw-migration-architecture-title">Data Warehouse to Fabric: Migration Architecture</title>
  <desc id="dw-migration-architecture-desc">An architecture flow starting at the legacy source warehouse and Copy activity landing its extracts into OneLake. From there the flow branches: SQL-first workloads move directly into Fabric Warehouse tables, while Spark-heavy or semi-structured workloads land first in a lakehouse for transformation before becoming warehouse-ready. Both paths converge on Warehouse tables stored as Delta in OneLake, cached transparently by the query engine, and served through a certified semantic model to Power BI reports. A feedback edge shows validation queries comparing source and target row counts before cutover, and a warning node covers keeping duplicated extracts alive after migration instead of consolidating on OneLake.</desc>
  <!-- Fabric Codex — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       DW-to-Fabric migration phases: source DW -> landing/mirroring -> Fabric warehouse
       + semantic layer -> BI. Grounded in verified warehouse/mirroring/data-factory/
       polaris/capacity claims. Not a Microsoft asset. -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B3D5E"/>
      <stop offset="0.6" stop-color="#12588C"/>
      <stop offset="1" stop-color="#2A8FD4"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6672"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12588C"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E8E5A"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="58" fill="url(#hdrGrad)"/>
  <text x="28" y="25" font-size="17" font-weight="700" fill="#FFFFFF">Data-Warehouse-to-Fabric Migration — Phases and Data Flow</text>
  <g data-node-id="validation-feedback" role="group" tabindex="0" aria-label="Row-count / totals validation">
    <title data-node-tooltip="true">Row-count / totals validation — Compare source and target aggregates before cutover, feeding back into the load step if mismatched.</title>
    <rect x="14.0" y="21.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="28" y="44" font-size="11" fill="#D6EBFB">Source DW → landing / mirroring → Fabric Warehouse on OneLake Delta → semantic layer → BI. Bulk backfill plus incremental sync, then cutover.</text>
  </g>

  <!-- Phase band labels -->
  <rect x="28"  y="72" width="248" height="20" rx="4" fill="#5A6672"/>
  <text x="152" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">PHASE 1 — SOURCE</text>
  <rect x="300" y="72" width="300" height="20" rx="4" fill="#12588C"/>
  <text x="450" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">PHASE 2 — LAND / SYNC INTO ONELAKE</text>
  <rect x="624" y="72" width="300" height="20" rx="4" fill="#1E8E5A"/>
  <text x="774" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">PHASE 3 — TARGET STORE (Delta on OneLake)</text>
  <rect x="948" y="72" width="224" height="20" rx="4" fill="#6B3FA0"/>
  <text x="1060" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">PHASE 4 — SERVE / CUTOVER</text>

  <!-- ===== PHASE 1: SOURCE ===== -->
  <rect x="28" y="110" width="248" height="150" rx="10" fill="#F5F7FA" stroke="#C7D0DA"/>
  <g data-node-id="legacy-source" role="group" tabindex="0" aria-label="Legacy source warehouse">
    <title data-node-tooltip="true">Legacy source warehouse — The existing on-prem or cloud data warehouse being migrated.</title>
    <rect x="30.0" y="109.0" width="189" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="44" y="132" font-size="12" font-weight="700" fill="#12325A">Legacy / cloud warehouse</text>
  </g>
  <text x="44" y="150" font-size="9.5" fill="#33413A">Synapse dedicated SQL pools,</text>
  <text x="44" y="164" font-size="9.5" fill="#33413A">SQL Server, other SQL engines,</text>
  <text x="44" y="178" font-size="9.5" fill="#33413A">Snowflake, Oracle, BigQuery, SAP.</text>
  <rect x="44" y="190" width="216" height="58" rx="6" fill="#EAF0F6" stroke="#C7D0DA"/>
  <text x="56" y="207" font-size="9" font-weight="600" fill="#12325A">Two flows out of the source:</text>
  <text x="56" y="221" font-size="8.5" fill="#33413A">• historical bulk backfill (one-time)</text>
  <text x="56" y="234" font-size="8.5" fill="#33413A">• ongoing incremental changes</text>

  <!-- ===== PHASE 2: LANDING / MIRRORING ===== -->
  <!-- Path A: Data Factory copy -->
  <rect x="300" y="110" width="300" height="66" rx="10" fill="#EAF3FB" stroke="#8FBFE0"/>
  <text x="316" y="130" font-size="11" font-weight="700" fill="#0B3D5E">Path A — Data Factory pipelines</text>
  <text x="316" y="146" font-size="9" fill="#1B4A6B">Copy activity: recommended for large one-time</text>
  <text x="316" y="159" font-size="9" fill="#1B4A6B">DW→OneLake migration; fan out via ForEach for</text>
  <text x="316" y="171" font-size="9" fill="#1B4A6B">parallelism. Copy job for incremental / CDC style.</text>

  <!-- Path B: Mirroring -->
  <rect x="300" y="186" width="300" height="74" rx="10" fill="#FFF8EC" stroke="#E8C070"/>
  <text x="316" y="206" font-size="11" font-weight="700" fill="#7A4A00">Path B — Fabric Mirroring (bridge)</text>
  <text x="316" y="222" font-size="9" fill="#5C3A00">Serverless, managed replication → Delta in OneLake.</text>
  <text x="316" y="235" font-size="9" fill="#5C3A00">Changes can land in ~15s; free replicator compute;</text>
  <text x="316" y="248" font-size="9" fill="#5C3A00">1 TB free storage per CU. A transitional read replica.</text>

  <!-- OneLake landing bar -->
  <rect x="300" y="272" width="624" height="26" rx="6" fill="#0B3D5E"/>
  <text x="612" y="289" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">OneLake — one physical copy, Delta/Parquet, readable by every Fabric engine</text>

  <!-- ===== PHASE 3: TARGET STORE ===== -->
  <rect x="624" y="110" width="300" height="66" rx="10" fill="#EAF6EF" stroke="#8FCBA8"/>
  <text x="640" y="130" font-size="11" font-weight="700" fill="#0F5C36">Fabric Warehouse (primary target)</text>
  <text x="640" y="146" font-size="9" fill="#1F4A38">Full T-SQL: multi-table ACID, procs, views,</text>
  <text x="640" y="159" font-size="9" fill="#1F4A38">materialized views. Tables ARE Delta on OneLake.</text>
  <text x="640" y="171" font-size="9" fill="#1F4A38">V-Order on by default; Polaris MPP engine.</text>

  <rect x="624" y="186" width="300" height="74" rx="10" fill="#F3EEFA" stroke="#C3AEE0"/>
  <text x="640" y="206" font-size="11" font-weight="700" fill="#4B2A7A">Alternatives on the same OneLake copy</text>
  <g data-node-id="warehouse-cache" role="group" tabindex="0" aria-label="Transparent query cache">
    <title data-node-tooltip="true">Transparent query cache — Always-on in-memory and SSD caching over Warehouse and SQL analytics endpoint queries.</title>
    <rect x="626.0" y="199.0" width="290" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="640" y="222" font-size="9" fill="#3A2060">• Lakehouse SQL analytics endpoint (read-only T-SQL,</text>
  </g>
  <g data-node-id="lakehouse-transform" role="group" tabindex="0" aria-label="Lakehouse (Spark transformation)">
    <title data-node-tooltip="true">Lakehouse (Spark transformation) — Spark-first path for file-heavy, semi-structured, or complex transformation workloads.</title>
    <rect x="626.0" y="212.0" width="295" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="640" y="235" font-size="9" fill="#3A2060">  Spark-first landing) • SQL database (OLTP + endpoint)</text>
  </g>
  <text x="640" y="248" font-size="9" fill="#3A2060">• Mirrored DB kept as the live replica (no rebuild).</text>

  <!-- ===== PHASE 4: SERVE ===== -->
  <rect x="948" y="110" width="224" height="82" rx="10" fill="#F3EEFA" stroke="#C3AEE0"/>
  <text x="964" y="130" font-size="11" font-weight="700" fill="#4B2A7A">Semantic layer + BI</text>
  <text x="964" y="147" font-size="9" fill="#3A2060">Direct Lake semantic models</text>
  <text x="964" y="160" font-size="9" fill="#3A2060">read the Delta tables directly.</text>
  <text x="964" y="173" font-size="9" fill="#3A2060">Cross-database T-SQL spans WH,</text>
  <text x="964" y="186" font-size="9" fill="#3A2060">mirrored DB and lakehouse endpoints.</text>

  <rect x="948" y="200" width="224" height="60" rx="10" fill="#EAF3FB" stroke="#8FBFE0"/>
  <text x="964" y="219" font-size="10.5" font-weight="700" fill="#0B3D5E">Cutover — parallel run</text>
  <text x="964" y="235" font-size="8.5" fill="#1B4A6B">Run old + new side by side, reconcile,</text>
  <text x="964" y="247" font-size="8.5" fill="#1B4A6B">then repoint semantic models to Fabric.</text>

  <!-- FLOW ARROWS -->
  <!-- source -> path A / B -->
  <line x1="276" y1="150" x2="300" y2="143" stroke="#5A6672" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="276" y1="212" x2="300" y2="220" stroke="#C17E00" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- path A/B -> onelake bar -->
  <line x1="450" y1="176" x2="450" y2="272" stroke="#12588C" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="520" y1="260" x2="520" y2="272" stroke="#C17E00" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- onelake -> target stores (up) -->
  <line x1="700" y1="272" x2="700" y2="176" stroke="#1E8E5A" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <line x1="800" y1="272" x2="800" y2="260" stroke="#6B3FA0" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- target -> serve -->
  <line x1="924" y1="143" x2="948" y2="151" stroke="#6B3FA0" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="924" y1="223" x2="948" y2="228" stroke="#12588C" stroke-width="1.6" marker-end="url(#arrBlue)"/>

  <!-- ===== SIZING / GOVERNANCE STRIP ===== -->
  <rect x="28" y="316" width="1144" height="118" rx="10" fill="#F5F7FA" stroke="#D6DEE6"/>
  <text x="44" y="338" font-size="11" font-weight="700" fill="#12325A">Sizing &amp; governance to settle before cutover</text>

  <rect x="44" y="350" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#D6DEE6"/>
  <text x="58" y="368" font-size="9.5" font-weight="700" fill="#12325A">Capacity &amp; concurrency</text>
  <text x="58" y="384" font-size="8.5" fill="#33413A">2048 user sessions per workspace ceiling.</text>
  <g data-node-id="semantic-model-cutover" role="group" tabindex="0" aria-label="Certified semantic model">
    <title data-node-tooltip="true">Certified semantic model — The governed consumption layer published over the validated Warehouse tables.</title>
    <rect x="44.0" y="373.0" width="242" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="58" y="396" font-size="8.5" fill="#33413A">Warehouse ops smoothed over 24h (background).</text>
  </g>
  <text x="58" y="408" font-size="8.5" fill="#33413A">Compute is serverless — no user tuning knobs.</text>

  <rect x="330" y="350" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#D6DEE6"/>
  <text x="344" y="368" font-size="9.5" font-weight="700" fill="#12325A">Ingestion shape</text>
  <text x="344" y="384" font-size="8.5" fill="#33413A">COPY INTO files 100 MB–1 GB, many files.</text>
  <text x="344" y="396" font-size="8.5" fill="#33413A">Batch DML — avoid trickle inserts.</text>
  <text x="344" y="408" font-size="8.5" fill="#33413A">V-Order-off staging → V-Order-on read WH.</text>

  <rect x="616" y="350" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#D6DEE6"/>
  <text x="630" y="368" font-size="9.5" font-weight="700" fill="#12325A">Schema / T-SQL surface</text>
  <text x="630" y="384" font-size="8.5" fill="#33413A">Size varchar(n) to real data, not (max).</text>
  <text x="630" y="396" font-size="8.5" fill="#33413A">Some ops (TOP, global sort) run single-node.</text>
  <text x="630" y="408" font-size="8.5" fill="#33413A">Migration Assistant helps port Synapse/SQL.</text>

  <rect x="902" y="350" width="256" height="72" rx="8" fill="#FFF8EC" stroke="#E8C070"/>
  <text x="916" y="368" font-size="9.5" font-weight="700" fill="#7A4A00">Mirroring caveats (bridge)</text>
  <text x="916" y="384" font-size="8.5" fill="#5C3A00">RLS/CLS/masking NOT carried forward.</text>
  <text x="916" y="396" font-size="8.5" fill="#5C3A00">Not a backup; not a change stream.</text>
  <text x="916" y="408" font-size="8.5" fill="#5C3A00">SQL endpoint adds ~30–60s sync lag.</text>

  <!-- ===== LEGEND ===== -->
  <rect x="28" y="446" width="1144" height="88" rx="10" fill="#F3F2F1" stroke="#DDE3E9"/>
  <text x="44" y="466" font-size="10.5" font-weight="700" fill="#12325A">Legend</text>
  <rect x="44" y="476" width="14" height="14" rx="3" fill="#12588C"/>
  <g data-node-id="copy-activity" role="group" tabindex="0" aria-label="Data Factory Copy activity">
    <title data-node-tooltip="true">Data Factory Copy activity — Scalable, parallelized movement of source extracts into OneLake.</title>
    <rect x="50.0" y="464.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="64" y="487" font-size="9.5" fill="#33413A">Path A — Data Factory Copy: bulk one-time migration + high-volume recurring loads</text>
  </g>
  <rect x="44" y="496" width="14" height="14" rx="3" fill="#E8C070"/>
  <text x="64" y="507" font-size="9.5" fill="#33413A">Path B — Mirroring: near-real-time replica; transitional bridge while apps repoint</text>
  <rect x="620" y="476" width="14" height="14" rx="3" fill="#1E8E5A"/>
  <g data-node-id="warehouse-tables" role="group" tabindex="0" aria-label="Fabric Warehouse tables (Delta on OneLake)">
    <title data-node-tooltip="true">Fabric Warehouse tables (Delta on OneLake) — The T-SQL analytical target: star/snowflake schemas physically stored as Delta in OneLake.</title>
    <rect x="626.0" y="464.0" width="395" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="640" y="487" font-size="9.5" fill="#33413A">Fabric Warehouse — full T-SQL primary target, Delta tables on OneLake</text>
  </g>
  <rect x="620" y="496" width="14" height="14" rx="3" fill="#6B3FA0"/>
  <text x="640" y="507" font-size="9.5" fill="#33413A">Semantic / cutover — Direct Lake models, parallel run then repoint</text>
  <text x="44" y="526" font-size="9" fill="#5A6672" font-style="italic">All target stores read the SAME single OneLake Delta copy — the target-store choice is about the query surface, not a second data copy.</text>

  <!-- ===== INFERENCE CALLOUT ===== -->
  <rect x="28" y="546" width="1144" height="60" rx="10" fill="#EEF4FA" stroke="#B9D3E8"/>
  <text x="44" y="566" font-size="10" font-weight="700" fill="#0B3D5E">Inference (Fabric Codex, not a cited product fact):</text>
  <text x="44" y="583" font-size="9" fill="#1B4A6B">A staged migration — Mirror or Copy the estate first, validate in parallel, then repoint semantic models — decouples data landing from consumer</text>
  <g data-node-id="duplicated-extracts-warning" role="group" tabindex="0" aria-label="Trap: duplicated extracts left running">
    <title data-node-tooltip="true">Trap: duplicated extracts left running — Keeping old extract jobs alive after migration recreates the duplication Fabric was meant to eliminate.</title>
    <rect x="30.0" y="573.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="44" y="596" font-size="9" fill="#1B4A6B">cutover, so reporting keeps running on the legacy DW until the Fabric copy is reconciled. This sequencing is a design choice, not a documented product limit.</text>
  </g>

  <text x="1172" y="850" text-anchor="end" font-size="9" fill="#8A8886">Fabric Codex — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
