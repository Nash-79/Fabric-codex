<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="event-driven-architecture-architecture-title event-driven-architecture-architecture-desc" data-diagram-id="event-driven-architecture-architecture"><title id="event-driven-architecture-architecture-title">Event-Driven Architecture in Microsoft Fabric</title><desc id="event-driven-architecture-architecture-desc">An event source feeds Eventstream, which routes to Real-Time hub and forks two ways: a hot path through Activator that fires an immediate action, and a cold path into Eventhouse and OneLake for durable history and downstream analytics. A replay/dead-letter path feeds back into the router, and two warning nodes call out the idempotency and durability risks of treating the hot path as the system of record.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#063D3B"/><stop offset="1" stop-color="#117865"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2AAC94"/></marker></defs><rect width="1180" height="900" fill="#FAF9F8"/><rect width="1180" height="118" fill="url(#head)"/><text x="52" y="54" fill="white" font-size="28" font-weight="700">Event-Driven Frameworks in Microsoft Fabric</text><text x="52" y="84" fill="#CFF3E9" font-size="11" data-node-id="event-source" tabindex="0" aria-label="Event source"><title data-node-tooltip="true">Event source — Where the business or platform event originates.</title>Event-Driven Frameworks in Microsoft Fabric architecture — Events enter Eventstream, Hot path evaluates and acts, Durable path lands for replay and analytics</text><text x="52" y="154" fill="#605E5C" font-size="13" letter-spacing="2">END-TO-END ARCHITECTURE</text><path d="M 340 240 C 375 240, 395 240, 430 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 690 240 C 725 240, 745 240, 780 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="108" cy="198" r="16" fill="#117865"/><text x="108" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text><text x="230" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="eventstream" tabindex="0" aria-label="Eventstream"><title data-node-tooltip="true">Eventstream — No-code ingestion, transformation, and routing for streaming data.</title><tspan x="230" dy="0">Events enter Eventstream</tspan></text>
<rect x="430" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="458" cy="198" r="16" fill="#117865"/><text x="458" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text><text x="580" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="activator" tabindex="0" aria-label="Activator (hot path)"><title data-node-tooltip="true">Activator (hot path) — Evaluates the stream in near-real time and fires an automated action.</title><tspan x="580" dy="0">Hot path evaluates and</tspan><tspan x="580" dy="22">acts</tspan></text>
<rect x="780" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="808" cy="198" r="16" fill="#117865"/><text x="808" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text><text x="930" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="eventhouse" tabindex="0" aria-label="Eventhouse (cold path)"><title data-node-tooltip="true">Eventhouse (cold path) — Durable, indexed storage of the full event history.</title><tspan x="930" dy="0">Durable path lands for</tspan><tspan x="930" dy="22">replay and analytics</tspan></text><rect x="52" y="485" width="1076" height="118" rx="16" fill="#E8F6F1" stroke="#2AAC94" stroke-width="2"/><text x="76" y="515" fill="#117865" font-size="12" font-weight="700" letter-spacing="1.4">WORKED EXAMPLE</text><text x="76" y="547" fill="#063D3B" font-size="15" data-node-id="real-time-hub" tabindex="0" aria-label="Real-Time hub router"><title data-node-tooltip="true">Real-Time hub router — Organization-wide catalog and the fork point between hot and cold paths.</title><tspan x="76" dy="0">order.created drives a hot alert and a durable replay</tspan><tspan x="76" dy="19">path; an idempotency key prevents duplicate downstream</tspan><tspan x="76" dy="19">loads.</tspan></text><rect x="52" y="630" width="516" height="145" rx="16" fill="#EDF8F1" stroke="#6BBF8A"/><text x="78" y="662" fill="#176B3A" font-size="13" font-weight="700" letter-spacing="1.3">IMPLEMENTATION CONTROLS</text><text x="82" y="695" fill="#285943" font-size="14">✓ Event identity</text><text x="82" y="719" fill="#285943" font-size="14" data-node-id="replay-dead-letter" tabindex="0" aria-label="Replay / dead-letter procedure"><title data-node-tooltip="true">Replay / dead-letter procedure — Reprocesses failed or delayed events back through the router.</title>✓ Replay procedure</text><text x="82" y="743" fill="#285943" font-size="14">✓ Event-time policy</text><rect x="612" y="630" width="516" height="145" rx="16" fill="#FFF7E6" stroke="#D6A84B"/><text x="638" y="662" fill="#7A4B00" font-size="13" font-weight="700" letter-spacing="1.3">FAILURE MODES</text><text x="640" y="695" fill="#7A4B00" font-size="14" data-node-id="warning-notification-as-state" tabindex="0" aria-label="Risk: notification treated as durable state"><title data-node-tooltip="true">Risk: notification treated as durable state — Building business logic that assumes the hot-path alert is the system of record.</title>⚠ Notification treated as state</text><text x="640" y="719" fill="#7A4B00" font-size="14">⚠ No duplicate strategy</text><text x="640" y="743" fill="#7A4B00" font-size="14" data-node-id="warning-trigger-storm" tabindex="0" aria-label="Risk: trigger storm overwhelms batch work"><title data-node-tooltip="true">Risk: trigger storm overwhelms batch work — A burst of events fires more downstream job runs than batch-oriented systems can absorb.</title>⚠ Trigger storm</text><rect x="52" y="800" width="1076" height="54" rx="13" fill="#F0F5F3" stroke="#B8D8CE"/><text x="590" y="832" text-anchor="middle" fill="#063D3B" font-size="14" data-node-id="onelake-history" tabindex="0" aria-label="OneLake durable history"><title data-node-tooltip="true">OneLake durable history — Delta-format mirror of Eventhouse data for cross-workload analytics.</title>In Atlas: select a choice → inspect evidence → drill into inputs, processing, outputs, example, controls, and risks.</text><text x="1128" y="882" text-anchor="end" fill="#605E5C" font-size="10">Fabric Atlas original · Microsoft Fabric implementation guidance</text></svg>
