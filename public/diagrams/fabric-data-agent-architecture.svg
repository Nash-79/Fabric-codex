<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in content/sources/fabric-data-agent-concept.json claims:
       multi-agent conversational component over governed OneLake data (lakehouse,
       warehouse, semantic model, KQL database); up to 5 sources mixed
       (lakehouse/warehouse/KQL DB/Power BI semantic model/ontology/Graph);
       source-specific generators NL2SQL / NL2DAX / NL2KQL / Graph query;
       four-layer governance precedence (org policy > workspace/role > developer
       instructions & example queries > end-user prompt); Purview DLP applies to
       agent queries; standalone artifact distinct from non-customizable Copilots,
       invokable by external orchestrators (incl. Azure AI Foundry / Fabric chat). -->
  <defs>
    <linearGradient id="fdaHeaderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="fdaCoreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="fdaArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="fdaArrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
    <marker id="fdaArrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- TITLE -->
  <text x="40" y="40" font-size="22" font-weight="700" fill="#3B2A5A">Fabric Data Agent — architecture</text>
  <text x="40" y="61" font-size="12" fill="#616161">A configurable, standalone conversational component that sits between a natural-language question and governed OneLake data — distinct from preconfigured, non-customizable Fabric Copilots</text>

  <!-- ═══════════════════════════ ROW 1: CONSUMPTION SURFACES ═══════════════════════════ -->
  <text x="40" y="90" font-size="11" letter-spacing="1.5" fill="#8A8886">CONSUMPTION SURFACES — WHERE A QUESTION ENTERS</text>
  <rect x="40" y="98" width="1120" height="66" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>

  <rect x="60" y="112" width="230" height="38" rx="6" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="175" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4C1D95">Fabric data agent chat</text>
  <text x="175" y="143" text-anchor="middle" font-size="9.5" fill="#6D28D9">in-product Q&amp;A experience</text>

  <rect x="310" y="112" width="230" height="38" rx="6" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="425" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4C1D95">Microsoft 365 Copilot</text>
  <text x="425" y="143" text-anchor="middle" font-size="9.5" fill="#6D28D9">agent surfaced to Copilot</text>

  <rect x="560" y="112" width="260" height="38" rx="6" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="690" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4C1D95">Azure AI Foundry orchestrators</text>
  <text x="690" y="143" text-anchor="middle" font-size="9.5" fill="#6D28D9">invoked as a tool by an external agent</text>

  <rect x="840" y="112" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="990" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4C1D95">Multi-agent applications</text>
  <text x="990" y="143" text-anchor="middle" font-size="9.5" fill="#6D28D9">conversational-analytics component in a larger agent graph</text>

  <line x1="600" y1="164" x2="600" y2="188" stroke="#7C3AED" stroke-width="2" marker-end="url(#fdaArr)"/>
  <text x="614" y="180" font-size="9.5" fill="#6D28D9">natural-language question</text>

  <!-- ═══════════════════════════ ROW 2: THE DATA AGENT CORE ═══════════════════════════ -->
  <rect x="40" y="192" width="1120" height="150" rx="10" fill="url(#fdaCoreGrad)"/>
  <text x="70" y="220" font-size="15" font-weight="700" fill="#FFFFFF">Fabric data agent — standalone, configurable artifact</text>
  <text x="70" y="238" font-size="10.5" fill="#EDE4FF">Read-only conversational router: picks the right data source and generator per question, rather than being one text-to-SQL engine</text>

  <!-- Instruction/config layer -->
  <rect x="70" y="252" width="330" height="72" rx="7" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="90" y="272" font-size="12" font-weight="600" fill="#FFFFFF">Instructions &amp; example queries</text>
  <text x="90" y="288" font-size="9.5" fill="#EDE4FF">Developer-authored configuration: which</text>
  <text x="90" y="301" font-size="9.5" fill="#EDE4FF">sources to trust, how to phrase queries,</text>
  <text x="90" y="314" font-size="9.5" fill="#EDE4FF">sample Q&amp;A pairs that ground the router</text>

  <!-- Source selection -->
  <rect x="420" y="252" width="330" height="72" rx="7" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="440" y="272" font-size="12" font-weight="600" fill="#FFFFFF">Source &amp; generator selection</text>
  <text x="440" y="288" font-size="9.5" fill="#EDE4FF">Up to 5 attached sources, any mix; routes</text>
  <text x="440" y="301" font-size="9.5" fill="#EDE4FF">to NL2SQL / NL2DAX / NL2KQL / Graph</text>
  <text x="440" y="314" font-size="9.5" fill="#EDE4FF">query depending on the source picked</text>

  <!-- ALM -->
  <rect x="770" y="252" width="360" height="72" rx="7" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="790" y="272" font-size="12" font-weight="600" fill="#FFFFFF">ALM: Git integration &amp; deployment pipelines</text>
  <text x="790" y="288" font-size="9.5" fill="#EDE4FF">Configuration (instructions, example queries)</text>
  <text x="790" y="301" font-size="9.5" fill="#EDE4FF">is version-controlled and promoted dev →</text>
  <text x="790" y="314" font-size="9.5" fill="#EDE4FF">prod like any other Fabric item, with diagnostics</text>

  <!-- arrow down from core to generators -->
  <line x1="600" y1="342" x2="600" y2="366" stroke="#0D9488" stroke-width="2" marker-end="url(#fdaArrTeal)"/>
  <text x="614" y="358" font-size="9.5" fill="#0D9488">generated read-only query</text>

  <!-- ═══════════════════════════ ROW 3: QUERY GENERATION ═══════════════════════════ -->
  <text x="40" y="392" font-size="11" letter-spacing="1.5" fill="#8A8886">QUERY GENERATION — ONE GENERATOR PER SOURCE TYPE (READ-ONLY)</text>
  <rect x="40" y="400" width="1120" height="70" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>

  <rect x="60" y="414" width="255" height="42" rx="6" fill="#FFFFFF" stroke="#34D399"/>
  <text x="187" y="432" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">NL2SQL</text>
  <text x="187" y="447" text-anchor="middle" font-size="9.5" fill="#059669">lakehouse / warehouse</text>

  <rect x="325" y="414" width="255" height="42" rx="6" fill="#FFFFFF" stroke="#34D399"/>
  <text x="452" y="432" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">NL2DAX</text>
  <text x="452" y="447" text-anchor="middle" font-size="9.5" fill="#059669">Power BI semantic model</text>

  <rect x="590" y="414" width="255" height="42" rx="6" fill="#FFFFFF" stroke="#34D399"/>
  <text x="717" y="432" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">NL2KQL</text>
  <text x="717" y="447" text-anchor="middle" font-size="9.5" fill="#059669">Eventhouse KQL database</text>

  <rect x="855" y="414" width="285" height="42" rx="6" fill="#FFFFFF" stroke="#34D399"/>
  <text x="997" y="432" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">Graph query</text>
  <text x="997" y="447" text-anchor="middle" font-size="9.5" fill="#059669">Microsoft Graph / organizational data</text>

  <!-- connector arrows from generation row down to sources row -->
  <line x1="187" y1="470" x2="187" y2="494" stroke="#8A8886" stroke-width="1.8" marker-end="url(#fdaArrGray)"/>
  <line x1="452" y1="470" x2="452" y2="494" stroke="#8A8886" stroke-width="1.8" marker-end="url(#fdaArrGray)"/>
  <line x1="717" y1="470" x2="717" y2="494" stroke="#8A8886" stroke-width="1.8" marker-end="url(#fdaArrGray)"/>
  <line x1="997" y1="470" x2="997" y2="494" stroke="#8A8886" stroke-width="1.8" marker-end="url(#fdaArrGray)"/>

  <!-- ═══════════════════════════ ROW 4: GOVERNED DATA SOURCES ═══════════════════════════ -->
  <text x="40" y="492" font-size="11" letter-spacing="1.5" fill="#8A8886">GOVERNED SOURCES — UP TO 5 ATTACHED, QUERIED WITH THE CALLER'S OWN PERMISSIONS</text>
  <rect x="40" y="500" width="1120" height="140" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Lakehouse -->
  <rect x="60" y="516" width="255" height="108" rx="7" fill="#FFFFFF" stroke="#0EA5E9"/>
  <text x="187" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Lakehouse</text>
  <text x="187" y="556" text-anchor="middle" font-size="9.5" fill="#374151">Delta tables in OneLake</text>
  <text x="187" y="571" text-anchor="middle" font-size="9.5" fill="#374151">queried via NL2SQL</text>
  <line x1="80" y1="580" x2="295" y2="580" stroke="#E2E8F0"/>
  <text x="187" y="598" text-anchor="middle" font-size="9" fill="#6B7280">Standalone files (PDF/DOCX/TXT)</text>
  <text x="187" y="611" text-anchor="middle" font-size="9" fill="#6B7280">not queryable unless ingested as tables</text>

  <!-- Warehouse -->
  <rect x="325" y="516" width="255" height="108" rx="7" fill="#FFFFFF" stroke="#0EA5E9"/>
  <text x="452" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Warehouse</text>
  <text x="452" y="556" text-anchor="middle" font-size="9.5" fill="#374151">Delta tables in OneLake</text>
  <text x="452" y="571" text-anchor="middle" font-size="9.5" fill="#374151">queried via NL2SQL</text>
  <line x1="345" y1="580" x2="560" y2="580" stroke="#E2E8F0"/>
  <text x="452" y="598" text-anchor="middle" font-size="9" fill="#6B7280">Same one-copy OneLake data</text>
  <text x="452" y="611" text-anchor="middle" font-size="9" fill="#6B7280">no separate export needed</text>

  <!-- Semantic model -->
  <rect x="590" y="516" width="255" height="108" rx="7" fill="#FFFFFF" stroke="#0EA5E9"/>
  <text x="717" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Power BI semantic model</text>
  <text x="717" y="556" text-anchor="middle" font-size="9.5" fill="#374151">queried via NL2DAX</text>
  <text x="717" y="571" text-anchor="middle" font-size="9.5" fill="#374151">Read permission only — no Build</text>
  <line x1="610" y1="580" x2="825" y2="580" stroke="#E2E8F0"/>
  <text x="717" y="598" text-anchor="middle" font-size="9" fill="#6B7280">RLS / CLS on the model still apply</text>
  <text x="717" y="611" text-anchor="middle" font-size="9" fill="#6B7280">to every agent-generated query</text>

  <!-- Eventhouse KQL DB -->
  <rect x="855" y="516" width="285" height="108" rx="7" fill="#FFFFFF" stroke="#0EA5E9"/>
  <text x="997" y="538" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Eventhouse KQL database</text>
  <text x="997" y="556" text-anchor="middle" font-size="9.5" fill="#374151">queried in place via NL2KQL</text>
  <text x="997" y="571" text-anchor="middle" font-size="9.5" fill="#374151">no data movement; reuses KQL UDFs</text>
  <line x1="875" y1="580" x2="1120" y2="580" stroke="#E2E8F0"/>
  <text x="997" y="598" text-anchor="middle" font-size="9" fill="#6B7280">Scope to relevant tables + encourage</text>
  <text x="997" y="611" text-anchor="middle" font-size="9" fill="#6B7280">time filters over high-volume event data</text>

  <!-- ═══════════════════════════ GOVERNANCE PRECEDENCE STRIP ═══════════════════════════ -->
  <rect x="40" y="656" width="1120" height="108" rx="9" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="60" y="678" font-size="12.5" font-weight="700" fill="#92400E">Governance precedence applies to every question, top overrides bottom</text>

  <rect x="60"  y="688" width="255" height="58" rx="6" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="187" y="706" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">1. Org policy</text>
  <text x="187" y="722" text-anchor="middle" font-size="9" fill="#78350F">tenant-wide, highest</text>
  <text x="187" y="735" text-anchor="middle" font-size="9" fill="#78350F">precedence</text>

  <rect x="325" y="688" width="255" height="58" rx="6" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="452" y="706" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">2. Workspace / role settings</text>
  <text x="452" y="722" text-anchor="middle" font-size="9" fill="#78350F">Purview DLP &amp; access-restriction</text>
  <text x="452" y="735" text-anchor="middle" font-size="9" fill="#78350F">policies can block or strip results</text>

  <rect x="590" y="688" width="255" height="58" rx="6" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="717" y="706" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">3. Developer instructions</text>
  <text x="717" y="722" text-anchor="middle" font-size="9" fill="#78350F">the configuration layer above</text>
  <text x="717" y="735" text-anchor="middle" font-size="9" fill="#78350F">(instructions + example queries)</text>

  <rect x="855" y="688" width="285" height="58" rx="6" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="997" y="706" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">4. End-user prompt</text>
  <text x="997" y="722" text-anchor="middle" font-size="9" fill="#78350F">executes under the caller's own</text>
  <text x="997" y="735" text-anchor="middle" font-size="9" fill="#78350F">identity — least-privilege, read-only</text>

  <!-- FOOTER -->
  <text x="1160" y="785" text-anchor="end" font-size="9.5" fill="#94A3B8">Fabric Atlas — original diagram, July 2026. Grounded in Microsoft Learn concept-data-agent claims.</text>
</svg>
