<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in claims from content/sources/fabric-iq-overview.json and
       content/sources/fabric-iq-ontology-concepts.json:
       - without a shared ontology, AI is unfit for high-stakes decisions; every question needs
         manual expert translation from raw tables/schema into business concepts (overview claim 6)
       - Fabric data agent is a virtual analyst grounded in semantic models and ontologies
         (overview claim: fabric-data-agent capability)
       - NL2Ontology constrains generated filters/joins/units/validity windows to published
         ontology definitions rather than letting a model infer them freely from raw schema
         (ontology-concepts claim 8)
       - benefits: cross-domain reasoning via relationship traversal, faster onboarding because
         concepts are declared once, governance from consistent definitions (overview claim 7)
       - relationships carry attributes/cardinality enabling traversal without hand-written joins
         (ontology-concepts claim 4)
       - entity types elevated above any single table so column definitions can vary by source
         while the concept stays singular (ontology-concepts claim 2) -->
  <defs>
    <linearGradient id="badGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A1F1F"/>
      <stop offset="1" stop-color="#B23A3A"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B23A3A"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
  </defs>

  <rect width="1180" height="700" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="650" fill="#232323">Grounding a Fabric Data Agent — Without vs. With a Fabric IQ Ontology</text>
  <text x="40" y="62" font-size="12" fill="#616161">Same natural-language question, two very different paths to a query</text>

  <!-- shared question banner -->
  <rect x="40" y="80" width="1100" height="42" rx="8" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="590" y="106" text-anchor="middle" font-size="12.5" font-weight="600" fill="#232323">Business question: "Which shipments are at risk from a cold-chain breach this week?"</text>

  <!-- ═════════ LEFT: WITHOUT ONTOLOGY ═════════ -->
  <rect x="40" y="140" width="540" height="500" rx="12" fill="#FDF3F3" stroke="#E4A9A9" stroke-width="1.5"/>
  <rect x="40" y="140" width="540" height="46" rx="12" fill="url(#badGrad)"/>
  <rect x="40" y="164" width="540" height="22" fill="url(#badGrad)"/>
  <text x="310" y="169" text-anchor="middle" font-size="14" font-weight="650" fill="#FFFFFF">WITHOUT an ontology — prompt + raw schema</text>

  <!-- step boxes left -->
  <g>
    <rect x="66" y="202" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#E4A9A9"/>
    <text x="86" y="223" font-size="11.5" font-weight="600" fill="#7A1F1F">1 · NL question sent with raw table/column names</text>
    <text x="86" y="240" font-size="10" fill="#5A3A3A">Model sees column names like Ord_Hdr, Shp_Fact, SnsrLog —</text>
    <text x="86" y="254" font-size="10" fill="#5A3A3A">no declared meaning, units, or relationships to lean on.</text>

    <rect x="66" y="278" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#E4A9A9"/>
    <text x="86" y="299" font-size="11.5" font-weight="600" fill="#7A1F1F">2 · NL2SQL infers joins and filters freely</text>
    <text x="86" y="316" font-size="10" fill="#5A3A3A">The LLM guesses which columns join Order to Shipment to</text>
    <text x="86" y="330" font-size="10" fill="#5A3A3A">sensor data, and what "breach" or "this week" means numerically.</text>

    <rect x="66" y="354" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#E4A9A9"/>
    <text x="86" y="375" font-size="11.5" font-weight="600" fill="#7A1F1F">3 · A domain expert must manually translate</text>
    <text x="86" y="392" font-size="10" fill="#5A3A3A">Every business question otherwise requires a person who knows</text>
    <text x="86" y="406" font-size="10" fill="#5A3A3A">both the schema and the business meaning to check or rewrite it.</text>

    <rect x="66" y="430" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#E4A9A9"/>
    <text x="86" y="451" font-size="11.5" font-weight="600" fill="#7A1F1F">4 · Fragile, one-off query</text>
    <text x="86" y="468" font-size="10" fill="#5A3A3A">Definitions of "breach", join paths, and units are re-derived (and</text>
    <text x="86" y="482" font-size="10" fill="#5A3A3A">may drift) every time the question is asked, by any experience.</text>
  </g>

  <!-- connecting arrows left -->
  <g stroke="#B23A3A" stroke-width="2">
    <line x1="310" y1="266" x2="310" y2="276" marker-end="url(#arrRed)"/>
    <line x1="310" y1="342" x2="310" y2="352" marker-end="url(#arrRed)"/>
    <line x1="310" y1="418" x2="310" y2="428" marker-end="url(#arrRed)"/>
  </g>

  <!-- outcome banner left -->
  <rect x="66" y="510" width="488" height="106" rx="8" fill="#7A1F1F"/>
  <text x="86" y="533" font-size="12" font-weight="650" fill="#FFFFFF">Result: unfit for high-stakes decisions</text>
  <text x="86" y="552" font-size="10" fill="#FBE0E0">No shared vocabulary means every question is re-translated by</text>
  <text x="86" y="566" font-size="10" fill="#FBE0E0">hand, with no guarantee two people — or two agents — mean the</text>
  <text x="86" y="580" font-size="10" fill="#FBE0E0">same thing by "customer" or "breach." Errors surface as wrong</text>
  <text x="86" y="594" font-size="10" fill="#FBE0E0">answers, not as query failures.</text>

  <!-- ═════════ RIGHT: WITH ONTOLOGY ═════════ -->
  <rect x="600" y="140" width="540" height="500" rx="12" fill="#EAF7F2" stroke="#9AD2C5" stroke-width="1.5"/>
  <rect x="600" y="140" width="540" height="46" rx="12" fill="url(#goodGrad)"/>
  <rect x="600" y="164" width="540" height="22" fill="url(#goodGrad)"/>
  <text x="870" y="169" text-anchor="middle" font-size="14" font-weight="650" fill="#FFFFFF">WITH a Fabric IQ ontology — concepts, not columns</text>

  <g>
    <rect x="626" y="202" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="646" y="223" font-size="11.5" font-weight="600" fill="#0B5E50">1 · NL question resolved against published entity types</text>
    <text x="646" y="240" font-size="10" fill="#2F4A44">"Shipment," "Order," "sensor reading" already exist as entity</text>
    <text x="646" y="254" font-size="10" fill="#2F4A44">types with standardized names, ids, and properties.</text>

    <rect x="626" y="278" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="646" y="299" font-size="11.5" font-weight="600" fill="#0B5E50">2 · NL2Ontology, not free-form NL2SQL</text>
    <text x="646" y="316" font-size="10" fill="#2F4A44">Generated filters, joins, units, and validity windows are</text>
    <text x="646" y="330" font-size="10" fill="#2F4A44">constrained to the ontology's own published definitions.</text>

    <rect x="626" y="354" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="646" y="375" font-size="11.5" font-weight="600" fill="#0B5E50">3 · Typed relationships traverse the graph</text>
    <text x="646" y="392" font-size="10" fill="#2F4A44">Order → Shipment → sensor reading follows declared, typed,</text>
    <text x="646" y="406" font-size="10" fill="#2F4A44">directional links — no hand-written join logic per question.</text>

    <rect x="626" y="430" width="488" height="64" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="646" y="451" font-size="11.5" font-weight="600" fill="#0B5E50">4 · Federated execution routes to the right engine</text>
    <text x="646" y="468" font-size="10" fill="#2F4A44">The ontology layer pushes the query down as GQL (Graph) or</text>
    <text x="646" y="482" font-size="10" fill="#2F4A44">KQL (Eventhouse) — the agent never needs to know which.</text>
  </g>

  <g stroke="#2AAC94" stroke-width="2">
    <line x1="870" y1="266" x2="870" y2="276" marker-end="url(#arrGreen)"/>
    <line x1="870" y1="342" x2="870" y2="352" marker-end="url(#arrGreen)"/>
    <line x1="870" y1="418" x2="870" y2="428" marker-end="url(#arrGreen)"/>
  </g>

  <!-- outcome banner right -->
  <rect x="626" y="510" width="488" height="106" rx="8" fill="#0B5E50"/>
  <text x="646" y="533" font-size="12" font-weight="650" fill="#FFFFFF">Result: consistent, governed, and faster to extend</text>
  <text x="646" y="552" font-size="10" fill="#DFF7F0">Cross-domain reasoning via relationship traversal, faster</text>
  <text x="646" y="566" font-size="10" fill="#DFF7F0">onboarding because concepts are declared once, and governance</text>
  <text x="646" y="580" font-size="10" fill="#DFF7F0">from enforcing the same definitions across every team and app</text>
  <text x="646" y="594" font-size="10" fill="#DFF7F0">that reuses the ontology — not just this one agent.</text>

  <!-- caveat footnote (grounded, non-invented limitation) -->
  <rect x="600" y="626" width="540" height="0" fill="none"/>
  <text x="870" y="632" text-anchor="middle" font-size="9" fill="#3F6259" font-style="italic">Note: the graph must be enabled at the tenant level and refreshed (manual or scheduled) to reflect new source data.</text>

  <!-- footer -->
  <text x="1140" y="686" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
