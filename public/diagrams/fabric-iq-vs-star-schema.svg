<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900"
     font-family="Segoe UI, Arial, sans-serif" font-size="13" role="img" aria-labelledby="fabric-iq-vs-star-schema-title fabric-iq-vs-star-schema-desc" data-diagram-id="fabric-iq-vs-star-schema">
  <title id="fabric-iq-vs-star-schema-title">Raw NL2SQL vs Ontology-Grounded: The Same Question, Two Paths</title>
  <desc id="fabric-iq-vs-star-schema-desc">A flow diagram with two parallel branches from the same starting question. The left branch queries a raw star schema directly: an NL2SQL model must infer table joins, business meaning, and filter definitions purely from column names and a prompt, with no published, shared definition to check against. The right branch queries through a Fabric IQ ontology: NL2Ontology constrains its generated query to the ontology&apos;s own published entity types, relationships, and rules. Both branches converge on a comparison node showing that the raw path can silently diverge in its answer depending on which developer built the prompt, while the ontology path is structurally forced to agree with every other consumer of the same ontology. A warning node covers the concrete failure mode: two teams&apos; raw-schema agents answering &apos;how many active customers&apos; differently with no way to reconcile the discrepancy.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in claims from content/sources/fabric-iq-overview.json (capability: fabric-iq):
       - Without a shared ontology, every business question requires manual translation by a
         domain expert from raw tables/schemas into business concepts — described as unfit for
         high-stakes AI decisions (antipattern claim).
       - An ontology (preview) item defines core business entities, relationships, properties,
         rules, and actions, and exposes NL2Ontology — converting business questions directly
         into structured queries.
       - Ontologies can be generated/aligned from existing Power BI semantic models, so business
         terms/KPIs stay consistent across reports, agents, and applications instead of being
         redefined per experience.
       - Fabric IQ brings three layers of context — unified data, business intelligence,
         operational intelligence — via the semantic model and ontology items.
       - Stated benefits of the ontology layer: cross-domain reasoning via graph traversal,
         faster onboarding (concepts declared once), governance (consistent definitions).
       - A Fabric data agent answers NL questions grounded in semantic models and ontologies.
       This diagram does not invent SQL/schema mechanics beyond what the claims describe — the
       "raw schema" side reflects only the antipattern claim's description of manual, per-question
       translation from tables/columns; no internals-level NL2SQL detail is asserted. -->
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="rawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ontGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="dArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="dArrowRed" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f87171"/>
    </marker>
    <marker id="dArrowGreen" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5eead4"/>
    </marker>
    <filter id="dShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>

  <rect width="1180" height="900" fill="url(#bgGrad2)" rx="12"/>

  <!-- Title -->
  <g data-node-id="raw-nl2sql" role="group" tabindex="0" aria-label="NL2SQL over raw star schema">
    <title data-node-tooltip="true">NL2SQL over raw star schema — An NL2SQL model infers joins, filters, and business meaning purely from column names and the prompt — no published definition to check against.</title>
    <rect x="380.0" y="0.7" width="420" height="49" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="590" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">
    Querying Through an Ontology vs Querying Raw Relational / Star-Schema Structures
  </text>
  </g>
  <g data-node-id="warning-inconsistent-definitions" role="group" tabindex="0" aria-label="Real failure: two teams, two definitions">
    <title data-node-tooltip="true">Real failure: two teams, two definitions — Different experts translating the same data into subtly different business meanings, with no way to reconcile.</title>
    <rect x="380.0" y="33.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="590" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">
    Same underlying OneLake data — the difference is whether business meaning is declared once, or reconstructed by a human every time
  </text>
  </g>

  <!-- ══════════════════════════════════════════
       Shared question at top
  ══════════════════════════════════════════ -->
  <rect x="330" y="76" width="520" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#dShadow)"/>
  <g data-node-id="business-question" role="group" tabindex="0" aria-label="Business question">
    <title data-node-tooltip="true">Business question — The same natural-language question is the starting point for both paths compared in this diagram.</title>
    <rect x="380.0" y="80.2" width="420" height="33" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="590" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">Business question: "Which shipments are at risk of a cold-chain breach?"</text>
  </g>

  <line x1="450" y1="122" x2="230" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dArrow)"/>
  <line x1="730" y1="122" x2="950" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dArrow)"/>

  <!-- ══════════════════════════════════════════
       LANE HEADERS (2 columns)
  ══════════════════════════════════════════ -->
  <rect x="30" y="160" width="560" height="54" rx="8" fill="url(#rawGrad)" filter="url(#dShadow)"/>
  <text x="310" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#451a03">RAW RELATIONAL / STAR SCHEMA</text>
  <text x="310" y="202" text-anchor="middle" font-size="10.5" fill="#451a03">Tables, keys, and columns only — no declared business meaning</text>

  <rect x="610" y="160" width="540" height="54" rx="8" fill="url(#ontGrad)" filter="url(#dShadow)"/>
  <text x="880" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#f5f3ff">FABRIC IQ ONTOLOGY</text>
  <g data-node-id="ontology-nl2ontology" role="group" tabindex="0" aria-label="NL2Ontology over Fabric IQ ontology">
    <title data-node-tooltip="true">NL2Ontology over Fabric IQ ontology — The generated query is constrained to entity types, relationships, and rules the ontology has already published.</title>
    <rect x="670.0" y="179.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="880" y="202" text-anchor="middle" font-size="10.5" fill="#ede9fe">Entities, relationships, rules, and actions declared once via NL2Ontology</text>
  </g>

  <!-- Lane background columns -->
  <rect x="30" y="222" width="560" height="380" rx="8" fill="#d97706" opacity="0.07" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="610" y="222" width="540" height="380" rx="8" fill="#8b5cf6" opacity="0.08" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════════════════════════════════════════
       ROW: What this layer captures
  ══════════════════════════════════════════ -->
  <rect x="30" y="230" width="1120" height="80" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="246" font-size="10.5" font-weight="700" fill="#cbd5e1">What this layer captures</text>

  <text x="46" y="265" font-size="11" fill="#fde68a">Storage shape: fact/dimension tables,</text>
  <text x="46" y="280" font-size="11" fill="#fde68a">foreign keys, column names — Orders,</text>
  <text x="46" y="295" font-size="11" fill="#fde68a">Shipments, SensorReadings as raw rows</text>

  <text x="626" y="265" font-size="11" fill="#ddd6fe">Business meaning: "a Shipment carries</text>
  <text x="626" y="280" font-size="11" fill="#ddd6fe">an Order and is monitored by a sensor;</text>
  <text x="626" y="295" font-size="11" fill="#ddd6fe">a breach is a rule over temperature + time"</text>

  <!-- ══════════════════════════════════════════
       ROW: How a question gets answered
  ══════════════════════════════════════════ -->
  <rect x="30" y="318" width="1120" height="96" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="334" font-size="10.5" font-weight="700" fill="#cbd5e1">How the question gets answered</text>

  <text x="46" y="353" font-size="11" fill="#fde68a" font-weight="600">Manual translation, every time</text>
  <text x="46" y="370" font-size="10.5" fill="#fcd34d">A domain expert must map "cold-chain</text>
  <text x="46" y="385" font-size="10.5" fill="#fcd34d">breach" onto specific tables/joins/columns</text>
  <text x="46" y="400" font-size="10.5" fill="#fcd34d">before any query — repeated per question</text>

  <text x="626" y="353" font-size="11" fill="#ddd6fe" font-weight="600">NL2Ontology — declared once</text>
  <text x="626" y="370" font-size="10.5" fill="#c4b5fd">The ontology already defines Order,</text>
  <text x="626" y="385" font-size="10.5" fill="#c4b5fd">Shipment, sensor, and the breach rule —</text>
  <text x="626" y="400" font-size="10.5" fill="#c4b5fd">the question converts straight to a query</text>

  <!-- ══════════════════════════════════════════
       ROW: Cross-domain reasoning
  ══════════════════════════════════════════ -->
  <rect x="30" y="422" width="1120" height="80" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="438" font-size="10.5" font-weight="700" fill="#cbd5e1">Cross-domain reasoning (Order → Shipment → sensor → breach)</text>

  <text x="46" y="457" font-size="10.5" fill="#fde68a">No declared relationship graph — a person</text>
  <text x="46" y="472" font-size="10.5" fill="#fcd34d">must know and hand-write every join path</text>
  <text x="46" y="487" font-size="10.5" fill="#fcd34d">across the Order, Shipment, and sensor tables</text>

  <text x="626" y="457" font-size="10.5" fill="#ddd6fe">Graph relationship traversal chains Order</text>
  <text x="626" y="472" font-size="10.5" fill="#c4b5fd">to Shipment to sensor automatically —</text>
  <text x="626" y="487" font-size="10.5" fill="#c4b5fd">this chaining is a stated Fabric IQ benefit</text>

  <!-- ══════════════════════════════════════════
       ROW: Consistency across consumers
  ══════════════════════════════════════════ -->
  <rect x="30" y="510" width="1120" height="80" rx="6" fill="#0f172a" opacity="0.35"/>
  <text x="40" y="526" font-size="10.5" font-weight="700" fill="#cbd5e1">Consistency across reports, agents, and apps</text>

  <text x="46" y="545" font-size="10.5" fill="#fde68a">Business terms/KPIs are redefined per</text>
  <text x="46" y="560" font-size="10.5" fill="#fcd34d">experience — each report, script, or app</text>
  <text x="46" y="575" font-size="10.5" fill="#fcd34d">can encode "breach" differently</text>

  <text x="626" y="545" font-size="10.5" fill="#ddd6fe">Ontology generated/aligned from production</text>
  <text x="626" y="560" font-size="10.5" fill="#c4b5fd">semantic models — the same definitions ground</text>
  <text x="626" y="575" font-size="10.5" fill="#c4b5fd">reports, Fabric data agents, and custom apps</text>

  <!-- ══════════════════════════════════════════
       ROW: Where NL2SQL ambiguity arises (watch-outs, red panel)
  ══════════════════════════════════════════ -->
  <rect x="30" y="598" width="1120" height="98" rx="6" fill="#3b0d0d" opacity="0.5" stroke="#7f1d1d" stroke-width="1"/>
  <text x="40" y="616" font-size="10.5" font-weight="700" fill="#fca5a5">Where ambiguity bites without an ontology</text>

  <text x="46" y="635" font-size="10.5" fill="#fecaca">A natural-language question maps to raw</text>
  <text x="46" y="650" font-size="10.5" fill="#fecaca">tables/columns with no declared business</text>
  <text x="46" y="665" font-size="10.5" fill="#fecaca">vocabulary in between — the model (or the</text>
  <text x="46" y="680" font-size="10.5" fill="#fecaca">analyst) has to guess which joins and filters</text>
  <text x="46" y="693" font-size="10.5" fill="#fecaca">represent a business concept like "breach"</text>

  <text x="626" y="635" font-size="10.5" fill="#fecaca">This is the KB's stated antipattern: without a</text>
  <text x="626" y="650" font-size="10.5" fill="#fecaca">shared ontology, AI systems are described as</text>
  <text x="626" y="665" font-size="10.5" fill="#fecaca">unfit for high-stakes decisions — every question</text>
  <text x="626" y="680" font-size="10.5" fill="#fecaca">needs a domain expert to translate tables/schemas</text>
  <text x="626" y="693" font-size="10.5" fill="#fecaca">into business concepts by hand, every time</text>

  <!-- ══════════════════════════════════════════
       Verdict strip
  ══════════════════════════════════════════ -->
  <rect x="30" y="708" width="560" height="58" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="730" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fde68a">Raw schema still stores the ground truth</text>
  <text x="310" y="748" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fde68a">— it just carries no shared meaning layer</text>

  <rect x="610" y="708" width="540" height="58" rx="8" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="880" y="730" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ddd6fe">Ontology adds a business-meaning layer</text>
  <text x="880" y="748" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ddd6fe">on top — same OneLake data, no duplication</text>

  <!-- ══════════════════════════════════════════
       Note bar: not an either/or
  ══════════════════════════════════════════ -->
  <rect x="30" y="778" width="1120" height="66" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="590" y="800" text-anchor="middle" font-size="12" font-weight="700" fill="#e2e8f0">The ontology sits above the schema, not instead of it</text>
  <text x="590" y="819" text-anchor="middle" font-size="11" fill="#94a3b8">
    Fabric IQ brings three layers of business context — unified data, business intelligence, operational intelligence — by generating or aligning
  </text>
  <g data-node-id="comparison" role="group" tabindex="0" aria-label="Comparison: per-build vs shared definition">
    <title data-node-tooltip="true">Comparison: per-build vs shared definition — The raw path&apos;s answer depends on which build answered it; the ontology path&apos;s answer is the same no matter which consumer asks.</title>
    <rect x="380.0" y="812.0" width="420" height="32" rx="6" fill="#fff" fill-opacity="0.001" pointer-events="all"/>
    <text x="590" y="835" text-anchor="middle" font-size="11" fill="#94a3b8">
    the ontology from semantic models already built on the same relational structures, so existing BI investment bootstraps the meaning layer.
  </text>
  </g>

  <!-- ══════════════════════════════════════════
       LEGEND
  ══════════════════════════════════════════ -->
  <rect x="30" y="856" width="1120" height="34" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <rect x="46" y="866" width="14" height="14" rx="3" fill="url(#rawGrad)"/>
  <text x="66" y="877" font-size="10.5" fill="#cbd5e1">Raw relational / star schema — storage shape only</text>
  <rect x="406" y="866" width="14" height="14" rx="3" fill="url(#ontGrad)"/>
  <text x="426" y="877" font-size="10.5" fill="#cbd5e1">Fabric IQ ontology — declared business meaning</text>
  <rect x="798" y="866" width="14" height="14" rx="3" fill="#3b0d0d" stroke="#7f1d1d"/>
  <text x="818" y="877" font-size="10.5" fill="#cbd5e1">Ambiguity / antipattern without an ontology</text>
</svg>
