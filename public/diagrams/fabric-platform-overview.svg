<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="fabric-platform-overview-title fabric-platform-overview-desc" data-diagram-id="fabric-platform-overview">
  <title id="fabric-platform-overview-title">Microsoft Fabric Platform: Workloads Over One Shared Store</title>
  <desc id="fabric-platform-overview-desc">An architecture diagram with two connected layers. On top, role-oriented workloads — Power BI, Data Factory, Data Engineering, Data Warehouse, Real-Time Intelligence, and others — each contribute their own item types but all write to and read from the same shared platform layer below: OneLake for storage, Copilot for embedded AI, and Purview for governance. Underneath that, the tenancy hierarchy is shown as a containment structure: a tenant holds domains, domains group workspaces, and workspaces draw compute from a capacity while holding the items each workload creates. A warning node flags that Fabric is SaaS, not a resource you provision piece by piece — there is no separate infrastructure layer to configure. A second warning covers the private-link tenant-wide toggle that disables specific Power BI and gateway functionality as a real operational trade-off.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Palette sampled from the official Microsoft Fabric product icon. -->
  <defs>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.55" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E6961"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="650" fill="#063D3B">Microsoft Fabric — platform overview</text>
  <g data-node-id="purview-governance" role="group" tabindex="0" aria-label="Purview governance">
    <title data-node-tooltip="true">Purview governance — Built-in governance across data-estate management, protection, discovery, and monitoring — inherited automatically.</title>
    <rect x="28.0" y="48.6" width="480.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="40" y="66" font-size="12" fill="#616161">Every experience works over one copy of data in OneLake; capacities meter the compute and governance spans it all.</text>
  </g>

  <!-- experiences row -->
  <text x="40" y="103" font-size="11" letter-spacing="1.5" fill="#8A8886">EXPERIENCES</text>
  <g>
    <!-- card template: x = 40 + i*162, w 150, h 86, y 112 -->
    <g transform="translate(40,112)">
      <rect width="150" height="86" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
      <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Data Factory</text>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">Pipelines</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Dataflow Gen2</text>
    </g>
    <g transform="translate(202,112)">
      <rect width="150" height="86" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
      <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Data Engineering</text>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">Spark · Notebooks</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Lakehouse</text>
    </g>
    <g transform="translate(364,112)">
      <rect width="150" height="86" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
      <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Data Warehouse</text>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">T-SQL</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Polaris engine</text>
    </g>
    <g transform="translate(526,112)">
      <rect width="150" height="86" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
      <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Data Science</text>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">ML models</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Experiments</text>
    </g>
    <g transform="translate(688,112)">
      <rect width="150" height="86" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
      <g data-node-id="workloads" role="group" tabindex="0" aria-label="Role-oriented workloads">
    <title data-node-tooltip="true">Role-oriented workloads — Power BI, Data Factory, Data Engineering, Data Warehouse, Real-Time Intelligence, and more — each contributes its own item types.</title>
    <rect x="-19.9" y="15.2" width="189.9" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Real-Time Intelligence</text>
  </g>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">Eventstreams · KQL</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Eventhouse · Activator</text>
    </g>
    <g transform="translate(850,112)">
      <rect width="150" height="86" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
      <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Databases</text>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">SQL Database</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Mirroring</text>
    </g>
    <g transform="translate(1012,112)">
      <rect width="150" height="86" rx="8" fill="#DFF5EE" stroke="#117865" stroke-width="1.5"/>
      <text x="75" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#063D3B">Power BI</text>
      <text x="75" y="54" text-anchor="middle" font-size="10" fill="#3F6259">Semantic models</text>
      <text x="75" y="68" text-anchor="middle" font-size="10" fill="#3F6259">Reports · Apps</text>
    </g>
  </g>

  <!-- read/write arrows -->
  <g stroke="#2AAC94" stroke-width="1.6">
    <line x1="115"  y1="206" x2="115"  y2="292" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="277"  y1="206" x2="277"  y2="292" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="439"  y1="206" x2="439"  y2="292" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="601"  y1="206" x2="601"  y2="292" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="763"  y1="206" x2="763"  y2="292" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="925"  y1="206" x2="925"  y2="292" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <g data-node-id="capacity" role="group" tabindex="0" aria-label="Capacity (compute budget)">
    <title data-node-tooltip="true">Capacity (compute budget) — A dedicated pool of capacity units every workload draws from; sized by SKU.</title>
    <rect x="456.6" y="236.8" width="346.8" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="630" y="252" font-size="10.5" fill="#616161" text-anchor="middle">every experience reads &amp; writes the same Delta tables</text>
  </g>

  <!-- Direct Lake highlighted path -->
  <line x1="1087" y1="292" x2="1087" y2="206" stroke="#0E6961" stroke-width="3" marker-end="url(#arrMint)"/>
  <text x="1098" y="244" font-size="10.5" font-weight="600" fill="#0B5E50">Direct Lake</text>
  <text x="1098" y="258" font-size="9.5" fill="#3F6259">reads Delta columns</text>
  <text x="1098" y="270" font-size="9.5" fill="#3F6259">directly — no import</text>

  <!-- OneLake bar -->
  <rect x="40" y="300" width="1122" height="84" rx="10" fill="url(#lake)"/>
  <text x="70" y="336" font-size="20" font-weight="650" fill="#FFFFFF">OneLake</text>
  <g data-node-id="onelake" role="group" tabindex="0" aria-label="OneLake (shared storage)">
    <title data-node-tooltip="true">OneLake (shared storage) — One logical data lake per tenant; every workload writes and reads the same Delta Parquet data.</title>
    <rect x="58.0" y="342.6" width="480.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="70" y="360" font-size="12" fill="#D9F5EE">One logical data lake for the whole organization · open Delta-Parquet format · workspaces as folders · one copy of data, every engine</text>
  </g>

  <!-- external data: shortcuts + mirroring -->
  <text x="40" y="442" font-size="10.5" fill="#616161">Shortcuts — virtualize external storage in place, no copy</text>
  <g>
    <g transform="translate(40,452)">
      <rect width="130" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
      <text x="65" y="30" text-anchor="middle" font-size="11" fill="#424242">ADLS Gen2</text>
    </g>
    <g transform="translate(180,452)">
      <rect width="130" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
      <text x="65" y="30" text-anchor="middle" font-size="11" fill="#424242">Amazon S3</text>
    </g>
    <g transform="translate(320,452)">
      <rect width="130" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
      <text x="65" y="24" text-anchor="middle" font-size="11" fill="#424242">Google Cloud</text>
      <text x="65" y="38" text-anchor="middle" font-size="11" fill="#424242">Storage</text>
    </g>
    <g transform="translate(460,452)">
      <rect width="130" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
      <text x="65" y="30" text-anchor="middle" font-size="11" fill="#424242">Dataverse</text>
    </g>
  </g>
  <g stroke="#8A8886" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="105" y1="452" x2="105" y2="388"/>
    <line x1="245" y1="452" x2="245" y2="388"/>
    <line x1="385" y1="452" x2="385" y2="388"/>
    <line x1="525" y1="452" x2="525" y2="388"/>
  </g>

  <g data-node-id="private-link-warning" role="group" tabindex="0" aria-label="Trap: tenant-wide private links are all-or-nothing">
    <title data-node-tooltip="true">Trap: tenant-wide private links are all-or-nothing — Enabling tenant-level private links disables specific Power BI features and breaks on-premises gateways — a real trade-off, not free security.</title>
    <rect x="848.0" y="426.8" width="334.6" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="860" y="442" font-size="10.5" fill="#616161">Mirroring — near-real-time replication into OneLake</text>
  </g>
  <g transform="translate(860,452)">
    <rect width="302" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4"/>
    <text x="151" y="24" text-anchor="middle" font-size="11" fill="#424242">Operational &amp; external databases</text>
    <text x="151" y="39" text-anchor="middle" font-size="10" fill="#797775">Azure SQL · Cosmos DB · Snowflake · open mirroring</text>
  </g>
  <line x1="1011" y1="452" x2="1011" y2="390" stroke="#2AAC94" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- platform services -->
  <text x="40" y="554" font-size="11" letter-spacing="1.5" fill="#8A8886">PLATFORM SERVICES — UNDER EVERY EXPERIENCE ABOVE</text>
  <g transform="translate(40,566)">
    <rect width="362" height="92" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
    <text x="18" y="28" font-size="13" font-weight="600" fill="#063D3B">Capacity &amp; cost</text>
    <g data-node-id="tenant-domain-workspace" role="group" tabindex="0" aria-label="Tenant, domains, workspaces">
    <title data-node-tooltip="true">Tenant, domains, workspaces — One tenant maps to one Entra tenant; domains group workspaces; workspaces hold items and draw from a capacity.</title>
    <rect x="6.0" y="34.0" width="304.7" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="18" y="50" font-size="11" fill="#424242">One shared pool of capacity units meters all</text>
  </g>
    <text x="18" y="66" font-size="11" fill="#424242">workloads; smoothing &amp; bursting average usage.</text>
  </g>
  <g transform="translate(420,566)">
    <rect width="362" height="92" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
    <text x="18" y="28" font-size="13" font-weight="600" fill="#063D3B">Governance &amp; security</text>
    <text x="18" y="50" font-size="11" fill="#424242">Purview hub · domains · endorsement · sensitivity</text>
    <text x="18" y="66" font-size="11" fill="#424242">labels · lineage · workspace roles.</text>
  </g>
  <g transform="translate(800,566)">
    <rect width="362" height="92" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
    <text x="18" y="28" font-size="13" font-weight="600" fill="#063D3B">AI &amp; Copilot</text>
    <text x="18" y="50" font-size="11" fill="#424242">Data agents ground AI in lakehouses, warehouses,</text>
    <text x="18" y="66" font-size="11" fill="#424242">KQL &amp; semantic models · Fabric IQ ontology.</text>
  </g>

  <g data-node-id="saas-model" role="group" tabindex="0" aria-label="Fabric is SaaS, not PaaS">
    <title data-node-tooltip="true">Fabric is SaaS, not PaaS — No Azure resource groups, ARM, redundancy settings, or region placement to manage — Microsoft manages the infrastructure.</title>
    <rect x="682.0" y="686.2" width="480.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="1162" y="700" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset; palette from the official Fabric icon.</text>
  </g>
</svg>
