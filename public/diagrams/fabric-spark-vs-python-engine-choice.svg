<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="fabric-spark-vs-python-engine-choice-title fabric-spark-vs-python-engine-choice-desc" data-diagram-id="fabric-spark-vs-python-engine-choice">
  <title id="fabric-spark-vs-python-engine-choice-title">Choosing between a Spark session and a Python notebook in Fabric</title>
  <desc id="fabric-spark-vs-python-engine-choice-desc">Decision framework for Fabric compute: Working data size heuristics (Single-node Python vs Small Spark vs Scaled Spark), the 2 hard Spark overrides (V-Order Direct Lake writes and distributed shuffles), and capacity cost vs Delta maintenance tradeoffs.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="py-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A2170"/>
      <stop offset="0.5" stop-color="#7C3AAD"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="py-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4A2170" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="py-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="py-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <marker id="py-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>

    <!-- Official Microsoft Notebook Item Icon Gradients -->
    <linearGradient id="py-nb-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="py-nb-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#4BA446"/><stop offset="1" stop-color="#3F7D35"/></linearGradient>
    <linearGradient id="py-nb-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="py-nb-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="920" fill="#FAF5FF"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#py-head)"/>
  <g data-official-icon="microsoft" data-icon-name="notebook_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#py-nb-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#py-nb-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#py-nb-c)" d="M17.494 8.521a.5.5 0 0 1 .335.623l-2.7 9a.5.5 0 1 1-.957-.287l2.7-9a.5.5 0 0 1 .622-.336"/>
      <path fill="url(#py-nb-c)" d="M18.797 10.446a.5.5 0 0 1 .707 0l2.63 2.63a.6.6 0 0 1 0 .848l-2.63 2.63a.5.5 0 0 1-.707-.708l2.346-2.346-2.346-2.347a.5.5 0 0 1 0-.707"/>
      <path fill="url(#py-nb-c)" d="M12.496 10.446a.5.5 0 1 1 .707.707L10.857 13.5l2.346 2.346a.5.5 0 0 1-.707.707l-2.63-2.629a.6.6 0 0 1 0-.848z"/>
      <path fill="url(#py-nb-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Choosing Between Spark Session vs Python Notebook in Fabric</text>
  <text x="40" y="64" font-size="12" fill="#E9D8FD">Working data size heuristics ➔ The two Spark overrides ➔ Capacity cost vs Delta maintenance tradeoffs</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#E9D8FD"/>
    <circle cx="20" cy="15" r="5" fill="#059669"/><text x="32" y="19" fill="#065F46" font-weight="600">Working Data Size Heuristics</text>
    <circle cx="280" cy="15" r="5" fill="#D97706"/><text x="292" y="19" fill="#92400E" font-weight="600">Hard Architectural Overrides</text>
    <circle cx="560" cy="15" r="5" fill="#DC2626"/><text x="572" y="19" fill="#991B1B" font-weight="600">Capacity &amp; Maintenance Realities</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: WORKING DATA SIZE HEURISTICS (SMALL ➔ MEDIUM ➔ LARGE)             -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.4"/>
  <rect x="56" y="156" width="450" height="20" rx="10" fill="#DCFCE7"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#166534" letter-spacing="1px">STAGE 1: START FROM WORKING DATA SIZE (HEURISTIC GUIDE)</text>

  <!-- Size 1: small -->
  <g data-node-id="small" role="group" tabindex="0" aria-label="Under roughly 5–10 GB">
    <title data-node-tooltip="true">Under roughly 5–10 GB — Under roughly 5-10 GB a single-node Python notebook is usually the cheaper answer.</title>
    <rect x="56" y="184" width="350" height="182" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6" filter="url(#py-shadow)"/>
    <rect x="68" y="194" width="130" height="16" rx="8" fill="#DCFCE7"/><text x="133" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">&lt; 5–10 GB WORKING SET</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#14532D">1 · Single-Node Python Notebook</text>
    <text x="68" y="250" font-size="9.5" fill="#166534">• Uses Polars, DuckDB, or delta-rs directly</text>
    <text x="68" y="268" font-size="9.5" fill="#166534">• Reads/writes OneLake Delta tables without Spark</text>
    <text x="68" y="286" font-size="9.5" fill="#166534">• Instant notebook startup (seconds vs minutes)</text>
    <text x="68" y="306" font-size="8.5" font-weight="700" fill="#15803D">Cheapest compute footprint in Fabric</text>
    <rect x="340" y="194" width="52" height="14" rx="7" fill="#DCFCE7"/><text x="366" y="204" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">PATTERN</text>
  </g>

  <!-- Size 2: medium -->
  <g data-node-id="medium" role="group" tabindex="0" aria-label="Roughly 10–100 GB">
    <title data-node-tooltip="true">Roughly 10–100 GB — Between roughly 10 and 100 GB a small Spark session fits without wide-cluster shuffles.</title>
    <rect x="426" y="184" width="350" height="182" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#py-shadow)"/>
    <rect x="438" y="194" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="503" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">10–100 GB WORKING SET</text>
    <text x="438" y="228" font-size="13" font-weight="700" fill="#1E3A8A">2 · Small Spark Session</text>
    <text x="438" y="250" font-size="9.5" fill="#1E40AF">• Fits on 2–3 Medium nodes with autoscale</text>
    <text x="438" y="268" font-size="9.5" fill="#1E40AF">• Native Execution Engine (Velox SIMD) on</text>
    <text x="438" y="286" font-size="9.5" fill="#1E40AF">• Minimal shuffle overhead; handles bursty transforms</text>
    <text x="438" y="306" font-size="8.5" font-weight="700" fill="#1D4ED8">Balanced distributed execution</text>
    <rect x="710" y="194" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="736" y="204" text-anchor="middle" font-size="8" font-weight="700" fill="#1D4ED8">PATTERN</text>
  </g>

  <!-- Size 3: large -->
  <g data-node-id="large" role="group" tabindex="0" aria-label="Beyond roughly 100 GB with joins">
    <title data-node-tooltip="true">Beyond roughly 100 GB with joins — Beyond roughly 100 GB with real joins, a scaled Spark pool is warranted.</title>
    <rect x="796" y="184" width="348" height="182" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#py-shadow)"/>
    <rect x="808" y="194" width="130" height="16" rx="8" fill="#EDE9FE"/><text x="873" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">&gt; 100 GB + JOINS</text>
    <text x="808" y="228" font-size="13" font-weight="700" fill="#4C1D95">3 · Scaled Spark Pool</text>
    <text x="808" y="250" font-size="9.5" fill="#5B21B6">• Multi-node pool sized by <tspan font-weight="700">shuffle volume</tspan></text>
    <text x="808" y="268" font-size="9.5" fill="#5B21B6">• Efficient Scaledown enabled to release executors</text>
    <text x="808" y="286" font-size="9.5" fill="#5B21B6">• Adaptive query execution (AQE) re-optimization</text>
    <text x="808" y="306" font-size="8.5" font-weight="700" fill="#6D28D9">Enterprise-scale distributed pipeline</text>
    <rect x="1078" y="194" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="1104" y="204" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">PATTERN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: TWO INVIOLABLE OVERRIDES (VORDER ➔ SHUFFLE)                       -->
  <!-- ========================================================================= -->
  <rect x="40" y="394" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.4"/>
  <rect x="56" y="404" width="450" height="20" rx="10" fill="#FEF3C7"/>
  <text x="66" y="418" font-size="10.5" font-weight="700" fill="#B45309" letter-spacing="1px">STAGE 2: TWO ARCHITECTURAL RULES THAT OVERRIDE SIZE</text>

  <!-- Override 1: vorder -->
  <g data-node-id="vorder" role="group" tabindex="0" aria-label="Gold writes for Direct Lake">
    <title data-node-tooltip="true">Gold writes for Direct Lake — Gold writes for Direct Lake belong in Spark because delta-rs cannot apply V-Order.</title>
    <rect x="56" y="432" width="520" height="182" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6" filter="url(#py-shadow)"/>
    <rect x="68" y="442" width="130" height="16" rx="8" fill="#FEF3C7"/><text x="133" y="453" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">OVERRIDE 1 · DIRECT LAKE</text>
    <text x="68" y="476" font-size="13" font-weight="700" fill="#78350F">4 · Gold Writes for Direct Lake</text>
    <text x="68" y="498" font-size="9.5" fill="#92400E">• <tspan font-weight="700">V-Order Requirement:</tspan> V-Order Parquet compaction is generated exclusively on the Spark write path</text>
    <text x="68" y="516" font-size="9.5" fill="#92400E">• Standalone Python libraries (delta-rs, DuckDB) cannot apply Microsoft V-Order</text>
    <text x="68" y="534" font-size="9.5" fill="#92400E">• Writing Gold tables from Python forfeits V-Order and severely slows Power BI Direct Lake queries</text>
    <text x="68" y="552" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Rule:</tspan> All Direct Lake Gold tables must be written via Spark, even if under 1 GB!</text>
    <rect x="510" y="442" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="536" y="452" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">FACT</text>
  </g>

  <!-- Override 2: shuffle -->
  <g data-node-id="shuffle" role="group" tabindex="0" aria-label="Genuinely distributed shuffles">
    <title data-node-tooltip="true">Genuinely distributed shuffles — Genuinely distributed shuffles are Spark territory regardless of input size.</title>
    <rect x="606" y="432" width="538" height="182" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6" filter="url(#py-shadow)"/>
    <rect x="618" y="442" width="140" height="16" rx="8" fill="#FEF3C7"/><text x="688" y="453" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">OVERRIDE 2 · SHUFFLES</text>
    <text x="618" y="476" font-size="13" font-weight="700" fill="#78350F">5 · Genuinely Distributed Shuffles</text>
    <text x="618" y="498" font-size="9.5" fill="#92400E">• Wide transformations (large-scale joins, global aggregations, repartitioning) require cluster shuffles</text>
    <text x="618" y="516" font-size="9.5" fill="#92400E">• Attempting large distributed joins single-node exhausts VM RAM and crashes with OutOfMemory</text>
    <text x="618" y="534" font-size="9.5" fill="#92400E">• Spark's shuffle infrastructure (MapOutputTracker, BlockManager, NVMe spill) is designed for this</text>
    <text x="618" y="552" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Rule:</tspan> If the query requires an all-to-all distributed exchange, use Spark regardless of file size</text>
    <rect x="1078" y="442" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="1104" y="452" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">PATTERN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: CRITICAL CONSEQUENCES (COST ➔ MAINT)                              -->
  <!-- ========================================================================= -->
  <rect x="40" y="642" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.4"/>
  <rect x="56" y="652" width="450" height="20" rx="10" fill="#FEE2E2"/>
  <text x="66" y="666" font-size="10.5" font-weight="700" fill="#991B1B" letter-spacing="1px">STAGE 3: THE TWO CONSEQUENCES PRACTITIONERS ROUTINELY MISS</text>

  <!-- Consequence 1: cost -->
  <g data-node-id="cost" role="group" tabindex="0" aria-label="Why this is the expensive mistake">
    <title data-node-tooltip="true">Why this is the expensive mistake — Using a multi-node Spark session for single-node work is the most expensive common mistake.</title>
    <rect x="56" y="680" width="520" height="182" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8" filter="url(#py-shadow)"/>
    <rect x="68" y="690" width="130" height="16" rx="8" fill="#FEE2E2"/><text x="133" y="701" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">CAPACITY PITFALL</text>
    <text x="68" y="724" font-size="13" font-weight="700" fill="#991B1B">6 · The #1 Expensive Spark Mistake: Over-Provisioning</text>
    <text x="68" y="746" font-size="9.5" fill="#7F1D1D">• Starting a multi-node Spark session for tiny single-node work drains Fabric Capacity Units</text>
    <text x="68" y="764" font-size="9.5" fill="#7F1D1D">• Dozens of small scheduled notebooks launching Spark pools create severe throttling &amp; queueing</text>
    <text x="68" y="782" font-size="9.5" fill="#7F1D1D">• More costly than any single misconfigured setting across your tenant</text>
    <text x="68" y="800" font-size="9.5" fill="#7F1D1D">• <tspan font-weight="700">Remedy:</tspan> Migrate lightweight ETL ingestion to single-node Python notebooks</text>
    <rect x="510" y="690" width="52" height="14" rx="7" fill="#FEE2E2"/><text x="536" y="700" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">WARNING</text>
  </g>

  <!-- Consequence 2: maint -->
  <g data-node-id="maint" role="group" tabindex="0" aria-label="Python-written tables need more maintenance">
    <title data-node-tooltip="true">Python-written tables need more maintenance — Tables written from the Python kernel receive no auto-compaction and need more maintenance.</title>
    <rect x="606" y="680" width="538" height="182" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.8" filter="url(#py-shadow)"/>
    <rect x="618" y="690" width="140" height="16" rx="8" fill="#FEE2E2"/><text x="688" y="701" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991B1B">MAINTENANCE DEBT</text>
    <text x="618" y="724" font-size="13" font-weight="700" fill="#991B1B">7 · The Python Kernel Delta Maintenance Consequence</text>
    <text x="618" y="746" font-size="9.5" fill="#7F1D1D">• Tables written via standalone Python (delta-rs / DuckDB) get <tspan font-weight="700">NO auto-compaction</tspan></text>
    <text x="618" y="764" font-size="9.5" fill="#7F1D1D">• <tspan font-family="monospace">VACUUM</tspan> and file bin-packing never run automatically behind the scenes</text>
    <text x="618" y="782" font-size="9.5" fill="#7F1D1D">• Small files accumulate rapidly, degrading downstream scan performance and query latency</text>
    <text x="618" y="800" font-size="9.5" fill="#7F1D1D">• <tspan font-weight="700">Governance:</tspan> Schedule explicit Spark <tspan font-family="monospace">OPTIMIZE</tspan> &amp; <tspan font-family="monospace">VACUUM</tspan> maintenance jobs regularly</text>
    <rect x="1078" y="690" width="52" height="14" rx="7" fill="#FEE2E2"/><text x="1104" y="700" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="894" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Fabric Spark Toolkit, Delta Lake Optimization &amp; Compute Pool Architecture.</text>
</svg>
