<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="graphql-api-architecture-title graphql-api-architecture-desc" data-diagram-id="graphql-api-architecture">
  <title id="graphql-api-architecture-title">Fabric API for GraphQL: Sources to a Single Endpoint</title>
  <desc id="graphql-api-architecture-desc">An architecture diagram: connected data sources — Warehouse, SQL database, Lakehouse via its SQL analytics endpoint, Azure SQL Database, and Fabric mirrored databases — feed a portal-driven setup workflow where tables, views, and relationships are selected and modeled. Fabric auto-generates a GraphQL schema, resolvers, and a live endpoint from that configuration, with no custom backend code and no separate deployment step. The endpoint is queried by human application developers through an interactive portal editor and by AI agents through the Model Context Protocol. A built-in performance monitoring dashboard observes usage. A warning node covers schema evolution: Fabric favors additive, non-breaking changes over versioned v1/v2/v3 endpoints, and getting this wrong by treating GraphQL like a versioned REST API defeats the model&apos;s main advantage.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Grounded in content/sources/api-graphql-overview.json claims:
       - auto-generated schema/resolvers/endpoint, no custom backend code (claim 1)
       - single query, only requested fields, one round trip, avoids over-fetch/N+1 (claim 2)
       - supported sources: Warehouse, SQL database, Lakehouse (via SQL analytics endpoint),
         Azure SQL Database, mirrored databases (Azure SQL DB, Azure SQL MI, Cosmos DB,
         Fabric SQL DB, Azure Databricks, Snowflake, open mirrored DBs) via SQL analytics
         endpoints (claim 3)
       - portal-driven setup: create item, connect sources, choose tables/views/procs,
         model relationships, configure access permissions, immediately queryable (claim 4)
       - fan-out queries across multiple sources; 1:1, 1:many, many:many relationships (claim 5)
       - additive schema evolution, field deprecation over versioned endpoints (claim 6)
       - interactive portal editor: results pane, parameterized query/mutation, Intellisense (claim 7)
       - built-in performance monitoring dashboard + request logging (claim 8)
       - MCP path connects AI agents to the same GraphQL endpoint (claim 9) -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="endpointGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B2C86"/>
      <stop offset="1" stop-color="#8E5BC4"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E5BC4"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1160" height="760" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1160" height="58" fill="url(#hdrGrad)"/>
  <text x="28" y="25" font-size="17" font-weight="700" fill="#FFFFFF">Fabric API for GraphQL — Architecture</text>
  <text x="28" y="45" font-size="11" fill="#D9F5EE" data-node-id="supported-sources" tabindex="0" aria-label="Connected data sources"><title data-node-tooltip="true">Connected data sources — Warehouse, SQL database, Lakehouse, Azure SQL Database, and mirrored databases — all reached through a SQL analytics endpoint.</title>No-code access layer: auto-generated schema + resolvers over Fabric data sources, exposed through one GraphQL endpoint</text>

  <!-- ═══════════════════════════════════════════════
       ROW 1: CLIENT APPS (top)
  ════════════════════════════════════════════════ -->
  <text x="28" y="82" font-size="11" letter-spacing="1.2" fill="#8A8886">CLIENT APPLICATIONS</text>

  <rect x="28" y="90" width="220" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="138" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Web / mobile apps</text>
  <text x="138" y="131" text-anchor="middle" font-size="10" fill="#3F6259">Request exactly the fields</text>
  <text x="138" y="144" text-anchor="middle" font-size="9" fill="#3F6259">they need, in one round trip</text>

  <rect x="272" y="90" width="220" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="382" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Integration services</text>
  <text x="382" y="131" text-anchor="middle" font-size="10" fill="#3F6259">Replaces hand-rolled REST</text>
  <text x="382" y="144" text-anchor="middle" font-size="9" fill="#3F6259">or raw SQL-driver wiring</text>

  <rect x="516" y="90" width="220" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="626" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Portal query editor</text>
  <text x="626" y="131" text-anchor="middle" font-size="10" fill="#3F6259" data-node-id="interactive-editor" tabindex="0" aria-label="Interactive portal editor"><title data-node-tooltip="true">Interactive portal editor — Human developers build and test queries in-browser with a results pane, parameterized queries, and Intellisense.</title>Results pane · parameterized</text>
  <text x="626" y="144" text-anchor="middle" font-size="9" fill="#3F6259">queries/mutations · Intellisense</text>

  <rect x="760" y="90" width="372" height="58" rx="8" fill="#F3EBFB" stroke="#C7A8E8"/>
  <text x="946" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#3D1E5C">AI agents (MCP)</text>
  <text x="946" y="131" text-anchor="middle" font-size="10" fill="#5B2C86" data-node-id="ai-agent-mcp" tabindex="0" aria-label="AI-agent access via MCP"><title data-node-tooltip="true">AI-agent access via MCP — AI agents connect to the same endpoint through the Model Context Protocol, not only human application developers.</title>Model Context Protocol connects agents</text>
  <text x="946" y="144" text-anchor="middle" font-size="9" fill="#5B2C86">to the same endpoint as human-facing apps</text>

  <!-- arrows down from clients to endpoint -->
  <g stroke="#2AAC94" stroke-width="1.8">
    <line x1="138" y1="148" x2="138" y2="188" marker-end="url(#arr)"/>
    <line x1="382" y1="148" x2="382" y2="188" marker-end="url(#arr)"/>
    <line x1="626" y1="148" x2="626" y2="188" marker-end="url(#arr)"/>
  </g>
  <line x1="946" y1="148" x2="946" y2="188" stroke="#8E5BC4" stroke-width="1.8" marker-end="url(#arrPurple)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 2: THE GRAPHQL ENDPOINT (single, purple band)
  ════════════════════════════════════════════════ -->
  <rect x="28" y="196" width="1104" height="96" rx="10" fill="url(#endpointGrad)"/>
  <text x="52" y="223" font-size="15" font-weight="700" fill="#FFFFFF">Single GraphQL Endpoint (one Fabric item)</text>
  <text x="52" y="242" font-size="10.5" fill="#EAD9F7" data-node-id="schema-generation" tabindex="0" aria-label="Auto-generated schema, resolvers, endpoint"><title data-node-tooltip="true">Auto-generated schema, resolvers, endpoint — No custom backend code — the schema, resolvers, and live endpoint are all generated from the setup configuration.</title>Auto-generated schema + resolvers from connected sources · no custom backend code required</text>

  <rect x="52" y="250" width="230" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="167" y="271" text-anchor="middle" font-size="10" fill="#FFFFFF">Additive schema evolution</text>

  <rect x="292" y="250" width="240" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="412" y="271" text-anchor="middle" font-size="10" fill="#FFFFFF">Fan-out across multiple sources</text>

  <rect x="542" y="250" width="260" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="672" y="271" text-anchor="middle" font-size="10" fill="#FFFFFF">1:1 · 1:many · many:many relationships</text>

  <rect x="812" y="250" width="300" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="962" y="271" text-anchor="middle" font-size="10" fill="#FFFFFF">Access permissions enforced per identity</text>

  <!-- Resolver / execution sub-label -->
  <text x="28" y="320" font-size="11" letter-spacing="1.2" fill="#8A8886">RESOLVER &amp; QUERY EXECUTION PATH</text>

  <!-- Resolver box -->
  <rect x="28" y="328" width="360" height="96" rx="9" fill="#F3EBFB" stroke="#C7A8E8"/>
  <text x="48" y="352" font-size="12" font-weight="700" fill="#3D1E5C">Resolvers (auto-generated)</text>
  <text x="48" y="371" font-size="10" fill="#5B2C86">Parse &amp; validate query against schema, then</text>
  <text x="48" y="386" font-size="10" fill="#5B2C86">translate each field/relationship into a query</text>
  <text x="48" y="401" font-size="10" fill="#5B2C86">pushed down to the source's own engine</text>
  <text x="48" y="416" font-size="9" fill="#8A8886">No mid-tier data copy — the source engine executes</text>

  <!-- Schema generation box -->
  <rect x="410" y="328" width="360" height="96" rx="9" fill="#F3EBFB" stroke="#C7A8E8"/>
  <text x="430" y="352" font-size="12" font-weight="700" fill="#3D1E5C">Schema generation</text>
  <text x="430" y="371" font-size="10" fill="#5B2C86">Built from connected source metadata when</text>
  <text x="430" y="386" font-size="10" fill="#5B2C86">tables/views/stored procedures are chosen and</text>
  <text x="430" y="401" font-size="10" fill="#5B2C86">relationships are modeled during setup</text>
  <text x="430" y="416" font-size="9" fill="#8A8886">Portal-driven — immediately queryable, no deploy step</text>

  <!-- Monitoring box -->
  <rect x="792" y="328" width="340" height="96" rx="9" fill="#F3EBFB" stroke="#C7A8E8"/>
  <text x="812" y="352" font-size="12" font-weight="700" fill="#3D1E5C">Performance monitoring</text>
  <text x="812" y="371" font-size="10" fill="#5B2C86" data-node-id="performance-monitoring" tabindex="0" aria-label="Performance monitoring dashboard"><title data-node-tooltip="true">Performance monitoring dashboard — Built-in request logging tracks endpoint usage and behavior over time.</title>Built-in dashboard with request logging tracks</text>
  <text x="812" y="386" font-size="10" fill="#5B2C86">API usage and behavior over time</text>
  <text x="812" y="416" font-size="9" fill="#8A8886">Applies across all connected source types</text>

  <!-- arrows: endpoint -> resolver row -->
  <line x1="208" y1="292" x2="208" y2="326" stroke="#8E5BC4" stroke-width="1.8" marker-end="url(#arrPurple)"/>
  <line x1="590" y1="292" x2="590" y2="326" stroke="#8E5BC4" stroke-width="1.8" marker-end="url(#arrPurple)"/>
  <line x1="962" y1="292" x2="962" y2="326" stroke="#8E5BC4" stroke-width="1.8" marker-end="url(#arrPurple)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 3: SUPPORTED FABRIC DATA SOURCES
  ════════════════════════════════════════════════ -->
  <text x="28" y="460" font-size="11" letter-spacing="1.2" fill="#8A8886">SUPPORTED DATA SOURCES — accessed via SQL analytics endpoints</text>

  <rect x="28" y="468" width="208" height="70" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="132" y="491" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Fabric Warehouse</text>
  <text x="132" y="509" text-anchor="middle" font-size="9" fill="#3F6259">Native T-SQL surface</text>
  <text x="132" y="523" text-anchor="middle" font-size="9" fill="#3F6259">read + mutation support</text>

  <rect x="248" y="468" width="208" height="70" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="352" y="491" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Fabric SQL database</text>
  <text x="352" y="509" text-anchor="middle" font-size="9" fill="#3F6259">Includes Azure SQL Database</text>
  <text x="352" y="523" text-anchor="middle" font-size="9" fill="#3F6259">as a source type</text>

  <rect x="468" y="468" width="208" height="70" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="572" y="491" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Fabric Lakehouse</text>
  <text x="572" y="509" text-anchor="middle" font-size="9" fill="#3F6259">Via its SQL analytics</text>
  <text x="572" y="523" text-anchor="middle" font-size="9" fill="#3F6259">endpoint</text>

  <rect x="688" y="468" width="234" height="70" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="805" y="486" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Mirrored databases</text>
  <text x="805" y="503" text-anchor="middle" font-size="9" fill="#3F6259">Azure SQL DB/MI · Cosmos DB ·</text>
  <text x="805" y="516" text-anchor="middle" font-size="9" fill="#3F6259">Fabric SQL DB · Azure Databricks ·</text>
  <text x="805" y="529" text-anchor="middle" font-size="9" fill="#3F6259">Snowflake · open mirrored DBs</text>

  <rect x="932" y="468" width="200" height="70" rx="8" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="1032" y="491" text-anchor="middle" font-size="11" font-weight="600" fill="#424242">Common access path</text>
  <text x="1032" y="509" text-anchor="middle" font-size="9" fill="#616161">All sources are reached through</text>
  <text x="1032" y="523" text-anchor="middle" font-size="9" fill="#616161">their SQL analytics endpoint</text>

  <!-- arrows from resolvers down to sources -->
  <g stroke="#8A8886" stroke-width="1.4" stroke-dasharray="5 3">
    <line x1="132" y1="468" x2="180" y2="426" marker-end="url(#arrGray)"/>
    <line x1="352" y1="468" x2="230" y2="426" marker-end="url(#arrGray)"/>
    <line x1="572" y1="468" x2="400" y2="426" marker-end="url(#arrGray)"/>
    <line x1="805" y1="468" x2="500" y2="426" marker-end="url(#arrGray)"/>
  </g>
  <text x="1010" y="461" text-anchor="end" font-size="9" fill="#8A8886">pushdown query, not a copy</text>

  <!-- ═══════════════════════════════════════════════
       SETUP WORKFLOW STRIP
  ════════════════════════════════════════════════ -->
  <text x="28" y="576" font-size="11" letter-spacing="1.2" fill="#8A8886" data-node-id="portal-setup" tabindex="0" aria-label="Portal setup workflow"><title data-node-tooltip="true">Portal setup workflow — Create the item, connect sources, choose what to expose, model relationships, configure permissions — no deployment step.</title>SETUP WORKFLOW — portal-driven, no separate deployment step</text>

  <g>
    <rect x="28" y="584" width="196" height="46" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="126" y="603" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">1 · Create item</text>
    <text x="126" y="619" text-anchor="middle" font-size="9" fill="#3F6259">GraphQL API item in Fabric</text>

    <rect x="240" y="584" width="196" height="46" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="338" y="603" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">2 · Connect sources</text>
    <text x="338" y="619" text-anchor="middle" font-size="9" fill="#3F6259">Warehouse, SQL DB, Lakehouse…</text>

    <rect x="452" y="584" width="196" height="46" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="550" y="603" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">3 · Choose objects</text>
    <text x="550" y="619" text-anchor="middle" font-size="9" fill="#3F6259">Tables, views, stored procs</text>

    <rect x="664" y="584" width="196" height="46" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="762" y="603" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">4 · Model relationships</text>
    <text x="762" y="619" text-anchor="middle" font-size="9" fill="#3F6259">Optional — 1:1, 1:many, many:many</text>

    <rect x="876" y="584" width="256" height="46" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="1004" y="603" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">5 · Configure access</text>
    <text x="1004" y="619" text-anchor="middle" font-size="9" fill="#3F6259">Endpoint is queryable immediately</text>
  </g>

  <g stroke="#C8C6C4" stroke-width="1.4">
    <line x1="224" y1="607" x2="238" y2="607" marker-end="url(#arrGray)"/>
    <line x1="436" y1="607" x2="450" y2="607" marker-end="url(#arrGray)"/>
    <line x1="648" y1="607" x2="662" y2="607" marker-end="url(#arrGray)"/>
    <line x1="860" y1="607" x2="874" y2="607" marker-end="url(#arrGray)"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       LEGEND / WHY IT MATTERS FOOTER
  ════════════════════════════════════════════════ -->
  <rect x="28" y="648" width="536" height="82" rx="8" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="44" y="668" font-size="11" font-weight="700" fill="#063D3B">Why one endpoint, not REST or raw SQL</text>
  <text x="44" y="686" font-size="9.5" fill="#424242">A single query requests only needed fields and traverses relationships in</text>
  <text x="44" y="700" font-size="9.5" fill="#424242" data-node-id="field-selection-model" tabindex="0" aria-label="Field-selection query model"><title data-node-tooltip="true">Field-selection query model — A client names only the fields and relationships it needs, in one round trip — no over-fetching, no N+1.</title>one round trip — avoiding both REST over-fetching and the N+1 pattern.</text>
  <text x="44" y="716" font-size="9.5" fill="#424242" data-node-id="warning-schema-versioning" tabindex="0" aria-label="Anti-pattern: versioned endpoints (v1/v2/v3)"><title data-node-tooltip="true">Anti-pattern: versioned endpoints (v1/v2/v3) — Fabric&apos;s schema evolution favors additive change and deprecation — minting versioned endpoints defeats the model&apos;s advantage.</title>Schema changes are additive with field deprecation, not v1/v2/v3 endpoints.</text>

  <rect x="580" y="648" width="552" height="82" rx="8" fill="#F3EBFB" stroke="#C7A8E8"/>
  <text x="596" y="668" font-size="11" font-weight="700" fill="#3D1E5C">Legend</text>
  <rect x="596" y="676" width="14" height="14" rx="3" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="616" y="687" font-size="9.5" fill="#424242">Client / consumer</text>
  <rect x="596" y="695" width="14" height="14" rx="3" fill="#8E5BC4"/>
  <text x="616" y="706" font-size="9.5" fill="#424242">GraphQL API item (single endpoint)</text>
  <rect x="830" y="676" width="14" height="14" rx="3" fill="#F3EBFB" stroke="#C7A8E8"/>
  <text x="850" y="687" font-size="9.5" fill="#424242">Resolver / execution / monitoring internals</text>
  <rect x="830" y="695" width="14" height="14" rx="3" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="850" y="706" font-size="9.5" fill="#424242">Underlying Fabric data source</text>

  <!-- footnote -->
  <text x="1132" y="750" text-anchor="end" font-size="9" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset.</text>
</svg>
