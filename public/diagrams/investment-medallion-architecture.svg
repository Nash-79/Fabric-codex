<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="investment-medallion-architecture-title investment-medallion-architecture-desc" data-diagram-id="investment-medallion-architecture">
  <title id="investment-medallion-architecture-title">Investment Analytics Medallion: Three Ingestion Paths to Direct Lake</title>
  <desc id="investment-medallion-architecture-desc">An architecture diagram with three ingestion paths on the left — file Copy, database Mirroring, and API pulls — landing in one lakehouse (bronze+silver), dbt-built warehouse gold, Direct Lake serving to Power BI, and control plane/telemetry rails.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="ima-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="ima-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="ima-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="ima-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="ima-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>

    <!-- Official Microsoft Lakehouse Icon Gradients -->
    <linearGradient id="ima-icon-a" x1="3.25" x2="19.75" y1="4.5" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="ima-icon-b" x1="16.5" x2="28.5" y1="6" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="980" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#ima-head)"/>
  <g data-official-icon="microsoft" data-icon-name="lakehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#ima-icon-a)" d="M4 16.5L16 4l12 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 27.5z"/>
      <path fill="url(#ima-icon-b)" d="M16 11l9 9.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 27.5v-7z"/>
      <path fill="#FFFFFF" opacity="0.8" d="M12 18h8v2h-8zm0 4h8v2h-8z"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Investment Analytics Medallion: 3 Ingestion Paths to Direct Lake</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Tri-Path Ingestion (Copy, Mirroring, APIs) ➔ Lakehouse (Bronze/Silver) ➔ Warehouse Gold via dbt ➔ Direct Lake BI</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Core Medallion Pipeline</text>
    <circle cx="310" cy="15" r="5" fill="#2563EB"/><text x="322" y="19" fill="#1E3A8A" font-weight="600">Warehouse Gold &amp; Direct Lake</text>
    <circle cx="680" cy="15" r="5" fill="#DC2626"/><text x="692" y="19" fill="#991B1B" font-weight="600">Blast-Radius Isolation Warning</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: TRI-PATH INGESTION & MEDALLION CORE (NODES 1 TO 4)                -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="286" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="156" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 1: TRI-MODAL INGESTION ➔ ONE LAKEHOUSE (BRONZE + SILVER)</text>

  <!-- Node 1: file-copy-pipeline -->
  <g data-node-id="file-copy-pipeline" role="group" tabindex="0" aria-label="Data Factory Copy (custodian files)">
    <title data-node-tooltip="true">Data Factory Copy (custodian files) — A metadata-driven pipeline copies custodian/administrator files into bronze.</title>
    <rect x="56" y="184" width="180" height="232" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="68" y="194" width="90" height="16" rx="8" fill="#CCFBF1"/><text x="113" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATH 1 · FILES</text>
    <text x="68" y="228" font-size="12" font-weight="700" fill="#134E4A">1 · Custodian Files</text>
    <text x="68" y="250" font-size="9" fill="#115E59">• Flat file positions</text>
    <text x="68" y="266" font-size="9" fill="#115E59">• Nightly SFTP / blob</text>
    <text x="68" y="282" font-size="9" fill="#115E59">• Pipeline Copy activity</text>
    <text x="68" y="298" font-size="9" fill="#115E59">• Driven by metadata</text>
    <text x="68" y="324" font-size="8.5" font-weight="700" fill="#0F766E">Lands in bronze_files/</text>
    <rect x="174" y="194" width="50" height="14" rx="7" fill="#CCFBF1"/><text x="199" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 2: mirroring-portfolio-db -->
  <g data-node-id="mirroring-portfolio-db" role="group" tabindex="0" aria-label="Mirroring (portfolio/transactions DB)">
    <title data-node-tooltip="true">Mirroring (portfolio/transactions DB) — The operational portfolio/transactions database replicates continuously into OneLake, no pipeline required.</title>
    <rect x="248" y="184" width="180" height="232" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="260" y="194" width="100" height="16" rx="8" fill="#CCFBF1"/><text x="310" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATH 2 · MIRROR</text>
    <text x="260" y="228" font-size="12" font-weight="700" fill="#134E4A">2 · Operational DB</text>
    <text x="260" y="250" font-size="9" fill="#115E59">• Portfolio &amp; trade DB</text>
    <text x="260" y="266" font-size="9" fill="#115E59">• Live CDC replication</text>
    <text x="260" y="282" font-size="9" fill="#115E59">• Zero ETL pipeline</text>
    <text x="260" y="298" font-size="9" fill="#115E59">• Near-real-time Delta</text>
    <text x="260" y="324" font-size="8.5" font-weight="700" fill="#0F766E">Shortcut into bronze</text>
    <rect x="366" y="194" width="50" height="14" rx="7" fill="#CCFBF1"/><text x="391" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 3: api-pull-pipeline -->
  <g data-node-id="api-pull-pipeline" role="group" tabindex="0" aria-label="Data Factory API pulls (market data, risk engine)">
    <title data-node-tooltip="true">Data Factory API pulls (market data, risk engine) — A second metadata-driven pipeline polls market-data and risk-engine REST APIs on a schedule.</title>
    <rect x="440" y="184" width="180" height="232" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="452" y="194" width="90" height="16" rx="8" fill="#CCFBF1"/><text x="497" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATH 3 · APIS</text>
    <text x="452" y="228" font-size="12" font-weight="700" fill="#134E4A">3 · Market Data &amp; VaR</text>
    <text x="452" y="250" font-size="9" fill="#115E59">• Pricing &amp; risk REST APIs</text>
    <text x="452" y="266" font-size="9" fill="#115E59">• Scheduled HTTP poll</text>
    <text x="452" y="282" font-size="9" fill="#115E59">• Token auth via linked svc</text>
    <text x="452" y="298" font-size="9" fill="#115E59">• Pagination &amp; watermark</text>
    <text x="452" y="324" font-size="8.5" font-weight="700" fill="#0F766E">Lands in bronze_api/</text>
    <rect x="558" y="194" width="50" height="14" rx="7" fill="#CCFBF1"/><text x="583" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 4: lakehouse-bronze-silver -->
  <g data-node-id="lakehouse-bronze-silver" role="group" tabindex="0" aria-label="Lakehouse (bronze + silver schemas)">
    <title data-node-tooltip="true">Lakehouse (bronze + silver schemas) — One lakehouse holds both bronze and silver as schemas, all files and the mirrored replica landing here.</title>
    <rect x="632" y="184" width="512" height="232" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.8" filter="url(#ima-shadow)"/>
    <rect x="644" y="194" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="709" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">UNIFIED LAKEHOUSE</text>
    <text x="644" y="228" font-size="13" font-weight="700" fill="#1E3A8A">4 · lh_analytics: Single Lakehouse for Bronze &amp; Silver</text>
    <text x="644" y="252" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Bronze Schemas:</tspan> Raw immutable files, mirrored DB shortcut, and API responses</text>
    <text x="644" y="272" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Spark Conforming Pass:</tspan> Deduplicates, standardizes keys (instrument, portfolio, date)</text>
    <text x="644" y="292" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Silver Schemas:</tspan> Cleaned, conformed Delta tables ready for dimensional modeling</text>
    <text x="644" y="318" font-size="8.5" font-weight="700" fill="#1D4ED8">Single item simplifies metastore, endpoints, and security management</text>
    <rect x="1080" y="194" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1106" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: WAREHOUSE GOLD & DIRECT LAKE SERVING (NODES 5 TO 7)               -->
  <!-- ========================================================================= -->
  <rect x="40" y="446" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="456" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="470" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: WAREHOUSE GOLD, DIRECT LAKE &amp; BLAST RADIUS GUARD</text>

  <!-- Node 5: blast-radius-warning -->
  <g data-node-id="blast-radius-warning" role="group" tabindex="0" aria-label="Blast-radius risk of merged bronze/silver">
    <title data-node-tooltip="true">Blast-radius risk of merged bronze/silver — One shared Tables namespace means bronze and silver no longer have item-level isolation.</title>
    <rect x="56" y="484" width="340" height="184" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="68" y="494" width="150" height="16" rx="8" fill="#FEE2E2"/><text x="143" y="505" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">ISOLATION WARNING</text>
    <text x="68" y="528" font-size="12" font-weight="700" fill="#991B1B">5 · Blast-Radius Risk of Merged Lakehouse</text>
    <text x="68" y="550" font-size="9" fill="#B91C1C">• Merging Bronze &amp; Silver buys management simplicity</text>
    <text x="68" y="566" font-size="9" fill="#B91C1C">• Trade-off: Tables area is one shared namespace</text>
    <text x="68" y="582" font-size="9" fill="#B91C1C">• Runaway Bronze script can overwrite Silver</text>
    <text x="68" y="608" font-size="8.5" font-weight="700" fill="#DC2626">Split into 2 lakehouses if access roles diverge</text>
    <rect x="332" y="494" width="52" height="14" rx="7" fill="#FEE2E2"/><text x="358" y="504" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">WARNING</text>
  </g>

  <!-- Node 6: dbt-gold-build -->
  <g data-node-id="dbt-gold-build" role="group" tabindex="0" aria-label="dbt-built warehouse gold (Airflow orchestrated)">
    <title data-node-tooltip="true">dbt-built warehouse gold (Airflow orchestrated) — dbt, run by Airflow inside Data Factory, reads silver and builds a star schema in the warehouse.</title>
    <rect x="408" y="484" width="410" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="420" y="494" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="485" y="505" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">WAREHOUSE GOLD</text>
    <text x="420" y="528" font-size="12" font-weight="700" fill="#1E3A8A">6 · dbt-Fabric Star Schema in wh_gold</text>
    <text x="420" y="550" font-size="9" fill="#1E40AF">• Airflow DAG inside Data Factory triggers dbt build</text>
    <text x="420" y="566" font-size="9" fill="#1E40AF">• Reads Silver Delta via 3-part SQL namespace</text>
    <text x="420" y="582" font-size="9" fill="#1E40AF">• Builds Fact (Positions, VaR) &amp; Dim (Instrument SCD2)</text>
    <text x="420" y="608" font-size="8.5" font-weight="700" fill="#1D4ED8">Multi-table ACID transactions &amp; T-SQL modeling surface</text>
    <rect x="754" y="494" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="780" y="504" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 7: direct-lake-power-bi -->
  <g data-node-id="direct-lake-power-bi" role="group" tabindex="0" aria-label="Power BI via Direct Lake">
    <title data-node-tooltip="true">Power BI via Direct Lake — Power BI reads wh_gold's Delta tables straight from OneLake with no import refresh.</title>
    <rect x="830" y="484" width="314" height="184" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="842" y="494" width="110" height="16" rx="8" fill="#CCFBF1"/><text x="897" y="505" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">BI SERVING</text>
    <text x="842" y="528" font-size="12" font-weight="700" fill="#134E4A">7 · Power BI via Direct Lake</text>
    <text x="842" y="550" font-size="9" fill="#115E59">• Reads Gold Delta straight from OneLake</text>
    <text x="842" y="566" font-size="9" fill="#115E59">• Zero import cache; zero scheduled refresh lag</text>
    <text x="842" y="582" font-size="9" fill="#115E59">• Instant visibility of completed dbt builds</text>
    <text x="842" y="608" font-size="8.5" font-weight="700" fill="#0F766E">Sub-second interactive analytical reporting</text>
    <rect x="1080" y="494" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1106" y="504" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: CONTROL PLANE & TELEMETRY RAILS (NODES 8 & 9)                     -->
  <!-- ========================================================================= -->
  <rect x="40" y="696" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="706" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="720" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 3: CONTROL PLANE &amp; OPERATIONAL TELEMETRY RAILS</text>

  <!-- Node 8: control-plane-sqldb -->
  <g data-node-id="control-plane-sqldb" role="group" tabindex="0" aria-label="sqldb_meta control plane">
    <title data-node-tooltip="true">sqldb_meta control plane — A Fabric SQL database records every pipeline and dbt run for cross-path audit.</title>
    <rect x="56" y="734" width="530" height="184" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="68" y="744" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="133" y="755" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">METADATA ENGINE</text>
    <text x="68" y="778" font-size="13" font-weight="700" fill="#134E4A">8 · sqldb_meta: Fabric SQL Database Control Plane</text>
    <text x="68" y="802" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Entity Registry:</tspan> Configures source endpoints, file paths, and watermark states</text>
    <text x="68" y="822" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Run Audit Trail:</tspan> Records start/completion time, rows loaded, and execution status</text>
    <text x="68" y="842" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Engine Type:</tspan> Transactional OLTP SQL Database for robust ACID control logic</text>
    <rect x="522" y="744" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="548" y="754" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- Node 9: telemetry-eventhouse -->
  <g data-node-id="telemetry-eventhouse" role="group" tabindex="0" aria-label="eh_ops Eventhouse (operational telemetry)">
    <title data-node-tooltip="true">eh_ops Eventhouse (operational telemetry) — High-volume, per-event telemetry from ingestion functions lands in an Eventhouse, not the control-plane database.</title>
    <rect x="598" y="734" width="546" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#ima-shadow)"/>
    <rect x="610" y="744" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="675" y="755" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">TELEMETRY SINK</text>
    <text x="610" y="778" font-size="13" font-weight="700" fill="#1E3A8A">9 · eh_ops: Eventhouse Granular Operational Telemetry</text>
    <text x="610" y="802" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Granular Telemetry:</tspan> Absorbs high-volume API retries, network latency, and function logs</text>
    <text x="610" y="822" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">KQL Real-Time Engine:</tspan> Time-series indexed storage prevents OLTP control plane bloat</text>
    <text x="610" y="842" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">OneLake Mirroring:</tspan> Queryable alongside business Delta tables via cross-engine SQL</text>
    <rect x="1080" y="744" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1106" y="754" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="958" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft Fabric Investment Analytics Medallion Reference Pattern.</text>
</svg>
