<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf8"/>
      <stop offset="100%" stop-color="#e2f5f1"/>
    </linearGradient>
    <linearGradient id="onelakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7a6e"/>
      <stop offset="100%" stop-color="#0d5c53"/>
    </linearGradient>
    <linearGradient id="lhBoxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2da896"/>
      <stop offset="100%" stop-color="#1f8c7c"/>
    </linearGradient>
    <linearGradient id="sqlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ba898"/>
      <stop offset="100%" stop-color="#27907f"/>
    </linearGradient>
    <linearGradient id="warehouseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6af0"/>
      <stop offset="100%" stop-color="#3f4ed6"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a7a6e"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#777"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5b6af0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2a9d5c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0d3d35">Fabric Lakehouse — Architecture</text>
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#3a6b63">Delta tables + Files in OneLake · SQL analytics endpoint (read-only T-SQL) · Spark write path · vs Warehouse</text>

  <!-- ═══════════════════════════════════════════════════════
       INGESTION SOURCES (left column)
  ════════════════════════════════════════════════════════════ -->
  <text x="82" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#0d3d35" letter-spacing="1">INGESTION</text>

  <!-- Spark Notebooks -->
  <rect x="18" y="100" width="128" height="34" rx="6" fill="#2da896" filter="url(#shadow)"/>
  <text x="82" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Spark Notebooks</text>
  <text x="82" y="131" text-anchor="middle" font-size="9" fill="#d0f0ec">read / write Delta</text>

  <!-- Pipelines (Copy Activity) -->
  <rect x="18" y="144" width="128" height="34" rx="6" fill="#2da896" filter="url(#shadow)"/>
  <text x="82" y="164" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Pipeline Copy</text>
  <text x="82" y="175" text-anchor="middle" font-size="9" fill="#d0f0ec">Data Factory activity</text>

  <!-- Spark Job Definitions -->
  <rect x="18" y="188" width="128" height="34" rx="6" fill="#2da896" filter="url(#shadow)"/>
  <text x="82" y="208" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Spark Job Definitions</text>
  <text x="82" y="219" text-anchor="middle" font-size="9" fill="#d0f0ec">compiled production ETL</text>

  <!-- Dataflows Gen2 -->
  <rect x="18" y="232" width="128" height="34" rx="6" fill="#2da896" filter="url(#shadow)"/>
  <text x="82" y="252" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Dataflows Gen2</text>
  <text x="82" y="263" text-anchor="middle" font-size="9" fill="#d0f0ec">low-code preparation</text>

  <!-- Shortcuts -->
  <rect x="18" y="276" width="128" height="34" rx="6" fill="#2da896" filter="url(#shadow)"/>
  <text x="82" y="296" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">OneLake Shortcuts</text>
  <text x="82" y="307" text-anchor="middle" font-size="9" fill="#d0f0ec">reference data in-place</text>

  <!-- Arrows from ingestion to lakehouse -->
  <line x1="147" y1="117" x2="212" y2="117" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="147" y1="161" x2="212" y2="161" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="147" y1="205" x2="212" y2="235" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="147" y1="249" x2="212" y2="255" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <line x1="147" y1="293" x2="212" y2="290" stroke="#1a7a6e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- ═══════════════════════════════════════════════════════
       LAKEHOUSE ITEM (centre)
  ════════════════════════════════════════════════════════════ -->
  <rect x="215" y="70" width="380" height="540" rx="14" fill="#ffffff" stroke="#2da896" stroke-width="2" filter="url(#shadow)"/>
  <rect x="215" y="70" width="380" height="40" rx="14" fill="url(#lhBoxGrad)"/>
  <rect x="215" y="96" width="380" height="14" rx="0" fill="url(#lhBoxGrad)"/>
  <text x="405" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Fabric Lakehouse</text>
  <text x="405" y="108" text-anchor="middle" font-size="9.5" fill="#c8f0ea">Spark-first · Delta ACID · unified data + analytics</text>

  <!-- Lakehouse Explorer label -->
  <text x="405" y="127" text-anchor="middle" font-size="10" fill="#0d5c53" font-weight="600">[ Lakehouse Explorer ]</text>

  <!-- OneLake Storage band -->
  <rect x="230" y="134" width="350" height="220" rx="10" fill="url(#onelakeGrad)" filter="url(#shadow)"/>
  <text x="405" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#a8ede6" letter-spacing="1">ONELAKE STORAGE</text>

  <!-- Tables Area -->
  <rect x="244" y="160" width="155" height="178" rx="8" fill="#ffffff18" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="322" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a8ede6">Tables Area</text>
  <text x="322" y="191" text-anchor="middle" font-size="9" fill="#7dd8d0">Delta tables only</text>

  <!-- Delta table boxes -->
  <rect x="256" y="198" width="131" height="26" rx="5" fill="#1f8c7c"/>
  <text x="321" y="215" text-anchor="middle" font-size="10" fill="#fff">delta_table_A</text>
  <rect x="256" y="230" width="131" height="26" rx="5" fill="#1f8c7c"/>
  <text x="321" y="247" text-anchor="middle" font-size="10" fill="#fff">delta_table_B</text>
  <rect x="256" y="262" width="131" height="26" rx="5" fill="#1f8c7c"/>
  <text x="321" y="279" text-anchor="middle" font-size="10" fill="#fff">shortcut → ext Delta</text>

  <!-- Parquet / Delta log labels -->
  <text x="322" y="306" text-anchor="middle" font-size="8.5" fill="#7dd8d0">Parquet + _delta_log/</text>
  <text x="322" y="318" text-anchor="middle" font-size="8.5" fill="#7dd8d0">ACID · time travel · schema</text>

  <!-- Files Area -->
  <rect x="410" y="160" width="155" height="178" rx="8" fill="#ffffff18" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="488" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a8ede6">Files Area</text>
  <text x="488" y="191" text-anchor="middle" font-size="9" fill="#7dd8d0">any format, any depth</text>

  <!-- File type boxes -->
  <rect x="422" y="198" width="131" height="26" rx="5" fill="#1f8c7c"/>
  <text x="487" y="215" text-anchor="middle" font-size="10" fill="#fff">CSV / JSON / Parquet</text>
  <rect x="422" y="230" width="131" height="26" rx="5" fill="#1f8c7c"/>
  <text x="487" y="247" text-anchor="middle" font-size="10" fill="#fff">Images / Video / Text</text>
  <rect x="422" y="262" width="131" height="26" rx="5" fill="#1f8c7c"/>
  <text x="487" y="279" text-anchor="middle" font-size="10" fill="#fff">shortcut (any depth)</text>

  <text x="488" y="306" text-anchor="middle" font-size="8.5" fill="#7dd8d0">Must convert to Delta</text>
  <text x="488" y="318" text-anchor="middle" font-size="8.5" fill="#7dd8d0">to surface in SQL endpoint</text>

  <!-- Metastore auto-discovery label -->
  <rect x="244" y="360" width="321" height="28" rx="6" fill="#0d3d3566"/>
  <text x="405" y="378" text-anchor="middle" font-size="9.5" fill="#a8ede6">Auto-discovery: Delta lands in /tables → metastore registers schema instantly</text>

  <!-- ── SQL Analytics Endpoint ── -->
  <rect x="230" y="400" width="350" height="100" rx="10" fill="url(#sqlGrad)" filter="url(#shadow)"/>
  <text x="405" y="421" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">SQL Analytics Endpoint</text>
  <text x="405" y="436" text-anchor="middle" font-size="9.5" fill="#c8f0ea">Auto-provisioned at lakehouse creation · read-only T-SQL</text>

  <!-- Endpoint capabilities -->
  <rect x="240" y="444" width="100" height="44" rx="6" fill="#ffffff22"/>
  <text x="290" y="461" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">SELECT queries</text>
  <text x="290" y="474" text-anchor="middle" font-size="8.5" fill="#c8f0ea">T-SQL exploration</text>
  <text x="290" y="484" text-anchor="middle" font-size="8.5" fill="#c8f0ea">reporting · ad-hoc</text>

  <rect x="352" y="444" width="100" height="44" rx="6" fill="#ffffff22"/>
  <text x="402" y="461" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">Views / TVFs / Procs</text>
  <text x="402" y="474" text-anchor="middle" font-size="8.5" fill="#c8f0ea">create &amp; persist SQL</text>
  <text x="402" y="484" text-anchor="middle" font-size="8.5" fill="#c8f0ea">objects on endpoint</text>

  <rect x="464" y="444" width="106" height="44" rx="6" fill="#ff4d4d33" stroke="#ff7777" stroke-width="1"/>
  <text x="517" y="461" text-anchor="middle" font-size="9" fill="#ffcccc" font-weight="600">No DML</text>
  <text x="517" y="474" text-anchor="middle" font-size="8.5" fill="#ffaaaa">INSERT / UPDATE /</text>
  <text x="517" y="484" text-anchor="middle" font-size="8.5" fill="#ffaaaa">DELETE blocked</text>

  <!-- Metadata sync arrow -->
  <path d="M322 360 L322 400" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowTeal)"/>
  <text x="331" y="383" font-size="8" fill="#4ecdc4">auto-sync</text>

  <!-- ── Analyze-data-with row ── -->
  <text x="405" y="523" text-anchor="middle" font-size="10" font-weight="700" fill="#0d5c53">"Analyze data with" — switch engine without moving data</text>

  <rect x="230" y="530" width="105" height="36" rx="6" fill="#e8f9f6" stroke="#2da896" stroke-width="1.2"/>
  <text x="283" y="548" text-anchor="middle" font-size="9.5" fill="#0d5c53" font-weight="600">SQL Endpoint</text>
  <text x="283" y="560" text-anchor="middle" font-size="8.5" fill="#3a6b63">T-SQL read-only</text>

  <rect x="348" y="530" width="114" height="36" rx="6" fill="#e8f9f6" stroke="#2da896" stroke-width="1.2"/>
  <text x="405" y="548" text-anchor="middle" font-size="9.5" fill="#0d5c53" font-weight="600">Spark Notebook</text>
  <text x="405" y="560" text-anchor="middle" font-size="8.5" fill="#3a6b63">read + write Delta</text>

  <rect x="475" y="530" width="105" height="36" rx="6" fill="#e8f9f6" stroke="#2da896" stroke-width="1.2"/>
  <text x="528" y="548" text-anchor="middle" font-size="9.5" fill="#0d5c53" font-weight="600">KQL / Eventhouse</text>
  <text x="528" y="560" text-anchor="middle" font-size="8.5" fill="#3a6b63">real-time analytics</text>

  <!-- ── Security note ── -->
  <rect x="230" y="578" width="350" height="24" rx="6" fill="#fff3cd" stroke="#c8a200" stroke-width="1"/>
  <text x="405" y="594" text-anchor="middle" font-size="8.5" fill="#6b5400">SQL endpoint permissions (row/col/object) apply only to the T-SQL path — Spark and OneLake bypass them</text>

  <!-- ═══════════════════════════════════════════════════════
       CONSUMERS (right column, top)
  ════════════════════════════════════════════════════════════ -->
  <text x="835" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#0d3d35" letter-spacing="1">CONSUMERS</text>

  <!-- Power BI -->
  <rect x="772" y="100" width="128" height="34" rx="6" fill="#f2c811" filter="url(#shadow)"/>
  <text x="836" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="600">Power BI Semantic</text>
  <text x="836" y="131" text-anchor="middle" font-size="9" fill="#555">TDS · read-only</text>

  <!-- Reporting tools -->
  <rect x="772" y="144" width="128" height="34" rx="6" fill="#e8ecff" filter="url(#shadow)"/>
  <text x="836" y="164" text-anchor="middle" font-size="11" fill="#3f4ed6" font-weight="600">SQL Clients / Excel</text>
  <text x="836" y="175" text-anchor="middle" font-size="9" fill="#5b6af0">via TDS endpoint</text>

  <!-- Cross-workspace -->
  <rect x="772" y="188" width="128" height="34" rx="6" fill="#e8ecff" filter="url(#shadow)"/>
  <text x="836" y="208" text-anchor="middle" font-size="11" fill="#3f4ed6" font-weight="600">Cross-workspace</text>
  <text x="836" y="219" text-anchor="middle" font-size="9" fill="#5b6af0">Shortcuts + T-SQL join</text>

  <!-- Arrows from SQL endpoint to consumers -->
  <line x1="595" y1="440" x2="770" y2="117" stroke="#777" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <line x1="595" y1="456" x2="770" y2="161" stroke="#777" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <line x1="595" y1="470" x2="770" y2="205" stroke="#777" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>

  <!-- ═══════════════════════════════════════════════════════
       WAREHOUSE COMPARISON (right column, bottom)
  ════════════════════════════════════════════════════════════ -->
  <rect x="765" y="290" width="178" height="248" rx="12" fill="#f3f4fe" stroke="#5b6af0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="765" y="290" width="178" height="36" rx="12" fill="url(#warehouseGrad)"/>
  <rect x="765" y="310" width="178" height="16" fill="url(#warehouseGrad)"/>
  <text x="854" y="311" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Fabric Warehouse</text>
  <text x="854" y="323" text-anchor="middle" font-size="9" fill="#c5caff">T-SQL-first · multi-table txn</text>

  <!-- Shared traits -->
  <text x="854" y="345" text-anchor="middle" font-size="9.5" fill="#3f4ed6" font-weight="700">Shared with Lakehouse</text>
  <rect x="775" y="350" width="158" height="18" rx="4" fill="#e0e3ff"/>
  <text x="854" y="363" text-anchor="middle" font-size="9" fill="#3f4ed6">Same SQL engine (Polaris)</text>
  <rect x="775" y="372" width="158" height="18" rx="4" fill="#e0e3ff"/>
  <text x="854" y="385" text-anchor="middle" font-size="9" fill="#3f4ed6">Delta on OneLake storage</text>

  <!-- Differences -->
  <text x="854" y="408" text-anchor="middle" font-size="9.5" fill="#e53935" font-weight="700">Warehouse Only</text>
  <rect x="775" y="413" width="158" height="18" rx="4" fill="#fce8e8"/>
  <text x="854" y="426" text-anchor="middle" font-size="9" fill="#c62828">Multi-table T-SQL transactions</text>
  <rect x="775" y="435" width="158" height="18" rx="4" fill="#fce8e8"/>
  <text x="854" y="448" text-anchor="middle" font-size="9" fill="#c62828">Full DML (INSERT/UPDATE/DELETE)</text>

  <!-- Lakehouse only -->
  <text x="854" y="470" text-anchor="middle" font-size="9.5" fill="#1a7a6e" font-weight="700">Lakehouse Only</text>
  <rect x="775" y="475" width="158" height="18" rx="4" fill="#d8f5f0"/>
  <text x="854" y="488" text-anchor="middle" font-size="9" fill="#0d5c53">Spark + unstructured files</text>
  <rect x="775" y="497" width="158" height="18" rx="4" fill="#d8f5f0"/>
  <text x="854" y="510" text-anchor="middle" font-size="9" fill="#0d5c53">Files area (any format)</text>
  <rect x="775" y="519" width="158" height="14" rx="4" fill="#d8f5f0"/>
  <text x="854" y="530" text-anchor="middle" font-size="8.5" fill="#0d5c53">No cross-table T-SQL txn</text>

  <!-- Dashed divider between LH and Warehouse boxes -->
  <line x1="765" y1="400" x2="597" y2="400" stroke="#5b6af0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <text x="680" y="395" text-anchor="middle" font-size="8.5" fill="#5b6af0">same SQL engine</text>
  <text x="680" y="406" text-anchor="middle" font-size="8.5" fill="#5b6af0">Delta on OneLake</text>

  <!-- ═══════════════════════════════════════════════════════
       MEDALLION PATTERN note (bottom centre)
  ════════════════════════════════════════════════════════════ -->
  <rect x="215" y="625" width="380" height="58" rx="8" fill="#e8f9f6" stroke="#2da896" stroke-width="1.2"/>
  <text x="405" y="643" text-anchor="middle" font-size="10" font-weight="700" fill="#0d5c53">Recommended Pattern: Medallion + Warehouse</text>
  <text x="405" y="658" text-anchor="middle" font-size="9" fill="#3a6b63">Land and transform raw data in Lakehouse with Spark (Bronze → Silver → Gold),</text>
  <text x="405" y="670" text-anchor="middle" font-size="9" fill="#3a6b63">then surface curated Gold tables through a Warehouse for SQL-centric reporting teams.</text>

  <!-- Arrow from lakehouse bottom to medallion note -->
  <line x1="405" y1="614" x2="405" y2="623" stroke="#2da896" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- ═══════════════════════════════════════════════════════
       LEGEND
  ════════════════════════════════════════════════════════════ -->
  <rect x="18" y="395" width="175" height="142" rx="8" fill="#fff" stroke="#2da896" stroke-width="1" opacity="0.95"/>
  <text x="106" y="413" text-anchor="middle" font-size="10" font-weight="700" fill="#0d5c53">Legend</text>
  <rect x="28" y="420" width="14" height="10" rx="2" fill="#2da896"/>
  <text x="49" y="430" font-size="9" fill="#333">Lakehouse / Spark path</text>
  <rect x="28" y="437" width="14" height="10" rx="2" fill="#1a7a6e"/>
  <text x="49" y="447" font-size="9" fill="#333">OneLake / Delta storage</text>
  <rect x="28" y="454" width="14" height="10" rx="2" fill="#5b6af0"/>
  <text x="49" y="464" font-size="9" fill="#333">Warehouse (compare)</text>
  <line x1="28" y1="478" x2="42" y2="478" stroke="#777" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="49" y="481" font-size="9" fill="#333">Read-only SQL path</text>
  <line x1="28" y1="494" x2="42" y2="494" stroke="#1a7a6e" stroke-width="1.5"/>
  <text x="49" y="497" font-size="9" fill="#333">Write / ingestion path</text>
  <rect x="28" y="508" width="14" height="10" rx="2" fill="#ff4d4d55" stroke="#ff7777" stroke-width="1"/>
  <text x="49" y="518" font-size="9" fill="#333">DML blocked (read-only)</text>

  <!-- Write-path reminder -->
  <rect x="18" y="548" width="175" height="42" rx="8" fill="#fff3cd" stroke="#c8a200" stroke-width="1"/>
  <text x="106" y="564" text-anchor="middle" font-size="9" font-weight="700" fill="#6b5400">Write path = Spark only</text>
  <text x="106" y="576" text-anchor="middle" font-size="8.5" fill="#6b5400">SQL endpoint cannot INSERT,</text>
  <text x="106" y="587" text-anchor="middle" font-size="8.5" fill="#6b5400">UPDATE, or DELETE data.</text>
</svg>
