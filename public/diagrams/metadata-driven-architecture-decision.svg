<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="Segoe UI,Inter,Arial,sans-serif" role="img" aria-labelledby="metadata-driven-architecture-decision-title metadata-driven-architecture-decision-desc" data-diagram-id="metadata-driven-architecture-decision">
 <title id="metadata-driven-architecture-decision-title">Metadata-Driven or Plain Pipeline?</title><desc id="metadata-driven-architecture-decision-desc">The decision starts by asking how many data objects share the same load shape. A single one-off load stays a plain pipeline. Many sources with the same shape justify a metadata-driven framework, but the follow-up question is where the metadata contract lives: alongside the pipeline as simple parameters and a variable library, or in an external governed store when volume and audit requirements grow. Many sources with genuinely different shapes should not be forced into one contract — that path leads to the config-explosion warning this framework is meant to avoid.</desc>
 <defs><linearGradient id="dh" x2="1"><stop stop-color="#312E81"/><stop offset=".52" stop-color="#0369A1"/><stop offset="1" stop-color="#0F766E"/></linearGradient><filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity=".13"/></filter><marker id="da" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#0F766E"/></marker><marker id="dw" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#D97706"/></marker><style>.k{font-size:13px;font-weight:700;letter-spacing:2px}.h1{font-size:34px;font-weight:750}.h2{font-size:19px;font-weight:700}.h3{font-size:15px;font-weight:700}.b{font-size:13px}.s{font-size:12px}.m{font-size:11px}.n{fill:#0F172A}.mu{fill:#475569}.t{fill:#0F766E}.w{fill:#FFF}.flow{fill:none;stroke:#0F766E;stroke-width:3;marker-end:url(#da)}[data-node-id]:focus{outline:none}[data-node-id]:focus>rect,[data-node-id]:focus>.focus-ring{stroke:#2563EB!important;stroke-width:4!important}</style></defs>
 <rect width="1440" height="1000" fill="#F8FAFC"/><rect width="1440" height="166" fill="url(#dh)"/><circle cx="1325" cy="14" r="150" fill="#FFF" opacity=".06"/><text x="64" y="43" class="k" fill="#C4B5FD">FABRIC ATLAS · AUTOMATION DECISION</text><text x="64" y="84" class="h1 w">How much metadata machinery is justified?</text><text x="64" y="118" font-size="17" fill="#D5F5F1">Earn complexity with repeated shapes, operational scale, and audit need — never with ambition alone.</text><g transform="translate(64 137)"><rect width="250" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">SHAPE FIT before source count</text></g><g transform="translate(328 137)"><rect width="255" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">GOVERNANCE before flexibility</text></g>
 <g data-node-id="start-question" transform="translate(64 205)" tabindex="0" aria-label="How many sources, and do they share a load shape?"><title data-node-tooltip="true">How many sources, and do they share a load shape? — The root question: object count and shape similarity, not team size or budget, should drive this decision.</title><rect class="focus-ring" width="410" height="190" rx="23" fill="#FFF" stroke="#5EEAD4" stroke-width="2" filter="url(#ds)"/><rect width="410" height="40" rx="23" fill="#0F766E"/><path d="M0 20h410v20H0z" fill="#0F766E"/><text x="20" y="27" class="s w" font-weight="700">GATE 1 · REPEATABILITY</text><circle cx="55" cy="90" r="28" fill="#CCFBF1"/><path d="M38 80h34M38 91h24M38 102h30" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/><text x="101" y="76" class="h2 n">How many sources—and</text><text x="101" y="100" class="h2 n">do they share one shape?</text><text x="24" y="142" class="s mu">Compare extraction, watermark, validation, and landing</text><text x="24" y="161" class="s mu">semantics. Similar names do not imply similar behavior.</text></g>
 <path d="M474 300h53V234h53" class="flow"/><text x="492" y="222" class="m t">one-off</text>
 <g data-node-id="outcome-one-off" transform="translate(580 195)" tabindex="0" aria-label="Keep it a plain pipeline"><title data-node-tooltip="true">Keep it a plain pipeline — One source, one-off shape: a plain parameterized pipeline is simpler and just as correct.</title><rect class="focus-ring" width="350" height="130" rx="20" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/><circle cx="52" cy="54" r="27" fill="#D1FAE5"/><path d="M40 41l27 13-27 14z" fill="#059669"/><text x="94" y="42" class="h2" fill="#065F46">Plain pipeline</text><text x="94" y="65" class="s mu">One source · unique shape</text><text x="24" y="103" class="s n">Parameterise obvious values; keep control flow visible.</text></g>
 <path d="M474 300h53v139h53" class="flow"/><text x="490" y="425" class="m t">many + same shape</text>
 <g data-node-id="check-scale-governance" transform="translate(580 355)" tabindex="0" aria-label="How much scale and audit rigor is needed?"><title data-node-tooltip="true">How much scale and audit rigor is needed? — Second-order question once metadata-driven is justified: lightweight config vs. externalized governed contract.</title><rect class="focus-ring" width="350" height="178" rx="20" fill="#FFF" stroke="#60A5FA" stroke-width="2" filter="url(#ds)"/><rect width="350" height="38" rx="20" fill="#1D4ED8"/><path d="M0 19h350v19H0z" fill="#1D4ED8"/><text x="18" y="26" class="s w" font-weight="700">GATE 2 · SCALE + AUDIT RIGOR</text><text x="22" y="72" class="h2 n">How much control is required?</text><g transform="translate(22 94)"><rect width="140" height="53" rx="12" fill="#EFF6FF"/><text x="14" y="21" class="m" fill="#1D4ED8">MODEST</text><text x="14" y="39" class="s n">few objects · low audit</text></g><g transform="translate(176 94)"><rect width="152" height="53" rx="12" fill="#F5F3FF"/><text x="14" y="21" class="m" fill="#6D28D9">GOVERNED</text><text x="14" y="39" class="s n">scale · audit · replay</text></g></g>
 <path d="M930 444h54v-80h54" class="flow"/><text x="948" y="353" class="m t">modest</text>
 <g data-node-id="outcome-lightweight-config" transform="translate(1038 280)" tabindex="0" aria-label="Lightweight: pipeline parameters + variable library"><title data-node-tooltip="true">Lightweight: pipeline parameters + variable library — Modest object count, modest audit needs: parameters and a variable library are enough contract.</title><rect class="focus-ring" width="338" height="166" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/><text x="22" y="33" class="h2" fill="#1E40AF">Lightweight configuration</text><text x="22" y="57" class="s mu">Pipeline parameters + variable library</text><g transform="translate(22 82)"><rect width="294" height="52" rx="12" fill="#DBEAFE"/><path d="M17 18h27M17 27h18M17 36h23" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/><text x="61" y="22" class="s n">Small, readable surface</text><text x="61" y="40" class="m mu">No new control plane to operate</text></g></g>
 <path d="M930 444h54v136h54" class="flow"/><text x="948" y="566" class="m t">scale / audit</text>
 <g data-node-id="outcome-externalized-contract" transform="translate(1038 494)" tabindex="0" aria-label="Externalized: versioned contract + run ledger"><title data-node-tooltip="true">Externalized: versioned contract + run ledger — Larger object count or real audit requirements: build the full metadata-driven framework.</title><rect class="focus-ring" width="338" height="190" rx="20" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/><text x="22" y="33" class="h2" fill="#5B21B6">Governed contract</text><text x="22" y="57" class="s mu">Versioned spec + run ledger</text><g transform="translate(22 78)"><rect width="294" height="78" rx="12" fill="#EDE9FE"/><text x="16" y="23" class="s n">✓ schema validation + code review</text><text x="16" y="44" class="s n">✓ watermark + idempotent replay</text><text x="16" y="65" class="s n">✓ evidence + lineage per run</text></g><rect x="22" y="164" width="294" height="18" rx="9" fill="#DDD6FE"/><text x="169" y="177" text-anchor="middle" class="m" fill="#6D28D9">OPERATE IT AS A PRODUCT</text></g>
 <path d="M268 395v333h64" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#dw)"/><text x="285" y="710" class="m" fill="#B45309">many + different shapes</text>
 <g data-node-id="outcome-shape-mismatch-warning" transform="translate(332 704)" tabindex="0" aria-label="Anti-pattern: forcing mismatched shapes into one contract"><title data-node-tooltip="true">Anti-pattern: forcing mismatched shapes into one contract — Many sources, but genuinely different shapes: one contract trying to describe everything becomes the config-explosion failure.</title><rect class="focus-ring" width="1044" height="146" rx="22" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><path d="M28 108l38-72 38 72z" fill="#F59E0B"/><path d="M66 58v27M66 96v3" stroke="#FFF" stroke-width="7" stroke-linecap="round"/><text x="132" y="42" class="h2" fill="#9A3412">Stop: different shapes do not belong in one universal contract</text><text x="132" y="70" class="s" fill="#7C2D12">When each source needs unique branches, expressions, and exception flags, metadata has become hidden code.</text><g transform="translate(132 91)"><rect width="270" height="30" rx="15" fill="#FFEDD5"/><text x="16" y="20" class="s" fill="#9A3412">Split into a few explicit load patterns</text></g><g transform="translate(416 91)"><rect width="250" height="30" rx="15" fill="#FFEDD5"/><text x="16" y="20" class="s" fill="#9A3412">Keep uncommon logic visible</text></g><g transform="translate(680 91)"><rect width="270" height="30" rx="15" fill="#FFEDD5"/><text x="16" y="20" class="s" fill="#9A3412">Review contract growth as a risk</text></g></g>
 <g transform="translate(64 882)"><rect width="1312" height="78" rx="18" fill="#E2E8F0"/><text x="22" y="27" class="h3 n">Decision rule</text><text x="22" y="53" class="s mu">One-off → plain pipeline · repeated shape at modest scale → lightweight config · repeated shape with scale/audit → governed contract · mismatched shapes → separate explicit patterns.</text><rect x="1102" y="18" width="184" height="42" rx="12" fill="#FFF"/><text x="1194" y="35" text-anchor="middle" class="m" fill="#0F766E" font-weight="700">SUCCESS SIGNAL</text><text x="1194" y="51" text-anchor="middle" class="m n">less copied logic, not more config</text></g><text x="1376" y="988" text-anchor="end" class="m" fill="#64748B">Fabric Atlas original · product-neutral vector illustration</text>
</svg>
