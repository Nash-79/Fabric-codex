<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620"
     font-family="Segoe UI, Arial, sans-serif" font-size="13" role="img" aria-labelledby="mirroring-flow-title mirroring-flow-desc" data-diagram-id="mirroring-flow">
  <title id="mirroring-flow-title">Fabric Mirroring from Source to OneLake</title>
  <desc id="mirroring-flow-desc">A supported source supplies a baseline and ongoing changes. Managed mirroring merges them into Delta in OneLake. SQL, Direct Lake, Spark, and other consumers query the replica.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fafa"/>
      <stop offset="100%" stop-color="#e4f4f2"/>
    </linearGradient>
    <linearGradient id="srcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7b6e"/>
      <stop offset="100%" stop-color="#0f5c52"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0a7c73"/>
    </linearGradient>
    <linearGradient id="onelakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="downGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f5c52">
    Fabric Mirroring — Near-Real-Time Replication Architecture
  </text>
  <text x="480" y="57" text-anchor="middle" font-size="11" fill="#4b7a74">
    Fully managed, serverless · No ETL pipelines · Change feed → Delta Lake in OneLake · ~15 s latency
  </text>

  <!-- ══════════════════════════════════════════════
       ZONE 1: SOURCE OPERATIONAL DATABASES (left)
  ══════════════════════════════════════════════ -->
  <rect x="20" y="72" width="168" height="480" rx="10" fill="#0f5c52" opacity="0.08" stroke="#1a7b6e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="104" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#0f5c52">SOURCE DATABASES</text>

  <!-- SQL Server / Azure SQL -->
  <rect x="34" y="100" width="140" height="46" rx="7" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="104" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Azure SQL / SQL Server</text>
  <text x="104" y="136" text-anchor="middle" font-size="10" fill="#a7f3d0">Change Data Capture (CDC)</text>

  <!-- Azure Cosmos DB -->
  <rect x="34" y="158" width="140" height="46" rx="7" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="104" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Azure Cosmos DB</text>
  <text x="104" y="194" text-anchor="middle" font-size="10" fill="#a7f3d0">Change Feed API</text>

  <!-- Snowflake -->
  <rect x="34" y="216" width="140" height="46" rx="7" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="104" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Snowflake</text>
  <text x="104" y="252" text-anchor="middle" font-size="10" fill="#a7f3d0">Table Stream / Change Feed</text>

  <!-- PostgreSQL -->
  <rect x="34" y="274" width="140" height="46" rx="7" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="104" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">PostgreSQL</text>
  <text x="104" y="310" text-anchor="middle" font-size="10" fill="#a7f3d0">Logical Replication Slot</text>

  <!-- Oracle -->
  <rect x="34" y="332" width="140" height="46" rx="7" fill="url(#srcGrad)" filter="url(#shadow)"/>
  <text x="104" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Oracle / SAP</text>
  <text x="104" y="368" text-anchor="middle" font-size="10" fill="#a7f3d0">On-Premises Data Gateway</text>

  <!-- Open Mirroring -->
  <rect x="34" y="390" width="140" height="46" rx="7" fill="#134e48" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="104" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Open Mirroring</text>
  <text x="104" y="426" text-anchor="middle" font-size="10" fill="#a7f3d0">Public API / Custom App</text>

  <!-- Metadata Mirroring note -->
  <rect x="34" y="448" width="140" height="46" rx="7" fill="#134e48" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="104" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Metadata Mirroring</text>
  <text x="104" y="484" text-anchor="middle" font-size="10" fill="#a7f3d0">Databricks / Dremio (shortcut)</text>

  <!-- ══════════════════════════════════════════════
       ZONE 2: MIRRORING ENGINE (centre-left)
  ══════════════════════════════════════════════ -->
  <rect x="220" y="72" width="220" height="480" rx="10" fill="#0d9488" opacity="0.06" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="330" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#0a7c73">MIRRORING ENGINE (managed)</text>

  <!-- Replicator Engine -->
  <rect x="234" y="100" width="192" height="66" rx="8" fill="url(#engineGrad)" filter="url(#shadow)"/>
  <text x="330" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Replicator Engine</text>
  <text x="330" y="138" text-anchor="middle" font-size="10" fill="#ccfbf1">Serverless · No CU cost to replicate</text>
  <text x="330" y="153" text-anchor="middle" font-size="10" fill="#ccfbf1">Adaptive polling · Backoff on low activity</text>

  <!-- Change Feed box -->
  <rect x="234" y="188" width="192" height="56" rx="8" fill="#134e48" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#2dd4bf">Change Feed / CDC</text>
  <text x="330" y="224" text-anchor="middle" font-size="10" fill="#a7f3d0">Captures inserts, updates, deletes</text>
  <text x="330" y="238" text-anchor="middle" font-size="10" fill="#a7f3d0">from source transaction log</text>

  <!-- Landing Zone -->
  <rect x="234" y="260" width="192" height="56" rx="8" fill="#134e48" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">Landing Zone</text>
  <text x="330" y="296" text-anchor="middle" font-size="10" fill="#a7f3d0">Incremental Delta files staged</text>
  <text x="330" y="310" text-anchor="middle" font-size="10" fill="#a7f3d0">for high-frequency merge</text>

  <!-- Latency callout -->
  <rect x="234" y="332" width="192" height="44" rx="8" fill="#052e2a" stroke="#14b8a6" stroke-width="1" filter="url(#shadow)"/>
  <text x="330" y="351" text-anchor="middle" font-size="11" font-weight="600" fill="#5eead4">~15 s end-to-end latency</text>
  <text x="330" y="366" text-anchor="middle" font-size="10" fill="#99f6e4">under optimal conditions</text>

  <!-- SQL Endpoint delay callout -->
  <rect x="234" y="392" width="192" height="44" rx="8" fill="#052e2a" stroke="#6ee7b7" stroke-width="1" filter="url(#shadow)"/>
  <text x="330" y="411" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">SQL Endpoint sync</text>
  <text x="330" y="426" text-anchor="middle" font-size="10" fill="#a7f3d0">adds ~30–60 s additional lag</text>

  <!-- Vacuum / Delta log -->
  <rect x="234" y="452" width="192" height="44" rx="8" fill="#052e2a" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
  <text x="330" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Auto Delta Vacuum</text>
  <text x="330" y="486" text-anchor="middle" font-size="10" fill="#a7f3d0">1-day default retention · Configurable</text>

  <!-- ══════════════════════════════════════════════
       ZONE 3: ONELAKE (centre-right)
  ══════════════════════════════════════════════ -->
  <rect x="472" y="72" width="200" height="480" rx="10" fill="#14b8a6" opacity="0.07" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="572" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#0a7c73">ONELAKE</text>

  <!-- OneLake Delta store -->
  <rect x="486" y="100" width="172" height="90" rx="8" fill="url(#onelakeGrad)" filter="url(#shadow)"/>
  <text x="572" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">OneLake</text>
  <text x="572" y="141" text-anchor="middle" font-size="11" fill="#ccfbf1">Parquet + Delta Lake format</text>
  <text x="572" y="157" text-anchor="middle" font-size="10" fill="#ccfbf1">Current-state live replica</text>
  <text x="572" y="173" text-anchor="middle" font-size="10" fill="#ccfbf1">Free up to 1 TB per CU</text>

  <!-- Mirrored DB item -->
  <rect x="486" y="208" width="172" height="56" rx="8" fill="#0a5c55" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="572" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#2dd4bf">Mirrored Database Item</text>
  <text x="572" y="244" text-anchor="middle" font-size="10" fill="#a7f3d0">Delta tables per source table</text>
  <text x="572" y="258" text-anchor="middle" font-size="10" fill="#a7f3d0">Deletion vectors for DELETEs</text>

  <!-- SQL Analytics Endpoint -->
  <rect x="486" y="280" width="172" height="56" rx="8" fill="#0a5c55" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="572" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">SQL Analytics Endpoint</text>
  <text x="572" y="316" text-anchor="middle" font-size="10" fill="#a7f3d0">T-SQL · 3-part cross-DB queries</text>
  <text x="572" y="330" text-anchor="middle" font-size="10" fill="#a7f3d0">+30–60 s extra sync lag</text>

  <!-- Shortcut (metadata mirroring path) -->
  <rect x="486" y="352" width="172" height="56" rx="8" fill="#0a5c55" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="572" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#6ee7b7">OneLake Shortcut</text>
  <text x="572" y="388" text-anchor="middle" font-size="10" fill="#a7f3d0">Metadata mirroring path</text>
  <text x="572" y="404" text-anchor="middle" font-size="10" fill="#a7f3d0">No data copy · Cross-tenant share</text>

  <!-- Monitoring box -->
  <rect x="486" y="424" width="172" height="56" rx="8" fill="#0a5c55" stroke="#5eead4" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="572" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#5eead4">Workspace Monitoring</text>
  <text x="572" y="460" text-anchor="middle" font-size="10" fill="#a7f3d0">KQL · MirroredDatabaseTable</text>
  <text x="572" y="476" text-anchor="middle" font-size="10" fill="#a7f3d0">Execution · Rows, bytes, errors</text>

  <!-- ══════════════════════════════════════════════
       ZONE 4: DOWNSTREAM ANALYTICS (right)
  ══════════════════════════════════════════════ -->
  <rect x="704" y="72" width="240" height="480" rx="10" fill="#2dd4bf" opacity="0.06" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="824" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#0a7c73">DOWNSTREAM ANALYTICS</text>

  <!-- Power BI Direct Lake -->
  <rect x="718" y="100" width="212" height="66" rx="8" fill="url(#downGrad)" filter="url(#shadow)"/>
  <text x="824" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Power BI</text>
  <text x="824" y="140" text-anchor="middle" font-size="11" fill="#0f5c52">Direct Lake mode</text>
  <text x="824" y="156" text-anchor="middle" font-size="10" fill="#134e48">Near-real-time reporting on Delta</text>

  <!-- Spark / Lakehouse -->
  <rect x="718" y="184" width="212" height="66" rx="8" fill="url(#downGrad)" filter="url(#shadow)"/>
  <text x="824" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Spark / Lakehouse</text>
  <text x="824" y="224" text-anchor="middle" font-size="11" fill="#0f5c52">Read Delta directly</text>
  <text x="824" y="240" text-anchor="middle" font-size="10" fill="#134e48">No extra latency · Freshest data</text>

  <!-- SQL Warehouse / cross-DB -->
  <rect x="718" y="268" width="212" height="66" rx="8" fill="url(#downGrad)" filter="url(#shadow)"/>
  <text x="824" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Fabric Warehouse / SQL</text>
  <text x="824" y="308" text-anchor="middle" font-size="11" fill="#0f5c52">3-part cross-DB T-SQL queries</text>
  <text x="824" y="324" text-anchor="middle" font-size="10" fill="#134e48">Spans mirror + warehouse + lakehouse</text>

  <!-- Eventhouse / KQL -->
  <rect x="718" y="352" width="212" height="66" rx="8" fill="url(#downGrad)" filter="url(#shadow)"/>
  <text x="824" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Eventhouse / KQL</text>
  <text x="824" y="392" text-anchor="middle" font-size="11" fill="#0f5c52">Workspace Monitoring logs</text>
  <text x="824" y="408" text-anchor="middle" font-size="10" fill="#134e48">Replication telemetry · Not default</text>

  <!-- Immutable history note -->
  <rect x="718" y="436" width="212" height="66" rx="8" fill="#052e2a" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#shadow)"/>
  <text x="824" y="458" text-anchor="middle" font-size="12" font-weight="600" fill="#6ee7b7">Append-only Ingestion</text>
  <text x="824" y="476" text-anchor="middle" font-size="10" fill="#a7f3d0">Pair with mirroring for immutable</text>
  <text x="824" y="492" text-anchor="middle" font-size="10" fill="#a7f3d0">history (mirroring alone cannot)</text>

  <!-- ══════════════════════════════════════════════
       ARROWS: Sources → Engine
  ══════════════════════════════════════════════ -->
  <!-- SQL -->
  <line x1="174" y1="123" x2="232" y2="133" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Cosmos -->
  <line x1="174" y1="181" x2="232" y2="155" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Snowflake -->
  <line x1="174" y1="239" x2="232" y2="165" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- PostgreSQL -->
  <line x1="174" y1="297" x2="232" y2="165" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Oracle -->
  <line x1="174" y1="355" x2="232" y2="155" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Open Mirroring -->
  <line x1="174" y1="413" x2="232" y2="215" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <!-- Metadata Mirroring (shortcut path — dashed) -->
  <line x1="174" y1="471" x2="484" y2="380" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════
       ARROWS: Engine internals
  ══════════════════════════════════════════════ -->
  <line x1="330" y1="166" x2="330" y2="186" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="244" x2="330" y2="258" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════
       ARROWS: Engine → OneLake
  ══════════════════════════════════════════════ -->
  <!-- Landing zone → OneLake Delta -->
  <line x1="426" y1="290" x2="484" y2="240" stroke="#14b8a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Landing zone → OneLake (main) -->
  <line x1="426" y1="275" x2="484" y2="170" stroke="#14b8a6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════
       ARROWS: OneLake → Downstream
  ══════════════════════════════════════════════ -->
  <!-- OneLake → Power BI Direct Lake -->
  <line x1="658" y1="145" x2="716" y2="133" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Mirrored DB → Spark -->
  <line x1="658" y1="234" x2="716" y2="217" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- SQL Endpoint → Warehouse -->
  <line x1="658" y1="308" x2="716" y2="301" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Monitoring → Eventhouse -->
  <line x1="658" y1="452" x2="716" y2="385" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════
       LEGEND / FOOTER
  ══════════════════════════════════════════════ -->
  <rect x="20" y="565" width="920" height="44" rx="7" fill="#052e2a" opacity="0.7"/>
  <line x1="40" y1="580" x2="80" y2="580" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="88" y="584" font-size="10" fill="#ccfbf1">Database mirroring (data copy)</text>
  <line x1="240" y1="580" x2="280" y2="580" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="288" y="584" font-size="10" fill="#ccfbf1">Open mirroring (API push)</text>
  <line x1="440" y1="580" x2="480" y2="580" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrow)"/>
  <text x="488" y="584" font-size="10" fill="#ccfbf1">Metadata mirroring (shortcut, no data copy)</text>
  <text x="40" y="601" font-size="10" fill="#5eead4">Security: Source RLS/CLS/masking NOT inherited — rebuild at Fabric layer.
  </text>
  <text x="490" y="601" font-size="10" fill="#5eead4">Not a DR backup — source corruption replicates. Not append-only.</text>

  <!-- Full-region keyboard and pointer targets; metadata comes from the evidence sidecar. -->
  <g data-node-id="step-1" role="group" tabindex="0" aria-label="Operational source">
    <title data-node-tooltip="true">Operational source — A supported database remains the transactional system of record.</title>
    <rect x="20.0" y="72.0" width="168.0" height="480.0" rx="10.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-2" role="group" tabindex="0" aria-label="Initial snapshot">
    <title data-node-tooltip="true">Initial snapshot — Mirroring establishes a baseline before ongoing changes are meaningful.</title>
    <rect x="234.0" y="260.0" width="192.0" height="56.0" rx="8.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-3" role="group" tabindex="0" aria-label="Managed change replication">
    <title data-node-tooltip="true">Managed change replication — Fabric continuously applies source changes without user-authored ETL.</title>
    <rect x="220.0" y="72.0" width="220.0" height="480.0" rx="10.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-4" role="group" tabindex="0" aria-label="OneLake Delta replica">
    <title data-node-tooltip="true">OneLake Delta replica — Replicated data is stored as Delta away from transaction processing.</title>
    <rect x="470.0" y="72.0" width="202.0" height="480.0" rx="10.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-5" role="group" tabindex="0" aria-label="Analytical consumers">
    <title data-node-tooltip="true">Analytical consumers — SQL, Direct Lake, Spark, and other workloads read the replica.</title>
    <rect x="704.0" y="72.0" width="240.0" height="480.0" rx="10.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
</svg>
