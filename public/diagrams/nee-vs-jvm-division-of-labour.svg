<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="nee-vs-jvm-division-of-labour-title nee-vs-jvm-division-of-labour-desc" data-diagram-id="nee-vs-jvm-division-of-labour">
  <title id="nee-vs-jvm-division-of-labour-title">Native Execution Engine and JVM Spark: how they divide one query</title>
  <desc id="nee-vs-jvm-division-of-labour-desc">How Native Execution Engine and JVM Spark divide execution in Microsoft Fabric. Planning, scheduling, memory, and OneLake Delta storage are 100% shared; execution branches per operator into JVM Tungsten vs Native Velox C++; known divergences and alternating boundary conversion costs.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="div-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="div-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="div-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366F1"/>
    </marker>
    <marker id="div-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="div-arr-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>

    <!-- Official Microsoft Notebook Item Icon Gradients -->
    <linearGradient id="div-nb-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="div-nb-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#4BA446"/><stop offset="1" stop-color="#3F7D35"/></linearGradient>
    <linearGradient id="div-nb-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="div-nb-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="730" fill="#F8FAFC"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#div-head)"/>
  <g data-official-icon="microsoft" data-icon-name="notebook_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#div-nb-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#div-nb-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#div-nb-c)" d="M17.494 8.521a.5.5 0 0 1 .335.623l-2.7 9a.5.5 0 1 1-.957-.287l2.7-9a.5.5 0 0 1 .622-.336"/>
      <path fill="url(#div-nb-c)" d="M18.797 10.446a.5.5 0 0 1 .707 0l2.63 2.63a.6.6 0 0 1 0 .848l-2.63 2.63a.5.5 0 0 1-.707-.708l2.346-2.346-2.346-2.347a.5.5 0 0 1 0-.707"/>
      <path fill="url(#div-nb-c)" d="M12.496 10.446a.5.5 0 1 1 .707.707L10.857 13.5l2.346 2.346a.5.5 0 0 1-.707.707l-2.63-2.629a.6.6 0 0 1 0-.848z"/>
      <path fill="url(#div-nb-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">NEE vs JVM Spark — Division of Labour in One Query</text>
  <text x="40" y="64" font-size="12" fill="#E0E7FF">Planning, scheduling &amp; storage are 100% shared · Execution routes per operator · Boundary costs &amp; divergences</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="20" cy="15" r="5" fill="#4F46E5"/><text x="32" y="19" fill="#312E81" font-weight="600">Shared Control Plane</text>
    <circle cx="200" cy="15" r="5" fill="#2563EB"/><text x="212" y="19" fill="#1E40AF" font-weight="600">JVM Tungsten Path</text>
    <circle cx="380" cy="15" r="5" fill="#059669"/><text x="392" y="19" fill="#065F46" font-weight="600">Native Velox C++ Path</text>
    <circle cx="580" cy="15" r="5" fill="#DC2626"/><text x="592" y="19" fill="#991B1B" font-weight="600">Correctness Divergence Warning</text>
    <circle cx="830" cy="15" r="5" fill="#D97706"/><text x="842" y="19" fill="#92400E" font-weight="600">Boundary Conversion</text>
    <text x="1100" y="19" text-anchor="end" fill="#64748B">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 1: SHARED FOUNDATION (Planning, Scheduling, Storage)                -->
  <!-- ========================================================================= -->
  <rect x="40" y="148" width="1120" height="136" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.4"/>
  <rect x="56" y="158" width="380" height="20" rx="10" fill="#E0E7FF"/>
  <text x="66" y="172" font-size="10.5" font-weight="700" fill="#3730A3" letter-spacing="1px">LAYER 1: SHARED CONTROL PLANE &amp; STORAGE CONTRACT (100% IDENTICAL)</text>

  <!-- Node: shared -->
  <g data-node-id="shared" role="group" tabindex="0" aria-label="Planning, scheduling and memory">
    <title data-node-tooltip="true">Planning, scheduling and memory — Planning, scheduling, shuffle and memory management are identical on both paths.</title>
    <rect x="56" y="186" width="510" height="84" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5" filter="url(#div-shadow)"/>
    <rect x="70" y="198" width="100" height="16" rx="8" fill="#E0E7FF"/><text x="120" y="209" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4338CA">CONTROL PLANE</text>
    <text x="180" y="211" font-size="13" font-weight="700" fill="#1E1B4B">Planning, Scheduling &amp; Memory</text>
    <text x="70" y="234" font-size="10" fill="#3730A3">• Catalyst optimizer &amp; AQE partition coalescing run identically</text>
    <text x="70" y="252" font-size="10" fill="#3730A3">• DAG Scheduler, task slots, dynamic allocation &amp; shuffle unchanged</text>
    <rect x="500" y="196" width="52" height="15" rx="7.5" fill="#E0E7FF"/><text x="526" y="207" text-anchor="middle" font-size="8.5" font-weight="700" fill="#3730A3">FACT</text>
  </g>

  <!-- Node: storage -->
  <g data-node-id="storage" role="group" tabindex="0" aria-label="Storage and correctness contracts">
    <title data-node-tooltip="true">Storage and correctness contracts — Both paths read and write the same OneLake Delta tables with the same semantics.</title>
    <rect x="630" y="186" width="510" height="84" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5" filter="url(#div-shadow)"/>
    <rect x="644" y="198" width="80" height="16" rx="8" fill="#E0E7FF"/><text x="684" y="209" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4338CA">STORAGE</text>
    <text x="734" y="211" font-size="13" font-weight="700" fill="#1E1B4B">OneLake Delta Lake Contracts</text>
    <text x="644" y="234" font-size="10" fill="#3730A3">• Reads/writes the same Parquet/Delta tables in OneLake</text>
    <text x="644" y="252" font-size="10" fill="#3730A3">• ACID transaction log &amp; time travel protocol completely identical</text>
    <rect x="1074" y="196" width="52" height="15" rx="7.5" fill="#E0E7FF"/><text x="1100" y="207" text-anchor="middle" font-size="8.5" font-weight="700" fill="#3730A3">FACT</text>
  </g>

  <!-- Connector: Shared -> Storage -->
  <path d="M 566 228 H 630" stroke="#6366F1" stroke-width="2.2" fill="none" marker-end="url(#div-arr-purple)"/>

  <!-- ========================================================================= -->
  <!-- LAYER 2: PHYSICAL DATA PLANE (JVM vs Velox vs Divergence)                 -->
  <!-- ========================================================================= -->
  <rect x="40" y="298" width="1120" height="174" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="56" y="308" width="370" height="20" rx="10" fill="#F1F5F9"/>
  <text x="66" y="322" font-size="10.5" font-weight="700" fill="#334155" letter-spacing="1px">LAYER 2: PHYSICAL EXECUTION SPLIT &amp; NUMERIC EDGES</text>

  <!-- Node: jvmway -->
  <g data-node-id="jvmway" role="group" tabindex="0" aria-label="JVM / Tungsten path">
    <title data-node-tooltip="true">JVM / Tungsten path — The JVM path executes row-at-a-time with whole-stage codegen and covers every operator.</title>
    <rect x="56" y="336" width="340" height="120" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6" filter="url(#div-shadow)"/>
    <rect x="70" y="348" width="80" height="16" rx="8" fill="#DBEAFE"/><text x="110" y="359" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">JVM ENGINE</text>
    <text x="160" y="361" font-size="13" font-weight="700" fill="#1E3A8A">JVM / Tungsten Path</text>
    <text x="70" y="384" font-size="10" fill="#1E40AF">• Row-at-a-time execution model</text>
    <text x="70" y="402" font-size="10" fill="#1E40AF">• Whole-stage Java bytecode generation</text>
    <text x="70" y="420" font-size="10" fill="#1E40AF">• Universal coverage: 100% of operators supported</text>
    <rect x="70" y="432" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="96" y="442" text-anchor="middle" font-size="8" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node: neeway -->
  <g data-node-id="neeway" role="group" tabindex="0" aria-label="Native / Velox path">
    <title data-node-tooltip="true">Native / Velox path — The native path executes columnar batches with vectorized C++ but covers only supported operators.</title>
    <rect x="426" y="336" width="340" height="120" rx="10" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8" filter="url(#div-shadow)"/>
    <rect x="440" y="348" width="80" height="16" rx="8" fill="#D1FAE5"/><text x="480" y="359" text-anchor="middle" font-size="8.5" font-weight="700" fill="#047857">C++ ENGINE</text>
    <text x="530" y="361" font-size="13" font-weight="700" fill="#064E3B">Native / Velox C++ Path</text>
    <text x="440" y="384" font-size="10" fill="#065F46">• Vectorized SIMD columnar execution</text>
    <text x="440" y="402" font-size="10" fill="#065F46">• Columnar batches with zero Java object per row</text>
    <text x="440" y="420" font-size="10" fill="#065F46">• Significant CPU cache locality &amp; throughput gains</text>
    <rect x="440" y="432" width="52" height="14" rx="7" fill="#D1FAE5"/><text x="466" y="442" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">FACT</text>
  </g>

  <!-- Node: divergence -->
  <g data-node-id="divergence" role="group" tabindex="0" aria-label="Known correctness divergences">
    <title data-node-tooltip="true">Known correctness divergences — A small set of documented behaviours differ between Velox and vanilla Spark.</title>
    <rect x="796" y="336" width="348" height="120" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8" filter="url(#div-shadow)"/>
    <rect x="810" y="348" width="90" height="16" rx="8" fill="#FEF3C7"/><text x="855" y="359" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">DIVERGENCE</text>
    <text x="910" y="361" font-size="13" font-weight="700" fill="#78350F">Numeric/Type Edges</text>
    <text x="810" y="384" font-size="10" fill="#92400E">• <tspan font-family="monospace">DECIMAL</tspan> ➔ <tspan font-family="monospace">FLOAT</tspan> casting precision diff</text>
    <text x="810" y="402" font-size="10" fill="#92400E">• <tspan font-family="monospace">round()</tspan> uses C++ stdlib vs Spark custom</text>
    <text x="810" y="420" font-size="10" fill="#92400E">• <tspan font-family="monospace">collect_list</tspan> intermediate type: ARRAY vs BINARY</text>
    <rect x="810" y="432" width="60" height="14" rx="7" fill="#FEF3C7"/><text x="840" y="442" text-anchor="middle" font-size="8" font-weight="700" fill="#B45309">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 3: OPERATOR ALTERNATION & SELECTION STRATEGY                        -->
  <!-- ========================================================================= -->
  <rect x="40" y="486" width="1120" height="166" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="56" y="496" width="370" height="20" rx="10" fill="#E2E8F0"/>
  <text x="66" y="510" font-size="10.5" font-weight="700" fill="#1E293B" letter-spacing="1px">LAYER 3: ONE PLAN, OPERATOR ROUTING &amp; WORKLOAD SELECTION</text>

  <!-- Node: mix -->
  <g data-node-id="mix" role="group" tabindex="0" aria-label="One plan, per-operator routing">
    <title data-node-tooltip="true">One plan, per-operator routing — A single query routinely runs partly native and partly JVM, paying a conversion at each boundary.</title>
    <rect x="56" y="524" width="510" height="114" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#div-shadow)"/>
    <rect x="70" y="536" width="100" height="16" rx="8" fill="#F1F5F9"/><text x="120" y="547" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">HYBRID PLAN</text>
    <text x="180" y="549" font-size="13" font-weight="700" fill="#0F172A">Per-Operator Mixed Execution</text>
    <text x="70" y="572" font-size="10" fill="#334155">• Queries routinely run partly Native and partly JVM</text>
    <text x="70" y="590" font-size="10" fill="#334155">• Conversion boundary: <tspan font-family="monospace">VeloxColumnarToRowExec</tspan> inserted</text>
    <!-- Visual alternation ribbon -->
    <g transform="translate(70,604)">
      <rect x="0" y="0" width="100" height="16" rx="4" fill="#059669"/><text x="50" y="11" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Scan (Native)</text>
      <rect x="106" y="0" width="46" height="16" rx="4" fill="#D97706"/><text x="129" y="11" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">Conv</text>
      <rect x="158" y="0" width="110" height="16" rx="4" fill="#2563EB"/><text x="213" y="11" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">PyUDF (JVM)</text>
      <rect x="274" y="0" width="46" height="16" rx="4" fill="#D97706"/><text x="297" y="11" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">Conv</text>
      <rect x="326" y="0" width="100" height="16" rx="4" fill="#059669"/><text x="376" y="11" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Agg (Native)</text>
    </g>
  </g>

  <!-- Node: choose -->
  <g data-node-id="choose" role="group" tabindex="0" aria-label="Choosing deliberately">
    <title data-node-tooltip="true">Choosing deliberately — Native execution suits compute-bound work; ANSI mode forces a per-workload decision on Runtime 2.0.</title>
    <rect x="630" y="524" width="510" height="114" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#div-shadow)"/>
    <rect x="644" y="536" width="90" height="16" rx="8" fill="#F1F5F9"/><text x="689" y="547" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">DECISION</text>
    <text x="744" y="549" font-size="13" font-weight="700" fill="#0F172A">Choosing Compute Deliberately</text>
    <text x="644" y="572" font-size="10" fill="#334155">• Compute-intensive scans &amp; aggregates benefit most from NEE</text>
    <text x="644" y="590" font-size="10" fill="#334155">• Small lookups / single-row queries faster on Pandas/JVM</text>
    <text x="644" y="608" font-size="10" fill="#334155">• Runtime 2.0 ANSI default forces conscious speed vs standard tradeoff</text>
    <rect x="1074" y="536" width="52" height="14" rx="7" fill="#E2E8F0"/><text x="1100" y="546" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">PATTERN</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="682" text-anchor="end" font-size="9.5" fill="#64748B">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft Learn: Native Execution Engine for Fabric Data Engineering.</text>
</svg>
