<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Grounded in OneLake claims: one-logical-lake (e8dab8a2, 6af8b8dde79e), Delta-Parquet
       (f78980ba7685, 9abf24fc62fc), shortcuts virtualizing external sources
       (3ac3e5f9bc04, 7418bde27505, 1f6952fb3f0e, 32d681b2032e, c228b78a9400),
       security model (10057792fa6b, 7b8a99e4876b, 2c6296236f89, 0b4898e396a4,
       b49894d38214, 3e9b8d957ba3), namespace/ADLS API compat (5a610b2fbede,
       982f7f015c9b), governance (092bc380891f). -->
  <defs>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0B5E50"/>
      <stop offset="0.5"  stop-color="#117865"/>
      <stop offset="1"    stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="secGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063D3B"/>
      <stop offset="1" stop-color="#0E6961"/>
    </linearGradient>
    <linearGradient id="nsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF7F2"/>
      <stop offset="1" stop-color="#D2EFE6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8886"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#063D3B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="780" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="650" fill="#063D3B">OneLake — Architecture and Concept</text>
  <text x="40" y="66" font-size="12" fill="#616161">One logical lake per tenant · Delta-Parquet open format · Shortcuts virtualize external stores · Hierarchical security</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 1: NAMESPACE / HIERARCHY
       ═══════════════════════════════════════════ -->
  <text x="40" y="100" font-size="11" letter-spacing="1.5" fill="#8A8886">NAMESPACE HIERARCHY  (tenant → workspace → item → data)</text>

  <!-- tenant box -->
  <rect x="40" y="110" width="1122" height="172" rx="10" fill="url(#lakeGrad)"/>
  <text x="70" y="140" font-size="18" font-weight="650" fill="#FFFFFF">OneLake  (one per tenant — cannot be deleted or duplicated)</text>
  <text x="70" y="162" font-size="11" fill="#C8F0E8">Layered on ADLS Gen2 · exposes the same ADLS Gen2 REST APIs and SDKs · single file-system namespace spanning regions and clouds</text>

  <!-- workspace folder A -->
  <rect x="70" y="176" width="260" height="90" rx="8" fill="#1A9E85" fill-opacity="0.55"/>
  <text x="200" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Workspace A</text>
  <rect x="86"  y="210" width="100" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="136" y="232" text-anchor="middle" font-size="10" fill="#E8FBF5">Lakehouse</text>
  <text x="136" y="247" text-anchor="middle" font-size="9"  fill="#C8F0E8">/Tables  /Files</text>
  <rect x="196" y="210" width="118" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="255" y="232" text-anchor="middle" font-size="10" fill="#E8FBF5">Warehouse</text>
  <text x="255" y="247" text-anchor="middle" font-size="9"  fill="#C8F0E8">Delta on OneLake</text>

  <!-- workspace folder B -->
  <rect x="350" y="176" width="260" height="90" rx="8" fill="#1A9E85" fill-opacity="0.55"/>
  <text x="480" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Workspace B</text>
  <rect x="366" y="210" width="100" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="416" y="232" text-anchor="middle" font-size="10" fill="#E8FBF5">Lakehouse</text>
  <text x="416" y="247" text-anchor="middle" font-size="9"  fill="#C8F0E8">/Tables  /Files</text>
  <rect x="476" y="210" width="118" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="535" y="232" text-anchor="middle" font-size="10" fill="#E8FBF5">KQL Database</text>
  <text x="535" y="247" text-anchor="middle" font-size="9"  fill="#C8F0E8">Delta on OneLake</text>

  <!-- workspace N -->
  <rect x="630" y="176" width="160" height="90" rx="8" fill="#1A9E85" fill-opacity="0.35"/>
  <text x="710" y="218" text-anchor="middle" font-size="12" fill="#FFFFFF">Workspace …</text>
  <text x="710" y="240" text-anchor="middle" font-size="10" fill="#C8F0E8">any number of workspaces</text>
  <text x="710" y="256" text-anchor="middle" font-size="10" fill="#C8F0E8">act as folders</text>

  <!-- ADLS compat callout -->
  <rect x="820" y="178" width="318" height="84" rx="7" fill="#063D3B" fill-opacity="0.72"/>
  <text x="979" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#25FFD4">ADLS Gen2 API surface</text>
  <text x="979" y="217" text-anchor="middle" font-size="10" fill="#C8F0E8">Tenant → one giant storage account</text>
  <text x="979" y="233" text-anchor="middle" font-size="10" fill="#C8F0E8">Workspace → container  |  Item → folder</text>
  <text x="979" y="249" text-anchor="middle" font-size="10" fill="#C8F0E8">Azure Databricks reads/writes without code changes</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 2: DELTA-PARQUET  +  ONE-COPY MODEL
       ═══════════════════════════════════════════ -->
  <text x="40" y="306" font-size="11" letter-spacing="1.5" fill="#8A8886">OPEN FORMAT  &amp;  ONE-COPY MULTI-ENGINE MODEL</text>

  <!-- delta parquet block -->
  <rect x="40" y="316" width="480" height="100" rx="9" fill="url(#nsGrad)" stroke="#9AD2C5"/>
  <text x="60" y="343" font-size="13" font-weight="600" fill="#063D3B">Delta Parquet — the universal currency</text>
  <text x="60" y="363" font-size="11" fill="#424242">All managed tables in lakehouses and warehouses persist as</text>
  <text x="60" y="379" font-size="11" fill="#424242">Delta Parquet, regardless of which engine wrote the data.</text>
  <text x="60" y="395" font-size="11" fill="#424242">ACID · time-travel · schema enforcement · open-source format</text>
  <text x="60" y="411" font-size="10" fill="#797775">Claims: f78980ba7685, 9abf24fc62fc, c125c5e27093</text>

  <!-- engines that share the one copy -->
  <rect x="560" y="316" width="602" height="100" rx="9" fill="url(#nsGrad)" stroke="#9AD2C5"/>
  <text x="580" y="343" font-size="13" font-weight="600" fill="#063D3B">One copy — every engine reads the same physical files</text>

  <!-- engine badges -->
  <g>
    <rect x="580" y="354" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="625" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">T-SQL</text>
    <text x="625" y="394" text-anchor="middle" font-size="9"  fill="#3F6259">Warehouse /</text>
    <text x="625" y="406" text-anchor="middle" font-size="9"  fill="#3F6259">SQL endpoint</text>

    <rect x="680" y="354" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="725" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Spark</text>
    <text x="725" y="394" text-anchor="middle" font-size="9"  fill="#3F6259">Notebooks /</text>
    <text x="725" y="406" text-anchor="middle" font-size="9"  fill="#3F6259">Job defs</text>

    <rect x="780" y="354" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="830" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Analysis Svc</text>
    <text x="830" y="394" text-anchor="middle" font-size="9"  fill="#3F6259">Direct Lake</text>
    <text x="830" y="406" text-anchor="middle" font-size="9"  fill="#3F6259">Power BI</text>

    <rect x="890" y="354" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="940" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">KQL</text>
    <text x="940" y="394" text-anchor="middle" font-size="9"  fill="#3F6259">Real-Time</text>
    <text x="940" y="406" text-anchor="middle" font-size="9"  fill="#3F6259">Intelligence</text>

    <rect x="1000" y="354" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="1070" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">ADLS clients</text>
    <text x="1070" y="394" text-anchor="middle" font-size="9"  fill="#3F6259">Databricks / ADF /</text>
    <text x="1070" y="406" text-anchor="middle" font-size="9"  fill="#3F6259">custom ADLS SDK</text>
  </g>

  <!-- arrow from engines to delta parquet -->
  <line x1="560" y1="366" x2="524" y2="366" stroke="#2AAC94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="536" y="361" font-size="9" fill="#617775">read/write</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 3: SHORTCUTS
       ═══════════════════════════════════════════ -->
  <text x="40" y="446" font-size="11" letter-spacing="1.5" fill="#8A8886">SHORTCUTS — ZERO-COPY VIRTUALIZATION OF EXTERNAL STORES</text>

  <!-- shortcut concept box -->
  <rect x="40" y="456" width="480" height="106" rx="9" fill="#F3F2F1" stroke="#C8C6C4"/>
  <text x="60" y="480" font-size="13" font-weight="600" fill="#063D3B">How a shortcut works</text>
  <text x="60" y="500" font-size="11" fill="#424242">A shortcut is an embedded pointer — like a symbolic link — that</text>
  <text x="60" y="516" font-size="11" fill="#424242">surfaces remote files/folders as if they were local OneLake paths.</text>
  <text x="60" y="532" font-size="11" fill="#424242">Deleting the shortcut leaves target data intact. Writes through a</text>
  <text x="60" y="548" font-size="11" fill="#424242">shortcut propagate to the target store (write-through).</text>

  <!-- shortcut sources: external -->
  <text x="560" y="476" font-size="11" font-weight="600" fill="#424242">External shortcut targets</text>
  <g>
    <rect x="560" y="482" width="108" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
    <text x="614" y="507" text-anchor="middle" font-size="11" fill="#424242">ADLS Gen2</text>
    <text x="614" y="523" text-anchor="middle" font-size="9"  fill="#797775">cloud connection</text>

    <rect x="678" y="482" width="90" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
    <text x="723" y="507" text-anchor="middle" font-size="11" fill="#424242">Amazon S3</text>
    <text x="723" y="523" text-anchor="middle" font-size="9"  fill="#797775">cloud connection</text>

    <rect x="778" y="482" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
    <text x="824" y="503" text-anchor="middle" font-size="11" fill="#424242">Google Cloud</text>
    <text x="824" y="519" text-anchor="middle" font-size="11" fill="#424242">Storage</text>
    <text x="824" y="532" text-anchor="middle" font-size="9"  fill="#797775">cached egress</text>

    <rect x="880" y="482" width="88" height="52" rx="6" fill="#FFFFFF" stroke="#C8C6C4" stroke-dasharray="4 3"/>
    <text x="924" y="507" text-anchor="middle" font-size="11" fill="#424242">Dataverse</text>
    <text x="924" y="523" text-anchor="middle" font-size="9"  fill="#797775">cloud connection</text>

    <rect x="978" y="482" width="120" height="52" rx="6" fill="#EAF7F2" stroke="#9AD2C5" stroke-dasharray="4 3"/>
    <text x="1038" y="504" text-anchor="middle" font-size="11" fill="#063D3B">Other OneLake</text>
    <text x="1038" y="520" text-anchor="middle" font-size="10" fill="#3F6259">workspaces /</text>
    <text x="1038" y="534" text-anchor="middle" font-size="9"  fill="#3F6259">cross-tenant</text>
  </g>

  <!-- dashed arrows from external targets up to onelake shortcut -->
  <g stroke="#8A8886" stroke-width="1.2" stroke-dasharray="5 3">
    <line x1="614"  y1="482" x2="300" y2="566" marker-end="url(#arrGray)"/>
    <line x1="723"  y1="482" x2="320" y2="566" marker-end="url(#arrGray)"/>
    <line x1="824"  y1="482" x2="340" y2="566" marker-end="url(#arrGray)"/>
    <line x1="924"  y1="482" x2="360" y2="566" marker-end="url(#arrGray)"/>
    <line x1="1038" y1="482" x2="380" y2="566" marker-end="url(#arrGray)"/>
  </g>

  <!-- shortcut inside OneLake (result) -->
  <rect x="40" y="566" width="480" height="60" rx="8" fill="#EAF7F2" stroke="#117865"/>
  <text x="60" y="589" font-size="12" font-weight="600" fill="#063D3B">Shortcut path in OneLake (looks like a local folder)</text>
  <text x="60" y="607" font-size="10" fill="#3F6259">Transparent to Spark, T-SQL, KQL, Analysis Svc, ADLS SDK — no special read logic needed · up to 100,000 per item</text>

  <!-- caching callout -->
  <rect x="560" y="556" width="602" height="70" rx="8" fill="#EAF7F2" stroke="#2AAC94"/>
  <text x="580" y="576" font-size="12" font-weight="600" fill="#063D3B">Cross-cloud caching (GCS, S3, S3-compatible, on-prem gateway)</text>
  <text x="580" y="594" font-size="10" fill="#3F6259">Frequently-read files cached per workspace · configurable 1-28 day retention · resets on each access</text>
  <text x="580" y="610" font-size="10" fill="#3F6259">Files &gt; 1 GB not cached · newer remote version triggers refresh · reduces egress costs</text>

  <!-- ═══════════════════════════════════════════════
       SECTION 4: SECURITY MODEL
       ═══════════════════════════════════════════ -->
  <text x="40" y="660" font-size="11" letter-spacing="1.5" fill="#8A8886">SECURITY MODEL — TWO PLANES · HIERARCHICAL INHERITANCE</text>

  <!-- security planes -->
  <rect x="40"  y="670" width="280" height="88" rx="8" fill="url(#secGrad)"/>
  <text x="180" y="693" text-anchor="middle" font-size="12" font-weight="600" fill="#25FFD4">Control plane</text>
  <text x="180" y="712" text-anchor="middle" font-size="10" fill="#C8F0E8">Who can create / manage / share items</text>
  <text x="180" y="728" text-anchor="middle" font-size="10" fill="#C8F0E8">Workspace roles: Admin · Member · Contributor · Viewer</text>
  <text x="180" y="744" text-anchor="middle" font-size="10" fill="#C8F0E8">Admin/Member/Contributor implicitly get data access</text>

  <rect x="332" y="670" width="300" height="88" rx="8" fill="url(#secGrad)"/>
  <text x="482" y="693" text-anchor="middle" font-size="12" font-weight="600" fill="#25FFD4">Data plane — OneLake security roles</text>
  <text x="482" y="712" text-anchor="middle" font-size="10" fill="#C8F0E8">Scope: tables or folders  |  Permission: read / write</text>
  <text x="482" y="728" text-anchor="middle" font-size="10" fill="#C8F0E8">Optional: row-level and column-level constraints</text>
  <text x="482" y="744" text-anchor="middle" font-size="10" fill="#C8F0E8">Enforces for Viewers + ReadAll-share recipients only</text>

  <rect x="644" y="670" width="250" height="88" rx="8" fill="url(#secGrad)"/>
  <text x="769" y="693" text-anchor="middle" font-size="12" font-weight="600" fill="#25FFD4">Authentication</text>
  <text x="769" y="712" text-anchor="middle" font-size="10" fill="#C8F0E8">Microsoft Entra ID only (users + SPNs)</text>
  <text x="769" y="728" text-anchor="middle" font-size="10" fill="#C8F0E8">Encryption at rest: FIPS 140-2 managed keys</text>
  <text x="769" y="744" text-anchor="middle" font-size="10" fill="#C8F0E8">Customer-managed keys optional per workspace</text>

  <rect x="906" y="670" width="256" height="88" rx="8" fill="url(#secGrad)"/>
  <text x="1034" y="693" text-anchor="middle" font-size="12" font-weight="600" fill="#25FFD4">Authorized engines</text>
  <text x="1034" y="712" text-anchor="middle" font-size="10" fill="#C8F0E8">Third-party engines register with OneLake</text>
  <text x="1034" y="728" text-anchor="middle" font-size="10" fill="#C8F0E8">Pull policy + precomputed access decisions</text>
  <text x="1034" y="744" text-anchor="middle" font-size="10" fill="#C8F0E8">Enforce table / RLS / CLS at query time</text>

  <!-- footer -->
  <text x="1162" y="773" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset; palette from the official Fabric icon.</text>
</svg>
