<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="onelake-architecture-title onelake-architecture-desc" data-diagram-id="onelake-architecture">
  <title id="onelake-architecture-title">OneLake Architecture: Namespace, Shortcuts, Storage, and Security</title>
  <desc id="onelake-architecture-desc">OneLake tenant-wide storage substrate: single ADLS Gen2 namespace, open Delta Parquet format, multi-engine direct access, internal and delegated shortcuts, unified two-plane security model, and the siloed lakes antipattern.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="onelake-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Substrate Gradient -->
    <linearGradient id="onelake-sub-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="onelake-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="onelake-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="onelake-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>

    <!-- Official Microsoft Lakehouse Icon Gradients -->
    <linearGradient id="onelake-lh-a" x1="3.25" x2="19.75" y1="4.5" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="onelake-lh-b" x1="16.5" x2="28.5" y1="6" y2="26" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="960" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#onelake-head)"/>
  <g data-official-icon="microsoft" data-icon-name="lakehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#onelake-lh-a)" d="M4 16.5L16 4l12 12.5v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 27.5z"/>
      <path fill="url(#onelake-lh-b)" d="M16 11l9 9.5v7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 7 27.5v-7z"/>
      <path fill="#FFFFFF" opacity="0.8" d="M12 18h8v2h-8zm0 4h8v2h-8z"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">OneLake Tenant-Wide Architecture &amp; Virtualization Substrate</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Single Tenant Namespace ➔ Open Delta Parquet ➔ Multi-Engine Read ➔ Zero-Copy Shortcuts ➔ Unified Security</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Tenant Namespace &amp; Delta Storage</text>
    <circle cx="340" cy="15" r="5" fill="#2563EB"/><text x="352" y="19" fill="#1E3A8A" font-weight="600">Multi-Engine Zero-Copy Consumption</text>
    <circle cx="680" cy="15" r="5" fill="#0284C7"/><text x="692" y="19" fill="#0369A1" font-weight="600">Shortcuts (Internal &amp; Delegated) &amp; Security</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Atlas Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: TENANT NAMESPACE & HIERARCHY (TENANT ➔ NAMESPACE ➔ ANTIPATTERN)   -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="172" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="156" width="430" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 1: GLOBAL TENANT NAMESPACE &amp; WORKSPACE HIERARCHY</text>

  <!-- Node 1: tenant-onelake -->
  <g data-node-id="tenant-onelake" role="group" tabindex="0" aria-label="One OneLake per tenant">
    <title data-node-tooltip="true">One OneLake per tenant — Exactly one OneLake is provisioned per Fabric tenant; none can be added or removed.</title>
    <rect x="56" y="184" width="350" height="120" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="68" y="194" width="140" height="16" rx="8" fill="#CCFBF1"/><text x="138" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">TENANT ROOT</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#134E4A">1 · One OneLake per Tenant</text>
    <text x="68" y="250" font-size="9.5" fill="#115E59">• Exactly 1 logical OneLake instance per Fabric tenant</text>
    <text x="68" y="268" font-size="9.5" fill="#115E59">• Cannot be deleted, duplicated, or partitioned into silos</text>
    <text x="68" y="286" font-size="9.5" fill="#115E59">• Built on ADLS Gen2 with full native REST API/SDK support</text>
    <rect x="340" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="366" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 2: namespace-hierarchy -->
  <g data-node-id="namespace-hierarchy" role="group" tabindex="0" aria-label="Workspace / item namespace">
    <title data-node-tooltip="true">Workspace / item namespace — Tenant, workspaces, and items form one continuous ADLS-virtualized namespace.</title>
    <rect x="426" y="184" width="350" height="120" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="438" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="503" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATH VIRTUALIZATION</text>
    <text x="438" y="228" font-size="13" font-weight="700" fill="#134E4A">2 · Hierarchical Namespace</text>
    <text x="438" y="250" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Hierarchy:</tspan> Tenant ➔ Workspace (container) ➔ Item (folder)</text>
    <text x="438" y="268" font-size="9.5" fill="#115E59">• Standard ABFSS addressing: <tspan font-family="monospace" font-size="8.5">abfss://ws@onelake/item</tspan></text>
    <text x="438" y="286" font-size="9.5" fill="#115E59">• External tools (Databricks, Azure Synapse) read natively</text>
    <rect x="710" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="736" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 9: siloed-lakes-antipattern -->
  <g data-node-id="siloed-lakes-antipattern" role="group" tabindex="0" aria-label="Antipattern: siloed physical lakes">
    <title data-node-tooltip="true">Antipattern: siloed physical lakes — Standing up separate physical lakes per team recreates the duplication OneLake eliminates.</title>
    <rect x="796" y="184" width="348" height="120" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="808" y="194" width="130" height="16" rx="8" fill="#FEF3C7"/><text x="873" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">DESIGN WARNING</text>
    <text x="808" y="228" font-size="13" font-weight="700" fill="#78350F">3 · Antipattern: Siloed Lakes</text>
    <text x="808" y="250" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Pitfall:</tspan> Provisioning separate physical ADLS lakes per team</text>
    <text x="808" y="268" font-size="9.5" fill="#92400E">• Recreates copy ETL pipelines, storage drift &amp; data duplication</text>
    <text x="808" y="286" font-size="9.5" fill="#92400E">• <tspan font-weight="700">Remedy:</tspan> Use Fabric Workspaces + OneLake Shortcuts</text>
    <rect x="1078" y="194" width="52" height="14" rx="7" fill="#FEF3C7"/><text x="1104" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: DELTA STORAGE & MULTI-ENGINE ACCESS (DELTA ➔ MULTI-ENGINE)        -->
  <!-- ========================================================================= -->
  <rect x="40" y="334" width="1120" height="172" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="344" width="430" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="358" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: UNIVERSAL DELTA PARQUET STORAGE &amp; MULTI-ENGINE ACCESS</text>

  <!-- Node 3: delta-storage -->
  <g data-node-id="delta-storage" role="group" tabindex="0" aria-label="Delta Parquet, one copy">
    <title data-node-tooltip="true">Delta Parquet, one copy — All Fabric item data lands in OneLake as open Delta Parquet, regardless of writing engine.</title>
    <rect x="56" y="372" width="520" height="120" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="68" y="382" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="133" y="393" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">ONE-COPY STORAGE</text>
    <text x="68" y="416" font-size="13" font-weight="700" fill="#1E3A8A">4 · Delta Parquet — Universal Storage Format</text>
    <text x="68" y="438" font-size="9.5" fill="#1E40AF">• All managed tables in Lakehouses and Warehouses land as Delta Lake Parquet</text>
    <text x="68" y="456" font-size="9.5" fill="#1E40AF">• ACID transactions, time travel, schema evolution, and optional V-Order optimization</text>
    <text x="68" y="474" font-size="9.5" fill="#1E40AF">• Open-source format ensures zero vendor lock-in and seamless cross-platform reading</text>
    <rect x="510" y="382" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="536" y="392" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 4: multi-engine-consumption -->
  <g data-node-id="multi-engine-consumption" role="group" tabindex="0" aria-label="Multi-engine consumption">
    <title data-node-tooltip="true">Multi-engine consumption — Spark, T-SQL, and Analysis Services all query the same Delta files with no per-engine copy.</title>
    <rect x="606" y="372" width="538" height="120" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="618" y="382" width="140" height="16" rx="8" fill="#DBEAFE"/><text x="688" y="393" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">SHARED COMPUTE</text>
    <text x="618" y="416" font-size="13" font-weight="700" fill="#1E3A8A">5 · Multi-Engine Direct Consumption (Zero Copy)</text>
    <text x="618" y="438" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Spark:</tspan> High-scale distributed data engineering and machine learning</text>
    <text x="618" y="456" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">T-SQL (Polaris):</tspan> Lakehouse SQL Analytics Endpoint &amp; full Warehouse queries</text>
    <text x="618" y="474" font-size="9.5" fill="#1E40AF">• <tspan font-weight="700">Power BI Direct Lake:</tspan> VertiPaq-speed BI reports with zero data import refreshes</text>
    <rect x="1078" y="382" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1104" y="392" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: SHORTCUTS VIRTUALIZATION (SHORTCUTS ➔ INTERNAL ➔ DELEGATED)       -->
  <!-- ========================================================================= -->
  <rect x="40" y="522" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.4"/>
  <rect x="56" y="532" width="430" height="20" rx="10" fill="#E0F2FE"/>
  <text x="66" y="546" font-size="10.5" font-weight="700" fill="#0369A1" letter-spacing="1px">STAGE 3: ZERO-COPY SHORTCUTS VIRTUALIZATION SUBSTRATE</text>

  <!-- Node 5: shortcuts -->
  <g data-node-id="shortcuts" role="group" tabindex="0" aria-label="OneLake shortcuts">
    <title data-node-tooltip="true">OneLake shortcuts — Symbolic-link-style references that virtualize data inside or outside the tenant with no copy.</title>
    <rect x="56" y="560" width="350" height="182" rx="10" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="68" y="570" width="130" height="16" rx="8" fill="#E0F2FE"/><text x="133" y="581" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284C7">SYMBOLIC POINTERS</text>
    <text x="68" y="604" font-size="13" font-weight="700" fill="#0369A1">6 · OneLake Shortcuts</text>
    <text x="68" y="626" font-size="9.5" fill="#075985">• Embedded object pointers behaving like symlinks</text>
    <text x="68" y="644" font-size="9.5" fill="#075985">• Surfaces remote data as native local OneLake paths</text>
    <text x="68" y="662" font-size="9.5" fill="#075985">• Deleting a shortcut leaves source data untouched</text>
    <text x="68" y="682" font-size="8.5" font-weight="700" fill="#0284C7">Supports up to 100,000 shortcuts per item</text>
    <rect x="340" y="570" width="52" height="14" rx="7" fill="#E0F2FE"/><text x="366" y="580" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284C7">FACT</text>
  </g>

  <!-- Node 6: internal-shortcuts -->
  <g data-node-id="internal-shortcuts" role="group" tabindex="0" aria-label="Internal shortcuts (pass-through)">
    <title data-node-tooltip="true">Internal shortcuts (pass-through) — Reference other Fabric items; access authorized as the calling user's own identity.</title>
    <rect x="426" y="560" width="350" height="182" rx="10" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="438" y="570" width="140" height="16" rx="8" fill="#E0F2FE"/><text x="508" y="581" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284C7">USER PASS-THROUGH</text>
    <text x="438" y="604" font-size="13" font-weight="700" fill="#0369A1">7 · Internal Shortcuts</text>
    <text x="438" y="626" font-size="9.5" fill="#075985">• Targets items in the same or other tenant workspaces</text>
    <text x="438" y="644" font-size="9.5" fill="#075985">• <tspan font-weight="700">Identity Mode:</tspan> Passes through caller's Entra ID</text>
    <text x="438" y="662" font-size="9.5" fill="#075985">• Caller must independently hold read rights at target</text>
    <text x="438" y="682" font-size="8.5" font-weight="700" fill="#0284C7">Source owner retains full exclusive access control</text>
    <rect x="710" y="570" width="52" height="14" rx="7" fill="#E0F2FE"/><text x="736" y="580" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284C7">FACT</text>
  </g>

  <!-- Node 7: external-delegated-shortcuts -->
  <g data-node-id="external-delegated-shortcuts" role="group" tabindex="0" aria-label="External / delegated shortcuts">
    <title data-node-tooltip="true">External / delegated shortcuts — Reach non-Fabric stores or cross-tenant data via a bound connection identity, not the caller's.</title>
    <rect x="796" y="560" width="348" height="182" rx="10" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="808" y="570" width="140" height="16" rx="8" fill="#E0F2FE"/><text x="878" y="581" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284C7">BOUND IDENTITY</text>
    <text x="808" y="604" font-size="13" font-weight="700" fill="#0369A1">8 · External &amp; Delegated Shortcuts</text>
    <text x="808" y="626" font-size="9.5" fill="#075985">• <tspan font-weight="700">External Stores:</tspan> ADLS Gen2, AWS S3, Google Cloud, Dataverse</text>
    <text x="808" y="644" font-size="9.5" fill="#075985">• <tspan font-weight="700">Delegated Auth:</tspan> Bound Cloud Connection / Service Principal</text>
    <text x="808" y="662" font-size="9.5" fill="#075985">• Supports cross-tenant B2B data sharing without moving data</text>
    <text x="808" y="682" font-size="8.5" font-weight="700" fill="#0284C7">Access = Intersection(Delegated Identity, End User Scope)</text>
    <rect x="1078" y="570" width="52" height="14" rx="7" fill="#E0F2FE"/><text x="1104" y="580" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0284C7">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 4: ONELAKE SECURITY MODEL (NODE 8)                                   -->
  <!-- ========================================================================= -->
  <g data-node-id="onelake-security-model" role="group" tabindex="0" aria-label="OneLake security model">
    <title data-node-tooltip="true">OneLake security model — Two-plane, hierarchical permissions govern every read path uniformly, shortcut or not.</title>
    <rect x="40" y="774" width="1120" height="142" rx="14" fill="url(#onelake-sub-grad)" stroke="#0284C7" stroke-width="1.6" filter="url(#onelake-shadow)"/>
    <rect x="56" y="784" width="160" height="18" rx="9" fill="#E0F2FE"/><text x="136" y="797" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369A1">TWO-PLANE SECURITY</text>
    <text x="56" y="826" font-size="14" font-weight="700" fill="#FFFFFF">9 · Unified OneLake Security Model (Control Plane + Data Plane)</text>
    <text x="56" y="848" font-size="9.5" fill="#E0F2FE">• <tspan font-weight="700">Control Plane:</tspan> Workspace roles (Admin, Member, Contributor, Viewer) manage items; Admin/Member/Contributor receive data access by default</text>
    <text x="56" y="866" font-size="9.5" fill="#BAE6FD">• <tspan font-weight="700">Data Plane (OneLake Security Roles):</tspan> Scoped to tables/folders with fine-grained Row-Level Security (RLS) &amp; Column-Level Security (CLS)</text>
    <text x="56" y="884" font-size="9.5" fill="#BAE6FD">• <tspan font-weight="700">Universal Enforcement:</tspan> Third-party and native engines pull precomputed access tokens to enforce permissions consistently at query time</text>
    <rect x="1080" y="784" width="52" height="16" rx="8" fill="#E0F2FE"/><text x="1106" y="796" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369A1">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="938" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Atlas — Original Diagram, August 2026. Sourced from Microsoft OneLake Architecture, Shortcuts, and Security Guidance.</text>
</svg>
