<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="rti-flow-title rti-flow-desc" data-diagram-id="rti-flow">
  <title id="rti-flow-title">Real-Time Intelligence Flow: Sources to Eventhouse to Actions</title>
  <desc id="rti-flow-desc">A flow diagram starting at external event sources feeding into Eventstream, which applies stream-processing operators before routing to two destinations: Eventhouse KQL databases for durable, queryable storage, and Activator, which watches for threshold, pattern, or KQL-defined conditions and fires actions like notifications, pipeline runs, or Copy job execution. Eventhouse data mirrors into OneLake in Delta format for other engines to query, and Real-Time hub sits alongside as the organization-wide catalog surfacing all of this as discoverable streams. A security node covers Workspace Outbound Access Protection, which blocks cross-workspace event consumption by default unless explicitly allowed, and a warning node covers the adaptive-batching delay between Eventhouse and its OneLake mirror.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Palette sampled from the official Microsoft Fabric product icon.
       Grounded in claims: 4986a1daaa6e, 034a6c9b6bb4, 3a8c9935393c, 3c54adbcf7b9,
       139f1eff1ee4, 7c488a88e7f3, 040d6e5a89ff, e8c4d63068ef -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="eventBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF7F2"/>
      <stop offset="1" stop-color="#D0EEE5"/>
    </linearGradient>
    <linearGradient id="ehBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF5EE"/>
      <stop offset="1" stop-color="#C3E8DC"/>
    </linearGradient>
    <linearGradient id="actBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#063D3B"/>
      <stop offset="1" stop-color="#117865"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#063D3B"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1100" height="690" fill="#FFFFFF"/>

  <!-- header bar -->
  <rect x="0" y="0" width="1100" height="56" fill="url(#hdr)"/>
  <text x="32" y="28" font-size="20" font-weight="650" fill="#FFFFFF">Real-Time Intelligence — end-to-end flow</text>
  <text x="32" y="46" font-size="11" fill="#D9F5EE">Microsoft Fabric · Fabric Atlas original diagram · June 2026</text>

  <!-- ── LANE LABELS ── -->
  <text x="28" y="112" font-size="10" letter-spacing="1.4" fill="#8A8886">SOURCES</text>
  <text x="28" y="290" font-size="10" letter-spacing="1.4" fill="#8A8886">INGEST &amp; ROUTE</text>
  <text x="28" y="440" font-size="10" letter-spacing="1.4" fill="#8A8886">STORAGE</text>
  <text x="28" y="570" font-size="10" letter-spacing="1.4" fill="#8A8886">ACTIONS</text>

  <!-- lane dividers -->
  <line x1="20" y1="120" x2="1080" y2="120" stroke="#E1DFDD" stroke-width="1"/>
  <line x1="20" y1="300" x2="1080" y2="300" stroke="#E1DFDD" stroke-width="1"/>
  <line x1="20" y1="450" x2="1080" y2="450" stroke="#E1DFDD" stroke-width="1"/>

  <!-- ══════════ SOURCES ROW ══════════ -->
  <!-- Kafka / external streams -->
  <g filter="url(#shadow)">
    <rect x="40" y="130" width="148" height="72" rx="8" fill="url(#eventBg)" stroke="#9AD2C5"/>
    <text x="114" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Apache Kafka</text>
    <text x="114" y="180" text-anchor="middle" font-size="10" fill="#3F6259">AWS Kinesis · GCP Pub/Sub</text>
    <text x="114" y="194" text-anchor="middle" font-size="10" fill="#3F6259">MQTT · Custom HTTP</text>
  </g>
  <!-- Azure / Fabric events -->
  <g filter="url(#shadow)">
    <rect x="210" y="130" width="148" height="72" rx="8" fill="url(#eventBg)" stroke="#9AD2C5"/>
    <text x="284" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Azure Events</text>
    <text x="284" y="176" text-anchor="middle" font-size="10" fill="#3F6259">Azure Blob Storage events</text>
    <g data-node-id="oap-security" role="group" tabindex="0" aria-label="Outbound Access Protection">
    <title data-node-tooltip="true">Outbound Access Protection — Cross-workspace event consumption is default-deny unless explicitly allowed.</title>
    <rect x="205.3" y="177.5" width="157.4" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="284" y="192" text-anchor="middle" font-size="10" fill="#3F6259">Fabric workspace events</text>
  </g>
  </g>
  <!-- CDC sources -->
  <g filter="url(#shadow)">
    <rect x="380" y="130" width="148" height="72" rx="8" fill="url(#eventBg)" stroke="#9AD2C5"/>
    <g data-node-id="event-sources" role="group" tabindex="0" aria-label="Event sources">
    <title data-node-tooltip="true">Event sources — Kafka, Event Hubs, MQTT, CDC feeds, and other streaming or change-data sources.</title>
    <rect x="406.0" y="140.6" width="96.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="454" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">CDC Feeds</text>
  </g>
    <text x="454" y="176" text-anchor="middle" font-size="10" fill="#3F6259">Azure SQL DB · Cosmos DB</text>
    <g data-node-id="realtime-hub" role="group" tabindex="0" aria-label="Real-Time hub">
    <title data-node-tooltip="true">Real-Time hub — Organization-wide catalog surfacing every active stream and event source to every workload.</title>
    <rect x="355.0" y="177.5" width="198.0" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="454" y="192" text-anchor="middle" font-size="10" fill="#3F6259">PostgreSQL (via Real-Time hub)</text>
  </g>
  </g>
  <!-- IoT / sensor data -->
  <g filter="url(#shadow)">
    <rect x="550" y="130" width="148" height="72" rx="8" fill="url(#eventBg)" stroke="#9AD2C5"/>
    <text x="624" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">IoT / Sensor</text>
    <text x="624" y="180" text-anchor="middle" font-size="10" fill="#3F6259">MQTT v3.1 / v3.1.1</text>
    <text x="624" y="194" text-anchor="middle" font-size="10" fill="#3F6259">Real-Time Weather connector</text>
  </g>

  <!-- arrows sources → Real-Time hub -->
  <g stroke="#2AAC94" stroke-width="1.5" fill="none">
    <line x1="114" y1="202" x2="114" y2="240" marker-end="url(#arr)"/>
    <line x1="284" y1="202" x2="284" y2="240" marker-end="url(#arr)"/>
    <line x1="454" y1="202" x2="454" y2="240" marker-end="url(#arr)"/>
    <line x1="624" y1="202" x2="624" y2="240" marker-end="url(#arr)"/>
    <!-- converge lines to Real-Time hub box -->
    <line x1="114" y1="240" x2="370" y2="240"/>
    <line x1="284" y1="240" x2="370" y2="240"/>
    <line x1="454" y1="240" x2="450" y2="240"/>
    <line x1="624" y1="240" x2="530" y2="240"/>
  </g>

  <!-- ══════════ REAL-TIME HUB ══════════ -->
  <g filter="url(#shadow)">
    <rect x="320" y="248" width="220" height="52" rx="10" fill="#063D3B"/>
    <text x="430" y="270" text-anchor="middle" font-size="13" font-weight="650" fill="#25FFD4">Real-Time hub</text>
    <text x="430" y="288" text-anchor="middle" font-size="10" fill="#9AD2C5">tenant-wide catalog of data in motion</text>
  </g>

  <!-- ══════════ EVENTSTREAM BOX ══════════ -->
  <!-- arrow: RTH → Eventstream -->
  <line x1="430" y1="300" x2="430" y2="348" stroke="#2AAC94" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="350" width="420" height="96" rx="10" fill="url(#eventBg)" stroke="#117865" stroke-width="1.5"/>
    <g data-node-id="eventstream" role="group" tabindex="0" aria-label="Eventstream">
    <title data-node-tooltip="true">Eventstream — No-code ingestion pipeline: collects, transforms, and routes events to multiple destinations.</title>
    <rect x="373.3" y="353.7" width="113.3" height="30.1" rx="6" fill="transparent" pointer-events="all"/>
    <text x="430" y="374" text-anchor="middle" font-size="14" font-weight="650" fill="#063D3B">Eventstream</text>
  </g>
    <text x="430" y="392" text-anchor="middle" font-size="10" fill="#3F6259">no-code ingest · multi-source fan-in · multi-destination fan-out</text>
    <!-- processing operators band -->
    <rect x="240" y="400" width="380" height="32" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
    <text x="430" y="412" text-anchor="middle" font-size="9.5" fill="#424242">Built-in operators:</text>
    <text x="430" y="426" text-anchor="middle" font-size="9.5" fill="#424242">filter · cleanse · windowed aggregation · dedup · content-based routing · derived streams</text>
  </g>

  <!-- ══════════ STORAGE (EVENTHOUSE) ══════════ -->
  <!-- arrow: Eventstream → Eventhouse -->
  <line x1="430" y1="446" x2="430" y2="472" stroke="#2AAC94" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="474" width="420" height="88" rx="10" fill="url(#ehBg)" stroke="#117865" stroke-width="1.5"/>
    <text x="430" y="500" text-anchor="middle" font-size="14" font-weight="650" fill="#063D3B">Eventhouse / KQL Databases</text>
    <g data-node-id="eventhouse-kql-db" role="group" tabindex="0" aria-label="Eventhouse KQL database">
    <title data-node-tooltip="true">Eventhouse KQL database — Durable, indexed storage organized by arrival time, queryable via KQL or T-SQL.</title>
    <rect x="191.8" y="503.5" width="476.4" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="430" y="518" text-anchor="middle" font-size="10" fill="#3F6259">auto-indexed by arrival time · structured, semi-structured &amp; unstructured data</text>
  </g>
    <text x="430" y="534" text-anchor="middle" font-size="10" fill="#3F6259">queryable via KQL · T-SQL endpoint · Fabric notebooks (Python/Spark/KQL)</text>
    <g data-node-id="onelake-mirror" role="group" tabindex="0" aria-label="OneLake Delta mirror">
    <title data-node-tooltip="true">OneLake Delta mirror — Eventhouse data mirrors into OneLake as Delta, queryable by every other Fabric engine.</title>
    <rect x="238.9" y="536.2" width="382.1" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="430" y="550" text-anchor="middle" font-size="9.5" fill="#117865" font-style="italic">data mirrored to OneLake as Delta-Parquet — no extra storage cost</text>
  </g>
  </g>

  <!-- OneLake side path -->
  <line x1="640" y1="518" x2="760" y2="518" stroke="#2AAC94" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <g filter="url(#shadow)">
    <rect x="762" y="494" width="180" height="52" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="852" y="516" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">OneLake</text>
    <text x="852" y="532" text-anchor="middle" font-size="9.5" fill="#3F6259">Delta-Parquet · Power BI</text>
    <text x="852" y="544" text-anchor="middle" font-size="9.5" fill="#3F6259">Direct Lake · Lakehouse</text>
  </g>

  <!-- ══════════ ACTIVATOR ACTIONS ══════════ -->
  <!-- arrow: Eventhouse → Activator -->
  <line x1="430" y1="562" x2="430" y2="590" stroke="#2AAC94" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="592" width="420" height="64" rx="10" fill="url(#actBg)"/>
    <text x="430" y="614" text-anchor="middle" font-size="13" font-weight="650" fill="#25FFD4">Activator</text>
    <text x="430" y="631" text-anchor="middle" font-size="9.5" fill="#9AD2C5">threshold / pattern / KQL conditions →</text>
    <text x="430" y="645" text-anchor="middle" font-size="9.5" fill="#9AD2C5">notify · pipeline · Spark job · Power Automate · User Data Functions</text>
  </g>

  <!-- also: RTH direct feed to Activator -->
  <path d="M540 274 Q740 274 740 624 L640 624" fill="none" stroke="#0E6961" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <g data-node-id="activator" role="group" tabindex="0" aria-label="Activator">
    <title data-node-tooltip="true">Activator — Watches the stream for threshold, pattern, or KQL-defined conditions and fires actions.</title>
    <rect x="608.3" y="406.2" width="299.5" height="30.0" rx="6" fill="transparent" pointer-events="all"/>
    <text x="758" y="420" font-size="9.5" fill="#3F6259" text-anchor="middle" transform="rotate(-90,758,420)">RTH · KQL · Power BI · Activator monitors directly</text>
  </g>

  <!-- legend note -->
  <text x="1080" y="678" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset.</text>
</svg>
