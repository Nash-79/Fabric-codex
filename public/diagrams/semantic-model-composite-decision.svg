<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Palette: #117865 #2AAC94 #25FFD4 #063D3B — from the Fabric brand.
       Distinct from semantic-model-storage-modes.svg (which compares the 3 storage-mode cards).
       This is a decision/internals diagram: per-table composite-model routing logic,
       RLS role-type decision lane, and the refresh memory-risk internals.
       Grounded in semantic-model claims: composite Direct Lake pattern, gateway rules,
       RLS dynamic/static, ownership, refresh memory risk, capacity resource levers. -->

  <defs>
    <linearGradient id="hdrGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0B5E50"/>
      <stop offset="0.55" stop-color="#117865"/>
      <stop offset="1"    stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="riskBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#2AAC94"/>
      <stop offset="0.5" stop-color="#E8B339"/>
      <stop offset="0.82" stop-color="#D9534F"/>
      <stop offset="1"   stop-color="#B5302C"/>
    </linearGradient>
    <marker id="dArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#117865"/>
    </marker>
    <marker id="dArrLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="dArrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B5302C"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="#FFFFFF"/>

  <!-- header -->
  <rect x="0" y="0" width="1100" height="64" fill="url(#hdrGrad2)"/>
  <text x="36" y="36" font-size="21" font-weight="650" fill="#FFFFFF">Composite Semantic Models — Per-Table Routing, RLS &amp; Refresh Risk</text>
  <text x="36" y="54" font-size="11" fill="#C8F5EC">Decision logic for combining storage modes in one model, row-level security role type, and the memory-risk zone to avoid</text>

  <!-- ═══════════════════════════════════════════════
       LANE 1 — per-table decision tree  (y 84 - 340)
  ═══════════════════════════════════════════════ -->
  <text x="36" y="96" font-size="10.5" letter-spacing="1.4" fill="#8A8886">LANE 1 · PER-TABLE STORAGE-MODE ROUTING (composite model)</text>
  <rect x="36" y="104" width="1028" height="246" rx="8" fill="#F8FFFE" stroke="#9AD2C5" stroke-width="1.2"/>

  <!-- start node -->
  <rect x="60" y="126" width="176" height="52" rx="8" fill="#117865"/>
  <text x="148" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">For each table in</text>
  <text x="148" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">the model, ask:</text>

  <!-- decision diamond 1: lives in OneLake as Delta? -->
  <polygon points="330,110 430,152 330,194 230,152" fill="#DFF5EE" stroke="#117865" stroke-width="1.5"/>
  <text x="330" y="146" text-anchor="middle" font-size="9.5" font-weight="600" fill="#063D3B">Is it a large,</text>
  <text x="330" y="159" text-anchor="middle" font-size="9.5" font-weight="600" fill="#063D3B">fast-changing fact</text>
  <text x="330" y="171" text-anchor="middle" font-size="9.5" font-weight="600" fill="#063D3B">table in OneLake Delta?</text>

  <line x1="236" y1="152" x2="228" y2="152" stroke="#117865" stroke-width="1.5" marker-end="url(#dArr)"/>

  <!-- yes -> Direct Lake -->
  <line x1="330" y1="110" x2="330" y2="72" stroke="#2AAC94" stroke-width="1.5"/>
  <line x1="330" y1="72" x2="470" y2="72" stroke="#2AAC94" stroke-width="1.5" marker-end="url(#dArrLight)"/>
  <text x="400" y="66" text-anchor="middle" font-size="9" fill="#616161">yes</text>

  <rect x="470" y="46" width="200" height="52" rx="8" fill="#0B5E50"/>
  <text x="570" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#25FFD4">Direct Lake mode</text>
  <text x="570" y="82" text-anchor="middle" font-size="9.5" fill="#C8F5EC">columns loaded on demand,</text>
  <text x="570" y="94" text-anchor="middle" font-size="9.5" fill="#C8F5EC">no refresh pipeline needed</text>

  <!-- no -> next question -->
  <line x1="430" y1="152" x2="470" y2="152" stroke="#117865" stroke-width="1.5" marker-end="url(#dArr)"/>
  <text x="450" y="146" text-anchor="middle" font-size="9" fill="#616161">no</text>

  <polygon points="570,110 670,152 570,194 470,152" fill="#DFF5EE" stroke="#117865" stroke-width="1.5"/>
  <text x="570" y="140" text-anchor="middle" font-size="9.5" font-weight="600" fill="#063D3B">Must reflect the</text>
  <text x="570" y="153" text-anchor="middle" font-size="9.5" font-weight="600" fill="#063D3B">source's current</text>
  <text x="570" y="166" text-anchor="middle" font-size="9.5" font-weight="600" fill="#063D3B">state on every query?</text>

  <!-- yes -> DirectQuery -->
  <line x1="670" y1="152" x2="710" y2="152" stroke="#2AAC94" stroke-width="1.5" marker-end="url(#dArrLight)"/>
  <text x="690" y="146" text-anchor="middle" font-size="9" fill="#616161">yes</text>

  <rect x="710" y="126" width="200" height="52" rx="8" fill="#117865"/>
  <text x="810" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">DirectQuery mode</text>
  <text x="810" y="162" text-anchor="middle" font-size="9.5" fill="#EAF7F2">query forwarded live; gateway</text>
  <text x="810" y="174" text-anchor="middle" font-size="9.5" fill="#EAF7F2">needed if source not internet-reachable</text>

  <!-- no -> Import -->
  <line x1="570" y1="194" x2="570" y2="228" stroke="#117865" stroke-width="1.5"/>
  <line x1="570" y1="228" x2="330" y2="228" stroke="#117865" stroke-width="1.5" marker-end="url(#dArr)"/>
  <text x="450" y="222" text-anchor="middle" font-size="9" fill="#616161">no — stable dimension / small table</text>

  <rect x="230" y="228" width="200" height="52" rx="8" fill="#2AAC94"/>
  <text x="330" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#063D3B">Import mode</text>
  <text x="330" y="264" text-anchor="middle" font-size="9.5" fill="#063D3B">cached in-memory, joins fast,</text>
  <text x="330" y="276" text-anchor="middle" font-size="9.5" fill="#063D3B">refreshed on schedule</text>

  <!-- composite result -->
  <line x1="810" y1="178" x2="810" y2="300" stroke="#B8B6B4" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="570" y1="98" x2="570" y2="300" stroke="#B8B6B4" stroke-width="0"/>
  <line x1="330" y1="280" x2="330" y2="300" stroke="#B8B6B4" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="570" y1="98" x2="570" y2="300" stroke="#B8B6B4" stroke-width="1.2" stroke-dasharray="3,3" opacity="0"/>
  <line x1="570" y1="98" x2="570" y2="98" stroke="none"/>
  <line x1="570" y1="98" x2="570" y2="98" stroke="none"/>

  <rect x="270" y="300" width="600" height="42" rx="8" fill="#F3F2F1" stroke="#C8C6C4" stroke-dasharray="4,3"/>
  <text x="570" y="326" text-anchor="middle" font-size="10.5" fill="#424242">Result: one <tspan font-weight="700" fill="#063D3B">composite model</tspan> mixing Direct Lake facts with Import/DirectQuery dimensions — the mix is per-table, not model-wide</text>

  <!-- ═══════════════════════════════════════════════
       LANE 2 — RLS role-type decision  (y 366 - 520)
  ═══════════════════════════════════════════════ -->
  <text x="36" y="378" font-size="10.5" letter-spacing="1.4" fill="#8A8886">LANE 2 · ROW-LEVEL SECURITY ROLE TYPE</text>
  <rect x="36" y="386" width="500" height="150" rx="8" fill="#F8FFFE" stroke="#9AD2C5" stroke-width="1.2"/>

  <polygon points="130,408 220,446 130,484 40,446" fill="#DFF5EE" stroke="#117865" stroke-width="1.5"/>
  <text x="130" y="440" text-anchor="middle" font-size="9" font-weight="600" fill="#063D3B">Filter depends on</text>
  <text x="130" y="452" text-anchor="middle" font-size="9" font-weight="600" fill="#063D3B">the signed-in user's</text>
  <text x="130" y="464" text-anchor="middle" font-size="9" font-weight="600" fill="#063D3B">identity?</text>

  <line x1="220" y1="446" x2="252" y2="446" stroke="#2AAC94" stroke-width="1.5" marker-end="url(#dArrLight)"/>
  <text x="236" y="440" text-anchor="middle" font-size="8.5" fill="#616161">yes</text>
  <rect x="252" y="418" width="240" height="56" rx="8" fill="#117865"/>
  <text x="372" y="438" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Dynamic RLS</text>
  <text x="372" y="454" text-anchor="middle" font-size="9" fill="#EAF7F2">e.g. USERPRINCIPALNAME() — each</text>
  <text x="372" y="466" text-anchor="middle" font-size="9" fill="#EAF7F2">user sees rows scoped to them</text>

  <line x1="130" y1="484" x2="130" y2="504" stroke="#117865" stroke-width="1.5" marker-end="url(#dArr)"/>
  <text x="150" y="500" text-anchor="middle" font-size="8.5" fill="#616161">no — same filter for the role's members</text>
  <rect x="252" y="486" width="240" height="42" rx="8" fill="#2AAC94"/>
  <text x="372" y="504" text-anchor="middle" font-size="10.5" font-weight="700" fill="#063D3B">Static RLS</text>
  <text x="372" y="518" text-anchor="middle" font-size="9" fill="#063D3B">one fixed filter for every member</text>

  <!-- ownership note -->
  <text x="60" y="524" font-size="9.5" fill="#797775">Gateway/cloud-connection changes require model ownership; non-owners see settings read-only.</text>

  <!-- ═══════════════════════════════════════════════
       LANE 3 — capacity resource levers  (y 366 right)
  ═══════════════════════════════════════════════ -->
  <text x="560" y="378" font-size="10.5" letter-spacing="1.4" fill="#8A8886">LANE 3 · WHAT DRIVES A MODEL'S CAPACITY FOOTPRINT</text>
  <rect x="560" y="386" width="504" height="150" rx="8" fill="#F8FFFE" stroke="#9AD2C5" stroke-width="1.2"/>

  <g font-size="9.5" fill="#063D3B">
    <circle cx="586" cy="412" r="4" fill="#117865"/>
    <text x="598" y="416">Hosting location (workspace / capacity)</text>
    <circle cx="586" cy="434" r="4" fill="#117865"/>
    <text x="598" y="438">Storage mode chosen per table (Lane 1)</text>
    <circle cx="586" cy="456" r="4" fill="#117865"/>
    <text x="598" y="460">Gateway dependencies for on-prem sources</text>
    <circle cx="586" cy="478" r="4" fill="#117865"/>
    <text x="598" y="482">Volume of imported data</text>
    <circle cx="586" cy="500" r="4" fill="#117865"/>
    <text x="598" y="504">Refresh type and frequency</text>
  </g>
  <text x="820" y="420" font-size="9" fill="#797775" text-anchor="start">These five levers combine — a composite</text>
  <text x="820" y="434" font-size="9" fill="#797775" text-anchor="start">model with Direct Lake facts removes the</text>
  <text x="820" y="448" font-size="9" fill="#797775" text-anchor="start">"volume imported" and "refresh frequency"</text>
  <text x="820" y="462" font-size="9" fill="#797775" text-anchor="start">levers for that table entirely — only the</text>
  <text x="820" y="476" font-size="9" fill="#797775" text-anchor="start">Import-mode dimensions still carry them.</text>

  <!-- ═══════════════════════════════════════════════
       LANE 4 — refresh memory-risk internals (y 560 - 860)
  ═══════════════════════════════════════════════ -->
  <text x="36" y="572" font-size="10.5" letter-spacing="1.4" fill="#8A8886">LANE 4 · REFRESH MEMORY-RISK INTERNALS (Import / composite tables only)</text>
  <rect x="36" y="580" width="1028" height="290" rx="8" fill="#F8FFFE" stroke="#9AD2C5" stroke-width="1.2"/>

  <text x="60" y="606" font-size="11" font-weight="650" fill="#063D3B">Model size as a share of capacity memory</text>

  <!-- risk gauge -->
  <rect x="60" y="616" width="944" height="34" rx="6" fill="url(#riskBar)"/>
  <!-- tick marks -->
  <line x1="60"  y1="612" x2="60"  y2="654" stroke="#8A8886" stroke-width="1"/>
  <line x1="296" y1="612" x2="296" y2="654" stroke="#8A8886" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="475" y1="612" x2="475" y2="654" stroke="#424242" stroke-width="1.5"/>
  <line x1="775" y1="612" x2="775" y2="654" stroke="#8A8886" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="1004" y1="612" x2="1004" y2="654" stroke="#8A8886" stroke-width="1"/>
  <text x="60" y="666" font-size="9" fill="#797775">0%</text>
  <text x="475" y="666" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B5302C">~50% — OOM risk zone begins</text>
  <text x="1004" y="666" text-anchor="end" font-size="9" fill="#797775">100%</text>

  <!-- worked example marker -->
  <polygon points="475,600 468,612 482,612" fill="#424242"/>
  <text x="475" y="596" text-anchor="middle" font-size="9" fill="#424242">e.g. 12 GB model on a 25 GB capacity</text>

  <!-- why it happens -->
  <rect x="60" y="682" width="452" height="164" rx="8" fill="#FFF4F1" stroke="#E8B3AE"/>
  <text x="76" y="704" font-size="11" font-weight="650" fill="#8A1F1A">Why a full refresh can run out of memory</text>
  <text x="76" y="724" font-size="10" fill="#5A2420">A full refresh briefly needs memory for</text>
  <text x="76" y="740" font-size="10" fill="#5A2420">both the old and new copies of the data</text>
  <text x="76" y="756" font-size="10" fill="#5A2420">being processed. As model size approaches</text>
  <text x="76" y="772" font-size="10" fill="#5A2420">roughly half the capacity's total memory,</text>
  <text x="76" y="788" font-size="10" fill="#5A2420">that transient overhead risks exhausting</text>
  <text x="76" y="804" font-size="10" fill="#5A2420">the capacity's available RAM mid-refresh.</text>
  <text x="76" y="826" font-size="9.5" fill="#8A1F1A" font-weight="600">Applies to Import-mode tables and any</text>
  <text x="76" y="840" font-size="9.5" fill="#8A1F1A" font-weight="600">Import-mode side of a composite model.</text>

  <!-- mitigation -->
  <rect x="536" y="682" width="452" height="164" rx="8" fill="#DFF5EE" stroke="#117865"/>
  <text x="552" y="704" font-size="11" font-weight="650" fill="#063D3B">Mitigation: refresh granularity</text>
  <line x1="552" y1="722" x2="988" y2="722" stroke="#9AD2C5" stroke-width="1"/>
  <text x="552" y="742" font-size="10" fill="#3F6259" font-weight="600">Instead of a full-model refresh —</text>
  <text x="568" y="760" font-size="10" fill="#3F6259">use the enhanced refresh REST API</text>
  <text x="568" y="776" font-size="10" fill="#3F6259">or the XMLA endpoint to refresh one</text>
  <text x="568" y="792" font-size="10" fill="#3F6259">partition or table at a time.</text>
  <text x="552" y="814" font-size="9.5" fill="#797775">Sizing check: sum DICTIONARY_SIZE (columns)</text>
  <text x="552" y="828" font-size="9.5" fill="#797775">+ USED_SIZE (segments) over XMLA via SSMS</text>
  <text x="552" y="842" font-size="9.5" fill="#797775">before scheduling large refreshes.</text>

  <!-- legend -->
  <rect x="36" y="862" width="14" height="10" fill="#117865"/>
  <text x="56" y="871" font-size="9" fill="#616161">Fabric-native mode</text>
  <rect x="176" y="862" width="14" height="10" fill="#2AAC94"/>
  <text x="196" y="871" font-size="9" fill="#616161">Standard mode</text>
  <polygon points="306,862 320,867 306,872 292,867" fill="#DFF5EE" stroke="#117865" stroke-width="1"/>
  <text x="326" y="871" font-size="9" fill="#616161">Decision point</text>
  <rect x="436" y="862" width="14" height="10" fill="none" stroke="#B5302C" stroke-width="1.5"/>
  <text x="456" y="871" font-size="9" fill="#616161">Risk zone</text>

  <!-- footer -->
  <text x="1064" y="892" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset; palette from the Fabric icon.</text>
</svg>
