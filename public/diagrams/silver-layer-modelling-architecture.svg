<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI,Arial,sans-serif" role="img" aria-labelledby="silver-layer-modelling-architecture-title silver-layer-modelling-architecture-desc" data-diagram-id="silver-layer-modelling-architecture"><title id="silver-layer-modelling-architecture-title">Silver Layer Modelling: Bronze-to-Silver Conformance Flow</title><desc id="silver-layer-modelling-architecture-desc">A top-down flow diagram: bronze records are standardised, deduplicated by commit time, and checked against quality rules. Passing records merge into silver tables using SCD Type 2 history; failing records branch into a quarantine table and can be replayed back into the merge once fixed. The merged table is periodically compacted and V-Ordered before being published as conformed silver tables.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#063D3B"/><stop offset="1" stop-color="#117865"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2AAC94"/></marker></defs><rect width="1180" height="900" fill="#FAF9F8"/><rect width="1180" height="118" fill="url(#head)"/><text x="52" y="54" fill="white" font-size="28" font-weight="700" data-node-id="scd-merge" tabindex="0" aria-label="SCD Type 2 merge"><title data-node-tooltip="true">SCD Type 2 merge — Merge passing (and replayed) records into silver using slowly changing dimension history.</title>Silver Layer Modelling Techniques in Fabric</text><text x="52" y="84" fill="#CFF3E9" font-size="15" data-node-id="bronze-intake" tabindex="0" aria-label="Bronze intake (Delta, Tables area)"><title data-node-tooltip="true">Bronze intake (Delta, Tables area) — Raw records land as Delta tables in the lakehouse managed Tables area.</title>Silver Layer Modelling Techniques in Fabric architecture — Validate and standardize bronze records, Conform keys, history, and canonical entities, Publish reusable Delta silver tables</text><text x="52" y="154" fill="#605E5C" font-size="13" letter-spacing="2">END-TO-END ARCHITECTURE</text><path d="M 340 240 C 375 240, 395 240, 430 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M 690 240 C 725 240, 745 240, 780 240" fill="none" stroke="#2AAC94" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="108" cy="198" r="16" fill="#117865"/><text x="108" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text><text x="230" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="quarantine" tabindex="0" aria-label="Quarantine table"><title data-node-tooltip="true">Quarantine table — Failed records land in a separate Delta table with their failure reason, for triage.</title><tspan x="230" dy="0">Validate and standardize</tspan><tspan x="230" dy="22">bronze records</tspan></text>
<rect x="430" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="458" cy="198" r="16" fill="#117865"/><text x="458" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text><text x="580" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="standardise" tabindex="0" aria-label="Standardise types &amp; keys"><title data-node-tooltip="true">Standardise types &amp; keys — Normalise column types, naming, and business keys across bronze sources.</title><tspan x="580" dy="0">Conform keys, history,</tspan><tspan x="580" dy="22">and canonical entities</tspan></text>
<rect x="780" y="170" width="260" height="140" rx="20" fill="#EAF7F2" stroke="#117865" stroke-width="3"/><circle cx="808" cy="198" r="16" fill="#117865"/><text x="808" y="203" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text><text x="930" y="222" text-anchor="middle" fill="#063D3B" font-size="17" font-weight="600" data-node-id="optimize-compact" tabindex="0" aria-label="Optimize / compact (V-Order)"><title data-node-tooltip="true">Optimize / compact (V-Order) — Periodically compact small files and apply V-Order to the merged Delta table.</title><tspan x="930" dy="0">Publish reusable Delta</tspan><tspan x="930" dy="22">silver tables</tspan></text><rect x="52" y="485" width="1076" height="118" rx="16" fill="#E8F6F1" stroke="#2AAC94" stroke-width="2"/><text x="76" y="515" fill="#117865" font-size="12" font-weight="700" letter-spacing="1.4">WORKED EXAMPLE</text><text x="76" y="547" fill="#063D3B" font-size="15" data-node-id="dedup-order" tabindex="0" aria-label="Dedup &amp; order by commit time"><title data-node-tooltip="true">Dedup &amp; order by commit time — Collapse duplicate records per key, ordered by a deterministic commit-time column.</title><tspan x="76" dy="0">Customer CDC is ordered, deduplicated, and merged into</tspan><tspan x="76" dy="19">SCD2 silver while invalid records enter a replayable</tspan><tspan x="76" dy="19">quarantine.</tspan></text><rect x="52" y="630" width="516" height="145" rx="16" fill="#EDF8F1" stroke="#6BBF8A"/><text x="78" y="662" fill="#176B3A" font-size="13" font-weight="700" letter-spacing="1.3">IMPLEMENTATION CONTROLS</text><text x="82" y="695" fill="#285943" font-size="14">✓ Deterministic merge key</text><text x="82" y="719" fill="#285943" font-size="14">✓ Late-arrival policy</text><text x="82" y="743" fill="#285943" font-size="14">✓ Schema-evolution contract</text><rect x="612" y="630" width="516" height="145" rx="16" fill="#FFF7E6" stroke="#D6A84B"/><text x="638" y="662" fill="#7A4B00" font-size="13" font-weight="700" letter-spacing="1.3">FAILURE MODES</text><text x="640" y="695" fill="#7A4B00" font-size="14" data-node-id="nondeterministic-latest-row" tabindex="0" aria-label="Nondeterministic &apos;latest row&apos; logic"><title data-node-tooltip="true">Nondeterministic &apos;latest row&apos; logic — Resolving the current row without a deterministic ordering key corrupts SCD history.</title>⚠ Unordered latest-row logic</text><text x="640" y="719" fill="#7A4B00" font-size="14" data-node-id="silver-tables" tabindex="0" aria-label="Conformed silver Delta tables"><title data-node-tooltip="true">Conformed silver Delta tables — The published, queryable silver tables consumers and downstream gold layers read.</title>⚠ Gold aggregates in silver</text><text x="640" y="743" fill="#7A4B00" font-size="14">⚠ Quarantine without replay</text><rect x="52" y="800" width="1076" height="54" rx="13" fill="#F0F5F3" stroke="#B8D8CE"/><text x="590" y="832" text-anchor="middle" fill="#063D3B" font-size="14" data-node-id="quality-rules" tabindex="0" aria-label="Quality rules gate"><title data-node-tooltip="true">Quality rules gate — Evaluate each deduplicated record against defined validity rules; branch pass/fail.</title>In Atlas: select a choice → inspect evidence → drill into inputs, processing, outputs, example, controls, and risks.</text><text x="1128" y="882" text-anchor="end" fill="#605E5C" font-size="10" data-node-id="replay-fix" tabindex="0" aria-label="Triage &amp; fix"><title data-node-tooltip="true">Triage &amp; fix — An operator or corrective job resolves the quarantined record&apos;s root cause.</title>Fabric Atlas original · Microsoft Fabric implementation guidance</text></svg>
