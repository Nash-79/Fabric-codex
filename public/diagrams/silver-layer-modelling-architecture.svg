<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" font-family="Segoe UI,Inter,Arial,sans-serif" role="img" aria-labelledby="silver-layer-modelling-architecture-title silver-layer-modelling-architecture-desc" data-diagram-id="silver-layer-modelling-architecture">
 <title id="silver-layer-modelling-architecture-title">Silver Layer Modelling: Bronze-to-Silver Conformance Flow</title><desc id="silver-layer-modelling-architecture-desc">A top-down flow diagram: bronze records are standardised, deduplicated by commit time, and checked against quality rules. Passing records merge into silver tables using SCD Type 2 history; failing records branch into a quarantine table and can be replayed back into the merge once fixed. The merged table is periodically compacted and V-Ordered before being published as conformed silver tables.</desc>
 <defs><linearGradient id="sh" x2="1"><stop stop-color="#78350F"/><stop offset=".42" stop-color="#475569"/><stop offset="1" stop-color="#0F766E"/></linearGradient><linearGradient id="slane" x2="1"><stop stop-color="#FFF7ED"/><stop offset=".48" stop-color="#F8FAFC"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient><filter id="ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity=".13"/></filter><marker id="sa" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#0F766E"/></marker><marker id="sw" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#D97706"/></marker><style>.k{font-size:13px;font-weight:700;letter-spacing:2px}.h1{font-size:34px;font-weight:750}.h2{font-size:19px;font-weight:700}.h3{font-size:15px;font-weight:700}.b{font-size:13px}.s{font-size:12px}.m{font-size:11px}.n{fill:#0F172A}.mu{fill:#475569}.t{fill:#0F766E}.w{fill:#FFF}.ev{font-size:11px;font-weight:700;fill:#0369A1}.flow{fill:none;stroke:#0F766E;stroke-width:3;marker-end:url(#sa)}.retry{fill:none;stroke:#D97706;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#sw)}[data-node-id]:focus{outline:none}[data-node-id]:focus>rect,[data-node-id]:focus>.focus-ring{stroke:#2563EB!important;stroke-width:4!important}</style></defs>
 <rect width="1440" height="1100" fill="#F8FAFC"/><rect width="1440" height="168" fill="url(#sh)"/><circle cx="1325" cy="15" r="150" fill="#FFF" opacity=".06"/><text x="64" y="43" class="k" fill="#FED7AA">FABRIC ATLAS · SILVER CONFORMANCE</text><text x="64" y="84" class="h1 w">From raw bronze records to trusted, replayable silver</text><text x="64" y="119" font-size="17" fill="#E2F7F1">Deterministic keys and ordering preserve history; quarantine preserves the pipeline.</text><g transform="translate(64 138)"><rect width="245" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">RAW → typed + keyed</text></g><g transform="translate(323 138)"><rect width="285" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">GATE → pass or reason-coded fail</text></g><g transform="translate(622 138)"><rect width="250" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">PUBLISH → conformed Delta</text></g>
 <rect x="64" y="205" width="1312" height="568" rx="28" fill="url(#slane)" stroke="#CBD5E1" stroke-width="2"/><text x="86" y="236" class="k" fill="#92400E">BRONZE INTAKE</text><text x="388" y="236" class="k mu">STANDARDISE + RESOLVE</text><text x="815" y="236" class="k" fill="#047857">QUALITY + HISTORY</text><text x="1160" y="236" class="k" fill="#065F46">SILVER SERVING</text>
 <g data-node-id="bronze-intake" transform="translate(86 268)" tabindex="0" aria-label="Bronze intake (Delta, Tables area)"><title data-node-tooltip="true">Bronze intake (Delta, Tables area) — Raw records land as Delta tables in the lakehouse managed Tables area.</title><rect class="focus-ring" width="250" height="210" rx="21" fill="#FFF7ED" stroke="#FB923C" stroke-width="2" filter="url(#ss)"/><g transform="translate(24 24)" fill="#FDBA74"><ellipse cx="38" cy="9" rx="38" ry="9"/><path d="M0 9v60c0 6 17 10 38 10s38-4 38-10V9c-9 6-67 6-76 0z"/></g><text x="115" y="44" class="h2" fill="#9A3412">Bronze intake</text><text x="115" y="67" class="s mu">raw Delta · Tables area</text><path d="M24 117h202" stroke="#FED7AA"/><text x="24" y="143" class="s n">Preserve source columns</text><text x="24" y="164" class="s n">Add ingestion metadata</text><text x="24" y="185" class="m mu">batch ID · source · commit time</text><circle cx="226" cy="22" r="14" fill="#FFF"/><text x="226" y="26" text-anchor="middle" class="ev">S1</text></g>
 <path d="M336 373h42" class="flow"/>
 <g data-node-id="standardise" transform="translate(378 268)" tabindex="0" aria-label="Standardise types &amp; keys"><title data-node-tooltip="true">Standardise types &amp; keys — Normalise column types, naming, and business keys across bronze sources.</title><rect class="focus-ring" width="248" height="210" rx="21" fill="#FFF" stroke="#60A5FA" stroke-width="2" filter="url(#ss)"/><circle cx="50" cy="51" r="28" fill="#DBEAFE"/><path d="M35 41h30M35 51h20M35 61h26" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><text x="91" y="44" class="h2" fill="#1E40AF">Standardise</text><text x="91" y="67" class="s mu">types · names · keys</text><g transform="translate(22 104)"><rect width="204" height="34" rx="10" fill="#EFF6FF"/><text x="14" y="22" class="s n">date text → timestamp</text></g><g transform="translate(22 145)"><rect width="204" height="34" rx="10" fill="#EFF6FF"/><text x="14" y="22" class="s n">source ID → business key</text></g></g>
 <path d="M626 373h42" class="flow"/>
 <g data-node-id="dedup-order" transform="translate(668 268)" tabindex="0" aria-label="Dedup &amp; order by commit time"><title data-node-tooltip="true">Dedup &amp; order by commit time — Collapse duplicate records per key, ordered by a deterministic commit-time column.</title><rect class="focus-ring" width="248" height="210" rx="21" fill="#FFF" stroke="#A78BFA" stroke-width="2" filter="url(#ss)"/><circle cx="50" cy="51" r="28" fill="#EDE9FE"/><path d="M35 38h29v34H35zM41 47h17M41 55h17M41 63h10" fill="none" stroke="#7C3AED" stroke-width="3"/><text x="91" y="44" class="h2" fill="#5B21B6">Dedup + order</text><text x="91" y="67" class="s mu">key + commit time</text><g transform="translate(22 102)"><rect width="204" height="66" rx="12" fill="#F5F3FF"/><text x="14" y="22" class="m" fill="#6D28D9">PARTITION BY customer_key</text><text x="14" y="42" class="m" fill="#6D28D9">ORDER BY commit_ts, source_seq</text><text x="14" y="59" class="s n">keep row_number = 1</text></g></g>
 <path d="M916 373h38" class="flow"/>
 <g data-node-id="quality-rules" transform="translate(954 268)" tabindex="0" aria-label="Quality rules gate"><title data-node-tooltip="true">Quality rules gate — Evaluate each deduplicated record against defined validity rules; branch pass/fail.</title><rect class="focus-ring" width="210" height="210" rx="21" fill="#FFF" stroke="#34D399" stroke-width="2" filter="url(#ss)"/><circle cx="105" cy="65" r="43" fill="#D1FAE5"/><path d="M82 65l15 15 31-38" fill="none" stroke="#059669" stroke-width="7"/><text x="105" y="129" text-anchor="middle" class="h2" fill="#065F46">Quality gate</text><text x="105" y="151" text-anchor="middle" class="s mu">validity · keys · ranges</text><g transform="translate(22 174)"><rect width="76" height="24" rx="12" fill="#ECFDF5"/><text x="60" y="16" text-anchor="middle" class="m" fill="#047857">PASS</text><rect x="90" width="76" height="24" rx="12" fill="#FFF7ED"/><text x="128" y="16" text-anchor="middle" class="m" fill="#C2410C">FAIL</text></g></g>
 <path d="M1164 343h38" class="flow"/><text x="1172" y="333" class="m t">pass</text>
 <g data-node-id="scd-merge" transform="translate(1202 268)" tabindex="0" aria-label="SCD Type 2 merge"><title data-node-tooltip="true">SCD Type 2 merge — Merge passing (and replayed) records into silver using slowly changing dimension history.</title><rect class="focus-ring" width="150" height="210" rx="21" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/><text x="75" y="34" text-anchor="middle" class="h3" fill="#065F46">SCD2 merge</text><g transform="translate(22 58)"><rect width="106" height="38" rx="8" fill="#D1FAE5"/><text x="12" y="17" class="m" fill="#047857">OLD VERSION</text><text x="12" y="31" class="m n">valid_to = t</text><path d="M53 40v19" stroke="#059669" stroke-width="3" marker-end="url(#sa)"/><rect y="61" width="106" height="46" rx="8" fill="#A7F3D0"/><text x="12" y="79" class="m" fill="#047857">NEW CURRENT</text><text x="12" y="95" class="m n">valid_from = t</text></g><text x="75" y="190" text-anchor="middle" class="m mu">replay uses same rule</text></g>
 <path d="M1059 478v58H890v36" class="retry"/><text x="914" y="526" class="m" fill="#B45309">fail + reason code</text>
 <g data-node-id="quarantine" transform="translate(746 572)" tabindex="0" aria-label="Quarantine table"><title data-node-tooltip="true">Quarantine table — Failed records land in a separate Delta table with their failure reason, for triage.</title><rect class="focus-ring" width="288" height="154" rx="19" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><path d="M24 101l35-66 35 66z" fill="#F59E0B"/><path d="M59 55v25M59 90v3" stroke="#FFF" stroke-width="6" stroke-linecap="round"/><text x="112" y="41" class="h2" fill="#9A3412">Quarantine table</text><text x="112" y="64" class="s mu">payload + reason + owner</text><text x="112" y="94" class="s n">Pipeline continues safely</text><text x="112" y="116" class="m mu">Failed rows remain replayable</text></g>
 <path d="M1034 649h38" class="retry"/>
 <g data-node-id="replay-fix" transform="translate(1072 572)" tabindex="0" aria-label="Triage &amp; fix"><title data-node-tooltip="true">Triage &amp; fix — An operator or corrective job resolves the quarantined record&apos;s root cause.</title><rect class="focus-ring" width="280" height="154" rx="19" fill="#FFF" stroke="#FB923C" stroke-width="2"/><circle cx="48" cy="50" r="27" fill="#FFEDD5"/><path d="M35 61l24-24M48 35l13 13" stroke="#EA580C" stroke-width="5" stroke-linecap="round"/><text x="90" y="42" class="h2" fill="#9A3412">Triage + fix</text><text x="90" y="65" class="s mu">owner action or corrective job</text><text x="22" y="104" class="s n">Correct → retest → replay</text><text x="22" y="126" class="m mu">Never edit history silently</text></g><path d="M1212 572v-70h65v-24" class="retry"/><text x="1220" y="548" class="m" fill="#B45309">replay</text>
 <g data-node-id="nondeterministic-latest-row" transform="translate(86 518)" tabindex="0" aria-label="Nondeterministic &apos;latest row&apos; logic"><title data-node-tooltip="true">Nondeterministic &apos;latest row&apos; logic — Resolving the current row without a deterministic ordering key corrupts SCD history.</title><rect class="focus-ring" width="594" height="208" rx="21" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/><text x="24" y="36" class="h2" fill="#991B1B">History integrity check</text><text x="24" y="62" class="s" fill="#7F1D1D">A business key is not enough. “Latest” needs a stable, total ordering.</text><g transform="translate(24 84)"><rect width="245" height="88" rx="12" fill="#FFF"/><text x="16" y="23" class="m" fill="#DC2626">SHAKY</text><text x="16" y="45" class="s n">ORDER BY ingest_timestamp</text><text x="16" y="66" class="m mu">ties choose different winners</text></g><g transform="translate(285 84)"><rect width="285" height="88" rx="12" fill="#ECFDF5"/><text x="16" y="23" class="m" fill="#047857">DETERMINISTIC</text><text x="16" y="45" class="s n">commit_ts, source_sequence, hash</text><text x="16" y="66" class="m mu">same input → same winner on retry</text></g></g>
 <path d="M1277 478v296h-301v36" class="flow"/><text x="1000" y="767" class="m t">accumulated files</text>
 <g data-node-id="optimize-compact" transform="translate(828 810)" tabindex="0" aria-label="Optimize / compact (V-Order)"><title data-node-tooltip="true">Optimize / compact (V-Order) — Periodically compact small files and apply V-Order to the merged Delta table.</title><rect class="focus-ring" width="302" height="150" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/><circle cx="49" cy="51" r="28" fill="#DBEAFE"/><path d="M33 41h32M37 51h24M41 61h16" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><text x="91" y="42" class="h2" fill="#1E40AF">Compact + V-Order</text><text x="91" y="65" class="s mu">rewrite existing Delta files</text><path d="M22 97h258" stroke="#BFDBFE"/><text x="22" y="122" class="s n">Read-heavy tables only</text><text x="22" y="140" class="m mu">Schedule from file-growth evidence</text><circle cx="278" cy="22" r="14" fill="#FFF"/><text x="278" y="26" text-anchor="middle" class="ev">S2</text></g>
 <path d="M1130 885h38" class="flow"/>
 <g data-node-id="silver-tables" transform="translate(1168 810)" tabindex="0" aria-label="Conformed silver Delta tables"><title data-node-tooltip="true">Conformed silver Delta tables — The published, queryable silver tables consumers and downstream gold layers read.</title><rect class="focus-ring" width="208" height="150" rx="20" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/><g transform="translate(20 22)" fill="#6EE7B7"><ellipse cx="35" cy="8" rx="35" ry="8"/><path d="M0 8v50c0 6 16 10 35 10s35-4 35-10V8c-8 5-62 5-70 0z"/></g><text x="100" y="40" class="h2" fill="#065F46">Silver</text><text x="100" y="63" class="s mu">conformed Delta</text><text x="20" y="111" class="s n">Typed · keyed · replayable</text><text x="20" y="132" class="m mu">Gold + semantic consumers</text><circle cx="184" cy="22" r="14" fill="#FFF"/><text x="184" y="26" text-anchor="middle" class="ev">S1</text></g>
 <g transform="translate(64 992)"><rect width="1312" height="68" rx="17" fill="#E2E8F0"/><text x="22" y="27" class="h3 n">What to watch</text><text x="22" y="50" class="s mu">Determinism is the control plane: stable key + total ordering + idempotent merge. Quarantine keeps failures visible without making clean rows wait.</text><rect x="1058" y="17" width="226" height="34" rx="12" fill="#FFF"/><text x="1171" y="39" text-anchor="middle" class="m" fill="#0F766E" font-weight="700">REPLAY MUST BE BORING</text></g><text x="1376" y="1088" text-anchor="end" class="m" fill="#64748B">Fabric Atlas original · product-neutral vector illustration</text>
</svg>
