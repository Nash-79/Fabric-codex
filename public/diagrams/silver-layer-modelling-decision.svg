<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" font-family="Segoe UI,Inter,Arial,sans-serif" role="img" aria-labelledby="silver-layer-modelling-decision-title silver-layer-modelling-decision-desc" data-diagram-id="silver-layer-modelling-decision">
 <title id="silver-layer-modelling-decision-title">History, Quarantine, and When to Optimize</title><desc id="silver-layer-modelling-decision-desc">A decision tree with three questions. The first asks whether anyone needs to see the state of a row as it was at a past point in time: if yes, the table needs SCD Type 2 history; if no, an overwrite or snapshot is simpler and cheaper. The second asks what should happen to records that fail a quality rule — quarantine them and keep the good records flowing, or fail the whole batch when partial data would be worse than none. The third asks whether the table is read-heavy enough to justify V-Order and compaction, which is disabled by default in new Fabric workspaces and costs roughly fifteen percent more write time. A warning branch covers the specific failure of resolving the latest row without a deterministic ordering key.</desc>
 <defs><linearGradient id="sdh" x2="1"><stop stop-color="#78350F"/><stop offset=".45" stop-color="#475569"/><stop offset="1" stop-color="#0F766E"/></linearGradient><filter id="sds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="5" stdDeviation="6" flood-color="#0F172A" flood-opacity=".13"/></filter><marker id="sda" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#0F766E"/></marker><marker id="sdw" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#D97706"/></marker><style>.k{font-size:13px;font-weight:700;letter-spacing:2px}.h1{font-size:34px;font-weight:750}.h2{font-size:19px;font-weight:700}.h3{font-size:15px;font-weight:700}.b{font-size:13px}.s{font-size:12px}.m{font-size:11px}.n{fill:#0F172A}.mu{fill:#475569}.t{fill:#0F766E}.w{fill:#FFF}.ev{font-size:11px;font-weight:700;fill:#0369A1}.flow{fill:none;stroke:#0F766E;stroke-width:3;marker-end:url(#sda)}[data-node-id]:focus{outline:none}[data-node-id]:focus>rect,[data-node-id]:focus>.focus-ring{stroke:#2563EB!important;stroke-width:4!important}</style></defs>
 <rect width="1440" height="1010" fill="#F8FAFC"/><rect width="1440" height="168" fill="url(#sdh)"/><circle cx="1325" cy="15" r="150" fill="#FFF" opacity=".06"/><text x="64" y="43" class="k" fill="#FED7AA">FABRIC ATLAS · SILVER DESIGN DECISIONS</text><text x="64" y="84" class="h1 w">Declare grain. Preserve only needed history. Optimise from evidence.</text><text x="64" y="119" font-size="17" fill="#E2F7F1">Three decisions turn raw records into a reliable serving layer without unnecessary cost.</text><g transform="translate(64 138)"><rect width="245" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">1 · grain + history</text></g><g transform="translate(323 138)"><rect width="245" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">2 · failure isolation</text></g><g transform="translate(582 138)"><rect width="285" height="24" rx="12" fill="#FFF" opacity=".14"/><text x="15" y="17" class="s w">3 · physical serving shape</text></g>
 <g data-node-id="history-question" transform="translate(64 205)" tabindex="0" aria-label="Does anyone need the row as it was?"><title data-node-tooltip="true">Does anyone need the row as it was? — The history question: SCD Type 2 is justified by a real point-in-time requirement, nothing less.</title><rect class="focus-ring" width="412" height="210" rx="23" fill="#FFF" stroke="#FB923C" stroke-width="2" filter="url(#sds)"/><rect width="412" height="40" rx="23" fill="#9A3412"/><path d="M0 20h412v20H0z" fill="#9A3412"/><text x="20" y="27" class="s w" font-weight="700">GATE 1 · GRAIN + HISTORY</text><circle cx="55" cy="90" r="28" fill="#FFEDD5"/><path d="M39 90h32M55 74v32" stroke="#EA580C" stroke-width="4"/><text x="101" y="78" class="h2 n">Does anyone ask</text><text x="101" y="102" class="h2 n">“what was true then?”</text><text x="24" y="143" class="s mu">Prerequisite: one row represents one declared entity</text><text x="24" y="162" class="s mu">state at one effective time.</text><rect x="24" y="181" width="364" height="21" rx="10" fill="#FFF7ED"/><text x="42" y="196" class="m" fill="#9A3412">NAME THE BUSINESS KEY + EFFECTIVE-TIME SOURCE</text></g>
 <path d="M476 310h56v-72h52" class="flow"/><text x="500" y="225" class="m t">yes · as-of questions</text>
 <g data-node-id="history-scd2" transform="translate(584 194)" tabindex="0" aria-label="SCD Type 2 history"><title data-node-tooltip="true">SCD Type 2 history — Version the row: close the old record, open a new one, keep both.</title><rect class="focus-ring" width="356" height="170" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/><text x="22" y="33" class="h2" fill="#1E40AF">SCD Type 2 history</text><text x="22" y="56" class="s mu">Pay the versioning cost because consumers need it</text><g transform="translate(22 80)"><rect width="138" height="58" rx="10" fill="#DBEAFE"/><text x="14" y="21" class="m" fill="#1D4ED8">OLD ROW</text><text x="14" y="41" class="s n">valid_to = change time</text><path d="M145 29h28" stroke="#2563EB" stroke-width="3" marker-end="url(#sda)"/><rect x="178" width="138" height="58" rx="10" fill="#BFDBFE"/><text x="192" y="21" class="m" fill="#1D4ED8">NEW ROW</text><text x="192" y="41" class="s n">is_current = true</text></g></g>
 <path d="M476 310h56v112h52" class="flow"/><text x="500" y="410" class="m t">no · current state only</text>
 <g data-node-id="history-overwrite" transform="translate(584 382)" tabindex="0" aria-label="Overwrite or snapshot"><title data-node-tooltip="true">Overwrite or snapshot — No point-in-time requirement, so keep the current state and skip the versioning cost.</title><rect class="focus-ring" width="356" height="152" rx="20" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/><circle cx="52" cy="53" r="28" fill="#D1FAE5"/><path d="M36 53h32M52 37v32" stroke="#059669" stroke-width="4"/><text x="94" y="43" class="h2" fill="#065F46">Overwrite / snapshot</text><text x="94" y="66" class="s mu">Keep current state; skip row versioning</text><path d="M22 96h312" stroke="#A7F3D0"/><text x="22" y="121" class="s n">Simpler merges · smaller table · clear retention policy</text><circle cx="332" cy="22" r="14" fill="#FFF"/><text x="332" y="26" text-anchor="middle" class="ev">S1</text></g>
 <path d="M940 278h50v188h52" class="flow"/><path d="M940 458h102" class="flow"/>
 <g data-node-id="failure-question" transform="translate(1042 357)" tabindex="0" aria-label="What happens to records that fail a rule?"><title data-node-tooltip="true">What happens to records that fail a rule? — Second question: quarantine the bad records, or fail the whole batch?</title><rect class="focus-ring" width="334" height="220" rx="22" fill="#FFF" stroke="#F59E0B" stroke-width="2" filter="url(#sds)"/><rect width="334" height="38" rx="22" fill="#D97706"/><path d="M0 19h334v19H0z" fill="#D97706"/><text x="18" y="26" class="s w" font-weight="700">GATE 2 · FAILURE POLICY</text><text x="22" y="73" class="h2 n">What should bad rows block?</text><g transform="translate(22 94)"><rect width="138" height="88" rx="12" fill="#FFF7ED"/><text x="14" y="22" class="h3" fill="#9A3412">Quarantine</text><text x="14" y="44" class="m mu">row-level defects</text><text x="14" y="62" class="s n">publish clean rows</text><text x="14" y="78" class="m mu">retain reason + owner</text></g><g transform="translate(174 94)"><rect width="138" height="88" rx="12" fill="#FEF2F2"/><text x="14" y="22" class="h3" fill="#991B1B">Fail batch</text><text x="14" y="44" class="m mu">atomic consistency</text><text x="14" y="62" class="s n">publish nothing</text><text x="14" y="78" class="m mu">fix + rerun all</text></g><text x="22" y="207" class="m mu">Record the policy per table, not per platform.</text></g>
 <g data-node-id="warning-nondeterministic-latest" transform="translate(64 590)" tabindex="0" aria-label="Trap: &apos;latest row&apos; with no ordering key"><title data-node-tooltip="true">Trap: &apos;latest row&apos; with no ordering key — Resolving the latest row per key without a deterministic ordering column corrupts history — differently each retry.</title><rect class="focus-ring" width="662" height="180" rx="22" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/><path d="M27 137l41-78 41 78z" fill="#EF4444"/><path d="M68 84v29M68 124v3" stroke="#FFF" stroke-width="7" stroke-linecap="round"/><text x="136" y="42" class="h2" fill="#991B1B">Trap: “latest row” without total ordering</text><text x="136" y="69" class="s" fill="#7F1D1D">Two records share a timestamp → retry chooses a different winner → history changes.</text><g transform="translate(136 93)"><rect width="220" height="50" rx="11" fill="#FFF"/><text x="14" y="20" class="m" fill="#DC2626">INSUFFICIENT</text><text x="14" y="38" class="s n">ORDER BY ingest_ts</text></g><g transform="translate(370 93)"><rect width="260" height="50" rx="11" fill="#ECFDF5"/><text x="14" y="20" class="m" fill="#047857">DETERMINISTIC</text><text x="14" y="38" class="s n">commit_ts, sequence, hash</text></g></g><path d="M500 590V551H762v-17" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#sdw)"/>
 <path d="M1209 577v36H939v54" class="flow"/>
 <g data-node-id="optimize-question" transform="translate(758 646)" tabindex="0" aria-label="Is this table read-heavy enough for V-Order?"><title data-node-tooltip="true">Is this table read-heavy enough for V-Order? — Third question: V-Order costs ~15% on writes and is off by default — spend it where reads dominate.</title><rect class="focus-ring" width="618" height="178" rx="22" fill="#FFF" stroke="#60A5FA" stroke-width="2" filter="url(#sds)"/><rect width="618" height="38" rx="22" fill="#1D4ED8"/><path d="M0 19h618v19H0z" fill="#1D4ED8"/><text x="18" y="26" class="s w" font-weight="700">GATE 3 · SERVING SHAPE</text><text x="22" y="72" class="h2 n">Is this table read-heavy enough for V-Order?</text><g transform="translate(22 94)"><rect width="272" height="56" rx="12" fill="#EFF6FF"/><text x="14" y="21" class="m" fill="#1D4ED8">READ-DOMINANT</text><text x="14" y="40" class="s n">frequent scans · stable write cadence</text></g><g transform="translate(308 94)"><rect width="286" height="56" rx="12" fill="#F1F5F9"/><text x="14" y="21" class="m mu">WRITE-DOMINANT / SMALL</text><text x="14" y="40" class="s n">leave V-Order off; avoid unearned cost</text></g><circle cx="594" cy="21" r="14" fill="#FFF"/><text x="594" y="25" text-anchor="middle" class="ev">S2</text></g>
 <path d="M1067 824v36" class="flow"/>
 <g data-node-id="optimize-compact" transform="translate(758 860)" tabindex="0" aria-label="OPTIMIZE to rewrite existing files"><title data-node-tooltip="true">OPTIMIZE to rewrite existing files — Toggling the property only affects future writes — existing data needs a physical rewrite.</title><rect class="focus-ring" width="618" height="104" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/><circle cx="52" cy="52" r="29" fill="#DBEAFE"/><path d="M34 42h36M39 52h26M44 62h16" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><text x="98" y="39" class="h2" fill="#1E40AF">Rewrite existing files with OPTIMIZE</text><text x="98" y="64" class="s mu">The table property changes future writes only; measure before and after the physical rewrite.</text><rect x="98" y="76" width="244" height="19" rx="9" fill="#DBEAFE"/><text x="220" y="90" text-anchor="middle" class="m" fill="#1D4ED8">COMPACT · V-ORDER · VERIFY</text><circle cx="594" cy="20" r="14" fill="#FFF"/><text x="594" y="24" text-anchor="middle" class="ev">S2</text></g>
 <g transform="translate(64 803)"><rect width="662" height="161" rx="21" fill="#E2E8F0"/><text x="22" y="32" class="h3 n">Silver acceptance contract</text><text x="22" y="59" class="s mu">✓ grain and business key declared</text><text x="22" y="81" class="s mu">✓ deterministic ordering survives replay</text><text x="22" y="103" class="s mu">✓ failure policy exposes owner + reason</text><text x="22" y="125" class="s mu">✓ file optimization backed by read/write evidence</text><rect x="414" y="42" width="218" height="75" rx="14" fill="#FFF"/><text x="523" y="64" text-anchor="middle" class="m" fill="#0F766E" font-weight="700">DESIGN TEST</text><text x="523" y="84" text-anchor="middle" class="s n">Can the same batch replay</text><text x="523" y="102" text-anchor="middle" class="s n">to the same current row?</text></g><text x="1376" y="997" text-anchor="end" class="m" fill="#64748B">Fabric Atlas original · product-neutral vector illustration</text>
</svg>
