<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="spark-catalyst-query-compilation-title spark-catalyst-query-compilation-desc" data-diagram-id="spark-catalyst-query-compilation">
  <title id="spark-catalyst-query-compilation-title">Catalyst query compilation in Fabric Spark</title>
  <desc id="spark-catalyst-query-compilation-desc">Catalyst query compilation in Microsoft Fabric Spark: Parsed logical plan, Analyzed logical plan, Optimized logical plan, Cost-based physical plan, Whole-stage code generation, and Native Execution Engine offload branching.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="scq-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B1A5C"/>
      <stop offset="0.5" stop-color="#5B2A86"/>
      <stop offset="1" stop-color="#7C3AAD"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="scq-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3B1A5C" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="scq-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AAD"/>
    </marker>
    <marker id="scq-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="scq-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>

    <!-- Official Microsoft Notebook Item Icon Gradients -->
    <linearGradient id="scq-nb-a" x1="11.111" x2="15.576" y1="2" y2="30.067" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#EBEBEB"/></linearGradient>
    <linearGradient id="scq-nb-c" x1="9.691" x2="19.427" y1="8.5" y2="20.784" gradientUnits="userSpaceOnUse"><stop stop-color="#4BA446"/><stop offset="1" stop-color="#3F7D35"/></linearGradient>
    <linearGradient id="scq-nb-f" x1="12.104" x2="16.851" y1="2" y2="29.972" gradientUnits="userSpaceOnUse"><stop stop-color="#BBB"/><stop offset="1" stop-color="#888"/></linearGradient>
    <radialGradient id="scq-nb-b" cx="0" cy="0" r="1" gradientTransform="matrix(11.61113 22.16669 -17.08352 8.94852 12.028 9.292)" gradientUnits="userSpaceOnUse"><stop offset=".177" stop-color="#fff"/><stop offset="1" stop-color="#B8B8B8"/></radialGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="860" fill="#FAF5FF"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#scq-head)"/>
  <g data-official-icon="microsoft" data-icon-name="notebook_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <path fill="url(#scq-nb-a)" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#scq-nb-b)" fill-opacity=".2" d="M5 5.5A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5z"/>
      <path fill="url(#scq-nb-c)" d="M17.494 8.521a.5.5 0 0 1 .335.623l-2.7 9a.5.5 0 1 1-.957-.287l2.7-9a.5.5 0 0 1 .622-.336"/>
      <path fill="url(#scq-nb-c)" d="M18.797 10.446a.5.5 0 0 1 .707 0l2.63 2.63a.6.6 0 0 1 0 .848l-2.63 2.63a.5.5 0 0 1-.707-.708l2.346-2.346-2.346-2.347a.5.5 0 0 1 0-.707"/>
      <path fill="url(#scq-nb-c)" d="M12.496 10.446a.5.5 0 1 1 .707.707L10.857 13.5l2.346 2.346a.5.5 0 0 1-.707.707l-2.63-2.629a.6.6 0 0 1 0-.848z"/>
      <path fill="url(#scq-nb-f)" fill-rule="evenodd" d="M5 26.5v-21A3.5 3.5 0 0 1 8.5 2h15A3.5 3.5 0 0 1 27 5.5v21a3.5 3.5 0 0 1-3.5 3.5h-15A3.5 3.5 0 0 1 5 26.5M8.5 3h15A2.5 2.5 0 0 1 26 5.5V20a3 3 0 0 1-3 3H8.5A3.5 3.5 0 0 0 6 24.05V5.5A2.5 2.5 0 0 1 8.5 3M26 25.646v.854a2.5 2.5 0 0 1-2.5 2.5h-15a2.5 2.5 0 0 1 0-5H23a4 4 0 0 0 3-1.354V23a3 3 0 0 1-3 3H8a.5.5 0 0 0 0 1h15a4 4 0 0 0 3-1.354" clip-rule="evenodd"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Catalyst — Query Compilation &amp; Optimization Lifecycle</text>
  <text x="40" y="64" font-size="12" fill="#E9D8FD">Parse ➔ Catalog analysis ➔ Rule-based logical optimization ➔ Cost-based physical planning ➔ Codegen &amp; NEE</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#E9D8FD"/>
    <circle cx="20" cy="15" r="5" fill="#7C3AAD"/><text x="32" y="19" fill="#4C1D95" font-weight="600">Lane 1: Logical Compilation</text>
    <circle cx="240" cy="15" r="5" fill="#2563EB"/><text x="252" y="19" fill="#1E40AF" font-weight="600">Lane 2: Physical Costing &amp; Codegen</text>
    <circle cx="490" cy="15" r="5" fill="#059669"/><text x="502" y="19" fill="#065F46" font-weight="600">Native Velox SIMD Offload</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: LOGICAL COMPILATION (PARSED ➔ ANALYZED ➔ OPTIMIZED)               -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="290" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.4"/>
  <rect x="56" y="156" width="370" height="20" rx="10" fill="#EDE9FE"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#4C1D95" letter-spacing="1px">LANE 1: LOGICAL COMPILATION &amp; REWRITES</text>

  <!-- Node: parsed -->
  <g data-node-id="parsed" role="group" tabindex="0" aria-label="1. Parsed logical plan">
    <title data-node-tooltip="true">1. Parsed logical plan — The query becomes an unresolved operator tree; names are not yet checked.</title>
    <rect x="56" y="186" width="330" height="230" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#scq-shadow)"/>
    <rect x="70" y="198" width="90" height="16" rx="8" fill="#EDE9FE"/><text x="115" y="209" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">PARSER (AST)</text>
    <text x="70" y="234" font-size="13" font-weight="700" fill="#4C1D95">1 · Parsed Logical Plan</text>
    <text x="70" y="258" font-size="10" fill="#5B21B6">• Converts SQL text or DataFrame calls</text>
    <text x="70" y="274" font-size="10" fill="#5B21B6">  into an unresolved operator tree</text>
    <text x="70" y="296" font-size="10" fill="#5B21B6">• Table &amp; column names are pure strings</text>
    <text x="70" y="318" font-size="10" fill="#5B21B6">• Validates SQL grammar &amp; syntax</text>
    <text x="70" y="340" font-size="10" fill="#5B21B6">• Observable via <tspan font-family="monospace">df.explain("extended")</tspan></text>
    <rect x="70" y="364" width="302" height="40" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="78" y="380" font-size="9" font-weight="600" fill="#6D28D9">Failure Mode:</text>
    <text x="78" y="394" font-size="8.5" fill="#5B21B6">Syntax error halts query before catalog check.</text>
    <rect x="320" y="198" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="346" y="208" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Connector: parsed -> analyzed -->
  <path d="M 386 301 H 442" stroke="#7C3AAD" stroke-width="2.2" fill="none" marker-end="url(#scq-arr-purple)"/>

  <!-- Node: analyzed -->
  <g data-node-id="analyzed" role="group" tabindex="0" aria-label="2. Analyzed logical plan">
    <title data-node-tooltip="true">2. Analyzed logical plan — Catalog resolution binds relations and columns to real schemas and types.</title>
    <rect x="442" y="186" width="330" height="230" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#scq-shadow)"/>
    <rect x="456" y="198" width="110" height="16" rx="8" fill="#EDE9FE"/><text x="511" y="209" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">CATALOG BIND</text>
    <text x="456" y="234" font-size="13" font-weight="700" fill="#4C1D95">2 · Analyzed Logical Plan</text>
    <text x="456" y="258" font-size="10" fill="#5B21B6">• Resolves relations against Lakehouse Hive</text>
    <text x="456" y="274" font-size="10" fill="#5B21B6">  Metastore / Unity Catalog schema</text>
    <text x="456" y="296" font-size="10" fill="#5B21B6">• Assigns concrete data types to columns</text>
    <text x="456" y="318" font-size="10" fill="#5B21B6">• Resolves column scope in multi-table joins</text>
    <text x="456" y="340" font-size="10" fill="#5B21B6">• Type coercions and implicit casts applied</text>
    <rect x="456" y="364" width="302" height="40" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="464" y="380" font-size="9" font-weight="600" fill="#6D28D9">Failure Mode:</text>
    <text x="464" y="394" font-size="8.5" fill="#5B21B6">Misspelled column throws AnalysisException.</text>
    <rect x="706" y="198" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="732" y="208" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Connector: analyzed -> optimized -->
  <path d="M 772 301 H 828" stroke="#7C3AAD" stroke-width="2.2" fill="none" marker-end="url(#scq-arr-purple)"/>

  <!-- Node: optimized -->
  <g data-node-id="optimized" role="group" tabindex="0" aria-label="3. Optimized logical plan">
    <title data-node-tooltip="true">3. Optimized logical plan — Rule-based rewrites including predicate pushdown and column pruning.</title>
    <rect x="828" y="186" width="332" height="230" rx="10" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#scq-shadow)"/>
    <rect x="842" y="198" width="110" height="16" rx="8" fill="#EDE9FE"/><text x="897" y="209" text-anchor="middle" font-size="8.5" font-weight="700" fill="#6D28D9">RULE OPTIMIZER</text>
    <text x="842" y="234" font-size="13" font-weight="700" fill="#4C1D95">3 · Optimized Logical Plan</text>
    <text x="842" y="258" font-size="10" fill="#5B21B6">• Rule-based rewrites run on resolved tree</text>
    <text x="842" y="278" font-size="10" fill="#5B21B6">• <tspan font-weight="700">Predicate Pushdown:</tspan> Pushes filters to</text>
    <text x="842" y="294" font-size="10" fill="#5B21B6">  Parquet scan reader (<tspan font-family="monospace">PushedFilters</tspan>)</text>
    <text x="842" y="316" font-size="10" fill="#5B21B6">• <tspan font-weight="700">Column Pruning:</tspan> Drops unused columns</text>
    <text x="842" y="332" font-size="10" fill="#5B21B6">  from storage (<tspan font-family="monospace">ReadSchema</tspan>)</text>
    <rect x="842" y="364" width="304" height="40" rx="6" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="850" y="380" font-size="9" font-weight="600" fill="#6D28D9">Failure Mode:</text>
    <text x="850" y="394" font-size="8.5" fill="#5B21B6">PushedFilters:[] means full scan reads all data.</text>
    <rect x="1094" y="198" width="52" height="14" rx="7" fill="#EDE9FE"/><text x="1120" y="208" text-anchor="middle" font-size="8" font-weight="700" fill="#6D28D9">FACT</text>
  </g>

  <!-- Connector: Lane 1 -> Lane 2 -->
  <path d="M 994 416 V 440 H 221 V 466" stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#scq-arr-blue)"/>

  <!-- ========================================================================= -->
  <!-- LANE 2: PHYSICAL PLANNING & EXECUTION (PHYSICAL ➔ CODEGEN ➔ NEE)          -->
  <!-- ========================================================================= -->
  <rect x="40" y="454" width="1120" height="340" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.4"/>
  <rect x="56" y="464" width="370" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="478" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">LANE 2: PHYSICAL PLANNING, CODEGEN &amp; NATIVE OFFLOAD</text>

  <!-- Node: physical -->
  <g data-node-id="physical" role="group" tabindex="0" aria-label="4. Physical plan">
    <title data-node-tooltip="true">4. Physical plan — Candidate physical plans are costed and one algorithm is chosen.</title>
    <rect x="56" y="494" width="330" height="280" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#scq-shadow)"/>
    <rect x="70" y="506" width="110" height="16" rx="8" fill="#DBEAFE"/><text x="125" y="517" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">COST PLANNER</text>
    <text x="70" y="542" font-size="13" font-weight="700" fill="#1E3A8A">4 · Physical Plan &amp; Costing</text>
    <text x="70" y="566" font-size="10" fill="#1E40AF">• Enumerates physical operator candidates</text>
    <text x="70" y="586" font-size="10" fill="#1E40AF">• <tspan font-weight="700">Cost-Based Optimizer (CBO):</tspan> Costs</text>
    <text x="70" y="602" font-size="10" fill="#1E40AF">  strategies using table &amp; column statistics</text>
    <text x="70" y="624" font-size="10" fill="#1E40AF">• <tspan font-weight="700">Join Selection:</tspan> BroadcastHashJoin</text>
    <text x="70" y="640" font-size="10" fill="#1E40AF">  (&lt;10MB default) vs SortMergeJoin / ShuffledHash</text>
    <text x="70" y="662" font-size="10" fill="#1E40AF">• Inserts Shuffle Exchange &amp; Sort operators</text>
    <rect x="70" y="700" width="302" height="60" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="78" y="718" font-size="9" font-weight="600" fill="#1D4ED8">Adaptive Query Execution (AQE):</text>
    <text x="78" y="734" font-size="8.5" fill="#1E40AF">Re-optimizes joins and coalesces partitions at</text>
    <text x="78" y="748" font-size="8.5" fill="#1E40AF">runtime using actual stage output statistics.</text>
    <rect x="320" y="506" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="346" y="516" text-anchor="middle" font-size="8" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Connector: physical -> codegen -->
  <path d="M 386 634 H 442" stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#scq-arr-blue)"/>

  <!-- Node: codegen -->
  <g data-node-id="codegen" role="group" tabindex="0" aria-label="5. Whole-stage code generation">
    <title data-node-tooltip="true">5. Whole-stage code generation — Operators are fused into one generated Java function per stage.</title>
    <rect x="442" y="494" width="330" height="280" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#scq-shadow)"/>
    <rect x="456" y="506" width="120" height="16" rx="8" fill="#DBEAFE"/><text x="516" y="517" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">WHOLE-STAGE CODEGEN</text>
    <text x="456" y="542" font-size="13" font-weight="700" fill="#1E3A8A">5 · Tungsten Stage Fusion</text>
    <text x="456" y="566" font-size="10" fill="#1E40AF">• Fuses adjacent operators within each stage</text>
    <text x="456" y="582" font-size="10" fill="#1E40AF">  into a single generated Java bytecode loop</text>
    <text x="456" y="604" font-size="10" fill="#1E40AF">• Eliminates virtual function call overhead</text>
    <text x="456" y="620" font-size="10" fill="#1E40AF">  and keeps intermediate data in CPU registers</text>
    <text x="456" y="642" font-size="10" fill="#1E40AF">• Fused operators marked with <tspan font-family="monospace">*(n)</tspan> asterisk</text>
    <text x="456" y="662" font-size="10" fill="#1E40AF">• Inspect via <tspan font-family="monospace">df.explain("codegen")</tspan></text>
    <rect x="456" y="700" width="302" height="60" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="464" y="718" font-size="9" font-weight="600" fill="#1D4ED8">Fusion Disruption Risk:</text>
    <text x="464" y="734" font-size="8.5" fill="#1E40AF">Python UDFs or unsupported expressions break</text>
    <text x="464" y="748" font-size="8.5" fill="#1E40AF">the fusion chain and eliminate register caching.</text>
    <rect x="706" y="506" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="732" y="516" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Connector: codegen -> nee -->
  <path d="M 772 634 H 828" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#scq-arr-green)"/>

  <!-- Node: nee -->
  <g data-node-id="nee" role="group" tabindex="0" aria-label="Native path branches after this">
    <title data-node-tooltip="true">Native path branches after this — Native execution engages after planning and preserves optimizer behaviour.</title>
    <rect x="828" y="494" width="332" height="280" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="1.8" filter="url(#scq-shadow)"/>
    <rect x="842" y="506" width="130" height="16" rx="8" fill="#D1FAE5"/><text x="907" y="517" text-anchor="middle" font-size="8.5" font-weight="700" fill="#047857">NATIVE VELOX OFFLOAD</text>
    <text x="842" y="542" font-size="13" font-weight="700" fill="#064E3B">6 · Native Path Branching</text>
    <text x="842" y="566" font-size="10" fill="#065F46">• Native Execution Engine engages <tspan font-weight="700">after</tspan></text>
    <text x="842" y="582" font-size="10" fill="#065F46">  Catalyst completes physical planning</text>
    <text x="842" y="604" font-size="10" fill="#065F46">• Gluten translates supported operators into</text>
    <text x="842" y="620" font-size="10" fill="#065F46">  Substrait; Velox runs vectorized SIMD C++</text>
    <text x="842" y="642" font-size="10" fill="#065F46">• Preserves AQE, pushdown &amp; pruning 100%</text>
    <text x="842" y="662" font-size="10" fill="#065F46">• Unsupported operators fall back to JVM</text>
    <rect x="842" y="700" width="304" height="60" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="850" y="718" font-size="9" font-weight="600" fill="#047857">Fabric Runtime Control:</text>
    <text x="850" y="734" font-size="8.5" fill="#065F46">Toggled via <tspan font-family="monospace">spark.native.enabled</tspan> (default in R2.0);</text>
    <text x="850" y="748" font-size="8.5" fill="#065F46">visible as <tspan font-family="monospace">*NativeFileScan</tspan> in Spark UI plan.</text>
    <rect x="1094" y="506" width="52" height="14" rx="7" fill="#D1FAE5"/><text x="1120" y="516" text-anchor="middle" font-size="8" font-weight="700" fill="#047857">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="828" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Apache Spark Catalyst Architecture &amp; Microsoft Fabric Native Engine docs.</text>
</svg>
