<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-06.
       Grounded in sql-database claims: OLTP engine (Azure SQL DB engine),
       automatic near-real-time replication to OneLake as Delta/Parquet,
       companion SQL analytics endpoint, translytical read/write split,
       Entra ID auth, RLS/OLS, cross-DB federation, vector/RAG, auto-tuning. -->
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.6" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="0.55" stop-color="#117865"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8A020"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0078D4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="660" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1100" height="56" fill="url(#hdrGrad)"/>
  <text x="28" y="24" font-size="17" font-weight="700" fill="#FFFFFF">SQL Database in Fabric — Translytical Architecture</text>
  <text x="28" y="43" font-size="11" fill="#D9F5EE">OLTP engine · automatic near-real-time replication to OneLake Delta · SQL analytics endpoint (read/write split)</text>

  <!-- ═══════════════════════════════════════════════
       APPLICATION LAYER (top)
  ════════════════════════════════════════════════ -->
  <text x="28" y="80" font-size="11" letter-spacing="1.2" fill="#8A8886">APPLICATION LAYER</text>

  <!-- Write clients -->
  <rect x="28" y="88" width="220" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="138" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">OLTP Applications</text>
  <text x="138" y="129" text-anchor="middle" font-size="10" fill="#3F6259">Transactional reads + writes</text>
  <text x="138" y="143" text-anchor="middle" font-size="9" fill="#3F6259">via Entra ID auth only (no SQL auth)</text>

  <!-- Read clients -->
  <rect x="460" y="88" width="220" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="570" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">Analytics Consumers</text>
  <text x="570" y="129" text-anchor="middle" font-size="10" fill="#3F6259">Power BI · Spark · Notebooks</text>
  <text x="570" y="143" text-anchor="middle" font-size="9" fill="#3F6259">Data pipelines · read-only workloads</text>

  <!-- AI/RAG clients -->
  <rect x="830" y="88" width="240" height="58" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
  <text x="950" y="111" text-anchor="middle" font-size="12" font-weight="600" fill="#063D3B">AI / RAG Applications</text>
  <text x="950" y="129" text-anchor="middle" font-size="10" fill="#3F6259">LangChain · Semantic Kernel</text>
  <text x="950" y="143" text-anchor="middle" font-size="9" fill="#3F6259">Azure OpenAI · vector search</text>

  <!-- Write arrow down to OLTP engine -->
  <line x1="138" y1="146" x2="138" y2="195" stroke="#E8A020" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="144" y="175" font-size="9" font-weight="600" fill="#E8A020">WRITE</text>

  <!-- Read arrow down to analytics endpoint -->
  <line x1="570" y1="146" x2="570" y2="195" stroke="#0078D4" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="576" y="175" font-size="9" font-weight="600" fill="#0078D4">READ ONLY</text>

  <!-- AI arrow down to OLTP engine (vector column access) -->
  <line x1="950" y1="146" x2="950" y2="195" stroke="#2AAC94" stroke-width="2" marker-end="url(#arr)"/>
  <text x="956" y="175" font-size="9" font-weight="600" fill="#2AAC94">READ / WRITE</text>

  <!-- ═══════════════════════════════════════════════
       CORE ENGINE ROW
  ════════════════════════════════════════════════ -->

  <!-- SQL DB (OLTP) -->
  <rect x="28" y="200" width="380" height="180" rx="10" fill="#063D3B"/>
  <text x="218" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#25FFD4">SQL Database (OLTP Engine)</text>
  <text x="218" y="247" text-anchor="middle" font-size="10" fill="#D9F5EE">Azure SQL Database engine — fully managed in Fabric</text>

  <!-- Sub-features inside OLTP box -->
  <rect x="44" y="256" width="170" height="52" rx="6" fill="#0B5E50"/>
  <text x="129" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#25FFD4">Automatic Tuning</text>
  <text x="129" y="291" text-anchor="middle" font-size="9" fill="#9AD2C5">Auto index creation on</text>
  <text x="129" y="303" text-anchor="middle" font-size="9" fill="#9AD2C5">by default</text>

  <rect x="226" y="256" width="170" height="52" rx="6" fill="#0B5E50"/>
  <text x="311" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#25FFD4">Vector Data Type</text>
  <text x="311" y="291" text-anchor="middle" font-size="9" fill="#9AD2C5">Semantic / similarity</text>
  <text x="311" y="303" text-anchor="middle" font-size="9" fill="#9AD2C5">search · RAG store</text>

  <rect x="44" y="318" width="170" height="50" rx="6" fill="#0B5E50"/>
  <text x="129" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#25FFD4">Security</text>
  <text x="129" y="352" text-anchor="middle" font-size="9" fill="#9AD2C5">RLS · OLS · CMK</text>
  <text x="129" y="364" text-anchor="middle" font-size="9" fill="#9AD2C5">SQL Auditing</text>

  <rect x="226" y="318" width="170" height="50" rx="6" fill="#0B5E50"/>
  <text x="311" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#25FFD4">Capacity Billing</text>
  <text x="311" y="352" text-anchor="middle" font-size="9" fill="#9AD2C5">One Fabric capacity</text>
  <text x="311" y="364" text-anchor="middle" font-size="9" fill="#9AD2C5">spans multiple SQL DBs</text>

  <!-- SQL Analytics Endpoint -->
  <rect x="460" y="200" width="350" height="180" rx="10" fill="#EAF7F2" stroke="#117865" stroke-width="2"/>
  <text x="635" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#063D3B">SQL Analytics Endpoint</text>
  <text x="635" y="247" text-anchor="middle" font-size="10" fill="#3F6259">Auto-created when SQL DB is provisioned · read-only</text>

  <rect x="476" y="256" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="551" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">No write contention</text>
  <text x="551" y="290" text-anchor="middle" font-size="9" fill="#3F6259">Analytical queries do not</text>
  <text x="551" y="302" text-anchor="middle" font-size="9" fill="#3F6259">touch OLTP engine</text>

  <rect x="640" y="256" width="154" height="52" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="717" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">Cross-DB Federation</text>
  <text x="717" y="290" text-anchor="middle" font-size="9" fill="#3F6259">3-part T-SQL names join</text>
  <text x="717" y="302" text-anchor="middle" font-size="9" fill="#3F6259">warehouses, mirrors, DBs</text>

  <rect x="476" y="318" width="318" height="50" rx="6" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="635" y="337" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">Delta Tables on OneLake</text>
  <text x="635" y="353" text-anchor="middle" font-size="9" fill="#3F6259">Endpoint reads replicated Delta directly — standard T-SQL SELECT</text>
  <text x="635" y="365" text-anchor="middle" font-size="9" fill="#3F6259">No data movement for analytical reads</text>

  <!-- Entra ID auth note on analytics endpoint -->
  <rect x="830" y="200" width="240" height="180" rx="10" fill="#F7FAF9" stroke="#C8E8E0"/>
  <text x="950" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#063D3B">Authentication</text>
  <text x="950" y="240" text-anchor="middle" font-size="10" fill="#424242">Entra ID exclusively</text>
  <text x="950" y="256" text-anchor="middle" font-size="9" fill="#424242">No SQL authentication</text>
  <line x1="870" y1="268" x2="1060" y2="268" stroke="#C8E8E0"/>
  <text x="950" y="286" text-anchor="middle" font-size="10" font-weight="600" fill="#063D3B">Access requirement</text>
  <text x="950" y="303" text-anchor="middle" font-size="9" fill="#424242">User / SPN / group must</text>
  <text x="950" y="317" text-anchor="middle" font-size="9" fill="#424242">hold Read item permission</text>
  <text x="950" y="331" text-anchor="middle" font-size="9" fill="#424242">on the DB in Fabric</text>
  <text x="950" y="355" text-anchor="middle" font-size="9" fill="#8A8886">before any connection succeeds</text>

  <!-- ═══════════════════════════════════════════════
       REPLICATION ARROW (centre)
  ════════════════════════════════════════════════ -->
  <line x1="408" y1="290" x2="458" y2="290" stroke="#2AAC94" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="433" y="283" text-anchor="middle" font-size="9" font-weight="700" fill="#117865">near-RT</text>
  <text x="433" y="296" text-anchor="middle" font-size="9" fill="#117865">replication</text>
  <text x="433" y="309" text-anchor="middle" font-size="9" fill="#117865">auto · continuous</text>

  <!-- ═══════════════════════════════════════════════
       ONELAKE BAND (middle-bottom)
  ════════════════════════════════════════════════ -->
  <rect x="28" y="398" width="1044" height="72" rx="10" fill="url(#lakeGrad)"/>
  <text x="58" y="428" font-size="18" font-weight="700" fill="#FFFFFF">OneLake</text>
  <text x="58" y="450" font-size="11" fill="#D9F5EE">SQL DB data replicated here as Delta-Parquet · analytics endpoint reads this copy · shortcuts + other Fabric items co-located</text>
  <text x="58" y="464" font-size="10" fill="#9AD2C5">Spark · Notebooks · Power BI Direct Lake · Data Factory pipelines — all read the same Delta tables, no manual export</text>

  <!-- Arrow from OLTP to OneLake -->
  <line x1="218" y1="380" x2="218" y2="396" stroke="#2AAC94" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrow from OneLake to Analytics Endpoint -->
  <line x1="635" y1="398" x2="635" y2="380" stroke="#2AAC94" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       BOTTOM ROW — downstream consumers
  ════════════════════════════════════════════════ -->
  <text x="28" y="494" font-size="11" letter-spacing="1.2" fill="#8A8886">DOWNSTREAM ANALYTICAL CONSUMERS (read OneLake Delta directly)</text>

  <rect x="28" y="502" width="198" height="52" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="127" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Power BI</text>
  <text x="127" y="541" text-anchor="middle" font-size="9" fill="#3F6259">Semantic models · Direct Lake</text>

  <rect x="240" y="502" width="198" height="52" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="339" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Spark / Notebooks</text>
  <text x="339" y="541" text-anchor="middle" font-size="9" fill="#3F6259">Data Engineering · ML</text>

  <rect x="452" y="502" width="198" height="52" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="551" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Data Factory</text>
  <text x="551" y="541" text-anchor="middle" font-size="9" fill="#3F6259">Pipelines · Dataflow Gen2</text>

  <rect x="664" y="502" width="198" height="52" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="763" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Other SQL DBs</text>
  <text x="763" y="541" text-anchor="middle" font-size="9" fill="#3F6259">Cross-DB T-SQL federation</text>

  <rect x="876" y="502" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#9AD2C5"/>
  <text x="974" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#063D3B">Warehouse / Mirror</text>
  <text x="974" y="541" text-anchor="middle" font-size="9" fill="#3F6259">3-part T-SQL joins via endpoint</text>

  <!-- Arrows from OneLake to consumers -->
  <g stroke="#2AAC94" stroke-width="1.4">
    <line x1="127" y1="502" x2="127" y2="472" marker-end="url(#arr)"/>
    <line x1="339" y1="502" x2="339" y2="472" marker-end="url(#arr)"/>
    <line x1="551" y1="502" x2="551" y2="472" marker-end="url(#arr)"/>
    <line x1="763" y1="502" x2="763" y2="472" marker-end="url(#arr)"/>
    <line x1="974" y1="502" x2="974" y2="472" marker-end="url(#arr)"/>
  </g>

  <!-- DevOps / portability note -->
  <rect x="28" y="568" width="490" height="52" rx="6" fill="#F3F2F1" stroke="#E1DFDD"/>
  <text x="44" y="586" font-size="10" font-weight="600" fill="#063D3B">Portability &amp; DevOps</text>
  <text x="44" y="602" font-size="10" fill="#424242">SqlPackage: .bacpac import/export · .dacpac schema deployment · CI/CD incremental schema via SQL Projects</text>
  <text x="44" y="616" font-size="10" fill="#424242">Migration path: Azure SQL Database ↔ Fabric SQL Database (same underlying engine)</text>

  <!-- Translytical pattern highlight -->
  <rect x="546" y="568" width="526" height="52" rx="6" fill="#063D3B"/>
  <text x="562" y="588" font-size="11" font-weight="700" fill="#25FFD4">Translytical Pattern</text>
  <text x="562" y="604" font-size="10" fill="#D9F5EE">Write traffic → OLTP engine (transactional, low-latency). Read/analytics traffic → SQL analytics endpoint</text>
  <text x="562" y="618" font-size="10" fill="#9AD2C5">(backed by OneLake Delta). Zero contention between workload types. Near-real-time data freshness.</text>

  <!-- Footnote -->
  <text x="1072" y="650" text-anchor="end" font-size="9" fill="#8A8886">Fabric Atlas — original diagram, June 2026. Not a Microsoft asset.</text>
</svg>
