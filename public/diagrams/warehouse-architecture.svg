<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="warehouse-architecture-title warehouse-architecture-desc" data-diagram-id="warehouse-architecture">
  <title id="warehouse-architecture-title">Fabric Warehouse Architecture: SQL Surface, Compute, Caching, and Storage</title>
  <desc id="warehouse-architecture-desc">An architecture diagram showing the T-SQL surface, SELECT/non-SELECT workload isolation, distributed Polaris DQP engine, GPU acceleration (CoddSpeed), single-node traps, two-tier cache, and OneLake Delta storage.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="wh-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="wh-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="wh-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="wh-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="wh-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>

    <!-- Official Microsoft Warehouse Icon Gradients -->
    <linearGradient id="wh-icon-a" x1="4" x2="28" y1="4" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#0284C7"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
    <linearGradient id="wh-icon-b" x1="6" x2="26" y1="8" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="960" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#wh-head)"/>
  <g data-official-icon="microsoft" data-icon-name="warehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <rect x="4" y="4" width="24" height="24" rx="4" fill="url(#wh-icon-a)"/>
      <path fill="url(#wh-icon-b)" d="M8 8h16v4H8zm0 6h16v4H8zm0 6h16v4H8z"/>
      <circle cx="11" cy="10" r="1" fill="#FFFFFF"/>
      <circle cx="11" cy="16" r="1" fill="#FFFFFF"/>
      <circle cx="11" cy="22" r="1" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Fabric Warehouse Architecture: SQL Surface, Compute, Caching &amp; Storage</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">T-SQL Surface &amp; Workload Pools ➔ Polaris DQP Engine &amp; CoddSpeed GPU ➔ Layered Cache &amp; OneLake Storage</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">SQL Surface &amp; Storage Layer</text>
    <circle cx="310" cy="15" r="5" fill="#2563EB"/><text x="322" y="19" fill="#1E3A8A" font-weight="600">Polaris DQP Compute &amp; Hardware Acceleration</text>
    <circle cx="720" cy="15" r="5" fill="#DC2626"/><text x="732" y="19" fill="#991B1B" font-weight="600">Single-Node Non-Scalable Trap</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Atlas Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: SQL SURFACE & WORKLOAD MANAGEMENT (NODES 1 & 2)                   -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="156" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 1: T-SQL CLIENT INTERFACE &amp; 50/50 WORKLOAD ISOLATION</text>

  <!-- Node 1: tsql-surface -->
  <g data-node-id="tsql-surface" role="group" tabindex="0" aria-label="T-SQL surface">
    <title data-node-tooltip="true">T-SQL surface — A large SQL Database Engine surface: multi-table ACID, stored procedures, materialized views.</title>
    <rect x="56" y="184" width="536" height="184" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#wh-shadow)"/>
    <rect x="68" y="194" width="110" height="16" rx="8" fill="#CCFBF1"/><text x="123" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">SQL SURFACE</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#134E4A">1 · Enterprise T-SQL Database Interface</text>
    <text x="68" y="252" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Enterprise Capabilities:</tspan> Full multi-table ACID transactions, stored procedures, functions, views</text>
    <text x="68" y="272" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Concurrency:</tspan> Supports up to 2,048 active user sessions per workspace</text>
    <text x="68" y="292" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Cross-Database Queries:</tspan> Single T-SQL queries combine Lakehouses &amp; Warehouses with zero copies</text>
    <rect x="528" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="554" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 2: workload-isolation -->
  <g data-node-id="workload-isolation" role="group" tabindex="0" aria-label="SELECT / non-SELECT pool split">
    <title data-node-tooltip="true">SELECT / non-SELECT pool split — Compute is split 50/50 into isolated read and ingestion pools by default.</title>
    <rect x="608" y="184" width="536" height="184" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#wh-shadow)"/>
    <rect x="620" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="685" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">RESOURCE ISOLATION</text>
    <text x="620" y="228" font-size="13" font-weight="700" fill="#134E4A">2 · Autonomous 50/50 Resource Pool Split</text>
    <text x="620" y="252" font-size="9.5" fill="#115E59">• <tspan font-weight="700">SELECT Pool (50%):</tspan> Dedicated to BI, dashboards, and user ad-hoc analytical queries</text>
    <text x="620" y="272" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Non-SELECT Pool (50%):</tspan> Dedicated to COPY INTO, ETL batch pipelines, and data ingestion</text>
    <text x="620" y="292" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Zero Starvation:</tspan> Heavy nightly ingestion runs structurally cannot starve interactive business reads</text>
    <rect x="1080" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1106" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: POLARIS DQP, HARDWARE ACCEL & TRAP (NODES 3 TO 5)                 -->
  <!-- ========================================================================= -->
  <rect x="40" y="396" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="406" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="420" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: DISTRIBUTED POLARIS DQP ENGINE &amp; EXECUTION PATHS</text>

  <!-- Node 3: polaris-dqp -->
  <g data-node-id="polaris-dqp" role="group" tabindex="0" aria-label="Polaris distributed engine">
    <title data-node-tooltip="true">Polaris distributed engine — SQL frontend hands the plan to the DQP, which runs it as a task DAG across backend nodes.</title>
    <rect x="56" y="434" width="400" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#wh-shadow)"/>
    <rect x="68" y="444" width="120" height="16" rx="8" fill="#DBEAFE"/><text x="128" y="455" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">DISTRIBUTED DQP</text>
    <text x="68" y="478" font-size="12.5" font-weight="700" fill="#1E3A8A">3 · Polaris Task DAG Engine</text>
    <text x="68" y="500" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Task DAG Compilation:</tspan> Breaks queries into parallel tasks</text>
    <text x="68" y="516" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Online Autoscale:</tspan> Elastic node scaling in seconds</text>
    <text x="68" y="532" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Fault Resilient:</tspan> Redistributes failed tasks to healthy nodes</text>
    <text x="68" y="558" font-size="8.5" font-weight="700" fill="#1D4ED8">Serverless MPP compute topology</text>
    <rect x="392" y="444" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="418" y="454" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 4: gpu-acceleration -->
  <g data-node-id="gpu-acceleration" role="group" tabindex="0" aria-label="GPU-accelerated execution (CoddSpeed)">
    <title data-node-tooltip="true">GPU-accelerated execution (CoddSpeed) — Eligible query fragments transparently route to GPU compute for large gains, no rewrite needed.</title>
    <rect x="470" y="434" width="340" height="184" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#wh-shadow)"/>
    <rect x="482" y="444" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="547" y="455" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">HARDWARE ACCEL</text>
    <text x="482" y="478" font-size="12.5" font-weight="700" fill="#1E3A8A">4 · CoddSpeed GPU Execution</text>
    <text x="482" y="500" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Transparent Routing:</tspan> Relational operators route to GPUs</text>
    <text x="482" y="516" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Order-of-Magnitude Gains:</tspan> Up to ~30x on 1TB TPC-H</text>
    <text x="482" y="532" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Zero Query Changes:</tspan> Requires zero SQL code rewrite</text>
    <text x="482" y="558" font-size="8.5" font-weight="700" fill="#1D4ED8">Tensor Query Processor accelerator</text>
    <rect x="746" y="444" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="772" y="454" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 5: single-node-warning -->
  <g data-node-id="single-node-warning" role="group" tabindex="0" aria-label="Trap: forced single-node execution">
    <title data-node-tooltip="true">Trap: forced single-node execution — TOP, global sorts, and final merges force single-node execution despite the MPP architecture.</title>
    <rect x="824" y="434" width="320" height="184" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6" filter="url(#wh-shadow)"/>
    <rect x="836" y="444" width="160" height="16" rx="8" fill="#FEE2E2"/><text x="916" y="455" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">PERFORMANCE CLIFF TRAP</text>
    <text x="836" y="478" font-size="12.5" font-weight="700" fill="#991B1B">5 · Forced Single-Node Execution</text>
    <text x="836" y="500" font-size="9" fill="#B91C1C">• <tspan font-weight="700">Non-Scalable Ops:</tspan> TOP, global sort, final merges</text>
    <text x="836" y="516" font-size="9" fill="#B91C1C">• <tspan font-weight="700">The Penalty:</tspan> Abandons MPP parallelism to one node</text>
    <text x="836" y="532" font-size="9" fill="#B91C1C">• <tspan font-weight="700">Remedy:</tspan> Use <tspan font-family="monospace" font-size="8">OPTION(FORCE DISTRIBUTED PLAN)</tspan></text>
    <text x="836" y="558" font-size="8.5" font-weight="700" fill="#DC2626">Inspect query insights for warnings</text>
    <rect x="1080" y="444" width="52" height="14" rx="7" fill="#FEE2E2"/><text x="1106" y="454" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">WARNING</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: LAYERED CACHING & ONELAKE DELTA STORAGE (NODES 6 & 7)             -->
  <!-- ========================================================================= -->
  <rect x="40" y="646" width="1120" height="254" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="656" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="670" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 3: TWO-TIER TRANSPARENT CACHING &amp; ONELAKE STORAGE</text>

  <!-- Node 6: memory-ssd-cache -->
  <g data-node-id="memory-ssd-cache" role="group" tabindex="0" aria-label="In-memory + SSD cache">
    <title data-node-tooltip="true">In-memory + SSD cache — A two-tier, transparent cache cuts remote OneLake reads, the dominant query I/O cost.</title>
    <rect x="56" y="684" width="536" height="202" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#wh-shadow)"/>
    <rect x="68" y="694" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="133" y="705" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">TWO-TIER CACHE</text>
    <text x="68" y="728" font-size="13" font-weight="700" fill="#134E4A">6 · Transparent In-Memory &amp; Local SSD Cache</text>
    <text x="68" y="752" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Tier 1 (In-Memory):</tspan> Compressed columnar representation loaded on first access for multi-core scans</text>
    <text x="68" y="772" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Tier 2 (Local NVMe SSD):</tspan> Serialized larger disk tier; fast rehydration on memory eviction</text>
    <text x="68" y="792" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Transactional Consistency:</tspan> DML modifications instantly invalidate cached segments</text>
    <text x="68" y="812" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Cuts Remote I/O:</tspan> Prevents expensive remote lake reads on recurring dashboard queries</text>
    <rect x="528" y="694" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="554" y="704" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 7: onelake-delta-storage -->
  <g data-node-id="onelake-delta-storage" role="group" tabindex="0" aria-label="Delta storage on OneLake">
    <title data-node-tooltip="true">Delta storage on OneLake — Warehouse tables are physically V-Ordered Delta Parquet, auto-published to OneLake.</title>
    <rect x="608" y="684" width="536" height="202" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#wh-shadow)"/>
    <rect x="620" y="694" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="685" y="705" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PHYSICAL STORAGE</text>
    <text x="620" y="728" font-size="13" font-weight="700" fill="#134E4A">7 · Open Delta Parquet Storage on OneLake</text>
    <text x="620" y="752" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Open Delta Lake Format:</tspan> Parquet columnar data files + ACID transaction log</text>
    <text x="620" y="772" font-size="9.5" fill="#115E59">• <tspan font-weight="700">V-Order Write Optimization:</tspan> Enabled by default to accelerate downstream scan speed</text>
    <text x="620" y="792" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Automatic Publishing:</tspan> Seamlessly accessible by Spark, Power BI, and Shortcuts with 0 export jobs</text>
    <text x="620" y="812" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Background Compaction:</tspan> Lock-aware compaction merges small files without blocking user queries</text>
    <rect x="1080" y="694" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1106" y="704" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="938" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Atlas — Original Diagram, August 2026. Sourced from Microsoft Fabric Warehouse &amp; Polaris Architecture.</text>
</svg>
