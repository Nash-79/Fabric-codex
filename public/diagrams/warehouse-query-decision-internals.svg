<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="warehouse-query-decision-internals-title warehouse-query-decision-internals-desc" data-diagram-id="warehouse-query-decision-internals">
  <title id="warehouse-query-decision-internals-title">Warehouse query tuning decision</title>
  <desc id="warehouse-query-decision-internals-desc">Evidence-led decision tree across scan volume, SQL and table layout optimization, concurrency contention management, cache reuse, and iterative measurement.</desc>

  <defs>
    <!-- Header Gradient -->
    <linearGradient id="wqd-head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="wqd-shadow" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.09"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="wqd-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="wqd-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="wqd-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/>
    </marker>

    <!-- Official Microsoft Warehouse Icon Gradients -->
    <linearGradient id="wqd-wh-a" x1="4" x2="28" y1="4" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#0284C7"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
    <linearGradient id="wqd-wh-b" x1="6" x2="26" y1="8" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="960" fill="#F0FDFA"/>

  <!-- Hero Header Banner -->
  <rect width="1200" height="88" fill="url(#wqd-head)"/>
  <g data-official-icon="microsoft" data-icon-name="warehouse_item_32">
    <g transform="translate(1120,24) scale(1.2)">
      <rect x="4" y="4" width="24" height="24" rx="4" fill="url(#wqd-wh-a)"/>
      <path fill="url(#wqd-wh-b)" d="M8 8h16v4H8zm0 6h16v4H8zm0 6h16v4H8z"/>
      <circle cx="11" cy="10" r="1" fill="#FFFFFF"/>
      <circle cx="11" cy="16" r="1" fill="#FFFFFF"/>
      <circle cx="11" cy="22" r="1" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">Fabric Warehouse Query Tuning Decision Matrix</text>
  <text x="40" y="64" font-size="12" fill="#CCFBF1">Scan Volume Assessment ➔ Physical Layout &amp; SQL Tuning ➔ Concurrency &amp; Cache Optimization ➔ Lifecycle Measurement</text>

  <!-- Legend Bar -->
  <g transform="translate(40,102)" font-size="10.5">
    <rect width="1120" height="30" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <circle cx="20" cy="15" r="5" fill="#0D9488"/><text x="32" y="19" fill="#134E4A" font-weight="600">Workload Profiling &amp; Scan Optimization</text>
    <circle cx="360" cy="15" r="5" fill="#2563EB"/><text x="372" y="19" fill="#1E3A8A" font-weight="600">Concurrency Management &amp; Cache Reuse</text>
    <circle cx="720" cy="15" r="5" fill="#DC2626"/><text x="732" y="19" fill="#991B1B" font-weight="600">Representative Verification Warning</text>
    <text x="1100" y="19" text-anchor="end" fill="#8A7A99">Fabric Codex Original</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 1: WORKLOAD PROFILING & SCAN TRIAGE (NODES 1 & 2)                    -->
  <!-- ========================================================================= -->
  <rect x="40" y="146" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
  <rect x="56" y="156" width="410" height="20" rx="10" fill="#F0FDFA"/>
  <text x="66" y="170" font-size="10.5" font-weight="700" fill="#0F766E" letter-spacing="1px">STAGE 1: WORKLOAD PROFILING &amp; SCAN VOLUME TRIAGE</text>

  <!-- Node 1: step-1 -->
  <g data-node-id="step-1" role="group" tabindex="0" aria-label="Query workload">
    <title data-node-tooltip="true">Query workload — A warehouse request arrives with SQL shape, concurrency, and freshness needs.</title>
    <rect x="56" y="184" width="536" height="184" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#wqd-shadow)"/>
    <rect x="68" y="194" width="110" height="16" rx="8" fill="#CCFBF1"/><text x="123" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">STEP 1 · PROFILE</text>
    <text x="68" y="228" font-size="13" font-weight="700" fill="#134E4A">1 · Baseline Query Workload Profiling</text>
    <text x="68" y="252" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Execution Context:</tspan> Capture query plan, compilation time, and runtime duration</text>
    <text x="68" y="272" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Metrics:</tspan> Query insights DMVs (<tspan font-family="monospace" font-size="8.5">queryinsights.exec_requests_history</tspan>)</text>
    <text x="68" y="292" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Workload Shape:</tspan> Distinguish between interactive BI dashboards vs heavy ETL batch</text>
    <rect x="528" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="554" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">FACT</text>
  </g>

  <!-- Node 2: step-2 -->
  <g data-node-id="step-2" role="group" tabindex="0" aria-label="Data scanned is excessive?">
    <title data-node-tooltip="true">Data scanned is excessive? — Poor filtering or layout can make a query read more than its result requires.</title>
    <rect x="608" y="184" width="536" height="184" rx="10" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.6" filter="url(#wqd-shadow)"/>
    <rect x="620" y="194" width="130" height="16" rx="8" fill="#CCFBF1"/><text x="685" y="205" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">STEP 2 · SCAN CHECK</text>
    <text x="620" y="228" font-size="13" font-weight="700" fill="#134E4A">2 · Is Remote Data Scanned Excessive?</text>
    <text x="620" y="252" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Scan vs Output Ratio:</tspan> Check if gigabytes of OneLake data are read for minor outputs</text>
    <text x="620" y="272" font-size="9.5" fill="#115E59">• <tspan font-weight="700">Yes (Excessive):</tspan> Route immediately to physical layout and predicate pruning (Step 3)</text>
    <text x="620" y="292" font-size="9.5" fill="#115E59">• <tspan font-weight="700">No (Bounded):</tspan> Advance to concurrency and caching evaluation (Step 4 &amp; 5)</text>
    <rect x="1080" y="194" width="52" height="14" rx="7" fill="#CCFBF1"/><text x="1106" y="204" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0F766E">PATTERN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 2: REMEDIATION & OPTIMIZATION LEVERS (NODES 3 TO 5)                  -->
  <!-- ========================================================================= -->
  <rect x="40" y="396" width="1120" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.4"/>
  <rect x="56" y="406" width="410" height="20" rx="10" fill="#DBEAFE"/>
  <text x="66" y="420" font-size="10.5" font-weight="700" fill="#1E40AF" letter-spacing="1px">STAGE 2: CORE PERFORMANCE TUNING &amp; CONCURRENCY LEVERS</text>

  <!-- Node 3: step-3 -->
  <g data-node-id="step-3" role="group" tabindex="0" aria-label="Optimize layout and SQL">
    <title data-node-tooltip="true">Optimize layout and SQL — Selective queries, suitable types, statistics, and table organization are core tuning levers.</title>
    <rect x="56" y="434" width="350" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#wqd-shadow)"/>
    <rect x="68" y="444" width="120" height="16" rx="8" fill="#DBEAFE"/><text x="128" y="455" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">LAYOUT &amp; SQL</text>
    <text x="68" y="478" font-size="12.5" font-weight="700" fill="#1E3A8A">3 · Physical Layout &amp; SQL</text>
    <text x="68" y="500" font-size="9" fill="#1E40AF">• <tspan font-weight="700">SARGable Filters:</tspan> Avoid column transforms</text>
    <text x="68" y="516" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Statistics:</tspan> Ensure up-to-date column histograms</text>
    <text x="68" y="532" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Data Clustering:</tspan> Enable file/row-group skipping</text>
    <text x="68" y="558" font-size="8.5" font-weight="700" fill="#1D4ED8">Reduces remote lake scan volume</text>
    <rect x="342" y="444" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="368" y="454" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 4: step-4 -->
  <g data-node-id="step-4" role="group" tabindex="0" aria-label="Concurrency contention?">
    <title data-node-tooltip="true">Concurrency contention? — Workload management can control competing warehouse requests.</title>
    <rect x="422" y="434" width="350" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#wqd-shadow)"/>
    <rect x="434" y="444" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="499" y="455" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">CONCURRENCY</text>
    <text x="434" y="478" font-size="12.5" font-weight="700" fill="#1E3A8A">4 · Manage Concurrency</text>
    <text x="434" y="500" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Workload Pools:</tspan> Isolate SELECT vs ETL traffic</text>
    <text x="434" y="516" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Custom SQL Pools:</tspan> Assign weights &amp; caps</text>
    <text x="434" y="532" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Anti-Starvation:</tspan> Prevents queueing on BI users</text>
    <text x="434" y="558" font-size="8.5" font-weight="700" fill="#1D4ED8">Protects interactive query SLAs</text>
    <rect x="708" y="444" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="734" y="454" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- Node 5: step-5 -->
  <g data-node-id="step-5" role="group" tabindex="0" aria-label="Repeated result pattern?">
    <title data-node-tooltip="true">Repeated result pattern? — Caching can avoid repeating eligible warehouse work.</title>
    <rect x="788" y="434" width="356" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6" filter="url(#wqd-shadow)"/>
    <rect x="800" y="444" width="130" height="16" rx="8" fill="#DBEAFE"/><text x="865" y="455" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">CACHE REUSE</text>
    <text x="800" y="478" font-size="12.5" font-weight="700" fill="#1E3A8A">5 · Cache Reuse Strategy</text>
    <text x="800" y="500" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Result-Set Cache:</tspan> Exact match queries served 0 I/O</text>
    <text x="800" y="516" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Tier 1 &amp; Tier 2 Cache:</tspan> Warm column segment scans</text>
    <text x="800" y="532" font-size="9" fill="#1E40AF">• <tspan font-weight="700">Important:</tspan> Caching cannot repair bad SQL</text>
    <text x="800" y="558" font-size="8.5" font-weight="700" fill="#1D4ED8">Automatic columnar memory rehydration</text>
    <rect x="1080" y="444" width="52" height="14" rx="7" fill="#DBEAFE"/><text x="1106" y="454" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1D4ED8">FACT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LANE 3: ITERATIVE VERIFICATION & BENCHMARKING (NODE 6)                    -->
  <!-- ========================================================================= -->
  <g data-node-id="step-6" role="group" tabindex="0" aria-label="Measure, then revisit">
    <title data-node-tooltip="true">Measure, then revisit — Verify each change under representative data and concurrency.</title>
    <rect x="40" y="646" width="1120" height="254" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6" filter="url(#wqd-shadow)"/>
    <rect x="56" y="656" width="410" height="20" rx="10" fill="#FEE2E2"/>
    <text x="66" y="670" font-size="10.5" font-weight="700" fill="#DC2626" letter-spacing="1px">STAGE 3: REPRESENTATIVE LIFECYCLE MEASUREMENT &amp; VALIDATION</text>
    <text x="56" y="704" font-size="14" font-weight="700" fill="#991B1B">6 · Trap: Relying on Anecdotal Warm-Cache Runs Instead of Representative Testing</text>
    <text x="56" y="730" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">The Risk:</tspan> Testing a query once after a warm-up run gives a false sense of security; production runs on cold data or under concurrent ETL will regress</text>
    <text x="56" y="752" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Verification Protocol:</tspan> Check <tspan font-family="monospace" font-size="8.5">data_scanned_remote_storage_mb</tspan> in DMVs to differentiate true scan reductions from memory cache hits</text>
    <text x="56" y="774" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Concurrency Testing:</tspan> Execute benchmark runs during active ETL windows to validate that workload group ceilings prevent dashboard queueing</text>
    <text x="56" y="796" font-size="9.5" fill="#B91C1C">• <tspan font-weight="700">Iterative Tuning:</tspan> If bottleneck persists, loop back to Step 2 to check for non-SARGable operators or data clustering misalignment</text>
    <rect x="1080" y="656" width="52" height="16" rx="8" fill="#FEE2E2"/><text x="1106" y="668" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">WARNING</text>
  </g>

  <!-- Footer Provenance Note -->
  <text x="1140" y="938" text-anchor="end" font-size="9.5" fill="#8A7A99">Fabric Codex — Original Diagram, August 2026. Sourced from Microsoft Fabric Warehouse Performance Guidelines.</text>
</svg>
