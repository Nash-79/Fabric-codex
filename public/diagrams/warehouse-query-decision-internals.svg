<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07.
       Decision/internals diagram, distinct from warehouse-architecture.svg (which is a top-down
       architecture flow). This one is a query-lifecycle DECISION TREE (three branch points a
       query/write can hit) plus a cache-tier internals cutaway explaining WHY each branch behaves
       the way it does. Grounded in warehouse capability claims: MPP single-node fallback, cold
       start / cache tiers, trickle-DML antipattern, V-Order/clustering, compaction, LRU eviction. -->

  <defs>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5E50"/>
      <stop offset="1" stop-color="#2AAC94"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A2A2A"/>
      <stop offset="1" stop-color="#C25454"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25FFD4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2AAC94" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ssdGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AAC94" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#117865" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B23B3B"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#063D3B"/>
    </marker>
  </defs>

  <rect width="1180" height="900" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="42" font-size="22" font-weight="650" fill="#063D3B">Fabric Data Warehouse — query &amp; write decision internals</text>
  <text x="40" y="64" font-size="12" fill="#616161">Three branch points every query/write hits, and the cache-tier mechanics that explain each outcome</text>

  <!-- ═══════════════════════════════════════════════════
       DECISION 1 — cold vs warm cache
  ═══════════════════════════════════════════════════ -->
  <text x="40" y="96" font-size="11" letter-spacing="1.5" fill="#8A8886">DECISION 1 · IS THE TOUCHED DATA ALREADY CACHED?</text>

  <!-- start node -->
  <g transform="translate(40,108)">
    <rect width="150" height="46" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="75" y="21" text-anchor="middle" font-size="11.5" font-weight="600" fill="#063D3B">Query submitted</text>
    <text x="75" y="37" text-anchor="middle" font-size="9.5" fill="#3F6259">T-SQL statement runs</text>
  </g>
  <line x1="190" y1="131" x2="222" y2="131" stroke="#117865" stroke-width="1.8" marker-end="url(#arrInk)"/>

  <!-- decision diamond -->
  <g transform="translate(224,96)">
    <polygon points="80,0 160,46 80,92 0,46" fill="#FFFFFF" stroke="#117865" stroke-width="1.8"/>
    <text x="80" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Data already</text>
    <text x="80" y="56" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">in cache?</text>
  </g>

  <!-- warm branch -->
  <line x1="304" y1="118" x2="360" y2="70" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="316" y="88" font-size="10" font-weight="600" fill="#117865">yes</text>
  <g transform="translate(362,30)">
    <rect width="270" height="72" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#063D3B">Warm path</text>
    <text x="14" y="39" font-size="10" fill="#3F6259">Served from in-memory (Tier 1) or SSD (Tier 2)</text>
    <text x="14" y="53" font-size="10" fill="#3F6259">data_scanned_remote_storage_mb = 0 in</text>
    <text x="14" y="66" font-size="10" fill="#3F6259">queryinsights.exec_requests_history</text>
  </g>

  <!-- cold branch -->
  <line x1="304" y1="174" x2="360" y2="222" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="312" y="212" font-size="10" font-weight="600" fill="#8A2A2A">no</text>
  <g transform="translate(362,186)">
    <rect width="270" height="90" rx="8" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#5C1F1F">Cold-start path</text>
    <text x="14" y="39" font-size="10" fill="#7A2E2E">Fetch from OneLake remote storage; may also need</text>
    <text x="14" y="53" font-size="10" fill="#7A2E2E">to generate statistics and resume paused nodes</text>
    <text x="14" y="67" font-size="10" fill="#7A2E2E">(node resume/creation typically &lt; 1 second)</text>
    <text x="14" y="81" font-size="9.5" fill="#B23B3B" font-style="italic">Can be partial — some nodes/data already warm</text>
  </g>

  <!-- both feed into transcode -->
  <line x1="497" y1="102" x2="497" y2="186" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="655" y="140" font-size="9.5" fill="#8A8886" font-style="italic">Never benchmark off a cold first run — rerun after warm-up.</text>

  <!-- ═══════════════════════════════════════════════════
       CACHE INTERNALS CUTAWAY (right side, rows 1-2)
  ═══════════════════════════════════════════════════ -->
  <g transform="translate(680,96)">
    <rect width="460" height="180" rx="10" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="18" y="24" font-size="12.5" font-weight="600" fill="#063D3B">Cache-tier internals (why warm is fast)</text>

    <!-- mem tier -->
    <rect x="18" y="36" width="424" height="52" rx="6" fill="url(#memGrad)" stroke="#25FFD4" stroke-width="1.5"/>
    <text x="30" y="55" font-size="10.5" font-weight="600" fill="#063D3B">Tier 1 — in-memory columnar cache</text>
    <text x="30" y="71" font-size="9.5" fill="#3F6259">Transcoded from file format on first access · column values stored together for</text>
    <text x="30" y="83" font-size="9.5" fill="#3F6259">compression &amp; multi-core parallel scan/filter/aggregate</text>

    <!-- ssd tier -->
    <rect x="18" y="94" width="424" height="52" rx="6" fill="url(#ssdGrad)" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="30" y="113" font-size="10.5" font-weight="600" fill="#063D3B">Tier 2 — local SSD disk cache</text>
    <text x="30" y="129" font-size="9.5" fill="#3F6259">Everything loaded into memory is also serialized here; larger overflow tier —</text>
    <text x="30" y="141" font-size="9.5" fill="#3F6259">rehydrating memory from SSD beats a remote OneLake fetch</text>

    <text x="18" y="163" font-size="9.5" fill="#616161">Eviction: recency-based (LRU) once capacity is hit · fully transparent, always-on, no user config ·</text>
    <text x="18" y="176" font-size="9.5" fill="#616161">DML after caching stays consistent · distinct from separate result-set cache (caches final results, not scanned data)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       DECISION 2 — MPP scale-out vs single-node
  ═══════════════════════════════════════════════════ -->
  <line x1="40" y1="300" x2="1140" y2="300" stroke="#E1DFDD" stroke-width="1"/>
  <text x="40" y="322" font-size="11" letter-spacing="1.5" fill="#8A8886">DECISION 2 · DOES THE QUERY SHAPE ALLOW DISTRIBUTED (MPP) EXECUTION?</text>

  <g transform="translate(40,334)">
    <rect width="150" height="46" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="75" y="21" text-anchor="middle" font-size="11.5" font-weight="600" fill="#063D3B">DQP builds plan</text>
    <text x="75" y="37" text-anchor="middle" font-size="9.5" fill="#3F6259">Cascades optimizer</text>
  </g>
  <line x1="190" y1="357" x2="222" y2="357" stroke="#117865" stroke-width="1.8" marker-end="url(#arrInk)"/>

  <g transform="translate(224,322)">
    <polygon points="90,0 180,46 90,92 0,46" fill="#FFFFFF" stroke="#117865" stroke-width="1.8"/>
    <text x="90" y="38" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">TOP / global sort /</text>
    <text x="90" y="52" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">final merge required?</text>
  </g>

  <!-- distributed branch -->
  <line x1="324" y1="344" x2="380" y2="296" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="336" y="314" font-size="10" font-weight="600" fill="#117865">no</text>
  <g transform="translate(382,258)">
    <rect width="280" height="60" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#063D3B">Distributed (MPP) execution</text>
    <text x="14" y="39" font-size="10" fill="#3F6259">Task DAG fans out across compute nodes;</text>
    <text x="14" y="53" font-size="10" fill="#3F6259">hash-redistribute / broadcast as needed</text>
  </g>

  <!-- single node branch -->
  <line x1="324" y1="400" x2="380" y2="440" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="336" y="428" font-size="10" font-weight="600" fill="#8A2A2A">yes</text>
  <g transform="translate(382,412)">
    <rect width="280" height="76" rx="8" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#5C1F1F">Forced single-node execution</text>
    <text x="14" y="39" font-size="10" fill="#7A2E2E">Plan logs a "non-scalable operation" warning</text>
    <text x="14" y="53" font-size="10" fill="#7A2E2E">Mitigate: shrink the filtered set first, or apply</text>
    <text x="14" y="67" font-size="10" fill="#7A2E2E" font-weight="600">OPTION (FORCE DISTRIBUTED PLAN)</text>
  </g>

  <!-- workload pool note -->
  <g transform="translate(700,412)">
    <rect width="440" height="76" rx="8" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="16" y="22" font-size="11.5" font-weight="600" fill="#063D3B">Either branch draws from the SELECT pool</text>
    <text x="16" y="39" font-size="10" fill="#616161">Default 50/50 split: SELECT pool vs non-SELECT (ETL/ingest) pool —</text>
    <text x="16" y="53" font-size="10" fill="#616161">each scales independently, neither exceeds 50% of capacity, so</text>
    <text x="16" y="67" font-size="10" fill="#616161">ingestion cannot starve reads (admins may define custom pools)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       DECISION 3 — write pattern (trickle vs batch)
  ═══════════════════════════════════════════════════ -->
  <line x1="40" y1="518" x2="1140" y2="518" stroke="#E1DFDD" stroke-width="1"/>
  <text x="40" y="540" font-size="11" letter-spacing="1.5" fill="#8A8886">DECISION 3 · IS THE WRITE PATTERN BATCHED OR TRICKLE (ROW-BY-ROW)?</text>

  <g transform="translate(40,552)">
    <rect width="150" height="46" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="75" y="21" text-anchor="middle" font-size="11.5" font-weight="600" fill="#063D3B">INSERT/UPDATE/</text>
    <text x="75" y="37" text-anchor="middle" font-size="9.5" fill="#3F6259">DELETE issued</text>
  </g>
  <line x1="190" y1="575" x2="222" y2="575" stroke="#117865" stroke-width="1.8" marker-end="url(#arrInk)"/>

  <g transform="translate(224,540)">
    <polygon points="80,0 160,46 80,92 0,46" fill="#FFFFFF" stroke="#117865" stroke-width="1.8"/>
    <text x="80" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Batched</text>
    <text x="80" y="56" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">write?</text>
  </g>

  <!-- batched branch (good) -->
  <line x1="304" y1="562" x2="360" y2="514" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="316" y="532" font-size="10" font-weight="600" fill="#117865">yes</text>
  <g transform="translate(362,472)">
    <rect width="300" height="78" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#063D3B">Healthy write pattern</text>
    <text x="14" y="39" font-size="10" fill="#3F6259">Fewer, larger Parquet files with well-formed row</text>
    <text x="14" y="53" font-size="10" fill="#3F6259">groups; COPY INTO sources ideally 100 MB–1 GB,</text>
    <text x="14" y="67" font-size="10" fill="#3F6259">many files in parallel, across different target tables</text>
  </g>

  <!-- trickle branch (bad) -->
  <line x1="304" y1="618" x2="360" y2="660" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="312" y="650" font-size="10" font-weight="600" fill="#8A2A2A">no</text>
  <g transform="translate(362,626)">
    <rect width="300" height="92" rx="8" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#5C1F1F">Trickle-DML antipattern</text>
    <text x="14" y="39" font-size="10" fill="#7A2E2E">Each small write → new Parquet file → fragmented</text>
    <text x="14" y="53" font-size="10" fill="#7A2E2E">row groups → slower scans, higher cost, heavier</text>
    <text x="14" y="67" font-size="10" fill="#7A2E2E">reliance on background compaction to repair</text>
    <text x="14" y="81" font-size="9.5" fill="#B23B3B" font-weight="600">Fix: batch the writes instead</text>
  </g>

  <!-- background compaction service note -->
  <g transform="translate(700,554)">
    <rect width="440" height="164" rx="8" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="16" y="24" font-size="12" font-weight="600" fill="#063D3B">What repairs a fragmented table over time</text>
    <text x="16" y="43" font-size="10" fill="#424242">Background compaction service merges small Parquet files</text>
    <text x="16" y="57" font-size="10" fill="#424242">and removes logically deleted rows automatically.</text>
    <text x="16" y="76" font-size="10" fill="#424242">Since Oct 2025, compaction preemption checks for shared</text>
    <text x="16" y="90" font-size="10" fill="#424242">locks from user queries and waits/aborts rather than commit</text>
    <text x="16" y="104" font-size="10" fill="#424242">a conflicting write — though write-write conflicts with</text>
    <text x="16" y="118" font-size="10" fill="#424242">explicit user transactions remain possible.</text>
    <text x="16" y="137" font-size="10" fill="#424242">V-Order (default on) sorts/compresses at write time; once</text>
    <text x="16" y="151" font-size="10" fill="#424242">disabled on a warehouse it cannot be re-enabled — a staging</text>
    <text x="16" y="165" font-size="9.5" fill="#797775" font-style="italic">warehouse with V-Order off is a common feed pattern.</text>
  </g>

  <!-- clustering side-note under decision 3 -->
  <g transform="translate(40,730)">
    <rect width="622" height="60" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="16" y="22" font-size="11.5" font-weight="600" fill="#063D3B">File-skip lever: T-SQL data clustering</text>
    <text x="16" y="39" font-size="10" fill="#3F6259">Orders rows on a space-filling curve at ingestion; clustering metadata in the manifest lets the</text>
    <text x="16" y="53" font-size="10" fill="#3F6259">engine skip whole files/row groups outside a filter's range — benefit grows with table size.</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════════ -->
  <g transform="translate(700,730)">
    <rect width="440" height="140" rx="10" fill="#FFFFFF" stroke="#C8C6C4"/>
    <text x="18" y="22" font-size="12" font-weight="600" fill="#063D3B">Legend</text>

    <polygon points="30,34 50,44 30,54 10,44" fill="#FFFFFF" stroke="#117865" stroke-width="1.4" transform="translate(0,0)"/>
    <text x="60" y="48" font-size="10" fill="#424242">Decision point (branches every query/write hits)</text>

    <rect x="10" y="66" width="22" height="14" rx="3" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.4"/>
    <text x="42" y="77" font-size="10" fill="#424242">Favorable / fast path (warm, distributed, batched)</text>

    <rect x="10" y="90" width="22" height="14" rx="3" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.4"/>
    <text x="42" y="101" font-size="10" fill="#424242">Costly / degraded path (cold, single-node, trickle)</text>

    <rect x="10" y="114" width="22" height="14" rx="3" fill="url(#memGrad)" stroke="#25FFD4" stroke-width="1.4"/>
    <text x="42" y="125" font-size="10" fill="#424242">Cache-tier internals panel (mechanism, not a decision)</text>
  </g>

  <!-- footer -->
  <text x="1140" y="890" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset; palette from the official Fabric icon.</text>
</svg>
