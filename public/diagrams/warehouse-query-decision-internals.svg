<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1020" font-family="Segoe UI, -apple-system, sans-serif" role="img" aria-labelledby="warehouse-query-decision-internals-title warehouse-query-decision-internals-desc" data-diagram-id="warehouse-query-decision-internals">
  <title id="warehouse-query-decision-internals-title">Warehouse query tuning decision</title>
  <desc id="warehouse-query-decision-internals-desc">Warehouse query tuning decision. Query workload; Data scanned is excessive?; Optimize layout and SQL; Concurrency contention?; Repeated result pattern?; Measure, then revisit.</desc>
  <!-- Fabric Atlas — ORIGINAL diagram (not a Microsoft asset). Authored 2026-07, revised 2026-07 for
       layout (title/box collision at DECISION 1, section dividers overlapping branch boxes at
       DECISION 2 and DECISION 3 — full vertical-band rebuild, one section per row of the grid).
       Decision/internals diagram, distinct from warehouse-architecture.svg (which is a top-down
       architecture flow). This one is a query-lifecycle DECISION TREE (three branch points a
       query/write can hit) plus a cache-tier internals cutaway explaining WHY each branch behaves
       the way it does. Grounded in warehouse capability claims: MPP single-node fallback, cold
       start / cache tiers, trickle-DML antipattern, V-Order/clustering, compaction, LRU eviction. -->

  <defs>
    <linearGradient id="memGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25FFD4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2AAC94" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ssdGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AAC94" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#117865" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2AAC94"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B23B3B"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#063D3B"/>
    </marker>
  </defs>

  <rect width="1180" height="1020" fill="#FFFFFF"/>

  <!-- header band -->
  <rect width="1180" height="70" fill="#EAF7F2"/>
  <text x="40" y="34" font-size="21" font-weight="650" fill="#063D3B">Fabric Data Warehouse — query &amp; write decision internals</text>
  <text x="40" y="54" font-size="12" fill="#3F6259">Three branch points every query/write hits, and the cache-tier mechanics that explain each outcome</text>

  <!-- ═══════════════════════════════════════════════════
       DECISION 1 BAND — y 90 to 320 — cold vs warm cache
  ═══════════════════════════════════════════════════ -->
  <text x="40" y="106" font-size="11" letter-spacing="1.5" fill="#8A8886">DECISION 1 · IS THE TOUCHED DATA ALREADY CACHED?</text>

  <!-- start node -->
  <g transform="translate(40,150)">
    <rect width="150" height="46" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="75" y="21" text-anchor="middle" font-size="11.5" font-weight="600" fill="#063D3B">Query submitted</text>
    <text x="75" y="37" text-anchor="middle" font-size="9.5" fill="#3F6259">T-SQL statement runs</text>
  </g>
  <line x1="190" y1="173" x2="222" y2="173" stroke="#117865" stroke-width="1.8" marker-end="url(#arrInk)"/>

  <!-- decision diamond -->
  <g transform="translate(224,138)">
    <polygon points="80,0 160,46 80,92 0,46" fill="#FFFFFF" stroke="#117865" stroke-width="1.8"/>
    <text x="80" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Data already</text>
    <text x="80" y="56" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">in cache?</text>
  </g>

  <!-- warm branch -->
  <line x1="304" y1="160" x2="360" y2="132" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="316" y="142" font-size="10" font-weight="600" fill="#117865">yes</text>
  <g transform="translate(362,92)">
    <rect width="270" height="72" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#063D3B">Warm path</text>
    <text x="14" y="39" font-size="10" fill="#3F6259">Served from in-memory (Tier 1) or SSD (Tier 2)</text>
    <text x="14" y="53" font-size="10" fill="#3F6259">data_scanned_remote_storage_mb = 0 in</text>
    <text x="14" y="66" font-size="10" fill="#3F6259">queryinsights.exec_requests_history</text>
  </g>

  <!-- cold branch -->
  <line x1="304" y1="216" x2="360" y2="262" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="312" y="252" font-size="10" font-weight="600" fill="#8A2A2A">no</text>
  <g transform="translate(362,228)">
    <rect width="270" height="90" rx="8" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#5C1F1F">Cold-start path</text>
    <text x="14" y="39" font-size="10" fill="#7A2E2E">Fetch from OneLake remote storage; may also need</text>
    <text x="14" y="53" font-size="10" fill="#7A2E2E">to generate statistics and resume paused nodes</text>
    <text x="14" y="67" font-size="10" fill="#7A2E2E">(node resume/creation typically &lt; 1 second)</text>
    <text x="14" y="81" font-size="9.5" fill="#B23B3B" font-style="italic">Can be partial — some nodes/data already warm</text>
  </g>

  <!-- both feed into transcode -->
  <line x1="497" y1="164" x2="497" y2="228" stroke="#8A8886" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="509" y="199" font-size="9.5" fill="#8A8886" font-style="italic">Never benchmark off a cold first run —</text>
  <text x="509" y="212" font-size="9.5" fill="#8A8886" font-style="italic">rerun after warm-up.</text>

  <!-- CACHE INTERNALS CUTAWAY (right side) -->
  <g transform="translate(680,134)">
    <rect width="460" height="184" rx="10" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="18" y="24" font-size="12.5" font-weight="600" fill="#063D3B">Cache-tier internals (why warm is fast)</text>

    <rect x="18" y="36" width="424" height="52" rx="6" fill="url(#memGrad)" stroke="#25FFD4" stroke-width="1.5"/>
    <text x="30" y="55" font-size="10.5" font-weight="600" fill="#063D3B">Tier 1 — in-memory columnar cache</text>
    <text x="30" y="71" font-size="9.5" fill="#3F6259">Transcoded from file format on first access · column values stored together for</text>
    <text x="30" y="83" font-size="9.5" fill="#3F6259">compression &amp; multi-core parallel scan/filter/aggregate</text>

    <rect x="18" y="96" width="424" height="52" rx="6" fill="url(#ssdGrad)" stroke="#2AAC94" stroke-width="1.5"/>
    <text x="30" y="115" font-size="10.5" font-weight="600" fill="#063D3B">Tier 2 — local SSD disk cache</text>
    <text x="30" y="131" font-size="9.5" fill="#3F6259">Everything loaded into memory is also serialized here; larger overflow tier —</text>
    <text x="30" y="143" font-size="9.5" fill="#3F6259">rehydrating memory from SSD beats a remote OneLake fetch</text>

    <text x="18" y="165" font-size="9.5" fill="#616161">Eviction: recency-based (LRU) once capacity is hit · fully transparent, always-on, no user config ·</text>
    <text x="18" y="178" font-size="9.5" fill="#616161">DML after caching stays consistent · distinct from result-set cache (caches final results, not scanned data)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       DECISION 2 BAND — y 350 to 590 — MPP vs single-node
  ═══════════════════════════════════════════════════ -->
  <line x1="40" y1="350" x2="1140" y2="350" stroke="#E1DFDD" stroke-width="1"/>
  <text x="40" y="372" font-size="11" letter-spacing="1.5" fill="#8A8886">DECISION 2 · DOES THE QUERY SHAPE ALLOW DISTRIBUTED (MPP) EXECUTION?</text>

  <g transform="translate(40,420)">
    <rect width="150" height="46" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="75" y="21" text-anchor="middle" font-size="11.5" font-weight="600" fill="#063D3B">DQP builds plan</text>
    <text x="75" y="37" text-anchor="middle" font-size="9.5" fill="#3F6259">Cascades optimizer</text>
  </g>
  <line x1="190" y1="443" x2="222" y2="443" stroke="#117865" stroke-width="1.8" marker-end="url(#arrInk)"/>

  <g transform="translate(224,408)">
    <polygon points="90,0 180,46 90,92 0,46" fill="#FFFFFF" stroke="#117865" stroke-width="1.8"/>
    <text x="90" y="38" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">TOP / global sort /</text>
    <text x="90" y="52" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">final merge required?</text>
  </g>

  <!-- distributed branch -->
  <line x1="324" y1="430" x2="380" y2="398" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="336" y="410" font-size="10" font-weight="600" fill="#117865">no</text>
  <g transform="translate(382,362)">
    <rect width="280" height="60" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#063D3B">Distributed (MPP) execution</text>
    <text x="14" y="39" font-size="10" fill="#3F6259">Task DAG fans out across compute nodes;</text>
    <text x="14" y="53" font-size="10" fill="#3F6259">hash-redistribute / broadcast as needed</text>
  </g>

  <!-- single node branch -->
  <line x1="324" y1="486" x2="380" y2="524" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="336" y="514" font-size="10" font-weight="600" fill="#8A2A2A">yes</text>
  <g transform="translate(382,508)">
    <rect width="280" height="76" rx="8" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#5C1F1F">Forced single-node execution</text>
    <text x="14" y="39" font-size="10" fill="#7A2E2E">Plan logs a "non-scalable operation" warning</text>
    <text x="14" y="53" font-size="10" fill="#7A2E2E">Mitigate: shrink the filtered set first, or apply</text>
    <text x="14" y="67" font-size="10" fill="#7A2E2E" font-weight="600">OPTION (FORCE DISTRIBUTED PLAN)</text>
  </g>

  <!-- workload pool note -->
  <g transform="translate(700,398)">
    <rect width="440" height="128" rx="8" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="16" y="24" font-size="11.5" font-weight="600" fill="#063D3B">Either branch draws from the SELECT pool</text>
    <text x="16" y="45" font-size="10" fill="#616161">Default 50/50 split: SELECT pool vs non-SELECT</text>
    <text x="16" y="61" font-size="10" fill="#616161">(ETL/ingest) pool — each scales independently,</text>
    <text x="16" y="77" font-size="10" fill="#616161">neither exceeds 50% of capacity, so ingestion</text>
    <text x="16" y="93" font-size="10" fill="#616161">cannot starve reads (admins may define custom pools)</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       DECISION 3 BAND — y 620 to 870 — trickle vs batch
  ═══════════════════════════════════════════════════ -->
  <line x1="40" y1="620" x2="1140" y2="620" stroke="#E1DFDD" stroke-width="1"/>
  <text x="40" y="642" font-size="11" letter-spacing="1.5" fill="#8A8886">DECISION 3 · IS THE WRITE PATTERN BATCHED OR TRICKLE (ROW-BY-ROW)?</text>

  <g transform="translate(40,690)">
    <rect width="150" height="46" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="75" y="21" text-anchor="middle" font-size="11.5" font-weight="600" fill="#063D3B">INSERT/UPDATE/</text>
    <text x="75" y="37" text-anchor="middle" font-size="9.5" fill="#3F6259">DELETE issued</text>
  </g>
  <line x1="190" y1="713" x2="222" y2="713" stroke="#117865" stroke-width="1.8" marker-end="url(#arrInk)"/>

  <g transform="translate(224,678)">
    <polygon points="80,0 160,46 80,92 0,46" fill="#FFFFFF" stroke="#117865" stroke-width="1.8"/>
    <text x="80" y="42" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">Batched</text>
    <text x="80" y="56" text-anchor="middle" font-size="10.5" font-weight="600" fill="#063D3B">write?</text>
  </g>

  <!-- batched branch (good) -->
  <line x1="304" y1="700" x2="360" y2="668" stroke="#2AAC94" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="316" y="680" font-size="10" font-weight="600" fill="#117865">yes</text>
  <g transform="translate(362,632)">
    <rect width="300" height="78" rx="8" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#063D3B">Healthy write pattern</text>
    <text x="14" y="39" font-size="10" fill="#3F6259">Fewer, larger Parquet files with well-formed row</text>
    <text x="14" y="53" font-size="10" fill="#3F6259">groups; COPY INTO sources ideally 100 MB–1 GB,</text>
    <text x="14" y="67" font-size="10" fill="#3F6259">many files in parallel, across different target tables</text>
  </g>

  <!-- trickle branch (bad) -->
  <line x1="304" y1="756" x2="360" y2="794" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="312" y="784" font-size="10" font-weight="600" fill="#8A2A2A">no</text>
  <g transform="translate(362,760)">
    <rect width="300" height="92" rx="8" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.6"/>
    <text x="14" y="22" font-size="12" font-weight="600" fill="#5C1F1F">Trickle-DML antipattern</text>
    <text x="14" y="39" font-size="10" fill="#7A2E2E">Each small write → new Parquet file → fragmented</text>
    <text x="14" y="53" font-size="10" fill="#7A2E2E">row groups → slower scans, higher cost, heavier</text>
    <text x="14" y="67" font-size="10" fill="#7A2E2E">reliance on background compaction to repair</text>
    <text x="14" y="81" font-size="9.5" fill="#B23B3B" font-weight="600">Fix: batch the writes instead</text>
  </g>

  <!-- background compaction service note -->
  <g transform="translate(700,668)">
    <rect width="440" height="184" rx="8" fill="#FAFAFA" stroke="#E1DFDD"/>
    <text x="16" y="24" font-size="12" font-weight="600" fill="#063D3B">What repairs a fragmented table over time</text>
    <text x="16" y="43" font-size="10" fill="#424242">Background compaction service merges small Parquet files</text>
    <text x="16" y="57" font-size="10" fill="#424242">and removes logically deleted rows automatically.</text>
    <text x="16" y="76" font-size="10" fill="#424242">Since Oct 2025, compaction preemption checks for shared</text>
    <text x="16" y="90" font-size="10" fill="#424242">locks from user queries and waits/aborts rather than commit</text>
    <text x="16" y="104" font-size="10" fill="#424242">a conflicting write — though write-write conflicts with</text>
    <text x="16" y="118" font-size="10" fill="#424242">explicit user transactions remain possible.</text>
    <text x="16" y="137" font-size="10" fill="#424242">V-Order (default on) sorts/compresses at write time; once</text>
    <text x="16" y="151" font-size="10" fill="#424242">disabled on a warehouse it cannot be re-enabled — a staging</text>
    <text x="16" y="165" font-size="9.5" fill="#797775" font-style="italic">warehouse with V-Order off is a common feed pattern.</text>
  </g>

  <!-- clustering side-note under decision 3 -->
  <g transform="translate(40,864)">
    <rect width="622" height="60" rx="8" fill="#EAF7F2" stroke="#9AD2C5"/>
    <text x="16" y="22" font-size="11.5" font-weight="600" fill="#063D3B">File-skip lever: T-SQL data clustering</text>
    <text x="16" y="39" font-size="10" fill="#3F6259">Orders rows on a space-filling curve at ingestion; clustering metadata in the manifest lets the</text>
    <text x="16" y="53" font-size="10" fill="#3F6259">engine skip whole files/row groups outside a filter's range — benefit grows with table size.</text>
  </g>

  <!-- ═══════════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════════ -->
  <g transform="translate(700,864)">
    <rect width="440" height="60" rx="10" fill="#FFFFFF" stroke="#C8C6C4"/>
    <polygon points="24,20 40,28 24,36 8,28" fill="#FFFFFF" stroke="#117865" stroke-width="1.4"/>
    <text x="50" y="32" font-size="9.5" fill="#424242">Decision point</text>
    <rect x="140" y="20" width="18" height="14" rx="3" fill="#EAF7F2" stroke="#2AAC94" stroke-width="1.4"/>
    <text x="164" y="31" font-size="9.5" fill="#424242">Favorable / fast path</text>
    <rect x="300" y="20" width="18" height="14" rx="3" fill="#FBEEEE" stroke="#B23B3B" stroke-width="1.4"/>
    <text x="324" y="31" font-size="9.5" fill="#424242">Costly / degraded path</text>
    <text x="16" y="52" font-size="9" fill="#8A8886">Teal cache-tier panel = mechanism, not a decision.</text>
  </g>

  <!-- footer -->
  <text x="1140" y="1008" text-anchor="end" font-size="9.5" fill="#8A8886">Fabric Atlas — original diagram, July 2026. Not a Microsoft asset; palette from the official Fabric icon.</text>

  <!-- Full-region keyboard and pointer targets; metadata comes from the evidence sidecar. -->
  <g data-node-id="step-1" role="group" tabindex="0" aria-label="Query workload">
    <title data-node-tooltip="true">Query workload — A warehouse request arrives with SQL shape, concurrency, and freshness needs.</title>
    <rect x="6.0" y="352.0" width="377.6" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-2" role="group" tabindex="0" aria-label="Data scanned is excessive?">
    <title data-node-tooltip="true">Data scanned is excessive? — Poor filtering or layout can make a query read more than its result requires.</title>
    <rect x="6.0" y="159.5" width="377.6" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-3" role="group" tabindex="0" aria-label="Optimize layout and SQL">
    <title data-node-tooltip="true">Optimize layout and SQL — Selective queries, suitable types, statistics, and table organization are core tuning levers.</title>
    <rect x="6.0" y="55.0" width="239.2" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-4" role="group" tabindex="0" aria-label="Concurrency contention?">
    <title data-node-tooltip="true">Concurrency contention? — Workload management can control competing warehouse requests.</title>
    <rect x="6.0" y="55.0" width="182.0" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-5" role="group" tabindex="0" aria-label="Repeated result pattern?">
    <title data-node-tooltip="true">Repeated result pattern? — Caching can avoid repeating eligible warehouse work.</title>
    <rect x="6.0" y="159.5" width="377.6" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
  <g data-node-id="step-6" role="group" tabindex="0" aria-label="Measure, then revisit">
    <title data-node-tooltip="true">Measure, then revisit — Verify each change under representative data and concurrency.</title>
    <rect x="6.0" y="55.0" width="377.6" height="34.0" rx="6.0" fill="#FFFFFF" fill-opacity="0.001" stroke="none"/>
  </g>
</svg>
